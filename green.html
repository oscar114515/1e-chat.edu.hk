<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>綠紙產生器 · Homework Detention Notice</title>
<style>
  :root{
    --ink:#000;
    --paper:#cffbd1;
    /* 校正用：文字上緣到 CSS top 的偏移（mm），由實測推導 */
    --shift9: 0.56mm;
    --shift115: 0.36mm;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
    background:#16181d;color:#e6e8ec;display:flex;height:100vh;overflow:hidden;
  }

  /* ---------- 左側表單 ---------- */
  .panel{
    width:340px;flex:0 0 340px;height:100%;overflow-y:auto;
    background:#1c1f26;border-right:1px solid #2b2f38;padding:18px 16px 40px;
  }
  .panel h1{font-size:15px;margin:0 0 2px;letter-spacing:.3px}
  .panel .sub{font-size:11px;color:#7d8492;margin-bottom:16px}
  .grp{margin-bottom:13px}
  .grp>label{display:block;font-size:11px;color:#959cad;margin-bottom:4px;letter-spacing:.2px}
  .row2{display:flex;gap:8px}
  .row2>*{flex:1;min-width:0}
  input,select,button{font-family:inherit;font-size:13px}
  input[type=text],input[type=date],select{
    width:100%;padding:7px 9px;border-radius:6px;border:1px solid #333945;
    background:#12141a;color:#e6e8ec;outline:none;
  }
  input[type=text]:focus,input[type=date]:focus,select:focus{border-color:#4c8bf5}
  .hint{font-size:10.5px;color:#69707f;margin-top:4px;line-height:1.5}
  .sec{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#5f6674;
       margin:20px 0 8px;border-top:1px solid #2b2f38;padding-top:12px}
  .hw{border:1px solid #2b2f38;border-radius:8px;padding:9px;margin-bottom:8px;background:#171a21}
  .hw .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .hw .hd span{font-size:10.5px;color:#7d8492}
  .del{border:0;background:#2a2026;color:#e2727b;font-size:11px;padding:2px 7px;border-radius:4px;cursor:pointer}
  .del:hover{background:#3a2028}
  .hw input{margin-bottom:5px}
  .warn{font-size:11px;color:#f0b429;background:#2a2314;border:1px solid #4a3c17;
        border-radius:6px;padding:7px 9px;margin:-6px 0 14px;line-height:1.5}
  .btns{display:flex;gap:8px;margin-top:16px}
  button.primary{flex:1;padding:9px;border:0;border-radius:6px;background:#2f6fed;color:#fff;font-weight:600;cursor:pointer}
  button.primary:hover{background:#3d7bf7}
  button.ghost{padding:9px 12px;border:1px solid #333945;border-radius:6px;background:transparent;color:#aeb4c1;cursor:pointer}
  button.ghost:hover{border-color:#4c8bf5;color:#fff}
  button.add{width:100%;padding:7px;border:1px dashed #3a414f;border-radius:6px;background:transparent;color:#8a92a2;cursor:pointer}
  button.add:hover{border-color:#4c8bf5;color:#fff}

  /* ---------- 右側預覽 ---------- */
  .stage{
    flex:1;position:relative;overflow:hidden;background:#0f1115;
    touch-action:none;cursor:grab;
  }
  .stage.dragging{cursor:grabbing}
  .frame{position:absolute;left:50%;top:50%;transform-origin:center center}

  /* ---------- 手機：上表單、下預覽，兩邊同時見到 ---------- */
  @media (max-width:760px){
    body{flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
    .panel{
      width:100%;flex:0 0 auto;height:52vh;max-height:52vh;overflow-y:auto;
      border-right:0;border-bottom:1px solid #2b2f38;padding:12px 14px 16px;
    }
    .panel h1{font-size:16px}
    .stage{
      flex:1 1 auto;height:auto;min-height:0;position:relative;
    }
  }
  /* 編輯畫面只顯示通告本身，不顯示白紙 */
  @media screen{
    .sheet{width:auto!important;height:auto!important;background:transparent!important;
           box-shadow:none!important;overflow:visible!important}
    .paper{position:relative!important;left:0!important;top:0!important}
  }
  .sheet{position:relative;background:#fff;overflow:hidden;
         box-shadow:0 10px 40px rgba(0,0,0,.55)}
  .paper{
    position:absolute;left:0;top:0;width:210mm;height:99.5mm;background:var(--paper);
    color:var(--ink);overflow:hidden;
  }
  .paper.nofill{background:#fff}
  .paper.nofill::after{
    content:'';position:absolute;inset:0;border:.35mm dashed #9ac49d;
    pointer-events:none;
  }
  .paper .t{
    position:absolute;line-height:1;white-space:nowrap;
    font-family:"Palatino Linotype","Book Antiqua",Palatino,"Times New Roman",serif;
    font-size:9pt;
  }
  .paper .b{font-weight:700}
  .paper .lg{font-size:11.5pt}
  .paper .t,.paper .rt{margin-top:calc(-1 * var(--shift9))}
  .paper .lg{margin-top:calc(-1 * var(--shift115))}
  .paper img.logo{position:absolute;left:7.93mm;top:5.23mm;width:15.25mm;height:19.63mm}
  .box{position:absolute;left:7.95mm;top:47.60mm;width:194.10mm;height:20.87mm;
       border:1.7pt solid #000}
  .rule{position:absolute;left:7.95mm;top:60.47mm;width:194.10mm;border-top:.85pt solid #000}
  .rt{position:absolute;line-height:1;white-space:nowrap;
      font-family:"Palatino Linotype","Book Antiqua",Palatino,"Times New Roman",serif;font-size:9pt}

  /* ---------- 列印設定彈窗 ---------- */
  .modal{position:fixed;inset:0;background:rgba(6,8,12,.72);z-index:100;
         display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
  .modal[hidden]{display:none}
  .dlg{width:400px;max-width:calc(100vw - 40px);background:#1c1f26;border:1px solid #2f3542;
       border-radius:12px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
  .dlg h2{font-size:15px;margin:0 0 4px}
  .dlg .dsub{font-size:11px;color:#7d8492;margin-bottom:16px}
  .dlg .grp{margin-bottom:12px}
  .dlg .dact{display:flex;gap:8px;margin-top:18px}
  .dlg .dact .primary{flex:1}
  .sinfo{font-size:10.5px;color:#7d8492;margin-top:5px}
  .pv{position:relative;height:240px;margin:0 0 16px;background:#0d0f13;
      border:1px solid #2b303c;border-radius:8px;overflow:hidden;
      display:flex;align-items:center;justify-content:center}
  .pv-sheet{position:relative;background:#fff;transform-origin:center center;
            box-shadow:0 4px 18px rgba(0,0,0,.5)}
  .reco{font-size:11px;color:#7d8492;margin-top:10px;line-height:1.6;
        border-left:2px solid #2f6fed;padding-left:8px}

  /* ---------- 列印 ---------- */
  @media print{
    body{display:block;background:#fff;height:auto;overflow:visible}
    .panel{display:none}
    .stage{padding:0;background:#fff;display:block;overflow:visible}
    .frame{position:static!important;transform:none!important;width:auto!important;height:auto!important}
    .sheet{box-shadow:none!important;margin:0}
    .modal{display:none!important}
    .paper.nofill::after{display:none}
  }
</style>
<style id="pagecss">@page{size:210mm 297mm;margin:0}</style>
</head>
<body>

<aside class="panel">
  <h1>綠紙產生器</h1>
  <div class="warn" id="warn" style="display:none"></div>

  <div class="grp">
    <label>Name of Student（英文姓名）</label>
    <input type="text" id="f-name" value="" spellcheck="false" placeholder="例如 LEUNG OSCAR">
  </div>

  <div class="grp row2">
    <div>
      <label>Class（班別）</label>
      <input type="text" id="f-class" value="1E" spellcheck="false">
    </div>
    <div>
      <label>Class No.（班號）</label>
      <input type="text" id="f-no" value="" spellcheck="false" placeholder="例如 14">
    </div>
  </div>

  <div class="grp">
    <label>Number of non-submission(s)（欠交次數）</label>
    <input type="text" id="f-count" value="1" spellcheck="false">
  </div>

  <div class="sec">日期</div>
  <div class="grp">
    <label>Date（兩個日期共用）</label>
    <input type="text" id="f-date" value="" spellcheck="false" placeholder="例如 18/10/2026">
  </div>
  <div class="grp">
    <label>Day of week（星期）</label>
    <select id="f-day">
      <option>Mon</option><option>Tue</option><option>Wed</option>
      <option>Thu</option><option>Fri</option><option>Sat</option><option>Sun</option>
    </select>
  </div>

  <div class="grp">
    <label>Special timetable 時間</label>
    <input type="text" id="f-special" value="3:00 pm - 4:15 pm" spellcheck="false">
  </div>

  <div class="sec">欠交項目</div>
  <div id="hw-list"></div>
  <button class="add" id="btn-add">＋ 新增一行</button>

  <div class="btns">
    <button class="primary" id="btn-print">列印 / 存成 PDF</button>
    <button class="ghost" id="btn-reset">重設</button>
  </div>
</aside>

   <div class="sheet" id="sheet">

<script>
const STORE = 'greenNotice.v2';
const $ = id => document.getElementById(id);

/* 每行文字在紙上的絕對位置（mm） */
const COL = { s: 10.80, h: 42.25, r: 146.96 };
const ROW0 = 61.95, PITCH = 4.40, ROWS_AREA_TOP = 60.47, BOX_H = 20.87;

/* [短邊, 長邊] mm */
const PAPER = {
  A5:[148,210], A4:[210,297], A3:[297,420], A2:[420,594], A1:[594,841], A0:[841,1189],
  B5:[176,250], B4:[250,353], B3:[353,500], B2:[500,707], B1:[707,1000], B0:[1000,1414],
  C5:[162,229], C4:[229,324], C3:[324,458], C2:[458,648], C1:[648,917], C0:[917,1297],
  Statement:[140,216], Executive:[190,254], Letter:[216,279], Legal:[216,356], Ledger:[279,432],
  JISB5:[182,257], JISB4:[257,364], JISB3:[364,515], JISB2:[515,728], JISB1:[728,1030], JISB0:[1030,1456],
  D16:[210,285], D8:[285,420],
  SRA4:[225,320], SRA3:[320,450], RA4:[215,305]
};
const SLIP_W = 210, SLIP_H = 99.5;

/* 回傳 [寬, 高]：auto = 直向放得下就直向，否則橫向 */
function pageSize(){
  const p = PAPER[state.sheet] || PAPER.A4;
  const [sh, lo] = p;                       // 短邊、長邊
  let ori = state.ori || 'auto';
  if (ori === 'auto') ori = (sh >= SLIP_W) ? 'p' : 'l';
  return ori === 'p' ? [sh, lo] : [lo, sh];
}
function fitsPage(){ const [w,h] = pageSize(); return w >= SLIP_W - 0.01 && h >= SLIP_H - 0.01; }

let state = {
  sheet: 'A4', pos: 'tl', bg: 'white', ori: 'auto',
  name: '', cls: '1E', no: '', count: '1', countAuto: true,
  date: '', day: 'Mon', dayAuto: false,
  special: '3:00 pm - 4:15 pm',
  rows: [{ s: '', h: '', r: '' }]
};

const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${+d}/${+m}/${y}`;   // 與原稿一致：不加前導零
}
function dayOf(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  return DAYS[new Date(y, m-1, d).getDay()];
}

function renderPaper(){
  const dateStr = (state.date || '').trim();
  $('d1').textContent = `Date of non-submission:  ${dateStr} ${state.day}`.trim();
  $('d2').textContent = `Date of Detention Class:  ${dateStr} ${state.day}`.trim();
  $('v3').textContent = `Special timetable: ${state.special})`;
  $('s1').textContent = `Name of Student: ${state.name}`;
  $('s2').textContent = `Class: ${state.cls}`;
  $('s3').textContent = `Class No.: ${state.no}`;
  $('s4').textContent = `Number of non-submission(s): ${state.count}`;

  const rowsEl = $('rows');
  rowsEl.innerHTML = '';
  state.rows.forEach((r, i) => {
    const y = ROW0 + i * PITCH;
    for (const k of ['s','h','r']){
      const d = document.createElement('div');
      d.className = 'rt';
      d.style.left = COL[k] + 'mm';
      d.style.top = y + 'mm';
      d.textContent = r[k] || '';
      rowsEl.appendChild(d);
    }
  });
  const extra = Math.max(0, state.rows.length - 1) * PITCH;
  $('box').style.height = (BOX_H + extra) + 'mm';

  const w = checkOverflow();
  const el = $('warn');
  el.textContent = w.length ? '⚠ ' + w.join('；') : '';
  el.style.display = w.length ? 'block' : 'none';
}

function applySheet(){
  const [sw, sh] = pageSize();
  const sheet = $('sheet'), paper = $('paper');
  sheet.style.width = sw + 'mm';
  sheet.style.height = (sh - 0.5) + 'mm';   // 留 0.5mm 避免列印多出一頁
  let x, y;
  if (state.pos === 'c'){ x = (sw - SLIP_W) / 2; y = (sh - SLIP_H) / 2; }
  else { x = Math.min(10, sw - SLIP_W); y = 10; }
  paper.style.left = x + 'mm';
  paper.style.top = y + 'mm';
  paper.classList.toggle('nofill', state.bg === 'green');
  $('pagecss').textContent = '@page{size:' + sw + 'mm ' + sh + 'mm;margin:0}';

  const info = $('sinfo');
  if (info){
    const oriTxt = (sh > sw) ? '直向' : '橫向';
    info.textContent = `${state.sheet} ${oriTxt} · ${sw} × ${sh} mm` + (fitsPage() ? '' : ' · 放不下');
    info.style.color = fitsPage() ? '#7d8492' : '#e2727b';
  }
  if (!$('modal').hidden) renderPreview();
}

function renderForm(){
  $('f-sheet').value = state.sheet;
  $('f-pos').value = state.pos;
  $('f-ori').value = state.ori || 'auto';
  $('f-bg').value = state.bg;
  $('f-name').value = state.name;
  $('f-class').value = state.cls;
  $('f-no').value = state.no;
  $('f-count').value = state.count;
  $('f-date').value = state.date;
  $('f-day').value = state.day;
  $('f-special').value = state.special;

  const list = $('hw-list');
  list.innerHTML = '';
  state.rows.forEach((r, i) => {
    const box = document.createElement('div');
    box.className = 'hw';
    box.innerHTML = `
      <div class="hd"><span>第 ${i+1} 行</span>
        ${state.rows.length > 1 ? '<button class="del" data-del="'+i+'">刪除</button>' : ''}</div>
      <input type="text" data-i="${i}" data-k="s" value="${esc(r.s)}" placeholder="Subject 科目">
      <input type="text" data-i="${i}" data-k="h" value="${esc(r.h)}" placeholder="Homework 功課">
      <input type="text" data-i="${i}" data-k="r" value="${esc(r.r)}" placeholder="Reason 原因">`;
    list.appendChild(box);
  });
}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

/* 量度文字實際寬度（mm），用於偵測欄位溢出 */
const _cv = document.createElement('canvas').getContext('2d');
function textMM(str, pt, bold){
  _cv.font = `${bold?'bold ':''}${pt*96/72}px "Palatino Linotype","Book Antiqua",Palatino,"Times New Roman",serif`;
  return _cv.measureText(str).width * 25.4/96;
}
function checkOverflow(){
  const warn = [];
  if (textMM(`Name of Student: ${state.name}`, 9) > 53.5) warn.push('姓名過長，會壓到 Class 欄');
  if (textMM(`Number of non-submission(s): ${state.count}`, 9) > 100.0) warn.push('次數欄過長，會超出右邊界');
  state.rows.forEach((r,i)=>{
    if (textMM(r.s||'',9) > 31.0) warn.push(`第 ${i+1} 行 Subject 過長`);
    if (textMM(r.h||'',9) > 104.0) warn.push(`第 ${i+1} 行 Homework 過長`);
    if (textMM(r.r||'',9) > 54.5) warn.push(`第 ${i+1} 行 Reason 過長`);
  });
  return [...new Set(warn)];
}

function syncCount(){
  if(state.countAuto) state.count = String(state.rows.length);
}

function save(){
  localStorage.setItem(STORE, JSON.stringify(state));
}

function boot(){
  try{
    const raw = localStorage.getItem(STORE);
    if(raw) state = Object.assign(state, JSON.parse(raw));
  }catch(e){}
  /* 日期空白時自動填今日，學生只需要改日子就可以 */
  if(!String(state.date||'').trim()){
    const d = new Date();
    state.date = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
    state.day = DAYS[d.getDay()];
  }
  renderForm(); renderPaper(); applySheet(); fitView();
  /* iframe 開場動畫期間寬高未定，補量兩次 */
  setTimeout(fitView,120); setTimeout(fitView,520);
}

/* ---- 事件 ---- */
$('f-name').addEventListener('input', e => { state.name = e.target.value; renderPaper(); save(); });
$('f-class').addEventListener('input', e => {
  const v = e.target.value.toUpperCase();
  if (v !== e.target.value) e.target.value = v;
  state.cls = v; renderPaper(); save();
});
$('f-no').addEventListener('input', e => { state.no = e.target.value; renderPaper(); save(); });
$('f-count').addEventListener('input', e => { state.count = e.target.value; state.countAuto = false; renderPaper(); save(); });
$('f-special').addEventListener('input', e => { state.special = e.target.value; renderPaper(); save(); });

$('f-date').addEventListener('input', e => {
  state.date = e.target.value;
  renderPaper(); save();
});
$('f-day').addEventListener('change', e => { state.day = e.target.value; renderPaper(); save(); });

$('hw-list').addEventListener('input', e => {
  const t = e.target;
  if(t.dataset && t.dataset.k){
    state.rows[+t.dataset.i][t.dataset.k] = t.value;
    renderPaper(); save();
  }
});
$('hw-list').addEventListener('click', e => {
  const b = e.target.closest('[data-del]');
  if(!b) return;
  state.rows.splice(+b.dataset.del, 1);
  renderForm(); renderPaper(); save();
});

$('btn-add').addEventListener('click', () => {
  if(state.rows.length >= 4) return;
  state.rows.push({ s:'', h:'', r:'' });
  renderForm(); renderPaper(); save();
});

$('f-sheet').addEventListener('change', e => { state.sheet = e.target.value; applySheet(); save(); });
$('f-pos').addEventListener('change', e => { state.pos = e.target.value; applySheet(); save(); });
$('f-ori').addEventListener('change', e => { state.ori = e.target.value; applySheet(); save(); });
$('f-bg').addEventListener('change', e => { state.bg = e.target.value; applySheet(); save(); });

function openModal(){ $('modal').hidden = false; renderForm(); applySheet(); renderPreview(); }
function closeModal(){ $('modal').hidden = true; }
$('btn-print').addEventListener('click', openModal);
$('m-cancel').addEventListener('click', closeModal);
$('m-print').addEventListener('click', () => { closeModal(); setTimeout(() => window.print(), 60); });
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

$('btn-reset').addEventListener('click', () => {
  if(!confirm('重設所有欄位？')) return;
  localStorage.removeItem(STORE);
  location.reload();
});

/* ---------- 編輯區縮放／平移 ---------- */
const K = 96 / 25.4;
const stage = document.querySelector('.stage');
const frame = $('frame');
let vp = { z: 1, x: 0, y: 0 };

function applyVP(){
  frame.style.transform =
    `translate(calc(-50% + ${vp.x}px), calc(-50% + ${vp.y}px)) scale(${vp.z})`;
}
function fitView(){
  const w = SLIP_W * K, h = SLIP_H * K;
  /* 邊距按容器大小縮放：手機唔好白白浪費 40px */
  const pad = Math.max(16, Math.min(80, Math.round(Math.min(stage.clientWidth, stage.clientHeight) * 0.08)));
  const aw = stage.clientWidth - pad, ah = stage.clientHeight - pad;
  vp.z = Math.min(aw / w, ah / h, 2.5);
  vp.z = Math.max(vp.z, 0.15);
  vp.x = 0; vp.y = 0;
  applyVP();
}
function zoomAt(px, py, k){
  const nz = Math.min(5, Math.max(0.12, vp.z * k));
  const kk = nz / vp.z;
  vp.x = px - (px - vp.x) * kk;
  vp.y = py - (py - vp.y) * kk;
  vp.z = nz;
  applyVP();
}

stage.addEventListener('wheel', e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(e.clientX - r.left - r.width / 2, e.clientY - r.top - r.height / 2,
         Math.exp(-e.deltaY * 0.0016));
}, { passive: false });

const pts = new Map();
let dragStart = null, pinchStart = null;

stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1){
    dragStart = { x: e.clientX - vp.x, y: e.clientY - vp.y };
    stage.classList.add('dragging');
  } else if (pts.size === 2){
    const [a, b] = [...pts.values()];
    pinchStart = { d: Math.hypot(a.x - b.x, a.y - b.y), z: vp.z,
                   mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    dragStart = null;
  }
});

stage.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1 && dragStart){
    vp.x = e.clientX - dragStart.x;
    vp.y = e.clientY - dragStart.y;
    applyVP();
  } else if (pts.size === 2 && pinchStart){
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const r = stage.getBoundingClientRect();
    const mx = (a.x + b.x) / 2 - r.left - r.width / 2;
    const my = (a.y + b.y) / 2 - r.top - r.height / 2;
    const nz = Math.min(5, Math.max(0.12, pinchStart.z * d / pinchStart.d));
    const kk = nz / vp.z;
    vp.x = mx - (mx - vp.x) * kk;
    vp.y = my - (my - vp.y) * kk;
    vp.z = nz;
    applyVP();
  }
});

function endPtr(e){
  pts.delete(e.pointerId);
  if (pts.size < 2) pinchStart = null;
  if (pts.size === 0){ dragStart = null; stage.classList.remove('dragging'); }
}
stage.addEventListener('pointerup', endPtr);
stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('dblclick', fitView);

/* ---------- 列印預覽（完整紙張） ---------- */
function renderPreview(){
  const pv = $('pv');
  if (!pv) return;
  pv.innerHTML = '';
  const [sw, sh] = pageSize();
  const sheet = document.createElement('div');
  sheet.className = 'pv-sheet';
  sheet.style.width = sw + 'mm';
  sheet.style.height = (sh - 0.5) + 'mm';

  const clone = $('paper').cloneNode(true);
  clone.removeAttribute('id');
  clone.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  const x = parseFloat($('paper').style.left) || 0;
  const y = parseFloat($('paper').style.top) || 0;
  clone.style.left = x + 'mm';
  clone.style.top = y + 'mm';
  clone.classList.toggle('nofill', state.bg === 'green');
  sheet.appendChild(clone);
  pv.appendChild(sheet);

  const aw = pv.clientWidth - 24, ah = pv.clientHeight - 24;
  const sc = Math.min(aw / (sw * K), ah / (sh * K), 1);
  sheet.style.transform = `scale(${sc})`;
}

window.addEventListener('resize', () => { fitView(); });

boot();
</script>
</body>
