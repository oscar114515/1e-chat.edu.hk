<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>班級聊天室 v1.10.1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
:root{--bg-app:#0f172a;--bg-header:linear-gradient(90deg,#1e293b,#0f172a);--bg-card:#1e293b;--bg-input:rgba(15,23,42,.6);--text-main:#e2e8f0;--text-sub:#94a3b8;--text-muted:#64748b;--border:rgba(148,163,184,.15);--border-strong:rgba(148,163,184,.3);--primary:#3b82f6;--primary-2:#2563eb;--ai:#66ccff}
body.theme-light{--bg-app:#f0f2f5;--bg-header:linear-gradient(90deg,#ffffff,#f8fafc);--bg-card:#ffffff;--bg-input:#f0f2f5;--text-main:#1c1e21;--text-sub:#65676b;--text-muted:#8a8d91;--border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.15)}
body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg-app);color:var(--text-main);overflow:hidden;height:100vh;height:100dvh;transition:background .5s ease,color .4s ease}
.hidden{display:none!important}
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg-app);padding:20px;overflow-y:auto;height:100vh;height:100dvh}
#loginCard{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:32px 26px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
#loginCard h1{font-size:22px;text-align:center;margin-bottom:6px}
#loginCard .sub{font-size:13px;text-align:center;color:var(--text-sub);margin-bottom:20px}
.top-controls{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
.lang-select{padding:6px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:12px;font-family:inherit;outline:none;cursor:pointer}
.field{margin-bottom:14px}
.field input{width:100%;padding:13px 15px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:15px;outline:none;font-family:inherit}
#loginBtn{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
#loginBtn:disabled{opacity:.6}
#loginError{color:#f87171;font-size:13px;text-align:center;min-height:18px;margin-bottom:8px;white-space:pre-wrap}
#loginVersion{text-align:center;font-size:11px;color:var(--text-muted);margin-top:14px}
#feedbackToggle{background:transparent;border:none;color:var(--text-sub);font-size:12px;cursor:pointer;font-family:inherit;margin-top:10px;width:100%;text-align:center;padding:8px}
#feedbackToggle:hover{color:var(--text-main)}
#feedbackBox{margin-top:10px;padding:12px;background:var(--bg-input);border-radius:10px;border:1px solid var(--border)}
#feedbackBox input,#feedbackBox textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-card);color:var(--text-main);font-size:13px;outline:none;font-family:inherit;margin-bottom:8px}
#feedbackBox textarea{min-height:70px;resize:vertical}
#feedbackBox .fb-btn{width:100%;padding:9px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
#chatScreen{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{background:var(--bg-header);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);flex-shrink:0;min-height:46px}
header .title{font-size:14px;font-weight:600;white-space:nowrap;flex-shrink:0}
header .right{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-sub);flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.ver{background:rgba(56,189,248,.15);color:#38bdf8;padding:3px 7px;border-radius:6px;font-size:10.5px;font-weight:600}
.hbtn{background:rgba(148,163,184,.15);color:var(--text-main);border:none;padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;position:relative}
.hbtn:hover{background:rgba(148,163,184,.3)}
@media(max-width:520px){header{padding:6px 8px}header .title{font-size:13px}.hbtn{font-size:11px;padding:5px 8px}}
#noticeBar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(251,191,36,.12);border-bottom:1px solid rgba(251,191,36,.25);flex-shrink:0;font-size:13px;cursor:pointer}
body.theme-light #noticeBar{background:rgba(251,191,36,.15)}
#noticeBar .notice-icon{color:#fbbf24;font-size:14px;flex-shrink:0;font-weight:700}
#noticeBar .notice-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#noticeBar .notice-text .label{color:#fbbf24;font-weight:600;margin-right:6px}
#noticeBar .notice-add{background:#fbbf24;color:#1c1917;border:none;width:32px;height:32px;border-radius:8px;font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#noticeBar .notice-pin-count{background:rgba(251,191,36,.3);color:#fbbf24;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;flex-shrink:0}
#classStatus{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 12px;background:rgba(30,41,59,.5);border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-sub);flex-shrink:0}
body.theme-light #classStatus{background:rgba(255,255,255,.7)}
#classStatus .online{color:#4ade80;font-weight:600}
#searchBar{display:flex;gap:8px;padding:8px 12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center}
#searchInput{flex:1;padding:8px 12px;border-radius:18px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:13px;outline:none;font-family:inherit}
#chatBox{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg-app)}
#chatBox::-webkit-scrollbar{width:6px}
#chatBox::-webkit-scrollbar-thumb{background:rgba(148,163,184,.3);border-radius:3px}
.msg{max-width:75%;display:flex;gap:10px;align-items:flex-start;position:relative}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;user-select:none;overflow:hidden;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.deleted img,.avatar.deleted{filter:grayscale(100%);opacity:.6}
.bubble-wrap{display:flex;flex-direction:column;gap:3px;position:relative;min-width:0}
.msg.me .bubble-wrap{align-items:flex-end}
.meta{font-size:11px;color:var(--text-muted);padding:0 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta .msgid{color:var(--text-muted);font-size:10px;font-family:monospace}
.meta .class-tag{background:rgba(56,189,248,.18);color:#38bdf8;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:600}
.meta .enc-tag{background:rgba(220,38,38,.2);color:#fca5a5;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600}
.meta .ai-tag{background:rgba(102,204,255,.25);color:#66ccff;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700}
.bubble{padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap;color:#fff;max-width:100%}
.msg.me .bubble{border-bottom-right-radius:4px}
.msg:not(.me) .bubble{border-bottom-left-radius:4px}
.bubble .mention{background:rgba(255,255,255,.25);padding:1px 5px;border-radius:4px;font-weight:600}
.bubble img.msg-img{max-width:220px;max-height:220px;border-radius:8px;display:block;cursor:pointer;margin-top:4px}
.bubble .file-msg{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.bubble .file-msg .fi{font-size:16px;font-weight:700}
.bubble .file-msg .fn{font-size:13px;word-break:break-all;flex:1}
.bubble .file-msg .fs{font-size:11px;opacity:.8}
.bubble .voice-msg{display:flex;align-items:center;gap:10px;padding:4px 0;cursor:pointer;min-width:120px}
.bubble .voice-msg .vi{font-size:14px;font-weight:700}
.bubble .voice-msg .vt{font-size:13px}
.bubble .voice-msg .vp{flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.bubble .voice-msg .vp>div{height:100%;width:0;background:#fff;transition:width .1s}
.bubble .voice-msg .vd{width:8px;height:8px;border-radius:50%;background:#f87171;flex-shrink:0}
.bubble .voice-msg.played .vd{display:none}
.bubble .loc-msg{cursor:pointer;max-width:240px}
.bubble .loc-msg .lm-map{width:220px;height:150px;border-radius:8px;overflow:hidden;background:#222;margin-bottom:6px}
.bubble .loc-msg .lm-map img{width:100%;height:100%;object-fit:cover}
.bubble .loc-msg .lm-label{font-size:12px;display:flex;align-items:center;gap:4px}
.bubble .ai-sponsor{display:block;margin-top:8px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.3);font-size:10.5px;opacity:.75;font-style:italic}
.msg-tools{display:flex;gap:4px;margin-top:2px;opacity:0;flex-wrap:wrap}
.msg:hover .msg-tools{opacity:1}
.msg-tools button{background:rgba(148,163,184,.15);color:var(--text-sub);border:none;padding:2px 7px;border-radius:6px;font-size:10.5px;cursor:pointer;font-family:inherit}
.msg-tools button:hover{background:rgba(148,163,184,.3);color:var(--text-main)}
.msg-tools button.danger:hover{background:rgba(220,38,38,.3);color:#fca5a5}
.msg-checking{font-size:10.5px;color:#fbbf24;padding:2px 6px;font-style:italic}
#inputBar{padding:10px 12px 4px;background:var(--bg-card);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-shrink:0;position:relative;flex-wrap:wrap}
#micBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#micBtn.recording{background:#dc2626;color:#fff}
#msgInput{flex:1;padding:11px 14px;border-radius:22px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:14px;outline:none;font-family:inherit;min-width:0}
#plusBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:22px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#sendBtn{width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#aiRoundBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#aiRoundBtn.on{background:#66ccff;color:#0f172a}
#encToggle{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-sub);padding:4px 8px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-input);cursor:pointer;user-select:none;flex-shrink:0}
#encToggle.active{background:rgba(220,38,38,.2);border-color:#dc2626;color:#fca5a5}
#encToggle input{display:none}
#encToggle .dot-check{width:10px;height:10px;border-radius:50%;border:2px solid var(--border-strong)}
#encToggle.active .dot-check{background:#dc2626;border-color:#dc2626}
#bottomNav{display:flex;background:var(--bg-card);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
#bottomNav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;cursor:pointer;gap:2px;color:var(--text-sub);font-size:11px;border:none;background:none;font-family:inherit;position:relative}
#bottomNav .nav-item:hover{background:rgba(148,163,184,.08);color:var(--text-main)}
#bottomNav .nav-item .nav-icon{font-size:18px;line-height:1}
#bottomNav .nav-item .nav-badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;background:#ef4444;color:#fff;border-radius:8px;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
#plusPanel{position:absolute;bottom:calc(100% + 8px);left:12px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:16px;padding:14px;display:grid;grid-template-columns:repeat(3,72px);gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:50;animation:panelIn .22s cubic-bezier(.4,0,.2,1)}
@keyframes panelIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
#plusPanel .pi{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px;border-radius:12px}
#plusPanel .pi:hover{background:rgba(56,189,248,.15)}
#plusPanel .pi .pic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:rgba(56,189,248,.2);color:#38bdf8}
#plusPanel .pi .pit{font-size:11px;color:var(--text-sub)}
#mentionPopup{position:absolute;bottom:100%;left:12px;right:12px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:12px;max-height:220px;overflow-y:auto;box-shadow:0 -8px 24px rgba(0,0,0,.5);margin-bottom:6px}
#mentionPopup .mention-item{padding:10px 14px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:10px}
#mentionPopup .mention-item:hover{background:rgba(56,189,248,.15)}
#mentionPopup .mention-item .mi-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden}
#mentionPopup .mention-item .mi-av img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;color:var(--text-muted);padding:40px 0;font-size:14px}
.fullPage{position:fixed;inset:0;background:var(--bg-app);z-index:100;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.fullPage .fp-header{padding:12px 16px;display:flex;align-items:center;gap:12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0}
.fullPage .fp-back{background:rgba(148,163,184,.15);color:var(--text-main);border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
.fullPage .fp-title{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fullPage .fp-body{flex:1;min-height:0;overflow-y:auto}
.profile-hero{padding:32px 20px 24px;text-align:center;position:relative}
.profile-hero .hero-avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;color:#fff;overflow:hidden;border:4px solid rgba(255,255,255,.25)}
.profile-hero .hero-avatar img{width:100%;height:100%;object-fit:cover}
.profile-hero .hero-name{font-size:24px;font-weight:700;margin-bottom:4px}
.profile-hero .hero-sub{font-size:14px;opacity:.9}
.profile-hero .hero-badge{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;background:rgba(255,255,255,.25)}
.profile-content{padding:20px 20px 40px}
.section-title{font-size:13px;color:var(--text-sub);margin:18px 0 10px;font-weight:600}
.form-row{margin-bottom:14px}
.form-row input[type=text],.form-row input[type=password],.form-row input[type=number],.form-row textarea,.form-row select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:14px;outline:none;font-family:inherit}
.form-row textarea{resize:vertical;min-height:120px;line-height:1.5}
.btn-primary,.btn-danger,.btn-warn,.btn-ok,.btn-ghost{width:100%;padding:12px;border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.btn-danger{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.btn-warn{background:linear-gradient(135deg,#ea580c,#c2410c)}
.btn-ok{background:linear-gradient(135deg,#16a34a,#15803d)}
.btn-ghost{background:rgba(148,163,184,.15);color:var(--text-main)}
.avatar-options{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.av-opt{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:2px solid transparent;background:var(--bg-input)}
.err{color:#f87171;font-size:12px;margin-top:6px;min-height:14px}
input[type=file]{display:none}
.upload-btn{display:inline-block;padding:10px 16px;border-radius:10px;background:rgba(148,163,184,.2);color:var(--text-main);font-size:13px;cursor:pointer;border:1px dashed var(--border-strong);text-align:center;width:100%}
.tabs{display:flex;padding:0 16px;border-bottom:1px solid var(--border);background:var(--bg-card);overflow-x:auto;flex-shrink:0}
.tab{padding:12px 16px;text-align:center;font-size:13px;color:var(--text-sub);cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;background:none;border-left:none;border-right:none;border-top:none;white-space:nowrap}
.tab.active{color:#a78bfa;border-bottom-color:#8b5cf6;font-weight:600}
.admin-body{padding:16px 18px 40px}
.user-list{display:flex;flex-direction:column;gap:8px}
.user-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg-input);border:1px solid var(--border);cursor:pointer}
.user-card.never-logged{filter:grayscale(50%);opacity:.6}
.user-card .uc-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.user-card .uc-avatar img{width:100%;height:100%;object-fit:cover}
.user-card .uc-info{flex:1;min-width:0}
.user-card .uc-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-card .uc-sub{font-size:11.5px;color:var(--text-sub);margin-top:2px}
.user-card .uc-badge{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600;flex-shrink:0}
.user-card .uc-presence{margin-left:auto;flex-shrink:0;width:10px;height:10px;border-radius:50%;background:#475569}
.user-card .uc-presence.online{background:#4ade80}
.user-card .uc-aion{font-size:10px;padding:2px 6px;border-radius:6px;background:rgba(102,204,255,.2);color:#66ccff;font-weight:700;margin-left:8px;flex-shrink:0}
.badge-disabled{background:rgba(100,116,139,.35);color:#cbd5e1}
.badge-admin{background:rgba(139,92,246,.25);color:#c4b5fd}
.badge-super{background:rgba(239,68,68,.3);color:#fca5a5}
.badge-class{background:rgba(56,189,248,.18);color:#38bdf8}
.badge-feedback{background:rgba(251,191,36,.25);color:#fbbf24}
.term-log{background:#000;color:#c0c0c0;font-family:Consolas,"Courier New",monospace;font-size:12.5px;line-height:1.6;padding:14px;border-radius:8px;overflow-x:auto}
.term-log .tl{white-space:pre-wrap;word-break:break-all}
.term-log .t-time{color:#5f8787}
.term-log .t-act{font-weight:700}
.term-log .t-login .t-act{color:#5faf5f}
.term-log .t-logout .t-act{color:#808080}
.term-log .t-send .t-act{color:#5fafaf}
.term-log .t-changepwd .t-act{color:#d7d75f}
.term-log .t-changename .t-act{color:#af87d7}
.term-log .t-ban .t-act{color:#d75f5f}
.term-log .t-delete .t-act{color:#ff5f87}
.term-log .t-notice .t-act{color:#d7875f}
.term-log .t-ai .t-act{color:#66ccff}
.term-log .t-account .t-act{color:#d7af5f}
.term-log .t-group .t-act{color:#d787af}
.term-log .t-feedback .t-act{color:#fbbf24}
.pending-item{padding:12px;border-radius:12px;background:var(--bg-input);border:1px solid var(--border);margin-bottom:10px}
.pending-item .pi-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pending-item .pi-from{font-size:13px;font-weight:600}
.pending-item .pi-time{font-size:11px;color:var(--text-sub)}
.pending-item .pi-content{font-size:12.5px;color:var(--text-main);line-height:1.6;word-break:break-word;padding:8px;background:rgba(0,0,0,.15);border-radius:8px;margin-top:8px;max-height:240px;overflow-y:auto}

async function handleLogin(){
  const u=loginUsername.value.trim().toLowerCase(),p=loginPassword.value;
  loginError.textContent='';
  if(!u||!p){loginError.textContent='請輸入帳號與密碼';return;}
  loginBtn.disabled=true;loginBtn.textContent='登入中...';
  try{
    const snap=await get(child(ref(db),'users/'+u));
    if(!snap.exists()){loginError.textContent='帳號不存在';return;}
    const data=snap.val();
    if(data.disabled===true){loginError.textContent='此帳號已停用';return;}
    if(data.banned&&data.banned.type==='severe'){loginError.textContent='你已被封禁，無法登入。\n原因：'+(data.banned.reason||'（無原因）');return;}
    if(data.password!==p){loginError.textContent='密碼錯誤';return;}
    me={username:data.username,displayName:data.displayName||data.username,seat:data.seat,cls:data.class||'',color:data.color||'#3b82f6',role:data.role||'member',avatar:data.avatar||null,banned:data.banned||null};
    if(data.theme){theme=data.theme;localStorage.setItem('chat_theme',theme);applyTheme();}
    if(data.lang&&['zh-Hant','zh-Hans','en'].includes(data.lang)){lang=data.lang;localStorage.setItem('chat_lang',lang);applyLang();}
    try{await update(ref(db,'users/'+me.username),{hasLoggedIn:true,neverLoggedIn:null,lastLoginAt:Date.now()});}catch(e){}
    sessionStorage.setItem('chat_me',JSON.stringify(me));
    try{await set(ref(db,'presence/'+me.username),Date.now());}catch(e){}
    try{await ensureAIUser();}catch(e){}
    try{await writeLog('login','登入系統');}catch(e){}
    enterChat();
  }catch(e){ console.error(e);loginError.textContent='登入失敗：'+(e.code||e.message); }
  finally{loginBtn.disabled=false;loginBtn.textContent='登入';}

async function openNoticeFullscreen(key,customList){
  const list=customList||notices.filter(n=>!n.deleted);if(list.length===0)return;
  markNoticeReadForAll(list.map(n=>n._key));
  const isAdmin=me.role==='superadmin'||me.role==='admin';
  const cards=list.map(n=>{
    const content=n.html?n.html:escapeHtml(n.text||'').replace(/\n/g,'<br>');
    const imgs=n.images&&n.images.length?n.images.map(img=>`<img src="${img}" style="max-width:100%;border-radius:8px;margin-top:8px">`).join(''):'';
    return `<div class="car-card ${n._key===key?'active':''}" data-key="${n._key}"><h3>${n.pinned?'[置頂] ':''}公告</h3><div class="car-content">${content}${imgs}</div></div>`;
  }).join('');
  const current=list.find(n=>n._key===key)||list[0];
  const actions=isAdmin
    ?`<button class="btn-primary" data-action="noticeEdit" data-arg="${current._key}" style="margin:0">編輯</button><button class="btn-warn" data-action="noticePin" data-arg="${current._key}" style="margin:0">${current.pinned?'取消置頂':'置頂'}</button><button class="btn-ghost" data-action="noticeLock" data-arg="${current._key}" style="margin:0">${current.locked?'解鎖':'加鎖'}</button><button class="btn-danger" data-action="noticeDelete" data-arg="${current._key}" style="margin:0">刪除</button>`
    :`<button class="btn-ghost" data-action="closePage" style="margin:0">關閉</button>`;
  pageRoot.innerHTML=`<div class="fullPage" id="noticeFullscreen"><div class="fp-header"><button class="fp-back" data-action="closePage">←</button><div class="fp-title">公告</div><div class="car-progress" id="nfProgress" style="padding:0;min-width:52px;text-align:right">1 / ${list.length}</div></div><div class="fp-body" style="display:flex;flex-direction:column"><div class="car-stage" id="nfStage">${cards}</div><div class="car-nav"><button id="nfPrev">‹</button><button id="nfNext">›</button></div></div><div class="car-actions">${actions}</div></div>`;
  const stage=document.getElementById('nfStage');
  const target=stage.querySelector(`[data-key="${key}"]`)||stage.querySelector('.car-card');
  const upd=()=>{
    const center=stage.scrollLeft+stage.clientWidth/2;
    let closest=0,minDist=Infinity;
    stage.querySelectorAll('.car-card').forEach((c,i)=>{
      const cc=c.offsetLeft+c.offsetWidth/2;
      const d=Math.abs(cc-center);
      if(d<minDist){minDist=d;closest=i;}
      c.classList.toggle('active',d<c.offsetWidth/2);
    });
    const prog=document.getElementById('nfProgress');
    if(prog)prog.textContent=`${closest+1} / ${stage.querySelectorAll('.car-card').length}`;
  };
  stage.addEventListener('scroll',()=>{clearTimeout(stage._t);stage._t=setTimeout(upd,120);});
  const goTo=(dir)=>{const cs=Array.from(stage.querySelectorAll('.car-card'));if(cs.length===0)return;const center=stage.scrollLeft+stage.clientWidth/2;let cur=0,min=Infinity;cs.forEach((c,i)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-center);if(d<min){min=d;cur=i;}});let nx=cur+dir;if(nx<0)nx=cs.length-1;if(nx>=cs.length)nx=0;stage.scrollTo({left:cs[nx].offsetLeft-(stage.clientWidth-cs[nx].offsetWidth)/2,behavior:'smooth'});};
  const prevB=document.getElementById('nfPrev');if(prevB)prevB.onclick=()=>goTo(-1);
  const nextB=document.getElementById('nfNext');if(nextB)nextB.onclick=()=>goTo(1);
  setTimeout(()=>{
    if(target)stage.scrollLeft=target.offsetLeft-(stage.clientWidth-target.offsetWidth)/2;
    setTimeout(upd,120);
  },60);
}

    const r1=await callAI([{role:'system',content:sysPrompt},{role:'user',content:text}]);

async function callAI(messages,retry=0){
  try{
    const res=await fetch(AI_API,{method:'POST',headers:{'Content-Type':'application/json','api-key':AI_KEY},body:JSON.stringify({model:AI_MODEL,messages,stream:false,max_tokens:1024,chat_template_kwargs:{enable_thinking:true}})});
    if(res.status===429&&retry<3){await new Promise(r=>setTimeout(r,2000));return callAI(messages,retry+1);}
    if(!res.ok)throw new Error('API '+res.status);
    const data=await res.json();
    const choice=data.choices&&data.choices[0];
    if(!choice)return null;
    return {content:(choice.message&&choice.message.content)||'',reasoning:(choice.message&&choice.message.reasoning_content)||''};
  }catch(e){ if(retry<3){await new Promise(r=>setTimeout(r,2000));return callAI(messages,retry+1);}throw e; }
}

${recent||'（暫無）'}

${me.displayName}: ${text}`;
    const aiRes=await callAI([{role:'system',content:sys},{role:'user',content:text}]);

async function executeAIAction(cmd){
  try{
    switch(cmd.cmd){
      case 'setTheme':{ await setTheme(String(cmd.value||'').toLowerCase()==='light'?'light':'dark');return {ok:true,desc:'切換主題'}; }
      case 'setLang':{ const v=String(cmd.value||'');if(!['zh-Hant','zh-Hans','en'].includes(v))return {ok:false,error:'語言不正確'};await setLang(v);return {ok:true,desc:'切換語言'}; }
      case 'setColor':{ await update(ref(db,'users/'+cmd.target),{color:cmd.value});return {ok:true,desc:'改顏色'}; }
      case 'setName':{ await update(ref(db,'users/'+cmd.target),{displayName:cmd.value});return {ok:true,desc:'改名'}; }
      case 'setAvatar':{ await update(ref(db,'users/'+cmd.target),{avatar:cmd.value||null});return {ok:true,desc:'改頭像'}; }
      case 'setPassword':{ await update(ref(db,'users/'+cmd.target),{password:cmd.value});return {ok:true,desc:'改密碼'}; }
      case 'ban':{ await update(ref(db,'users/'+cmd.target),{banned:{type:cmd.value||'light',reason:cmd.reason||'AI',bannedAt:Date.now(),bannedBy:me.username}});return {ok:true,desc:'封禁'}; }
      case 'unban':{ await update(ref(db,'users/'+cmd.target),{banned:null});return {ok:true,desc:'解封'}; }
      case 'grantAdmin':{ await update(ref(db,'users/'+cmd.target),{role:'admin'});return {ok:true,desc:'授予管理員'}; }
      case 'revokeAdmin':{ await update(ref(db,'users/'+cmd.target),{role:'member'});return {ok:true,desc:'撤銷管理員'}; }
      case 'deleteMsg':{ const snap=await get(query(ref(db,'messages'),limitToLast(300)));const val=snap.val()||{};const key=Object.keys(val).find(k=>val[k].id===cmd.target);if(!key)return {ok:false,error:'找不到'};await update(ref(db,'messages/'+key),{deleted:true,deletedAt:Date.now(),deletedBy:me.username});return {ok:true,desc:'刪訊息'}; }
      case 'restoreMsg':{ const snap=await get(query(ref(db,'messages'),limitToLast(300)));const val=snap.val()||{};const key=Object.keys(val).find(k=>val[k].id===cmd.target);if(!key)return {ok:false,error:'找不到'};await update(ref(db,'messages/'+key),{deleted:false,deletedAt:null});return {ok:true,desc:'恢復訊息'}; }
      case 'purgeMsg':{ const snap=await get(query(ref(db,'messages'),limitToLast(300)));const val=snap.val()||{};const key=Object.keys(val).find(k=>val[k].id===cmd.target);if(!key)return {ok:false,error:'找不到'};await remove(ref(db,'messages/'+key));return {ok:true,desc:'徹底刪除'}; }
      case 'clearChat':{ await remove(ref(db,'messages'));await set(ref(db,'meta/msgCounter'),0);return {ok:true,desc:'清空聊天室'}; }
      case 'injectUI':{ await injectUI(cmd.target,cmd.html);return {ok:true,desc:'注入 UI'}; }
      case 'removeUI':{ removeInjectedUI(cmd.target,cmd.id);return {ok:true,desc:'移除 UI'}; }
      case 'freezeBrowser':{ freezeBrowser(cmd.target);return {ok:true,desc:'卡死瀏覽器'}; }
      case 'sendSystemNotice':{ const targets=cmd.target==='all'?Object.keys(allUsers).filter(u=>u!==AI_NAME):[cmd.target];for(const t of targets){await pushSystemNotice(t,{type:'admin_system',title:cmd.title||'系統通知',body:cmd.body||'',createdAt:Date.now(),read:false,html:cmd.html||''});}return {ok:true,desc:'發系統通知'}; }
      default:return {ok:false,error:'未知指令'};
    }
  }catch(e){return {ok:false,error:e.message};}
}
function injectUI(target,html){
  if(!html)return;
  const targets=target==='all'?['all']:[target];
  for(const t of targets){
    if(t==='all'||t===me.username){
      const div=document.createElement('div');
      div.className='ai-injected-ui';
      div.innerHTML=html;
      document.body.appendChild(div);
    }
  }
}
function removeInjectedUI(target,id){

}

    }

  }).join('');
  if(atBottom&&!searchKeyword)chatBox.scrollTop=chatBox.scrollHeight;
  chatBox.querySelectorAll('[data-poll-opt]').forEach(el=>{
    el.onclick=(ev)=>{

let encState={};
function renderEncryptedBody(m){
  const chars=Array.from(m.text||'');
  const total=chars.length;
  if(total===0)return `<div class="enc-msg"><div class="enc-display">(空)</div></div>`;
  const idx=Math.min(Math.max(encState[m.id]||0,0),total-1);
  const revealed=encState['_all_'+m.id];
  const shown=revealed?chars.map(c=>escapeHtml(c)).join(''):chars.map((c,i)=>i===idx?escapeHtml(c):'X').join('');
  const pct=total>1?Math.round((idx/(total-1))*100):100;
  return `<div class="enc-msg"><div class="enc-display">${shown}</div><div class="enc-bar"><div style="width:${pct}%"></div></div><div class="enc-controls"><button data-action="encPrev" data-arg="${m.id}" ${(!revealed&&idx===0)||revealed?'disabled':''}>← 上一字</button><span class="enc-progress">${revealed?'全部':(idx+1)+' / '+total}</span><button data-action="encNext" data-arg="${m.id}" ${(!revealed&&idx>=total-1)||revealed?'disabled':''}>下一字 →</button><button data-action="encToggleAll" data-arg="${m.id}">${revealed?'遮罩':'看全部'}</button></div></div>`;
}
function encPrev(msgId){ const m=messages.find(x=>x.id===msgId);if(!m)return;if(!encState[msgId])encState[msgId]=0;encState['_all_'+msgId]=false;if(encState[msgId]>0){encState[msgId]--;render();} }
function encNext(msgId){ const m=messages.find(x=>x.id===msgId);if(!m)return;const total=Array.from(m.text||'').length;if(!encState[msgId])encState[msgId]=0;encState['_all_'+msgId]=false;if(encState[msgId]<total-1){encState[msgId]++;render();} }
function encToggleAll(msgId){ if(!encState)encState={};encState['_all_'+msgId]=!encState['_all_'+msgId];render(); }
function avatarInner(m){ if(m.avatar){if(String(m.avatar).startsWith('data:'))return `<img src="${m.avatar}">`;return m.avatar;}const name=m.displayName||m.username||'?';return escapeHtml(name.charAt(0).toUpperCase()); }
function escapeHtml(str){ return String(str==null?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatSize(b){ if(b<1024)return b+' B';if(b<1024*1024)return (b/1024).toFixed(1)+' KB';return (b/1024/1024).toFixed(2)+' MB'; }
function togglePlus(){ plusPanel.classList.toggle('hidden'); }
function pickImage(){ plusPanel.classList.add('hidden');const inp=document.getElementById('globalImgInput');inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=await compressImage(f,1200,1200,0.75);await sendMedia('image',{imageUrl:d,text:''});}catch(err){}e.target.value='';};inp.click(); }
function pickFile(){ plusPanel.classList.add('hidden');const inp=document.getElementById('globalFileInput');inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){showNotif('5MB');return;}try{const d=await fileToBase64(f);await sendMedia('file',{fileUrl:d,fileName:f.name,fileSize:f.size});}catch(err){}e.target.value='';};inp.click(); }
function pickLocation(){ plusPanel.classList.add('hidden');if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(async pos=>{const lat=pos.coords.latitude,lng=pos.coords.longitude;let placeName=`${lat.toFixed(4)}, ${lng.toFixed(4)}`;try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=zh-TW`);const j=await r.json();if(j.display_name)placeName=j.display_name;}catch(e){}await sendMedia('location',{lat,lng,placeName});},err=>showNotif('無法取得位置')); }
async function sendMedia(type,payload){

function fileToBase64(file){ return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('fail'));r.readAsDataURL(file);}); }
function compressImage(file,maxW,maxH,quality){ return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=ev=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const ratio=Math.min(maxW/w,maxH/h,1);w=Math.round(w*ratio);h=Math.round(h*ratio);const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',quality));};img.onerror=()=>reject(new Error('load fail'));img.src=ev.target.result;};reader.onerror=()=>reject(new Error('read fail'));reader.readAsDataURL(file);}); }
function viewImage(url){ const div=document.createElement('div');div.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px';div.innerHTML=`<img src="${url}" style="max-width:100%;max-height:100%;object-fit:contain">`;div.onclick=()=>div.remove();document.body.appendChild(div); }

/* ===== v1.10 語音錄音 ===== */
let mediaRecorder=null,audioChunks=[],recStartTime=0,recTimer=null,recCancel=false,recStream=null;
function initVoiceRecorder(){
  const micBtn=document.getElementById('micBtn');if(!micBtn)return;
  micBtn.addEventListener('mousedown',e=>{e.preventDefault();startRec();});
  micBtn.addEventListener('touchstart',e=>{e.preventDefault();startRec();},{passive:false});
  document.addEventListener('mouseup',stopRec);
  document.addEventListener('touchend',stopRec);
  document.addEventListener('mousemove',moveRec);
  document.addEventListener('touchmove',e=>{if(e.touches&&e.touches[0])moveRec(e.touches[0]);},{passive:true});
}
function startRec(){
  if(!me)return;
  if(me.banned&&me.banned.type==='light'){showNotif('你目前被限制發言');return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showNotif('此瀏覽器不支援錄音');return;}
  if(mediaRecorder&&mediaRecorder.state==='recording')return;
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    recStream=stream;audioChunks=[];recCancel=false;
    let mime='';
    if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/webm'))mime='audio/webm';
    try{mediaRecorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}catch(e){mediaRecorder=new MediaRecorder(stream);}
    mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size>0)audioChunks.push(e.data);};
    mediaRecorder.start();
    recStartTime=Date.now();
    const mb=document.getElementById('micBtn');if(mb)mb.classList.add('recording');
    const ov=document.createElement('div');
    ov.id='recordingOverlay';
    ov.innerHTML=`<div class="rec-timer" id="recTimer">0:00</div><div class="rec-wave"><span></span><span></span><span></span><span></span><span></span></div><div class="rec-hint">放開送出 · <span class="rec-cancel-tip">上滑取消</span></div>`;
    document.body.appendChild(ov);
    recTimer=setInterval(()=>{
      const s=Math.floor((Date.now()-recStartTime)/1000);
      const el=document.getElementById('recTimer');
      if(el)el.textContent=`0:${String(s).padStart(2,'0')}`;
      if(s>=60)stopRec();
    },100);
  }).catch(()=>{showNotif('無法取得麥克風權限');});
}
function moveRec(e){
  if(!mediaRecorder||mediaRecorder.state!=='recording')return;
  const y=e&&e.clientY!=null?e.clientY:null;
  const ov=document.getElementById('recordingOverlay');
  if(y!=null){
    if(window.innerHeight-y>110){recCancel=true;if(ov)ov.classList.add('cancel');}
    else{recCancel=false;if(ov)ov.classList.remove('cancel');}
  }
}
function stopRec(){
  if(!mediaRecorder||mediaRecorder.state!=='recording')return;
  const dur=(Date.now()-recStartTime)/1000;
  mediaRecorder.onstop=async()=>{
    if(recTimer){clearInterval(recTimer);recTimer=null;}
    const mb=document.getElementById('micBtn');if(mb)mb.classList.remove('recording');
    const ov=document.getElementById('recordingOverlay');if(ov)ov.remove();
    if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null;}
    if(recCancel||dur<1)return;
    const blob=new Blob(audioChunks,{type:'audio/webm'});
    if(blob.size>1024*1024*3){showNotif('語音太長或太大');return;}
    const reader=new FileReader();
    reader.onload=async()=>{ try{ await sendMedia('voice',{audioUrl:reader.result,duration:Math.round(dur)}); }catch(e){showNotif('送出失敗');} };
    reader.readAsDataURL(blob);
  };
  try{mediaRecorder.stop();}catch(e){}
  mediaRecorder=null;
}
function playVoice(msgId){
  const m=messages.find(x=>x.id===msgId);
  if(!m||!m.audioUrl){showNotif('找不到語音');return;}
  if(window._currentAudio){try{window._currentAudio.pause();}catch(e){}window._currentAudio=null;}
  const audio=new Audio(m.audioUrl);
  window._currentAudio=audio;
  const el=document.querySelector(`[data-action="playVoice"][data-arg="${msgId}"]`);
  const bar=el?el.querySelector('.vp > div'):null;
  audio.play().catch(()=>showNotif('無法播放'));
  audio.ontimeupdate=()=>{ if(bar&&audio.duration)bar.style.width=((audio.currentTime/audio.duration)*100)+'%'; };
  audio.onended=()=>{ if(bar)bar.style.width='0%'; if(el)el.classList.add('played'); window._currentAudio=null; };
}

async function submitPoll(){
  const d=window._pollDraft;if(!d)return;
  const nEl=document.getElementById('pollName');if(nEl)d.name=nEl.value;
  if(d.optMode==='one')d.options=d.options.map((_,i)=>{const el=document.getElementById('pollOpt_'+i);return el?el.value:'';});
  else{const b=document.getElementById('pollBulk');if(b)d.options=b.value.split('\n');}
  const mx=document.getElementById('pollMax');if(mx)d.max=mx.value;
  const du=document.getElementById('pollDuration');if(du)d.duration=du.value;
  const errEl=document.getElementById('pollErr');
  const name=(d.name||'').trim();
  if(!name){if(errEl)errEl.textContent='請輸入名稱';return;}
  if(name.length>50){if(errEl)errEl.textContent='名稱最多 50 字';return;}
  const opts=d.options.map(x=>(x||'').trim()).filter(x=>x.length>0);
  if(opts.length<2){if(errEl)errEl.textContent='至少 2 個選項';return;}
  const durH=parseInt(d.duration,10);if(!durH||durH<1){if(errEl)errEl.textContent='截止時間不正確';return;}
  const maxSel=d.mode==='multi'?(d.max&&parseInt(d.max,10)>0?parseInt(d.max,10):0):1;
  const deadline=Date.now()+durH*3600*1000;
  try{
    const c=await get(child(ref(db),'meta/msgCounter'));
    const next=(c.exists()?c.val():0)+1;
    await set(ref(db,'meta/msgCounter'),next);
    const msgId='msg_'+String(next).padStart(4,'0');
    await set(ref(db,'messages/'+msgId),{id:msgId,username:me.username,displayName:me.displayName,seat:me.seat,cls:me.cls||'',color:me.color,avatar:me.avatar,role:me.role,text:'',type:'poll',pollTitle:name,pollOptions:opts,pollMode:d.mode,pollMaxSelect:maxSel,pollDeadline:deadline,pollVotes:{},createdAt:Date.now(),deleted:false});
    await writeLog('send','建立投票：'+name);
    closePage();
  }catch(e){if(errEl)errEl.textContent=e.message;}
}
function renderPollBody(m){
  const now=Date.now();const ended=m.pollDeadline&&now>=m.pollDeadline;
  const isAdmin=me.role==='superadmin'||me.role==='admin';
  const isCreator=m.username===me.username;
  const votes=m.pollVotes||{};const myVote=votes[me.username]||null;
  const totalVotes=Object.keys(votes).length;
  const mode=m.pollMode||'single';const maxSel=m.pollMaxSelect||0;
  const options=m.pollOptions||[];
  const counts=options.map((_,i)=>Object.values(votes).filter(v=>Array.isArray(v)&&v.includes(i)).length);
  const isMulti=mode==='multi';
  const canVote=!ended&&!myVote;
  const showResult=!canVote&&(isAdmin||isCreator||!!myVote);
  const pctArr=counts.map(c=>totalVotes>0?Math.round(c/totalVotes*100):0);
  const tempSel=(window._pollSel&&window._pollSel[m.id])||[];
  const optsHTML=options.map((o,i)=>{
    const selected=Array.isArray(myVote)?myVote.includes(i):tempSel.includes(i);

    const sym=isMulti?'<div class="poll-square">'+(selected?'✓':'')+'</div>':'<div class="poll-circle">'+(selected?'✓':'')+'</div>';
    const pct=pctArr[i];
    const bar=showResult?`<div class="poll-fill" style="width:${pct}%"></div>`:'';
    const pctTag=showResult?`<div class="poll-pct">${pct}% · ${counts[i]}</div>`:'';
    return `<div class="${cls}" data-poll-opt="${i}" data-poll-msg="${m.id}">${bar}${sym}<div class="poll-text">${escapeHtml(o)}</div>${pctTag}</div>`;
  }).join('');
  const deadlineText=ended?`<div class="poll-end">已結束</div>`:`<div>將於約 ${Math.max(1,Math.ceil((m.pollDeadline-now)/3600000))} 小時後結束</div>`;
  const confirmBtn=canVote&&tempSel.length>0?`<button class="poll-confirm" data-action="pollConfirmVote" data-arg="${m.id}">確認投票</button>`:'';

}

function pickTextColor(hex){ const h=String(hex).replace('#','');if(h.length!==6)return '#fff';const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);const lum=(0.299*r+0.587*g+0.114*b)/255;return lum>0.6?'#111':'#fff'; }
function lightenColor(hex,amt){ const h=String(hex).replace('#','');if(h.length!==6)return hex;let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);r=Math.min(255,r+amt);g=Math.min(255,g+amt);b=Math.min(255,b+amt);return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function darkenColor(hex,amt){ const h=String(hex).replace('#','');if(h.length!==6)return hex;let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);r=Math.max(0,r-amt);g=Math.max(0,g-amt);b=Math.max(0,b-amt);return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }

    for(const k in allVal){const u=allVal[k];if(u.class===cls&&u.seat===seat){errEl.textContent='此班別座號已存在';return;}}
    const usedColors=Object.values(allVal).map(u=>u.color).filter(c=>c&&/^#[0-9a-fA-F]{6}$/.test(c));
    const newColor=generateUniqueColor(usedColors);
    await set(ref(db,'users/'+username),{username,password,displayName,seat,class:cls,color:newColor,role:'member',avatar:null,banned:null,disabled:false,neverLoggedIn:true,createdAt:Date.now()});

function generateUniqueColor(existing){
  function randHex(){return Math.floor(Math.random()*16777216);}
  function hexStr(n){return '#'+n.toString(16).padStart(6,'0');}
  function rgb(n){return [(n>>16)&255,(n>>8)&255,n&255];}
  function diff(a,b){return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2]);}
  const existRGB=existing.map(h=>{const hh=h.replace('#','');return [parseInt(hh.substr(0,2),16),parseInt(hh.substr(2,2),16),parseInt(hh.substr(4,2),16)];});
  for(let i=0;i<1000;i++){const n=randHex();const c=rgb(n);const lum=(0.299*c[0]+0.587*c[1]+0.114*c[2])/255;if(lum<0.2)continue;let ok=true;for(const e of existRGB){if(diff(c,e)<100){ok=false;break;}}if(ok)return hexStr(n);}
  return hexStr(randHex());
}

async function handleRequest(key,action){
  if(!key)return;
  const snap=await get(ref(db,'requests/'+key));if(!snap.exists())return;
  const req=snap.val();
  if(action==='approve'){
    if(req.type==='appeal'){
      const nSnap=await get(ref(db,'systemNotices/'+req.from+'/'+req.noticeKey));
      if(nSnap.exists()){
        const n=nSnap.val();
        if(n.msgId){
          const mSnap=await get(query(ref(db,'messages'),limitToLast(300)));
          const mVal=mSnap.val()||{};
          const mkey=Object.keys(mVal).find(k=>mVal[k].id===n.msgId);
          if(mkey){await update(ref(db,'messages/'+mkey),{deleted:false,deletedAt:null,deletedBy:null});}
        }
      }
      await pushSystemNotice(req.from,{type:'appeal_approved',title:'申訴成功',body:'你的申訴已通過，訊息已恢復。',createdAt:Date.now(),read:false});
    } else if(req.msgId){
      const mSnap=await get(query(ref(db,'messages'),limitToLast(300)));
      const mVal=mSnap.val()||{};
      const mkey=Object.keys(mVal).find(k=>mVal[k].id===req.msgId);
      if(mkey)await update(ref(db,'messages/'+mkey),{deleted:true,deletedAt:Date.now(),deletedBy:me.username});
    }
    await update(ref(db,'requests/'+key),{status:'approved',handledAt:Date.now(),handledBy:me.username});
  } else {
    await update(ref(db,'requests/'+key),{status:'rejected',handledAt:Date.now(),handledBy:me.username});
    if(req.type==='appeal'&&req.from){ await pushSystemNotice(req.from,{type:'appeal_rejected',title:'申訴被拒絕',body:'你的申訴已被拒絕。',createdAt:Date.now(),read:false}); }
  }
  renderAdminTab('requests');
}

      return `<div class="sn-card"><div class="sn-card-title">${escapeHtml(n.title||'系統通知')}</div><div class="sn-card-time">${time}</div><div class="sn-card-body">${n.html?n.html:escapeHtml(n.body||'').replace(/\n/g,'<br>')}</div>${actions?`<div class="sn-card-actions">${actions}</div>`:''}</div>`;
    }).join('');
  }
  pageRoot.innerHTML=`<div class="fullPage" id="systemNoticeOverlay"><div class="sn-header"><button class="sn-back" data-action="closePage">←</button><div class="sn-title">${SYS_NOTICE_ICON} ${SYS_NOTICE_NAME}</div></div><div class="sn-body">${bodyHTML}</div></div>`;
}
async function adminSendSystemNotice(){ if(me.role!=='superadmin'&&me.role!=='admin')return; const target=prompt('發送給（all 或 username）：'); if(!target)return; const title=prompt('標題：'); if(!title)return; const body=prompt('內容：'); if(!body)return; const targets=target==='all'?Object.keys(allUsers).filter(u=>u!==AI_NAME):[target]; for(const t of targets){ await pushSystemNotice(t,{type:'admin_system',title,body,createdAt:Date.now(),read:false}); } showNotif('已發送'); }
async function adminDeleteSystemNotice(key){ await remove(ref(db,'systemNotices/'+me.username+'/'+key)); showNotif('已刪除'); openSystemNotice(); }

let _groupDraft={selected:{},search:''};
function openCreateGroup(){ if(!me)return;_groupDraft={selected:{},search:''};renderCreateGroupPage(); }
function renderCreateGroupPage(){
  const allList=Object.values(allUsers).filter(u=>u.role!=='ai'&&u.username!==me.username).sort((a,b)=>{const ca=a.class||'';const cb=b.class||'';if(ca!==cb)return ca.localeCompare(cb);return (a.seat||0)-(b.seat||0);});
  const kw=_groupDraft.search.toLowerCase();
  const filtered=kw?allList.filter(u=>(u.username||'').toLowerCase().includes(kw)||(u.displayName||'').toLowerCase().includes(kw)||(u.class||'').toLowerCase().includes(kw)):allList;
  const groups={};
  filtered.forEach(u=>{const c=u.class||'（無班別）';if(!groups[c])groups[c]=[];groups[c].push(u);});
  let listHTML='';
  Object.keys(groups).sort().forEach(c=>{
    listHTML+=`<div class="section-title">${escapeHtml(c)}</div>`;
    listHTML+=groups[c].map(u=>{
      const sel=_groupDraft.selected[u.username];
      const av=u.avatar?(String(u.avatar).startsWith('data:')?`<img src="${u.avatar}">`:u.avatar):escapeHtml((u.displayName||u.username).charAt(0).toUpperCase());
      const color=(u.role==='superadmin'||u.role==='admin')?'#8b5cf6':(u.color||'#3b82f6');
      return `<div class="member-pick-item ${sel?'selected':''}" data-action="toggleMemberPick" data-arg="${u.username}"><div class="mp-avatar" style="background:${color}">${av}</div><div class="mp-info"><div class="mp-name">${escapeHtml(u.displayName||u.username)}</div><div class="mp-sub">${escapeHtml(u.class||'')} #${u.seat||''} · ${u.username}</div></div><div class="mp-check">${sel?'✓':''}</div></div>`;
    }).join('');
  });
  pageRoot.innerHTML=`<div class="fullPage"><div class="fp-header"><button class="fp-back" data-action="closePage">←</button><div class="fp-title">建立群聊</div></div><div class="fp-body" style="padding:0"><div style="padding:12px 16px;background:var(--bg-card);border-bottom:1px solid var(--border)"><input type="text" id="groupNameInput" placeholder="輸入群聊名稱（最多 50 字）" maxlength="50" style="width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:14px;outline:none;font-family:inherit"><div class="err" id="groupErr"></div><div style="margin-top:10px;font-size:12px;color:var(--text-sub)">選擇成員（已選 ${Object.keys(_groupDraft.selected).length} 人）</div><input type="text" id="memberSearchInput" placeholder="搜索成員..." style="width:100%;margin-top:8px;padding:9px 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:13px;outline:none;font-family:inherit"></div>${listHTML}<div style="height:80px"></div></div><div style="padding:10px 12px;background:var(--bg-card);border-top:1px solid var(--border)"><button class="btn-primary" style="margin:0;width:100%" data-action="submitCreateGroup">建立群聊</button></div></div>`;
  document.getElementById('memberSearchInput').value=_groupDraft.search;
  document.getElementById('memberSearchInput').addEventListener('input',e=>{_groupDraft.search=e.target.value;const n=document.getElementById('groupNameInput').value;renderCreateGroupPage();document.getElementById('groupNameInput').value=n;});
}
function toggleMemberPick(username){
  if(_groupDraft.selected[username])delete _groupDraft.selected[username];
  else _groupDraft.selected[username]=true;
  const tmpName=document.getElementById('groupNameInput')?document.getElementById('groupNameInput').value:'';
  const tmpSearch=document.getElementById('memberSearchInput')?document.getElementById('memberSearchInput').value:'';
  renderCreateGroupPage();
  document.getElementById('groupNameInput').value=tmpName;
  document.getElementById('memberSearchInput').value=tmpSearch;
}
async function submitCreateGroup(){
  const nameInput=document.getElementById('groupNameInput');
  const name=(nameInput?nameInput.value:'').trim();
  const errEl=document.getElementById('groupErr');
  if(!name){if(errEl)errEl.textContent='請輸入群聊名稱';return;}
  if(name.length>50){if(errEl)errEl.textContent='群聊名稱最多 50 字';return;}
  if(name===SYS_NOTICE_NAME){if(errEl)errEl.textContent='此名稱為系統保留';return;}
  const sel=Object.keys(_groupDraft.selected);
  if(sel.length<1){if(errEl)errEl.textContent='最少要選 1 個人';return;}
  try{
    const exist=await get(child(ref(db),'groups/'+name));
    if(exist.exists()){if(errEl)errEl.textContent='群名已存在，請換一個';return;}
    const members={};
    members[me.username]=true;
    sel.forEach(u=>{members[u]=true;});
    await set(ref(db,'groups/'+name),{name,creator:me.username,createdAt:Date.now(),members,lastMsg:'',lastAt:Date.now(),msgCounter:0});
    await writeLog('group','建立群聊 '+name);
    showNotif('群聊已建立');
    setTimeout(()=>openGroupChat(name),500);
  }catch(e){if(errEl)errEl.textContent=e.message;}
}
async function openGroupChat(groupKey){
  if(!me)return;
  const snap=await get(child(ref(db),'groups/'+groupKey));
  if(!snap.exists()){showNotif('群聊不存在');return;}
  const g=snap.val();
  if(!g.members||!g.members[me.username]){showNotif('你不在這個群聊');return;}
  currentGroupKey=groupKey;
  if(unsubGroupMsgs)unsubGroupMsgs();
  unsubGroupMsgs=onValue(ref(db,'groupMessages/'+groupKey),snap2=>{
    const val=snap2.val()||{};
    currentGroupMsgs=Object.keys(val).map(k=>({_key:k,...val[k]})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    renderGroupChat(groupKey,g);
  });
  renderGroupChat(groupKey,g);
}
function renderGroupChat(groupKey,g){
  const memberCount=Object.keys(g.members||{}).length;
  const msgsHTML=currentGroupMsgs.length===0?`<div class="empty">還沒有訊息，說點什麼吧！</div>`:currentGroupMsgs.map(m=>{
    const isMe=m.username===me.username;
    const time=new Date(m.createdAt).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    const color=m.color||'#3b82f6';
    const av=m.avatar?(String(m.avatar).startsWith('data:')?`<img src="${m.avatar}">`:m.avatar):escapeHtml((m.displayName||m.username).charAt(0).toUpperCase());
    return `<div class="msg ${isMe?'me':''}"><div class="avatar" style="background:${color}">${av}</div><div class="bubble-wrap"><div class="meta">${escapeHtml(m.displayName||m.username)} · ${time}</div><div class="bubble" style="background:${color}">${escapeHtml(m.text||'').replace(/\n/g,'<br>')}</div></div></div>`;
  }).join('');
  if(!document.getElementById('privateChatScreen')){
    const div=document.createElement('div');
    div.id='privateChatScreen';
    div.innerHTML=`<div class="pc-header"><button class="pc-back" data-action="closePage">←</button><div style="flex:1;min-width:0"><div class="pc-title">${escapeHtml(groupKey)}</div><div class="pc-info">${memberCount} 人</div></div><button class="hbtn" data-action="leaveGroup" data-arg="${escapeHtml(groupKey)}">退出</button></div><div class="pc-body" id="pcBody">${msgsHTML}</div><div class="pc-input-bar"><input type="text" id="pcInput" placeholder="輸入訊息..." maxlength="5000"><button data-action="submitGroupMessage">送出</button></div>`;
    document.body.appendChild(div);
    const inp=document.getElementById('pcInput');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitGroupMessage();}});
  } else {
    document.getElementById('pcBody').innerHTML=msgsHTML;
    document.querySelector('#privateChatScreen .pc-title').textContent=groupKey;
    document.querySelector('#privateChatScreen .pc-info').textContent=memberCount+' 人';
  }
  const body=document.getElementById('pcBody');
  if(body)body.scrollTop=body.scrollHeight;
}
async function submitGroupMessage(){
  if(!me||!currentGroupKey)return;
  const inp=document.getElementById('pcInput');if(!inp)return;
  const text=inp.value.trim();if(!text)return;
  inp.value='';
  try{
    const gSnap=await get(child(ref(db),'groups/'+currentGroupKey));
    if(!gSnap.exists())return;
    const g=gSnap.val();
    const counter=(g.msgCounter||0)+1;
    const msgId=currentGroupKey+'_msg_'+counter;
    await update(ref(db,'groups/'+currentGroupKey),{msgCounter:counter,lastMsg:text,lastAt:Date.now()});
    await set(ref(db,'groupMessages/'+currentGroupKey+'/'+msgId),{id:msgId,username:me.username,displayName:me.displayName,seat:me.seat,cls:me.cls||'',color:me.color,avatar:me.avatar,role:me.role,text,type:'text',createdAt:Date.now(),deleted:false});
  }catch(e){showNotif('送出失敗');}
}
async function leaveGroup(groupKey){
  if(!me)return;
  if(!confirm('確定要退出群聊「'+groupKey+'」？'))return;
  try{
    await remove(ref(db,'groups/'+groupKey+'/members/'+me.username));
    await writeLog('group','退出群聊 '+groupKey);
    showNotif('已退出群聊');
    closePage();
    currentGroupKey=null;
    if(unsubGroupMsgs){unsubGroupMsgs();unsubGroupMsgs=null;}
  }catch(e){showNotif('退出失敗');}
}

function renderAIPrivate(){
  let msgsHTML='';
  if(aiPrivateMsgs.length===0){msgsHTML=`<div style="text-align:center;padding:30px 20px;color:var(--text-sub);font-size:14px;line-height:1.7">你好！我是小喆AI。這裡是我們單獨的對話，只有你能看到。</div>`;}
  else{
    msgsHTML=aiPrivateMsgs.map(m=>{
      const isMe=m.username===me.username;
      const isAI=m.role==='ai';
      const time=new Date(m.createdAt).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
      if(isAI&&m.thinking){return `<div class="msg thinking"><div class="avatar" style="background:${AI_COLOR}">AI</div><div class="bubble-wrap"><div class="meta">小喆AI · ${time}</div><div class="bubble">小喆AI 正在思考<span class="thinking-dots"><span></span><span></span><span></span></span></div></div></div>`;}
      const color=isAI?AI_COLOR:(me.color||'#3b82f6');
      const av=isAI?'AI':escapeHtml((me.displayName||me.username).charAt(0).toUpperCase());
      return `<div class="msg ${isMe?'me':''}"><div class="avatar" style="background:${color}">${av}</div><div class="bubble-wrap"><div class="meta">${isAI?'小喆AI':escapeHtml(m.displayName||m.username)} · ${time}</div><div class="bubble" style="background:${color}">${escapeHtml(m.text||'').replace(/\n/g,'<br>')}${isAI&&m.sponsor?'<span class="ai-sponsor">'+AI_SPONSOR+'</span>':''}</div></div></div>`;
    }).join('');
  }
  if(!document.getElementById('privateChatScreen')){
    const div=document.createElement('div');
    div.id='privateChatScreen';
    div.innerHTML=`<div class="pc-header"><button class="pc-back" data-action="closePage">←</button><div style="flex:1;min-width:0"><div class="pc-title">AI 私人聊天</div><div class="pc-info">只有你看到</div></div></div><div class="pc-body" id="pcBody">${msgsHTML}</div><div class="pc-input-bar"><input type="text" id="pcInput" placeholder="跟小喆AI聊天..." maxlength="5000"><button data-action="submitAIPrivateMessage">送出</button></div>`;
    document.body.appendChild(div);
    const inp=document.getElementById('pcInput');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitAIPrivateMessage();}});
  } else {
    document.getElementById('pcBody').innerHTML=msgsHTML;
    document.querySelector('#privateChatScreen .pc-title').textContent='AI 私人聊天';
    document.querySelector('#privateChatScreen .pc-info').textContent='只有你看到';
  }
  const body=document.getElementById('pcBody');
  if(body)body.scrollTop=body.scrollHeight;
}
async function submitAIPrivateMessage(){
  if(!me)return;
  const inp=document.getElementById('pcInput');if(!inp)return;
  const text=inp.value.trim();if(!text)return;
  inp.value='';
  try{
    const msgKey='aiPri_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    await set(ref(db,'aiPrivateChat/'+me.username+'/'+msgKey),{username:me.username,displayName:me.displayName,role:me.role,text,createdAt:Date.now()});
    const thinkKey='aiPri_think_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    await set(ref(db,'aiPrivateChat/'+me.username+'/'+thinkKey),{username:'ai',role:'ai',text:'',thinking:true,createdAt:Date.now()+1});
    const recent=aiPrivateMsgs.slice(-30).map(m=>`${m.role==='ai'?'小喆AI':(m.displayName||m.username)}: ${m.text||''}`).join('\n');
    const sys=`你是「小喆AI」，正在跟「${me.displayName}」單獨私人聊天。這段對話只有你們兩人看得到。溫柔、活潑，可以用 emoji。\n\n【最近對話】\n${recent||'（還沒開始）'}\n\n【用戶說】\n${text}`;
    const aiRes=await callAI([{role:'system',content:sys},{role:'user',content:text}]);
    if(aiRes){await update(ref(db,'aiPrivateChat/'+me.username+'/'+thinkKey),{text:aiRes.content,thinking:false,reasoning:aiRes.reasoning||'',sponsor:true,createdAt:Date.now()});}
    else{await update(ref(db,'aiPrivateChat/'+me.username+'/'+thinkKey),{text:'抱歉，我現在有點忙',thinking:false});}
  }catch(e){showNotif('送出失敗');}
}

function linkContinue(){ if(pendingLink)window.open(pendingLink,'_blank','noopener');linkCancel(); }
function linkCancel(){ const el=document.getElementById('linkWarnOverlay');if(el)el.remove();pendingLink=''; }
document.addEventListener('click',e=>{ const link=e.target.closest('a[data-action="linkCheck"]');if(!link)return;e.preventDefault();const url=link.dataset.arg;if(url.startsWith('https://oscar114515.github.io/'))window.open(url,'_blank','noopener');else showLinkWarning(url); });
function showNotif(text){ const el=document.createElement('div');el.id='notifBanner';el.textContent=text;document.body.appendChild(el);setTimeout(()=>el.remove(),3000); }

document.getElementById('themeToggleLogin').addEventListener('change',e=>setTheme(e.target.checked?'light':'dark'));
document.getElementById('themeToggleChat').addEventListener('change',e=>setTheme(e.target.checked?'light':'dark'));
encCheckbox.addEventListener('change',()=>{encToggle.classList.toggle('active',encCheckbox.checked);});
const _langLogin=document.getElementById('langSelectLogin');if(_langLogin)_langLogin.addEventListener('change',e=>setLang(e.target.value));
const _langChat=document.getElementById('langSelectChat');if(_langChat)_langChat.addEventListener('change',e=>setLang(e.target.value));

applyTheme();
applyLang();
initVoiceRecorder();
document.addEventListener('click',()=>{ if(!versionMismatchShown)checkVersion(); },true);
window.addEventListener('load',()=>{ setTimeout(checkVersion,500); });

(async function boot(){
  await checkVersion();
  const saved=sessionStorage.getItem('chat_me');
  if(!saved){try{await ensureAIUser();}catch(e){}return;}
  try{
    const u=JSON.parse(saved);
    const snap=await get(child(ref(db),'users/'+u.username));
    if(!snap.exists()){sessionStorage.removeItem('chat_me');return;}
    const data=snap.val();
    if(data.disabled===true){sessionStorage.removeItem('chat_me');return;}
    if(data.banned&&data.banned.type==='severe'){sessionStorage.removeItem('chat_me');return;}
    me={username:data.username,displayName:data.displayName||data.username,seat:data.seat,cls:data.class||'',color:data.color||'#3b82f6',role:data.role||'member',avatar:data.avatar||null,banned:data.banned||null};
    if(data.theme){theme=data.theme;localStorage.setItem('chat_theme',theme);applyTheme();}
    if(data.lang&&['zh-Hant','zh-Hans','en'].includes(data.lang)){lang=data.lang;localStorage.setItem('chat_lang',lang);applyLang();}
    try{await set(ref(db,'presence/'+me.username),Date.now());}catch(e){}
    try{await ensureAIUser();}catch(e){}
    enterChat();
  }catch(e){sessionStorage.removeItem('chat_me');}
})();
</script>
</body>
</html>
