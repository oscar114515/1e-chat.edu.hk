<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>班級聊天室</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  :root{--bg-app:#0f172a;--bg-header:linear-gradient(90deg,#1e293b,#0f172a);--bg-card:#1e293b;--bg-input:rgba(15,23,42,.6);--text-main:#e2e8f0;--text-sub:#94a3b8;--text-muted:#64748b;--border:rgba(148,163,184,.15);--border-strong:rgba(148,163,184,.3);--primary:#3b82f6;--primary-2:#2563eb}
  body.theme-light{--bg-app:#f0f2f5;--bg-header:linear-gradient(90deg,#ffffff,#f8fafc);--bg-card:#ffffff;--bg-input:#f0f2f5;--text-main:#1c1e21;--text-sub:#65676b;--text-muted:#8a8d91;--border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.15)}
  body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg-app);color:var(--text-main);overflow:hidden;height:100vh;height:100dvh;transition:background .3s,color .3s}
  .hidden{display:none!important}
  #loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg-app);padding:20px;overflow-y:auto;height:100vh;height:100dvh}
  #loginCard{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:32px 26px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:fadeUp .5s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  #loginCard h1{font-size:22px;text-align:center;margin-bottom:6px}
  #loginCard .sub{font-size:13px;text-align:center;color:var(--text-sub);margin-bottom:20px}
  .top-controls{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
  .lang-select{padding:6px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:12px;font-family:inherit;outline:none;cursor:pointer}
  .field{margin-bottom:14px}
  .field input{width:100%;padding:13px 15px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:15px;outline:none;font-family:inherit}
  .field input:focus{border-color:var(--primary)}
  #loginBtn{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  #loginBtn:disabled{opacity:.6}
  #loginError{color:#f87171;font-size:13px;text-align:center;min-height:18px;margin-bottom:8px;white-space:pre-wrap}
  #loginVersion{text-align:center;font-size:11px;color:var(--text-muted);margin-top:14px}
  #chatScreen{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{background:var(--bg-header);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);flex-shrink:0;min-height:52px}
  header .title{font-size:15px;font-weight:600;white-space:nowrap;flex-shrink:0}
  header .right{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-sub);flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
  .ver{background:rgba(56,189,248,.15);color:#38bdf8;padding:3px 7px;border-radius:6px;font-size:10.5px;font-weight:600}
  .hbtn{background:rgba(148,163,184,.15);color:var(--text-main);border:none;padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;position:relative}
  .hbtn:hover{background:rgba(148,163,184,.3)}
  .hbtn.admin{background:rgba(139,92,246,.25);color:#a78bfa}
  .hbtn .dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;background:#ef4444;color:#fff;border-radius:8px;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
  @media(max-width:520px){header{padding:8px 10px;min-height:auto;flex-direction:column;align-items:stretch;gap:6px}header .title{font-size:14px}header .right{width:100%;justify-content:space-between}.hbtn{font-size:11.5px;padding:5px 9px;flex:1;text-align:center}.ver{font-size:10px}}
  #noticeBar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(251,191,36,.12);border-bottom:1px solid rgba(251,191,36,.25);flex-shrink:0;font-size:13px;cursor:pointer;position:relative}
  body.theme-light #noticeBar{background:rgba(251,191,36,.15)}
  #noticeBar:hover{background:rgba(251,191,36,.2)}
  #noticeBar .notice-icon{color:#fbbf24;font-size:14px;flex-shrink:0;font-weight:700}
  #noticeBar .notice-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #noticeBar .notice-text .label{color:#fbbf24;font-weight:600;margin-right:6px}
  #noticeBar .notice-add{background:#fbbf24;color:#1c1917;border:none;width:32px;height:32px;border-radius:8px;font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  #noticeBar .notice-add:hover{transform:scale(1.05);background:#fcd34d}
  #noticeBar .notice-pin-count{background:rgba(251,191,36,.3);color:#fbbf24;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;flex-shrink:0}
  #classStatus{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 12px;background:rgba(30,41,59,.5);border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-sub);flex-shrink:0}
  body.theme-light #classStatus{background:rgba(255,255,255,.7)}
  #classStatus .online{color:#4ade80;font-weight:600}
  #classStatus .ban-item{background:rgba(220,38,38,.15);color:#fca5a5;padding:2px 8px;border-radius:6px;font-size:11px}
  #classStatus .ban-item.light{background:rgba(234,88,12,.15);color:#fdba74}
  #searchBar{display:flex;gap:8px;padding:8px 12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center}
  #searchInput{flex:1;padding:8px 12px;border-radius:18px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:13px;outline:none;font-family:inherit}
  #searchCount{font-size:11.5px;color:var(--text-sub)}
  #chatBox{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg-app);-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
  #chatBox::-webkit-scrollbar{width:6px}
  #chatBox::-webkit-scrollbar-thumb{background:rgba(148,163,184,.3);border-radius:3px}
  .msg{max-width:75%;display:flex;gap:10px;align-items:flex-start;position:relative}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;user-select:none;overflow:hidden;cursor:pointer}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .bubble-wrap{display:flex;flex-direction:column;gap:3px;position:relative;min-width:0}
  .msg.me .bubble-wrap{align-items:flex-end}
  .meta{font-size:11px;color:var(--text-muted);padding:0 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .meta .msgid{color:var(--text-muted);font-size:10px;font-family:monospace}
  .bubble{padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap;color:#fff;max-width:100%}
  .msg.me .bubble{border-bottom-right-radius:4px}
  .msg:not(.me) .bubble{border-bottom-left-radius:4px}
  .bubble .mention{background:rgba(255,255,255,.25);padding:1px 5px;border-radius:4px;font-weight:600}
  .bubble img.msg-img{max-width:220px;max-height:220px;border-radius:8px;display:block;cursor:pointer;margin-top:4px}
  .bubble .file-msg{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
  .bubble .file-msg .fi{font-size:16px;font-weight:700}
  .bubble .file-msg .fn{font-size:13px;word-break:break-all;flex:1}
  .bubble .file-msg .fs{font-size:11px;opacity:.8}
  .bubble .voice-msg{display:flex;align-items:center;gap:10px;padding:4px 0;cursor:pointer;min-width:120px}
  .bubble .voice-msg .vi{font-size:14px;font-weight:700}
  .bubble .voice-msg .vt{font-size:13px}
  .bubble .voice-msg .vp{flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
  .bubble .voice-msg .vp>div{height:100%;width:0;background:#fff;transition:width .1s}
  .bubble .voice-msg .vd{width:8px;height:8px;border-radius:50%;background:#f87171;flex-shrink:0}
  .bubble .voice-msg.played .vd{display:none}
  .bubble .loc-msg{cursor:pointer;max-width:240px}
  .bubble .loc-msg .lm-map{width:220px;height:150px;border-radius:8px;overflow:hidden;background:#222;margin-bottom:6px}
  .bubble .loc-msg .lm-map img{width:100%;height:100%;object-fit:cover}
  .bubble .loc-msg .lm-label{font-size:12px;display:flex;align-items:center;gap:4px}
  .msg-tools{display:flex;gap:4px;margin-top:2px;opacity:0;flex-wrap:wrap}
  .msg-tools button{background:rgba(148,163,184,.15);color:var(--text-sub);border:none;padding:2px 7px;border-radius:6px;font-size:10.5px;cursor:pointer;font-family:inherit}
  .msg-tools button:hover{background:rgba(148,163,184,.3);color:var(--text-main)}
  .msg-tools button.danger:hover{background:rgba(220,38,38,.3);color:#fca5a5}
  #inputBar{padding:10px 12px;background:var(--bg-card);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-shrink:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));position:relative}
  #micBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  #micBtn.recording{background:#dc2626;color:#fff}
  #msgInput{flex:1;padding:11px 14px;border-radius:22px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:14px;outline:none;font-family:inherit;min-width:0}
  #plusBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:22px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  #sendBtn{width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  #plusPanel{position:absolute;bottom:calc(100% + 8px);left:12px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:16px;padding:14px;display:grid;grid-template-columns:repeat(3,72px);gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:50;transform-origin:bottom left}
  #plusPanel .pi{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px;border-radius:12px}
  #plusPanel .pi .pic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:rgba(56,189,248,.2);color:#38bdf8}
  #plusPanel .pi .pit{font-size:11px;color:var(--text-sub)}
  #recordingOverlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
  #recordingOverlay .rec-timer{font-size:42px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
  #recordingOverlay .rec-hint{font-size:14px;color:#cbd5e1}
  #recordingOverlay .rec-cancel{color:#f87171;font-size:16px;font-weight:600;display:none}
  #mentionPopup{position:absolute;bottom:100%;left:12px;right:12px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:12px;max-height:220px;overflow-y:auto;box-shadow:0 -8px 24px rgba(0,0,0,.5);margin-bottom:6px}
  #mentionPopup .mention-item{padding:10px 14px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:10px}
  #mentionPopup .mention-item .mi-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden}
  #mentionPopup .mention-item .mi-av img{width:100%;height:100%;object-fit:cover}
  .empty{text-align:center;color:var(--text-muted);padding:40px 0;font-size:14px}
  .fullPage{position:fixed;inset:0;background:var(--bg-app);z-index:100;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
  .fullPage .fp-header{padding:12px 16px;display:flex;align-items:center;gap:12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0}
  .fullPage .fp-back{background:rgba(148,163,184,.15);color:var(--text-main);border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
  .fullPage .fp-title{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fullPage .fp-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .fullPage .fp-body::-webkit-scrollbar{width:6px}
  .fullPage .fp-body::-webkit-scrollbar-thumb{background:rgba(148,163,184,.3);border-radius:3px}
  .profile-hero{padding:32px 20px 24px;text-align:center;position:relative}
  .profile-hero .hero-avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;color:#fff;overflow:hidden;border:4px solid rgba(255,255,255,.25);position:relative}
  .profile-hero .hero-avatar img{width:100%;height:100%;object-fit:cover}
  .profile-hero .hero-name{font-size:24px;font-weight:700;margin-bottom:4px}
  .profile-hero .hero-sub{font-size:14px;opacity:.9}
  .profile-hero .hero-badge{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;background:rgba(255,255,255,.25)}
  .profile-content{padding:20px 20px 40px}
  .section-title{font-size:13px;color:var(--text-sub);margin:18px 0 10px;font-weight:600}
  .form-row{margin-bottom:14px}
  .form-row input[type=text],.form-row input[type=password],.form-row textarea,.form-row select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:14px;outline:none;font-family:inherit}
  .form-row textarea{resize:vertical;min-height:120px;line-height:1.5}
  .char-count{text-align:right;font-size:11px;color:#4ade80;margin-top:4px}
  .char-count.over{color:#f87171}
  .btn-primary,.btn-danger,.btn-warn,.btn-ok,.btn-ghost{width:100%;padding:12px;border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}
  .btn-primary{background:linear-gradient(135deg,#3b82f6,#2563eb)}
  .btn-danger{background:linear-gradient(135deg,#dc2626,#b91c1c)}
  .btn-warn{background:linear-gradient(135deg,#ea580c,#c2410c)}
  .btn-ok{background:linear-gradient(135deg,#16a34a,#15803d)}
  .btn-ghost{background:rgba(148,163,184,.15);color:var(--text-main)}
  .btn-primary:disabled{opacity:.5}
  .avatar-options{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .av-opt{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:2px solid transparent;background:var(--bg-input)}
  .err{color:#f87171;font-size:12px;margin-top:6px;min-height:14px}
  .ok-msg{color:#4ade80;font-size:12px;margin-top:6px;min-height:14px}
  input[type=file]{display:none}
  .upload-btn{display:inline-block;padding:10px 16px;border-radius:10px;background:rgba(148,163,184,.2);color:var(--text-main);font-size:13px;cursor:pointer;font-family:inherit;border:1px dashed var(--border-strong);text-align:center;width:100%}
  .tabs{display:flex;padding:0 16px;border-bottom:1px solid var(--border);background:var(--bg-card);overflow-x:auto;flex-shrink:0}
  .tab{padding:12px 16px;text-align:center;font-size:13px;color:var(--text-sub);cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;background:none;border-left:none;border-right:none;border-top:none;white-space:nowrap;position:relative}
  .tab.active{color:#a78bfa;border-bottom-color:#8b5cf6;font-weight:600}
  .admin-body{padding:16px 18px 40px}
  .user-list{display:flex;flex-direction:column;gap:8px}
  .user-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg-input);border:1px solid var(--border);cursor:pointer}
  .user-card .uc-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
  .user-card .uc-avatar img{width:100%;height:100%;object-fit:cover}
  .user-card .uc-info{flex:1;min-width:0}
  .user-card .uc-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-card .uc-sub{font-size:11.5px;color:var(--text-sub);margin-top:2px}
  .user-card .uc-badge{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600;flex-shrink:0}
  .badge-ban-severe{background:rgba(220,38,38,.25);color:#fca5a5}
  .badge-ban-light{background:rgba(234,88,12,.25);color:#fdba74}
  .badge-admin{background:rgba(139,92,246,.25);color:#c4b5fd}
  .badge-super{background:rgba(239,68,68,.3);color:#fca5a5}
  .log-item{padding:10px 12px;border-radius:10px;background:var(--bg-input);border-left:3px solid #38bdf8;font-size:12.5px;margin-bottom:8px}
  .log-item.action-login{border-left-color:#4ade80}
  .log-item.action-logout{border-left-color:#94a3b8}
  .log-item.action-changepwd{border-left-color:#facc15}
  .log-item.action-changename{border-left-color:#a78bfa}
  .log-item.action-ban{border-left-color:#f87171}
  .log-item.action-delete{border-left-color:#fb7185}
  .log-item.action-notice{border-left-color:#fbbf24}
  .log-item .lt{color:var(--text-sub);font-size:11px}
  .log-item .lm{margin-top:3px;word-break:break-word}
  .ban-status{padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:13px}
  .ban-status.severe{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.4);color:#fca5a5}
  .ban-status.light{background:rgba(234,88,12,.15);border:1px solid rgba(234,88,12,.4);color:#fdba74}
  .ban-block{background:var(--bg-input);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
  .ban-block .ban-label{font-size:14px;font-weight:600}
  .ban-block .ban-sub{font-size:11.5px;color:var(--text-sub);margin-top:2px}
  .ban-type-buttons{display:flex;gap:8px;margin-top:12px}
  .ban-type-btn{flex:1;padding:10px 8px;border-radius:10px;background:var(--bg-input);color:var(--text-sub);border:2px solid var(--border);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;line-height:1.3}
  .ban-type-btn.selected.light{background:rgba(234,88,12,.25);color:#fdba74;border-color:#ea580c}
  .ban-type-btn.selected.severe{background:rgba(220,38,38,.25);color:#fca5a5;border-color:#dc2626}
  #carouselOverlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;display:flex;flex-direction:column;padding:20px;overflow:hidden}
  #carouselOverlay .car-top{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:14px;flex-shrink:0}
  #carouselOverlay .car-title{font-size:16px;font-weight:600}
  #carouselOverlay .car-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
  #carouselOverlay .car-stage{flex:1;min-height:0;display:flex;align-items:center;overflow-x:auto;scroll-snap-type:x mandatory;gap:16px;padding:0 12vw;scrollbar-width:none}
  #carouselOverlay .car-stage::-webkit-scrollbar{display:none}
  .car-card{flex:0 0 70vw;max-width:520px;background:#fff;color:#1c1e21;border-radius:16px;padding:20px;scroll-snap-align:center;overflow-y:auto;max-height:70vh;box-shadow:0 20px 40px rgba(0,0,0,.4)}
  .car-card h3{font-size:16px;margin-bottom:10px}
  .car-card .car-meta{font-size:11px;color:#666;margin-bottom:10px}
  .car-card .car-content{font-size:14px;line-height:1.6;word-break:break-word}
  .car-card .car-content img{max-width:100%;border-radius:8px;margin-top:8px}
  .car-card.reject{background:#fee;border:2px solid #f87171}

async function handleLogin(){
  const u = loginUsername.value.trim().toLowerCase();
  const p = loginPassword.value;
  loginError.textContent = '';
  if (!u || !p) { loginError.textContent = t('loginSub'); return; }
  loginBtn.disabled = true; loginBtn.textContent = t('loginBtnLoading');
  try {
    const snap = await get(child(ref(db),'users/'+u));
    if (!snap.exists()) { loginError.textContent = t('noUser'); return; }
    const data = snap.val();
    if (data.banned && data.banned.type === 'severe') { loginError.textContent = t('bannedSevere')+'\n'+t('reason')+'：'+(data.banned.reason||t('noReason')); return; }
    if (data.password !== p) { loginError.textContent = t('wrongPwd'); return; }
    me = { username:data.username, displayName:data.displayName||data.username, seat:data.seat, color:data.color||'#3b82f6', role:data.role||'member', avatar:data.avatar||null, banned:data.banned||null };
    sessionStorage.setItem('chat_me', JSON.stringify(me));
    await writeLog('login', t('loggedIn'));
    await setPresence();
    enterChat();
  } catch (e) { console.error(e); loginError.textContent = t('notifActionFail')+': '+(e.code||e.message); }
  finally { loginBtn.disabled = false; loginBtn.textContent = t('loginBtn'); }
}

async function handleLogout(){
  try{ await clearPresence(); }catch(e){}
  try{ await writeLog('logout', t('loggedOut')); }catch(e){}
  me = null; sessionStorage.removeItem('chat_me');
  [unsubMsg,unsubUsers,unsubRequests,unsubPresence,unsubNotices,unsubMyReads,unsubPendingNotices,unsubMyRejections,unsubMentions,unsubThanks].forEach(fn=>fn&&fn());
  unsubMsg = unsubUsers = unsubRequests = unsubPresence = unsubNotices = unsubMyReads = unsubPendingNotices = unsubMyRejections = unsubMentions = unsubThanks = null;
  closePage();
  chatScreen.classList.add('hidden'); loginScreen.classList.remove('hidden');
  loginUsername.value = ''; loginPassword.value = '';
}

function enterChat(){
  loginScreen.classList.add('hidden'); chatScreen.classList.remove('hidden');
  if (me.role === 'superadmin' || me.role === 'admin') adminBtn.classList.remove('hidden'); else adminBtn.classList.add('hidden');
  subscribeMessages(); subscribeUsers(); subscribeRequests(); subscribePresence();
  subscribeNotices(); subscribeMyReads(); subscribePendingNotices(); subscribeMyRejections(); subscribeMentions(); subscribeThanks();
}

async function writeLog(action, detail){
  if (!me) return;
  const id = 'log_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  await set(ref(db,'logs/'+id), { action, detail, username:me.username, displayName:me.displayName, seat:me.seat, role:me.role, createdAt:Date.now() });
}
async function setPresence(){ if(me) await set(ref(db,'presence/'+me.username), { lastSeen: Date.now() }); }
async function clearPresence(){ if(me) await remove(ref(db,'presence/'+me.username)); }
setInterval(() => { if (me) setPresence(); }, 30000);
window.addEventListener('beforeunload', () => { if (me) clearPresence(); });

async function sendMessage(){
  const text = msgInput.value.trim();
  if (!text || !me) return;
  if (me.banned && me.banned.type === 'light') { showNotif(t('bannedLight')+'：'+(me.banned.reason||t('noReason'))); return; }
  sendBtn.disabled = true;
  try {
    const c = await get(child(ref(db),'meta/msgCounter'));
    const next = (c.exists()?c.val():0) + 1;
    await set(ref(db,'meta/msgCounter'), next);
    const msgId = 'msg_'+String(next).padStart(4,'0');
    await set(ref(db,'messages/'+msgId), { id:msgId, username:me.username, displayName:me.displayName, seat:me.seat, color:me.color, avatar:me.avatar, role:me.role, text, type:'text', createdAt:Date.now(), deleted:false });
    const mentions = extractMentions(text);
    for (const uname of mentions) {
      if (uname === me.username) continue;
      await push(ref(db,'mentions/'+uname), { from:me.username, fromName:me.displayName, text, msgId, createdAt:Date.now(), read:false });
    }
    await writeLog('send', t('sentMsg')+'：'+text.slice(0,50));
    msgInput.value = ''; mentionPopup.classList.add('hidden');
  } catch(e) { console.error(e); showNotif(t('sendFail')+': '+(e.code||e.message)); }
  finally { sendBtn.disabled = false; msgInput.focus(); }
}

async function sendMedia(type, payload){
  if (!me) return;
  if (me.banned && me.banned.type === 'light') { showNotif(t('bannedLight')); return; }
  try {
    const c = await get(child(ref(db),'meta/msgCounter'));
    const next = (c.exists()?c.val():0) + 1;
    await set(ref(db,'meta/msgCounter'), next);
    const msgId = 'msg_'+String(next).padStart(4,'0');
    await set(ref(db,'messages/'+msgId), { id:msgId, username:me.username, displayName:me.displayName, seat:me.seat, color:me.color, avatar:me.avatar, role:me.role, ...payload, type, createdAt:Date.now(), deleted:false });
    await writeLog('send', t('sentMsg'));
  } catch(e) { console.error(e); showNotif(t('sendFail')); }
}

function extractMentions(text){
  const re = /@([a-zA-Z0-9_]+)/g; const out=[]; let m;
  while ((m = re.exec(text)) !== null) { const u = m[1].toLowerCase(); if (allUsers[u]) out.push(u); }
  return out;
}

msgInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && mentionPopup.classList.contains('hidden')) { e.preventDefault(); sendMessage(); } });
msgInput.addEventListener('input', () => {
  const val = msgInput.value, cursor = msgInput.selectionStart;
  const at = val.slice(0,cursor).match(/@([a-zA-Z0-9_]*)$/);
  if (!at) { mentionPopup.classList.add('hidden'); return; }
  showMentionPopup(at[1].toLowerCase());
});

function showMentionPopup(kw){
  const list = Object.values(allUsers).filter(u => u.username !== (me&&me.username))
    .filter(u => !kw || u.username.toLowerCase().includes(kw) || (u.displayName||'').toLowerCase().includes(kw)).slice(0,8);
  if (list.length === 0) { mentionPopup.classList.add('hidden'); return; }
  mentionPopup.classList.remove('hidden');
  mentionPopup.innerHTML = list.map(u => {
    const isAdmin = u.role === 'superadmin' || u.role === 'admin';
    const color = isAdmin ? '#8b5cf6' : (u.color || '#3b82f6');
    const av = u.avatar ? (String(u.avatar).startsWith('data:')?`<img src="${u.avatar}">`:u.avatar) : escapeHtml((u.displayName||u.username).charAt(0).toUpperCase());
    return `<div class="mention-item" data-action="pickMention" data-arg="${u.username}"><div class="mi-av" style="background:${color}">${av}</div><div>${escapeHtml(u.displayName||u.username)} (#${u.seat})</div></div>`;
  }).join('');
}

function pickMention(username){
  const v = msgInput.value, cur = msgInput.selectionStart;
  msgInput.value = v.slice(0,cur).replace(/@([a-zA-Z0-9_]*)$/, '@'+username+' ') + v.slice(cur);
  mentionPopup.classList.add('hidden'); msgInput.focus();
}

function subscribeMessages(){
  if (unsubMsg) unsubMsg();
  unsubMsg = onValue(query(ref(db,'messages'), limitToLast(300)), snap => {
    const val = snap.val() || {}; const now = Date.now();
    messages = Object.keys(val).map(k => ({ _key:k, ...val[k] }))
      .filter(m => { if (!m.deleted) return true; if (me.role === 'superadmin' || me.role === 'admin') return (now-(m.deletedAt||0))<2*3600*1000; return false; })
      .sort((a,b) => (a.createdAt||0)-(b.createdAt||0));
    render();
  });
}
function subscribeUsers(){
  if (unsubUsers) unsubUsers();
  unsubUsers = onValue(ref(db,'users'), snap => { allUsers = snap.val()||{}; renderClassStatus(); checkPendingNoticeNotif(); });
}
function subscribeRequests(){
  if (unsubRequests) unsubRequests();
  unsubRequests = onValue(ref(db,'requests'), snap => { requests = snap.val()||{}; for(const k in requests) if (typeof requests[k]==='object') requests[k]._key = k; updateAdminDot(); });
}
function subscribePresence(){
  if (unsubPresence) unsubPresence();

}
function subscribeNotices(){

function subscribePendingNotices(){

function subscribeMyRejections(){

    const content = renderNoticeContent(n);

    const center = stage.scrollLeft + stage.clientWidth/2;

async function markRead(key){ if (!me || !key || myNoticeReads[key]) return; try { await set(ref(db,'noticeReads/'+me.username+'/'+key), Date.now()); } catch(e){} }

function renderNoticeContent(n){
  let content = n.html ? n.html : escapeHtml(n.text||'').replace(/\n/g,'<br>');
  content = content.replace(/(https?:\/\/[^\s<>"']+)/g, url => `<a href="#" data-action="linkCheck" data-arg="${escapeHtml(url)}" style="color:#3b82f6">${escapeHtml(url)}</a>`);
  if (n.images && n.images.length > 0) {
    n.images.forEach(img => { if (/^https?:/.test(img)) content += `<img src="${escapeHtml(img)}">`; else content += `<img src="${img}">`; });
  }
  return content;
}

function renderNoticeBar(){
  const active = notices.filter(n => !n.deleted);
  if (active.length === 0) {
    noticeBar.innerHTML = `<span class="notice-icon">[公告]</span><div class="notice-text" style="color:var(--text-sub)">${t('noNotice')}</div><button class="notice-add" data-action="openNoticeCreate">+</button>`;
    return;
  }
  const pinned = active.filter(n => n.pinned);
  const latest = active.filter(n => !n.pinned).sort((a,b) => b.createdAt-a.createdAt)[0];
  let html = '<span class="notice-icon">[公告]</span>';
  if (pinned.length === 1) {
    const p = pinned[0];
    const preview = (p.text || '').replace(/<[^>]*>/g,'').slice(0,40);
    html += `<span class="notice-pin-count" data-action="openPinnedList" style="cursor:pointer">${t('noticePinTag')}: ${escapeHtml(preview)}${preview.length>=40?'...':''}</span>`;
  } else if (pinned.length > 1) {
    html += `<span class="notice-pin-count" data-action="openPinnedList" style="cursor:pointer">${t('noticePinTag')} x${pinned.length}</span>`;
  }
  if (latest) {
    const preview = (latest.text || latest.html || '').replace(/<[^>]*>/g,'').slice(0,50);
    html += `<div class="notice-text" data-action="openNoticeDetail" data-arg="${latest._key}" style="cursor:pointer"><span class="label">${t('noticeLatest')}</span>${escapeHtml(preview)}${preview.length>=50?'...':''}</div>`;

async function openNoticeFullscreen(key, customList){
  const list = customList || notices.filter(n => !n.deleted);
  if (list.length === 0) return;
  if (!myNoticeReads[key]) markRead(key);
  const isAdmin = me.role === 'superadmin' || me.role === 'admin';
  const cards = list.map(n => {
    const time = new Date(n.createdAt).toLocaleString(lang==='en'?'en-US':'zh-TW');
    const content = renderNoticeContent(n);
    let apply = '';
    if (n.fromUser && n.editedBy) apply = `<div style="font-size:11px;color:#fbbf24;margin-bottom:8px">${t('noticeEditedBy')}${escapeHtml(n.fromName||n.fromUser)}${t('noticeAdminEdited')}</div>`;
    else if (n.fromUser) apply = `<div style="font-size:11px;color:#94a3b8;margin-bottom:8px">${t('noticeApplyBy')}${escapeHtml(n.fromName||n.fromUser)}</div>`;
    return `<div class="car-card ${n._key===key?'active':''}" data-key="${n._key}"><h3>${n.pinned?'['+t('noticePinTag')+'] ':''}${t('noticeTitle')}</h3><div class="car-meta">${time}</div>${apply}<div class="car-content">${content}</div></div>`;
  }).join('');
  const current = list.find(n => n._key === key);
  const actions = isAdmin ? `

    <button class="btn-warn" data-action="noticePin" data-arg="${key}" style="margin:0">${current.pinned?t('noticeUnpin'):t('noticePin')}</button>
    <button class="btn-ghost" data-action="noticeLock" data-arg="${key}" style="margin:0">${current.locked?t('noticeUnlock'):t('noticeLock')}</button>
    <button class="btn-danger" data-action="noticeDelete" data-arg="${key}" style="margin:0">${t('noticeDelete')}</button>
  ` : `<button class="btn-ghost" data-action="closePage" style="margin:0">${t('close')}</button>`;
  pageRoot.innerHTML = `<div class="fullPage" id="noticeFullscreen"><div class="fp-header"><button class="fp-back" data-action="closePage">←</button><div class="fp-title">${t('noticeTitle')}</div></div><div class="fp-body"><div class="car-stage" id="nfStage">${cards}</div><div class="car-progress" id="nfProgress">1 / ${list.length}</div></div><div class="car-actions">${actions}</div></div>`;
  setTimeout(() => {
    const stage = document.getElementById('nfStage');
    const target = stage.querySelector(`[data-key="${key}"]`);
    if (target) stage.scrollLeft = target.offsetLeft - (stage.clientWidth - target.offsetWidth)/2;
    const upd = () => {
      const center = stage.scrollLeft + stage.clientWidth/2;
      let closest = 0, minDist = Infinity;
      stage.querySelectorAll('.car-card').forEach((c,i) => { const cc = c.offsetLeft + c.offsetWidth/2; const d = Math.abs(cc-center); if (d<minDist){minDist=d;closest=i;} c.classList.toggle('active', d<c.offsetWidth/2); });
      document.getElementById('nfProgress').textContent = `${closest+1} / ${stage.querySelectorAll('.car-card').length}`;
      markRead(stage.querySelectorAll('.car-card')[closest].dataset.key);
    };
    stage.addEventListener('scroll', () => { clearTimeout(stage._t); stage._t = setTimeout(upd, 120); });
    setTimeout(upd, 100);
  }, 100);
}

async function openNoticeCreate(){

  const ta = document.getElementById('noticeText'), cc = document.getElementById('charCount');
  ta.addEventListener('input', () => { const len = ta.value.length; cc.textContent = `${len} / 5000`; cc.classList.toggle('over', len>5000); });
  const renderImgs = () => {
    const box = document.getElementById('imgList');
    box.innerHTML = window._noticeImages.map((src,i) => `<div class="av-opt" style="position:relative;overflow:hidden"><img src="${/^https?:/.test(src)?escapeHtml(src):src}" style="width:100%;height:100%;object-fit:cover"><button style="position:absolute;top:0;right:0;background:#dc2626;color:#fff;border:none;width:18px;height:18px;border-radius:50%;font-size:12px;cursor:pointer" data-imgidx="${i}">x</button></div>`).join('');
    box.querySelectorAll('button[data-imgidx]').forEach(b => { b.onclick = e => { e.stopPropagation(); window._noticeImages.splice(+b.dataset.imgidx,1); renderImgs(); }; });
  };
  document.getElementById('noticeImgFile').addEventListener('change', async e => {
    const files = Array.from(e.target.files).slice(0, 5 - window._noticeImages.length);
    for (const f of files) {
      if (f.size > 5*1024*1024) { showNotif('5MB'); continue; }
      try { const dataUrl = await compressImage(f, 800, 800, 0.75); window._noticeImages.push(dataUrl); } catch(err){}
    }
    renderImgs(); e.target.value = '';
  });
  document.getElementById('noticeImgUrl').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); const url = e.target.value.trim(); if (!url) return; if (window._noticeImages.length >= 5) return; window._noticeImages.push(url); e.target.value = ''; renderImgs(); }
  });
}

async function submitNotice(role){
  const errEl = document.getElementById('noticeErr'); if (errEl) errEl.textContent = '';
  const textEl = document.getElementById('noticeText'), useHtmlEl = document.getElementById('useHtml');
  const useHtml = useHtmlEl && useHtmlEl.checked;
  const text = textEl.value;
  const when = document.getElementById('noticeWhen').value;
  if (text.length > 5000) { if (errEl) errEl.textContent = t('noticeOver5000'); return; }
  if (!text.trim() && window._noticeImages.length === 0) { if (errEl) errEl.textContent = t('noticeNeedContent'); return; }
  try {
    const c = await get(child(ref(db),'meta/noticeCounter'));
    const next = (c.exists()?c.val():0) + 1;
    await set(ref(db,'meta/noticeCounter'), next);
    const noticeId = '公告_'+String(next).padStart(4,'0');
    const payload = { id:noticeId, text:useHtml?'':text, html:useHtml?text:'', images:window._noticeImages.slice(), fromUser:me.username, fromName:me.displayName, fromSeat:me.seat, createdAt:Date.now(), publishedAt: role==='admin' && when==='now' ? Date.now() : (when==='3days' ? Date.now()+3*86400000 : Date.now()), pinned:false, locked:false, deleted:false };
    if (role === 'admin') { await set(ref(db,'notices/'+noticeId), payload); await writeLog('notice','發布公告 '+noticeId); showNotif(t('notifNoticePublished')); }
    else { await set(ref(db,'noticePending/'+noticeId), { ...payload, status:'pending', applyAt:Date.now() }); await writeLog('notice','申請公告 '+noticeId); showNotif(t('notifNoticeSent')); }
    window._noticeImages = []; closePage();
  } catch(e) { if (errEl) errEl.textContent = e.message; }
}

    const mkey = Object.keys(val).find(k => val[k].id === req.msgId);
    if (mkey) await update(ref(db,'messages/'+mkey), { deleted:true, deletedAt:Date.now(), deletedBy:me.username });
    await update(ref(db,'requests/'+key), { status:'approved', handledAt:Date.now(), handledBy:me.username });
  } else {
    await update(ref(db,'requests/'+key), { status:'rejected', handledAt:Date.now(), handledBy:me.username });
  }
  renderAdminTab('requests');
}
async function renderAllLogs(){
  const snap = await get(query(ref(db,'logs'), limitToLast(300)));
  const val = snap.val()||{};
  const list = Object.values(val).sort((a,b) => b.createdAt-a.createdAt);
  if (list.length === 0) return `<div class="empty">${t('noLogs')}</div>`;
  return list.map(l => `<div class="log-item action-${l.action}"><div class="lt">${new Date(l.createdAt).toLocaleString(lang==='en'?'en-US':'zh-TW')} · ${escapeHtml(l.username)} (#${l.seat})</div><div class="lm">${escapeHtml(l.detail||l.action)}</div></div>`).join('');
}

async function openUserDetail(username){
  const snap = await get(child(ref(db),'users/'+username)); if (!snap.exists()) return;
  renderUserDetailPage(snap.val());
}
function renderUserDetailPage(u){
  const isSuper = me.role === 'superadmin';
  const isTargetSuper = u.role === 'superadmin', isTargetAdmin = u.role === 'admin';
  const canEdit = isSuper || (me.role === 'admin' && !isTargetSuper && !isTargetAdmin);
  const canBan = isSuper && u.username !== me.username;
  const canGrant = isSuper && u.username !== me.username;
  const isAdmin = isTargetSuper || isTargetAdmin;
  const bgColor = isAdmin ? '#8b5cf6' : (u.color||'#3b82f6');
  const textColor = pickTextColor(bgColor);
  const avatarHTML = u.avatar ? (String(u.avatar).startsWith('data:')?`<img src="${u.avatar}">`:u.avatar) : escapeHtml((u.displayName||u.username||'?').charAt(0).toUpperCase());
  const roleLabel = isTargetSuper ? t('superAdmin') : (isTargetAdmin ? t('adminRole') : t('memberRole'));
  const heroHTML = `<div class="profile-hero" style="background:${bgColor};color:${textColor}"><div class="hero-avatar" style="background:${bgColor};color:${textColor}">${avatarHTML}</div><div class="hero-name">${escapeHtml(u.displayName||u.username)}</div><div class="hero-sub">#${u.seat} · ${u.username}</div><div class="hero-badge">${roleLabel}</div></div>`;
  let bodyHTML = '';
  if (u.banned) bodyHTML += `<div class="ban-status ${u.banned.type}"><b>${u.banned.type === 'severe' ? t('banTypeSevere') : t('banTypeLight')}</b><br>${t('reason')}：${escapeHtml(u.banned.reason||t('noReason'))}</div>`;
  if (canBan) {
    const isBanned = !!u.banned;
    if (isBanned) bodyHTML += `<div class="section-title">${t('banSection')}</div><div class="ban-block"><div class="ban-label">${t('banned')}</div><div class="ban-sub">${t('unban')}</div><button class="btn-ok" data-action="unban" data-arg="${u.username}">${t('unban')}</button></div>`;
    else {
      const dt = (banDraft[u.username] && banDraft[u.username].type) || 'light';
      const dr = (banDraft[u.username] && banDraft[u.username].reason) || '';
      bodyHTML += `<div class="section-title">${t('banSection')}</div><div class="ban-block"><div class="ban-label">${t('banThis')}</div><div class="ban-sub">${t('banSelect')}</div><div class="ban-type-buttons"><button class="ban-type-btn light ${dt==='light'?'selected':''}" data-action="setBanType" data-arg="${u.username}" data-arg2="light">${t('banTypeLight')}<br><span style="font-size:10.5px;opacity:.85">${t('banLightSub')}</span></button><button class="ban-type-btn severe ${dt==='severe'?'selected':''}" data-action="setBanType" data-arg="${u.username}" data-arg2="severe">${t('banTypeSevere')}<br><span style="font-size:10.5px;opacity:.85">${t('banSevereSub')}</span></button></div><div class="form-row" style="margin-top:12px"><input type="text" id="au_banReason" placeholder="${t('banReasonPh')}" maxlength="100" value="${escapeHtml(dr)}"></div><div class="err" id="banErr"></div><button class="btn-danger" data-action="confirmBan" data-arg="${u.username}">${t('confirmBan')}</button></div>`;
    }
  }
  if (canEdit) bodyHTML += `<div class="section-title">${t('editName')}</div><div class="form-row"><input type="text" id="au_displayName" value="${escapeHtml(u.displayName||u.username)}" maxlength="20"></div><div class="section-title">Color (hex)</div><div class="form-row"><input type="text" id="au_color" value="${u.color||'#3b82f6'}"></div><div class="section-title">${t('editAvatar')}</div><div class="avatar-options">${['😀','😎','🤓','🐱','🐶','🦊','🐼','🐯','🦁','🐸','👽','🤖','🔥','⭐','⚡','🎮','⚽','🎸','🚀','🍕'].map(e => `<div class="av-opt" data-action="adminPickEmoji" data-arg="${u.username}" data-arg2="${e}">${e}</div>`).join('')}<div class="av-opt" data-action="adminPickEmoji" data-arg="${u.username}" data-arg2="">x</div></div><button class="btn-primary" data-action="adminSaveProfile" data-arg="${u.username}">${t('saved')}</button><div class="err" id="auErr"></div><div class="ok-msg" id="auOk"></div>`;
  if (canGrant) { bodyHTML += `<div class="section-title">${t('adminRole')}</div>`; if (isTargetAdmin && !isTargetSuper) bodyHTML += `<button class="btn-ghost" data-action="adminRevoke" data-arg="${u.username}">${t('revokeAdmin')}</button>`; else if (!isTargetAdmin) bodyHTML += `<button class="btn-primary" data-action="adminGrant" data-arg="${u.username}">${t('grantAdmin')}</button>`; }
  bodyHTML += `<button class="btn-ghost" data-action="openUserLogs" data-arg="${u.username}">${t('viewLogs')}</button>`;
  openPage({ title: u.displayName + t('userDetail'), heroHTML, bodyHTML });
}
function setBanType(username, type){ if (!banDraft[username]) banDraft[username] = { type:'light', reason:'' }; const r = document.getElementById('au_banReason'); if (r) banDraft[username].reason = r.value; banDraft[username].type = type; openUserDetail(username); }
async function confirmBan(username){ if (me.role !== 'superadmin') return; const type = (banDraft[username] && banDraft[username].type) || 'light'; const r = document.getElementById('au_banReason'); const reason = r ? r.value.trim() : ((banDraft[username] && banDraft[username].reason) || '').trim(); const errEl = document.getElementById('banErr'); if (!reason) { if (errEl) errEl.textContent = t('banReasonEmpty'); return; } await update(ref(db,'users/'+username), { banned: { type, reason, bannedAt:Date.now(), bannedBy:me.username } }); delete banDraft[username]; showNotif(t('notifBanned') + ' ' + username); openUserDetail(username); }
async function unban(username){ if (me.role !== 'superadmin') return; await update(ref(db,'users/'+username), { banned:null }); showNotif(t('notifUnbanned')); openUserDetail(username); }
async function adminSaveProfile(username){ const displayName = document.getElementById('au_displayName').value.trim(); const color = document.getElementById('au_color').value.trim(); const errEl = document.getElementById('auErr'), okEl = document.getElementById('auOk'); if (!displayName) { errEl.textContent = t('nameEmpty'); return; } if (!/^#[0-9a-fA-F]{6}$/.test(color)) { errEl.textContent = 'Color'; return; } await update(ref(db,'users/'+username), { displayName, color }); okEl.textContent = '✓ '+t('saved'); }
async function adminPickEmoji(username, emoji){ await update(ref(db,'users/'+username), { avatar:emoji||null }); openUserDetail(username); }
async function adminGrant(username){ await update(ref(db,'users/'+username), { role:'admin' }); showNotif(t('notifGranted')); openUserDetail(username); }
async function adminRevoke(username){ await update(ref(db,'users/'+username), { role:'member' }); showNotif(t('notifRevoked')); openUserDetail(username); }

function updateAdminDot(){ if (!me || (me.role !== 'superadmin' && me.role !== 'admin')) return; const n = Object.values(requests).filter(r => r.status === 'pending').length + pendingNotices.length; if (n > 0) { adminNotifDot.textContent = n; adminNotifDot.classList.remove('hidden'); } else adminNotifDot.classList.add('hidden'); }
function checkPendingNoticeNotif(){ if (!me || (me.role !== 'superadmin' && me.role !== 'admin')) return; const now = Date.now(); pendingNotices.forEach(async p => { if (p.status === 'pending' && p.publishedAt && p.publishedAt <= now) { await set(ref(db,'notices/'+p.id), { ...p, status:'published', autoPublishedAt:now }); await update(ref(db,'noticePending/'+p._key), { status:'approved', autoApproved:true }); } }); }
function showNotif(text){ const el = document.createElement('div'); el.id = 'notifBanner'; el.textContent = text; document.body.appendChild(el); setTimeout(() => el.remove(), 3000); }

applyTheme(); applyLang(); applyI18n();

(async function boot(){
  const saved = sessionStorage.getItem('chat_me');
  if (!saved) return;
  try {
    const u = JSON.parse(saved);
    const snap = await get(child(ref(db),'users/'+u.username));
    if (!snap.exists()) { sessionStorage.removeItem('chat_me'); return; }
    const data = snap.val();
    if (data.banned && data.banned.type === 'severe') { sessionStorage.removeItem('chat_me'); return; }
    me = { username:data.username, displayName:data.displayName||data.username, seat:data.seat, color:data.color||'#3b82f6', role:data.role||'member', avatar:data.avatar||null, banned:data.banned||null };
    await setPresence(); enterChat();
  } catch(e) { sessionStorage.removeItem('chat_me'); }
})();
</script>
</body>
