<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>班級聊天室 v1.9 Beta</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
:root{--bg-app:#0f172a;--bg-header:linear-gradient(90deg,#1e293b,#0f172a);--bg-card:#1e293b;--bg-input:rgba(15,23,42,.6);--text-main:#e2e8f0;--text-sub:#94a3b8;--text-muted:#64748b;--border:rgba(148,163,184,.15);--border-strong:rgba(148,163,184,.3);--primary:#3b82f6;--primary-2:#2563eb;--ai:#66ccff}
body.theme-light{--bg-app:#f0f2f5;--bg-header:linear-gradient(90deg,#ffffff,#f8fafc);--bg-card:#ffffff;--bg-input:#f0f2f5;--text-main:#1c1e21;--text-sub:#65676b;--text-muted:#8a8d91;--border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.15)}
body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg-app);color:var(--text-main);overflow:hidden;height:100vh;height:100dvh;transition:background .5s ease,color .4s ease}
.hidden{display:none!important}
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg-app);padding:20px;overflow-y:auto;height:100vh;height:100dvh;transition:background .5s ease}
#loginCard{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:32px 26px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
#loginCard h1{font-size:22px;text-align:center;margin-bottom:6px}
#loginCard .sub{font-size:13px;text-align:center;color:var(--text-sub);margin-bottom:20px}
.top-controls{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
.lang-select{padding:6px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:12px;font-family:inherit;outline:none;cursor:pointer}
.field{margin-bottom:14px}
.field input{width:100%;padding:13px 15px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:15px;outline:none;font-family:inherit}
.field input:focus{border-color:var(--primary)}
#loginBtn{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
#loginBtn:disabled{opacity:.6}
#loginError{color:#f87171;font-size:13px;text-align:center;min-height:18px;margin-bottom:8px;white-space:pre-wrap}
#loginVersion{text-align:center;font-size:11px;color:var(--text-muted);margin-top:14px}
#chatScreen{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{background:var(--bg-header);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);flex-shrink:0;min-height:46px;transition:background .4s ease}
header .title{font-size:14px;font-weight:600;white-space:nowrap;flex-shrink:0}
header .right{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-sub);flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.ver{background:rgba(56,189,248,.15);color:#38bdf8;padding:3px 7px;border-radius:6px;font-size:10.5px;font-weight:600}
.hbtn{background:rgba(148,163,184,.15);color:var(--text-main);border:none;padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;position:relative}
.hbtn:hover{background:rgba(148,163,184,.3)}
@media(max-width:520px){header{padding:6px 8px}header .title{font-size:13px}.hbtn{font-size:11px;padding:5px 8px}}
#noticeBar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(251,191,36,.12);border-bottom:1px solid rgba(251,191,36,.25);flex-shrink:0;font-size:13px;cursor:pointer}
body.theme-light #noticeBar{background:rgba(251,191,36,.15)}
#noticeBar .notice-icon{color:#fbbf24;font-size:14px;flex-shrink:0;font-weight:700}
#noticeBar .notice-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#noticeBar .notice-text .label{color:#fbbf24;font-weight:600;margin-right:6px}
#noticeBar .notice-add{background:#fbbf24;color:#1c1917;border:none;width:32px;height:32px;border-radius:8px;font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#noticeBar .notice-pin-count{background:rgba(251,191,36,.3);color:#fbbf24;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;flex-shrink:0}
#classStatus{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 12px;background:rgba(30,41,59,.5);border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-sub);flex-shrink:0}
body.theme-light #classStatus{background:rgba(255,255,255,.7)}
#classStatus .online{color:#4ade80;font-weight:600}
#classStatus .ban-item{background:rgba(220,38,38,.15);color:#fca5a5;padding:2px 8px;border-radius:6px;font-size:11px}
#classStatus .ban-item.light{background:rgba(234,88,12,.15);color:#fdba74}
#searchBar{display:flex;gap:8px;padding:8px 12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center}
#searchInput{flex:1;padding:8px 12px;border-radius:18px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:13px;outline:none;font-family:inherit}
#searchCount{font-size:11.5px;color:var(--text-sub)}
#chatBox{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg-app);-webkit-overflow-scrolling:touch;scroll-behavior:smooth;transition:background .5s ease}
#chatBox::-webkit-scrollbar{width:6px}
#chatBox::-webkit-scrollbar-thumb{background:rgba(148,163,184,.3);border-radius:3px}
.msg{max-width:75%;display:flex;gap:10px;align-items:flex-start;position:relative}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;user-select:none;overflow:hidden;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.deleted img,.avatar.deleted{filter:grayscale(100%);opacity:.6}
.bubble-wrap{display:flex;flex-direction:column;gap:3px;position:relative;min-width:0}
.msg.me .bubble-wrap{align-items:flex-end}
.meta{font-size:11px;color:var(--text-muted);padding:0 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta .msgid{color:var(--text-muted);font-size:10px;font-family:monospace}
.meta .class-tag{background:rgba(56,189,248,.18);color:#38bdf8;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:600}
.meta .enc-tag{background:rgba(220,38,38,.2);color:#fca5a5;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600}
.meta .ai-tag{background:rgba(102,204,255,.25);color:#66ccff;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700}
.meta .poll-tag{background:rgba(56,189,248,.25);color:#38bdf8;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700}
.meta .group-tag{background:rgba(139,92,246,.25);color:#c4b5fd;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700}
.bubble{padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap;color:#fff;max-width:100%}
.msg.me .bubble{border-bottom-right-radius:4px}
.msg:not(.me) .bubble{border-bottom-left-radius:4px}
.bubble .mention{background:rgba(255,255,255,.25);padding:1px 5px;border-radius:4px;font-weight:600}
.bubble img.msg-img{max-width:220px;max-height:220px;border-radius:8px;display:block;cursor:pointer;margin-top:4px}
.bubble .file-msg{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.bubble .file-msg .fi{font-size:16px;font-weight:700}
.bubble .file-msg .fn{font-size:13px;word-break:break-all;flex:1}
.bubble .file-msg .fs{font-size:11px;opacity:.8}
.bubble .voice-msg{display:flex;align-items:center;gap:10px;padding:4px 0;cursor:pointer;min-width:120px}
.bubble .voice-msg .vi{font-size:14px;font-weight:700}
.bubble .voice-msg .vt{font-size:13px}
.bubble .voice-msg .vp{flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.bubble .voice-msg .vp>div{height:100%;width:0;background:#fff;transition:width .1s}
.bubble .voice-msg .vd{width:8px;height:8px;border-radius:50%;background:#f87171;flex-shrink:0}
.bubble .voice-msg.played .vd{display:none}
.bubble .loc-msg{cursor:pointer;max-width:240px}
.bubble .loc-msg .lm-map{width:220px;height:150px;border-radius:8px;overflow:hidden;background:#222;margin-bottom:6px}
.bubble .loc-msg .lm-map img{width:100%;height:100%;object-fit:cover}
.bubble .loc-msg .lm-label{font-size:12px;display:flex;align-items:center;gap:4px}
.bubble .ai-sponsor{display:block;margin-top:8px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.3);font-size:10.5px;opacity:.75;font-style:italic}
.msg-tools{display:flex;gap:4px;margin-top:2px;opacity:0;flex-wrap:wrap}
.msg:hover .msg-tools{opacity:1}
.msg-tools button{background:rgba(148,163,184,.15);color:var(--text-sub);border:none;padding:2px 7px;border-radius:6px;font-size:10.5px;cursor:pointer;font-family:inherit}
.msg-tools button:hover{background:rgba(148,163,184,.3);color:var(--text-main)}
.msg-tools button.danger:hover{background:rgba(220,38,38,.3);color:#fca5a5}
#inputBar{padding:10px 12px 4px;background:var(--bg-card);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-shrink:0;position:relative;flex-wrap:wrap}
#micBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#micBtn.recording{background:#dc2626;color:#fff}
#msgInput{flex:1;padding:11px 14px;border-radius:22px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:14px;outline:none;font-family:inherit;min-width:0}
#plusBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:22px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#sendBtn{width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#aiRoundBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .3s ease,color .3s ease}
#aiRoundBtn.on{background:#66ccff;color:#0f172a}
#encToggle{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-sub);padding:4px 8px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-input);cursor:pointer;user-select:none;flex-shrink:0}
#encToggle.active{background:rgba(220,38,38,.2);border-color:#dc2626;color:#fca5a5}
#encToggle input{display:none}
#encToggle .dot-check{width:10px;height:10px;border-radius:50%;border:2px solid var(--border-strong)}
#encToggle.active .dot-check{background:#dc2626;border-color:#dc2626}
#bottomNav{display:flex;background:var(--bg-card);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
#bottomNav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;cursor:pointer;gap:2px;color:var(--text-sub);font-size:11px;border:none;background:none;font-family:inherit;position:relative}
#bottomNav .nav-item:hover{background:rgba(148,163,184,.08);color:var(--text-main)}
#bottomNav .nav-item .nav-icon{font-size:18px;line-height:1}
#bottomNav .nav-item .nav-badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;background:#ef4444;color:#fff;border-radius:8px;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
#plusPanel{position:absolute;bottom:calc(100% + 8px);left:12px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:16px;padding:14px;display:grid;grid-template-columns:repeat(3,72px);gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:50}
#plusPanel .pi{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px;border-radius:12px}
#plusPanel .pi:hover{background:rgba(56,189,248,.15)}
#plusPanel .pi .pic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:rgba(56,189,248,.2);color:#38bdf8}
#plusPanel .pi .pit{font-size:11px;color:var(--text-sub)}
#mentionPopup{position:absolute;bottom:100%;left:12px;right:12px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:12px;max-height:220px;overflow-y:auto;box-shadow:0 -8px 24px rgba(0,0,0,.5);margin-bottom:6px}
#mentionPopup .mention-item{padding:10px 14px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:10px}
#mentionPopup .mention-item:hover{background:rgba(56,189,248,.15)}
#mentionPopup .mention-item .mi-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden}
#mentionPopup .mention-item .mi-av img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;color:var(--text-muted);padding:40px 0;font-size:14px}
.fullPage{position:fixed;inset:0;background:var(--bg-app);z-index:100;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.fullPage .fp-header{padding:12px 16px;display:flex;align-items:center;gap:12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0}
.fullPage .fp-back{background:rgba(148,163,184,.15);color:var(--text-main);border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
.fullPage .fp-title{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fullPage .fp-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.profile-hero{padding:32px 20px 24px;text-align:center;position:relative}
.profile-hero .hero-avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;color:#fff;overflow:hidden;border:4px solid rgba(255,255,255,.25)}
.profile-hero .hero-avatar img{width:100%;height:100%;object-fit:cover}
.profile-hero .hero-name{font-size:24px;font-weight:700;margin-bottom:4px}
.profile-hero .hero-sub{font-size:14px;opacity:.9}
.profile-hero .hero-badge{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;background:rgba(255,255,255,.25)}
.profile-content{padding:20px 20px 40px}
.section-title{font-size:13px;color:var(--text-sub);margin:18px 0 10px;font-weight:600}
.form-row{margin-bottom:14px}
.form-row input[type=text],.form-row input[type=password],.form-row input[type=number],.form-row textarea,.form-row select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:14px;outline:none;font-family:inherit}
.form-row textarea{resize:vertical;min-height:120px;line-height:1.5}
.char-count{text-align:right;font-size:11px;color:#4ade80;margin-top:4px}
.char-count.over{color:#f87171}
.btn-primary,.btn-danger,.btn-warn,.btn-ok,.btn-ghost{width:100%;padding:12px;border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.btn-danger{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.btn-warn{background:linear-gradient(135deg,#ea580c,#c2410c)}
.btn-ok{background:linear-gradient(135deg,#16a34a,#15803d)}
.btn-ghost{background:rgba(148,163,184,.15);color:var(--text-main)}
.avatar-options{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.av-opt{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:2px solid transparent;background:var(--bg-input)}
.av-opt:hover{border-color:var(--primary)}
.err{color:#f87171;font-size:12px;margin-top:6px;min-height:14px}
.ok-msg{color:#4ade80;font-size:12px;margin-top:6px;min-height:14px}
input[type=file]{display:none}
.upload-btn{display:inline-block;padding:10px 16px;border-radius:10px;background:rgba(148,163,184,.2);color:var(--text-main);font-size:13px;cursor:pointer;font-family:inherit;border:1px dashed var(--border-strong);text-align:center;width:100%}
.tabs{display:flex;padding:0 16px;border-bottom:1px solid var(--border);background:var(--bg-card);overflow-x:auto;flex-shrink:0}
.tab{padding:12px 16px;text-align:center;font-size:13px;color:var(--text-sub);cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;background:none;border-left:none;border-right:none;border-top:none;white-space:nowrap}
.tab.active{color:#a78bfa;border-bottom-color:#8b5cf6;font-weight:600}
.admin-body{padding:16px 18px 40px}
.user-list{display:flex;flex-direction:column;gap:8px}
.user-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg-input);border:1px solid var(--border);cursor:pointer}
.user-card:hover{border-color:rgba(56,189,248,.4)}
.user-card.never-logged{filter:grayscale(50%);opacity:.6}
.user-card .uc-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.user-card .uc-avatar img{width:100%;height:100%;object-fit:cover}
.user-card .uc-info{flex:1;min-width:0}
.user-card .uc-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-card .uc-sub{font-size:11.5px;color:var(--text-sub);margin-top:2px}
.user-card .uc-badge{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600;flex-shrink:0}
.user-card .uc-presence{margin-left:auto;flex-shrink:0;width:10px;height:10px;border-radius:50%;background:#475569}
.user-card .uc-presence.online{background:#4ade80;box-shadow:0 0 8px #4ade80}
.user-card .uc-aion{font-size:10px;padding:2px 6px;border-radius:6px;background:rgba(102,204,255,.2);color:#66ccff;font-weight:700;margin-left:8px;flex-shrink:0}
.badge-ban-severe{background:rgba(220,38,38,.25);color:#fca5a5}
.badge-ban-light{background:rgba(234,88,12,.25);color:#fdba74}
.badge-disabled{background:rgba(100,116,139,.35);color:#cbd5e1}
.badge-admin{background:rgba(139,92,246,.25);color:#c4b5fd}
.badge-super{background:rgba(239,68,68,.3);color:#fca5a5}
.badge-ai{background:rgba(102,204,255,.25);color:#66ccff}
.badge-class{background:rgba(56,189,248,.18);color:#38bdf8}
.term-log{background:#000;color:#c0c0c0;font-family:Consolas,"Courier New",monospace;font-size:12.5px;line-height:1.6;padding:14px;border-radius:8px;overflow-x:auto}
.term-log .tl{white-space:pre-wrap;word-break:break-all}
.term-log .t-time{color:#5f8787}
.term-log .t-act{font-weight:700}
.term-log .t-user{color:#e0e0e0}
.term-log .t-login .t-act{color:#5faf5f}
.term-log .t-logout .t-act{color:#808080}
.term-log .t-send .t-act{color:#5fafaf}
.term-log .t-changepwd .t-act{color:#d7d75f}
.term-log .t-changename .t-act{color:#af87d7}
.term-log .t-ban .t-act{color:#d75f5f}
.term-log .t-delete .t-act{color:#ff5f87}
.term-log .t-notice .t-act{color:#d7875f}
.term-log .t-ai .t-act{color:#66ccff}
.term-log .t-account .t-act{color:#d7af5f}
.term-log .t-group .t-act{color:#d787af}
.pending-item{padding:12px;border-radius:12px;background:var(--bg-input);border:1px solid var(--border);margin-bottom:10px}
.pending-item .pi-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}

let lang=localStorage.getItem('chat_lang')||'zh-Hant';
function t(k){return (I18N[lang]&&I18N[lang][k])||I18N['zh-Hant'][k]||k;}
function tf(k,params){ let s=t(k);for(const key in params){s=s.replace('{'+key+'}',params[key]);}return s; }
function applyI18n(){ document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});document.querySelectorAll('[data-i18n-ph]').forEach(el=>{el.placeholder=t(el.dataset.i18nPh);}); }

let theme=localStorage.getItem('chat_theme')||'dark';
function applyTheme(){ document.body.classList.toggle('theme-light',theme==='light');['themeToggleLogin','themeToggleChat'].forEach(id=>{const el=document.getElementById(id);if(el)el.checked=(theme==='light');}); }
function applyLang(){ ['langSelectLogin','langSelectChat'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=lang;}); }
async function setTheme(n){ theme=n;applyTheme();localStorage.setItem('chat_theme',n);if(me){try{await update(ref(db,'users/'+me.username),{theme:n});}catch(e){}} }
async function setLang(n){ lang=n;applyLang();applyI18n();localStorage.setItem('chat_lang',n);if(me){try{await update(ref(db,'users/'+me.username),{lang:n});}catch(e){}} render();renderNoticeBar(); }
document.getElementById('themeToggleLogin').addEventListener('change',e=>setTheme(e.target.checked?'light':'dark'));
document.getElementById('themeToggleChat').addEventListener('change',e=>setTheme(e.target.checked?'light':'dark'));
$('langSelectLogin').addEventListener('change',e=>setLang(e.target.value));
$('langSelectChat').addEventListener('change',e=>setLang(e.target.value));
encCheckbox.addEventListener('change',()=>{encToggle.classList.toggle('active',encCheckbox.checked);});

const HEARTBEAT_MS=10000;
async function heartbeatLoop(){ if(!me)return;try{await set(ref(db,'presence/'+me.username),true);}catch(e){} }
function startHeartbeat(){ stopHeartbeat();heartbeatLoop();heartbeatTimer=setInterval(heartbeatLoop,HEARTBEAT_MS); }
function stopHeartbeat(){ if(heartbeatTimer){clearInterval(heartbeatTimer);heartbeatTimer=null;} }
window.addEventListener('beforeunload',()=>{ if(me)remove(ref(db,'presence/'+me.username)).catch(()=>{}); });

async function handleLogin(){
  const u=loginUsername.value.trim().toLowerCase(),p=loginPassword.value;
  loginError.textContent='';
  if(!u||!p){loginError.textContent=t('loginSub');return;}
  loginBtn.disabled=true;loginBtn.textContent=t('loginBtnLoading');
  try{
    const snap=await get(child(ref(db),'users/'+u));
    if(!snap.exists()){loginError.textContent=t('noUser');return;}
    const data=snap.val();
    if(data.disabled===true){loginError.textContent=t('accountDisabled');return;}
    if(data.banned&&data.banned.type==='severe'){loginError.textContent=t('bannedSevere')+'\n'+t('reason')+'：'+(data.banned.reason||t('noReason'));return;}
    if(data.password!==p){loginError.textContent=t('wrongPwd');return;}
    me={username:data.username,displayName:data.displayName||data.username,seat:data.seat,cls:data.class||'',color:data.color||'#3b82f6',role:data.role||'member',avatar:data.avatar||null,banned:data.banned||null,disabled:false};
    if(data.theme){theme=data.theme;localStorage.setItem('chat_theme',theme);applyTheme();}
    if(data.lang){lang=data.lang;localStorage.setItem('chat_lang',lang);applyLang();applyI18n();}
    // 移除 neverLoggedIn 標籤
    if(data.neverLoggedIn||!data.hasLoggedIn){ try{await update(ref(db,'users/'+me.username),{hasLoggedIn:true,neverLoggedIn:null,lastLoginAt:Date.now()});}catch(e){} }
    else{ try{await update(ref(db,'users/'+me.username),{lastLoginAt:Date.now()});}catch(e){} }
    sessionStorage.setItem('chat_me',JSON.stringify(me));
    await writeLog('login','登入系統');
    await set(ref(db,'presence/'+me.username),true);
    await ensureAIUser();
    runDailySummary().catch(()=>{});
    enterChat();
  }catch(e){ console.error(e);loginError.textContent='登入失敗：'+(e.code||e.message); }
  finally{loginBtn.disabled=false;loginBtn.textContent=t('loginBtn');}
}
async function handleLogout(){

}

function renderNoticeContent(n){

  if(latest){const preview=(latest.text||latest.html||'').replace(/<[^>]*>/g,'').slice(0,50);html+=`<div class="notice-text" data-action="openNoticeDetail" data-arg="${latest._key}" style="cursor:pointer"><span class="label">${t('noticeLatest')}</span>${escapeHtml(preview)}</div>`;}

function subscribeMyGroups(){
  if(unsubMyGroups)unsubMyGroups();
  if(!me)return;
  unsubMyGroups=onValue(ref(db,'groups'),snap=>{
    const val=snap.val()||{};
    myGroups={};
    for(const key in val){
      const g=val[key];
      if(!g)continue;
      const members=g.members||{};
      if(members[me.username])myGroups[key]=g;
    }
    updateGroupBadge();
  });
}
function updateGroupBadge(){
  let count=0;
  // 檢查 groupRequests 有幾個 pending 是給我的
  for(const k in groupRequests){
    const r=groupRequests[k];
    if(r&&r.creator===me.username&&r.status==='pending')count++;
  }
  if(count>0){groupBadge.textContent=count;groupBadge.classList.remove('hidden');}
  else groupBadge.classList.add('hidden');
}
function subscribeGroupRequests(){
  if(unsubGroupRequests)unsubGroupRequests();
  if(!me)return;
  unsubGroupRequests=onValue(ref(db,'groupRequests'),snap=>{
    groupRequests=snap.val()||{};
    updateGroupBadge();
  });
}

async function submitCreateGroup(){
  const nameInput=document.getElementById('groupNameInput');
  const name=(nameInput?nameInput.value:'').trim();
  const errEl=document.getElementById('groupErr');
  if(!name){if(errEl)errEl.textContent=t('groupNameEmpty');return;}
  if(name.length>50){if(errEl)errEl.textContent=t('groupNameTooLong');return;}
  const sel=Object.keys(_groupDraft.selected);
  if(sel.length<1){if(errEl)errEl.textContent=t('groupNeedMembers');return;}
  try{
    const exist=await get(child(ref(db),'groups/'+name));
    if(exist.exists()){if(errEl)errEl.textContent=t('groupNameExists');return;}
    const members={};
    members[me.username]=true;
    sel.forEach(u=>{members[u]=true;});
    await set(ref(db,'groups/'+name),{name,creator:me.username,createdAt:Date.now(),members,lastMsg:'',lastAt:Date.now(),msgCounter:0});
    await writeLog('group','建立群聊 '+name);
    showNotif(t('groupCreated'));
    closePage();
    setTimeout(()=>openGroupChat(name),300);
  }catch(e){if(errEl)errEl.textContent=e.message;}
}
async function openGroupChat(groupKey){
  if(!me)return;
  const snap=await get(child(ref(db),'groups/'+groupKey));
  if(!snap.exists()){showNotif('群聊不存在');return;}
  const g=snap.val();
  if(!g.members||!g.members[me.username]){showNotif('你不在這個群聊');return;}
  // 第一次進入彈提醒
  const joinedKey='joined_'+groupKey;
  if(!joinedGroups[joinedKey]&&g.creator!==me.username){
    joinedGroups[joinedKey]=true;
    const creatorName=(allUsers[g.creator]&&(allUsers[g.creator].displayName||allUsers[g.creator].username))||g.creator;
    if(!confirm(tf('youInvited',{name:creatorName,group:groupKey})+'\n'+t('youInvitedSub'))){leaveGroupConfirm(groupKey);return;}
  }
  currentGroupKey=groupKey;
  if(unsubGroupMsgs)unsubGroupMsgs();
  unsubGroupMsgs=onValue(ref(db,'groupMessages/'+groupKey),snap=>{
    const val=snap.val()||{};
    currentGroupMsgs=Object.keys(val).map(k=>({_key:k,...val[k]})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    renderGroupChat(groupKey,g);
  });
  renderGroupChat(groupKey,g);
}

async function submitGroupMessage(){
  if(!me||!currentGroupKey)return;
  const inp=document.getElementById('pcInput');
  if(!inp)return;
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';
  try{
    const gSnap=await get(child(ref(db),'groups/'+currentGroupKey));
    if(!gSnap.exists())return;
    const g=gSnap.val();
    const counter=(g.msgCounter||0)+1;
    const msgId=currentGroupKey+'_msg_'+counter;
    await update(ref(db,'groups/'+currentGroupKey),{msgCounter:counter,lastMsg:text,lastAt:Date.now()});
    await set(ref(db,'groupMessages/'+currentGroupKey+'/'+msgId),{id:msgId,username:me.username,displayName:me.displayName,seat:me.seat,cls:me.cls||'',color:me.color,avatar:me.avatar,role:me.role,text,type:'text',createdAt:Date.now(),deleted:false});
    await writeLog('group','群聊「'+currentGroupKey+'」發送訊息');
  }catch(e){showNotif('送出失敗');}
}

/* ===== 群聊請求（拉人審核） ===== */
async function handleGroupRequest(key,action){
  const r=groupRequests[key];
  if(!r)return;
  if(r.creator!==me.username)return;
  if(action==='approve'){
    await update(ref(db,'groups/'+r.group+'/members'),{[r.target]:true});
    await update(ref(db,'groupRequests/'+key),{status:'approved',handledAt:Date.now()});
    showNotif('已同意');
  } else {
    await update(ref(db,'groupRequests/'+key),{status:'rejected',handledAt:Date.now()});
    showNotif('已拒絕');
  }
}

/* ===== AI 呼叫 ===== */
async function callAI(messages,retry=0){
  try{
    const res=await fetch(AI_API,{method:'POST',headers:{'Content-Type':'application/json','api-key':AI_KEY},body:JSON.stringify({model:AI_MODEL,messages,stream:false,max_tokens:1024,chat_template_kwargs:{enable_thinking:true}})});
    if(res.status===429&&retry<3){await new Promise(r=>setTimeout(r,2000));return callAI(messages,retry+1);}
    if(!res.ok)throw new Error('API '+res.status);
    const data=await res.json();
    const choice=data.choices&&data.choices[0];
    if(!choice)return null;
    return {content:(choice.message&&choice.message.content)||'',reasoning:(choice.message&&choice.message.reasoning_content)||''};
  }catch(e){ if(retry<3){await new Promise(r=>setTimeout(r,2000));return callAI(messages,retry+1);}throw e; }
}
function showAIConfirm(cmd,asker){
  pendingAIConfirm={cmd,asker};
  const old=document.getElementById('aiConfirmBar');if(old)old.remove();
  const bar=document.createElement('div');bar.id='aiConfirmBar';
  bar.innerHTML=`<div class="acb-text">${t('aiConfirmTitle')}<div class="acb-cmd">${escapeHtml(JSON.stringify(cmd))}</div></div><button data-action="aiAllow">${t('aiAllow')}</button><button data-action="aiDeny">${t('aiDeny')}</button>`;
  document.body.appendChild(bar);
}
async function aiAllow(){
  if(!pendingAIConfirm)return;
  const {cmd}=pendingAIConfirm;pendingAIConfirm=null;
  const bar=document.getElementById('aiConfirmBar');if(bar)bar.remove();
  try{
    const result=await executeAIAction(cmd);
    showNotif(result.ok?'已完成':'失敗：'+result.error);
    await reloadMe();
  }catch(e){showNotif('失敗');}
}
async function aiDeny(){ pendingAIConfirm=null;const bar=document.getElementById('aiConfirmBar');if(bar)bar.remove(); }
async function executeAIAction(cmd){
  try{
    switch(cmd.cmd){
      case 'setTheme':{ const v=String(cmd.value||'').toLowerCase();if(v!=='dark'&&v!=='light')return {ok:false,error:'value 錯誤'};await setTheme(v);return {ok:true}; }
      case 'setColor':{ await update(ref(db,'users/'+cmd.target),{color:cmd.value});if(me&&cmd.target===me.username){me.color=cmd.value;sessionStorage.setItem('chat_me',JSON.stringify(me));render();}return {ok:true}; }
      case 'setName':{ await update(ref(db,'users/'+cmd.target),{displayName:cmd.value});return {ok:true}; }
      case 'setAvatar':{ await update(ref(db,'users/'+cmd.target),{avatar:cmd.value||null});return {ok:true}; }
      case 'setPassword':{ await update(ref(db,'users/'+cmd.target),{password:cmd.value});return {ok:true}; }
      case 'writeNotice':{ const c=await get(child(ref(db),'meta/noticeCounter'));const next=(c.exists()?c.val():0)+1;await set(ref(db,'meta/noticeCounter'),next);const id='公告_'+String(next).padStart(4,'0');await set(ref(db,'noticePending/'+id),{id,text:cmd.value||'',html:'',images:[],fromUser:me.username,fromName:me.displayName,fromSeat:me.seat,createdAt:Date.now(),status:'pending',aiWritten:true});return {ok:true}; }
      case 'ban':{ await update(ref(db,'users/'+cmd.target),{banned:{type:cmd.value||'light',reason:cmd.reason||'AI',bannedAt:Date.now(),bannedBy:me.username}});return {ok:true}; }
      case 'unban':{ await update(ref(db,'users/'+cmd.target),{banned:null});return {ok:true}; }
      case 'grantAdmin':{ await update(ref(db,'users/'+cmd.target),{role:'admin'});return {ok:true}; }
      case 'revokeAdmin':{ await update(ref(db,'users/'+cmd.target),{role:'member'});return {ok:true}; }
      case 'deleteMsg':{ const snap=await get(query(ref(db,'messages'),limitToLast(300)));const val=snap.val()||{};const key=Object.keys(val).find(k=>val[k].id===cmd.target);if(!key)return {ok:false,error:'找不到'};await update(ref(db,'messages/'+key),{deleted:true,deletedAt:Date.now()});return {ok:true}; }
      case 'restoreMsg':{ const snap=await get(query(ref(db,'messages'),limitToLast(300)));const val=snap.val()||{};const key=Object.keys(val).find(k=>val[k].id===cmd.target);if(!key)return {ok:false,error:'找不到'};await update(ref(db,'messages/'+key),{deleted:false});return {ok:true}; }
      case 'purgeMsg':{ const snap=await get(query(ref(db,'messages'),limitToLast(300)));const val=snap.val()||{};const key=Object.keys(val).find(k=>val[k].id===cmd.target);if(!key)return {ok:false,error:'找不到'};await remove(ref(db,'messages/'+key));return {ok:true}; }
      case 'logout':{ await remove(ref(db,'presence/'+cmd.target));return {ok:true}; }
      case 'clearChat':{ await remove(ref(db,'messages'));await set(ref(db,'meta/msgCounter'),0);return {ok:true}; }
      default:return {ok:false,error:'未知指令'};
    }
  }catch(e){return {ok:false,error:e.message};}
}

/* ===== 渲染主聊天室 ===== */
let encState={};
function render(){
  if(messages.length===0){chatBox.innerHTML=`<div class="empty">${t('emptyMsg')}</div>`;return;}
  const usersLoaded=Object.keys(allUsers).length>0;
  let list=messages;
  if(searchKeyword)list=messages.filter(m=>((m.text||'')+(m.fileName||'')+(m.pollTitle||'')).toLowerCase().includes(searchKeyword.toLowerCase()));
  if(list.length===0){chatBox.innerHTML=`<div class="empty">${t('noMatch')}</div>`;return;}
  const atBottom=chatBox.scrollHeight-chatBox.scrollTop-chatBox.clientHeight<120;
  const isAdmin=me.role==='superadmin'||me.role==='admin';
  chatBox.innerHTML=list.map(m=>{
    const isMe=me&&m.username===me.username;
    const time=new Date(m.createdAt).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    const msgIsAdmin=m.role==='superadmin'||m.role==='admin';
    const roleTag=msgIsAdmin?' [管理]':'';
    const classTag=m.cls?`<span class="class-tag">${escapeHtml(m.cls)}</span>`:'';
    const shownColor=msgIsAdmin?'#8b5cf6':(m.color||'#3b82f6');
    const userExists=allUsers[m.username];
    const isDeletedUser=!userExists&&usersLoaded;
    let body=escapeHtml(m.text||'').replace(/@([a-zA-Z0-9_]+)/g,'<span class="mention">@$1</span>').replace(/\n/g,'<br>');
    if(m.encrypted)body=renderEncryptedBody(m);
    const deletedTag=m.deleted?` <span style="color:#f87171;font-size:10.5px">（已刪除）</span>`:'';
    const msgIdTag=isAdmin?` <span class="msgid">${m.id}</span>`:'';
    const avatarCls=isDeletedUser?'avatar deleted':'avatar';
    let tools='';
    if(!m.deleted){
      if(isMe)tools+=`<button data-action="requestDeleteMsg" data-arg="${m.id}">請求刪除</button>`;
      if(!isMe)tools+=`<button class="danger" data-action="reportMsg" data-arg="${m.id}">舉報</button>`;
      if(isAdmin)tools+=`<button class="danger" data-action="adminDeleteMsg" data-arg="${m.id}">管理刪除</button>`;
    }
    return `<div class="msg ${isMe?'me':''}"><div class="${avatarCls}" style="background:${isDeletedUser?'#475569':shownColor}" data-action="openUserProfile" data-arg="${m.username}">${avatarInner(m)}</div><div class="bubble-wrap"><div class="meta">${escapeHtml(m.displayName||m.username)}${classTag}${roleTag} · ${time}${msgIdTag}${deletedTag}</div><div class="bubble" style="background:${shownColor};${m.deleted?'opacity:.5':''}">${body}</div><div class="msg-tools">${tools}</div></div></div>`;
  }).join('');
  if(atBottom&&!searchKeyword)chatBox.scrollTop=chatBox.scrollHeight;
}
function renderEncryptedBody(m){
  const chars=Array.from(m.text||'');const idx=encState[m.id]||0;
  const shown=chars.map((c,i)=>i===idx?escapeHtml(c):'X').join('');
  return `<div class="enc-msg"><div class="enc-display">${shown||'(空)'}</div><div class="enc-controls"><button data-action="encPrev" data-arg="${m.id}" ${idx===0?'disabled':''}>← 上一字</button><span class="enc-progress">${idx+1} / ${chars.length}</span><button data-action="encNext" data-arg="${m.id}" ${idx>=chars.length-1?'disabled':''}>下一字 →</button></div></div>`;
}
function encPrev(msgId){ if(!encState[msgId])encState[msgId]=0;if(encState[msgId]>0){encState[msgId]--;render();} }
function encNext(msgId){ const m=messages.find(x=>x.id===msgId);if(!m)return;const total=Array.from(m.text||'').length;if(!encState[msgId])encState[msgId]=0;if(encState[msgId]<total-1){encState[msgId]++;render();} }
function avatarInner(m){ if(m.avatar){if(String(m.avatar).startsWith('data:'))return `<img src="${m.avatar}">`;return m.avatar;}const name=m.displayName||m.username||'?';return escapeHtml(name.charAt(0).toUpperCase()); }
function escapeHtml(str){ return String(str==null?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function togglePlus(){ plusPanel.classList.toggle('hidden'); }
function pickImage(){ plusPanel.classList.add('hidden');const inp=document.getElementById('globalImgInput');inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=await compressImage(f,1200,1200,0.75);await sendMedia('image',{imageUrl:d,text:''});}catch(err){}e.target.value='';};inp.click(); }
function pickFile(){ plusPanel.classList.add('hidden');const inp=document.getElementById('globalFileInput');inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=await fileToBase64(f);await sendMedia('file',{fileUrl:d,fileName:f.name,fileSize:f.size});}catch(err){}e.target.value='';};inp.click(); }
function pickLocation(){ plusPanel.classList.add('hidden');if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(async pos=>{const lat=pos.coords.latitude,lng=pos.coords.longitude;let placeName=`${lat.toFixed(4)}, ${lng.toFixed(4)}`;try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=zh-TW`);const j=await r.json();if(j.display_name)placeName=j.display_name;}catch(e){}await sendMedia('location',{lat,lng,placeName});},err=>showNotif('Error')); }
function fileToBase64(file){ return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('fail'));r.readAsDataURL(file);}); }
function compressImage(file,maxW,maxH,quality){ return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=ev=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const ratio=Math.min(maxW/w,maxH/h,1);w=Math.round(w*ratio);h=Math.round(h*ratio);const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',quality));};img.onerror=()=>reject(new Error('load fail'));img.src=ev.target.result;};reader.onerror=()=>reject(new Error('read fail'));reader.readAsDataURL(file);}); }
function viewImage(url){ const div=document.createElement('div');div.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px';div.innerHTML=`<img src="${url}" style="max-width:100%;max-height:100%;object-fit:contain">`;div.onclick=()=>div.remove();document.body.appendChild(div); }

async function openOnlineQuery(){
  if(!me)return;
  const isAdmin=me.role==='superadmin'||me.role==='admin';
  const pSnap=await get(ref(db,'presence'));const pVal=pSnap.exists()?pSnap.val():{};

  // 只顯示登入過的人
  const list=Object.values(allUsers).filter(u=>u.hasLoggedIn||u.neverLoggedIn!==true).filter(u=>u.role!=='ai').sort((a,b)=>{const ca=a.class||'';const cb=b.class||'';if(ca!==cb)return ca.localeCompare(cb);return (a.seat||0)-(b.seat||0);});
  const onlineCount=list.filter(u=>pVal[u.username]===true).length;
  const offlineCount=list.length-onlineCount;

  list.forEach(u=>{const c=u.class||'（無班別）';if(!groups[c])groups[c]=[];groups[c].push(u);});

  });
  const html=`<div style="padding:10px 0;font-size:13px;color:var(--text-sub)">在線：<b style="color:#4ade80">${onlineCount}</b> · 離線：<b>${offlineCount}</b></div>`+groupHTML;
  openPage({title:'在線查詢',bodyHTML:html});
}
function pickTextColor(hex){ const h=String(hex).replace('#','');if(h.length!==6)return '#fff';const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);const lum=(0.299*r+0.587*g+0.114*b)/255;return lum>0.6?'#111':'#fff'; }
function hexA(hex,a){ const h=String(hex).replace('#','');if(h.length!==6)return `rgba(59,130,246,${a})`;const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return `rgba(${r},${g},${b},${a})`; }
function lightenColor(hex,amt){ const h=String(hex).replace('#','');if(h.length!==6)return hex;let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);r=Math.min(255,r+amt);g=Math.min(255,g+amt);b=Math.min(255,b+amt);return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function darkenColor(hex,amt){ const h=String(hex).replace('#','');if(h.length!==6)return hex;let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);r=Math.max(0,r-amt);g=Math.max(0,g-amt);b=Math.max(0,b-amt);return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }

async function renderAdminTab(tab){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.arg===tab));

  if(tab==='users')body.innerHTML=renderUserList();

async function submitCreateAccount(){
  if(me.role!=='superadmin')return;
  const errEl=document.getElementById('naErr');errEl.textContent='';
  const username=(document.getElementById('na_username').value||'').trim().toLowerCase();
  const password=(document.getElementById('na_password').value||'').trim();
  const seat=parseInt(document.getElementById('na_seat').value,10);
  const displayName=(document.getElementById('na_displayName').value||'').trim();
  const cls=document.getElementById('na_class').value;
  if(!username||!password||!seat||!displayName){errEl.textContent='請填寫所有欄位';return;}
  try{
    const existSnap=await get(child(ref(db),'users/'+username));
    if(existSnap.exists()){errEl.textContent='此登入名稱已存在';return;}
    const allSnap=await get(ref(db,'users'));
    const allVal=allSnap.exists()?allSnap.val():{};
    for(const k in allVal){const u=allVal[k];if(u.class===cls&&u.seat===seat){errEl.textContent='此班別座號已存在';return;}}
    const usedColors=Object.values(allVal).map(u=>u.color).filter(c=>c&&/^#[0-9a-fA-F]{6}$/.test(c));
    const newColor=generateUniqueColor(usedColors);
    await set(ref(db,'users/'+username),{username,password,displayName,seat,class:cls,color:newColor,role:'member',avatar:null,banned:null,disabled:false,neverLoggedIn:true,createdAt:Date.now()});
    showNotif('已建立帳號');
    renderAdminTab('accounts');
  }catch(e){errEl.textContent=e.message;}
}
function generateUniqueColor(existing){
  function randHex(){return Math.floor(Math.random()*16777216);}
  function hexStr(n){return '#'+n.toString(16).padStart(6,'0');}
  function rgb(n){return [(n>>16)&255,(n>>8)&255,n&255];}
  function diff(a,b){return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2]);}
  const existRGB=existing.map(h=>{const hh=h.replace('#','');return [parseInt(hh.substr(0,2),16),parseInt(hh.substr(2,2),16),parseInt(hh.substr(4,2),16)];});
  for(let i=0;i<1000;i++){const n=randHex();const c=rgb(n);const lum=(0.299*c[0]+0.587*c[1]+0.114*c[2])/255;if(lum<0.2)continue;let ok=true;for(const e of existRGB){if(diff(c,e)<100){ok=false;break;}}if(ok)return hexStr(n);}
  return hexStr(randHex());
}

async function openUserDetail(username){ const snap=await get(child(ref(db),'users/'+username));if(!snap.exists())return;const u=snap.val();const isSuper=me.role==='superadmin';const isTargetSuper=u.role==='superadmin';const isTargetAdmin=u.role==='admin';const canBan=isSuper&&u.username!==me.username;const canGrant=isSuper&&u.username!==me.username;const canAccount=isSuper&&u.username!==me.username;const bgColor=isTargetSuper||isTargetAdmin?'#8b5cf6':(u.color||'#3b82f6');const textColor=pickTextColor(bgColor);const avatarHTML=u.avatar?(String(u.avatar).startsWith('data:')?`<img src="${u.avatar}">`:u.avatar):escapeHtml((u.displayName||u.username||'?').charAt(0).toUpperCase());const roleLabel=isTargetSuper?'超級管理員':(isTargetAdmin?'管理員':'普通用戶');const heroHTML=`<div class="profile-hero" style="background:${bgColor};color:${textColor}"><div class="hero-avatar" style="background:${bgColor};color:${textColor}">${avatarHTML}</div><div class="hero-name">${escapeHtml(u.displayName||u.username)}</div><div class="hero-sub">${escapeHtml(u.class||'')} #${u.seat||''} · ${u.username}</div><div class="hero-badge">${roleLabel}</div></div>`;let bodyHTML='';if(u.disabled)bodyHTML+=`<div class="ban-status disabled"><b>已停用</b></div>`;if(u.banned)bodyHTML+=`<div class="ban-status ${u.banned.type}"><b>${u.banned.type==='severe'?'嚴重封禁':'普通封禁'}</b><br>原因：${escapeHtml(u.banned.reason||'（無）')}</div>`;if(u.password)bodyHTML+=`<div class="section-title">密碼</div><div style="font-family:Consolas,monospace;font-size:14px;background:var(--bg-input);padding:10px 12px;border-radius:10px;margin-bottom:10px;letter-spacing:1px">${escapeHtml(u.password)}</div>`;if(canAccount){bodyHTML+=`<div class="section-title">帳號管理</div><div class="ban-block">`;if(u.disabled)bodyHTML+=`<button class="btn-ok" data-action="enableAccount" data-arg="${u.username}">恢復帳號</button>`;else bodyHTML+=`<button class="btn-warn" data-action="disableAccount" data-arg="${u.username}">停用帳號</button>`;bodyHTML+=`<button class="btn-danger async function trimAIMemory(){
  const snap=await get(ref(db,'aiMemory/messages'));if(!snap.exists())return;
  const val=snap.val();const keys=Object.keys(val);
  if(keys.length<=100)return;
  const sorted=keys.map(k=>({k,time:val[k].time||0})).sort((a,b)=>a.time-b.time);
  for(const x of sorted.slice(0,sorted.length-100))await remove(ref(db,'aiMemory/messages/'+x.k));
}

applyTheme();applyLang();applyI18n();
(async function boot(){
  await checkVersion();
  const saved=sessionStorage.getItem('chat_me');
  if(!saved){await ensureAIUser().catch(()=>{});return;}
  try{
    const u=JSON.parse(saved);
    const snap=await get(child(ref(db),'users/'+u.username));
    if(!snap.exists()){sessionStorage.removeItem('chat_me');return;}
    const data=snap.val();
    if(data.disabled===true){sessionStorage.removeItem('chat_me');return;}
    if(data.banned&&data.banned.type==='severe'){sessionStorage.removeItem('chat_me');return;}
    me={username:data.username,displayName:data.displayName||data.username,seat:data.seat,cls:data.class||'',color:data.color||'#3b82f6',role:data.role||'member',avatar:data.avatar||null,banned:data.banned||null,disabled:false};
    if(data.theme){theme=data.theme;localStorage.setItem('chat_theme',theme);applyTheme();}
    if(data.lang){lang=data.lang;localStorage.setItem('chat_lang',lang);applyLang();applyI18n();}
    await set(ref(db,'presence/'+me.username),true);
    await ensureAIUser();
    enterChat();
  }catch(e){sessionStorage.removeItem('chat_me');}
})();
