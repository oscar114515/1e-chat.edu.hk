<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>班級聊天室</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  :root{--bg-app:#0f172a;--bg-header:linear-gradient(90deg,#1e293b,#0f172a);--bg-card:#1e293b;--bg-input:rgba(15,23,42,.6);--text-main:#e2e8f0;--text-sub:#94a3b8;--text-muted:#64748b;--border:rgba(148,163,184,.15);--border-strong:rgba(148,163,184,.3);--primary:#3b82f6;--primary-2:#2563eb;--ai:#66ccff}
  body.theme-light{--bg-app:#f0f2f5;--bg-header:linear-gradient(90deg,#ffffff,#f8fafc);--bg-card:#ffffff;--bg-input:#f0f2f5;--text-main:#1c1e21;--text-sub:#65676b;--text-muted:#8a8d91;--border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.15)}
  body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg-app);color:var(--text-main);overflow:hidden;height:100vh;height:100dvh;transition:background .5s ease,color .4s ease}
  .hidden{display:none!important}
  #loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg-app);padding:20px;overflow-y:auto;height:100vh;height:100dvh;transition:background .5s ease}
  #loginCard{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:32px 26px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:fadeUp .5s ease;transition:background .4s ease,border-color .4s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  #loginCard h1{font-size:22px;text-align:center;margin-bottom:6px}
  #loginCard .sub{font-size:13px;text-align:center;color:var(--text-sub);margin-bottom:20px}
  .top-controls{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
  .lang-select{padding:6px 10px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:12px;font-family:inherit;outline:none;cursor:pointer}
  .field{margin-bottom:14px}
  .field input{width:100%;padding:13px 15px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:15px;outline:none;font-family:inherit}
  .field input:focus{border-color:var(--primary)}
  #loginBtn{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  #loginBtn:disabled{opacity:.6}
  #loginError{color:#f87171;font-size:13px;text-align:center;min-height:18px;margin-bottom:8px;white-space:pre-wrap}
  #loginVersion{text-align:center;font-size:11px;color:var(--text-muted);margin-top:14px}
  #chatScreen{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{background:var(--bg-header);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);flex-shrink:0;min-height:52px;transition:background .4s ease,border-color .4s ease}
  header .title{font-size:15px;font-weight:600;white-space:nowrap;flex-shrink:0}
  header .right{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-sub);flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
  .ver{background:rgba(56,189,248,.15);color:#38bdf8;padding:3px 7px;border-radius:6px;font-size:10.5px;font-weight:600}
  .hbtn{background:rgba(148,163,184,.15);color:var(--text-main);border:none;padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;position:relative}
  .hbtn:hover{background:rgba(148,163,184,.3)}
  .hbtn.admin{background:rgba(139,92,246,.25);color:#a78bfa}
  .hbtn .dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;background:#ef4444;color:#fff;border-radius:8px;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
  @media(max-width:520px){header{padding:8px 10px;min-height:auto;flex-direction:column;align-items:stretch;gap:6px}header .title{font-size:14px}header .right{width:100%;justify-content:space-between}.hbtn{font-size:11.5px;padding:5px 9px;flex:1;text-align:center}.ver{font-size:10px}}
  #noticeBar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(251,191,36,.12);border-bottom:1px solid rgba(251,191,36,.25);flex-shrink:0;font-size:13px;cursor:pointer;transition:background .3s ease}
  body.theme-light #noticeBar{background:rgba(251,191,36,.15)}
  #noticeBar:hover{background:rgba(251,191,36,.2)}
  #noticeBar .notice-icon{color:#fbbf24;font-size:14px;flex-shrink:0;font-weight:700}
  #noticeBar .notice-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #noticeBar .notice-text .label{color:#fbbf24;font-weight:600;margin-right:6px}
  #noticeBar .notice-add{background:#fbbf24;color:#1c1917;border:none;width:32px;height:32px;border-radius:8px;font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  #noticeBar .notice-pin-count{background:rgba(251,191,36,.3);color:#fbbf24;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;flex-shrink:0}
  #classStatus{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 12px;background:rgba(30,41,59,.5);border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-sub);flex-shrink:0;transition:background .4s ease}
  body.theme-light #classStatus{background:rgba(255,255,255,.7)}
  #classStatus .online{color:#4ade80;font-weight:600}
  #classStatus .ban-item{background:rgba(220,38,38,.15);color:#fca5a5;padding:2px 8px;border-radius:6px;font-size:11px}
  #classStatus .ban-item.light{background:rgba(234,88,12,.15);color:#fdba74}
  #searchBar{display:flex;gap:8px;padding:8px 12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center;transition:background .4s ease}
  #searchInput{flex:1;padding:8px 12px;border-radius:18px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:13px;outline:none;font-family:inherit}
  #searchCount{font-size:11.5px;color:var(--text-sub)}
  #chatBox{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg-app);-webkit-overflow-scrolling:touch;scroll-behavior:smooth;transition:background .5s ease}
  #chatBox::-webkit-scrollbar{width:6px}
  #chatBox::-webkit-scrollbar-thumb{background:rgba(148,163,184,.3);border-radius:3px}
  .msg{max-width:75%;display:flex;gap:10px;align-items:flex-start;position:relative}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;user-select:none;overflow:hidden;cursor:pointer}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .bubble-wrap{display:flex;flex-direction:column;gap:3px;position:relative;min-width:0}
  .msg.me .bubble-wrap{align-items:flex-end}
  .meta{font-size:11px;color:var(--text-muted);padding:0 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .meta .msgid{color:var(--text-muted);font-size:10px;font-family:monospace}
  .meta .enc-tag{background:rgba(220,38,38,.2);color:#fca5a5;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600}
  .meta .ai-tag{background:rgba(102,204,255,.25);color:#66ccff;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700}
  .meta .poll-tag{background:rgba(56,189,248,.25);color:#38bdf8;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700}
  .bubble{padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap;color:#fff;max-width:100%}
  .msg.me .bubble{border-bottom-right-radius:4px}
  .msg:not(.me) .bubble{border-bottom-left-radius:4px}
  .bubble .mention{background:rgba(255,255,255,.25);padding:1px 5px;border-radius:4px;font-weight:600}
  .bubble img.msg-img{max-width:220px;max-height:220px;border-radius:8px;display:block;cursor:pointer;margin-top:4px}
  .bubble .file-msg{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
  .bubble .file-msg .fi{font-size:16px;font-weight:700}
  .bubble .file-msg .fn{font-size:13px;word-break:break-all;flex:1}
  .bubble .file-msg .fs{font-size:11px;opacity:.8}
  .bubble .voice-msg{display:flex;align-items:center;gap:10px;padding:4px 0;cursor:pointer;min-width:120px}
  .bubble .voice-msg .vi{font-size:14px;font-weight:700}
  .bubble .voice-msg .vt{font-size:13px}
  .bubble .voice-msg .vp{flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
  .bubble .voice-msg .vp>div{height:100%;width:0;background:#fff;transition:width .1s}
  .bubble .voice-msg .vd{width:8px;height:8px;border-radius:50%;background:#f87171;flex-shrink:0}
  .bubble .voice-msg.played .vd{display:none}
  .bubble .loc-msg{cursor:pointer;max-width:240px}
  .bubble .loc-msg .lm-map{width:220px;height:150px;border-radius:8px;overflow:hidden;background:#222;margin-bottom:6px}
  .bubble .loc-msg .lm-map img{width:100%;height:100%;object-fit:cover}
  .bubble .loc-msg .lm-label{font-size:12px;display:flex;align-items:center;gap:4px}
  .bubble .ai-sponsor{display:block;margin-top:8px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.3);font-size:10.5px;opacity:.75;font-style:italic}
  .msg-tools{display:flex;gap:4px;margin-top:2px;opacity:0;flex-wrap:wrap}
  .msg:hover .msg-tools{opacity:1}
  .msg-tools button{background:rgba(148,163,184,.15);color:var(--text-sub);border:none;padding:2px 7px;border-radius:6px;font-size:10.5px;cursor:pointer;font-family:inherit}
  .msg-tools button:hover{background:rgba(148,163,184,.3);color:var(--text-main)}
  .msg-tools button.danger:hover{background:rgba(220,38,38,.3);color:#fca5a5}
  #inputBar{padding:10px 12px;background:var(--bg-card);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-shrink:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));position:relative;flex-wrap:wrap;transition:background .4s ease}
  #micBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  #micBtn.recording{background:#dc2626;color:#fff}
  #msgInput{flex:1;padding:11px 14px;border-radius:22px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:14px;outline:none;font-family:inherit;min-width:0}
  #plusBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:22px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  #sendBtn{width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  #encToggle{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-sub);padding:4px 8px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-input);cursor:pointer;user-select:none;flex-shrink:0}
  #encToggle.active{background:rgba(220,38,38,.2);border-color:#dc2626;color:#fca5a5}
  #encToggle input{display:none}
  #encToggle .dot-check{width:10px;height:10px;border-radius:50%;border:2px solid var(--border-strong)}
  #encToggle.active .dot-check{background:#dc2626;border-color:#dc2626}
  #plusPanel{position:absolute;bottom:calc(100% + 8px);left:12px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:16px;padding:14px;display:grid;grid-template-columns:repeat(3,72px);gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:50}
  #plusPanel .pi{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px;border-radius:12px}
  #plusPanel .pi:hover{background:rgba(56,189,248,.15)}
  #plusPanel .pi .pic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:rgba(56,189,248,.2);color:#38bdf8}
  #plusPanel .pi .pit{font-size:11px;color:var(--text-sub)}
  #plusPanel .pi.ai-on .pic{background:#66ccff;color:#0f172a}
  #plusPanel .pi.ai-on .pit{color:#66ccff;font-weight:700}
  #mentionPopup{position:absolute;bottom:100%;left:12px;right:12px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:12px;max-height:220px;overflow-y:auto;box-shadow:0 -8px 24px rgba(0,0,0,.5);margin-bottom:6px}
  #mentionPopup .mention-item{padding:10px 14px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:10px}
  #mentionPopup .mention-item:hover{background:rgba(56,189,248,.15)}
  #mentionPopup .mention-item .mi-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden}
  #mentionPopup .mention-item .mi-av img{width:100%;height:100%;object-fit:cover}
  .empty{text-align:center;color:var(--text-muted);padding:40px 0;font-size:14px}
  .fullPage{position:fixed;inset:0;background:var(--bg-app);z-index:100;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;transition:background .5s ease}
  .fullPage .fp-header{padding:12px 16px;display:flex;align-items:center;gap:12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0;transition:background .4s ease}
  .fullPage .fp-back{background:rgba(148,163,184,.15);color:var(--text-main);border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
  .fullPage .fp-title{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fullPage .fp-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .profile-hero{padding:32px 20px 24px;text-align:center;position:relative}
  .profile-hero .hero-avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;color:#fff;overflow:hidden;border:4px solid rgba(255,255,255,.25)}
  .profile-hero .hero-avatar img{width:100%;height:100%;object-fit:cover}
  .profile-hero .hero-name{font-size:24px;font-weight:700;margin-bottom:4px}
  .profile-hero .hero-sub{font-size:14px;opacity:.9}
  .profile-hero .hero-badge{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;background:rgba(255,255,255,.25)}
  .profile-content{padding:20px 20px 40px}
  .section-title{font-size:13px;color:var(--text-sub);margin:18px 0 10px;font-weight:600}
  .form-row{margin-bottom:14px}
  .form-row input[type=text],.form-row input[type=password],.form-row input[type=number],.form-row textarea,.form-row select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:14px;outline:none;font-family:inherit}
  .form-row textarea{resize:vertical;min-height:120px;line-height:1.5}
  .char-count{text-align:right;font-size:11px;color:#4ade80;margin-top:4px}
  .char-count.over{color:#f87171}
  .btn-primary,.btn-danger,.btn-warn,.btn-ok,.btn-ghost{width:100%;padding:12px;border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}
  .btn-primary{background:linear-gradient(135deg,#3b82f6,#2563eb)}
  .btn-danger{background:linear-gradient(135deg,#dc2626,#b91c1c)}
  .btn-warn{background:linear-gradient(135deg,#ea580c,#c2410c)}
  .btn-ok{background:linear-gradient(135deg,#16a34a,#15803d)}
  .btn-ghost{background:rgba(148,163,184,.15);color:var(--text-main)}
  .avatar-options{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .av-opt{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:2px solid transparent;background:var(--bg-input)}
  .av-opt:hover{border-color:var(--primary)}
  .err{color:#f87171;font-size:12px;margin-top:6px;min-height:14px}
  .ok-msg{color:#4ade80;font-size:12px;margin-top:6px;min-height:14px}
  input[type=file]{display:none}
  .upload-btn{display:inline-block;padding:10px 16px;border-radius:10px;background:rgba(148,163,184,.2);color:var(--text-main);font-size:13px;cursor:pointer;font-family:inherit;border:1px dashed var(--border-strong);text-align:center;width:100%}
  .tabs{display:flex;padding:0 16px;border-bottom:1px solid var(--border);background:var(--bg-card);overflow-x:auto;flex-shrink:0}
  .tab{padding:12px 16px;text-align:center;font-size:13px;color:var(--text-sub);cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;background:none;border-left:none;border-right:none;border-top:none;white-space:nowrap}
  .tab.active{color:#a78bfa;border-bottom-color:#8b5cf6;font-weight:600}
  .admin-body{padding:16px 18px 40px}
  .user-list{display:flex;flex-direction:column;gap:8px}
  .user-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg-input);border:1px solid var(--border);cursor:pointer}
  .user-card:hover{border-color:rgba(56,189,248,.4)}
  .user-card .uc-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
  .user-card .uc-avatar img{width:100%;height:100%;object-fit:cover}
  .user-card .uc-info{flex:1;min-width:0}
  .user-card .uc-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-card .uc-sub{font-size:11.5px;color:var(--text-sub);margin-top:2px}
  .user-card .uc-badge{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600;flex-shrink:0}
  .user-card .uc-presence{margin-left:auto;flex-shrink:0;width:10px;height:10px;border-radius:50%;background:#475569}
  .user-card .uc-presence.online{background:#4ade80;box-shadow:0 0 8px #4ade80}
  .user-card .uc-aion{font-size:10px;padding:2px 6px;border-radius:6px;background:rgba(102,204,255,.2);color:#66ccff;font-weight:700;margin-left:8px;flex-shrink:0}
  .badge-ban-severe{background:rgba(220,38,38,.25);color:#fca5a5}
  .badge-ban-light{background:rgba(234,88,12,.25);color:#fdba74}
  .badge-admin{background:rgba(139,92,246,.25);color:#c4b5fd}
  .badge-super{background:rgba(239,68,68,.3);color:#fca5a5}
  .badge-ai{background:rgba(102,204,255,.25);color:#66ccff}
  .log-item{padding:10px 12px;border-radius:10px;background:var(--bg-input);border-left:3px solid #38bdf8;font-size:12.5px;margin-bottom:8px}
  .log-item.action-login{border-left-color:#4ade80}
  .log-item.action-logout{border-left-color:#94a3b8}
  .log-item.action-changepwd{border-left-color:#facc15}
  .log-item.action-changename{border-left-color:#a78bfa}
  .log-item.action-ban{border-left-color:#f87171}
  .log-item.action-delete{border-left-color:#fb7185}
  .log-item.action-notice{border-left-color:#fbbf24}
  .log-item.action-ai{border-left-color:#66ccff}
  .log-item .lt{color:var(--text-sub);font-size:11px}
  .log-item .lm{margin-top:3px;word-break:break-word}
  .ban-status{padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:13px}
  .ban-status.severe{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.4);color:#fca5a5}
  .ban-status.light{background:rgba(234,88,12,.15);border:1px solid rgba(234,88,12,.4);color:#fdba74}
  .ban-block{background:var(--bg-input);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
  .ban-block .ban-label{font-size:14px;font-weight:600}
  .ban-block .ban-sub{font-size:11.5px;color:var(--text-sub);margin-top:2px}
  .ban-type-buttons{display:flex;gap:8px;margin-top:12px}

let versionChecking = false, versionMismatchShown = false;
async function checkVersion(){
  if (versionChecking || versionMismatchShown) return;
  versionChecking = true;
  try {
    const snap = await get(ref(db, 'meta/version'));
    if (!snap.exists()) return;
    const sv = String(snap.val() || '').trim();
    if (sv && sv !== CURRENT_VERSION) showVersionModal(sv);
  } catch(e) { console.warn(e); }
  finally { versionChecking = false; }
}
function showVersionModal(serverVersion){
  if (versionMismatchShown) return;
  versionMismatchShown = true;
  const old = document.getElementById('versionModal'); if (old) old.remove();
  const modal = document.createElement('div');
  modal.id = 'versionModal';
  modal.innerHTML = `<div class="vm-card"><h3>⚠ 你的網站不是最新版本</h3><p>你的版本：<b style="color:#f87171">${CURRENT_VERSION}</b></p><p>最新版本：<b style="color:#4ade80">${serverVersion}</b></p><div class="vm-btns"><button class="vm-go" id="vmGoBtn">前往新版本</button><button class="vm-exit" id="vmExitBtn">退出網站</button></div></div>`;
  document.body.appendChild(modal);
  document.getElementById('vmGoBtn').onclick = () => { savePageState(); saveAllDrafts(); const url = new URL(location.href); url.searchParams.set('_v', Date.now().toString()); location.replace(url.toString()); };
  document.getElementById('vmExitBtn').onclick = () => { try { window.close(); } catch(e) {} setTimeout(() => { location.href = 'about:blank'; }, 200); };
}
function savePageState(){
  let state = 'chat';
  if (pageRoot.children.length > 0) {
    const fp = pageRoot.querySelector('.fullPage');
    if (fp) {
      const title = fp.querySelector('.fp-title');
      const t2 = title ? title.textContent.trim() : '';
      const id = fp.id || '';
      if (id === 'noticeFullscreen') state = 'noticeFullscreen';
      else if (t2.includes('後台')) state = 'admin:users';
      else if (t2.includes('日誌')) state = 'logs';
      else if (t2.includes('感謝')) state = 'thanks';
      else if (t2.includes('版本')) state = 'version';
      else state = 'page:' + t2;
    }
  }
  sessionStorage.setItem('chat_page_state', state);
}
function saveAllDrafts(){
  const drafts = {};
  document.querySelectorAll('input[type=text],input[type=password],textarea,select').forEach((el, i) => {
    if (el.id) drafts['id:' + el.id] = el.value; else drafts['idx:' + i] = el.value;

}
function restoreAllDrafts(){
  let drafts = {};
  try { drafts = JSON.parse(sessionStorage.getItem('chat_drafts') || '{}'); } catch(e) {}

  setTimeout(() => {
    let idx = 0;
    document.querySelectorAll('input[type=text],input[type=password],textarea,select').forEach((el) => {
      const kId = el.id ? 'id:' + el.id : null, kIdx = 'idx:' + idx;
      if (kId && drafts[kId] !== undefined) el.value = drafts[kId];
      else if (drafts[kIdx] !== undefined) el.value = drafts[kIdx];
      idx++;
    });
  }, 300);
}

let lang = localStorage.getItem('chat_lang') || 'zh-Hant';
function t(k){ return (I18N[lang] && I18N[lang][k]) || I18N['zh-Hant'][k] || k; }
function applyI18n(){ document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); }); document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); }); }

let theme = localStorage.getItem('chat_theme') || 'dark';
function applyTheme(){ document.body.classList.toggle('theme-light', theme === 'light'); ['themeToggleLogin','themeToggleChat'].forEach(id => { const el = document.getElementById(id); if (el) el.checked = (theme === 'light'); }); }
function applyLang(){ ['langSelectLogin','langSelectChat'].forEach(id => { const el = document.getElementById(id); if (el) el.value = lang; }); }
function setThemeLocal(newTheme){ theme = newTheme; localStorage.setItem('chat_theme', newTheme); applyTheme(); }

/* 主題、語言：登入後改存 Firebase；未登入時暫存 localStorage */
async function setTheme(newTheme){
  theme = newTheme; applyTheme(); localStorage.setItem('chat_theme', newTheme);
  if (me) { try { await update(ref(db,'users/'+me.username), { theme: newTheme }); } catch(e){} }
}
async function setLang(newLang){
  lang = newLang; applyLang(); applyI18n(); localStorage.setItem('chat_lang', newLang);
  render(); renderNoticeBar();
  if (me) { try { await update(ref(db,'users/'+me.username), { lang: newLang }); } catch(e){} }
}
document.getElementById('themeToggleLogin').addEventListener('change', e => setTheme(e.target.checked ? 'light' : 'dark'));
document.getElementById('themeToggleChat').addEventListener('change', e => setTheme(e.target.checked ? 'light' : 'dark'));
$('langSelectLogin').addEventListener('change', e => setLang(e.target.value));
$('langSelectChat').addEventListener('change', e => setLang(e.target.value));
encCheckbox.addEventListener('change', () => { encToggle.classList.toggle('active', encCheckbox.checked); });

async function handleLogin(){
  const u = loginUsername.value.trim().toLowerCase();
  const p = loginPassword.value;
  loginError.textContent = '';
  if (!u || !p) { loginError.textContent = t('loginSub'); return; }
  loginBtn.disabled = true; loginBtn.textContent = t('loginBtnLoading');
  try {
    const snap = await get(child(ref(db),'users/'+u));
    if (!snap.exists()) { loginError.textContent = t('noUser'); return; }
    const data = snap.val();
    if (data.banned && data.banned.type === 'severe') { loginError.textContent = t('bannedSevere')+'\n'+t('reason')+'：'+(data.banned.reason||t('noReason')); return; }
    if (data.password !== p) { loginError.textContent = t('wrongPwd'); return; }
    me = { username:data.username, displayName:data.displayName||data.username, seat:data.seat, color:data.color||'#3b82f6', role:data.role||'member', avatar:data.avatar||null, banned:data.banned||null };
    if (data.theme) { theme = data.theme; localStorage.setItem('chat_theme', theme); applyTheme(); }
    if (data.lang) { lang = data.lang; localStorage.setItem('chat_lang', lang); applyLang(); applyI18n(); }
    sessionStorage.setItem('chat_me', JSON.stringify(me));
    await writeLog('login', t('loggedIn'));
    await set(ref(db,'presence/'+me.username), true);
    await ensureAIUser();
    // 每日摘要：第一個登入的人觸發
    runDailySummary().catch(()=>{});
    enterChat();
    if (isReloadAfterVersion()) {
      setTimeout(async () => {
        await restorePageState();
        restoreAllDrafts();
        const url = new URL(location.href);
        url.searchParams.delete('_v');
        history.replaceState(null, '', url.toString());
      }, 500);
    }
  } catch (e) { console.error(e); loginError.textContent = t('notifActionFail')+': '+(e.code||e.message); }
  finally { loginBtn.disabled = false; loginBtn.textContent = t('loginBtn'); }
}

/* ===== 送訊息 ===== */
async function sendMessage(){
  const text = msgInput.value.trim();
  if (!text || !me) return;
  if (me.banned && me.banned.type === 'light') { showNotif(t('bannedLight')+'：'+(me.banned.reason||t('noReason'))); return; }
  sendBtn.disabled = true;
  const isEncrypted = encCheckbox.checked;
  try {
    const c = await get(child(ref(db),'meta/msgCounter'));
    const next = (c.exists()?c.val():0) + 1;
    await set(ref(db,'meta/msgCounter'), next);
    const msgId = 'msg_'+String(next).padStart(4,'0');
    await set(ref(db,'messages/'+msgId), { id:msgId, username:me.username, displayName:me.displayName, seat:me.seat, color:me.color, avatar:me.avatar, role:me.role, text, type:'text', encrypted: isEncrypted, createdAt:Date.now(), deleted:false });
    const mentions = extractMentions(text);
    for (const uname of mentions) {
      if (uname === me.username) continue;
      await push(ref(db,'mentions/'+uname), { from:me.username, fromName:me.displayName, text, msgId, createdAt:Date.now(), read:false });
    }
    await writeLog('send', t('sentMsg')+'：'+text.slice(0,50));
    msgInput.value = '';
    encCheckbox.checked = false; encToggle.classList.remove('active');
    mentionPopup.classList.add('hidden');
    // AI 觸發
    if (isAIModeOld()) {
      if (text.includes('小喆') || aiChatMode) handleAITrigger(text, true).catch(e => console.error('AI trigger error', e));
    } else {
      if (myAIOn) handleAITrigger(text, false).catch(e => console.error('AI trigger error', e));
    }
  } catch(e) { console.error(e); showNotif(t('sendFail')+': '+(e.code||e.message)); }
  finally { sendBtn.disabled = false; msgInput.focus(); }
}

async function sendMedia(type, payload){
  if (!me) return;
  if (me.banned && me.banned.type === 'light') { showNotif(t('bannedLight')); return; }
  try {
    const c = await get(child(ref(db),'meta/msgCounter'));
    const next = (c.exists()?c.val():0) + 1;
    await set(ref(db,'meta/msgCounter'), next);
    const msgId = 'msg_'+String(next).padStart(4,'0');
    await set(ref(db,'messages/'+msgId), { id:msgId, username:me.username, displayName:me.displayName, seat:me.seat, color:me.color, avatar:me.avatar, role:me.role, ...payload, type, createdAt:Date.now(), deleted:false });
    await writeLog('send', t('sentMsg'));
  } catch(e) { console.error(e); showNotif(t('sendFail')); }
}

function extractMentions(text){
  const re = /@([a-zA-Z0-9_]+)/g; const out=[]; let m;
  while ((m = re.exec(text)) !== null) { const u = m[1].toLowerCase(); if (allUsers[u]) out.push(u); }
  return out;
}

msgInput.addEventListener('input', () => {

function showMentionPopup(kw){
  const list = Object.values(allUsers).filter(u => u.username !== (me&&me.username))
    .filter(u => !kw || u.username.toLowerCase().includes(kw) || (u.displayName||'').toLowerCase().includes(kw)).slice(0,8);

  mentionPopup.classList.remove('hidden');

    const isAdmin = u.role === 'superadmin' || u.role === 'admin';
    const isAI = u.role === 'ai';
    const color = isAI ? AI_COLOR : (isAdmin ? '#8b5cf6' : (u.color || '#3b82f6'));
    const av = u.avatar ? (String(u.avatar).startsWith('data:')?`<img src="${u.avatar}">`:u.avatar) : escapeHtml((u.displayName||u.username).charAt(0).toUpperCase());
    return `<div class="mention-item" data-action="pickMention" data-arg="${u.username}"><div class="mi-av" style="background:${color}">${av}</div><div>${escapeHtml(u.displayName||u.username)}</div></div>`;
  }).join('');
}

指令類型（cmd）：

- setPassword：改密碼。target=username，value=新密碼
- ban：封禁。target=username，value=light 或 severe，reason=原因
- unban：解封。target=username

- revokeAdmin：撤銷管理員。target=username
- deleteMsg：刪除訊息。target=訊息編號
- restoreMsg：恢復訊息。target=訊息編號
- purgeMsg：徹底刪除訊息。target=訊息編號

- pinNotice：置頂/取消置頂公告。target=公告key
- lockNotice：加鎖/解鎖公告。target=公告key
- approveNotice：批准公告。target=申請key
- rejectNotice：拒絕公告。target=申請key
- logout：強制登出。target=username
- clearChat：清空聊天室。無參數

async function sendThinkingMessage(){
  const c = await get(child(ref(db),'meta/msgCounter'));
  const next = (c.exists()?c.val():0) + 1;
  await set(ref(db,'meta/msgCounter'), next);
  const msgId = 'msg_'+String(next).padStart(4,'0');
  const aiSnap = await get(child(ref(db),'users/' + AI_NAME));
  const aiData = aiSnap.exists() ? aiSnap.val() : {};
  await set(ref(db,'messages/'+msgId), { id: msgId, username: AI_NAME, displayName: aiData.displayName || AI_NAME, seat: 0, color: aiData.color || AI_COLOR, avatar: aiData.avatar || 'AI', role: 'ai', text: '', type: 'text', thinking: true, sponsor: false, reasoning: '', warn: false, createdAt: Date.now(), deleted: false });
  return msgId;
}
async function callAI(messages, retry = 0){
  try {
    const res = await fetch(AI_API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'api-key': AI_KEY }, body: JSON.stringify({ model: AI_MODEL, messages, stream: false, max_tokens: 1024, chat_template_kwargs: { enable_thinking: true } }) });
    if (res.status === 429 && retry < 3) { await new Promise(r => setTimeout(r, 2000)); return callAI(messages, retry + 1); }
    if (!res.ok) throw new Error('API ' + res.status);
    const data = await res.json();
    const choice = data.choices && data.choices[0];
    if (!choice) return null;
    return { content: (choice.message && choice.message.content) || '', reasoning: (choice.message && choice.message.reasoning_content) || '' };
  } catch (e) {
    if (retry < 3) { await new Promise(r => setTimeout(r, 2000)); return callAI(messages, retry + 1); }
    throw e;
  }
}
async function sendAIMessage(text, reasoning, isSystem, isWarn, customClass, cmdInfo){
  const c = await get(child(ref(db),'meta/msgCounter'));
  const next = (c.exists()?c.val():0) + 1;
  await set(ref(db,'meta/msgCounter'), next);
  const msgId = 'msg_'+String(next).padStart(4,'0');
  const aiSnap = await get(child(ref(db),'users/' + AI_NAME));
  const aiData = aiSnap.exists() ? aiSnap.val() : {};
  await set(ref(db,'messages/'+msgId), { id: msgId, username: AI_NAME, displayName: aiData.displayName || AI_NAME, seat: 0, color: aiData.color || AI_COLOR, avatar: aiData.avatar || 'AI', role: 'ai', text: text, reasoning: reasoning || '', type: 'text', isSystem: isSystem || false, warn: isWarn || false, sponsor: !cmdInfo, customClass: customClass || '', cmdInfo: cmdInfo || '', createdAt: Date.now(), deleted: false });
}
async function trimAIMemory(){
  const snap = await get(ref(db,'aiMemory/messages'));
  if (!snap.exists()) return;
  const val = snap.val(); const keys = Object.keys(val);
  if (keys.length <= 100) return;
  const sorted = keys.map(k => ({ k, time: val[k].time || 0 })).sort((a,b) => a.time - b.time);
  for (const x of sorted.slice(0, sorted.length - 100)) await remove(ref(db,'aiMemory/messages/' + x.k));
}

/* ===== 每日摘要 ===== */
function hkDateKey(ts){ const d = new Date(ts + 8*3600*1000); return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`; }
async function runDailySummary(){
  if (!me) return;
  const todayKey = hkDateKey(Date.now());
  // 找昨天
  const y = new Date(Date.now() + 8*3600*1000 - 86400000);
  const yKey = `${y.getUTCFullYear()}-${String(y.getUTCMonth()+1).padStart(2,'0')}-${String(y.getUTCDate()).padStart(2,'0')}`;
  try {
    const existed = await get(ref(db,'aiDailySummary/'+yKey));
    if (existed.exists()) return;
    // 取昨天的訊息
    const snap = await get(query(ref(db,'messages'), limitToLast(500)));
    if (!snap.exists()) return;
    const val = snap.val() || {};
    const yStart = new Date(yKey+'T00:00:00+08:00').getTime();
    const yEnd = yStart + 86400000;
    const list = Object.keys(val).map(k => val[k]).filter(m => m.createdAt >= yStart && m.createdAt < yEnd && !m.deleted && m.role !== 'ai');
    if (list.length === 0) { await set(ref(db,'aiDailySummary/'+yKey), { date: yKey, summary: '（昨天沒有訊息）', ts: Date.now() }); return; }
    const text = list.map(m => `${m.displayName||m.username}(${m.username}): ${m.text||'['+m.type+']'}`).join('\n');
    const aiRes = await callAI([
      { role: 'system', content: '你是一個摘要助手。請把以下班級聊天室昨天所有訊息，壓縮成 350 字以內的摘要（繁體中文，用顯示名稱）。' },
      { role: 'user', content: text }
    ]);
    if (!aiRes) return;
    const summary = (aiRes.content || '').slice(0, 350);
    await set(ref(db,'aiDailySummary/'+yKey), { date: yKey, summary, ts: Date.now() });
    // 只保留 30 天
    const allSnap = await get(ref(db,'aiDailySummary'));
    if (allSnap.exists()) {
      const allVal = allSnap.val();
      const keys = Object.keys(allVal).sort();
      while (keys.length > 30) { await remove(ref(db,'aiDailySummary/'+keys.shift())); }
    }
    // 刪除昨天的 AI 記憶（只刪昨天的逐條）
    const memSnap = await get(ref(db,'aiMemory/messages'));
    if (memSnap.exists()) {
      const memVal = memSnap.val();
      for (const k in memVal) { if (memVal[k].time >= yStart && memVal[k].time < yEnd) await remove(ref(db,'aiMemory/messages/'+k)); }
    }
  } catch(e) { console.warn('daily summary failed', e); }
}

function showAIConfirm(cmd, asker){
  pendingAIConfirm = { cmd, asker };
  const old = document.getElementById('aiConfirmBar'); if (old) old.remove();
  const bar = document.createElement('div');
  bar.id = 'aiConfirmBar';
  bar.innerHTML = `<div class="acb-text">${t('aiConfirmTitle')}<div class="acb-cmd">${escapeHtml(JSON.stringify(cmd))}</div></div><button data-action="aiAllow">${t('aiAllow')}</button><button data-action="aiDeny">${t('aiDeny')}</button>`;
  document.body.appendChild(bar);
}
async function aiAllow(){
  if (!pendingAIConfirm) return;
  const { cmd } = pendingAIConfirm;
  pendingAIConfirm = null;
  const bar = document.getElementById('aiConfirmBar'); if (bar) bar.remove();
  try {
    const result = await executeAIAction(cmd);
    if (result.ok) {
      const cmdStr = formatCmd(cmd);
      await sendAIMessage('已完成：' + result.desc + '\n指令：' + cmdStr, '', false, false, 'ai-success');
      await writeLog('ai', 'AI 操作成功：' + JSON.stringify(cmd));
    } else {
      const cmdStr = formatCmd(cmd);
      await sendAIMessage('失敗：' + result.error + '\n指令：' + cmdStr + '\n抱歉，我沒辦法完成這個操作。', '', false, false, 'ai-fail');
      await writeLog('ai', 'AI 操作失敗：' + JSON.stringify(cmd) + ' | ' + result.error);
    }
    await reloadMe();
  } catch (e) { await sendAIMessage('失敗：' + e.message, '', false, false, 'ai-fail'); }
}
async function aiDeny(){
  pendingAIConfirm = null;
  const bar = document.getElementById('aiConfirmBar'); if (bar) bar.remove();
  await sendAIMessage('好的，已取消操作。', '', false, false);
}
function formatCmd(cmd){
  const parts = [`${cmd.cmd}`];
  if (cmd.target !== undefined) parts.push(`target=${cmd.target}`);
  if (cmd.value !== undefined) parts.push(`value=${String(cmd.value).slice(0,80)}`);
  if (cmd.reason !== undefined) parts.push(`reason=${cmd.reason}`);
  return parts.join(' ');
}
function sanitizeNoticeHtml(html){
  if (!html) return '';
  let s = String(html);
  s = s.replace(/<\s*script[^>]*>[\s\S]*?<\s*\/\s*script\s*>/gi, '');
  s = s.replace(/<\s*iframe[^>]*>[\s\S]*?<\s*\/\s*iframe\s*>/gi, '');
  s = s.replace(/<\s*object[^>]*>[\s\S]*?<\s*\/\s*object\s*>/gi, '');
  s = s.replace(/<\s*embed[^>]*>/gi, '');
  s = s.replace(/<\s*form[^>]*>[\s\S]*?<\s*\/\s*form\s*>/gi, '');
  s = s.replace(/\son\w+\s*=\s*"[^"]*"/gi, '');
  s = s.replace(/\son\w+\s*=\s*'[^']*'/gi, '');
  s = s.replace(/\son\w+\s*=\s*[^\s>]+/gi, '');
  s = s.replace(/javascript:/gi, '');
  return s;
}

        const list = Object.values(val).sort((a,b) => b.createdAt - a.createdAt);

        const filtered = kw ? list.filter(l => (l.username||'').toLowerCase().includes(kw) || (l.displayName||'').toLowerCase().includes(kw) || (l.detail||'').toLowerCase().includes(kw) || (l.action||'').toLowerCase().includes(kw)) : list;
        const txt = filtered.slice(0,50).map(l => `${new Date(l.createdAt).toLocaleString('zh-TW')} ${l.displayName||l.username}(${l.username}) ${l.action}: ${l.detail||''}`).join('\n');
        // 把查到的日誌交給 AI 再答一次
        const follow = await callAI([
          { role: 'system', content: `你是小喆AI。以下是班級聊天室最近 100 筆日誌（已篩選）。請用繁體中文、口語化回答用戶的查詢。` },
          { role: 'user', content: `查詢：${cmd.value||'（全部）'}\n\n日誌：\n${txt || '（無資料）'}` }
        ]);
        if (follow && follow.content) {
          await sendAIMessage(follow.content.trim(), follow.reasoning||'', false, false);
        } else {
          await sendAIMessage('查無資料。', '', false, false);
        }
        return { ok:true, desc: `查詢日誌：${cmd.value||'（全部）'}` };
      }
      default: return { ok:false, error: '未知指令 ' + cmd.cmd };
    }
  } catch (e) { return { ok:false, error: e.message }; }
}

function subscribeMyRejections(){ if (unsubMyRejections) unsubMyRejections(); if (!me) return; unsubMyRejections = onValue(ref(db,'notifications/'+me.username), snap => { const val = snap.val()||{}; myRejections = Object.keys(val).map(k => ({ _key:k, ...val[k] })).filter(n => !n.read).sort((a,b) => (a.createdAt||0)-(b.createdAt||0)); if (myRejections.length > 0 && !noticeCarouselShown) showRejectionCarousel(); }); }
function subscribeMentions(){ if (unsubMentions) unsubMentions(); if (!me) return; unsubMentions = onValue(ref(db,'mentions/'+me.username), snap => {}); }

/* ===== 公告輪播 ===== */
function checkUnreadNotices(){ if (!me || noticeCarouselShown) return; const unread = notices.filter(n => !n.deleted && !myNoticeReads[n._key]); if (unread.length > 0) showNoticeCarousel(unread); }
function showNoticeCarousel(list){
  noticeCarouselShown = true;
  const cards = list.map(n => { const time = new Date(n.createdAt).toLocaleString(lang==='en'?'en-US':'zh-TW'); const content = renderNoticeContent(n); return `<div class="car-card" data-key="${n._key}"><div class="car-meta">${time}${n.pinned?' ['+t('noticePinTag')+']':''}</div><div class="car-content">${content}</div></div>`; }).join('');
  const div = document.createElement('div');
  div.innerHTML = `<div id="carouselOverlay"><div class="car-top"><div class="car-title">${t('noticeTitle')} (${list.length})</div><button class="car-close" data-action="closeCarousel">X</button></div><div class="car-stage" id="carStage">${cards}</div><div class="car-progress" id="carProgress">1 / ${list.length}</div></div>`;
  document.body.appendChild(div.firstElementChild);
  document.getElementById('carouselOverlay').addEventListener('click', e => { if (e.target.id === 'carouselOverlay') closeCarousel(); });
  const stage = document.getElementById('carStage'); const cs = stage.querySelectorAll('.car-card');
  const update = () => { const center = stage.scrollLeft + stage.clientWidth/2; let closest = 0, minDist = Infinity; cs.forEach((c,i) => { const cc = c.offsetLeft + c.offsetWidth/2; const d = Math.abs(cc-center); if (d<minDist){minDist=d;closest=i;} c.classList.toggle('active', d<c.offsetWidth/2); }); document.getElementById('carProgress').textContent = `${closest+1} / ${cs.length}`; markRead(cs[closest].dataset.key); };
  stage.addEventListener('scroll', () => { clearTimeout(stage._t); stage._t = setTimeout(update, 120); });
  setTimeout(update, 200);
  cs.forEach(c => c.addEventListener('click', ev => { if (ev.target.tagName === 'A' || ev.target.tagName === 'IMG') return; closeCarousel(); openNoticeFullscreen(c.dataset.key); }));
}
function showRejectionCarousel(){
  const list = myRejections; if (list.length === 0) return;
  noticeCarouselShown = true;
  const cards = list.map(n => { const time = new Date(n.createdAt).toLocaleString(lang==='en'?'en-US':'zh-TW'); return `<div class="car-card reject" data-key="${n._key}"><h3>${t('noticeRejected')}</h3><div class="car-meta">${time}</div><div class="car-content">${escapeHtml(n.text||'')}<br><br><b>${t('reason')}：</b>${escapeHtml(n.reason||t('noReason'))}</div></div>`; }).join('');
  const div = document.createElement('div');
  div.innerHTML = `<div id="carouselOverlay"><div class="car-top"><div class="car-title">(${list.length})</div><button class="car-close" data-action="closeCarousel">X</button></div><div class="car-stage" id="carStage">${cards}</div><div class="car-progress" id="carProgress">1 / ${list.length}</div></div>`;
  document.body.appendChild(div.firstElementChild);
  document.getElementById('carouselOverlay').addEventListener('click', e => { if (e.target.id === 'carouselOverlay') closeCarousel(); });
  const stage = document.getElementById('carStage'); const cs = stage.querySelectorAll('.car-card');
  const update = () => { const center = stage.scrollLeft + stage.clientWidth/2; let closest = 0, minDist = Infinity; cs.forEach((c,i) => { const cc = c.offsetLeft + c.offsetWidth/2; const d = Math.abs(cc-center); if (d<minDist){minDist=d;closest=i;} c.classList.toggle('active', d<c.offsetWidth/2); }); document.getElementById('carProgress').textContent = `${closest+1} / ${cs.length}`; markNotificationRead(cs[closest].dataset.key); };
  stage.addEventListener('scroll', () => { clearTimeout(stage._t); stage._t = setTimeout(update, 120); });
  setTimeout(update, 200);
}
async function markRead(key){ if (!me || !key || myNoticeReads[key]) return; try { await set(ref(db,'noticeReads/'+me.username+'/'+key), Date.now()); } catch(e){} }
async function markNotificationRead(key){ if (!me || !key) return; try { await update(ref(db,'notifications/'+me.username+'/'+key), { read:true, readAt:Date.now() }); } catch(e){} }
function closeCarousel(){ const el = document.getElementById('carouselOverlay'); if (el) el.remove(); noticeCarouselShown = true; }

function renderNoticeContent(n){
  let content = n.html ? n.html : escapeHtml(n.text||'').replace(/\n/g,'<br>');
  content = content.replace(/(https?:\/\/[^\s<>"']+)/g, url => `<a href="#" data-action="linkCheck" data-arg="${escapeHtml(url)}" style="color:#3b82f6">${escapeHtml(url)}</a>`);
  if (n.images && n.images.length > 0) { n.images.forEach(img => { if (/^https?:/.test(img)) content += `<img src="${escapeHtml(img)}">`; else content += `<img src="${img}">`; }); }
  return content;
}

function renderNoticeBar(){
  const active = notices.filter(n => !n.deleted);
  if (active.length === 0) { noticeBar.innerHTML = `<span class="notice-icon">[公告]</span><div class="notice-text" style="color:var(--text-sub)">${t('noNotice')}</div><button class="notice-add" data-action="openNoticeCreate">+</button>`; return; }
  const pinned = active.filter(n => n.pinned);
  const latest = active.filter(n => !n.pinned).sort((a,b) => b.createdAt-a.createdAt)[0];
  let html = '<span class="notice-icon">[公告]</span>';
  if (pinned.length === 1) { const p = pinned[0]; const preview = (p.text || '').replace(/<[^>]*>/g,'').slice(0,40); html += `<span class="notice-pin-count" data-action="openPinnedList" style="cursor:pointer">${t('noticePinTag')}: ${escapeHtml(preview)}${preview.length>=40?'...':''}</span>`; }
  else if (pinned.length > 1) { html += `<span class="notice-pin-count" data-action="openPinnedList" style="cursor:pointer">${t('noticePinTag')} x${pinned.length}</span>`; }
  if (latest) { const preview = (latest.text || latest.html || '').replace(/<[^>]*>/g,'').slice(0,50); html += `<div class="notice-text" data-action="openNoticeDetail" data-arg="${latest._key}" style="cursor:pointer"><span class="label">${t('noticeLatest')}</span>${escapeHtml(preview)}${preview.length>=50?'...':''}</div>`; }
  else if (pinned.length > 0) { html += `<div class="notice-text" style="color:var(--text-sub)">${t('noticeNoOther')}</div>`; }
  html += `<button class="notice-add" data-action="openNoticeCreate">+</button>`;
  noticeBar.innerHTML = html;
}
async function openPinnedList(){ const pinned = notices.filter(n => n.pinned && !n.deleted); if (pinned.length === 0) return; openNoticeFullscreen(pinned[0]._key, pinned); }

async function openNoticeFullscreen(key, customList){
  const list = customList || notices.filter(n => !n.deleted); if (list.length === 0) return;
  if (!myNoticeReads[key]) markRead(key);
  const isAdmin = me.role === 'superadmin' || me.role === 'admin';
  const cards = list.map(n => { const time = new Date(n.createdAt).toLocaleString(lang==='en'?'en-US':'zh-TW'); const content = renderNoticeContent(n); let apply = ''; if (n.fromUser && n.editedBy) apply = `<div style="font-size:11px;color:#fbbf24;margin-bottom:8px">${t('noticeEditedBy')}${escapeHtml(n.fromName||n.fromUser)}${t('noticeAdminEdited')}</div>`; else if (n.fromUser) apply = `<div style="font-size:11px;color:#94a3b8;margin-bottom:8px">${t('noticeApplyBy')}${escapeHtml(n.fromName||n.fromUser)}</div>`; return `<div class="car-card ${n._key===key?'active':''}" data-key="${n._key}"><h3>${n.pinned?'['+t('noticePinTag')+'] ':''}${t('noticeTitle')}</h3><div class="car-meta">${time}</div>${apply}<div class="car-content">${content}</div></div>`; }).join('');
  const current = list.find(n => n._key === key);
  const actions = isAdmin ? `<button class="btn-primary" data-action="noticeEdit" data-arg="${key}" style="margin:0">${t('noticeEdit')}</button><button class="btn-warn" data-action="noticePin" data-arg="${key}" style="margin:0">${current.pinned?t('noticeUnpin'):t('noticePin')}</button><button class="btn-ghost" data-action="noticeLock" data-arg="${key}" style="margin:0">${current.locked?t('noticeUnlock'):t('noticeLock')}</button><button class="btn-danger" data-action="noticeDelete" data-arg="${key}" style="margin:0">${t('noticeDelete')}</button>` : `<button class="btn-ghost" data-action="closePage" style="margin:0">${t('close')}</button>`;
  pageRoot.innerHTML = `<div class="fullPage" id="noticeFullscreen"><div class="fp-header"><button class="fp-back" data-action="closePage">←</button><div class="fp-title">${t('noticeTitle')}</div></div><div class="fp-body"><div class="car-stage" id="nfStage">${cards}</div><div class="car-progress" id="nfProgress">1 / ${list.length}</div></div><div class="car-actions">${actions}</div></div>`;
  setTimeout(() => { const stage = document.getElementById('nfStage'); const target = stage.querySelector(`[data-key="${key}"]`); if (target) stage.scrollLeft = target.offsetLeft - (stage.clientWidth - target.offsetWidth)/2; const upd = () => { const center = stage.scrollLeft + stage.clientWidth/2; let closest = 0, minDist = Infinity; stage.querySelectorAll('.car-card').forEach((c,i) => { const cc = c.offsetLeft + c.offsetWidth/2; const d = Math.abs(cc-center); if (d<minDist){minDist=d;closest=i;} c.classList.toggle('active', d<c.offsetWidth/2); }); document.getElementById('nfProgress').textContent = `${closest+1} / ${stage.querySelectorAll('.car-card').length}`; markRead(stage.querySelectorAll('.car-card')[closest].dataset.key); }; stage.addEventListener('scroll', () => { clearTimeout(stage._t); stage._t = setTimeout(upd, 120); }); setTimeout(upd, 100); }, 100);
}

async function openNoticeCreate(){
  if (!me) return;
  if (me.banned && me.banned.type === 'light') { showNotif(t('bannedLight')); return; }
  const isAdmin = me.role === 'superadmin' || me.role === 'admin';
  window._noticeImages = [];
  pageRoot.innerHTML = `<div class="fullPage"><div class="fp-header"><button class="fp-back" data-action="closePage">←</button><div class="fp-title">${isAdmin?t('noticePublishTitle'):t('noticeApplyTitle')}</div></div><div class="fp-body"><div class="profile-content">${isAdmin?`<div class="section-title">${t('noticeUseHtml')}</div><div class="form-row"><label><input type="checkbox" id="useHtml" style="width:auto;margin-right:8px"> ${t('noticeUseHtmlLabel')}</label></div>`:''}<div class="section-title">${t('noticeContent')}</div><div class="form-row"><textarea id="noticeText" placeholder="${t('noticeContentPh')}" maxlength="5000"></textarea><div class="char-count" id="charCount">0 / 5000</div></div><div class="section-title">${t('noticeImgs')}</div><div class="avatar-options" id="imgList"></div><input type="file" id="noticeImgFile" accept="image/*" multiple><label class="upload-btn" for="noticeImgFile">${t('noticeChooseImgs')}</label><div class="form-row" style="margin-top:10px"><input type="text" id="noticeImgUrl" placeholder="${t('noticeImgUrlPh')}"></div><div class="section-title">${t('noticeWhen')}</div><div class="form-row"><select id="noticeWhen"><option value="now">${t('noticeWhenNow')}</option><option value="3days">${t('noticeWhen3d')}</option></select></div><button class="btn-primary" data-action="submitNotice" data-arg="${isAdmin?'admin':'student'}">${t('noticeSubmit')}</button><div class="err" id="noticeErr"></div></div></div></div>`;
  const ta = document.getElementById('noticeText'), cc = document.getElementById('charCount');
  ta.addEventListener('input', () => { const len = ta.value.length; cc.textContent = `${len} / 5000`; cc.classList.toggle('over', len>5000); });
  const renderImgs = () => { const box = document.getElementById('imgList'); box.innerHTML = window._noticeImages.map((src,i) => `<div class="av-opt" style="position:relative;overflow:hidden"><img src="${/^https?:/.test(src)?escapeHtml(src):src}" style="width:100%;height:100%;object-fit:cover"><button style="position:absolute;top:0;right:0;background:#dc2626;color:#fff;border:none;width:18px;height:18px;border-radius:50%;font-size:12px;cursor:pointer" data-imgidx="${i}">x</button></div>`).join(''); box.querySelectorAll('button[data-imgidx]').forEach(b => { b.onclick = e => { e.stopPropagation(); window._noticeImages.splice(+b.dataset.imgidx,1); renderImgs(); }; }); };
  document.getElementById('noticeImgFile').addEventListener('change', async e => { const files = Array.from(e.target.files).slice(0, 5 - window._noticeImages.length); for (const f of files) { if (f.size > 5*1024*1024) { showNotif('5MB'); continue; } try { const dataUrl = await compressImage(f, 800, 800, 0.75); window._noticeImages.push(dataUrl); } catch(err){} } renderImgs(); e.target.value = ''; });
  document.getElementById('noticeImgUrl').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const url = e.target.value.trim(); if (!url) return; if (window._noticeImages.length >= 5) return; window._noticeImages.push(url); e.target.value = ''; renderImgs(); } });
}

async function submitNotice(role){
  const errEl = document.getElementById('noticeErr'); if (errEl) errEl.textContent = '';
  const textEl = document.getElementById('noticeText'), useHtmlEl = document.getElementById('useHtml');
  const useHtml = useHtmlEl && useHtmlEl.checked;
  const text = textEl.value;
  const when = document.getElementById('noticeWhen').value;
  if (text.length > 5000) { if (errEl) errEl.textContent = t('noticeOver5000'); return; }
  if (!text.trim() && window._noticeImages.length === 0) { if (errEl) errEl.textContent = t('noticeNeedContent'); return; }
  try {
    const c = await get(child(ref(db),'meta/noticeCounter'));
    const next = (c.exists()?c.val():0) + 1;
    await set(ref(db,'meta/noticeCounter'), next);
    const noticeId = '公告_'+String(next).padStart(4,'0');
    const safeHtml = useHtml ? sanitizeNoticeHtml(text) : '';
    const payload = { id:noticeId, text:useHtml?'':text, html:safeHtml, images:window._noticeImages.slice(), fromUser:me.username, fromName:me.displayName, fromSeat:me.seat, createdAt:Date.now(), publishedAt: role==='admin' && when==='now' ? Date.now() : (when==='3days' ? Date.now()+3*86400000 : Date.now()), pinned:false, locked:false, deleted:false };
    if (role === 'admin') { await set(ref(db,'notices/'+noticeId), payload); await writeLog('notice','發布公告 '+noticeId); showNotif(t('notifNoticePublished')); }
    else { await set(ref(db,'noticePending/'+noticeId), { ...payload, status:'pending', applyAt:Date.now() }); await writeLog('notice','申請公告 '+noticeId); showNotif(t('notifNoticeSent')); }
    window._noticeImages = []; closePage();
  } catch(e) { if (errEl) errEl.textContent = e.message; }
}

window._pollDraft = { name:'', options:[], mode:'single', max:'', optMode:'one', whenResult:'start', whoResult:'all', otherSee:'pct', duration:'24', selected:{} };

async function openPollCreate(){
  if (!me) return;
  if (me.banned && me.banned.type === 'light') { showNotif(t('bannedLight')); return; }
  window._pollDraft = { name:'', options:['',''], mode:'single', max:'', optMode:'one', whenResult:'start', whoResult:'all', otherSee:'pct', duration:'24', selected:{} };
  renderPollCreatePage();
}

    ${d.optMode === 'one' ? `<div id="pollOpts">${optRows}</div><button class="btn-ghost" id="pollAddBtn">${t('pollAddOpt')}</button>` : `<div class="form-row"><textarea id="pollBulk" style="min-height:120px" placeholder="${t('pollBulkPh')}">${escapeHtml(bulkVal)}</textarea></div>`}
    <div class="section-title">${t('pollMode')}</div>
    <div class="ban-type-buttons">
      <button class="ban-type-btn ${d.mode==='single'?'selected light':''}" data-poll-mode="single">${t('pollSingle')}</button>
      <button class="ban-type-btn ${d.mode==='multi'?'selected light':''}" data-poll-mode="multi">${t('pollMulti')}</button>
    </div>
    ${isMulti ? `<div class="section-title">${t('pollMax')}</div><div class="form-row"><input type="text" id="pollMax" value="${escapeHtml(d.max)}" placeholder="${t('pollMaxUnlimited')}"></div>` : ''}
    <div class="section-title">${t('pollWhenResult')}</div>
    <div class="ban-type-buttons">

    <div class="section-title">${t('pollWhoResult')}</div>
    <div class="ban-type-buttons">
      <button class="ban-type-btn ${d.whoResult==='creator'?'selected light':''}" data-poll-who="creator">${t('pollWhoCreator')}</button>
      <button class="ban-type-btn ${d.whoResult==='all'?'selected light':''}" data-poll-who="all">${t('pollWhoAll')}</button>

      <button class="ban-type-btn ${d.otherSee==='who'?'selected light':''}" data-poll-other="who">${t('pollOtherWho')}</button>

    </div>
    <div class="section-title">${t('pollDurationH')}</div>

      if (bulk) window._pollDraft.options = bulk.value.split('\n');

async function submitPoll(){
  const d = window._pollDraft;
  d.name = (document.getElementById('pollName')||{}).value || '';
  if (d.optMode === 'one') { d.options = d.options.map((_,i) => { const el = document.getElementById('pollOpt_'+i); return el ? el.value : ''; }); }
  else { const bulk = document.getElementById('pollBulk'); if (bulk) d.options = bulk.value.split('\n'); }
  const mx = document.getElementById('pollMax'); if (mx) d.max = mx.value;
  const du = document.getElementById('pollDuration'); if (du) d.duration = du.value;
  const errEl = document.getElementById('pollErr');
  const name = (d.name||'').trim();
  if (!name) { errEl.textContent = t('pollNameEmpty'); return; }
  if (name.length > 50) { errEl.textContent = '50'; return; }
  const opts = d.options.map(x => (x||'').trim()).filter(x => x.length > 0);
  if (opts.length < 2) { errEl.textContent = t('pollNeedTwo'); return; }
  for (const o of opts) { if (o.length > 50) { errEl.textContent = '50'; return; } }
  const durH = parseInt(d.duration,10); if (!durH || durH < 1) { errEl.textContent = '1'; return; }
  const maxSel = d.mode === 'multi' ? (d.max && parseInt(d.max,10) > 0 ? parseInt(d.max,10) : 0) : 1;
  const deadline = Date.now() + durH*3600*1000;
  try {
    const c = await get(child(ref(db),'meta/msgCounter'));
    const next = (c.exists()?c.val():0) + 1;
    await set(ref(db,'meta/msgCounter'), next);
    const msgId = 'msg_'+String(next).padStart(4,'0');
    await set(ref(db,'messages/'+msgId), {
      id: msgId, username: me.username, displayName: me.displayName, seat: me.seat, color: me.color, avatar: me.avatar, role: me.role,
      type: 'poll',
      pollTitle: name,
      pollOptions: opts,
      pollMode: d.mode,
      pollMaxSelect: maxSel,
      pollResultWhen: d.whenResult,
      pollResultWho: d.whoResult,
      pollOtherSee: d.otherSee,
      pollDeadline: deadline,
      pollVotes: {},
      createdAt: Date.now(),
      deleted: false
    });
    await writeLog('send', '建立投票：'+name);
    closePage();
    showNotif(t('pollSubmitted'));
  } catch(e) { errEl.textContent = e.message; }
}

function pollResultVisibleToMe(m){
  if (!me) return false;
  const isAdmin = me.role === 'superadmin' || me.role === 'admin';
  if (isAdmin) return true;
  const now = Date.now();
  const ended = m.pollDeadline && now >= m.pollDeadline;
  if (m.pollResultWhen === 'end' && !ended) return false;
  if (m.pollResultWho === 'creator' && m.username !== me.username) return false;
  return true;
}
function pollOtherCanSee(m){
  if (!me) return false;
  const isAdmin = me.role === 'superadmin' || me.role === 'admin';
  if (isAdmin) return true;
  const now = Date.now();
  const ended = m.pollDeadline && now >= m.pollDeadline;
  if (m.pollResultWhen === 'end' && !ended) return false;
  if (m.pollResultWho === 'creator' && m.username !== me.username) return false;
  if (m.username === me.username) return true;
  return true;
}
function pollOtherSeeType(m){ return m.pollOtherSee || 'pct'; }

function renderPollBody(m){
  const now = Date.now();
  const ended = m.pollDeadline && now >= m.pollDeadline;
  const isAdmin = me.role === 'superadmin' || me.role === 'admin';
  const isCreator = m.username === me.username;
  const votes = m.pollVotes || {};
  const myVote = votes[me.username] || null;
  const totalVotes = Object.keys(votes).length;
  const mode = m.pollMode || 'single';
  const maxSel = m.pollMaxSelect || 0;
  const options = m.pollOptions || [];
  const counts = options.map((_,i) => Object.values(votes).filter(v => Array.isArray(v) && v.includes(i)).length);
  const canSeeResult = pollResultVisibleToMe(m);
  const canVote = !ended && !myVote && !(me.banned && me.banned.type === 'light');
  const otherSee = pollOtherSeeType(m);
  const showPct = (isAdmin || isCreator || canSeeResult) && (otherSee === 'pct' || isAdmin || isCreator || canSeeResult);
  const showWhoVoted = (isAdmin || isCreator) || (otherSee === 'who' && canSeeResult) || (otherSee === 'pct' && canSeeResult);
  const pctArr = counts.map(c => totalVotes > 0 ? Math.round(c/totalVotes*100) : 0);
  const tempSel = (window._pollSel && window._pollSel[m.id]) ? window._pollSel[m.id] : (Array.isArray(myVote) ? myVote.slice() : []);
  const optsHTML = options.map((o,i) => {
    const selected = Array.isArray(myVote) ? myVote.includes(i) : (tempSel.includes(i));
    const cls = 'poll-opt' + (selected ? ' selected' : '') + (canVote ? '' : ' disabled');
    const sym = mode === 'multi' ? '<div class="poll-square">' + (selected ? '✓' : '') + '</div>' : '<div class="poll-circle">' + (selected ? '✓' : '') + '</div>';
    const showBar = !canVote && showPct;
    const pct = pctArr[i];
    const bar = showBar ? `<div class="poll-fill" style="width:${pct}%"></div>` : '';
    const pctTag = showBar ? `<div class="poll-pct">${pct}%</div>` : '';
    return `<div class="${cls}" data-poll-opt="${i}" data-poll-msg="${m.id}">${bar}${sym}<div class="poll-text">${escapeHtml(o)}</div>${pctTag}</div>`;
  }).join('');
  let votersHTML = '';
  if (showWhoVoted) {
    const parts = [];
    options.forEach((o,i) => {
      const who = Object.keys(votes).filter(u => Array.isArray(votes[u]) && votes[u].includes(i));
      if (who.length) parts.push(`${escapeHtml(o)}：${who.map(u => escapeHtml((allUsers[u]&&(allUsers[u].displayName||allUsers[u].username)) || u)).join('、')}`);
    });
    if (parts.length) votersHTML = `<div class="poll-voters">${t('pollVoters')}：${parts.join(' ｜ ')}</div>`;
  }
  const deadlineText = ended ? `<div class="poll-end">${t('pollEnded')}</div>` : `<div>${t('pollEndsIn').replace('X', Math.max(0, Math.ceil((m.pollDeadline - now)/3600000)))}</div>`;
  const voteBtn = canVote && mode === 'multi' ? `<button class="btn-primary" style="margin-top:8px" data-action="pollConfirmVote" data-arg="${m.id}">${t('pollSubmit')}</button>` : '';
  const votedTag = myVote ? `<div style="font-size:11.5px;opacity:.85">${t('pollYouVoted')}</div>` : '';
  return `<div class="poll-box">
    <div class="poll-title">${escapeHtml(m.pollTitle||'')}</div>
    <div class="poll-meta-line">${mode === 'multi' ? t('pollMulti') + (maxSel > 0 ? `（${t('pollMax')} ${maxSel}）` : `（${t('pollMaxUnlimited')}）`) : t('pollSingle')}</div>
    <div class="poll-options">${optsHTML}</div>
    ${voteBtn}
    <div class="poll-footer">${deadlineText}${votedTag}<div>${t('pollVotes').replace('X', totalVotes)}</div>${votersHTML}</div>
  </div>`;
}
function pollPickOption(msgId){
  const m = messages.find(x => x.id === msgId); if (!m) return;
  const now = Date.now();
  if (m.pollDeadline && now >= m.pollDeadline) return;
  const votes = m.pollVotes || {};
  if (votes[me.username]) return;
  const mode = m.pollMode || 'single';
  const maxSel = m.pollMaxSelect || 0;
  if (!window._pollSel) window._pollSel = {};
  if (!window._pollSel[msgId]) window._pollSel[msgId] = [];
  const idx = parseInt(arguments[1] !== undefined ? arguments[1] : 0, 10);
  // 從事件取 i
  const ev = window.event;
  let optionIndex = 0;
  if (ev && ev.target) { const t2 = ev.target.closest('[data-poll-opt]'); if (t2) optionIndex = parseInt(t2.dataset.pollOpt, 10); }
  const sel = window._pollSel[msgId];
  if (mode === 'single') { window._pollSel[msgId] = [optionIndex]; submitPollVote(msgId); return; }
  const pos = sel.indexOf(optionIndex);
  if (pos >= 0) { sel.splice(pos,1); }
  else { if (maxSel > 0 && sel.length >= maxSel) { showNotif(t('pollTooManySelected')); return; } sel.push(optionIndex); }
  render();
}
async function submitPollVote(msgId){
  const sel = (window._pollSel && window._pollSel[msgId]) || [];
  if (sel.length === 0) { showNotif(t('pollSelectAtLeast')); return; }
  const m = messages.find(x => x.id === msgId); if (!m) return;
  try {
    const key = m._key;
    await update(ref(db,'messages/'+key+'/pollVotes'), { [me.username]: sel });
    window._pollSel[msgId] = [];
    showNotif(t('pollSubmitted'));
  } catch(e) { showNotif(t('notifActionFail')); }
}
function pollConfirmVote(msgId){ submitPollVote(msgId); }
function pollShowVoters(msgId){ const m = messages.find(x => x.id === msgId); if (!m) return; showNotif(t('pollVoters')); }
function requestDeletePoll(msgId){ const reason = prompt(t('pollDeleteReasonPh')); if (!reason || !reason.trim()) return; push(ref(db,'requests'), { type:'delete', msgId, reason:reason.trim(), from:me.username, fromName:me.displayName, createdAt:Date.now(), status:'pending' }).then(() => showNotif(t('pollDeleteSent'))); }
function reportPoll(msgId){ const reason = prompt(t('reportReasonPh')); if (!reason || !reason.trim()) return; push(ref(db,'requests'), { type:'report', msgId, reason:reason.trim(), from:me.username, fromName:me.displayName, createdAt:Date.now(), status:'pending' }).then(() => showNotif(t('reportSent'))); }

/* ===== 渲染聊天 ===== */
let encState = {};
function render(){
  if (messages.length === 0) { chatBox.innerHTML = `<div class="empty">${t('emptyMsg')}</div>`; return; }
  const isAdmin = me.role === 'superadmin' || me.role === 'admin';
  let list = messages;
  if (searchKeyword) list = messages.filter(m => ((m.text||'')+(m.fileName||'')+(m.pollTitle||'')).toLowerCase().includes(searchKeyword.toLowerCase()) || (m.id||'').toLowerCase().includes(searchKeyword.toLowerCase()));
  if (list.length === 0) { chatBox.innerHTML = `<div class="empty">${t('noMatch')}</div>`; return; }
  const atBottom = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 120;
  chatBox.innerHTML = list.map(m => {
    const isMe = me && m.username === me.username;
    const isAI = m.role === 'ai';
    const isPoll = m.type === 'poll';
    const time = new Date(m.createdAt).toLocaleTimeString(lang==='en'?'en-US':'zh-TW', { hour:'2-digit', minute:'2-digit' });
    const msgIsAdmin = m.role === 'superadmin' || m.role === 'admin';
    const roleTag = msgIsAdmin ? ' ['+t('adminRole')+']' : (isAI ? ' ['+t('aiRole')+']' : '');
    const shownColor = isAI ? AI_COLOR : (msgIsAdmin ? '#8b5cf6' : (m.color || '#3b82f6'));
    if (isAI && m.thinking) {
      return `<div class="msg thinking"><div class="avatar" style="background:${AI_COLOR}">${avatarInner(m)}</div><div class="bubble-wrap"><div class="meta">${escapeHtml(m.displayName||m.username)} · ${time}${isAdmin?` <span class="msgid">${m.id}</span>`:''}</div><div class="bubble">${t('aiThinkingNow')}<span class="thinking-dots"><span></span><span></span><span></span></span></div></div></div>`;
    }
    if (isAI && m.exited) {
      return `<div class="msg exit-msg"><div class="bubble-wrap"><div class="meta">${time}${isAdmin?` <span class="msgid">${m.id}</span>`:''}</div><div class="bubble">${escapeHtml(m.text || t('aiExited'))}</div></div></div>`;
    }
    let body = '';
    if (isPoll) body = renderPollBody(m);
    else if (m.type === 'image') body = `<img class="msg-img" src="${m.imageUrl}" data-action="viewImage" data-arg="${m.imageUrl}">`;
    else if (m.type === 'file') body = `<div class="file-msg"><span class="fi">[F]</span><div style="flex:1;min-width:0"><div class="fn">${escapeHtml(m.fileName||'file')}</div><div class="fs">${formatSize(m.fileSize||0)}</div></div></div>`;
    else if (m.type === 'voice') { const played = myNoticeReads['voice_'+m.id] ? 'played' : ''; body = `<div class="voice-msg ${played}" data-action="playVoice" data-arg="${m.id}"><span class="vi">[V]</span><span class="vt">0:${String(Math.round(m.duration||0)).padStart(2,'0')}</span><div class="vp"><div></div></div><span class="vd"></span></div>`; }
    else if (m.type === 'location') { body = `<div class="loc-msg" data-action="openLocation" data-arg="${m.lat},${m.lng}"><div class="lm-map"><img src="https://staticmap.openstreetmap.de/staticmap.php?center=${m.lat},${m.lng}&zoom=15&size=220x150&maptype=mapnik&markers=${m.lat},${m.lng},red-pushpin"></div><div class="lm-label">[L] ${escapeHtml(m.placeName||'')}</div></div>`; }
    else if (m.encrypted && !isAI) body = renderEncryptedBody(m);
    else {
      let textHTML = escapeHtml(m.text||'').replace(/@([a-zA-Z0-9_]+)/g, '<span class="mention">@$1</span>');
      textHTML = textHTML.replace(/(https?:\/\/[^\s<>"']+)/g, '<a href="#" data-action="linkCheck" data-arg="$1" style="color:inherit;text-decoration:underline">$1</a>');
      if (isAI && m.reasoning) body = `<div class="think-card"><span class="think-label">${t('aiThinking')}：</span>${escapeHtml(m.reasoning)}</div>` + textHTML;
      else body = textHTML;
      if (isAI && m.sponsor) body += `<span class="ai-sponsor">${AI_SPONSOR}</span>`;
    }
    const deletedTag = m.deleted ? ` <span style="color:#f87171;font-size:10.5px">${t('msgDeleted')}</span>` : '';
    const msgIdTag = isAdmin ? ` <span class="msgid">${m.id}</span>` : '';
    const encTag = m.encrypted ? `<span class="enc-tag">${t('encTag')}</span>` : '';
    const pollTag = isPoll ? `<span class="poll-tag">${t('pollTitle')}</span>` : '';
    const aiTag = isAI ? `<span class="ai-tag">AI</span>` : '';
    const warnClass = m.warn ? 'warn' : '';
    const customClass = m.customClass || '';
    let tools = '';
    if (!m.deleted && !isAI) {
      if (isMe) tools += `<button data-action="requestDeleteMsg" data-arg="${m.id}">${t('requestDelete')}</button>`;
      if (!isMe) tools += `<button class="danger" data-action="reportMsg" data-arg="${m.id}">${t('report')}</button>`;
      if (isAdmin) tools += `<button class="danger" data-action="adminDeleteMsg" data-arg="${m.id}">${t('adminDelete')}</button>`;
      if (isPoll) tools += `<button data-action="pollShowVoters" data-arg="${m.id}">${t('pollVoters')}</button>`;
    } else if (m.deleted && isAdmin) { tools += `<button data-action="restoreMsg" data-arg="${m.id}">${t('restore')}</button><button class="danger" data-action="purgeMsg" data-arg="${m.id}">${t('purge')}</button>`; }
    const pollBubbleStyle = isPoll ? `background:${shownColor};width:340px;max-width:80vw;` : `background:${shownColor};${m.deleted?'opacity:.5':''}`;
    return `<div class="msg ${isMe?'me':''} ${customClass}"><div class="avatar" style="background:${shownColor}" data-action="openUserProfile" data-arg="${m.username}">${avatarInner(m)}</div><div class="bubble-wrap"><div class="meta">${escapeHtml(m.displayName||m.username)}${roleTag} · ${time}${msgIdTag}${deletedTag}${encTag}${pollTag}${aiTag}</div><div class="bubble ${warnClass}" style="${pollBubbleStyle}">${body}</div><div class="msg-tools">${tools}</div></div></div>`;
  }).join('');
  if (atBottom && !searchKeyword) chatBox.scrollTop = chatBox.scrollHeight;
  // 投票選項點擊
  chatBox.querySelectorAll('[data-poll-opt]').forEach(el => {
    el.onclick = () => {
      const msgId = el.dataset.pollMsg;
      const idx = parseInt(el.dataset.pollOpt, 10);
      const m = messages.find(x => x.id === msgId); if (!m) return;
      const now = Date.now();
      if (m.pollDeadline && now >= m.pollDeadline) return;
      const votes = m.pollVotes || {};
      if (votes[me.username]) return;
      if (me.banned && me.banned.type === 'light') return;
      const mode = m.pollMode || 'single';
      const maxSel = m.pollMaxSelect || 0;
      if (!window._pollSel) window._pollSel = {};
      if (!window._pollSel[msgId]) window._pollSel[msgId] = [];
      const sel = window._pollSel[msgId];
      if (mode === 'single') { window._pollSel[msgId] = [idx]; submitPollVote(msgId); return; }
      const pos = sel.indexOf(idx);
      if (pos >= 0) sel.splice(pos,1);
      else { if (maxSel > 0 && sel.length >= maxSel) { showNotif(t('pollTooManySelected')); return; } sel.push(idx); }
      render();
    };
  });
}

function compressImage(file, maxW, maxH, quality){ return new Promise((resolve,reject) => { const reader = new FileReader(); reader.onload = ev => { const img = new Image(); img.onload = () => { let w = img.width, h = img.height; const ratio = Math.min(maxW/w, maxH/h, 1); w = Math.round(w*ratio); h = Math.round(h*ratio); const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h; const ctx = canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h); resolve(canvas.toDataURL('image/jpeg', quality)); }; img.onerror = () => reject(new Error('load fail')); img.src = ev.target.result; }; reader.onerror = () => reject(new Error('read fail')); reader.readAsDataURL(file); }); }

function pickTextColor(hex){ const h = String(hex).replace('#',''); if (h.length !== 6) return '#fff'; const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16); const lum = (0.299*r + 0.587*g + 0.114*b)/255; return lum > 0.6 ? '#111' : '#fff'; }
function hexA(hex, a){ const h = String(hex).replace('#',''); if (h.length !== 6) return `rgba(59,130,246,${a})`; const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16); return `rgba(${r},${g},${b},${a})`; }
function lightenColor(hex, amt){ const h = String(hex).replace('#',''); if (h.length !== 6) return hex; let r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16); r = Math.min(255, r+amt); g = Math.min(255, g+amt); b = Math.min(255, b+amt); return '#'+[r,g,b].map(x => x.toString(16).padStart(2,'0')).join(''); }
function darkenColor(hex, amt){ const h = String(hex).replace('#',''); if (h.length !== 6) return hex; let r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16); r = Math.max(0, r-amt); g = Math.max(0, g-amt); b = Math.max(0, b-amt); return '#'+[r,g,b].map(x => x.toString(16).padStart(2,'0')).join(''); }
