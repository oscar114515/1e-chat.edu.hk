function vcRenderGrid(){
  const st=vcState; if(!st)return;
  const stage=document.getElementById('vcStage'); if(!stage)return;
  const names=[me.username].concat(Array.from(st.peers.keys()).sort());
  const n=names.length;
  stage.style.gridTemplateColumns=(n<=1?'1fr':(n===2?(vcIsMobile()?'1fr':'1fr 1fr'):(n<=4?'1fr 1fr':(n<=9?'repeat(3,1fr)':'repeat(4,1fr)'))));
  stage.classList.toggle('solo',n<=1);
  names.forEach((u,i)=>{
    const el=vcTileFor(u);
    if(stage.children[i]!==el)stage.insertBefore(el,stage.children[i]||null);
    const self=(u===me.username);
    const rec=self?null:st.peers.get(u);
    const info=self?{name:me.displayName||me.username,chi:me.chiName||'',mic:st.micOn,cam:Boolean(st.camOn||st.sharing)}
                   :(rec&&rec.info)||{};
    const camOn=self?Boolean(st.camOn||st.sharing):(info.cam!==false);
    const micOn=self?st.micOn:(info.mic!==false);
    el.classList.toggle('mirror',self&&!(st.sharing));
    el.classList.toggle('off',!camOn);
    const nameEl=el.querySelector('.vcTileName');
    const nm=self?'你':String(info.name||u);
    const chi=(!self&&info.chi&&info.chi!==nm)?'<span class="chi">'+escapeHtml(info.chi)+'</span>':'';
    nameEl.innerHTML=escapeHtml(nm)+chi;
    const av=el.querySelector('.vcOffAvatar');
    av.textContent=(!self&&info.avatar)?String(info.avatar).slice(0,3):Array.from(nm)[0]||'?';
    el.querySelector('.camIco').hidden=camOn;
    el.querySelector('.micIco').hidden=micOn;
    const flip=el.querySelector('.vcFlip');
    const connecting=!self&&rec&&!rec.connected;
    flip.hidden=!connecting;
    if(connecting)flip.textContent='正在連線…';
    if(stage.children[i]===el&&self===false){
      const v=el.querySelector('video');
      if(v&&!v.muted){ v.muted=false; }
    }
  });
  const cnt=document.getElementById('vcCount');
  if(cnt)cnt.textContent=n+' 人';
}

/* ── 加入房間：寫自己的節點、廣播、聽別人的心跳與信件 ── */
async function vcJoin(){
  const st=vcState; if(!st)return;
  const peersPath='calls/'+st.roomId+'/peers';
  try{ await onDisconnect(ref(db,peersPath+'/'+me.username)).remove(); }catch(e){}
  await vcBeat(true);
  st.hbTimer=setInterval(()=>vcBeat(false),VC_HB_MS);

  st.unsubPeers=onValue(ref(db,peersPath),snap=>{ try{ vcSyncPeers(snap.val()||{}); }catch(e){} });

  st.unsubSig=onChildAdded(ref(db,'calls/'+st.roomId+'/sig/'+me.username),snap=>{
    const v=snap.val();
    const key=snap.key;
    if(!v){ return; }
    Promise.resolve(vcOnSig(v)).finally(()=>{
      remove(ref(db,'calls/'+st.roomId+'/sig/'+me.username+'/'+key)).catch(()=>{});
    });
  });
}
async function vcBeat(first){
  const st=vcState; if(!st)return;
  const node={
    name:me.displayName||me.username,
    chi:me.chiName||'',
    color:safeColor(me.color,'#3b82f6'),
    avatar:(typeof me.avatar==='string'&&/^data:image\//i.test(me.avatar))?'':(me.avatar||''),
    mic:st.micOn, cam:Boolean(st.camOn||st.sharing), hb:Date.now()
  };
  if(first)node.at=Date.now();
  try{ await update(ref(db,'calls/'+st.roomId+'/peers/'+me.username),node); }catch(e){}
}

/* ── 誰該發 offer：帳號字串小的那個（同一對人只會有一邊發，不會撞）── */
function vcIInitiate(other){ return String(me.username)<String(other); }

function vcSyncPeers(val){
  const st=vcState; if(!st)return;
  const now=Date.now();
  const alive=new Set();
  for(const u of Object.keys(val||{})){
    if(u===me.username)continue;
    const info=val[u]||{};
    if(now-(Number(info.hb)||0)>VC_STALE_MS)continue;   // 心跳過期 = 已經走了
    alive.add(u);
    const rec=vcEnsurePeer(u,info);
    rec.info=info;
    if(!rec.offered&&vcIInitiate(u)){ rec.offered=true; vcOfferTo(u); }
  }
  for(const u of Array.from(st.peers.keys())){ if(!alive.has(u))vcDropPeer(u); }
  vcRenderGrid();
}

function vcEnsurePeer(u,info){
  const st=vcState; if(!st)return null;
  let rec=st.peers.get(u);
  if(rec)return rec;
  const pc=new RTCPeerConnection(VC_ICE);
  rec={u,pc,stream:new MediaStream(),info:info||{},pending:[],offered:false,connected:false};
  st.peers.set(u,rec);
  try{ (st.local?st.local.getTracks():[]).forEach(t=>{ try{ pc.addTrack(t,st.local); }catch(e){} }); }catch(e){}
  pc.ontrack=(ev)=>{
    try{
      if(ev.streams&&ev.streams[0])rec.stream=ev.streams[0];
      else if(!rec.stream.getTracks().some(t=>t.id===ev.track.id))rec.stream.addTrack(ev.track);
    }catch(e){}
    vcAttachStream(u,rec.stream);
    vcBindLevels(u,rec.stream);
  };
  pc.onicecandidate=(ev)=>{
    if(!ev.candidate)return;
    let c=null; try{ c=ev.candidate.toJSON?ev.candidate.toJSON():ev.candidate; }catch(e){ c=null; }
    if(c)vcSendSig(u,{t:'ice',c});
  };
  pc.onconnectionstatechange=()=>{
    rec.connected=(pc.connectionState==='connected');
    if(pc.connectionState==='failed'){
      try{ pc.restartIce(); }catch(e){}
      vcShowLegacyHint();
    }
    vcRenderGrid();
  };
  vcRenderGrid();
  return rec;
}

async function vcOfferTo(u){
  const st=vcState; if(!st)return;
  const rec=vcEnsurePeer(u); if(!rec)return;
  try{
    const offer=await rec.pc.createOffer();
    await rec.pc.setLocalDescription(offer);
    await vcSendSig(u,{t:'offer',sdp:{type:rec.pc.localDescription.type,sdp:rec.pc.localDescription.sdp}});
  }catch(e){}
}
async function vcSendSig(to,msg){
  const st=vcState; if(!st)return;
  msg.from=me.username; msg.at=Date.now();
  try{ await push(ref(db,'calls/'+st.roomId+'/sig/'+to),msg); }catch(e){}
}
async function vcFlushPending(rec){
  const q=rec.pending.splice(0);
  for(const c of q){ try{ await rec.pc.addIceCandidate(c); }catch(e){} }
}
async function vcOnSig(msg){
  const st=vcState; if(!st||!msg||!msg.from)return;
  const from=String(msg.from);
  if(from===me.username)return;
  const rec=vcEnsurePeer(from); if(!rec)return;
  const pc=rec.pc;
  try{
    if(msg.t==='offer'){
      if(pc.signalingState==='have-local-offer'){ try{ await pc.setLocalDescription({type:'rollback'}); }catch(e){} }
      await pc.setRemoteDescription({type:'offer',sdp:msg.sdp&&msg.sdp.sdp});
      await vcFlushPending(rec);
      const ans=await pc.createAnswer();
      await pc.setLocalDescription(ans);
      await vcSendSig(from,{t:'answer',sdp:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}});
    }else if(msg.t==='answer'){
      if(pc.signalingState!=='have-local-offer')return;
      await pc.setRemoteDescription({type:'answer',sdp:msg.sdp&&msg.sdp.sdp});
      await vcFlushPending(rec);
    }else if(msg.t==='ice'){
      if(!msg.c)return;
      let cand=null;
      try{ cand=new RTCIceCandidate(msg.c); }catch(e){ cand=msg.c; }
      if(pc.remoteDescription&&pc.remoteDescription.type){ try{ await pc.addIceCandidate(cand); }catch(e){} }
      else rec.pending.push(cand);
    }
  }catch(e){}
  vcRenderGrid();
}

/* ── 誰在說話（本機與遠端都量音量，夠大就亮綠框）── */
function vcBindLevels(key,stream){
  const st=vcState; if(!st||!stream)return;
  try{
    if(!st.audioCtx)st.audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(!stream.getAudioTracks().length)return;
    const src=st.audioCtx.createMediaStreamSource(stream);
    const an=st.audioCtx.createAnalyser();
    an.fftSize=512;
    src.connect(an);
    st.levels.set(key,{an,buf:new Uint8Array(an.frequencyBinCount),score:0});
  }catch(e){}
}
function vcTickLevels(){
  const st=vcState; if(!st)return;
  for(const [key,lv] of st.levels){
    let sum=0;
    try{ lv.an.getByteFrequencyData(lv.buf); for(let i=0;i<lv.buf.length;i++)sum+=lv.buf[i]; }catch(e){}
    const rms=sum/(lv.buf.length||1);
    lv.score=rms>18?lv.score+1:0;
    const u=(key==='__me__')?me.username:key;
    const el=document.getElementById('vcTile_'+vcSlug(u));
    if(el)el.classList.toggle('speaking',lv.score>=2);
  }
}

async function vcSwapOutgoingVideo(track){
  const st=vcState; if(!st||!track)return;
  for(const [,rec] of st.peers){
    const sender=rec.pc.getSenders().find(s=>s.track&&s.track.kind==='video');
    if(sender){ try{ await sender.replaceTrack(track); }catch(e){} }
  }
}
async function vcFlipCamera(){
  const st=vcState; if(!st||!st.local)return;
  const cur=st.local.getVideoTracks()[0]; if(!cur)return;
  let facing='user';
  try{ facing=(cur.getSettings&&cur.getSettings().facingMode==='environment')?'user':'environment'; }catch(e){}
  try{
    const ns=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});
    const nt=ns.getVideoTracks()[0];
    st.local.removeTrack(cur);
    st.local.addTrack(nt);
    st.camTrack=nt;
    cur.stop();
    await vcSwapOutgoingVideo(nt);
    vcMountSelf(); vcRenderGrid();
  }catch(e){ showNotif('切換鏡頭失敗'); }
}
async function vcToggleShare(){
  const st=vcState; if(!st)return;
  if(!st.sharing){
    let ds=null;
    try{ ds=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false}); }catch(e){ return; }
    const t=ds.getVideoTracks()[0];
    if(!t)return;
    st.shareTrack=t; st.sharing=true;
    t.onended=()=>{ if(vcState&&vcState.sharing)vcToggleShare(); };
    await vcSwapOutgoingVideo(t);
    vcMountSelf();
  }else{
    st.sharing=false;
    const back=st.camTrack;
    if(back){ if(back.readyState==='ended'){ try{ const ns=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}); st.camTrack=ns.getVideoTracks()[0]; }catch(e){} } }
    if(st.camTrack)await vcSwapOutgoingVideo(st.camTrack);
    if(st.shareTrack){ try{ st.shareTrack.stop(); }catch(e){} st.shareTrack=null; }
    vcMountSelf();
  }
  const b=document.getElementById('vcShare');
  if(b)b.classList.toggle('on',st.sharing);
  vcBeat(false); vcRenderGrid();
}

/* ── 掛斷（byReason 有值＝不是正常結束，不寫通話紀錄）── */
async function vcHangup(reason,keepPage){
  const st=vcState; if(!st||st.closed)return;
  st.closed=true;
  vcState=null;
  try{ if(st.hbTimer)clearInterval(st.hbTimer); }catch(e){}
  try{ if(st.uiTimer)clearInterval(st.uiTimer); }catch(e){}
  try{ if(st.levelTimer)clearInterval(st.levelTimer); }catch(e){}
  try{ if(st.unsubPeers)st.unsubPeers(); }catch(e){}
  try{ if(st.unsubSig)st.unsubSig(); }catch(e){}
  for(const [,rec] of st.peers){ try{ rec.pc.close(); }catch(e){} }
  st.peers.clear(); st.levels.clear();
  if(st.shareTrack){ try{ st.shareTrack.stop(); }catch(e){} }
  if(st.local){ try{ st.local.getTracks().forEach(t=>t.stop()); }catch(e){} }
  try{ if(st.audioCtx)st.audioCtx.close(); }catch(e){}
  try{ await remove(ref(db,'calls/'+st.roomId+'/peers/'+me.username)); }catch(e){}
  try{ await remove(ref(db,'calls/'+st.roomId+'/sig/'+me.username)); }catch(e){}
  try{
    const left=await get(ref(db,'calls/'+st.roomId+'/peers'));
    if(!left.exists())await remove(ref(db,'calls/'+st.roomId));
  }catch(e){}

  const sec=Math.round((Date.now()-st.startedAt)/1000);
  if(!reason&&sec>=VC_MIN_RECORD_SEC){
    const text='視訊通話 · '+fmtDur(sec);
    try{
      if(st.kind==='group'){
        const gSnap=await get(child(ref(db),'groups/'+st.key));
        if(gSnap.exists()){
          const g=gSnap.val(); if(!g.members||!g.members[me.username])throw new Error('not member');
          const msgId=await nextGroupMsgId(st.key);
          await update(ref(db,'groups/'+st.key),{lastMsg:text,lastAt:Date.now()});
          await set(ref(db,'groupMessages/'+st.key+'/'+msgId),{id:msgId,username:me.username,displayName:me.displayName,chiName:me.chiName||'',engName:me.engName||'',seat:me.seat,cls:me.cls||'',color:me.color,avatar:me.avatar,role:me.role,text,type:'call',duration:sec,createdAt:Date.now(),deleted:false});
        }
      }else{
        const msgId=await nextMsgId();
        await set(ref(db,'messages/'+msgId),{id:msgId,username:me.username,displayName:me.displayName,chiName:me.chiName||'',engName:me.engName||'',seat:me.seat,cls:me.cls||'',color:me.color,avatar:me.avatar,role:me.role,text,type:'call',duration:sec,createdAt:Date.now(),deleted:false});
      }
      showNotif('通話已結束，紀錄已留在聊天室');
    }catch(e){}
  }else if(reason){
    showNotif(reason);
  }
  if(keepPage)return;
  try{ closePage(); }catch(e){ pageRoot.innerHTML=''; }
}

/* ═══ v1.36 改名要「回頭生效」 ═══
   每則訊息在送出的當下，會把當時的顯示名稱／頭像／顏色一起抄一份存進訊息裡
   （這樣即使對方之後被封鎖或刪帳號，舊訊息還是看得出是誰講的）。
   副作用是：同一個人改了顯示名稱或頭像之後，他以前發過的每一則訊息仍然掛著舊名字、
   舊頭像 —— 點他的頭像進去看又是新的，前後對不上。
   這裡改成：渲染時一律優先用 users/{帳號} 的「現在」資料，只有查不到這個帳號
   （例如帳號已被刪除）才退回訊息裡的那份快照。 */
function liveWho(m){
  if(!m||!m.username)return null;
  const u=allUsers[m.username];
  if(!u)return null;
  return {
    displayName:u.displayName||m.username,
    avatar:(u.avatar===undefined||u.avatar===null)?m.avatar:u.avatar,

    role:u.role||m.role,

    seat:(u.seat===''||u.seat==null)?m.seat:u.seat,
    // v1.36 名冊姓名也走同一條路：名冊一改，舊訊息跟著換
    chiName:(u.chiName==null?m.chiName:u.chiName),
    engName:(u.engName==null?m.engName:u.engName)
  };
}
/* 名稱／頭像一改，別人正在看的那一面要跟著換。
   只比對「畫面上看得到的」欄位，其他變動（登入旗標、主題、封鎖）不觸發重畫，
   免得每次 presence 更新都把聊天室整個重繪一次。 */
let _whoSig='';
function whoSignature(u){
  return [u.displayName||'',u.avatar==null?'':String(u.avatar).slice(0,40),u.color||'',u.role||'',u.cls||'',u.seat==null?'':u.seat].join('|');
}
function refreshWhoRender(){

  if(isAdmin&&!isAI&&!m.deleted)rows+=`<button class="mm-btn danger" data-mm="adminDeleteMsg">管理刪除</button>`;

/* ═══ v1.37 往前翻頁（載入更早的訊息）═══
   為什麼要有這個：主聊天室為了省流量只訂閱最新 MSG_WINDOW 則，
   可是以前整頁沒有任何入口可以往前翻，所以看到的第一則就固定停在窗口邊界
   （當時是 msg_0377）—— 更早的訊息明明都還在資料庫裡，使用者卻一則都看不到，
   看起來就像「訊息全部丟失了」。 */
function earlierBar(){
  /* 搜尋時也留著往前翻：不然只搜到「已經載入的那一段」，很容易以為訊息不見了 */
  if(searchKeyword&&histDone)return `<div class="earlier-done">已搜尋全部 ${allMsgs().length} 則訊息</div>`;
  if(histLoading)return `<div class="earlier-done">正在載入更早的訊息…</div>`;
  if(histDone)return olderMsgs.length?`<div class="earlier-done">已經到最早的訊息了（共 ${allMsgs().length} 則）</div>`:'';
  const first=allMsgs()[0];
  const since=first?new Date(first.createdAt).toLocaleDateString('zh-TW'):'';
  return `<button id="loadEarlier" class="earlier-btn" data-action="loadEarlier">載入更早的訊息${since?'（'+since+' 之前）':''}</button>`;
}
async function loadEarlier(){
  if(histLoading||histDone)return;
  const src=allMsgs();
  const base=histCursor||Number((src[0]||{}).createdAt)||0;
  if(!base){histDone=true;render();return;}
  histLoading=true;
  const prevH=chatBox.scrollHeight,prevTop=chatBox.scrollTop;
  suppressScrollToBottom=true;render();chatBox.scrollTop=prevTop;
  try{
    /* 抓「比已經載入的最舊那則再更早」的 MSG_WINDOW 則 */
    const snap=await readQueryOnce(query(ref(db,'messages'),orderByChild('createdAt'),endAt(base-1),limitToLast(MSG_WINDOW)));
    const val=snap.val()||{};
    const raw=Object.keys(val).length;
    const times=Object.values(val).map(x=>Number(x&&x.createdAt)||0).filter(Boolean);
    const rawOldest=times.length?Math.min.apply(null,times):0;
    const seen=Object.create(null);src.forEach(m=>{seen[m._key]=1;});
    const add=msgFromSnap(val).filter(m=>!seen[m._key]);
    if(raw<MSG_WINDOW)histDone=true;      // 這批不滿 = 後面沒有了
    if(rawOldest)histCursor=rawOldest;    // 游標一律往前推
    if(add.length)olderMsgs=add.concat(olderMsgs);
  }catch(e){ showNotif('載入失敗：'+(e.message||e)); }
  histLoading=false;
  suppressScrollToBottom=true;render();
  /* 內容從上面長出來，捲動位置要跟著補，否則視野會被推走 */
  const delta=chatBox.scrollHeight-prevH;
  chatBox.scrollTop=prevTop+delta;
  requestAnimationFrame(()=>{ chatBox.scrollTop=prevTop+(chatBox.scrollHeight-prevH);updateScrollToBottomBtn(); });
}
let lastAutoHist=0;
function maybeAutoLoadEarlier(){
  if(histDone||histLoading||searchKeyword)return;
  if(chatBox.scrollTop>70)return;                                  // 只在真的滑到最頂時
  if(chatBox.scrollHeight<=chatBox.clientHeight+40)return;         // 內容比畫面短就不要一直自動抓
  const now=Date.now();if(now-lastAutoHist<800)return;             // 冷卻，避免連續觸發
  lastAutoHist=now;loadEarlier();
}
function render(){
  renderPoints();
  const suppress=suppressScrollToBottom;suppressScrollToBottom=false;
  const src=allMsgs();
  if(src.length===0){chatBox.innerHTML=`<div class="empty">還沒有訊息，說點什麼吧！</div>`;return;}
  const usersLoaded=Object.keys(allUsers).length>0;
  const atBottom=chatBox.scrollHeight-chatBox.scrollTop-chatBox.clientHeight<120;
  const isAdmin=me.role==='superadmin'||me.role==='admin';
  let list=src;
  if(searchKeyword)list=src.filter(m=>((m.text||'')+(m.fileName||'')).toLowerCase().includes(searchKeyword.toLowerCase())||(m.id||'').toLowerCase().includes(searchKeyword.toLowerCase()));
  if(list.length===0){chatBox.innerHTML=`<div class="empty">沒有符合的訊息</div>`;return;}
  chatBox.innerHTML=earlierBar()+list.map(m0=>{
    const m=Object.assign({},m0,liveWho(m0)||{});   // v1.36 名稱／頭像取最新
    const isMe=me&&m.username===me.username;
    const isAI=m.role==='ai';
    const time=new Date(m.createdAt).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    const msgIsAdmin=m.role==='superadmin'||m.role==='admin';
    const roleTag=msgIsAdmin?' [管理]':(isAI?' [AI]':'');
    const classTag=m.cls?`<span class="class-tag">${escapeHtml(m.cls)}</span>`:'';
    const shownColor=safeColor(isAI?AI_COLOR:(msgIsAdmin?'#8b5cf6':m.color),'#3b82f6');
    const userExists=allUsers[m.username];
    const isDeletedUser=!isAI&&!userExists&&usersLoaded;
    if(isAI&&m.thinking){ return `<div class="msg thinking"><div class="avatar" style="background:${AI_COLOR}">AI</div><div class="bubble-wrap"><div class="meta">小喆AI · ${time}</div><div class="bubble">小喆AI 正在思考<span class="thinking-dots"><span></span><span></span><span></span></span></div></div></div>`; }
    let body='';
    if(m.type==='image'){const iu=String(m.imageUrl==null?'':m.imageUrl);body=`<img class="msg-img" src="${escAttr(iu)}" data-action="viewImage" data-arg="${escAttr(iu)}">`;}
    else if(m.type==='file')body=`<div class="file-msg"><span class="fi">[F]</span><div style="flex:1;min-width:0"><div class="fn">${escapeHtml(m.fileName||'file')}</div><div class="fs">${formatSize(m.fileSize||0)}</div></div></div>`;
    else if(m.type==='voice'){const played=allNoticeReads&&allNoticeReads['voice_'+m.id]?' played':'';body=`<div class="voice-msg${played}" data-action="playVoice" data-arg="${escAttr(m.id)}"><span class="vi"><svg class="ico"><use href="#i-voice"/></svg></span><span class="vt">0:${String(Math.round(m.duration||0)).padStart(2,'0')}</span><div class="vp"><div></div></div><span class="vd"></span></div>`;}
    else if(m.type==='call'){body=`<span class="callChip"><svg class="ico"><use href="#i-video"/></svg>${escapeHtml(m.text||'視訊通話')}</span>`;}
    else if(m.type==='location'){const la=Number(m.lat)||0,ln=Number(m.lng)||0;body=`<div class="loc-msg${locNewCls(m.createdAt)}" data-action="openLocation" data-arg="${la},${ln}">${locPreviewHTML(la,ln)}<div class="lm-label">[L] ${escapeHtml(m.placeName||'')}</div></div>`;}
    else if(m.type==='poll')body=renderPollBody(m);
    else if(m.type==='game_invite'){
      const gname=escapeHtml(m.gameName||'小遊戲');
      if(m.done){
        body=`<div class="game-invite done"><div class="gi-title">對局邀請 · ${gname}</div><div class="gi-sub">對局已完成</div></div>`;
      }else{
        body=`<div class="game-invite" data-action="openGameInvite" data-arg="${escAttr(m.roomId||'')}"><div class="gi-title">對局邀請 · ${gname}</div><div class="gi-sub">點擊進入房間（${Number(m.minP)||2}–${Number(m.maxP)||2} 人）</div><div class="gi-btn">加入對局</div></div><button class="gi-copy" data-action="copyRoomLink" data-arg="${escAttr(m.roomId||'')}">複製房間連結</button>`;
      }
    }
    else if(m.encrypted&&!isAI)body=renderEncryptedBody(m);
    else{
      body=escapeHtml(m.text||'').replace(/@([a-zA-Z0-9_]+)/g,'<span class="mention">@$1</span>').replace(/(https?:\/\/[^\s<>"']+)/g,'<a href="#" data-action="linkCheck" data-arg="$1" style="color:inherit;text-decoration:underline">$1</a>').replace(/\n/g,'<br>');
      if(isAI&&m.reasoning)body=`<div class="think-card"><span class="think-label">想法：</span>${escapeHtml(m.reasoning)}</div>`+body;
      if(isAI&&m.sponsor)body+=`<span class="ai-sponsor">${AI_SPONSOR}</span>`;
    }
    let checkingHtml='';
    if(m.hasHtml&&m.htmlCheckStatus==='checking'){checkingHtml=`<div class="msg-checking">AI 正在檢測是否含有破壞性內容...</div>`;}
    const deletedTag=m.deleted?` <span style="color:var(--danger);font-size:10.5px">（已刪除）</span>`:'';
    const encTag=m.encrypted?`<span class="enc-tag">加密</span>`:'';
    const aiTag=isAI?`<span class="ai-tag">AI</span>`:'';
    /* v1.36 名冊中文名：跟預設顯示名稱一樣就不重複顯示（很多人顯示名稱本來就是中文名）。
       編號與舉報／管理刪除不再掛在訊息上，改成點一下訊息才彈出來（見 openMsgMenu）。 */
    const chiName=String(m.chiName||'').trim();
    const realNameTag=(chiName&&chiName!==String(m.displayName||m.username))?`<span class="meta-realname">${escapeHtml(chiName)}</span>`:'';
    const avatarCls=isDeletedUser?'avatar deleted':'avatar';
    return `<div class="msg ${isMe?'me':''}" data-msgid="${escAttr(m.id)}"><div class="${avatarCls}" style="background:${isDeletedUser?'#475569':shownColor}" data-action="openUserProfile" data-arg="${escAttr(m.username)}">${avatarHTML(m)}</div><div class="bubble-wrap"><div class="meta">${escapeHtml(m.displayName||m.username)}${realNameTag}${classTag}${roleTag} · ${time}${deletedTag}${encTag}${aiTag}</div><div class="bubble" style="background:${shownColor}">${body}</div>${checkingHtml}</div></div>`;
  }).join('');
  if(atBottom&&!searchKeyword&&!suppress)chatBox.scrollTop=chatBox.scrollHeight;
  updateScrollToBottomBtn();
  /* v1.36 點訊息 → 彈出「訊息編號 / 舉報 / 管理刪除」。
     訊息裡本來就有動作的元素（頭像、投票選項、圖片、連結…）不攔，讓它們做自己的事。 */
  chatBox.querySelectorAll('.msg[data-msgid]').forEach(el=>{
    el.addEventListener('click',ev=>{
      if(ev.target.closest('[data-action],[data-poll-opt]'))return;
      if(window.getSelection&&String(window.getSelection()).length>0)return;   // 正在選字就不要彈
      openMsgMenu(el.dataset.msgid);
    });
  });
  chatBox.querySelectorAll('[data-poll-opt]').forEach(el=>{
    el.onclick=(ev)=>{
      ev.stopPropagation();
      const msgId=el.dataset.pollMsg;const idx=parseInt(el.dataset.pollOpt,10);
      const m=allMsgs().find(x=>x.id===msgId);if(!m)return;
      const now=Date.now();if(m.pollDeadline&&now>=m.pollDeadline)return;
      const votes=m.pollVotes||{};if(votes[me.username])return;
      if(me.banned&&me.banned.type==='light'){showNotif('你目前被限制發言');return;}
      const mode=m.pollMode||'single';const maxSel=m.pollMaxSelect||0;
      if(!window._pollSel)window._pollSel={};
      if(!window._pollSel[msgId])window._pollSel[msgId]=[];
      const sel=window._pollSel[msgId];
      if(mode==='single'){window._pollSel[msgId]=[idx];submitPollVote(msgId);return;}
      const pos=sel.indexOf(idx);
      if(pos>=0)sel.splice(pos,1);
      else{ if(maxSel>0&&sel.length>=maxSel){showNotif('超過上限（最多 '+maxSel+' 項）');return;} sel.push(idx); }
      render();
    };
  });
}
function isChatAtBottom(){ return chatBox.scrollHeight-chatBox.scrollTop-chatBox.clientHeight<80; }
function updateScrollToBottomBtn(){
  const btn=document.getElementById('scrollToBottomBtn');if(!btn)return;
  if(isChatAtBottom()){ btn.classList.remove('show'); }
  else{ btn.classList.add('show'); }
}
function scrollToBottom(){ chatBox.scrollTop=chatBox.scrollHeight; updateScrollToBottomBtn(); }
let encState={};
function renderEncryptedBody(m){
  const chars=Array.from(m.text||'');
  const total=chars.length;
  if(total===0)return `<div class="enc-msg"><div class="enc-display">(空)</div></div>`;
  const idx=Math.min(Math.max(encState[m.id]||0,0),total-1);
  const revealed=encState['_all_'+m.id];
  const shown=revealed?chars.map(c=>escapeHtml(c)).join(''):chars.map((c,i)=>i===idx?escapeHtml(c):'X').join('');
  const pct=total>1?Math.round((idx/(total-1))*100):100;
  return `<div class="enc-msg"><div class="enc-display">${shown}</div><div class="enc-bar"><div style="width:${pct}%"></div></div><div class="enc-controls"><button data-action="encPrev" data-arg="${escAttr(m.id)}" ${(!revealed&&idx===0)||revealed?'disabled':''}><svg class="ico"><use href="#i-back"/></svg> 上一字</button><span class="enc-progress">${revealed?'全部':(idx+1)+' / '+total}</span><button data-action="encNext" data-arg="${escAttr(m.id)}" ${(!revealed&&idx>=total-1)||revealed?'disabled':''}>下一字 <svg class="ico"><use href="#i-next"/></svg></button><button data-action="encToggleAll" data-arg="${escAttr(m.id)}">${revealed?'遮罩':'看全部'}</button></div></div>`;
}
function encPrev(msgId){ const m=allMsgs().find(x=>x.id===msgId);if(!m)return;if(!encState[msgId])encState[msgId]=0;encState['_all_'+msgId]=false;if(encState[msgId]>0){encState[msgId]--;render();} }
function encNext(msgId){ const m=allMsgs().find(x=>x.id===msgId);if(!m)return;const total=Array.from(m.text||'').length;if(!encState[msgId])encState[msgId]=0;encState['_all_'+msgId]=false;if(encState[msgId]<total-1){encState[msgId]++;render();} }
function encToggleAll(msgId){ if(!encState)encState={};encState['_all_'+msgId]=!encState['_all_'+msgId];render(); }
/* ═══ v1.15 安全：輸出跳脫 ═══
   原本整站的頭像都是「avatar 以 data: 開頭就當圖片，否則原樣塞進 innerHTML」，
   同一個寫法在九個地方各複製了一份 —— 等於九個同樣的洞：
   只要有人把頭像改成 <img src=x onerror=...>，每個看得到他的人（包含管理員）
   都會在瀏覽器裡執行那段腳本。
   現在不管頭像是什麼，只允許 data:image/ 的圖片，其餘一律當純文字轉義輸出。
   現有頭像全部是單一 emoji 或一個字，所以改完不會有人「頭像變亂碼」。 */
function escapeHtml(str){ return String(str==null?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
/* 放進 HTML 屬性（雙引號）裡用的版本：先走 escapeHtml 再補單引號，兩層都顧到。 */
function escAttr(v){ return escapeHtml(v); }
/* v1.15 安全：顏色只允許 #rgb / #rrggbb / #rrggbbaa 或純英文字母色名（red、blue…）。
   這些值會被直接塞進 style="background:..."，不擋的話可以夾帶 url()、
   expression() 之類的東西，一樣能在別人瀏覽器上跑。 */
function safeColor(v,fallback){
  const s=String(v==null?'':v).trim();
  if(/^#[0-9a-fA-F]{3,8}$/.test(s))return s;
  if(/^[a-zA-Z]{3,20}$/.test(s))return s;
  return fallback||'#3b82f6';
}
function avatarHTML(m){
  const raw=m&&m.avatar;
  if(raw){
    const s=String(raw);
    if(/^data:image\//i.test(s))return `<img src="${escAttr(s)}" alt="">`;
    const glyphs=Array.from(s).slice(0,3).join('');   // 最多留三個字元，避免有人塞一萬字
    return escapeHtml(glyphs);
  }
  const name=String((m&&(m.displayName||m.username))||'?');
  const first=Array.from(name)[0]||'?';
  return escapeHtml(first.toUpperCase());
}
function formatSize(b){ if(b<1024)return b+' B';if(b<1024*1024)return (b/1024).toFixed(1)+' KB';return (b/1024/1024).toFixed(2)+' MB'; }
function closePlus(){ if(!plusPanel.classList.contains('hidden'))animHide(plusPanel,'anim-out-panel',160).then(()=>plusPanel.classList.add('hidden')); }
function togglePlus(){ if(plusPanel.classList.contains('hidden'))plusPanel.classList.remove('hidden');else closePlus(); }
function pickImage(){ closePlus();const inp=document.getElementById('globalImgInput');inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=await compressImage(f,1200,1200,0.75);await sendMedia('image',{imageUrl:d,text:''});}catch(err){}e.target.value='';};inp.click(); }
function pickFile(){ closePlus();const inp=document.getElementById('globalFileInput');inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){showNotif('5MB');return;}try{const d=await fileToBase64(f);await sendMedia('file',{fileUrl:d,fileName:f.name,fileSize:f.size});}catch(err){}e.target.value='';};inp.click(); }
/* v1.38：發送位置以前完全沒有提示 —— 定位 + 反查地址可能拖好幾秒，
   畫面動都不動，用起來就像卡住。現在一按就彈等待卡，逐個步驟換文字。 */
let locWaitEl=null;
function showLocWait(text){
  hideLocWait();
  const d=document.createElement('div');
  d.className='loc-wait';
  d.innerHTML='<span class="lw-ico"><svg class="ico"><use href="#i-pin"/></svg></span>'
    +'<span class="lw-tx">'+escapeHtml(text)+'</span>';
  document.body.appendChild(d);
  locWaitEl=d;
}
function setLocWait(text){
  const e=locWaitEl?locWaitEl.querySelector('.lw-tx'):null;
  if(e)e.textContent=text;
}
function hideLocWait(){
  const el=locWaitEl;
  locWaitEl=null;
  if(!el)return;
  el.classList.add('lw-out');
  setTimeout(function(){ if(el.parentNode)el.parentNode.removeChild(el); },220);
}
function pickLocation(){
  closePlus();
  if(!navigator.geolocation){ showNotif('這個瀏覽器不支援定位'); return; }
  showLocWait('正在取得你的位置');
  navigator.geolocation.getCurrentPosition(async function(pos){
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    let placeName=lat.toFixed(4)+', '+lng.toFixed(4);
    setLocWait('正在查詢地址');
    try{
      /* 反查地址最慢，4.5 秒收不到就直接用座標，不要再等 */
      const ctl=(typeof AbortController!=='undefined')?new AbortController():null;
      const tm=ctl?setTimeout(function(){ ctl.abort(); },4500):null;
      const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='
        +lat+'&lon='+lng+'&accept-language=zh-TW', ctl?{signal:ctl.signal}:undefined);
      if(tm)clearTimeout(tm);
      const j=await r.json();
      if(j&&j.display_name)placeName=j.display_name;
    }catch(e){}
    setLocWait('正在送出');
    locJustSent=Date.now();
    await sendMedia('location',{lat:lat,lng:lng,placeName:placeName});
    setTimeout(hideLocWait,260);   /* 留一點時間讓動畫接上訊息氣泡 */
  },function(err){
    hideLocWait();
    showNotif(err&&err.code===1?'未授予定位權限':'無法取得位置');
  },{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
}
async function sendMedia(type,payload){
  if(!me)return;
  try{
    /* v1.15：訊息鍵改用 push()。
       以前是「讀 meta/msgCounter → 加一 → 寫回去 → 拼成 msg_0001」四步，
       中間只要兩個人同一個瞬間送出，就會讀到同一個號碼、拼出同一個鍵，
       後送出的那則會直接把前一則蓋掉（訊息就這樣無聲消失）。
       push() 由 Firebase 產生唯一且依時間排序的鍵，天生不會撞。
       舊訊息（msg_0001…）完全不用動：讀取端是靠 createdAt 排序、靠 id 欄位找訊息，
       兩種鍵名可以並存，前面的聊天記錄一則都不會少。 */
    const msgId=await nextMsgId();
    await set(ref(db,'messages/'+msgId),{id:msgId,username:me.username,displayName:me.displayName,chiName:me.chiName||'',engName:me.engName||'',seat:me.seat,cls:me.cls||'',color:me.color,avatar:me.avatar,role:me.role,...payload,type,createdAt:Date.now(),deleted:false});
  }catch(e){showNotif('送出失敗');}
}
function fileToBase64(file){ return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('fail'));r.readAsDataURL(file);}); }
function compressImage(file,maxW,maxH,quality){ return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=ev=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const ratio=Math.min(maxW/w,maxH/h,1);w=Math.round(w*ratio);h=Math.round(h*ratio);const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',quality));};img.onerror=()=>reject(new Error('load fail'));img.src=ev.target.result;};reader.onerror=()=>reject(new Error('read fail'));reader.readAsDataURL(file);}); }
function viewImage(url){ const u=String(url==null?'':url);if(!/^(data:image\/|https?:\/\/)/i.test(u))return;const div=document.createElement('div');div.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px';div.innerHTML=`<img src="${escAttr(u)}" style="max-width:100%;max-height:100%;object-fit:contain">`;div.classList.add('anim-in-modal');div.onclick=()=>{div.onclick=null;animOut(div,'anim-out-zoom',200);};document.body.appendChild(div); }

/* ===== v1.10 語音錄音 =====
   v1.37：錄音器改成「看目標」——recTarget 是 'main'（公共聊天室）還是 'group'（私人群聊）。
   以前 stopRec() 永遠把語音丟去 sendMedia()（公共聊天室），所以群聊按麥克風會錄到公共頻道去。 */
let mediaRecorder=null,audioChunks=[],recStartTime=0,recTimer=null,recCancel=false,recStream=null,recTarget='main';
function initVoiceRecorder(){
  const micBtn=document.getElementById('micBtn');
  if(micBtn){
    micBtn.addEventListener('mousedown',e=>{e.preventDefault();startRec('main');});
    micBtn.addEventListener('touchstart',e=>{e.preventDefault();startRec('main');},{passive:false});
  }
  document.addEventListener('mouseup',stopRec);
  document.addEventListener('touchend',stopRec);
  document.addEventListener('mousemove',moveRec);
  document.addEventListener('touchmove',e=>{if(e.touches&&e.touches[0])moveRec(e.touches[0]);},{passive:true});
}
/* 群聊的麥克風是後來才插進 DOM 的（而且會隨開關重建），所以用事件委派綁在 document 上 */
document.addEventListener('mousedown',e=>{
  const el=e.target&&e.target.closest?e.target.closest('#groupMicBtn'):null;
  if(el){ e.preventDefault(); startRec('group'); }
});
document.addEventListener('touchstart',e=>{
  const t=e.target&&e.target.closest?e.target.closest('#groupMicBtn'):null;
  if(t){ e.preventDefault(); startRec('group'); }
},{passive:false});
function recButton(){
  return document.getElementById(recTarget==='group'?'groupMicBtn':'micBtn');
}
function startRec(target){
  if(!me)return;
  recTarget=target||'main';
  if(recTarget==='group'&&!currentGroupKey){showNotif('請先進入群聊');return;}
  if(me.banned&&me.banned.type==='light'){showNotif('你目前被限制發言');return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showNotif('此瀏覽器不支援錄音');return;}
  if(mediaRecorder&&mediaRecorder.state==='recording')return;
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    recStream=stream;audioChunks=[];recCancel=false;
    let mime='';
    if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/webm'))mime='audio/webm';
    try{mediaRecorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}catch(e){mediaRecorder=new MediaRecorder(stream);}
    mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size>0)audioChunks.push(e.data);};
    mediaRecorder.start();
    recStartTime=Date.now();
    const mb=recButton();if(mb)mb.classList.add('recording');
    const ov=document.createElement('div');
    ov.id='recordingOverlay';
    ov.innerHTML=`<div class="rec-timer" id="recTimer">0:00</div><div class="rec-wave"><span></span><span></span><span></span><span></span><span></span></div><div class="rec-hint">放開送出 · <span class="rec-cancel-tip">上滑取消</span></div>`;
    document.body.appendChild(ov);
    recTimer=setInterval(()=>{
      const s=Math.floor((Date.now()-recStartTime)/1000);
      const el=document.getElementById('recTimer');
      if(el)el.textContent=`0:${String(s).padStart(2,'0')}`;
      if(s>=60)stopRec();
    },100);
  }).catch(()=>{showNotif('無法取得麥克風權限');});
}
function moveRec(e){
  if(!mediaRecorder||mediaRecorder.state!=='recording')return;
  const y=e&&e.clientY!=null?e.clientY:null;
  const ov=document.getElementById('recordingOverlay');
  if(y!=null){
    if(window.innerHeight-y>110){recCancel=true;if(ov)ov.classList.add('cancel');}
    else{recCancel=false;if(ov)ov.classList.remove('cancel');}
  }
}
function stopRec(){
  if(!mediaRecorder||mediaRecorder.state!=='recording')return;
  const dur=(Date.now()-recStartTime)/1000;
  const target=recTarget;
  mediaRecorder.onstop=async()=>{
    if(recTimer){clearInterval(recTimer);recTimer=null;}
    const mb=recButton();if(mb)mb.classList.remove('recording');
    const ov=document.getElementById('recordingOverlay');if(ov)animOut(ov,'anim-out-overlay',200);
    if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null;}
    if(recCancel||dur<1)return;
    const blob=new Blob(audioChunks,{type:'audio/webm'});
    if(blob.size>1024*1024*3){showNotif('語音太長或太大');return;}
    const reader=new FileReader();
    reader.onload=async()=>{
      try{
        if(target==='group'&&currentGroupKey) await sendGroupMedia('voice',{audioUrl:reader.result,duration:Math.round(dur)},'（語音）');
        else await sendMedia('voice',{audioUrl:reader.result,duration:Math.round(dur)});
      }catch(e){showNotif('送出失敗');}
    };
    reader.readAsDataURL(blob);
  };
  try{mediaRecorder.stop();}catch(e){}
  mediaRecorder=null;
}

/* ═══ v1.38 位置地圖（自繪圖磚）══════════════════════════════════════
   舊做法兩邊都壞掉，而且壞法一樣難看：
     · 訊息卡片的縮圖用 staticmap.openstreetmap.de —— 那個服務早就停運，
       伺服器不再回應，所以整張縮圖變成一個破圖示。
     · 點入後的全螢幕用 <iframe> 載 openstreetmap.org —— 被我們自己的 CSP
       frame-src 擋住（從來沒有放行過），所以只剩一片灰色加一個破圖示。
   現在兩邊都改成用 tile.openstreetmap.org 的圖磚自己拼：縮圖用 <img>、
   全螢幕用 canvas。同一個資料源、跟痕跡地圖一致，而且不需要放寬 CSP
   frame-src —— img-src 本來就放行了那個圖磚網域。 */
let locJustSent=0;
function locNewCls(ts){ return (ts&&locJustSent&&Math.abs(Number(ts)-locJustSent)<3000)?' loc-new':''; }
let locTileCache=new Map();
function locTileImg(z,x,y){
  const key=z+'/'+x+'/'+y;
  let img=locTileCache.get(key);
  if(!img){
    img=new Image();
    img.decoding='async';
    img.src='https://tile.openstreetmap.org/'+key+'.png';
    locTileCache.set(key,img);
  }
  return img;
}
/* 卡片縮圖：220×150，圖磚絕對定位拼出來，點擊事件交給外層的 .loc-msg */
function locPreviewHTML(lat,lng){
  const la=Number(lat), ln=Number(lng);
  if(!isFinite(la)||!isFinite(ln))return '<div class="lm-map"></div>';
  const W=220,H=150,Z=15,n=Math.pow(2,Z);
  const left=tmLon2x(ln,Z)-W/2, top=tmLat2y(la,Z)-H/2;
  let t='';
  for(let tx=Math.floor(left/TM_TILE);tx<=Math.floor((left+W-1)/TM_TILE);tx++){
    for(let ty=Math.floor(top/TM_TILE);ty<=Math.floor((top+H-1)/TM_TILE);ty++){
      if(ty<0||ty>=n)continue;
      const wx=((tx%n)+n)%n;
      t+='<img class="lm-t" alt="" draggable="false" loading="lazy"'
        +' style="left:'+(tx*TM_TILE-left)+'px;top:'+(ty*TM_TILE-top)+'px"'
        +' src="https://tile.openstreetmap.org/'+Z+'/'+wx+'/'+ty+'.png">';
    }
  }
  return '<div class="lm-map"><div class="lm-in">'+t+'</div><span class="lm-pin"></span></div>';
}

/* ---- 全螢幕地圖 ----
   2026-10-17：改用雙指縮放（拿走加減按鈕）；標記釘在「發送位置」那一點上，
   拖地圖時它會跟著地圖走，不再永遠卡在畫面正中（以前看起來像地圖在飄）。
   連續縮放做法：整數層 z 決定抓哪一級圖磚，sc 是額外的倍率，
   兩者相乘才是螢幕上的比例，所以縮放可以很順，不會一格一格跳。 */
let locState=null;

/* 螢幕座標 ↔ 經緯度（用目前的 z 與 sc） */
function locScreenToGeo(s, x, y){
  const ox = tmLon2x(s.lng, s.z) * s.sc - s.w / 2;
  const oy = tmLat2y(s.lat, s.z) * s.sc - s.h / 2;
  return [ tmX2lon((ox + x) / s.sc, s.z), tmY2lat((oy + y) / s.sc, s.z) ];
}
/* 把某個地理點放到畫面的 (mx,my)，同時設定縮放 */
function locAnchorTo(z, sc, geo, mx, my){
  const s = locState;
  if(!s) return;
  s.z = Math.max(3, Math.min(18, z));
  s.sc = Math.max(0.5, Math.min(1.9999, sc));
  const wx = tmLon2x(geo[0], s.z) * s.sc;
  const wy = tmLat2y(geo[1], s.z) * s.sc;
  s.lng = tmX2lon((wx - mx + s.w / 2) / s.sc, s.z);
  s.lat = tmY2lat((wy - my + s.h / 2) / s.sc, s.z);
  locDraw();
}

function locDraw(){
  const s = locState;
  if(!s || !s.w || !s.ctx) return;
  s.raf = 0;
  const ctx = s.ctx, w = s.w, h = s.h, z = s.z, sc = s.sc;
  const ts = TM_TILE * sc;              /* 螢幕上一格圖磚的邊長 */
  ctx.setTransform(s.dpr, 0, 0, s.dpr, 0, 0);
  ctx.fillStyle = '#dfe6ec';
  ctx.fillRect(0, 0, w, h);
  const ox = tmLon2x(s.lng, z) * sc - w / 2;
  const oy = tmLat2y(s.lat, z) * sc - h / 2;
  const n = Math.pow(2, z);
  for(let tx = Math.floor(ox / ts); tx <= Math.floor((ox + w) / ts); tx++){
    if(tx < 0 || tx >= n) continue;
    for(let ty = Math.floor(oy / ts); ty <= Math.floor((oy + h) / ts); ty++){
      if(ty < 0 || ty >= n) continue;
      const img = locTileImg(z, tx, ty);
      const X = tx * ts - ox, Y = ty * ts - oy;
      if(img.complete && img.naturalWidth) ctx.drawImage(img, X, Y, ts, ts);
      else if(!img.__wired){ img.__wired = 1; img.addEventListener('load', locSchedule); }
    }
  }
  if(s.pinEl){
    const px = tmLon2x(s.pinLng, z) * sc - ox;
    const py = tmLat2y(s.pinLat, z) * sc - oy;
    s.pinEl.style.transform = 'translate(' + px.toFixed(1) + 'px,' + py.toFixed(1) + 'px) translate(-50%,-50%)';
    s.pinEl.style.opacity = (px < -40 || py < -40 || px > w + 40 || py > h + 40) ? '0' : '1';
  }
}
function locSchedule(){
  const s = locState;
  if(!s || s.raf) return;
  s.raf = requestAnimationFrame(locDraw);
}
function locResize(){
  const s = locState;
  if(!s || !s.cv) return;
  const host = s.cv.parentElement;
  /* 用 clientWidth 而不用 getBoundingClientRect：進場動畫有 scale，
     量到縮細後的尺寸會令標記偏離正中幾個 px。 */
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  s.w = Math.max(1, host.clientWidth);
  s.h = Math.max(1, host.clientHeight);
  s.dpr = dpr;
  s.cv.width = Math.round(s.w * dpr);
  s.cv.height = Math.round(s.h * dpr);
  s.cv.style.width = s.w + 'px';
  s.cv.style.height = s.h + 'px';
  locDraw();
}

/* 兩指：開始 / 移動 / 結束 */
function locPinchStart(){
  const s = locState;
  if(!s) return;
  const ids = Object.keys(s.ptrs);
  if(ids.length < 2){ s.pinch = null; return; }
  const a = s.ptrs[ids[0]], b = s.ptrs[ids[1]];
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  s.pinch = { d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
              sc: s.sc, z: s.z, geo: locScreenToGeo(s, mx, my) };
}
function locPinchMove(){
  const s = locState;
  if(!s || !s.pinch) return;
  const ids = Object.keys(s.ptrs);
  if(ids.length < 2) return;
  const a = s.ptrs[ids[0]], b = s.ptrs[ids[1]];
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const d = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
  let sc = s.pinch.sc * (d / s.pinch.d), z = s.pinch.z;
  /* 倍率走出 0.5–2 就換一級圖磚，這樣 z 永遠停在整數、sc 保持連續 */
  while(sc >= 2 && z < 18){ z++; sc /= 2; }
  while(sc < 0.5 && z > 3){ z--; sc *= 2; }
  const geo = s.pinch.geo;
  s.z = z;
  locAnchorTo(z, sc, geo, mx, my);
}

function openLocationFullscreen(arg){
  if(!arg) return;
  const parts = String(arg).split(',');
  const la = Number(parts[0]), ln = Number(parts[1]);
  if(!isFinite(la) || !isFinite(ln)) return;
  const old = document.getElementById('locationFull');
  if(old) old.remove();
  const div = document.createElement('div');
  div.id = 'locationFull';
  div.className = 'loc-full anim-in-page';
  const coord = escAttr(la.toFixed(6)) + ', ' + escAttr(ln.toFixed(6));
  const ext = 'https://www.openstreetmap.org/?mlat=' + la + '&mlon=' + ln + '#map=16/' + la + '/' + ln;
  div.innerHTML = '<div class="lf-head">'
    + '<button class="lf-back" data-action="closeLocationFull"><svg class="ico"><use href="#i-back"/></svg></button>'
    + '<div class="lf-coord">' + coord + '</div>'
    + '<a class="lf-btn" href="' + escAttr(ext) + '" target="_blank" rel="noopener">在大地圖開啟</a>'
    + '</div>'
    + '<div class="lf-stage"><canvas class="lf-canvas"></canvas>'
    + '<div class="lf-pin"><i></i></div>'
    + '<div class="lf-attr">\u00a9 OpenStreetMap \u8ca2\u737b\u8005</div></div>';
  document.body.appendChild(div);
  const cv = div.querySelector('.lf-canvas');
  /* 位置全部存成經緯度，畫的時候才換算成像素 ——
     跟痕跡地圖同一個原則：距離用地圖單位定義，縮放時才不會愈拖愈歪。 */
  locState = { lat: la, lng: ln, z: 16, sc: 1,
               pinLat: la, pinLng: ln, pinEl: div.querySelector('.lf-pin'),
               cv: cv, ctx: cv.getContext('2d'),
               w: 0, h: 0, dpr: 1, drag: null, ptrs: {}, pinch: null, raf: 0 };

  cv.addEventListener('pointerdown', function(e){
    const s = locState;
    if(!s) return;
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    s.ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    const ids = Object.keys(s.ptrs);
    if(ids.length === 1){ s.drag = { x: e.clientX, y: e.clientY }; s.pinch = null; }
    else if(ids.length === 2){ s.drag = null; locPinchStart(); }
  });
  cv.addEventListener('pointermove', function(e){
    const s = locState;
    if(!s) return;
    const p = s.ptrs[e.pointerId];
    if(!p) return;
    p.x = e.clientX; p.y = e.clientY;
    if(Object.keys(s.ptrs).length >= 2){
      if(!s.pinch) locPinchStart();
      locPinchMove();
      return;
    }
    if(!s.drag) return;
    const dx = e.clientX - s.drag.x, dy = e.clientY - s.drag.y;
    if(!dx && !dy) return;
    s.drag.x = e.clientX;
    s.drag.y = e.clientY;
    /* 手指移動的是螢幕像素，換算成地圖單位要除以 sc */
    s.lng = tmX2lon(tmLon2x(s.lng, s.z) - dx / s.sc, s.z);
    s.lat = Math.max(-85, Math.min(85, tmY2lat(tmLat2y(s.lat, s.z) - dy / s.sc, s.z)));
    locSchedule();
  });
  const locPointerUp = function(e){
    const s = locState;
    if(!s) return;
    delete s.ptrs[e.pointerId];
    const ids = Object.keys(s.ptrs);
    if(ids.length < 2) s.pinch = null;
    if(ids.length === 1) s.drag = { x: s.ptrs[ids[0]].x, y: s.ptrs[ids[0]].y };
    else if(!ids.length) s.drag = null;
  };
  cv.addEventListener('pointerup', locPointerUp);
  cv.addEventListener('pointercancel', locPointerUp);
  /* 雙擊放大（桌面滑鼠用；手機主要靠兩指） */
  cv.addEventListener('dblclick', function(e){
    const s = locState;
    if(!s || s.z >= 18) return;
    const r = cv.getBoundingClientRect();
    const geo = locScreenToGeo(s, e.clientX - r.left, e.clientY - r.top);
    locAnchorTo(s.z + 1, s.sc, geo, e.clientX - r.left, e.clientY - r.top);
  });
  window.addEventListener('resize', locResize);
  locResize();
  /* 進場動畫播完再量一次，確保地圖鋪滿、標記正好在正中 */
  setTimeout(locResize, 60);
  setTimeout(locResize, 340);
}
function closeLocationFull(){
  const el = document.getElementById('locationFull');
  locState = null;
  window.removeEventListener('resize', locResize);
  if(el) animOut(el, 'anim-out-page', 260);
}

async function submitPoll(){

    const msgId=await nextMsgId();

function renderPollBody(m){
  const now=Date.now();const ended=m.pollDeadline&&now>=m.pollDeadline;
  const isAdmin=me.role==='superadmin'||me.role==='admin';
  const isCreator=m.username===me.username;
  const votes=m.pollVotes||{};const myVote=votes[me.username]||null;
  const totalVotes=Object.keys(votes).length;
  const mode=m.pollMode||'single';const maxSel=m.pollMaxSelect||0;
  const options=m.pollOptions||[];
  const counts=options.map((_,i)=>Object.values(votes).filter(v=>Array.isArray(v)&&v.includes(i)).length);
  const isMulti=mode==='multi';
  const canVote=!ended&&!myVote;
  const showResult=!canVote&&(isAdmin||isCreator||!!myVote);
  const pctArr=counts.map(c=>totalVotes>0?Math.round(c/totalVotes*100):0);
  const tempSel=(window._pollSel&&window._pollSel[m.id])||[];
  const optsHTML=options.map((o,i)=>{
    const selected=Array.isArray(myVote)?myVote.includes(i):tempSel.includes(i);
    const cls='poll-opt'+(selected?' selected':'')+(canVote?'':' disabled');
    const sym=isMulti?'<div class="poll-square">'+(selected?CHECK_SVG:'')+'</div>':'<div class="poll-circle">'+(selected?CHECK_SVG:'')+'</div>';
    const pct=pctArr[i];
    const bar=showResult?`<div class="poll-fill" style="width:${pct}%"></div>`:'';
    const pctTag=showResult?`<div class="poll-pct">${pct}% · ${counts[i]}</div>`:'';
    return `<div class="${cls}" data-poll-opt="${i}" data-poll-msg="${escAttr(m.id)}">${bar}${sym}<div class="poll-text">${escapeHtml(o)}</div>${pctTag}</div>`;
  }).join('');
  const deadlineText=ended?`<div class="poll-end">已結束</div>`:`<div>將於約 ${Math.max(1,Math.ceil((m.pollDeadline-now)/3600000))} 小時後結束</div>`;
  const confirmBtn=canVote&&tempSel.length>0?`<button class="poll-confirm" data-action="pollConfirmVote" data-arg="${escAttr(m.id)}">確認投票</button>`:'';
  const votedTag=myVote?`<div style="font-size:11.5px;opacity:.85">你已投票${mode==='multi'?'（'+myVote.length+' 項）':''}</div>`:'';
  return `<div class="poll-box"><div class="poll-title">${escapeHtml(m.pollTitle||'')}</div><div class="poll-options">${optsHTML}</div>${confirmBtn}<div class="poll-footer">${deadlineText}<div>${totalVotes} 人已投票</div>${votedTag}</div></div>`;
}
async function submitPollVote(msgId){
  const sel=(window._pollSel&&window._pollSel[msgId])||[];
  if(sel.length===0){showNotif('請至少選一個');return;}
  /* v1.37：群聊也有投票了。群聊訊息多帶 _scope='group' 與 _gk=群組key，
     所以同一個函式可以同時處理公共聊天室與群聊的投票。 */
  const m=allMsgs().find(x=>x.id===msgId)||currentGroupMsgs.find(x=>x.id===msgId);
  if(!m)return;
  const pollPath=(m._scope==='group'&&m._gk)?('groupMessages/'+m._gk+'/'+m._key):('messages/'+m._key);
  // 送出前把所有規則再檢查一次：截止、重複投票、封禁、選項範圍、單選一項、多選上限
  const now=Date.now();
  if(m.pollDeadline&&now>=m.pollDeadline){showNotif('投票已結束');return;}
  if(m.pollVotes&&m.pollVotes[me.username]){showNotif('你已投過票');return;}
  if(me.banned&&me.banned.type==='light'){showNotif('你目前被限制發言');return;}
  const opts=m.pollOptions||[];
  const mode=m.pollMode||'single';
  const maxSel=m.pollMaxSelect||0;
  let clean=Array.from(new Set(sel)).filter(i=>Number.isInteger(i)&&i>=0&&i<opts.length).sort((a,b)=>a-b);
  if(clean.length===0){showNotif('請至少選一個');return;}
  if(mode==='single')clean=[clean[0]];
  if(mode==='multi'&&maxSel>0&&clean.length>maxSel){showNotif('超過上限（最多 '+maxSel+' 項）');return;}
  try{ await update(ref(db,pollPath+'/pollVotes'),{[me.username]:clean.slice()}); window._pollSel[msgId]=[]; showNotif('已投票'); }catch(e){showNotif('投票失敗');}
}

/* ── 頁面層級堆疊 ──
   以前所有頁面都是直接把 #pageRoot 整個覆寫掉，按「←」就無條件清空，
   所以「管理員後台 → 某同學資料 → 他的日誌」按返回會直接掉回聊天室。
   現在改成：開新一層之前先把「目前這層」的完整 HTML 存起來，返回時還原。 */

/* ── v1.12 退場動畫工具 ──
   安卓版每次離開畫面都有轉場，網頁版原本沒有。這裡統一收口：
   任何東西要離開畫面，都先播完動畫，才真的從 DOM 移除。
   - animOut：播完動畫後把節點整個移除（用於頁面、彈窗、遮罩）
   - animHide：播完動畫後只加 hidden / 移除 class，節點保留（用於 + 面板這類常駐元素） */
const ENTER_CLASSES=['anim-in-page','anim-in-back','anim-in-modal','anim-in-bar','anim-in-notif'];
function animOut(el,cls,ms){
  return new Promise(res=>{
    if(!el){res();return;}
    let done=false;
    const fin=()=>{
      if(done)return;done=true;
      el.removeEventListener('animationend',onEnd);
      if(el.parentNode)el.parentNode.removeChild(el);
      res();
    };
    // animationend 會冒泡：子元素自己的動畫結束也會傳上來，必須確認是「自己」播完
    const onEnd=e=>{ if(e.target===el)fin(); };
    el.classList.remove(...ENTER_CLASSES);   // 進場 class 先拿掉，免得蓋住退場動畫
    el.classList.add(cls);
    el.addEventListener('animationend',onEnd);
    setTimeout(fin,(ms||260)+140);      // 保險：動畫沒觸發（例如元素不可見）也要收尾
  });
}
function animHide(el,cls,ms){
  return new Promise(res=>{
    if(!el){res();return;}
    let done=false;
    const fin=()=>{
      if(done)return;done=true;
      el.removeEventListener('animationend',onEnd);
      el.classList.remove(cls);
      res();
    };
    const onEnd=e=>{ if(e.target===el)fin(); };
    el.classList.remove(...ENTER_CLASSES);
    el.classList.add(cls);
    el.addEventListener('animationend',onEnd);
    setTimeout(fin,(ms||160)+140);
  });
}

let pageStack=[];
let currentPageKey=null;
/* ═══ v1.37 返回時要回到原本的捲動位置 ═══
   用戶投訴：「每當進入一個名稱然後退出來都是重新刷新頁面，
   我如果滑到很下，然後進去再退出來，我會在上面。」
   原因：popPage() 以前直接 fp.scrollTop=0（HTML 還原了，但把捲動位置歸零）；
   從管理員後台／在線查詢點進某人的資料頁再返回，清單就被拉回最頂。
   現在 push 的時候連 scrollTop 一起存，pop 的時候一起還原；
   回到主聊天室（疊層空了）也還原 #chatBox 的位置。 */
let chatScrollMemo=0;
function pageScrollerTop(){
  const fp=pageRoot.querySelector('.fp-body');
  if(fp)return fp.scrollTop;
  const ps=document.getElementById('pcBody');
  if(ps)return ps.scrollTop;
  return 0;
}
function restorePageScroll(top){
  const fp=pageRoot.querySelector('.fp-body');
  if(fp){ fp.scrollTop=top||0; return true; }
  return false;
}
function beginPage(key){
  if(currentPageKey===null){ chatScrollMemo=chatBox?chatBox.scrollTop:0; currentPageKey=key; return; }
  if(currentPageKey===key) return;            // 同層重新渲染（例：封禁後刷新），不重複疊加
  // 存快照前先把動畫 class 拿掉，否則還原時會誤播「從右邊進來」而不是「從左邊推回來」
  const cur=pageRoot.querySelector(':scope > .fullPage');
  if(cur)cur.classList.remove('anim-in-page','anim-in-back');
  pageStack.push({html:pageRoot.innerHTML,key:currentPageKey,scroll:pageScrollerTop()});
  if(pageStack.length>20) pageStack.shift();
  currentPageKey=key;
}
function popPage(){
  const prev=pageStack.pop();
  if(prev){ pageRoot.innerHTML=prev.html; currentPageKey=prev.key; }
  else{ pageRoot.innerHTML=''; currentPageKey=null; }
  // 還原捲動位置要在掛上「從左邊推回來」動畫之後再來一次，
  // 因為動畫 class 會讓瀏覽器重算版面，中間那一次有可能被夾回 0。
  if(prev){ restorePageScroll(prev.scroll); }
  else if(chatBox){ chatBox.scrollTop=chatScrollMemo; if(typeof updateScrollToBottomBtn==='function')updateScrollToBottomBtn(); }
  const np=pageRoot.querySelector(':scope > .fullPage');
  if(np){ np.classList.remove('anim-in-page'); np.classList.add('anim-in-back'); }   // 上一層從左邊推回來
  if(prev)restorePageScroll(prev.scroll);
}
function resetPageStack(){ pageStack=[];currentPageKey=null;pageRoot.innerHTML=''; }

/* 新開一層頁面時，讓它從右邊滑進來（安卓版的 push 效果）。
   用 MutationObserver 統一掛，不用改 13 個開頁面的地方。 */
if(window.MutationObserver){
  new MutationObserver(muts=>{
    for(const m of muts){
      if(!m.addedNodes)continue;
      m.addedNodes.forEach(n=>{
        if(n&&n.nodeType===1&&n.classList&&n.classList.contains('fullPage')
           &&!n.classList.contains('anim-in-back')&&!n.classList.contains('anim-in-page')){
          n.classList.add('anim-in-page');
        }
      });
    }
  }).observe(pageRoot,{childList:true});
}

let _pageClosing=false;
async function closePage(){
  if(_pageClosing)return;                 // 防止連點「←」播兩次
  _pageClosing=true;
  try{
    const outs=[];
    const ps=document.getElementById('privateChatScreen');
    if(ps){
      if(unsubGroupMsgs){unsubGroupMsgs();unsubGroupMsgs=null;}
      if(unsubAIPrivate){unsubAIPrivate();unsubAIPrivate=null;}

    if(cur&&!outs.includes(cur))outs.push(cur);

function toolList(){

    const href=/^[A-Za-z0-9._-]+\.html$/.test(hrefRaw)?hrefRaw:'';
    const act=String(t.action==null?'':t.action).trim();
    const action=TOOL_LIVE_ACTIONS[act]?act:'';
    const icon=String(t.icon==null?'':t.icon).trim();

    if(!href&&!action)return;

      id:String(k).slice(0,40),

      desc:String(t.desc==null?'':t.desc).trim().slice(0,180),
      icon:/^i-[a-z0-9-]{1,30}$/.test(icon)?icon:'i-grid',
      color:t.color,
      href:href,
      action:action,
      order:(isFinite(Number(t.order))?Number(t.order):0)
    });
  });
  out.sort(function(a,b){ return a.order-b.order; });
  /* 全部被關掉 → 給一個空清單，由頁面顯示「暫無工具」 */
  return out;
}
function openToolsPage(){
  const list = toolList();
  const cards = list.map(function(t){
    const tc = ' style="--tc:' + safeColor(t.color, '#3b82f6') + '"';
    const inner = '<span class="tool-ico"><svg class="ico"><use href="#'
      + escAttr(t.icon || 'i-grid') + '"/></svg></span>'
      + '<span class="tool-tx"><span class="tool-t">' + escapeHtml(t.name)
      + '</span><span class="tool-s">' + escapeHtml(t.desc || '') + '</span></span>'

    if(t.action)
      return '<a class="tool-card" role="button" data-action="' + escAttr(t.action) + '"'
        + tc + '>' + inner + '</a>';
    const href = escAttr(t.href || '#');
    return '<a class="tool-card" href="' + href + '" data-tool-link="' + href + '"'

  }).join('');
  openPage({

    bodyHTML:'<div class="tools-wrap"><div class="tools-lead">跟聊天室無關、但上課或返學用得著的小工具都放在這裡。</div>'
      + (list.length ? ('<div class="tools-grid">' + cards + '</div>')
                     : '<div class="tools-empty">暫時沒有可用的小工具</div>')
      + '<div class="tools-foot">工具會直接在這裡打開，用完按左上角返回就回到這個清單。</div></div>',
    key:'tools'
  });
}
/* 開工具：用頁內 iframe，不跳頁、不開新視窗。
   為甚麼要改（用戶回報「點工具會一直跳去個人主頁、退不出」）：
     · 舊碼先試 window.open；手機瀏覽器／WebView 經常直接回傳 null（被攔）
     · 於是 fallback 去 location.href = url，整個聊天室被導走
     · 在部分內建瀏覽器或 Android WebView，這個導航會被當成外部跳轉，
       結果彈回個人主頁；再按一次又是一樣，看起來就是「一直跳轉」
   現在工具直接蓋在聊天室上面，關掉就回到原本的位置，全程沒有導航。 */
let toolFrameEl=null;
function closeToolFrame(){
  if(!toolFrameEl) return;
  try{ toolFrameEl.remove(); }catch(e){}
  toolFrameEl=null;
  document.body.style.removeProperty('overflow');
}
function openToolFrame(url,name){
  if(!url) return;
  closeToolFrame();
  const el=document.createElement('div');
  el.className='tool-frame';
  el.id='toolFrame';
  el.innerHTML='<div class="tf-bar">'
    +'<button class="tf-back" type="button" aria-label="返回"><svg class="ico"><use href="#i-back"/></svg></button>'
    +'<div class="tf-title">'+escapeHtml(name||'小工具')+'</div>'
    +'<button class="tf-open" type="button">新視窗</button>'
    +'</div>'
    +'<div class="tf-body"><div class="tf-load">正在載入工具…</div>'
    +'<iframe title="'+escAttr(name||'小工具')+'" src="'+escAttr(url)+'" '
    +'allow="geolocation; fullscreen; clipboard-write" referrerpolicy="same-origin"></iframe></div>';
  document.body.appendChild(el);
  document.body.style.setProperty('overflow','hidden');
  toolFrameEl=el;
  const ifr=el.querySelector('iframe');
  el.querySelector('.tf-back').addEventListener('click',closeToolFrame);
  el.querySelector('.tf-open').addEventListener('click',function(){
    /* 桌面想開另一個視窗就看這顆；被攔都無所謂，因為工具本身已經開著 */
    try{ window.open(url,'_blank'); }catch(e){}
  });
  el.querySelector('.tf-load').textContent='正在載入 '+String(name||'工具')+'…';
  try{
    ifr.addEventListener('load',function(){ el.classList.add('ready'); });
    /* 保險：4 秒後無論如何收埋「正在載入」，唔好一直卡住 */
    setTimeout(function(){ el.classList.add('ready'); },4000);
  }catch(e){}
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeToolFrame(); });
document.addEventListener('click', function(e){
  const a = e.target && e.target.closest ? e.target.closest('[data-tool-link]') : null;
  if(!a) return;
  e.preventDefault();
  const url = a.getAttribute('href');
  if(!url) return;
  const tEl=a.querySelector('.tool-t');
  openToolFrame(url, tEl?tEl.textContent.trim():'小工具');
});

/* ═══ v1.38 全班共享地圖 ═════════════════════════════════════════════
   只顯示「已同意共享」的人：
     · 進入時先問定位權限；拒絕就即刻退回小工具，一粒資料都不會留
     · 每 10 秒寫一次 liveLoc/{帳號}；同時掛 onDisconnect，
       連線一斷（關頁、斷網、當機）伺服器就自動刪除，不會留殘影
     · 分享模式兩種：
         最新位置 ── 只寫當前位置
         歷史軌跡 ── 另外每 10 秒 push 一個點去 liveTrail/{帳號}，
                     其他人看到的是一條連起來的線；離開時整條刪除
     · 標記顏色直接用 users 入面那個人自己的顏色
   全程只存「當下」，不寫 messages、不寫 logs，任何人都不能回看。 */
const LIVE_TICK=10000;      /* 寫入間隔：10 秒 */
const LIVE_STALE=120000;    /* 超過 2 分鐘沒心跳 = 已離線，順手清走 */
let liveState=null, liveWatch=null, liveTimer=null;
let liveUnsubA=null, liveUnsubB=null;
let liveMe=null, liveMode='live', liveUsers={}, liveTrails={};

/* ---- 畫面 ---- */
function liveSchedule(){
  const s=liveState;
  if(!s||s.raf)return;
  s.raf=requestAnimationFrame(liveRender);
}
function liveDrawTiles(){
  const s=liveState;
  if(!s||!s.w||!s.ctx)return null;
  const ctx=s.ctx,w=s.w,h=s.h,z=s.z,sc=s.sc||1,ts=TM_TILE*sc;
  ctx.setTransform(s.dpr,0,0,s.dpr,0,0);
  ctx.fillStyle='#dfe6ec';
  ctx.fillRect(0,0,w,h);
  const ox=tmLon2x(s.lng,z)*sc-w/2, oy=tmLat2y(s.lat,z)*sc-h/2, n=Math.pow(2,z);
  for(let tx=Math.floor(ox/ts);tx<=Math.floor((ox+w)/ts);tx++){
    if(tx<0||tx>=n)continue;
    for(let ty=Math.floor(oy/ts);ty<=Math.floor((oy+h)/ts);ty++){
      if(ty<0||ty>=n)continue;
      const img=locTileImg(z,tx,ty);
      const X=tx*ts-ox, Y=ty*ts-oy;
      if(img.complete&&img.naturalWidth) ctx.drawImage(img,X,Y,ts,ts);
      else if(!img.__lw){ img.__lw=1; img.addEventListener('load',liveSchedule); }
    }
  }
  return { ox:ox, oy:oy, sc:sc };
}
function liveRender(){
  const s=liveState;
  if(!s)return;
  s.raf=0;
  const o=liveDrawTiles();
  if(!o)return;
  const ctx=s.ctx, z=s.z;
  /* 軌跡：先畫白色粗底，再畫彩色細線，淺色地圖上都看得清 */
  Object.keys(liveTrails).forEach(function(u){
    const info=liveUsers[u];
    const tr=liveTrails[u];
    if(!tr||!info||info.mode!=='trail')return;
    const pts=Object.keys(tr).map(function(k){ return tr[k]; })
      .filter(function(p){ return p&&isFinite(p.lat)&&isFinite(p.lng); })
      .sort(function(a,b){ return (a.t||0)-(b.t||0); });
    if(pts.length<2)return;
    const col=safeColor(info.color,'#3b82f6');
    const path=new Path2D();
    pts.forEach(function(p,i){
      const x=tmLon2x(Number(p.lng),z)*o.sc-o.ox, y=tmLat2y(Number(p.lat),z)*o.sc-o.oy;
      if(i===0)path.moveTo(x,y); else path.lineTo(x,y);
    });
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.strokeStyle='rgba(255,255,255,.85)';
    ctx.lineWidth=7;
    ctx.stroke(path);
    ctx.strokeStyle=col;
    ctx.lineWidth=3.5;
    ctx.stroke(path);
  });
  livePlacePins(o.ox,o.oy,o.sc);
}
function livePlacePins(ox,oy,sc){
  const s=liveState;
  if(!s||!s.pins)return;
  const z=s.z;
  sc=sc||1;
  const seen={};
  Object.keys(liveUsers).forEach(function(u){
    const v=liveUsers[u]||{};
    const la=Number(v.lat), ln=Number(v.lng);
    if(!isFinite(la)||!isFinite(ln))return;
    seen[u]=1;
    let el=s.pinEls[u];
    if(!el){
      el=document.createElement('div');
      el.className='lmk';
      el.innerHTML='<span class="lmk-dot"></span><span class="lmk-nm"></span>';
      s.pins.appendChild(el);
      s.pinEls[u]=el;
    }
    const x=tmLon2x(ln,z)*sc-ox, y=tmLat2y(la,z)*sc-oy;
    if(x<-90||y<-90||x>s.w+90||y>s.h+90){ el.style.display='none'; return; }
    el.style.display='';
    el.style.transform='translate('+Math.round(x)+'px,'+Math.round(y)+'px)';
    el.style.setProperty('--c',safeColor(v.color,'#3b82f6'));
    const isMe=!!(me&&u===me.username);
    el.classList.toggle('is-me',isMe);
    const nm=el.querySelector('.lmk-nm');
    const txt=isMe?'你':String(v.name||u);
    if(nm.textContent!==txt)nm.textContent=txt;
  });
  Object.keys(s.pinEls).forEach(function(u){
    if(!seen[u]){
      if(s.pinEls[u].parentNode)s.pinEls[u].parentNode.removeChild(s.pinEls[u]);
      delete s.pinEls[u];
    }
  });
  liveUpdateCount();
}
function liveUpdateCount(){
  const el=document.getElementById('liveCount');
  if(!el)return;
  const n=Object.keys(liveUsers).length;
  el.textContent = n?(n+' 人在線'):'等待定位';
}
function liveResize(){
  const s=liveState;
  if(!s||!s.cv)return;
  const host=s.cv.parentElement;
  /* 同 locResize：用 clientWidth，避免進場 scale 影響量出嚟嘅尺寸 */
  const dpr=Math.min(2,window.devicePixelRatio||1);
  s.w=Math.max(1,host.clientWidth);
  s.h=Math.max(1,host.clientHeight);
  s.dpr=dpr;
  s.cv.width=Math.round(s.w*dpr);
  s.cv.height=Math.round(s.h*dpr);
  s.cv.style.width=s.w+'px';
  s.cv.style.height=s.h+'px';
  liveRender();
}
/* 螢幕座標 ↔ 經緯度（共享地圖） */
function liveScreenToGeo(s,x,y){
  const sc=s.sc||1;
  const ox=tmLon2x(s.lng,s.z)*sc-s.w/2, oy=tmLat2y(s.lat,s.z)*sc-s.h/2;
  return [ tmX2lon((ox+x)/sc,s.z), tmY2lat((oy+y)/sc,s.z) ];
}
function liveAnchorTo(z,sc,geo,mx,my){
  const s=liveState;
  if(!s)return;
  s.z=Math.max(3,Math.min(18,z));
  s.sc=Math.max(0.5,Math.min(1.9999,sc));
  const wx=tmLon2x(geo[0],s.z)*s.sc, wy=tmLat2y(geo[1],s.z)*s.sc;
  s.lng=tmX2lon((wx-mx+s.w/2)/s.sc,s.z);
  s.lat=tmY2lat((wy-my+s.h/2)/s.sc,s.z);
  liveRender();
}
/* 兩指：張開放大、捏合縮細，手指中點當縮放中心 */
function livePinchStart(){
  const s=liveState;
  if(!s)return;
  const ids=Object.keys(s.ptrs);
  if(ids.length<2){ s.pinch=null; return; }
  const a=s.ptrs[ids[0]], b=s.ptrs[ids[1]];
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  s.pinch={ d:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),
            sc:s.sc||1, z:s.z, geo:liveScreenToGeo(s,mx,my) };
}
function livePinchMove(){
  const s=liveState;
  if(!s||!s.pinch)return;
  const ids=Object.keys(s.ptrs);
  if(ids.length<2)return;
  const a=s.ptrs[ids[0]], b=s.ptrs[ids[1]];
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  const d=Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));
  let sc=s.pinch.sc*(d/s.pinch.d), z=s.pinch.z;
  while(sc>=2&&z<18){ z++; sc/=2; }
  while(sc<0.5&&z>3){ z--; sc*=2; }
  liveAnchorTo(z,sc,s.pinch.geo,mx,my);
}

/* ---- 分享 ---- */
function livePush(){
  if(!me||!liveMe)return;
  const la=liveMe.lat, ln=liveMe.lng, t=Date.now();
  const payload={
    lat:la, lng:ln, at:t, mode:liveMode,
    color:safeColor(me.color,'#3b82f6'),
    name:me.displayName||me.username,
    cls:me.cls||''
  };
  try{ set(ref(db,'liveLoc/'+me.username),payload); }catch(e){}
  if(liveMode==='trail'){
    try{ set(push(ref(db,'liveTrail/'+me.username)),{lat:la,lng:ln,t:t}); }catch(e){}
  }
}
function liveSetMode(m){
  if(!liveState||!me)return;
  m = (m==='trail')?'trail':'live';
  if(m===liveMode)return;
  liveMode=m;
  const list=document.querySelectorAll('#liveMap [data-action="liveMode"]');
  for(let i=0;i<list.length;i++) list[i].classList.toggle('on',list[i].dataset.arg===m);
  /* 切換就重新開始：舊軌跡整條刪掉，由現在這一刻重新畫 */
  try{ remove(ref(db,'liveTrail/'+me.username)); }catch(e){}
  livePush();
}
function liveStartShare(){
  if(!navigator.geolocation){ liveDeny('這個瀏覽器不支援定位'); return; }
  try{
    onDisconnect(ref(db,'liveLoc/'+me.username)).remove();
    onDisconnect(ref(db,'liveTrail/'+me.username)).remove();
  }catch(e){}
  liveWatch=navigator.geolocation.watchPosition(function(pos){
    liveMe={ lat:pos.coords.latitude, lng:pos.coords.longitude };
    const s=liveState;
    /* 第一次定位：把地圖移到自己身上 */
    if(s&&!s.centered){
      s.centered=1;
      s.lat=liveMe.lat;
      s.lng=liveMe.lng;
      s.z=15;
    }
    /* 心跳一定要在第一次就開 —— 以前這裡 return 得太早，
       要等第二次定位回呼才開始寫，結果第一個位置根本沒送出去。 */
    if(!liveTimer){
      livePush();
      liveTimer=setInterval(livePush,LIVE_TICK);
    }
    liveSchedule();
  },function(err){
    /* 1 = 使用者拒絕、2 = 取不到、3 = 超時 */
    if(err&&err.code===1) liveDeny('未授予定位權限');
    else if(!liveMe) liveDeny('暫時取不到你的位置');
  },{ enableHighAccuracy:true, maximumAge:4000, timeout:15000 });
}
function liveDeny(msg){
  const s=liveState;
  if(!s||!s.stage)return;
  if(liveWatch!=null){ try{ navigator.geolocation.clearWatch(liveWatch); }catch(e){} liveWatch=null; }
  if(liveTimer){ clearInterval(liveTimer); liveTimer=null; }
  s.stage.innerHTML='<div class="live-deny">'
    +'<div class="live-deny-ico"><svg class="ico"><use href="#i-alert"/></svg></div>'
    +'<div class="live-deny-t">'+escapeHtml(msg)+'</div>'
    +'<div class="live-deny-s">共享地圖一定要知道你在哪裡才畫得出標記。'
    +'既然未取得權限，就直接幫你返回小工具。</div></div>';
  /* 用戶要求：不同意共享就直接回到小工具介面 */
  setTimeout(function(){ closeLiveMap(); },2200);
}
function liveSubscribe(){
  liveUnsubA=onValue(ref(db,'liveLoc'),function(snap){
    const val=snap.val()||{};
    const now=Date.now();
    const out={};
    Object.keys(val).forEach(function(u){
      const v=val[u]||{};
      const at=Number(v.at)||0;
      if(now-at>LIVE_STALE){
        /* 對方已經斷線（onDisconnect 正常會處理，這裡是雙重保險） */
        if(!me||u!==me.username){
          try{ remove(ref(db,'liveLoc/'+u)); remove(ref(db,'liveTrail/'+u)); }catch(e){}
        }
        return;
      }
      out[u]=v;
    });
    liveUsers=out;
    liveSchedule();
  });
  liveUnsubB=onValue(ref(db,'liveTrail'),function(snap){
    liveTrails=snap.val()||{};
    liveSchedule();
  });
}

/* ---- 開 / 關 ---- */
function openLiveMap(){
  if(!me){ showNotif('請先登入'); return; }
  const old=document.getElementById('liveMap');
  if(old)old.remove();
  const div=document.createElement('div');
  div.id='liveMap';
  div.className='loc-full anim-in-page';
  div.innerHTML='<div class="lf-head">'
    +'<button class="lf-back" data-action="closeLiveMap"><svg class="ico"><use href="#i-back"/></svg></button>'
    +'<div class="live-title">全班共享地圖</div>'
    +'<div class="live-count" id="liveCount">等待定位</div>'
    +'</div>'
    +'<div class="live-bar"><span class="live-bar-lb">我的分享</span>'
    +'<div class="lvm-group">'
    +'<button class="lvm on" data-action="liveMode" data-arg="live">最新位置</button>'
    +'<button class="lvm" data-action="liveMode" data-arg="trail">歷史軌跡</button>'
    +'</div></div>'
    +'<div class="lf-stage">'
    +'<canvas class="lf-canvas"></canvas>'
    +'<div class="live-pins"></div>'
    +'<div class="live-tip">只會顯示已同意共享的同學</div>'
    +'<div class="lf-attr">\u00a9 OpenStreetMap \u8ca2\u737b\u8005</div>'
    +'</div>';
  document.body.appendChild(div);
  const cv=div.querySelector('.lf-canvas');
  liveMode='live';
  liveUsers={}; liveTrails={}; liveMe=null;
  liveState={ lat:22.3350, lng:114.1700, z:12, sc:1, cv:cv, ctx:cv.getContext('2d'),
              w:0, h:0, dpr:1, drag:null, ptrs:{}, pinch:null, raf:0, centered:0,
              stage:div.querySelector('.lf-stage'),
              pins:div.querySelector('.live-pins'), pinEls:{} };
  cv.addEventListener('pointerdown',function(e){
    const s=liveState; if(!s)return;
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    s.ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    const ids=Object.keys(s.ptrs);
    if(ids.length===1){ s.drag={x:e.clientX,y:e.clientY}; s.pinch=null; }
    else if(ids.length===2){ s.drag=null; livePinchStart(); }
  });
  cv.addEventListener('pointermove',function(e){
    const s=liveState;
    if(!s)return;
    const p=s.ptrs[e.pointerId];
    if(!p)return;
    p.x=e.clientX; p.y=e.clientY;
    if(Object.keys(s.ptrs).length>=2){
      if(!s.pinch)livePinchStart();
      livePinchMove();
      return;
    }
    if(!s.drag)return;
    const dx=e.clientX-s.drag.x, dy=e.clientY-s.drag.y;
    if(!dx&&!dy)return;
    s.drag.x=e.clientX; s.drag.y=e.clientY;
    const sc=s.sc||1;
    s.lng=tmX2lon(tmLon2x(s.lng,s.z)-dx/sc,s.z);
    s.lat=Math.max(-85,Math.min(85,tmY2lat(tmLat2y(s.lat,s.z)-dy/sc,s.z)));
    liveSchedule();
  });
  const relDrag=function(e){
    const s=liveState;
    if(!s)return;
    delete s.ptrs[e.pointerId];
    const ids=Object.keys(s.ptrs);
    if(ids.length<2)s.pinch=null;
    if(ids.length===1)s.drag={x:s.ptrs[ids[0]].x,y:s.ptrs[ids[0]].y};
    else if(!ids.length)s.drag=null;
  };
  cv.addEventListener('pointerup',relDrag);
  cv.addEventListener('pointercancel',relDrag);
  cv.addEventListener('dblclick',function(e){
    const s=liveState; if(!s||s.z>=18)return;
    const r=cv.getBoundingClientRect();
    const geo=liveScreenToGeo(s,e.clientX-r.left,e.clientY-r.top);
    liveAnchorTo(s.z+1,s.sc,geo,e.clientX-r.left,e.clientY-r.top);
  });
  window.addEventListener('resize',liveResize);
  liveResize();
  liveSubscribe();
  liveStartShare();
}
function closeLiveMap(){
  const el=document.getElementById('liveMap');
  if(liveWatch!=null){ try{ navigator.geolocation.clearWatch(liveWatch); }catch(e){} liveWatch=null; }
  if(liveTimer){ clearInterval(liveTimer); liveTimer=null; }
  if(liveUnsubA){ try{ liveUnsubA(); }catch(e){} liveUnsubA=null; }
  if(liveUnsubB){ try{ liveUnsubB(); }catch(e){} liveUnsubB=null; }
  window.removeEventListener('resize',liveResize);
  liveState=null; liveMe=null; liveUsers={}; liveTrails={};
  if(el)animOut(el,'anim-out-page',260);
  /* 離開就即刻收掉自己的位置與軌跡 —— 不想留任何殘影 */
  if(me){
    try{
      remove(ref(db,'liveLoc/'+me.username));
      remove(ref(db,'liveTrail/'+me.username));
    }catch(e){}
  }
}

function darkenColor(hex,amt){ const h=String(hex).replace('#','');if(h.length!==6)return hex;let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);r=Math.max(0,r-amt);g=Math.max(0,g-amt);b=Math.max(0,b-amt);return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }

/* ===== 管理員後台 ===== */
/* ═══ v1.16 數據用量（管理員後台） ═══
   為什麼要這個：
   Firebase 免費方案是「1 GB 儲存、每月 10 GB 下載」。儲存幾乎不可能滿
   （整班資料才 0.7 MB），真正會爆的是下載 —— 每次有人打開聊天室，就會把
   最近 300 則訊息整包抓下來；只要裡面有幾張圖片，一次開頁就是幾百 KB。
   144 個人每天開幾次，一個月就可能逼近 10 GB。額度一到 Firebase 會限制讀取，
   網站等於故障，而且只有 Firebase Console 看得到。
   這裡把同一組數字搬進後台，再加上「誰佔最多」跟「一鍵清掉大圖」。

   數字怎麼來的：
     * 儲存：逐一節點抓下來量 JSON 大小（整庫才 0.7 MB，掃一次很便宜）
     * 每次開頁下載：最近 300 則訊息的實際大小 + 全班帳號清單
     * 每月下載：上面那個數字 × 本月實際開頁次數（meta/stats/monthly）
   這是估算值。真正的帳單數字只有 Firebase Console 有，但趨勢跟「誰造成的」
   在這裡就看得出來。 */
const USAGE_NODES=['messages','logs','notices','users','meta','aiMemory','aiPrivateChat','requests','systemNotices','groupMessages','feedbacks','noticeReads','aiDailySummary','groups','thanks','deviceInfo','aiMode','trails','aiChatMode','presence','devices','pendingNotices','loginTokens'];
const QUOTA_STORE_BYTES=1024*1048576;      // 免費方案：1 GB 儲存
const QUOTA_DOWN_BYTES=10*1024*1048576;    // 免費方案：每月 10 GB 下載
const MSG_WINDOW=300;                      // 跟 subscribeMessages 的 limitToLast 保持一致

function bytesOf(v){ try{ return JSON.stringify(v==null?null:v).length; }catch(e){ return 0; } }
function fmtBytes(b){
  b=Number(b)||0;
  if(b<1024)return b+' B';
  if(b<1048576)return (b/1024).toFixed(1)+' KB';
  if(b<1073741824)return (b/1048576).toFixed(2)+' MB';
  return (b/1073741824).toFixed(2)+' GB';
}
function usageColor(pct){ return pct>=90?'#f87171':(pct>=70?'#fbbf24':'#4ade80'); }
function usageBar(pct){
  const p=Math.max(0,Math.min(100,Number(pct)||0));
  return `<div style="height:9px;border-radius:var(--r-1);background:var(--bg-input);overflow:hidden;margin:7px 0 3px"><div style="height:100%;width:${p.toFixed(2)}%;border-radius:var(--r-1);background:${usageColor(p)}"></div></div>`;
}

    <div style="font-size:24px;font-weight:800;color:var(--text-main);letter-spacing:-.3pt">${big}</div>
    <div style="font-size:11.5px;color:var(--text-muted);margin-top:2px">${sub}</div>
    ${usageBar(pct)}
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted)"><span>${note||''}</span><span style="color:${usageColor(pct)};font-weight:700">${(Number(pct)||0).toFixed(2)}%</span></div>
  </div>`;
}

/* 每次成功進入聊天室記一筆，用來估算每月下載量。
   用 transaction 而不是「讀-加一-寫回」，否則多人同時開頁會漏算。 */
async function countPageLoad(){

    const ym=new Date().toISOString().slice(0,7);
    await runTransaction(ref(db,'meta/stats/monthly/'+ym),c=>(Number(c)||0)+1);

/* 逐一節點抓下來量大小。整庫不到 1 MB，掃一次零點幾秒。 */
async function scanUsage(){
  const sizes={}; const failed=[]; let total=0; let msgsObj=null;
  for(const node of USAGE_NODES){
    try{
      const snap=await get(ref(db,node));
      const v=snap.exists()?snap.val():null;
      const b=bytesOf(v);
      sizes[node]={bytes:b,count:(v&&typeof v==='object')?Object.keys(v).length:(v==null?0:1)};
      total+=b;
      if(node==='messages')msgsObj=(v&&typeof v==='object')?v:{};
    }catch(e){ failed.push(node); sizes[node]={bytes:0,count:0}; }
  }
  return {sizes,failed,total,msgs:msgsObj||{}};
}

function usageSummary(scan,loads){
  const {sizes,msgs,total}=scan;
  const byType={},byUser={},media=[];
  for(const k of Object.keys(msgs)){
    const m=msgs[k]||{},b=bytesOf(m),t=m.type||'text',u=m.username||'?';
    (byType[t]=byType[t]||{n:0,b:0}); byType[t].n++; byType[t].b+=b;
    (byUser[u]=byUser[u]||{n:0,b:0,media:0}); byUser[u].n++; byUser[u].b+=b;
    if(t==='image'||t==='file'||t==='voice'){ byUser[u].media+=b; media.push({k,m,b,t}); }
  }
  media.sort((a,b)=>b.b-a.b);
  const sorted=Object.keys(msgs).map(k=>({k,m:msgs[k]||{}}))
    .sort((a,b)=>((a.m.createdAt)||0)-((b.m.createdAt)||0));
  const win=sorted.slice(-MSG_WINDOW);
  const winBytes=win.reduce((s,x)=>s+bytesOf(x.m),0);
  const usersBytes=(sizes.users&&sizes.users.bytes)||bytesOf(allUsers);
  return {
    byType,byUser,media,
    windowCount:win.length,windowBytes:winBytes,usersBytes,
    perOpen:winBytes+usersBytes,
    monthDown:(winBytes+usersBytes)*loads,
  };
}

async function renderUsageTab(body){
  if(!body)return;
  body.innerHTML='<div class="empty">正在統計資料用量…</div>';

  const scan=await scanUsage();
  const ym=new Date().toISOString().slice(0,7);
  let loads=0, history={};
  try{
    const snap=await get(child(ref(db),'meta/stats/monthly'));
    history=snap.exists()?(snap.val()||{}):{};
    loads=Number(history[ym])||0;
  }catch(e){}

  const u=usageSummary(scan,loads);
  const isSuper=me.role==='superadmin';
  const storePct=scan.total/QUOTA_STORE_BYTES*100;
  const downPct=u.monthDown/QUOTA_DOWN_BYTES*100;

  const nodeRows=Object.keys(scan.sizes)
    .map(k=>({k,...scan.sizes[k]}))
    .filter(x=>x.bytes>0)
    .sort((a,b)=>b.bytes-a.bytes);

  const userRows=Object.keys(u.byUser)
    .map(k=>({u:k,...u.byUser[k]}))
    .sort((a,b)=>b.b-a.b)
    .slice(0,12);

/* ═══ v1.18 Google 官方用量（真實數字） ═══
   上面那些是「本站估算」，只能用我們自己發出的請求去推。
   真正接近帳單的數字存在 Google Cloud Monitoring，要用服務帳號金鑰才拿得到，
   所以由本機的 `_gcp_usage.py` 抓下來寫進 meta/gcpUsage，這裡只負責顯示。
   金鑰永遠不會出現在網頁上（放前端等於公開）。 */
async function renderGcpUsageBlock(){
  let g=null;
  try{
    const snap=await get(child(ref(db),'meta/gcpUsage'));
    g=snap.exists()?snap.val():null;
  }catch(e){}

  if(!g||!g.fetchedAt){
    return `<div class="section-title">Google 官方數據</div>
    <div class="card" style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-2);padding:14px 16px;margin-bottom:12px">
      <div style="font-size:13px;color:var(--text-sub);line-height:1.85">
        這裡可以顯示 Firebase 主控台那一頁的<b style="color:var(--text-main)">真實</b>用量
        （真的下載了多少、實際儲存多少），但需要一組 Google 服務帳號金鑰才能讀。<br>
        金鑰只會放在你電腦本機，不會上傳、也不會出現在網站上。<br>
        <div style="margin-top:9px;font-size:12.5px;color:var(--text-muted)">
          設定步驟：在專案目錄執行 <code style="background:var(--bg-input);padding:2px 7px;border-radius:var(--r-0)">python _gcp_usage.py --guide</code>
        </div>
      </div>
    </div>`;
  }

  const when=new Date(g.fetchedAt).toLocaleString('zh-TW');
  const days=Number(g.days)||30;
  const down=Number(g.downloadBytes)||0;
  const store=Number(g.storageBytes)||0;
  const monthly=days>0?down/days*30:0;          // 換算成一個月，才能跟免費額度比
  const downPct=monthly/QUOTA_DOWN_BYTES*100;
  const storePct=store/QUOTA_STORE_BYTES*100;
  const daily=(g.downloadDaily||[]).slice(-14);
  const maxDaily=Math.max(1,...daily.map(d=>Number(d.bytes)||0));

  let bars='';
  if(daily.length){
    bars=`<div style="font-size:11.5px;color:var(--text-muted);margin-bottom:6px">每日下載（最近 ${daily.length} 天）</div>
    <div style="display:flex;align-items:flex-end;gap:3px;height:56px;margin-bottom:4px">`;
    for(const d of daily){
      const h=Math.max(2,(Number(d.bytes)||0)/maxDaily*100);
      bars+=`<div title="${escapeHtml(d.date)}　${fmtBytes(d.bytes)}"
        style="flex:1;min-width:3px;height:${h}%;border-radius:var(--r-0) var(--r-0) 0 0;background:linear-gradient(180deg,#22d3ee,#3b82f6)"></div>`;
    }
    bars+=`</div><div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-muted)">
      <span>${escapeHtml(daily[0].date.slice(5))}</span><span>${escapeHtml(daily[daily.length-1].date.slice(5))}</span></div>`;
  }

  return `<div class="section-title">Google 官方數據（真實，非估算）</div>
  <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:10px">
    取自 Google Cloud Monitoring；最後更新 ${escapeHtml(when)}（近 ${days} 天）
  </div>
  ${usageCard('下載量（換算成一個月）',
     `${fmtBytes(monthly)} <span style="font-size:14px;color:var(--text-muted);font-weight:600">/ 10 GB</span>`,
     `近 ${days} 天實際 ${fmtBytes(down)}　｜　這是最接近帳單的數字`,
     downPct,
     '免費方案每月 10 GB')}
  ${usageCard('目前儲存',
     `${fmtBytes(store)} <span style="font-size:14px;color:var(--text-muted);font-weight:600">/ 1 GB</span>`,
     '整個資料庫實際佔用的空間',
     storePct,
     '免費方案 1 GB')}
  <div class="card" style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-2);padding:13px 16px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-sub)">
      <span>同時連線數（尖峰）</span><b style="color:var(--text-main)">${Number(g.peakConnections)||0}</b></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-sub);margin-top:7px">
      <span>資料庫負載（尖峰）</span><b style="color:var(--text-main)">${((Number(g.peakLoad)||0)*100).toFixed(2)}%</b></div>
    <div style="font-size:11.5px;color:var(--text-muted);margin-top:8px">負載長期接近 100% 就會開始變慢</div>
  </div>
  ${bars}
  <div style="height:10px"></div>`;
}
