<html lang="zh-Hant">

<meta http-equiv="Content-Security-Policy" content="default-src 'none';base-uri 'none';object-src 'none';form-action 'none';script-src 'self' 'sha256-VteYnSV663fU95GeBZo2jvcRuQ/G5w3hIFQvxLHJGFw=' https://www.gstatic.com https://*.firebasedatabase.app;style-src 'self' 'unsafe-inline';img-src 'self' data: blob: https://tile.openstreetmap.org https://staticmap.openstreetmap.de https://www.openstreetmap.org https://oscar114515.github.io;font-src 'self' data:;media-src 'self' data: blob:;connect-src 'self' https://*.firebasedatabase.app wss://*.firebasedatabase.app https://note3-prev-api.askdiandian.com https://nominatim.openstreetmap.org https://data.weather.gov.hk https://www.gstatic.com;frame-src 'self' intent: https://meet.jit.si;worker-src 'self' blob:">

<title>班級聊天室 v1.35</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
:root{
  --r-0:4px;--r-1:8px;--r-2:12px;--r-3:16px;--dur-1:120ms;--dur-2:200ms;--dur-3:280ms;--dur-4:480ms;--ease-out:cubic-bezier(.22,1,.36,1);--ease-inout:cubic-bezier(.4,0,.2,1);--gold:#fbbf24;--warn-tx:#fca5a5;--ok-tx:#4ade80;--danger:#f87171;--info:#38bdf8;--pink-tx:#f472b6;--purple-tx:#a78bfa;--orange-tx:#fdba74;--white-warm:#fff9ec;--bg-app:#0f172a;--bg-header:linear-gradient(90deg,#1e293b,#0f172a);--bg-card:#1e293b;--bg-input:rgba(15,23,42,.6);--text-main:#e2e8f0;--text-sub:#94a3b8;--text-muted:#64748b;--border:rgba(148,163,184,.15);--border-strong:rgba(148,163,184,.3);--primary:#3b82f6;--primary-2:#2563eb;--ai:#66ccff}
body.theme-light{--bg-app:#f0f2f5;--bg-header:linear-gradient(90deg,#ffffff,#f8fafc);--bg-card:#ffffff;--bg-input:#f0f2f5;--text-main:#1c1e21;--text-sub:#65676b;--text-muted:#8a8d91;--border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.15)}
body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg-app);color:var(--text-main);overflow:hidden;height:100vh;height:100dvh;transition:background var(--dur-3) ease,color var(--dur-3) ease}
.hidden{display:none!important}
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg-app);padding:20px;overflow-y:auto;height:100vh;height:100dvh}
#loginCard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-3);padding:32px 26px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
#loginCard h1{font-size:22px;text-align:center;margin-bottom:6px}
#loginCard .sub{font-size:13px;text-align:center;color:var(--text-sub);margin-bottom:20px}
.top-controls{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
.lang-select{padding:6px 10px;border-radius:var(--r-1);border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:12px;font-family:inherit;outline:none;cursor:pointer}
.field{margin-bottom:14px}
.field input{width:100%;padding:13px 15px;border-radius:var(--r-1);border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:15px;outline:none;font-family:inherit}
#loginBtn{width:100%;padding:13px;border:none;border-radius:var(--r-1);background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
#loginBtn:disabled{opacity:.6}
#loginError{color:var(--danger);font-size:13px;text-align:center;min-height:18px;margin-bottom:8px;white-space:pre-wrap}
#loginVersion{text-align:center;font-size:11px;color:var(--text-muted);margin-top:14px}
#feedbackToggle{background:transparent;border:none;color:var(--text-sub);font-size:12px;cursor:pointer;font-family:inherit;margin-top:10px;width:100%;text-align:center;padding:8px}
#feedbackToggle:hover{color:var(--text-main)}
#feedbackBox{margin-top:10px;padding:12px;background:var(--bg-input);border-radius:var(--r-1);border:1px solid var(--border)}
#feedbackBox input,#feedbackBox textarea{width:100%;padding:9px 11px;border-radius:var(--r-1);border:1px solid var(--border-strong);background:var(--bg-card);color:var(--text-main);font-size:13px;outline:none;font-family:inherit;margin-bottom:8px}
#feedbackBox textarea{min-height:70px;resize:vertical}
#feedbackBox .fb-btn{width:100%;padding:9px;border:none;border-radius:var(--r-1);background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
#chatScreen{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{background:var(--bg-header);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);flex-shrink:0;min-height:46px}
header .title{font-size:14px;font-weight:600;white-space:nowrap;flex-shrink:0}
header .right{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-sub);flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.ver{background:rgba(56,189,248,.15);color:var(--info);padding:3px 7px;border-radius:var(--r-1);font-size:10.5px;font-weight:600}
.hbtn{background:rgba(148,163,184,.15);color:var(--text-main);border:none;padding:6px 10px;border-radius:var(--r-1);font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;position:relative}
.hbtn:hover{background:rgba(148,163,184,.3)}
@media(max-width:520px){header{padding:6px 8px}header .title{font-size:13px}.hbtn{font-size:11px;padding:5px 8px}}
#noticeBar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(251,191,36,.12);border-bottom:1px solid rgba(251,191,36,.25);flex-shrink:0;font-size:13px;cursor:pointer}
body.theme-light #noticeBar{background:rgba(251,191,36,.15)}
#noticeBar .notice-icon{color:var(--gold);font-size:14px;flex-shrink:0;font-weight:700}
#noticeBar .notice-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#noticeBar .notice-text .label{color:var(--gold);font-weight:600;margin-right:6px}
#noticeBar .notice-add{background:#fbbf24;color:#1c1917;border:none;width:32px;height:32px;border-radius:var(--r-1);font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#noticeBar .notice-pin-count{background:rgba(251,191,36,.3);color:var(--gold);padding:2px 8px;border-radius:var(--r-1);font-size:11px;font-weight:600;flex-shrink:0}
#classStatus{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 12px;background:rgba(30,41,59,.5);border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-sub);flex-shrink:0}
body.theme-light #classStatus{background:rgba(255,255,255,.7)}
#classStatus .online{color:var(--ok-tx);font-weight:600}
#searchBar{display:flex;gap:8px;padding:8px 12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center}
#searchInput{flex:1;padding:8px 12px;border-radius:var(--r-3);border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:13px;outline:none;font-family:inherit}
#chatBox{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg-app);position:relative}
#chatBox::-webkit-scrollbar{width:6px}
#chatBox::-webkit-scrollbar-thumb{background:rgba(148,163,184,.3);border-radius:var(--r-0)}
#scrollToBottomBtn{position:absolute;right:18px;bottom:18px;width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:20;transition:opacity var(--dur-2),transform var(--dur-2);opacity:0;pointer-events:none;transform:translateY(8px)}
#scrollToBottomBtn.show{opacity:1;pointer-events:auto;transform:translateY(0)}
#scrollToBottomBtn:hover{transform:translateY(-2px)}
.msg{max-width:75%;display:flex;gap:10px;align-items:flex-start;position:relative}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;user-select:none;overflow:hidden;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.deleted img,.avatar.deleted{filter:grayscale(100%);opacity:.6}
.bubble-wrap{display:flex;flex-direction:column;gap:3px;position:relative;min-width:0}
.msg.me .bubble-wrap{align-items:flex-end}
.meta{font-size:11px;color:var(--text-muted);padding:0 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta .msgid{color:var(--text-muted);font-size:10px;font-family:monospace}
.meta .class-tag{background:rgba(56,189,248,.18);color:var(--info);padding:1px 5px;border-radius:var(--r-0);font-size:10px;font-weight:600}
.meta .enc-tag{background:rgba(220,38,38,.2);color:var(--warn-tx);padding:1px 6px;border-radius:var(--r-0);font-size:10px;font-weight:600}
.meta .ai-tag{background:rgba(102,204,255,.25);color:var(--ai);padding:1px 6px;border-radius:var(--r-0);font-size:10px;font-weight:700}
.bubble{padding:9px 13px;border-radius:var(--r-2);font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap;color:#fff;max-width:100%}
.msg.me .bubble{border-bottom-right-radius:4px}
.msg:not(.me) .bubble{border-bottom-left-radius:4px}
.bubble .mention{background:rgba(255,255,255,.25);padding:1px 5px;border-radius:var(--r-0);font-weight:600}
.bubble img.msg-img{max-width:220px;max-height:220px;border-radius:var(--r-1);display:block;cursor:pointer;margin-top:4px}
.bubble .file-msg{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.bubble .file-msg .fi{font-size:16px;font-weight:700}
.bubble .file-msg .fn{font-size:13px;word-break:break-all;flex:1}
.bubble .file-msg .fs{font-size:11px;opacity:.8}
.bubble .voice-msg{display:flex;align-items:center;gap:10px;padding:4px 0;cursor:pointer;min-width:120px}
.bubble .voice-msg .vi{font-size:14px;font-weight:700;display:flex;align-items:center}
.voice-msg .vi .ico{width:1.25em;height:1.25em}
.bubble .voice-msg .vt{font-size:13px}
.bubble .voice-msg .vp{flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.bubble .voice-msg .vp>div{height:100%;width:0;background:#fff;transition:width var(--dur-1)}
.bubble .voice-msg .vd{width:8px;height:8px;border-radius:50%;background:#f87171;flex-shrink:0}
.bubble .voice-msg.played .vd{display:none}
.bubble .loc-msg{cursor:pointer;max-width:240px}
.bubble .loc-msg .lm-map{width:220px;height:150px;border-radius:var(--r-1);overflow:hidden;background:#222;margin-bottom:6px}
.bubble .loc-msg .lm-map img{width:100%;height:100%;object-fit:cover}
.bubble .loc-msg .lm-label{font-size:12px;display:flex;align-items:center;gap:4px}
.bubble .ai-sponsor{display:block;margin-top:8px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.3);font-size:10.5px;opacity:.75;font-style:italic}
.msg-tools{display:flex;gap:4px;margin-top:2px;opacity:0;flex-wrap:wrap}
.msg:hover .msg-tools{opacity:1}
.msg-tools button{background:rgba(148,163,184,.15);color:var(--text-sub);border:none;padding:2px 7px;border-radius:var(--r-1);font-size:10.5px;cursor:pointer;font-family:inherit}
.msg-tools button:hover{background:rgba(148,163,184,.3);color:var(--text-main)}
.msg-tools button.danger:hover{background:rgba(220,38,38,.3);color:var(--warn-tx)}
/* ═══ v1.36 名冊姓名 + 訊息操作彈窗 ═══
   訊息上不再一直掛著編號、舉報、管理刪除（太亂、也容易被誤按）；
   改成「點一下那則訊息」才彈出來。 */
.meta .meta-realname{margin-left:6px;font-size:10.5px;font-weight:600;color:var(--text-sub);border:1px solid var(--border-strong);border-radius:var(--r-0);padding:0 4px}
.realname-card{background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--r-2);padding:10px 14px;margin:0 0 6px}
.realname-card .rn-row{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.realname-card .rn-row+.rn-row{border-top:1px solid var(--border)}
.realname-card .rn-label{flex:0 0 62px;font-size:12px;color:var(--text-sub)}
.realname-card .rn-val{flex:1;font-size:14px;font-weight:600;color:var(--text-main);word-break:break-word}
.msg[data-msgid]{cursor:pointer}
#msgMenu{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:200}
#msgMenu .mm-card{width:100%;max-width:520px;margin:0 auto;background:var(--bg-card);border-radius:var(--r-3) var(--r-3) 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.4,0,.2,1)}
#msgMenu .mm-head{font-size:13px;font-weight:700;color:var(--text-main);margin-bottom:8px}
#msgMenu .mm-id{font-size:11.5px;font-family:monospace;color:var(--text-sub);background:var(--bg-input);border:1px solid var(--border-strong);border-radius:var(--r-1);padding:8px 10px;margin-bottom:8px;word-break:break-all}
#msgMenu .mm-btn{display:block;width:100%;text-align:left;background:var(--bg-input);border:1px solid var(--border-strong);color:var(--text-main);border-radius:var(--r-2);padding:12px 14px;font-size:14.5px;font-family:inherit;cursor:pointer;margin-top:7px}
#msgMenu .mm-btn:hover{background:rgba(148,163,184,.18)}
#msgMenu .mm-btn.danger{color:var(--warn-tx);border-color:rgba(248,113,113,.4)}
#msgMenu .mm-btn.danger:hover{background:rgba(220,38,38,.18)}
#msgMenu .mm-btn.ghost{background:transparent;color:var(--text-sub)}
.msg-checking{font-size:10.5px;color:var(--gold);padding:2px 6px;font-style:italic}
#inputBar{padding:10px 12px 4px;background:var(--bg-card);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-shrink:0;position:relative;flex-wrap:wrap}
#micBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#micBtn.recording{background:#dc2626;color:#fff}
#msgInput{flex:1;padding:11px 14px;border-radius:var(--r-3);border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:14px;outline:none;font-family:inherit;min-width:0}
#plusBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:22px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#sendBtn{width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#aiRoundBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#aiRoundBtn.on{background:#66ccff;color:#0f172a}
#encToggle{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-sub);padding:4px 8px;border-radius:var(--r-1);border:1px solid var(--border-strong);background:var(--bg-input);cursor:pointer;user-select:none;flex-shrink:0}
#encToggle.active{background:rgba(220,38,38,.2);border-color:#dc2626;color:var(--warn-tx)}
#encToggle input{display:none}
#encToggle .dot-check{width:10px;height:10px;border-radius:50%;border:2px solid var(--border-strong)}
#encToggle.active .dot-check{background:#dc2626;border-color:#dc2626}
#bottomNav{display:flex;background:var(--bg-card);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
#bottomNav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;cursor:pointer;gap:2px;color:var(--text-sub);font-size:11px;border:none;background:none;font-family:inherit;position:relative}
#bottomNav .nav-item:hover{background:rgba(148,163,184,.08);color:var(--text-main)}
#bottomNav .nav-item .nav-icon{font-size:18px;line-height:1}
#bottomNav .nav-item .nav-badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;background:#ef4444;color:#fff;border-radius:var(--r-1);font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
#plusPanel{position:absolute;bottom:calc(100% + 8px);left:12px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--r-3);padding:14px;display:grid;grid-template-columns:repeat(3,72px);gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:50;animation:panelIn .22s cubic-bezier(.4,0,.2,1)}
@keyframes panelIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
#plusPanel .pi{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px;border-radius:var(--r-2)}
#plusPanel .pi:hover{background:rgba(56,189,248,.15)}
#plusPanel .pi .pic{width:44px;height:44px;border-radius:var(--r-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:rgba(56,189,248,.2);color:var(--info)}
.pic .ico{width:22px;height:22px}
#plusPanel .pi .pit{font-size:11px;color:var(--text-sub)}
/* ===== 小遊戲 ===== */
#gamesOverlay{position:fixed;inset:0;background:#0b0d14;z-index:200;animation:panelIn .22s cubic-bezier(.4,0,.2,1)}
#gamesOverlay iframe{width:100%;height:100%;border:0;display:block}
.game-invite{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.28);border-radius:var(--r-2);padding:10px 12px;cursor:pointer}
.game-invite .gi-title{font-size:14.5px;font-weight:700;margin-bottom:3px}
.game-invite .gi-sub{font-size:12px;opacity:.85;margin-bottom:9px}
.game-invite .gi-btn{display:inline-block;background:rgba(255,255,255,.9);color:#0b0d14;font-size:12.5px;font-weight:700;border-radius:var(--r-1);padding:5px 12px}
.game-invite.done{opacity:.55;cursor:default;border-style:dashed}
.game-invite.done .gi-sub{opacity:.9}
.gi-copy{display:block;margin-top:7px;background:transparent;border:1px solid rgba(255,255,255,.32);color:inherit;font-size:11.5px;border-radius:var(--r-1);padding:4px 10px;cursor:pointer;opacity:.9;font-family:inherit}
.gi-copy:active{transform:scale(.96)}
#mentionPopup{position:absolute;bottom:100%;left:12px;right:12px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--r-2);max-height:220px;overflow-y:auto;box-shadow:0 -8px 24px rgba(0,0,0,.5);margin-bottom:6px}
#mentionPopup .mention-item{padding:10px 14px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:10px}
#mentionPopup .mention-item:hover{background:rgba(56,189,248,.15)}
#mentionPopup .mention-item .mi-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden}
#mentionPopup .mention-item .mi-av img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;color:var(--text-muted);padding:40px 0;font-size:14px}
.fullPage{position:fixed;inset:0;background:var(--bg-app);z-index:100;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.fullPage .fp-header{padding:12px 16px;display:flex;align-items:center;gap:12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0}
.fullPage .fp-back{background:rgba(148,163,184,.15);color:var(--text-main);border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
.fullPage .fp-title{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fullPage .fp-body{flex:1;min-height:0;overflow-y:auto}
/* ═══ v1.12 進退場動畫 ═══
   安卓版每次離開畫面都有轉場，網頁版原本是「啪」一聲直接消失。
   這裡把所有會離開畫面的東西都補上動畫：頁面向右滑走、上一層從左邊推回來。 */
@keyframes pageOutRight{from{opacity:1;transform:none}to{opacity:.28;transform:translateX(62%) scale(.94)}}
@keyframes pageInRight{from{opacity:0;transform:translateX(34%) scale(.975)}to{opacity:1;transform:none}}
@keyframes pageInLeft{from{opacity:.45;transform:translateX(-24%) scale(.955)}to{opacity:1;transform:none}}
@keyframes ovOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.04)}}
@keyframes ovIn{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
@keyframes barIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
@keyframes barOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(22px) scale(.95)}}
@keyframes zoomOutImg{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.87)}}
@keyframes panelOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(8px) scale(.95)}}
@keyframes notifIn{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes notifOut{from{opacity:1;transform:translateX(-50%) translateY(0)}to{opacity:0;transform:translateX(-50%) translateY(-12px)}}
.anim-in-page{animation:pageInRight .34s cubic-bezier(.32,.72,0,1) both}
.anim-in-back{animation:pageInLeft .34s cubic-bezier(.32,.72,0,1) both}
.anim-in-modal{animation:ovIn .26s cubic-bezier(.32,.72,0,1) both}
.anim-in-bar{animation:barIn .26s cubic-bezier(.32,.72,0,1) both}
.anim-in-notif{animation:notifIn .24s cubic-bezier(.32,.72,0,1) both}
/* 退場一律加 !important，也一律排在進場之後：
   否則同一個元素同時掛著進場與退場 class 時，會由「樣式表順序」而不是「後加的 class」決定，
   進場動畫會蓋掉退場動畫（#plusPanel 這種 ID 選擇器更是直接壓過 class）。
   這些 class 只存在幾百毫秒，用完就移除，用 !important 沒有副作用。 */
.anim-out-page{animation:pageOutRight .3s cubic-bezier(.32,.72,0,1) forwards!important;will-change:transform,opacity;pointer-events:none!important}
.anim-out-overlay{animation:ovOut .2s ease forwards!important;pointer-events:none!important}
.anim-out-modal{animation:ovOut .24s cubic-bezier(.32,.72,0,1) forwards!important;pointer-events:none!important}
.anim-out-bar{animation:barOut .22s cubic-bezier(.32,.72,0,1) forwards!important;pointer-events:none!important}
.anim-out-zoom{animation:zoomOutImg .2s ease forwards!important;pointer-events:none!important}
.anim-out-panel{animation:panelOut .16s ease forwards!important;pointer-events:none!important}
.anim-out-notif{animation:notifOut .22s ease forwards!important;pointer-events:none!important}

  .anim-out-bar,.anim-in-bar,.anim-out-zoom,.anim-out-panel,.anim-in-notif,.anim-out-notif{animation-duration:.01ms!important}
}

.tatto-2{background:linear-gradient(#e6ac5c,#d75449);right:1.25em;top:2.188em;box-shadow:0 0 .438em #e6ad5c3d,0 0 .438em #d755494f;transition:top var(--dur-3) ease}
.bb8-toggle__star{position:absolute;width:.063em;height:.063em;background:#fff;border-radius:var(--radius);filter:drop-shadow(0 0 .063em #fff);color:#fff;top:100%;transition:top var(--dur-3) ease}
.bb8-toggle__star:nth-child(1){left:3.75em;box-shadow:1.25em .938em,-1.25em 2.5em,0 1.25em,1.875em .625em,-3.125em 1.875em,1.25em 2.813em;transition:top var(--dur-3) ease}
.bb8-toggle__star:nth-child(2){left:4.688em;box-shadow:.625em 0,0 .625em,-.625em -.625em,.625em .938em,-3.125em 1.25em,1.25em -1.563em;transition:top var(--dur-3) ease}
.bb8-toggle__star:nth-child(3){left:5.313em;box-shadow:-.625em -.625em,-2.188em 1.25em,-2.188em 0,-3.75em -.625em,-3.125em -.625em,-2.5em -.313em,.75em -.625em;transition:top var(--dur-3) ease}
.bb8-toggle__star:nth-child(4){left:1.875em;width:.125em;height:.125em;transition:top var(--dur-4) ease}
.bb8-toggle__star:nth-child(5){left:5em;width:.125em;height:.125em;transition:top var(--dur-4) ease}
.bb8-toggle__star:nth-child(6){left:2.5em;width:.125em;height:.125em;transition:top var(--dur-4) ease}
.bb8-toggle__star:nth-child(7){left:3.438em;width:.125em;height:.125em;transition:top var(--dur-4) ease}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8-toggle__star:nth-child(1){top:.625em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8-toggle__star:nth-child(2){top:1.875em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8-toggle__star:nth-child(3){top:1.25em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8-toggle__star:nth-child(4){top:3.438em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8-toggle__star:nth-child(5){top:3.438em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8-toggle__star:nth-child(6){top:.313em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8-toggle__star:nth-child(7){top:1.875em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8-toggle__cloud{right:-100%}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .gomrassen{top:.938em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .hermes{top:2.5em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .chenini{top:2.75em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container{background-position-y:0}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .tatto-1,.bb8-toggle__checkbox:checked + .bb8-toggle__container .tatto-2{top:100%}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8{left:calc(100% - var(--bb8-diameter) - var(--toggle-offset))}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8__shadow{left:calc(100% - var(--bb8-diameter) - var(--toggle-offset) + .938em);transform:skew(70deg)}

.poll-opt.selected .poll-circle,.poll-opt.selected .poll-square{background:#fff;border-color:#fff;color:#1c1e21}
.poll-opt .poll-text{position:relative;z-index:1;flex:1;font-size:13.5px;line-height:1.4;word-break:break-word}
.poll-opt .poll-pct{position:relative;z-index:1;font-size:12px;font-weight:700;opacity:.95;flex-shrink:0}
.poll-footer{font-size:11.5px;opacity:.85;display:flex;flex-direction:column;gap:3px}
.poll-end{color:var(--warn-tx);font-weight:600}
.poll-confirm{background:rgba(255,255,255,.9);color:#1c1e21;border:none;padding:7px 12px;border-radius:var(--r-1);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;align-self:flex-start}
body.theme-light .poll-opt{background:rgba(0,0,0,.06)}
body.theme-light .poll-opt:hover{background:rgba(0,0,0,.1)}
body.theme-light .poll-opt .poll-fill{background:rgba(59,130,246,.22)}
body.theme-light .poll-opt .poll-circle,body.theme-light .poll-opt .poll-square{border-color:rgba(0,0,0,.35);color:#1c1e21}
body.theme-light .poll-opt.selected .poll-circle,body.theme-light .poll-opt.selected .poll-square{background:#3b82f6;border-color:#3b82f6;color:#fff}
body.theme-light .poll-confirm{background:#3b82f6;color:#fff}
/* ===== 痕跡地圖（網頁版） ===== */
#trailMapScreen{position:fixed;inset:0;background:var(--bg-app);z-index:360;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
#trailMapScreen .tm-header{padding:12px 16px;display:flex;align-items:center;gap:12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0}
#trailMapScreen .tm-back{background:rgba(148,163,184,.15);color:var(--text-main);border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
#trailMapScreen .tm-title{font-size:16px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#trailMapScreen .tm-body{position:relative;flex:1;min-height:0;overflow:hidden;background:#0e1016;touch-action:none;cursor:grab}
#trailMapScreen .tm-body.dragging{cursor:grabbing}
#trailMapScreen canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#trailMapScreen .tm-actions{position:absolute;right:12px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:5}
#trailMapScreen .tm-btn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(24,27,35,.9);color:#e8ecf3;font-size:16px;line-height:1;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#trailMapScreen .tm-btn:active{transform:scale(.94)}
#trailMapScreen .tm-btn.on{background:#3b82f6;border-color:#3b82f6;color:#fff}
#trailMapScreen .tm-info{position:absolute;left:12px;bottom:16px;max-width:60%;padding:8px 12px;border-radius:var(--r-2);background:rgba(24,27,35,.9);color:var(--text-sub);font-size:12px;line-height:1.55;z-index:5;border:1px solid rgba(255,255,255,.1)}
#trailMapScreen .tm-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:30px;color:var(--text-sub);font-size:13.5px;z-index:6;pointer-events:none}
#trailMapScreen .tm-empty b{font-size:15px;color:#fff}

/* v1.35 圖標系統：內嵌 SVG，24×24、stroke 2、顏色跟著文字（來源風格 Reicon.dev／Lucide，MIT） */
.ico{width:1.15em;height:1.15em;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
.ico-lg{width:1.5em;height:1.5em;vertical-align:-.3em}
.wc-ico .ico{width:1.05em;height:1.05em;vertical-align:-.14em}
.nav-icon .ico{width:1.25em;height:1.25em;vertical-align:0}

/* v1.36 積分系統：預留欄位，只顯示 users/{u}/points（沒有加減方法，所有人都是 0） */
.score-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;
  font-size:12px;font-weight:600;color:var(--gold);background:rgba(226,176,74,.12);
  border:1px solid rgba(226,176,74,.3);vertical-align:middle}
.score-chip .ico{width:1.05em;height:1.05em}
.score-chip-fixed{position:fixed;right:12px;bottom:78px;z-index:60;display:none;
  background:rgba(15,23,42,.85);backdrop-filter:blur(6px)}
@media (max-width:600px){#scoreTop{display:none}.score-chip-fixed{display:inline-flex}}

/* v1.36 版本資訊簡化：一行摘要 + 更早的只留版本號 */
.version-item .vi-sum{font-size:13px;color:var(--text-sub);margin-top:2px}
.version-item.old{opacity:.55;padding:6px 0}
.version-item.old .vi-head{margin-bottom:0}

/* v1.36 視訊通話（Jitsi）：全頁 iframe + 通話紀錄樣式 */
.vcPage{display:flex;flex-direction:column;height:100%}
.vcBody{flex:1;display:flex;flex-direction:column;padding:0;min-height:0}
.vcFrame{flex:1;width:100%;border:0;background:#000;min-height:0}
.vcHint{display:flex;align-items:center;gap:6px;padding:9px 14px;font-size:12.5px;color:var(--text-sub);
  background:var(--bg-card);border-top:1px solid var(--border)}
.vcBadge{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ok-tx);
  background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.3);border-radius:999px;padding:2px 9px}
.vcDot{width:7px;height:7px;border-radius:50%;background:var(--ok-tx);animation:vcPulse 1.6s ease-in-out infinite}
@keyframes vcPulse{0%,100%{opacity:1}50%{opacity:.35}}
.callChip{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.callChip .ico{width:1.1em;height:1.1em}
</style>

/* ===== v1.10.4 前往新版本：先無參數重載，網址保持不變 ===== */
function goNewVersion(){
  const key='ver_reload_tried';
  if(sessionStorage.getItem(key)!==CURRENT_VERSION){
    // 第一次：直接重載。reload 會帶 max-age=0 重新向伺服器驗證，能拿到新版本，網址完全不變。
    sessionStorage.setItem(key,CURRENT_VERSION);
    location.reload();
    return;
  }
  // 第二次還是不行（遇到強快取），才加上一次性參數破快取
  sessionStorage.removeItem(key);
  const url=new URL(location.href);
  url.searchParams.set('_v',Date.now().toString());
  location.replace(url.toString());
}

/* ═══ v1.15 一次性登入權杖（?t=）═══
   ?u=帳號&p=密碼 方便是方便，但那條網址裡是「明文密碼」：
   它會留在瀏覽器歷史紀錄、「上一頁」、分頁標題，轉傳一次就整組外流。
   現在多一種 ?t=<權杖>：權杖存在資料庫，30 分鐘過期、只能用一次。
   點開就登入，登入完這條連結立刻作廢 —— 就算被截圖、被貼到群組，也是死連結。
   舊的 ?u=&p= 原封不動保留，你之前發出去的連結不會失效。 */
const LOGIN_TOKEN_TTL=30*60*1000;   // 30 分鐘
const TOKEN_NODE='loginTokens';
let urlLoginToken='';
try{ urlLoginToken=(new URL(location.href).searchParams.get('t')||'').trim(); }catch(e){}
function randomToken(){
  try{
    const a=new Uint8Array(18);crypto.getRandomValues(a);
    return Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').slice(0,24);
  }catch(e){
    let s='';for(let i=0;i<24;i++)s+='abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random()*36)];
    return s;
  }
}
async function createLoginToken(username,password){
  const token=randomToken();
  await set(ref(db,TOKEN_NODE+'/'+token),{u:username,p:password,exp:Date.now()+LOGIN_TOKEN_TTL,by:(me?me.username:'?'),at:Date.now()});
  return token;
}
async function consumeLoginToken(token){
  if(!token)return false;
  try{
    const snap=await get(child(ref(db),TOKEN_NODE+'/'+token));
    if(!snap.exists())return false;
    const t=snap.val()||{};
    if(!t.u||!t.p)return false;
    if(!t.exp||Date.now()>t.exp)return false;   // 過期
    if(t.usedAt)return false;                   // 已經被用掉，這條連結作廢
    await update(ref(db,TOKEN_NODE+'/'+token),{usedAt:Date.now()});
    try{await ensureAIUser();}catch(e){}
    await handleLogin(t.u,t.p);
    return true;
  }catch(e){return false;}
}
/* 把過期與用過的權杖清掉，免得一直堆在資料庫。失敗就算了，不影響登入。 */
async function sweepLoginTokens(){
  try{
    const snap=await get(ref(db,TOKEN_NODE));if(!snap.exists())return;
    const val=snap.val()||{};const now=Date.now();
    for(const k of Object.keys(val)){
      const t=val[k]||{};
      const dead=(t.exp&&now>t.exp)||(t.usedAt&&now-t.usedAt>10*60*1000);
      if(dead){try{await remove(ref(db,TOKEN_NODE+'/'+k));}catch(e){}}
    }
  }catch(e){}
}

/* ═══ v1.24 房間連結：每一間房間都有自己的網址 ═══
   形如 https://…/1e-chat.edu.hk/?room=<房間編號>
   打開之後照正常流程登入（或自動登入），登入完就自動進到那一間房間。 */
function gameRoomUrl(roomId){
  try{
    const u=new URL(location.href);
    let p=u.pathname||'/';
    if(/game\.html$/.test(p))p=p.replace(/game\.html$/,'');
    if(/index\.html$/.test(p))p=p.replace(/index\.html$/,'');
    if(!/\/$/.test(p))p+='/';
    return u.origin+p+'?room='+encodeURIComponent(roomId);
  }catch(e){ return location.origin+'/?room='+encodeURIComponent(roomId); }
}
function copyTextToClipboard(t){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(()=>showNotif('已複製連結')).catch(()=>showNotif('請長按手動複製：'+t));
      return;
    }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.removeAttribute('readonly');ta.focus();ta.select();
    document.execCommand('copy');ta.remove();showNotif('已複製連結');
  }catch(e){ showNotif('請長按手動複製：'+t); }
}
async function copyRoomLink(roomId){
  if(!roomId)return;
  copyTextToClipboard(gameRoomUrl(roomId));
}

/* ═══ v1.14 裝了 App 就直接跳過去 ═══   正規做法是安卓的 App Links：連結通過網域驗證（見根目錄的
   /.well-known/assetlinks.json）之後，系統在瀏覽器載入之前就把連結交給 App，
   連這一頁都不會出現 —— 跟 YouTube 完全一樣。

   下面這一段是補漏的：驗證還沒生效，或是使用者在微信／WhatsApp 這類
   內建瀏覽器點連結時（那些瀏覽器不理會 App Links），這裡再推一次。
   推不動就靜默收場，頁面留在網頁版，不會有任何提示或錯誤。 */
const APP_PKG='com.oscar114515.toolbox';
function tryOpenApp(){
  if(!/Android/i.test(navigator.userAgent))return;
  try{
    const target=location.href;
    // 去掉 # 片段：intent:// 用 #Intent; 當分隔符，網址裡帶著 # 會讓整串解析壞掉
    const bare=target.replace(/^https?:\/\//,'').split('#')[0];
    // fallback 故意不填：填了的話，沒裝 App 的瀏覽器會把同一頁再載入一次，
    // 然後又推一次，變成無限重載迴圈。
    const intent='intent://'+bare+
      '#Intent;scheme=https;package='+APP_PKG+';end';
    const f=document.createElement('iframe');
    f.style.cssText='display:none;width:0;height:0;border:0';
    f.src=intent;
    document.body.appendChild(f);
    setTimeout(()=>{try{f.remove();}catch(e){}},1500);
  }catch(e){}
}

/* v1.10.1 修復在線人數：presence 改存心跳時間戳，超過 30 秒視為離線（解舊版 true 幽靈） */
const PRESENCE_TIMEOUT=30000;

  const v=presence[username];
  return typeof v==='number'&&(Date.now()-v)<PRESENCE_TIMEOUT;
}
function onlineCount(){ let n=0;for(const u in presence){if(isOnline(u))n++;}return n; }

  if(heartbeatTimer){clearInterval(heartbeatTimer);heartbeatTimer=null;}

async function purgeStalePresence(){
  try{
    const snap=await get(ref(db,'presence'));if(!snap.exists())return;

  }catch(e){}
}

async function handleLogin(uArg,pArg){
  // uArg / pArg 是「網址登入」帶進來的；一般按登入鈕時不會傳，就讀輸入框
  const u=(uArg!==undefined?String(uArg):loginUsername.value).trim().toLowerCase(),
        p=(pArg!==undefined?String(pArg):loginPassword.value);
  loginError.textContent='';
  if(!u||!p){loginError.textContent='請輸入帳號與密碼';return;}
  loginBtn.disabled=true;loginBtn.textContent='登入中...';
  try{
    const snap=await get(child(ref(db),'users/'+u));
    if(!snap.exists()){loginError.textContent='帳號不存在';return;}
    const data=snap.val();
    if(data.disabled===true){loginError.textContent='此帳號已停用';return;}
    if(data.banned&&data.banned.type==='severe'){loginError.textContent='你已被封禁，無法登入。\n原因：'+(data.banned.reason||'（無原因）');return;}
    if(data.password!==p){loginError.textContent='密碼錯誤';return;}
    me={username:data.username,displayName:data.displayName||data.username,chiName:data.chiName||'',engName:data.engName||'',seat:data.seat,cls:data.class||'',color:data.color||'#3b82f6',role:data.role||'member',avatar:data.avatar||null,banned:data.banned||null};
    if(data.theme){theme=data.theme;localStorage.setItem('chat_theme',theme);applyTheme();}
    if(data.lang&&['zh-Hant','zh-Hans','en'].includes(data.lang)){lang=data.lang;localStorage.setItem('chat_lang',lang);applyLang();}
    try{await update(ref(db,'users/'+me.username),{hasLoggedIn:true,neverLoggedIn:null,lastLoginAt:Date.now()});}catch(e){}
    sessionStorage.setItem('chat_me',JSON.stringify(me));
    clearUrlCreds();   // 網址裡的 u、p、t 用完就清掉，不留在歷史紀錄
    sweepLoginTokens();   // 順手清掉過期／已用過的登入權杖
    try{await set(ref(db,'presence/'+me.username),Date.now());}catch(e){}
    try{await ensureAIUser();}catch(e){}
    try{await writeLog('login','登入系統');}catch(e){}
    enterChat();
  }catch(e){ console.error(e);loginError.textContent='登入失敗：'+(e.code||e.message); }
  finally{loginBtn.disabled=false;loginBtn.textContent='登入';}
}
async function handleLogout(){
  try{await remove(ref(db,'presence/'+me.username));}catch(e){}
  try{await writeLog('logout','登出系統');}catch(e){}
  stopHeartbeat();
  me=null;sessionStorage.removeItem('chat_me');
  try{ syncVersionText(); }catch(e){}
  try{[unsubMsg,unsubUsers,unsubPresence,unsubNotices,unsubAllNoticeReads,unsubPendingNotices,unsubRequests,unsubFeedbacks,unsubMyRejections,unsubSystemNotices,unsubThanks,unsubMeta,unsubAIModeMap,unsubMyGroups,unsubGroupMsgs,unsubAIPrivate].forEach(fn=>fn&&fn());}catch(e){}
  closePage();resetPageStack();chatScreen.classList.add('hidden');loginScreen.classList.remove('hidden');
  loginUsername.value='';loginPassword.value='';
}

}
async function openPinnedList(){ const pinned=notices.filter(n=>n.pinned&&!n.deleted);if(pinned.length===0)return;openNoticeFullscreen(pinned[0]._key,pinned); }
async function openNoticeFullscreen(key,customList){
  const list=customList||notices.filter(n=>!n.deleted);if(list.length===0)return;
  markNoticeReadForAll(list.map(n=>n._key));
  const isAdmin=me.role==='superadmin'||me.role==='admin';
  const cards=list.map(n=>{
    const content=n.html?n.html:escapeHtml(n.text||'').replace(/\n/g,'<br>');
    const imgs=n.images&&n.images.length?n.images.map(img=>`<img src="${img}" style="max-width:100%;border-radius:var(--r-1);margin-top:8px">`).join(''):'';
    return `<div class="car-card ${n._key===key?'active':''}" data-key="${n._key}"><h3>${n.pinned?'[置頂] ':''}公告</h3><div class="car-content">${content}${imgs}</div></div>`;
  }).join('');
  const current=list.find(n=>n._key===key)||list[0];
  const actions=isAdmin
    ?`<button class="btn-primary" data-action="noticeEdit" data-arg="${escAttr(current._key)}" style="margin:0">編輯</button><button class="btn-warn" data-action="noticePin" data-arg="${escAttr(current._key)}" style="margin:0">${current.pinned?'取消置頂':'置頂'}</button><button class="btn-ghost" data-action="noticeLock" data-arg="${escAttr(current._key)}" style="margin:0">${current.locked?'解鎖':'加鎖'}</button><button class="btn-danger" data-action="noticeDelete" data-arg="${escAttr(current._key)}" style="margin:0">刪除</button>`
    :`<button class="btn-ghost" data-action="closePage" style="margin:0">關閉</button>`;
  beginPage('noticeFull');
  pageRoot.innerHTML=`<div class="fullPage" id="noticeFullscreen"><div class="fp-header"><button class="fp-back" data-action="closePage"><svg class="ico"><use href="#i-back"/></svg></button><div class="fp-title">公告</div><div class="car-progress" id="nfProgress" style="padding:0;min-width:52px;text-align:right">1 / ${list.length}</div></div><div class="fp-body" style="display:flex;flex-direction:column"><div class="car-stage" id="nfStage">${cards}</div><div class="car-nav"><button data-action="noticeCarousel" data-arg="-1"><svg class="ico"><use href="#i-back"/></svg></button><button data-action="noticeCarousel" data-arg="1"><svg class="ico"><use href="#i-next"/></svg></button></div></div><div class="car-actions">${actions}</div></div>`;
  const stage=document.getElementById('nfStage');
  if(stage)stage.scrollTo({left:0,behavior:'auto'});
  const target=stage&&(stage.querySelector(`[data-key="${key}"]`)||stage.querySelector('.car-card'));
  if(target&&stage){ setTimeout(()=>{ stage.scrollTo({left:target.offsetLeft-(stage.clientWidth-target.offsetWidth)/2,behavior:'auto'}); refreshNoticeCarousel(); },30); }
}
/* 輪播的前後箭頭與進度都改成「文件層級」處理：
   這樣即使這一頁被還原回來（HTML 重新插回 DOM），按鈕依然有效。 */
function noticeCarouselStep(dir){
  const stage=document.getElementById('nfStage');if(!stage)return;
  const cs=Array.from(stage.querySelectorAll('.car-card'));if(cs.length===0)return;
  const center=stage.scrollLeft+stage.clientWidth/2;let cur=0,min=Infinity;
  cs.forEach((c,i)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-center);if(d<min){min=d;cur=i;}});
  let nx=cur+dir;if(nx<0)nx=cs.length-1;if(nx>=cs.length)nx=0;
  stage.scrollTo({left:cs[nx].offsetLeft-(stage.clientWidth-cs[nx].offsetWidth)/2,behavior:'smooth'});
}
function refreshNoticeCarousel(){
  const s=document.getElementById('nfStage');if(!s)return;
  const center=s.scrollLeft+s.clientWidth/2;
  let closest=0,minDist=Infinity;
  s.querySelectorAll('.car-card').forEach((c,i)=>{const cc=c.offsetLeft+c.offsetWidth/2;const d=Math.abs(cc-center);if(d<minDist){minDist=d;closest=i;}c.classList.toggle('active',d<c.offsetWidth/2);});
  const prog=document.getElementById('nfProgress');
  if(prog)prog.textContent=`${closest+1} / ${s.querySelectorAll('.car-card').length}`;
}
document.addEventListener('scroll',e=>{
  const stage=e.target;
  if(!stage||stage.id!=='nfStage')return;
  clearTimeout(window._nfT);
  window._nfT=setTimeout(refreshNoticeCarousel,120);
},true);

/* 產生訊息鍵（v1.19 改回 msg_NNNN 格式，但用原子遞增）。

   為什麼不是單純改回舊寫法：
   舊寫法是「讀編號 → 加一 → 寫回」三步，兩個人同時送出會讀到同一個號，
   寫進同一個鍵，後送的直接把先送的整則蓋掉（訊息無聲消失）。
   這裡只把「取號」換成 runTransaction，由 Firebase 保證原子性 ——
   同時送出也會拿到不同的號，鍵名格式則維持原本的 msg_NNNN。

   第二層保險：Android 端目前還是舊的讀-改-寫（要重新出 App 才改得到），
   所以萬一號真的被用走了，就補上毫秒當後綴。
   寧可鍵名長得不一樣，也絕對不覆蓋別人的訊息。 */
async function nextMsgId(){
  let seq=0;
  try{
    const res=await runTransaction(ref(db,'meta/msgCounter'),c=>(Number(c)||0)+1);
    seq=Number(res.snapshot.val())||0;
  }catch(e){}
  let id='msg_'+String(seq).padStart(4,'0');
  try{ if((await get(child(ref(db),'messages/'+id))).exists()) id=id+'_'+Date.now(); }catch(e){}
  return id;
}

/* 群聊的鍵格式跟主訊息不同：<群組key>_msg_<數字>，號碼記在 groups/{key}/msgCounter。
   同樣把取號改成原子操作。 */
async function nextGroupMsgId(gk){
  let n=0;
  try{
    const res=await runTransaction(ref(db,'groups/'+gk+'/msgCounter'),c=>(Number(c)||0)+1);
    n=Number(res.snapshot.val())||0;
  }catch(e){}
  let id=gk+'_msg_'+n;
  try{ if((await get(child(ref(db),'groupMessages/'+gk+'/'+id))).exists()) id=id+'_'+Date.now(); }catch(e){}
  return id;
}

async function sendMessage(){
  const text=msgInput.value.trim();if(!text||!me)return;
  if(me.banned&&me.banned.type==='light'){showNotif('你目前被限制發言');return;}
  sendBtn.disabled=true;
  const isEncrypted=encCheckbox.checked;
  const hasHtml=/<[a-zA-Z][\s\S]*?>/.test(text);
  try{
    /* v1.15：訊息鍵改用 push()。
       以前是「讀 meta/msgCounter → 加一 → 寫回去 → 拼成 msg_0001」四步，
       中間只要兩個人同一個瞬間送出，就會讀到同一個號碼、拼出同一個鍵，
       後送出的那則會直接把前一則蓋掉（訊息就這樣無聲消失）。
       push() 由 Firebase 產生唯一且依時間排序的鍵，天生不會撞。
       舊訊息（msg_0001…）完全不用動：讀取端是靠 createdAt 排序、靠 id 欄位找訊息，
       兩種鍵名可以並存，前面的聊天記錄一則都不會少。 */
    const msgId=await nextMsgId();
    const isAdmin=me.role==='superadmin'||me.role==='admin';
    await set(ref(db,'messages/'+msgId),{id:msgId,username:me.username,displayName:me.displayName,chiName:me.chiName||'',engName:me.engName||'',seat:me.seat,cls:me.cls||'',color:me.color,avatar:me.avatar,role:me.role,text,type:'text',encrypted:isEncrypted,hasHtml:hasHtml,htmlCheckStatus:(hasHtml&&!isAdmin)?'checking':'ok',createdAt:Date.now(),deleted:false});
    await writeLog('send','發送訊息：'+text.slice(0,50));
    msgInput.value='';encCheckbox.checked=false;encToggle.classList.remove('active');hideMention();
    scrollToBottom();
    if(hasHtml&&!isAdmin){
      checkHtmlMessage(msgId,text).catch(e=>console.error(e));
    }
    if(myAIOn){ handleAITrigger(text).catch(e=>console.error(e)); }
  }catch(e){showNotif('送出失敗');}
  finally{sendBtn.disabled=false;msgInput.focus();}
}
async function checkHtmlMessage(msgId,text){
  try{
    const sysPrompt='你是網站安全審查員。請判斷以下 HTML 是否含有攻擊性內容（例如：偷取資料、XSS、惡意重定向、釣魚、破壞頁面、卡死瀏覽器）。只回答 SAFE 或 DANGER，不要有其他文字。';
    const r1=await callAI([{role:'system',content:sysPrompt},{role:'user',content:text}]);
    if(!r1)return;
    const c1=(r1.content||'').trim().toUpperCase();
    if(c1.includes('DANGER')){
      await update(ref(db,'messages/'+msgId),{deleted:true,deletedAt:Date.now(),deletedBy:'AI_AUTO',htmlRejected:true});
      showNotif('檢測到可能有攻擊網站的 HTML，已拒絕發送');
      return;
    }
    const r2=await callAI([{role:'system',content:sysPrompt},{role:'user',content:text}]);
    if(!r2)return;
    const c2=(r2.content||'').trim().toUpperCase();
    if(c2.includes('DANGER')){
      await update(ref(db,'messages/'+msgId),{deleted:true,deletedAt:Date.now(),deletedBy:'AI_AUTO',htmlRejected:true});
      showNotif('檢測到可能有攻擊網站的 HTML，已拒絕發送');
      return;
    }
    await update(ref(db,'messages/'+msgId),{htmlCheckStatus:'ok'});
  }catch(e){ console.error('HTML check error',e); }
}

async function callAI(messages,retry=0){
  try{
    const res=await fetch(AI_API,{method:'POST',headers:{'Content-Type':'application/json','api-key':AI_KEY},body:JSON.stringify({model:AI_MODEL,messages,stream:false,max_tokens:1024,chat_template_kwargs:{enable_thinking:true}})});
    if(res.status===429&&retry<3){await new Promise(r=>setTimeout(r,2000));return callAI(messages,retry+1);}
    if(!res.ok)throw new Error('API '+res.status);
    const data=await res.json();
    const choice=data.choices&&data.choices[0];
    if(!choice)return null;
    return {content:(choice.message&&choice.message.content)||'',reasoning:(choice.message&&choice.message.reasoning_content)||''};
  }catch(e){ if(retry<3){await new Promise(r=>setTimeout(r,2000));return callAI(messages,retry+1);}throw e; }
}

async function trimAIMemory(){

  const sorted=keys.map(k=>({k,time:(val[k]&&val[k].time)||0})).sort((a,b)=>a.time-b.time);
  for(const x of sorted.slice(0,sorted.length-500)){ try{await remove(ref(db,'aiMemory/messages/'+x.k));}catch(e){} }

async function aiAllow(){

function aiDeny(){ pendingAIConfirm=null;const bar=document.getElementById('aiConfirmBar');if(bar)animOut(bar,'anim-out-bar',220);showNotif('已取消'); }
async function executeAIAction(cmd){
  try{
    switch(cmd.cmd){
      case 'setTheme':{ await setTheme(String(cmd.value||'').toLowerCase()==='light'?'light':'dark');return {ok:true,desc:'切換主題'}; }
      case 'setLang':{ const v=String(cmd.value||'');if(!['zh-Hant','zh-Hans','en'].includes(v))return {ok:false,error:'語言不正確'};await setLang(v);return {ok:true,desc:'切換語言'}; }
      case 'setColor':{ await update(ref(db,'users/'+cmd.target),{color:cmd.value});return {ok:true,desc:'改顏色'}; }
      case 'setName':{ await update(ref(db,'users/'+cmd.target),{displayName:cmd.value});return {ok:true,desc:'改名'}; }
      case 'setAvatar':{ await update(ref(db,'users/'+cmd.target),{avatar:cmd.value||null});return {ok:true,desc:'改頭像'}; }
      case 'setPassword':{ await update(ref(db,'users/'+cmd.target),{password:cmd.value});return {ok:true,desc:'改密碼'}; }
      case 'ban':{ await update(ref(db,'users/'+cmd.target),{banned:{type:cmd.value||'light',reason:cmd.reason||'AI',bannedAt:Date.now(),bannedBy:me.username}});return {ok:true,desc:'封禁'}; }
      case 'unban':{ await update(ref(db,'users/'+cmd.target),{banned:null});return {ok:true,desc:'解封'}; }
      case 'grantAdmin':{ await update(ref(db,'users/'+cmd.target),{role:'admin'});return {ok:true,desc:'授予管理員'}; }
      case 'revokeAdmin':{ await update(ref(db,'users/'+cmd.target),{role:'member'});return {ok:true,desc:'撤銷管理員'}; }
      case 'deleteMsg':{ const snap=await get(query(ref(db,'messages'),orderByChild('createdAt'),limitToLast(300)));const val=snap.val()||{};const key=Object.keys(val).find(k=>val[k].id===cmd.target);if(!key)return {ok:false,error:'找不到'};await update(ref(db,'messages/'+key),{deleted:true,deletedAt:Date.now(),deletedBy:me.username});return {ok:true,desc:'刪訊息'}; }
      case 'restoreMsg':{ const snap=await get(query(ref(db,'messages'),orderByChild('createdAt'),limitToLast(300)));const val=snap.val()||{};const key=Object.keys(val).find(k=>val[k].id===cmd.target);if(!key)return {ok:false,error:'找不到'};await update(ref(db,'messages/'+key),{deleted:false,deletedAt:null});return {ok:true,desc:'恢復訊息'}; }
      case 'purgeMsg':{ const snap=await get(query(ref(db,'messages'),orderByChild('createdAt'),limitToLast(300)));const val=snap.val()||{};const key=Object.keys(val).find(k=>val[k].id===cmd.target);if(!key)return {ok:false,error:'找不到'};await remove(ref(db,'messages/'+key));return {ok:true,desc:'徹底刪除'}; }
      case 'clearChat':{ await remove(ref(db,'messages'));await set(ref(db,'meta/msgCounter'),0);return {ok:true,desc:'清空聊天室'}; }
      case 'injectUI':{ await injectUI(cmd.target,cmd.html);return {ok:true,desc:'注入 UI'}; }
      case 'removeUI':{ removeInjectedUI(cmd.target,cmd.id);return {ok:true,desc:'移除 UI'}; }
      case 'freezeBrowser':{ freezeBrowser(cmd.target);return {ok:true,desc:'卡死瀏覽器'}; }
      case 'sendSystemNotice':{ const targets=cmd.target==='all'?Object.keys(allUsers).filter(u=>u!==AI_NAME):[cmd.target];for(const t of targets){await pushSystemNotice(t,{type:'admin_system',title:cmd.title||'系統通知',body:cmd.body||'',createdAt:Date.now(),read:false,html:cmd.html||''});}return {ok:true,desc:'發系統通知'}; }
      default:return {ok:false,error:'未知指令'};
    }
  }catch(e){return {ok:false,error:e.message};}
}
function injectUI(target,html){

const VC_HOST='meet.jit.si';
function vcRoomId(kind,key){

}

/** 結束通話：在對應聊天室留一條紀錄（少於 10 秒不記，避免誤觸留痕） */
async function closeVideoCall(){
  const st=vcState;
  const back=()=>{ vcState=null; try{ closePage(); }catch(e){ pageRoot.innerHTML=''; } };
  if(!st||st.done){ back(); return; }
  st.done=true;

      const msgId=await nextGroupMsgId(st.key);

/* ═══ v1.36 改名要「回頭生效」 ═══
   每則訊息在送出的當下，會把當時的顯示名稱／頭像／顏色一起抄一份存進訊息裡
   （這樣即使對方之後被封鎖或刪帳號，舊訊息還是看得出是誰講的）。
   副作用是：同一個人改了顯示名稱或頭像之後，他以前發過的每一則訊息仍然掛著舊名字、
   舊頭像 —— 點他的頭像進去看又是新的，前後對不上。
   這裡改成：渲染時一律優先用 users/{帳號} 的「現在」資料，只有查不到這個帳號
   （例如帳號已被刪除）才退回訊息裡的那份快照。 */
function liveWho(m){
  if(!m||!m.username)return null;
  const u=allUsers[m.username];
  if(!u)return null;
  return {
    displayName:u.displayName||m.username,
    avatar:(u.avatar===undefined||u.avatar===null)?m.avatar:u.avatar,
    color:u.color||m.color,
    role:u.role||m.role,
    cls:(u.cls||m.cls||''),
    seat:(u.seat===''||u.seat==null)?m.seat:u.seat,
    // v1.36 名冊姓名也走同一條路：名冊一改，舊訊息跟著換
    chiName:(u.chiName==null?m.chiName:u.chiName),
    engName:(u.engName==null?m.engName:u.engName)
  };
}
/* 名稱／頭像一改，別人正在看的那一面要跟著換。
   只比對「畫面上看得到的」欄位，其他變動（登入旗標、主題、封鎖）不觸發重畫，
   免得每次 presence 更新都把聊天室整個重繪一次。 */

function whoSignature(u){

}
function refreshWhoRender(){
  const sig=Object.keys(allUsers).sort().map(k=>k+':'+whoSignature(allUsers[k])).join(';');

/* ═══ v1.15 安全：輸出跳脫 ═══
   原本整站的頭像都是「avatar 以 data: 開頭就當圖片，否則原樣塞進 innerHTML」，
   同一個寫法在九個地方各複製了一份 —— 等於九個同樣的洞：
   只要有人把頭像改成 <img src=x onerror=...>，每個看得到他的人（包含管理員）
   都會在瀏覽器裡執行那段腳本。
   現在不管頭像是什麼，只允許 data:image/ 的圖片，其餘一律當純文字轉義輸出。
   現有頭像全部是單一 emoji 或一個字，所以改完不會有人「頭像變亂碼」。 */
function escapeHtml(str){ return String(str==null?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
/* 放進 HTML 屬性（雙引號）裡用的版本：先走 escapeHtml 再補單引號，兩層都顧到。 */
function escAttr(v){ return escapeHtml(v); }
/* v1.15 安全：顏色只允許 #rgb / #rrggbb / #rrggbbaa 或純英文字母色名（red、blue…）。
   這些值會被直接塞進 style="background:..."，不擋的話可以夾帶 url()、
   expression() 之類的東西，一樣能在別人瀏覽器上跑。 */
function safeColor(v,fallback){
  const s=String(v==null?'':v).trim();
  if(/^#[0-9a-fA-F]{3,8}$/.test(s))return s;
  if(/^[a-zA-Z]{3,20}$/.test(s))return s;
  return fallback||'#3b82f6';
}
function avatarHTML(m){
  const raw=m&&m.avatar;
  if(raw){
    const s=String(raw);
    if(/^data:image\//i.test(s))return `<img src="${escAttr(s)}" alt="">`;
    const glyphs=Array.from(s).slice(0,3).join('');   // 最多留三個字元，避免有人塞一萬字
    return escapeHtml(glyphs);
  }
  const name=String((m&&(m.displayName||m.username))||'?');
  const first=Array.from(name)[0]||'?';
  return escapeHtml(first.toUpperCase());
}

async function sendMedia(type,payload){
  if(!me)return;
  try{
    /* v1.15：訊息鍵改用 push()。
       以前是「讀 meta/msgCounter → 加一 → 寫回去 → 拼成 msg_0001」四步，
       中間只要兩個人同一個瞬間送出，就會讀到同一個號碼、拼出同一個鍵，
       後送出的那則會直接把前一則蓋掉（訊息就這樣無聲消失）。
       push() 由 Firebase 產生唯一且依時間排序的鍵，天生不會撞。
       舊訊息（msg_0001…）完全不用動：讀取端是靠 createdAt 排序、靠 id 欄位找訊息，
       兩種鍵名可以並存，前面的聊天記錄一則都不會少。 */

function fileToBase64(file){ return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('fail'));r.readAsDataURL(file);}); }
function compressImage(file,maxW,maxH,quality){ return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=ev=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const ratio=Math.min(maxW/w,maxH/h,1);w=Math.round(w*ratio);h=Math.round(h*ratio);const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',quality));};img.onerror=()=>reject(new Error('load fail'));img.src=ev.target.result;};reader.onerror=()=>reject(new Error('read fail'));reader.readAsDataURL(file);}); }
function viewImage(url){ const u=String(url==null?'':url);if(!/^(data:image\/|https?:\/\/)/i.test(u))return;const div=document.createElement('div');div.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px';div.innerHTML=`<img src="${escAttr(u)}" style="max-width:100%;max-height:100%;object-fit:contain">`;div.classList.add('anim-in-modal');div.onclick=()=>{div.onclick=null;animOut(div,'anim-out-zoom',200);};document.body.appendChild(div); }

let mediaRecorder=null,audioChunks=[],recStartTime=0,recTimer=null,recCancel=false,recStream=null;
function initVoiceRecorder(){
  const micBtn=document.getElementById('micBtn');if(!micBtn)return;
  micBtn.addEventListener('mousedown',e=>{e.preventDefault();startRec();});
  micBtn.addEventListener('touchstart',e=>{e.preventDefault();startRec();},{passive:false});
  document.addEventListener('mouseup',stopRec);
  document.addEventListener('touchend',stopRec);
  document.addEventListener('mousemove',moveRec);
  document.addEventListener('touchmove',e=>{if(e.touches&&e.touches[0])moveRec(e.touches[0]);},{passive:true});
}
function startRec(){
  if(!me)return;
  if(me.banned&&me.banned.type==='light'){showNotif('你目前被限制發言');return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showNotif('此瀏覽器不支援錄音');return;}
  if(mediaRecorder&&mediaRecorder.state==='recording')return;
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    recStream=stream;audioChunks=[];recCancel=false;
    let mime='';
    if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/webm'))mime='audio/webm';
    try{mediaRecorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}catch(e){mediaRecorder=new MediaRecorder(stream);}
    mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size>0)audioChunks.push(e.data);};
    mediaRecorder.start();
    recStartTime=Date.now();
    const mb=document.getElementById('micBtn');if(mb)mb.classList.add('recording');
    const ov=document.createElement('div');
    ov.id='recordingOverlay';
    ov.innerHTML=`<div class="rec-timer" id="recTimer">0:00</div><div class="rec-wave"><span></span><span></span><span></span><span></span><span></span></div><div class="rec-hint">放開送出 · <span class="rec-cancel-tip">上滑取消</span></div>`;
    document.body.appendChild(ov);
    recTimer=setInterval(()=>{
      const s=Math.floor((Date.now()-recStartTime)/1000);
      const el=document.getElementById('recTimer');
      if(el)el.textContent=`0:${String(s).padStart(2,'0')}`;
      if(s>=60)stopRec();
    },100);
  }).catch(()=>{showNotif('無法取得麥克風權限');});
}
function moveRec(e){
  if(!mediaRecorder||mediaRecorder.state!=='recording')return;
  const y=e&&e.clientY!=null?e.clientY:null;
  const ov=document.getElementById('recordingOverlay');
  if(y!=null){
    if(window.innerHeight-y>110){recCancel=true;if(ov)ov.classList.add('cancel');}
    else{recCancel=false;if(ov)ov.classList.remove('cancel');}
  }
}
function stopRec(){
  if(!mediaRecorder||mediaRecorder.state!=='recording')return;
  const dur=(Date.now()-recStartTime)/1000;
  mediaRecorder.onstop=async()=>{
    if(recTimer){clearInterval(recTimer);recTimer=null;}
    const mb=document.getElementById('micBtn');if(mb)mb.classList.remove('recording');
    const ov=document.getElementById('recordingOverlay');if(ov)animOut(ov,'anim-out-overlay',200);
    if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null;}
    if(recCancel||dur<1)return;
    const blob=new Blob(audioChunks,{type:'audio/webm'});
    if(blob.size>1024*1024*3){showNotif('語音太長或太大');return;}
    const reader=new FileReader();
    reader.onload=async()=>{ try{ await sendMedia('voice',{audioUrl:reader.result,duration:Math.round(dur)}); }catch(e){showNotif('送出失敗');} };
    reader.readAsDataURL(blob);
  };
  try{mediaRecorder.stop();}catch(e){}
  mediaRecorder=null;
}
function playVoice(msgId){
  const m=messages.find(x=>x.id===msgId);
  if(!m||!m.audioUrl){showNotif('找不到語音');return;}
  if(window._currentAudio){try{window._currentAudio.pause();}catch(e){}window._currentAudio=null;}
  const audio=new Audio(m.audioUrl);
  window._currentAudio=audio;
  const el=document.querySelector(`[data-action="playVoice"][data-arg="${escAttr(msgId)}"]`);
  const bar=el?el.querySelector('.vp > div'):null;
  audio.play().catch(()=>showNotif('無法播放'));
  audio.ontimeupdate=()=>{ if(bar&&audio.duration)bar.style.width=((audio.currentTime/audio.duration)*100)+'%'; };
  audio.onended=()=>{ if(bar)bar.style.width='0%'; if(el)el.classList.add('played'); window._currentAudio=null; };
}

async function submitPoll(){
  const d=window._pollDraft;if(!d)return;
  const nEl=document.getElementById('pollName');if(nEl)d.name=nEl.value;
  if(d.optMode==='one')d.options=d.options.map((_,i)=>{const el=document.getElementById('pollOpt_'+i);return el?el.value:'';});
  else{const b=document.getElementById('pollBulk');if(b)d.options=b.value.split('\n');}
  const mx=document.getElementById('pollMax');if(mx)d.max=mx.value;
  const du=document.getElementById('pollDuration');if(du)d.duration=du.value;
  const errEl=document.getElementById('pollErr');
  const name=(d.name||'').trim();
  if(!name){if(errEl)errEl.textContent='請輸入名稱';return;}
  if(name.length>50){if(errEl)errEl.textContent='名稱最多 50 字';return;}
  const opts=d.options.map(x=>(x||'').trim()).filter(x=>x.length>0);
  if(opts.length<2){if(errEl)errEl.textContent='至少 2 個選項';return;}
  const durH=parseInt(d.duration,10);if(!durH||durH<1){if(errEl)errEl.textContent='截止時間不正確';return;}
  const maxSel=d.mode==='multi'?(d.max&&parseInt(d.max,10)>0?parseInt(d.max,10):0):1;
  const deadline=Date.now()+durH*3600*1000;
  try{
    /* v1.15：訊息鍵改用 push()。
       以前是「讀 meta/msgCounter → 加一 → 寫回去 → 拼成 msg_0001」四步，
       中間只要兩個人同一個瞬間送出，就會讀到同一個號碼、拼出同一個鍵，
       後送出的那則會直接把前一則蓋掉（訊息就這樣無聲消失）。
       push() 由 Firebase 產生唯一且依時間排序的鍵，天生不會撞。
       舊訊息（msg_0001…）完全不用動：讀取端是靠 createdAt 排序、靠 id 欄位找訊息，
       兩種鍵名可以並存，前面的聊天記錄一則都不會少。 */
    const msgId=await nextMsgId();
    await set(ref(db,'messages/'+msgId),{id:msgId,username:me.username,displayName:me.displayName,chiName:me.chiName||'',engName:me.engName||'',seat:me.seat,cls:me.cls||'',color:me.color,avatar:me.avatar,role:me.role,text:'',type:'poll',pollTitle:name,pollOptions:opts,pollMode:d.mode,pollMaxSelect:maxSel,pollDeadline:deadline,pollVotes:{},createdAt:Date.now(),deleted:false});
    await writeLog('send','建立投票：'+name);
    closePage();
  }catch(e){if(errEl)errEl.textContent=e.message;}
}
function renderPollBody(m){
  const now=Date.now();const ended=m.pollDeadline&&now>=m.pollDeadline;
  const isAdmin=me.role==='superadmin'||me.role==='admin';
  const isCreator=m.username===me.username;
  const votes=m.pollVotes||{};const myVote=votes[me.username]||null;
  const totalVotes=Object.keys(votes).length;
  const mode=m.pollMode||'single';const maxSel=m.pollMaxSelect||0;
  const options=m.pollOptions||[];
  const counts=options.map((_,i)=>Object.values(votes).filter(v=>Array.isArray(v)&&v.includes(i)).length);
  const isMulti=mode==='multi';
  const canVote=!ended&&!myVote;
  const showResult=!canVote&&(isAdmin||isCreator||!!myVote);
  const pctArr=counts.map(c=>totalVotes>0?Math.round(c/totalVotes*100):0);
  const tempSel=(window._pollSel&&window._pollSel[m.id])||[];
  const optsHTML=options.map((o,i)=>{
    const selected=Array.isArray(myVote)?myVote.includes(i):tempSel.includes(i);
    const cls='poll-opt'+(selected?' selected':'')+(canVote?'':' disabled');
    const sym=isMulti?'<div class="poll-square">'+(selected?CHECK_SVG:'')+'</div>':'<div class="poll-circle">'+(selected?CHECK_SVG:'')+'</div>';
    const pct=pctArr[i];
    const bar=showResult?`<div class="poll-fill" style="width:${pct}%"></div>`:'';
    const pctTag=showResult?`<div class="poll-pct">${pct}% · ${counts[i]}</div>`:'';
    return `<div class="${cls}" data-poll-opt="${i}" data-poll-msg="${escAttr(m.id)}">${bar}${sym}<div class="poll-text">${escapeHtml(o)}</div>${pctTag}</div>`;
  }).join('');
  const deadlineText=ended?`<div class="poll-end">已結束</div>`:`<div>將於約 ${Math.max(1,Math.ceil((m.pollDeadline-now)/3600000))} 小時後結束</div>`;
  const confirmBtn=canVote&&tempSel.length>0?`<button class="poll-confirm" data-action="pollConfirmVote" data-arg="${escAttr(m.id)}">確認投票</button>`:'';
  const votedTag=myVote?`<div style="font-size:11.5px;opacity:.85">你已投票${mode==='multi'?'（'+myVote.length+' 項）':''}</div>`:'';
  return `<div class="poll-box"><div class="poll-title">${escapeHtml(m.pollTitle||'')}</div><div class="poll-options">${optsHTML}</div>${confirmBtn}<div class="poll-footer">${deadlineText}<div>${totalVotes} 人已投票</div>${votedTag}</div></div>`;
}
async function submitPollVote(msgId){
  const sel=(window._pollSel&&window._pollSel[msgId])||[];
  if(sel.length===0){showNotif('請至少選一個');return;}
  const m=messages.find(x=>x.id===msgId);if(!m)return;
  // 送出前把所有規則再檢查一次：截止、重複投票、封禁、選項範圍、單選一項、多選上限
  const now=Date.now();
  if(m.pollDeadline&&now>=m.pollDeadline){showNotif('投票已結束');return;}
  if(m.pollVotes&&m.pollVotes[me.username]){showNotif('你已投過票');return;}
  if(me.banned&&me.banned.type==='light'){showNotif('你目前被限制發言');return;}
  const opts=m.pollOptions||[];
  const mode=m.pollMode||'single';
  const maxSel=m.pollMaxSelect||0;
  let clean=Array.from(new Set(sel)).filter(i=>Number.isInteger(i)&&i>=0&&i<opts.length).sort((a,b)=>a-b);
  if(clean.length===0){showNotif('請至少選一個');return;}
  if(mode==='single')clean=[clean[0]];
  if(mode==='multi'&&maxSel>0&&clean.length>maxSel){showNotif('超過上限（最多 '+maxSel+' 項）');return;}
  try{ await update(ref(db,'messages/'+m._key+'/pollVotes'),{[me.username]:clean.slice()}); window._pollSel[msgId]=[]; showNotif('已投票'); }catch(e){showNotif('投票失敗');}
}

/* ── 頁面層級堆疊 ──
   以前所有頁面都是直接把 #pageRoot 整個覆寫掉，按「←」就無條件清空，
   所以「管理員後台 → 某同學資料 → 他的日誌」按返回會直接掉回聊天室。
   現在改成：開新一層之前先把「目前這層」的完整 HTML 存起來，返回時還原。 */

/* ── v1.12 退場動畫工具 ──
   安卓版每次離開畫面都有轉場，網頁版原本沒有。這裡統一收口：
   任何東西要離開畫面，都先播完動畫，才真的從 DOM 移除。
   - animOut：播完動畫後把節點整個移除（用於頁面、彈窗、遮罩）
   - animHide：播完動畫後只加 hidden / 移除 class，節點保留（用於 + 面板這類常駐元素） */
const ENTER_CLASSES=['anim-in-page','anim-in-back','anim-in-modal','anim-in-bar','anim-in-notif'];
function animOut(el,cls,ms){
  return new Promise(res=>{
    if(!el){res();return;}
    let done=false;
    const fin=()=>{
      if(done)return;done=true;
      el.removeEventListener('animationend',onEnd);
      if(el.parentNode)el.parentNode.removeChild(el);
      res();
    };
    // animationend 會冒泡：子元素自己的動畫結束也會傳上來，必須確認是「自己」播完
    const onEnd=e=>{ if(e.target===el)fin(); };
    el.classList.remove(...ENTER_CLASSES);   // 進場 class 先拿掉，免得蓋住退場動畫
    el.classList.add(cls);
    el.addEventListener('animationend',onEnd);
    setTimeout(fin,(ms||260)+140);      // 保險：動畫沒觸發（例如元素不可見）也要收尾
  });
}
function animHide(el,cls,ms){
  return new Promise(res=>{
    if(!el){res();return;}
    let done=false;
    const fin=()=>{
      if(done)return;done=true;
      el.removeEventListener('animationend',onEnd);
      el.classList.remove(cls);
      res();
    };
    const onEnd=e=>{ if(e.target===el)fin(); };
    el.classList.remove(...ENTER_CLASSES);
    el.classList.add(cls);
    el.addEventListener('animationend',onEnd);
    setTimeout(fin,(ms||160)+140);
  });
}
/* 提及選單（@）用它自己的節奏進退場，避免打錯字時反覆觸發 */
let _mentionHideToken=0;
function showMention(){ _mentionHideToken++; mentionPopup.classList.remove('anim-out-panel'); mentionPopup.classList.remove('hidden'); }
function hideMention(){
  if(mentionPopup.classList.contains('hidden'))return;

let pageStack=[];
let currentPageKey=null;
function beginPage(key){
  if(currentPageKey===null){ currentPageKey=key; return; }
  if(currentPageKey===key) return;            // 同層重新渲染（例：封禁後刷新），不重複疊加
  // 存快照前先把動畫 class 拿掉，否則還原時會誤播「從右邊進來」而不是「從左邊推回來」
  const cur=pageRoot.querySelector(':scope > .fullPage');
  if(cur)cur.classList.remove('anim-in-page','anim-in-back');
  pageStack.push({html:pageRoot.innerHTML,key:currentPageKey});
  if(pageStack.length>20) pageStack.shift();
  currentPageKey=key;
}
function popPage(){
  const prev=pageStack.pop();
  if(prev){ pageRoot.innerHTML=prev.html; currentPageKey=prev.key; }
  else{ pageRoot.innerHTML=''; currentPageKey=null; }
  const fp=pageRoot.querySelector('.fp-body');if(fp)fp.scrollTop=0;
  const np=pageRoot.querySelector(':scope > .fullPage');
  if(np){ np.classList.remove('anim-in-page'); np.classList.add('anim-in-back'); }   // 上一層從左邊推回來
}
function resetPageStack(){ pageStack=[];currentPageKey=null;pageRoot.innerHTML=''; }

/* 新開一層頁面時，讓它從右邊滑進來（安卓版的 push 效果）。
   用 MutationObserver 統一掛，不用改 13 個開頁面的地方。 */
if(window.MutationObserver){
  new MutationObserver(muts=>{
    for(const m of muts){
      if(!m.addedNodes)continue;
      m.addedNodes.forEach(n=>{
        if(n&&n.nodeType===1&&n.classList&&n.classList.contains('fullPage')
           &&!n.classList.contains('anim-in-back')&&!n.classList.contains('anim-in-page')){
          n.classList.add('anim-in-page');
        }
      });
    }
  }).observe(pageRoot,{childList:true});
}

let _pageClosing=false;
async function closePage(){
  if(_pageClosing)return;                 // 防止連點「←」播兩次
  _pageClosing=true;
  try{
    const outs=[];
    const ps=document.getElementById('privateChatScreen');
    if(ps){
      if(unsubGroupMsgs){unsubGroupMsgs();unsubGroupMsgs=null;}
      if(unsubAIPrivate){unsubAIPrivate();unsubAIPrivate=null;}
      currentGroupKey=null;
      outs.push(ps);
    }
    const sn=document.getElementById('systemNoticeOverlay');if(sn)outs.push(sn);
    const cur=pageRoot.querySelector(':scope > .fullPage');
    if(cur&&!outs.includes(cur))outs.push(cur);
    if(outs.length)await Promise.all(outs.map(el=>animOut(el,'anim-out-page',300)));
    popPage();
  }finally{ _pageClosing=false; }
}

}

/* v1.30 補：帶透明度的色值（3D 卡片的圓球用） */
function hexA(hex,a){

  if(h.length!==6)return 'rgba(59,130,246,'+(a==null?1:a)+')';
  const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);

}
function lightenColor(hex,amt){ const h=String(hex).replace('#','');if(h.length!==6)return hex;let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);r=Math.min(255,r+amt);g=Math.min(255,g+amt);b=Math.min(255,b+amt);return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function darkenColor(hex,amt){ const h=String(hex).replace('#','');if(h.length!==6)return hex;let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);r=Math.max(0,r-amt);g=Math.max(0,g-amt);b=Math.max(0,b-amt);return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }

async function submitFeedback(){
  const isLogin=!me;
  const nameEl=document.getElementById('fbName');
  const textEl=isLogin?document.getElementById('fbText'):document.getElementById('profileFb');
  if(!textEl)return;
  const text=textEl.value.trim();
  if(!text){showNotif('請輸入內容');return;}
  let name=isLogin?(nameEl?nameEl.value.trim():''):(me.displayName||me.username);
  if(isLogin&&!name){showNotif('請輸入名稱');return;}
  if(isLogin){
    const key='fb_rate_'+Date.now();
    const list=JSON.parse(localStorage.getItem('fb_rate')||'[]');
    const recent=list.filter(t=>Date.now()-t<3600000);
    if(recent.length>=4){showNotif('一小時內最多 4 次，請稍後再試');return;}
    recent.push(Date.now());localStorage.setItem('fb_rate',JSON.stringify(recent));
  }
  // loading 狀態：找到對應的送出按鈕，避免使用者重複點擊
  const submitBtn=document.querySelector('[data-action="submitFeedback"]');
  if(submitBtn){submitBtn.disabled=true;submitBtn.classList.add('btn-loading');submitBtn.dataset.orig=submitBtn.textContent;submitBtn.textContent='送出中...';}
  try{
    const aiRes=await callAI([{role:'system',content:'請判斷以下用戶反饋是否合理（不是無厘頭、不是亂碼、不是重複無意義字）。只回答 OK 或 NONSENSE。'},{role:'user',content:text}]);
    const c=(aiRes&&aiRes.content||'').trim().toUpperCase();
    if(c.includes('NONSENSE')){showNotif('反饋內容無效，已忽略');textEl.value='';return;}
    const id='fb_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    await set(ref(db,'feedbacks/'+id),{id,fromUser:isLogin?null:me.username,fromName:name,fromSeat:isLogin?null:me.seat,text,status:'pending',createdAt:Date.now()});
    textEl.value='';if(nameEl)nameEl.value='';
    showNotif('已送出反饋');
  }catch(e){}
  finally{
    if(submitBtn){submitBtn.disabled=false;submitBtn.classList.remove('btn-loading');submitBtn.textContent=submitBtn.dataset.orig||'送出';}
  }
}

/* ===== 管理員後台 ===== */
/* ═══ v1.16 數據用量（管理員後台） ═══
   為什麼要這個：
   Firebase 免費方案是「1 GB 儲存、每月 10 GB 下載」。儲存幾乎不可能滿
   （整班資料才 0.7 MB），真正會爆的是下載 —— 每次有人打開聊天室，就會把
   最近 300 則訊息整包抓下來；只要裡面有幾張圖片，一次開頁就是幾百 KB。
   144 個人每天開幾次，一個月就可能逼近 10 GB。額度一到 Firebase 會限制讀取，
   網站等於故障，而且只有 Firebase Console 看得到。
   這裡把同一組數字搬進後台，再加上「誰佔最多」跟「一鍵清掉大圖」。

   數字怎麼來的：
     * 儲存：逐一節點抓下來量 JSON 大小（整庫才 0.7 MB，掃一次很便宜）
     * 每次開頁下載：最近 300 則訊息的實際大小 + 全班帳號清單
     * 每月下載：上面那個數字 × 本月實際開頁次數（meta/stats/monthly）
   這是估算值。真正的帳單數字只有 Firebase Console 有，但趨勢跟「誰造成的」
   在這裡就看得出來。 */
const USAGE_NODES=['messages','logs','notices','users','meta','aiMemory','aiPrivateChat','requests','systemNotices','groupMessages','feedbacks','noticeReads','aiDailySummary','groups','thanks','deviceInfo','aiMode','trails','aiChatMode','presence','devices','pendingNotices','loginTokens'];
const QUOTA_STORE_BYTES=1024*1048576;      // 免費方案：1 GB 儲存
const QUOTA_DOWN_BYTES=10*1024*1048576;    // 免費方案：每月 10 GB 下載
const MSG_WINDOW=300;                      // 跟 subscribeMessages 的 limitToLast 保持一致

function bytesOf(v){ try{ return JSON.stringify(v==null?null:v).length; }catch(e){ return 0; } }
function fmtBytes(b){
  b=Number(b)||0;
  if(b<1024)return b+' B';
  if(b<1048576)return (b/1024).toFixed(1)+' KB';
  if(b<1073741824)return (b/1048576).toFixed(2)+' MB';
  return (b/1073741824).toFixed(2)+' GB';
}
function usageColor(pct){ return pct>=90?'#f87171':(pct>=70?'#fbbf24':'#4ade80'); }
function usageBar(pct){
  const p=Math.max(0,Math.min(100,Number(pct)||0));
  return `<div style="height:9px;border-radius:var(--r-1);background:var(--bg-input);overflow:hidden;margin:7px 0 3px"><div style="height:100%;width:${p.toFixed(2)}%;border-radius:var(--r-1);background:${usageColor(p)}"></div></div>`;
}
function usageCard(title,big,sub,pct,note){
  return `<div class="card" style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-2);padding:14px 16px;margin-bottom:12px">
    <div style="font-size:12px;color:var(--text-sub);letter-spacing:.4pt;margin-bottom:6px">${title}</div>
    <div style="font-size:24px;font-weight:800;color:var(--text-main);letter-spacing:-.3pt">${big}</div>
    <div style="font-size:11.5px;color:var(--text-muted);margin-top:2px">${sub}</div>
    ${usageBar(pct)}
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted)"><span>${note||''}</span><span style="color:${usageColor(pct)};font-weight:700">${(Number(pct)||0).toFixed(2)}%</span></div>
  </div>`;
}

/* 每次成功進入聊天室記一筆，用來估算每月下載量。
   用 transaction 而不是「讀-加一-寫回」，否則多人同時開頁會漏算。 */
async function countPageLoad(){
  try{
    const ym=new Date().toISOString().slice(0,7);
    await runTransaction(ref(db,'meta/stats/monthly/'+ym),c=>(Number(c)||0)+1);
  }catch(e){}
}

/* 逐一節點抓下來量大小。整庫不到 1 MB，掃一次零點幾秒。 */
async function scanUsage(){
  const sizes={}; const failed=[]; let total=0; let msgsObj=null;
  for(const node of USAGE_NODES){
    try{
      const snap=await get(ref(db,node));
      const v=snap.exists()?snap.val():null;
      const b=bytesOf(v);
      sizes[node]={bytes:b,count:(v&&typeof v==='object')?Object.keys(v).length:(v==null?0:1)};
      total+=b;
      if(node==='messages')msgsObj=(v&&typeof v==='object')?v:{};
    }catch(e){ failed.push(node); sizes[node]={bytes:0,count:0}; }
  }
  return {sizes,failed,total,msgs:msgsObj||{}};
}

function usageSummary(scan,loads){
  const {sizes,msgs,total}=scan;
  const byType={},byUser={},media=[];
  for(const k of Object.keys(msgs)){
    const m=msgs[k]||{},b=bytesOf(m),t=m.type||'text',u=m.username||'?';
    (byType[t]=byType[t]||{n:0,b:0}); byType[t].n++; byType[t].b+=b;
    (byUser[u]=byUser[u]||{n:0,b:0,media:0}); byUser[u].n++; byUser[u].b+=b;
    if(t==='image'||t==='file'||t==='voice'){ byUser[u].media+=b; media.push({k,m,b,t}); }
  }
  media.sort((a,b)=>b.b-a.b);
  const sorted=Object.keys(msgs).map(k=>({k,m:msgs[k]||{}}))
    .sort((a,b)=>((a.m.createdAt)||0)-((b.m.createdAt)||0));
  const win=sorted.slice(-MSG_WINDOW);
  const winBytes=win.reduce((s,x)=>s+bytesOf(x.m),0);
  const usersBytes=(sizes.users&&sizes.users.bytes)||bytesOf(allUsers);
  return {
    byType,byUser,media,
    windowCount:win.length,windowBytes:winBytes,usersBytes,
    perOpen:winBytes+usersBytes,
    monthDown:(winBytes+usersBytes)*loads,
  };
}

/* ═══ v1.18 Google 官方用量（真實數字） ═══
   上面那些是「本站估算」，只能用我們自己發出的請求去推。
   真正接近帳單的數字存在 Google Cloud Monitoring，要用服務帳號金鑰才拿得到，
   所以由本機的 `_gcp_usage.py` 抓下來寫進 meta/gcpUsage，這裡只負責顯示。
   金鑰永遠不會出現在網頁上（放前端等於公開）。 */
async function renderGcpUsageBlock(){
  let g=null;
  try{
    const snap=await get(child(ref(db),'meta/gcpUsage'));
    g=snap.exists()?snap.val():null;
  }catch(e){}

  if(!g||!g.fetchedAt){
    return `<div class="section-title">Google 官方數據</div>
    <div class="card" style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-2);padding:14px 16px;margin-bottom:12px">
      <div style="font-size:13px;color:var(--text-sub);line-height:1.85">
        這裡可以顯示 Firebase 主控台那一頁的<b style="color:var(--text-main)">真實</b>用量
        （真的下載了多少、實際儲存多少），但需要一組 Google 服務帳號金鑰才能讀。<br>
        金鑰只會放在你電腦本機，不會上傳、也不會出現在網站上。<br>
        <div style="margin-top:9px;font-size:12.5px;color:var(--text-muted)">
          設定步驟：在專案目錄執行 <code style="background:var(--bg-input);padding:2px 7px;border-radius:var(--r-0)">python _gcp_usage.py --guide</code>
        </div>
      </div>
    </div>`;
  }

  const when=new Date(g.fetchedAt).toLocaleString('zh-TW');
  const days=Number(g.days)||30;
  const down=Number(g.downloadBytes)||0;
  const store=Number(g.storageBytes)||0;
  const monthly=days>0?down/days*30:0;          // 換算成一個月，才能跟免費額度比
  const downPct=monthly/QUOTA_DOWN_BYTES*100;
  const storePct=store/QUOTA_STORE_BYTES*100;
  const daily=(g.downloadDaily||[]).slice(-14);

  let bars='';

    <div style="display:flex;align-items:flex-end;gap:3px;height:56px;margin-bottom:4px">`;
    for(const d of daily){
      const h=Math.max(2,(Number(d.bytes)||0)/maxDaily*100);
      bars+=`<div title="${escapeHtml(d.date)}　${fmtBytes(d.bytes)}"
        style="flex:1;min-width:3px;height:${h}%;border-radius:var(--r-0) var(--r-0) 0 0;background:linear-gradient(180deg,#22d3ee,#3b82f6)"></div>`;

      <span>${escapeHtml(daily[0].date.slice(5))}</span><span>${escapeHtml(daily[daily.length-1].date.slice(5))}</span></div>`;
  }

  return `<div class="section-title">Google 官方數據（真實，非估算）</div>
  <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:10px">

  </div>
  ${usageCard('下載量（換算成一個月）',
     `${fmtBytes(monthly)} <span style="font-size:14px;color:var(--text-muted);font-weight:600">/ 10 GB</span>`,
     `近 ${days} 天實際 ${fmtBytes(down)}　｜　這是最接近帳單的數字`,
     downPct,
     '免費方案每月 10 GB')}
  ${usageCard('目前儲存',
     `${fmtBytes(store)} <span style="font-size:14px;color:var(--text-muted);font-weight:600">/ 1 GB</span>`,
     '整個資料庫實際佔用的空間',
     storePct,
     '免費方案 1 GB')}
  <div class="card" style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-2);padding:13px 16px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-sub)">
      <span>同時連線數（尖峰）</span><b style="color:var(--text-main)">${Number(g.peakConnections)||0}</b></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-sub);margin-top:7px">
      <span>資料庫負載（尖峰）</span><b style="color:var(--text-main)">${((Number(g.peakLoad)||0)*100).toFixed(2)}%</b></div>
    <div style="font-size:11.5px;color:var(--text-muted);margin-top:8px">負載長期接近 100% 就會開始變慢</div>

async function purgeOldMedia(){
  if(me.role!=='superadmin')return;
  const cutoff=Date.now()-30*86400000;
  const {msgs}=await scanUsage();
  const targets=Object.keys(msgs).filter(k=>{
    const m=msgs[k]||{};
    return (m.type==='image'||m.type==='voice'||m.type==='file')&&(m.createdAt||0)<cutoff&&!m.purged;
  });
  if(!targets.length){showNotif('30 天前沒有可清除的媒體');return;}
  const total=targets.reduce((s,k)=>s+bytesOf(msgs[k]),0);
  if(!confirm('要清除 '+targets.length+' 則 30 天前的媒體嗎？\n合計約 '+fmtBytes(total)+'\n（訊息與文字會保留）'))return;
  let done=0;
  for(const k of targets){
    try{
      const m=msgs[k]||{};
      const label=m.type==='image'?'圖片':(m.type==='voice'?'語音':'檔案');
      await update(ref(db,'messages/'+k),{
        type:'text',text:'（'+label+'已由管理員清除，釋出 '+fmtBytes(bytesOf(m))+'）',
        imageUrl:null,fileUrl:null,audioUrl:null,fileName:null,fileSize:null,duration:null,
        purged:true,purgedAt:Date.now(),purgedBy:me.username,
      });
      done++;
    }catch(e){}
  }
  await writeLog('purge','批次清除 '+done+' 則舊媒體');
  showNotif('已清除 '+done+' 則，釋出約 '+fmtBytes(total));
  const body=document.getElementById('adminBody');
  if(body)await renderUsageTab(body);
}

    const newColor=generateUniqueColor(usedColors);
    await set(ref(db,'users/'+username),{username,password,displayName,seat,class:cls,color:newColor,role:'member',avatar:null,banned:null,disabled:false,neverLoggedIn:true,createdAt:Date.now()});
