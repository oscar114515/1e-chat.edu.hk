async function aiSetAvatarText(){ await update(ref(db,'users/' + AI_NAME), { avatar: 'AI' }); showNotif('已更新'); setTimeout(()=>location.reload(),600); }
async function aiSetAvatarEmoji(emoji){ await update(ref(db,'users/' + AI_NAME), { avatar: emoji }); showNotif('已更新'); setTimeout(()=>location.reload(),600); }

async function saveDisplayName(){ const name = document.getElementById('editDisplayName').value.trim(); const errEl = document.getElementById('nameErr'), okEl = document.getElementById('nameOk'); if (!name) { errEl.textContent = t('nameEmpty'); return; } if (name.length > 20) { errEl.textContent = t('nameTooLong'); return; } await update(ref(db,'users/'+me.username), { displayName:name }); me.displayName = name; sessionStorage.setItem('chat_me', JSON.stringify(me)); okEl.textContent = '✓ '+t('updated'); setTimeout(() => location.reload(), 600); }
async function pickEmoji(emoji){ const val = emoji || null; await update(ref(db,'users/'+me.username), { avatar:val }); me.avatar = val; sessionStorage.setItem('chat_me', JSON.stringify(me)); setTimeout(() => location.reload(), 600); }
async function onAvatarFileChange(e){ const file = e.target.files[0]; if (!file) return; try { const d = await compressImage(file, 200, 200, 0.75); await update(ref(db,'users/'+me.username), { avatar:d }); me.avatar = d; sessionStorage.setItem('chat_me', JSON.stringify(me)); setTimeout(() => location.reload(), 600); } catch(err){} }
async function savePassword(){ const oldPwd = document.getElementById('oldPwd').value; const p1 = document.getElementById('newPwd1').value, p2 = document.getElementById('newPwd2').value; const errEl = document.getElementById('pwdErr'), okEl = document.getElementById('pwdOk'); if (!oldPwd) { errEl.textContent = t('oldPwd'); return; } if (p1.length < 6) { errEl.textContent = t('pwdTooShort'); return; } if (p1 !== p2) { errEl.textContent = t('pwdMismatch'); return; } const snap = await get(child(ref(db),'users/'+me.username)); if (snap.val().password !== oldPwd) { errEl.textContent = t('pwdWrong'); return; } await update(ref(db,'users/'+me.username), { password:p1 }); await writeLog('changepwd', t('changedPwdLog')); okEl.textContent = '✓ '+t('pwdUpdated'); }

async function openThanksPage(){ const isAdmin = me.role === 'superadmin' || me.role === 'admin'; const items = thanksList.length === 0 ? `<div class="thanks-empty">${t('thanksEmpty')}</div>` : thanksList.map(x => `<div class="thanks-item"><div class="ti-name">${escapeHtml(x.name)}</div><div class="ti-by">${t('thanksBy')} ${escapeHtml(x.byName||x.by)}</div></div>`).join(''); const adminForm = isAdmin ? `<div class="section-title">${t('thanksAdd')}</div><div class="form-row"><input type="text" id="thanksName" placeholder="${t('thanksNamePh')}" maxlength="30"></div><button class="btn-primary" data-action="submitThanks">${t('thanksSubmit')}</button><div class="err" id="thanksErr"></div>` : ''; openPage({ title: t('thanks'), bodyHTML: items + adminForm }); }
async function submitThanks(){ if (me.role !== 'superadmin' && me.role !== 'admin') return; const name = document.getElementById('thanksName').value.trim(); const errEl = document.getElementById('thanksErr'); if (!name) { if (errEl) errEl.textContent = t('thanksNameEmpty'); return; } await push(ref(db,'thanks'), { name, by:me.username, byName:me.displayName, createdAt:Date.now() }); showNotif(t('thanksAdded')); openThanksPage(); }

async function openVersionPage(){ const body = VERSION_HISTORY.map((v,i) => `<div class="version-item ${i===0?'latest':''}"><div class="vi-head"><span class="vi-ver">${v.ver}</span>${i===0?'<span class="vi-badge">'+t('latestBadge')+'</span>':''}${v.date?'<span class="vi-date">'+v.date+'</span>':''}</div><div class="vi-changes"><ul>${v.changes.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul></div></div>`).join(''); openPage({ title: t('versions'), bodyHTML: body }); }

async function openMyLogs(){ const snap = await get(query(ref(db,'logs'), limitToLast(500))); const val = snap.val()||{}; const list = Object.values(val).filter(l => l.username === me.username).sort((a,b) => b.createdAt-a.createdAt); openLogsPage(t('myLogs'), list); }
async function openUserLogs(username){ const snap = await get(query(ref(db,'logs'), limitToLast(500))); const val = snap.val()||{}; const list = Object.values(val).filter(l => l.username === username).sort((a,b) => b.createdAt-a.createdAt); openLogsPage(username + ' - ' + t('myLogs'), list); }
function openLogsPage(title, logs){ const body = logs.length === 0 ? `<div class="empty">${t('noLogs')}</div>` : logs.map(l => `<div class="log-item action-${l.action}"><div class="lt">${new Date(l.createdAt).toLocaleString(lang==='en'?'en-US':'zh-TW')} · ${escapeHtml(l.username)} (#${l.seat})</div><div class="lm">${escapeHtml(l.detail||l.action)}</div></div>`).join(''); openPage({ title, bodyHTML: `<div class="section-title">${logs.length}</div>` + body }); }

function openAdminPage(tab){
  if (me.role !== 'superadmin' && me.role !== 'admin') return;
  const isSuper = me.role === 'superadmin';
  const pendingCount = pendingNotices.length;
  const reqCount = Object.values(requests).filter(r => r.status === 'pending').length;
  pageRoot.innerHTML = `<div class="fullPage"><div class="fp-header"><button class="fp-back" data-action="closePage">←</button><div class="fp-title">${t('adminPanel')}</div><span style="font-size:11.5px;color:#a78bfa">${isSuper?t('superAdmin'):t('adminRole')}</span></div><div class="tabs"><button class="tab ${tab==='users'?'active':''}" data-action="switchAdminTab" data-arg="users">${t('usersTab')}</button><button class="tab ${tab==='notices'?'active':''}" data-action="switchAdminTab" data-arg="notices">${t('noticesTab')}${pendingCount?' ('+pendingCount+')':''}</button><button class="tab ${tab==='requests'?'active':''}" data-action="switchAdminTab" data-arg="requests">${t('requestsTab')}${reqCount?' ('+reqCount+')':''}</button><button class="tab ${tab==='logs'?'active':''}" data-action="switchAdminTab" data-arg="logs">${t('logsTab')}</button></div><div class="fp-body"><div class="admin-body" id="adminBody"></div></div></div>`;
  renderAdminTab(tab);
}
async function renderAdminTab(tab){ document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.arg === tab)); const body = document.getElementById('adminBody'); if (!body) return; if (tab === 'users') body.innerHTML = renderUserList(); else if (tab === 'notices') body.innerHTML = renderPendingNotices(); else if (tab === 'requests') body.innerHTML = renderRequestsList(); else body.innerHTML = await renderAllLogs(); }
function renderUserList(){
  const list = Object.values(allUsers).sort((a,b) => (a.seat||0)-(b.seat||0));
  if (list.length === 0) return `<div class="empty">${t('loading')}</div>`;
  const isSuper = me.role === 'superadmin';
  let modeHTML = '';
  if (isSuper) {
    const isOld = metaAIMode === 'keyword';
    modeHTML = `<div class="section-title">${t('aiModeLabel')}</div><div class="ban-type-buttons"><button class="ban-type-btn ${isOld?'selected light':''}" data-action="toggleAIMeta" data-arg="keyword">${t('aiModeOld')}</button><button class="ban-type-btn ${!isOld?'selected light':''}" data-action="toggleAIMeta" data-arg="button">${t('aiModeNew')}</button></div>`;
  }
  return modeHTML + `<div class="user-list">${list.map(u => {
    const isAdminU = u.role === 'superadmin' || u.role === 'admin';
    const isSuperU = u.role === 'superadmin';
    const isAI = u.role === 'ai';
    const color = isAI ? (u.color || AI_COLOR) : (isAdminU ? '#8b5cf6' : (u.color||'#3b82f6'));
    const av = u.avatar ? (String(u.avatar).startsWith('data:')?`<img src="${u.avatar}">`:u.avatar) : escapeHtml((u.displayName||u.username||'?').charAt(0).toUpperCase());
    const badges = [];
    if (isAI) badges.push(`<span class="uc-badge badge-ai">${t('aiRole')}</span>`);
    else if (isSuperU) badges.push(`<span class="uc-badge badge-super">${t('superAdmin')}</span>`);
    else if (isAdminU) badges.push(`<span class="uc-badge badge-admin">${t('adminRole')}</span>`);
    if (u.banned && u.banned.type === 'severe') badges.push(`<span class="uc-badge badge-ban-severe">${t('banTypeSevere')}</span>`);
    else if (u.banned && u.banned.type === 'light') badges.push(`<span class="uc-badge badge-ban-light">${t('banTypeLight')}</span>`);
    const online = presence[u.username] === true;
    const aion = aiModeMap[u.username] === true;
    return `<div class="user-card" data-action="openUserDetail" data-arg="${u.username}"><div class="uc-avatar" style="background:${color}">${av}</div><div class="uc-info"><div class="uc-name">${escapeHtml(u.displayName||u.username)}</div><div class="uc-sub">${isAI ? '' : '#'+u.seat+' · '}${u.username}</div></div>${badges.join('')}${!isAI?`<span class="uc-aion">${aion?t('aiOnTag'):t('aiOffTag')}</span>`:''}<div class="uc-presence ${online?'online':''}"></div></div>`;
  }).join('')}</div>`;
}
function renderRequestsList(){ const list = Object.values(requests).filter(r => r.status === 'pending').sort((a,b) => b.createdAt-a.createdAt); if (list.length === 0) return `<div class="empty">${t('noRequests')}</div>`; return list.map(r => { const typeLabel = r.type === 'delete' ? t('deleteRequest') : t('report'); const time = new Date(r.createdAt).toLocaleString(lang==='en'?'en-US':'zh-TW'); return `<div class="log-item action-delete" style="border-left-color:#ef4444"><div class="lt">${time} · ${escapeHtml(r.fromName||r.from)} (${typeLabel})</div><div class="lm">${escapeHtml(r.msgId)}<br>${escapeHtml(r.reason)}</div><div style="display:flex;gap:6px;margin-top:8px"><button class="btn-danger" style="margin:0;padding:8px" data-action="handleRequest" data-arg="${r._key||''}" data-arg2="approve">${t('approve')}</button><button class="btn-ghost" style="margin:0;padding:8px" data-action="handleRequest" data-arg="${r._key||''}" data-arg2="reject">${t('reject')}</button></div></div>`; }).join(''); }
async function handleRequest(key, action){ const req = requests[key]; if (!req) return; if (action === 'approve') { const snap = await get(query(ref(db,'messages'), limitToLast(300))); const val = snap.val()||{}; const mkey = Object.keys(val).find(k => val[k].id === req.msgId); if (mkey) await update(ref(db,'messages/'+mkey), { deleted:true, deletedAt:Date.now(), deletedBy:me.username }); await update(ref(db,'requests/'+key), { status:'approved', handledAt:Date.now(), handledBy:me.username }); } else { await update(ref(db,'requests/'+key), { status:'rejected', handledAt:Date.now(), handledBy:me.username }); } renderAdminTab('requests'); }
async function renderAllLogs(){ const snap = await get(query(ref(db,'logs'), limitToLast(300))); const val = snap.val()||{}; const list = Object.values(val).sort((a,b) => b.createdAt-a.createdAt); if (list.length === 0) return `<div class="empty">${t('noLogs')}</div>`; return list.map(l => `<div class="log-item action-${l.action}"><div class="lt">${new Date(l.createdAt).toLocaleString(lang==='en'?'en-US':'zh-TW')} · ${escapeHtml(l.username)} (#${l.seat})</div><div class="lm">${escapeHtml(l.detail||l.action)}</div></div>`).join(''); }

async function toggleAIMetaSetting(arg){
  if (me.role !== 'superadmin') return;
  await set(ref(db,'meta/aiMode'), arg);
  metaAIMode = arg;
  showOldAIUI();
  showNotif(arg === 'keyword' ? t('aiModeSwitch') : t('aiModeSwitchNew'));
  renderAdminTab('users');
}

async function openUserDetail(username){ const snap = await get(child(ref(db),'users/'+username)); if (!snap.exists()) return; renderUserDetailPage(snap.val()); }
function renderUserDetailPage(u){
  const isSuper = me.role === 'superadmin';
  const isTargetSuper = u.role === 'superadmin', isTargetAdmin = u.role === 'admin', isTargetAI = u.role === 'ai';
  const canEdit = (isSuper || me.role === 'admin');
  const canBan = isSuper && u.username !== me.username && !isTargetAI;
  const canGrant = isSuper && u.username !== me.username && !isTargetAI;
  const isAdmin = isTargetSuper || isTargetAdmin;
  const bgColor = isTargetAI ? (u.color || AI_COLOR) : (isAdmin ? '#8b5cf6' : (u.color||'#3b82f6'));
  const textColor = pickTextColor(bgColor);
  const avatarHTML = u.avatar ? (String(u.avatar).startsWith('data:')?`<img src="${u.avatar}">`:u.avatar) : escapeHtml((u.displayName||u.username||'?').charAt(0).toUpperCase());
  const roleLabel = isTargetAI ? t('aiRole') : (isTargetSuper ? t('superAdmin') : (isTargetAdmin ? t('adminRole') : t('memberRole')));
  const heroHTML = `<div class="profile-hero" style="background:${bgColor};color:${textColor}"><div class="hero-avatar" style="background:${bgColor};color:${textColor}">${avatarHTML}</div><div class="hero-name">${escapeHtml(u.displayName||u.username)}</div>${!isTargetAI?`<div class="hero-sub">#${u.seat} · ${u.username}</div>`:`<div class="hero-sub">${u.username}</div>`}<div class="hero-badge">${roleLabel}</div></div>`;
  let bodyHTML = '';
  if (u.banned) bodyHTML += `<div class="ban-status ${u.banned.type}"><b>${u.banned.type === 'severe' ? t('banTypeSevere') : t('banTypeLight')}</b><br>${t('reason')}：${escapeHtml(u.banned.reason||t('noReason'))}</div>`;
  if (u.password) bodyHTML += `<div class="section-title">${t('pwdLabel')}</div><div style="font-family:Consolas,monospace;font-size:14px;background:var(--bg-input);border:1px solid var(--border);padding:10px 12px;border-radius:10px;margin-bottom:10px;letter-spacing:1px">${escapeHtml(u.password)}</div>`;
  if (canBan) { const isBanned = !!u.banned; if (isBanned) bodyHTML += `<div class="section-title">${t('banSection')}</div><div class="ban-block"><div class="ban-label">${t('banned')}</div><div class="ban-sub">${t('unban')}</div><button class="btn-ok" data-action="unban" data-arg="${u.username}">${t('unban')}</button></div>`; else { const dt = (banDraft[u.username] && banDraft[u.username].type) || 'light'; const dr = (banDraft[u.username] && banDraft[u.username].reason) || ''; bodyHTML += `<div class="section-title">${t('banSection')}</div><div class="ban-block"><div class="ban-label">${t('banThis')}</div><div class="ban-sub">${t('banSelect')}</div><div class="ban-type-buttons"><button class="ban-type-btn light ${dt==='light'?'selected':''}" data-action="setBanType" data-arg="${u.username}" data-arg2="light">${t('banTypeLight')}<br><span style="font-size:10.5px;opacity:.85">${t('banLightSub')}</span></button><button class="ban-type-btn severe ${dt==='severe'?'selected':''}" data-action="setBanType" data-arg="${u.username}" data-arg2="severe">${t('banTypeSevere')}<br><span style="font-size:10.5px;opacity:.85">${t('banSevereSub')}</span></button></div><div class="form-row" style="margin-top:12px"><input type="text" id="au_banReason" placeholder="${t('banReasonPh')}" maxlength="100" value="${escapeHtml(dr)}"></div><div class="err" id="banErr"></div><button class="btn-danger" data-action="confirmBan" data-arg="${u.username}">${t('confirmBan')}</button></div>`; } }
  if (canEdit) bodyHTML += `<div class="section-title">${t('editName')}</div><div class="form-row"><input type="text" id="au_displayName" value="${escapeHtml(u.displayName||u.username)}" maxlength="20"></div><div class="section-title">Color (hex)</div><div class="form-row"><input type="text" id="au_color" value="${u.color||'#3b82f6'}"></div><div class="section-title">${t('editAvatar')}</div><div class="avatar-options">${['😀','😎','🤓','🐱','🐶','🦊','🐼','🐯','🦁','🐸','👽','🤖','🔥','⭐','⚡','🎮','⚽','🎸','🚀','🍕'].map(e => `<div class="av-opt" data-action="adminPickEmoji" data-arg="${u.username}" data-arg2="${e}">${e}</div>`).join('')}<div class="av-opt" data-action="adminPickEmoji" data-arg="${u.username}" data-arg2="">x</div></div><button class="btn-primary" data-action="adminSaveProfile" data-arg="${u.username}">${t('saved')}</button><div class="err" id="auErr"></div><div class="ok-msg" id="auOk"></div>`;
  if (canGrant) { bodyHTML += `<div class="section-title">${t('adminRole')}</div>`; if (isTargetAdmin && !isTargetSuper) bodyHTML += `<button class="btn-ghost" data-action="adminRevoke" data-arg="${u.username}">${t('revokeAdmin')}</button>`; else if (!isTargetAdmin) bodyHTML += `<button class="btn-primary" data-action="adminGrant" data-arg="${u.username}">${t('grantAdmin')}</button>`; }
  bodyHTML += `<button class="btn-ghost" data-action="openUserLogs" data-arg="${u.username}">${t('viewLogs')}</button>`;
  openPage({ title: u.displayName + t('userDetail'), heroHTML, bodyHTML });
}
function setBanType(username, type){ if (!banDraft[username]) banDraft[username] = { type:'light', reason:'' }; const r = document.getElementById('au_banReason'); if (r) banDraft[username].reason = r.value; banDraft[username].type = type; openUserDetail(username); }
async function confirmBan(username){ if (me.role !== 'superadmin') return; const type = (banDraft[username] && banDraft[username].type) || 'light'; const r = document.getElementById('au_banReason'); const reason = r ? r.value.trim() : ((banDraft[username] && banDraft[username].reason) || '').trim(); const errEl = document.getElementById('banErr'); if (!reason) { if (errEl) errEl.textContent = t('banReasonEmpty'); return; } await update(ref(db,'users/'+username), { banned: { type, reason, bannedAt:Date.now(), bannedBy:me.username } }); delete banDraft[username]; showNotif(t('notifBanned') + ' ' + username); openUserDetail(username); }
async function unban(username){ if (me.role !== 'superadmin') return; await update(ref(db,'users/'+username), { banned:null }); showNotif(t('notifUnbanned')); openUserDetail(username); }
async function adminSaveProfile(username){ const displayName = document.getElementById('au_displayName').value.trim(); const color = document.getElementById('au_color').value.trim(); const errEl = document.getElementById('auErr'), okEl = document.getElementById('auOk'); if (!displayName) { errEl.textContent = t('nameEmpty'); return; } if (!/^#[0-9a-fA-F]{6}$/.test(color)) { errEl.textContent = 'Color'; return; } await update(ref(db,'users/'+username), { displayName, color }); okEl.textContent = '✓ '+t('saved'); }
async function adminPickEmoji(username, emoji){ await update(ref(db,'users/'+username), { avatar:emoji||null }); openUserDetail(username); }
async function adminGrant(username){ await update(ref(db,'users/'+username), { role:'admin' }); showNotif(t('notifGranted')); openUserDetail(username); }
async function adminRevoke(username){ await update(ref(db,'users/'+username), { role:'member' }); showNotif(t('notifRevoked')); openUserDetail(username); }

function updateAdminDot(){ if (!me || (me.role !== 'superadmin' && me.role !== 'admin')) return; const n = Object.values(requests).filter(r => r.status === 'pending').length + pendingNotices.length; if (n > 0) { adminNotifDot.textContent = n; adminNotifDot.classList.remove('hidden'); } else adminNotifDot.classList.add('hidden'); }
function checkPendingNoticeNotif(){ if (!me || (me.role !== 'superadmin' && me.role !== 'admin')) return; const now = Date.now(); pendingNotices.forEach(async p => { if (p.status === 'pending' && p.publishedAt && p.publishedAt <= now) { await set(ref(db,'notices/'+p.id), { ...p, status:'published', autoPublishedAt:now }); await update(ref(db,'noticePending/'+p._key), { status:'approved', autoApproved:true }); } }); }
function showNotif(text){ const el = document.createElement('div'); el.id = 'notifBanner'; el.textContent = text; document.body.appendChild(el); setTimeout(() => el.remove(), 3000); }

applyTheme(); applyLang(); applyI18n();

(async function boot(){
  await checkVersion();
  const saved = sessionStorage.getItem('chat_me');
  if (!saved) { await ensureAIUser().catch(()=>{}); return; }
  try {
    const u = JSON.parse(saved);
    const snap = await get(child(ref(db),'users/'+u.username));
    if (!snap.exists()) { sessionStorage.removeItem('chat_me'); return; }
    const data = snap.val();
    if (data.banned && data.banned.type === 'severe') { sessionStorage.removeItem('chat_me'); return; }
    me = { username:data.username, displayName:data.displayName||data.username, seat:data.seat, color:data.color||'#3b82f6', role:data.role||'member', avatar:data.avatar||null, banned:data.banned||null };
    if (data.theme) { theme = data.theme; localStorage.setItem('chat_theme', theme); applyTheme(); }
    if (data.lang) { lang = data.lang; localStorage.setItem('chat_lang', lang); applyLang(); applyI18n(); }
    await set(ref(db,'presence/'+me.username), true);
    await ensureAIUser();
    runDailySummary().catch(()=>{});
    enterChat();
    if (isReloadAfterVersion()) {
      setTimeout(async () => {
        await restorePageState();
        restoreAllDrafts();
        const url = new URL(location.href);
        url.searchParams.delete('_v');
        history.replaceState(null, '', url.toString());
      }, 500);
    }
  } catch(e) { sessionStorage.removeItem('chat_me'); }
})();
</script>
