/* ═══════════════ 動物農場 ═══════════════
   簡化版：買動物 → 餵食 → 等時間 → 收成換分。
   唔用伺服器定時任務：全部用「現在時間 - 出生時間」即時算，關掉網站都會繼續生長。 */
const FARM_ANIMALS={
  chicken:{n:'雞', ico:'🐔', price:100, yield:25, growMs:3600000},
  cow:    {n:'牛', ico:'🐄', price:300, yield:70, growMs:7200000},
  pig:    {n:'豬', ico:'🐖', price:800, yield:220, growMs:14400000}
};
let farmData={animals:{}, lastFetch:0};
async function loadFarm(force){
  if(!me) return {};
  if(!force && Date.now()-farmData.lastFetch<8000) return farmData;
  try{
    const v=(await get(ref(db,'farm/'+me.username))).val()||{};
    farmData=v; farmData.lastFetch=Date.now();
    return farmData;
  }catch(e){ return {}; }
}
function farmState(a){
  const def=FARM_ANIMALS[a.k]||FARM_ANIMALS.chicken;
  const age=Date.now()-(Number(a.born)||0);
  const hungry=(Date.now()-(Number(a.lastFed)||Number(a.born)||0)) > 86400000;  /* 超過一天沒餵 */
  const ready=age>=def.growMs;
  return {def:def, age:age, ready:ready, hungry:hungry, leftMs:Math.max(0,def.growMs-age)};
}
function fmtLeft(ms){
  if(ms<=0) return '可以收成';
  const m=Math.ceil(ms/60000);
  if(m<60) return m+' 分鐘';
  return Math.floor(m/60)+' 小時 '+(m%60)+' 分';
}
async function openFarmPage(){
  if(!me) return;
  const v=await loadFarm(true);
  const list=Object.keys(v.animals||{}).map(function(id){ return Object.assign({_id:id}, v.animals[id]); });
  const mine=list.map(function(a){
    const st=farmState(a);
    const cls=st.ready?'ready':(st.hungry?'hungry':'');
    return '<div class="farm-cell '+cls+'" data-action="farmTap" data-arg="'+escAttr(a._id)+'">'
      + '<div class="fc-i">'+st.def.ico+'</div>'
      + '<div class="fc-n">'+escapeHtml(st.def.n)+'</div>'
      + '<div class="fc-s">'+(st.ready?('可以收成 +'+st.def.yield):fmtLeft(st.leftMs))+'</div>'
      + (st.hungry?'<div class="fc-s" style="color:#f87171">肚餓（減產）</div>':'')
      + '</div>';
  }).join('');
  const shop=Object.keys(FARM_ANIMALS).map(function(k){
    const d=FARM_ANIMALS[k];
    return '<div class="farm-cell" data-action="farmBuy" data-arg="'+k+'">'
      + '<div class="fc-i">'+d.ico+'</div><div class="fc-n">'+escapeHtml(d.n)+'</div>'
      + '<div class="fc-s">'+d.price+' 分</div></div>';
  }).join('');
  openPage({title:'我的農場', key:'farm', bodyHTML:
    '<div class="card" style="padding:13px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">'
    + '<div style="font-size:12.5px;color:var(--text-sub)">積分</div>'
    + '<div style="font-size:19px;font-weight:800;color:var(--text-main)">'+Number(me.points||0)+'</div></div>'
    + '<div class="section-title">我的動物（'+list.length+'）</div>'
    + (list.length ? '<div class="farm-grid">'+mine+'</div>' : '<div class="empty">還沒有動物，去下面買一隻<div style="font-size:30px;margin-top:10px">🐣</div></div>')
    + '<div class="section-title">買動物</div><div class="farm-grid">'+shop+'</div>'
    + '<div class="card" style="padding:12px 15px;margin-top:12px;font-size:11.5px;color:var(--text-muted);line-height:1.7">'
    + '點自己的動物：可以收成（成熟時）或餵食（免費，肚餓會減產一半）。動物不用餵也會繼續長大，但超過一天沒餵就減產。</div>'
  });
}
async function farmBuy(k){
  const d=FARM_ANIMALS[k]; if(!d||!me) return;
  if(Number(me.points||0)<d.price){ showNotif('積分不足（需要 '+d.price+' 分）'); return; }
  const paid=await changePoints(me.username,-d.price,'買 '+d.n);
  if(!paid){ showNotif('扣分失敗'); return; }
  try{
    const id=push(ref(db,'farm/'+me.username+'/animals')).key;
    await set(ref(db,'farm/'+me.username+'/animals/'+id),{k:k,born:Date.now(),lastFed:Date.now()});
    showNotif('買了一隻'+d.n);
    openFarmPage();
  }catch(e){ showNotif('購買失敗'); }
}
async function farmTap(id){
  const v=await loadFarm(true);
  const a=(v.animals||{})[id]; if(!a) return;
  const st=farmState(a);
  if(st.ready){
    const amount=Math.round(st.def.yield*(st.hungry?0.5:1));
    try{
      await update(ref(db,'farm/'+me.username+'/animals/'+id),{born:Date.now(),lastFed:Date.now()});
      await changePoints(me.username, amount, '農場收成');
      showNCard({title:'收成', html:'<div style="text-align:center;font-size:44px;margin:12px 0">'+st.def.ico+'</div><div style="text-align:center;font-size:14px">'+escapeHtml(st.def.n)+' 收成 <b>+'+amount+' 分</b>'+(st.hungry?'<br><span style="font-size:11.5px;color:#f87171">（肚餓，減產一半）</span>':'')+'</div>', btn:'收下'});
      openFarmPage();
    }catch(e){ showNotif('收成失敗'); }
  }else{
    try{
      await update(ref(db,'farm/'+me.username+'/animals/'+id),{lastFed:Date.now()});
      showNotif('已餵食');
      openFarmPage();
    }catch(e){ showNotif('餵食失敗'); }
  }
}

function openReactionPage(){
  if(!me) return;
  openPage({title:'反應速度', key:'reaction', bodyHTML:
    '<div class="mg-box" id="reBox">'
    + '<div class="mg-big" id="reIco">⏱️</div>'
    + '<div class="mg-msg" id="reMsg">點「開始」，畫面變綠那一刻立刻放手／點下去</div>'
    + '<button class="btn-primary" id="reBtn" style="max-width:190px">開始</button>'
    + '</div>'
    + '<div class="card" style="padding:12px 15px;font-size:11.5px;color:var(--text-muted);line-height:1.7">'
    + '人類平均 250 毫秒。低於 200 算很快，低於 150 已經是職業選手級。'
    + '<br>⚠ 按住不放、看到變綠才鬆手會被判定異常，不算成績。</div>'});
  let state='idle', goAt=0, timer=null;
  const box=document.getElementById('reBox'), ico=document.getElementById('reIco'),
        msg=document.getElementById('reMsg'), btn=document.getElementById('reBtn');
  function reset(t, i, b){
    state='idle'; box.classList.remove('go');
    ico.textContent=i; msg.textContent=t; btn.textContent=b;
  }
  function start(){
    state='wait'; box.classList.remove('go');
    ico.textContent='🔴'; msg.textContent='等等…'; btn.textContent='不要按';
    timer=setTimeout(function(){
      if(state!=='wait') return;
      state='go'; goAt=Date.now();
      box.classList.add('go');
      ico.textContent='🟢'; msg.textContent='按！'; btn.textContent='按！';
    }, 1800+Math.random()*2600);
  }
  /* ⚠ 以前用 onclick（= 手指鬆開才觸發）：
     按住不放、見到變綠就鬆手，測出來會是 50-80 毫秒 —— 人類根本不可能。
     改成 pointerdown（一碰到就計時），按住不放再鬆手不算數。 */
  btn.onpointerdown=function(e){
    try{ e.preventDefault(); }catch(_){}
    if(state==='wait'){
      clearTimeout(timer);
      reset('搶跑了，再試一次','⏱️','開始');
      return;
    }
    if(state==='go'){
      const ms=Date.now()-goAt;
      const tooFast=ms<80;
      reset('','⚡','再測一次');
      if(tooFast){
        msg.textContent=ms+' 毫秒 · 太快了，是不是按住不放？';
      }else{
        msg.textContent=ms+' 毫秒'+(ms<150?'　頂尖！':(ms<200?'　很快':(ms<300?'　正常':'　再練練')));
        addExp(2);
      }
      return;
    }
    start();
  };
}

  const ico=document.getElementById('meIco'), msg=document.getElementById('meMsg'),
        num=document.getElementById('meNum'), inp=document.getElementById('meIn'), btn=document.getElementById('meBtn');
  function startRound(){
    answer='';
    for(let i=0;i<digits;i++) answer+=Math.floor(Math.random()*10);
    state='show';
    num.textContent=answer; num.style.display='block'; inp.style.display='none';
    msg.textContent='記住…'; ico.textContent='👀'; btn.textContent='等等…';
    setTimeout(function(){
      num.style.display='none';
      state='input';
      inp.value=''; inp.style.display='block'; inp.focus();
      msg.textContent='打出來（'+digits+' 位）'; ico.textContent='⌨️'; btn.textContent='確認';
    }, 1400+digits*180);
  }
  btn.onclick=function(){
    if(state==='idle'){ digits=4; startRound(); return; }
    if(state==='input'){
      if(String(inp.value).trim()===answer){
        const pts=digits*5;
        digits++;
        ico.textContent='✅'; msg.textContent='對了！+'+pts+' 經驗，下一關 '+digits+' 位';
        addExp(pts);
        state='idle';
        setTimeout(function(){ startRound(); }, 900);
      }else{
        ico.textContent='❌'; msg.textContent='錯了，答案是 '+answer+'。你到 '+digits+' 位';
        addExp(digits*3);
        state='idle'; inp.style.display='none'; btn.textContent='再玩一次'; digits=4;
      }
    }
  };
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') btn.click(); });
}

/* ═══════════════ 快捷手勢（聊天室左右滑） ═══════════════ */
function bindChatGestures(){
  try{
    const box=document.getElementById('chatBox');
    if(!box||box.dataset.gesture) return;
    box.dataset.gesture='1';
    let sx=0, sy=0, st=0;
    box.addEventListener('touchstart',function(e){
      const t=e.touches[0]; if(!t) return;
      sx=t.clientX; sy=t.clientY; st=Date.now();
    },{passive:true});
    box.addEventListener('touchend',function(e){
      const t=e.changedTouches[0]; if(!t) return;
      if(Date.now()-st>600) return;
      const dx=t.clientX-sx, dy=t.clientY-sy;
      if(Math.abs(dx)<76) return;
      if(Math.abs(dx)<Math.abs(dy)*1.6) return;   /* 直向滑動＝捲動，不攔 */
      if(dx<0){ try{ openMomentsPage(); }catch(err){} }       /* 左滑 → 班級動態 */
      else { try{ if(typeof openPointsPage==='function') openPointsPage(); }catch(err){} }  /* 右滑 → 積分 */
    },{passive:true});
  }catch(e){}
}

/* ═══ 轉賬詳情（照微訊：白底、狀態圖標、大金額、收款按鈕）═══ */
function tfTimeStr(ts){
  const d=new Date(Number(ts)||0);
  const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
function openTransferDetail(msgId){
  if(!me) return;
  const m=allMsgs().find(function(x){ return x.id===msgId; });
  if(!m) return;
  const isMine=(m.username===me.username);
  const isTarget=(m.toUser===me.username);
  if(!isMine&&!isTarget) return;      /* 只有雙方睇得到 */
  const done=!!m.received;
  const amt=Number(m.amount||0);
  const who=isMine?(m.toName||m.toUser||''):(m.displayName||m.username||'');
  const meName=me.displayName||me.username;

  const icon = done
    ? '<div class="tfv-ico ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg></div>'
    : '<div class="tfv-ico wait"><svg viewBox="0 0 24 24" fill="none" stroke="#1aadf0" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3.2 2"/></svg></div>';

  const title = done
    ? (isMine ? (who+' 已收款') : '你已收款，資金已存入餘額')
    : (isMine ? ('待 '+who+' 收款') : '待確認收款');

  let rows = '<div class="tfv-row"><span>轉賬時間</span><b>'+tfTimeStr(m.createdAt)+'</b></div>';
  if(done && m.receivedAt) rows += '<div class="tfv-row"><span>收款時間</span><b>'+tfTimeStr(m.receivedAt)+'</b></div>';

  const noteLine = m.note ? '<div class="tfv-note">'+escapeHtml(m.note)+'</div>' : '';

  const action = (!done && isTarget)
    ? '<button class="tfv-btn" id="tfvGet">收款</button>'
    : (done ? '<div class="tfv-foot">賬單詳情</div>'
            : '<div class="tfv-hint">1 天內未收款，將退款給對方。<a id="tfvBack">立即退還</a></div>');

  openPage({title:'', key:'transferdetail', bodyHTML:
    '<div class="tfv">'
    + icon
    + '<div class="tfv-title">'+escapeHtml(title)+'</div>'
    + '<div class="tfv-amt">¥'+amt+'</div>'
    + (done?'<div class="tfv-sub">餘額</div>':'')
    + noteLine
    + '<div class="tfv-divider"></div>'
    + rows
    + '<div class="tfv-spacer"></div>'
    + action
    + '</div>'
  });

  const g=document.getElementById('tfvGet');
  if(g) g.onclick=async function(){
    g.disabled=true; g.textContent='收款中…';
    try{
      const okPay=await changePoints(m.toUser, Number(m.amount||0), '來自 '+(m.displayName||m.username)+' 的轉賬');
      if(!okPay){ showNotif('收款失敗，請再試'); g.disabled=false; g.textContent='收款'; return; }
      await update(ref(db,'messages/'+m.id),{received:true,receivedAt:Date.now()});
      try{ writeLog('transfer','收 '+m.amount+' 分（來自 '+(m.displayName||m.username)+'）'); }catch(e){}
      showNotif('已收款 ¥'+Number(m.amount||0));
      try{ openTransferDetail(m.id); }catch(e){}
    }catch(e){
      showNotif('收款出錯：'+(e&&e.message||e));
      g.disabled=false; g.textContent='收款';
    }
  };
  const b=document.getElementById('tfvBack');
  if(b) b.onclick=function(){ showNotif('退款功能仲未做，暫停用'); };
}

async function claimRedPacket(msgId){
  if(!me) return;
  /* 拆紅包動畫：卡片中央金色圓轉一圈，感覺似撕開個封口 */
  try{
    const card=document.querySelector('.rp-card[data-arg="'+msgId+'"]');
    if(card){ card.classList.add('spin'); setTimeout(function(){ card.classList.remove('spin'); }, 620); }
  }catch(e){}
  const m=allMsgs().find(function(x){ return x.id===msgId; });
  if(!m) return;
  const claims=m.claims||{};
  if(claims[me.username]){ showRpOpen(claims[me.username], m); return; }
  /* 發紅包的人自己唔可以領（以前漏咗呢個判斷，發完自己點就即刻搶返一蚊，
     等於左手交右手、彩池少一份，其他同學分到的錢變少） */
  if(m.username===me.username){ showNotif('不能領自己發的紅包'); return; }
  if(Number(m.leftCount||0)<=0){ showNotif('紅包已被搶完'); return; }
  /* 二八隨機：先取 1~2 倍平均值，但不超過剩餘 */
  const left=Number(m.left)||0, cnt=Number(m.leftCount)||1;
  const maxTake = Math.max(1, left-(cnt-1));
  let amt;
  if(cnt===1) amt=left;
  else{
    const avg=left/cnt;
    amt=Math.min(maxTake, Math.max(1, Math.round(avg*(0.6+Math.random()*1.1))));
  }
  try{
    const done=await runTransaction(ref(db,'messages/'+msgId), function(cur){
      if(!cur||Number(cur.leftCount)<=0) return cur;
      if(cur.claims&&cur.claims[me.username]) return cur;
      const a=Math.min(Number(cur.left)||0, amt);
      const nc=Object.assign({}, cur.claims||{}); nc[me.username]=a;
      return Object.assign({}, cur, { left:Number(cur.left)-a, leftCount:Number(cur.leftCount)-1, claims:nc });
    });
    if(!done||!done.committed){ showNotif('手慢了，紅包沒了'); return; }
    const nv=done.snapshot.val()||{};
    const got=(nv.claims&&nv.claims[me.username])||amt;
    await changePoints(me.username, got, '拆紅包');
    try{ await runTransaction(ref(db,'rpStats/'+me.username+'/got'), function(c){ return (Number(c)||0)+got; }); }catch(e){}
    showRpOpen(got, nv);
  }catch(e){ showNotif('拆紅包失敗'); }
}
function showRpOpen(amount, msg){
  const old=document.getElementById('rpOpen'); if(old) old.remove();
  const d=document.createElement('div'); d.id='rpOpen';
  d.innerHTML='<div class="rp-box"><div style="font-size:40px">🧧</div>'

    + '<button class="rp-close">收下</button></div>';

  /* 撒花 */
  const c=document.createElement('div'); c.id='rpConfetti';

  let html='';
  for(let i=0;i<22;i++){

  }
  c.innerHTML=html; document.body.appendChild(c);
  setTimeout(()=>{ try{ c.remove(); }catch(e){} }, 2000);
}

/* ═══════════════ 狀態簽名（24 小時自動消失） ═══════════════ */
function statusText(u){
  const st=u&&u.status;
  if(!st||!st.text) return '';
  if(Date.now()-(Number(st.at)||0) > 86400000) return '';   /* 24 小時後自動過期 */
  return st.text;
}

/* 每日聖言：73 句，按「年積日 % 73」循環 —— 每句都會用到。
   ⚠ 原本那個範例用 d.getDate()（1-31），只會用到前 31 句，第 32 句之後永遠不出現。 */
const DAILY_QUOTES = DAILY_VERSES;
function dailyQuote(){
  const d=new Date();
  const doy=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);
  return DAILY_QUOTES[doy % DAILY_QUOTES.length];
}

let allQuotes=[], unsubQuotes=null;

async function askPushPermission(){
  try{
    if(!('Notification' in window)){ showNotif('這個瀏覽器不支援通知'); return; }
    if(Notification.permission==='granted'){ showNotif('通知已開啟'); return; }
    if(Notification.permission==='denied'){ showNotif('通知被封鎖，請到瀏覽器設定開啟'); return; }
    const r=await Notification.requestPermission();
    showNotif(r==='granted'?'通知已開啟':'已取消');
  }catch(e){ showNotif('設定失敗'); }
}
function pushNotify(title, body){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted') return;
    if(document.visibilityState==='visible') return;   /* 正在看就不用彈 */
    new Notification(title,{body:body,icon:'assets/icon-192.png'});
  }catch(e){}
}

/* ═══ 個人主頁天氣卡 ═══
   資料：香港天文台開放數據（data.weather.gov.hk，Access-Control-Allow-Origin: *，可直連）
   圖標：內嵌 SVG，按 icon 碼自動換；全部帶動畫（太陽轉、雲飄、雨落、閃電）。
   失敗時唔阻塞個人主頁 —— 只顯示一行灰字。 */
const WX_PLACE='香港天文台';
function wxIconSVG(code){
  const c=Number(code)||50;
  const sun=`<circle class="sun" cx="32" cy="32" r="11" fill="#fbbf24"/>
    <g class="sun" stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
      <line x1="32" y1="8" x2="32" y2="2"/><line x1="32" y1="56" x2="32" y2="62"/>
      <line x1="8" y1="32" x2="2" y2="32"/><line x1="56" y1="32" x2="62" y2="32"/>
      <line x1="15" y1="15" x2="11" y2="11"/><line x1="49" y1="15" x2="53" y2="11"/>
      <line x1="15" y1="49" x2="11" y2="53"/><line x1="49" y1="49" x2="53" y2="53"/>
    </g>`;
  const cloud=`<path class="cloud" d="M20 44c-5 0-9-3.6-9-8s4-8 9-8c1.6-6 7-10 13.5-10 7.5 0 13.5 5.6 14.5 12.8 4.4.4 8 4 8 8.6 0 4.8-4 8.6-9 8.6z"
    fill="#94a3b8"/>`;
  const cloudDark=`<path class="cloud" d="M20 44c-5 0-9-3.6-9-8s4-8 9-8c1.6-6 7-10 13.5-10 7.5 0 13.5 5.6 14.5 12.8 4.4.4 8 4 8 8.6 0 4.8-4 8.6-9 8.6z"
    fill="#64748b"/>`;
  const drops=`<g stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round">
    <line class="drop" x1="24" y1="48" x2="24" y2="54"/>
    <line class="drop" x1="34" y1="48" x2="34" y2="54"/>
    <line class="drop" x1="44" y1="48" x2="44" y2="54"/></g>`;
  const bolt=`<path class="bolt" d="M34 46l-6 11h6l-3 9 11-13h-6l4-7z" fill="#fbbf24" stroke="#fbbf24" stroke-width="1"/>`;

  if(c>=64&&c<=65) return `<svg viewBox="0 0 64 64">${cloudDark}${bolt}${drops}</svg>`;             /* 雷暴 */
  if((c>=60&&c<=63)||(c>=70&&c<=79)) return `<svg viewBox="0 0 64 64">${cloudDark}${drops}</svg>`;  /* 有雨 */
  if(c>=90) return `<svg viewBox="0 0 64 64">${cloud}${['<line x1="16" y1="52" x2="48" y2="52" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>','<line x1="20" y1="58" x2="44" y2="58" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity=".6"/>'].join('')}</svg>`; /* 霧 */
  if(c>=53&&c<=54) return `<svg viewBox="0 0 64 64">${cloud}</svg>`;                                 /* 多雲 */
  if(c>=50&&c<=52) return `<svg viewBox="0 0 64 64"><g transform="translate(-8,-6) scale(.85)">${sun}</g><g transform="translate(10,14) scale(.72)">${cloud}</g></svg>`; /* 間晴 */
  return `<svg viewBox="0 0 64 64">${sun}</svg>`;                                                    /* 晴 */
}
function wxDesc(code){
  const c=Number(code)||50;
  if(c>=64&&c<=65) return '雷暴';
  if((c>=60&&c<=63)||(c>=70&&c<=79)) return '有雨';
  if(c>=90) return '有霧';
  if(c===54) return '密雲';
  if(c===53) return '多雲';
  if(c>=50&&c<=52) return '短暫陽光';
  if(c>=80&&c<=85) return '大致晴朗';
  return '晴朗';
}
function renderWeatherCard(){
  const d=new Date();
  const ds=d.getMonth()+1+'月'+d.getDate()+'日';
  return '<div class="wx-card" id="wxCard">'
    + '<div class="wx-top"><span class="wx-city">香港 · 天氣</span><span class="wx-date">'+ds+'</span></div>'
    + '<div class="wx-loading" id="wxBody">正在取得天氣…</div>'
    + '</div>';
}
async function loadWeatherCard(){
  const box=document.getElementById('wxBody');
  if(!box) return;
  try{
    const r=await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    const pick=(arr)=>{ const a=(arr&&arr.data)||[]; const hit=a.find(x=>x.place===WX_PLACE); return hit||a[0]||null; };
    const t=pick(j.temperature), h=pick(j.humidity), u=pick(j.uvindex);
    const code=(j.icon&&j.icon[0])||50;
    const temp=t?Math.round(Number(t.value)):'--';
    const hum=h?Math.round(Number(h.value)):'--';
    const uv=u?Number(u.value):null;
    const uvTxt=uv===null?'—':(uv<=2?'低':uv<=5?'中等':uv<=7?'高':uv<=10?'甚高':'極高');
    box.outerHTML='<div id="wxBody">'
      + '<div class="wx-main">'
      +   '<div class="wx-ico">'+wxIconSVG(code)+'</div>'
      +   '<div style="min-width:0">'
      +     '<div class="wx-temp">'+temp+'<span>°C</span></div>'
      +     '<div class="wx-desc">'+wxDesc(code)+'</div>'
      +   '</div>'
      + '</div>'
      + '<div class="wx-sep"></div>'
      + '<div class="wx-grid">'
      +   '<div class="wx-cell"><span class="wx-k">濕度</span><span class="wx-v">'+hum+'%</span></div>'
      +   '<div class="wx-cell"><span class="wx-k">紫外線</span><span class="wx-v">'+(uv===null?'—':uv)+' <span style="font-size:10px;font-weight:500;opacity:.7">'+uvTxt+'</span></span></div>'
      +   '<div class="wx-cell"><span class="wx-k">更新</span><span class="wx-v" style="font-size:11.5px">'+String((j.updateTime||'').slice(11,16)||'—')+'</span></div>'
      + '</div>'
      + '</div>';
  }catch(e){
    box.textContent='暫時取不到天氣資料';
    box.style.color='var(--text-muted)';
  }
}

/* ═══ 積分加減 ═══
   ⚠ chat.html 本身冇 givePoints / takePoints（嗰兩個係 game.html 嘅）。
   之前 doSpin / doDraw / doTransfer 直接叫佢哋 → ReferenceError 被 try/catch 吞咗，
   結果「按了完全冇反應，積分又冇變」。下面補一個自己嘅版本。
   先試交易，失敗（例如值太接近 2^53）就 fallback 讀一次再寫一次。 */
async function changePoints(u, delta, reason){
  if(!u||!delta) return false;
  const path='users/'+u+'/points';
  try{
    const res=await runTransaction(ref(db,path), function(cur){
      if(cur===null||cur===undefined) return null;
      return Math.max(0, (Number(cur)||0)+delta);
    });
    if(res && res.committed){
      if(me && u===me.username) me.points=Math.max(0, Number(me.points||0)+delta);
      try{ renderPoints(); }catch(e){}
      return true;
    }
  }catch(e){}
  try{
    const cur=(await get(ref(db,path))).val();
    const nv=Math.max(0,(Number(cur)||0)+delta);
    await set(ref(db,path), nv);
    if(me && u===me.username) me.points=nv;
    try{ renderPoints(); }catch(e){}
    return true;
  }catch(e){ return false; }
}

    .filter(function(u){ return allUsers[u] && u!==me.username && u!==AI_NAME && allUsers[u].role!=='ai'; })
    .sort(function(a,b){ return (allUsers[a].seat||0)-(allUsers[b].seat||0); })
    .map(function(u){ return '<option value="'+escAttr(u)+'">'+escapeHtml(allUsers[u].displayName||u)+'（'+(allUsers[u].cls||'')+String(allUsers[u].seat||'')+'）</option>'; })
    .join('');
  openPage({title:'積分轉賬', key:'transfer', bodyHTML:
    '<div class="card" style="padding:13px 16px;margin-bottom:14px;font-size:12.5px;color:var(--text-sub);line-height:1.7">'
    + '目前有 <b style="color:var(--text-main);font-size:15px">'+(Number(me.points)||0)+'</b> 分。轉出去的積分不能收回，請確認對方帳號。'
    + '</div>'
    + '<div class="section-title">轉給誰</div><div class="form-row"><select id="tfTo">'+opts+'</select></div>'
    + '<div class="section-title">金額</div><div class="form-row"><input id="tfAmt" type="number" min="1" placeholder="輸入多少分"></div>'
    + '<button class="btn-primary" data-action="doTransfer">轉賬</button>'});

async function doTransfer(){
  if(!me) return;
  const sel=document.getElementById('tfTo'), inp=document.getElementById('tfAmt');
  const to=sel?sel.value:'';
  const amt=Math.floor(Number(inp?inp.value:0)||0);
  if(!to){ showNotif('請選擇對象'); return; }
  if(amt<=0){ showNotif('請輸入正確金額'); return; }
  if(amt>Number(me.points||0)){ showNotif('積分不足（你有 '+(Number(me.points)||0)+' 分）'); return; }
  const nm=allUsers[to]?(allUsers[to].displayName||to):to;
  const ok=await askConfirm({title:'確認轉賬', html:'轉 <b>'+amt+'</b> 分給 <b>'+escapeHtml(nm)+'</b>？轉出後不能收回。', okText:'確定轉'});
  if(!ok) return;
  const paid=await changePoints(me.username, -amt, '轉賬');
  if(!paid){ showNotif('轉賬失敗'); return; }
  await changePoints(to, amt, '來自 '+(me.displayName||me.username)+' 的轉賬');
  try{ writeLog('transfer','轉 '+amt+' 分給 '+to); }catch(e){}
  showNotif('已轉 '+amt+' 分給 '+nm);
  openTransferPage();
}

/* ═══ 每日任務 / 每日轉盤 / 抽卡 / 收藏冊 ═══ */
function todayKey(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
const DAILY_TASKS=[
  {k:'msg', n:'發送 3 則訊息', ico:'💬', max:3},
  {k:'like',n:'給動態點 1 個讚', ico:'❤️', max:1},
  {k:'ck',  n:'完成今日簽到', ico:'📅', max:1}
];
/* 埋點：發訊 / 點讚 / 簽到各呼叫一次。用 increment 避免併發覆蓋。 */
async function bumpDaily(key){
  if(!me||!key) return;
  try{ await update(ref(db,'daily/'+me.username+'/'+todayKey()), { }); }catch(e){}
  try{
    const path='daily/'+me.username+'/'+todayKey()+'/'+key;
    await runTransaction(ref(db,path), function(cur){
      if(cur===null||cur===undefined) return 1;
      return Math.min(99, (Number(cur)||0)+1);
    });
  }catch(e){}
}
async function getDaily(){
  if(!me) return {};
  try{ return (await get(ref(db,'daily/'+me.username+'/'+todayKey()))).val()||{}; }catch(e){ return {}; }
}
async function claimDaily(){
  if(!me) return;
  const d=await getDaily();
  const all=DAILY_TASKS.every(function(t){ return (Number(d[t.k])||0)>=t.max; });
  if(!all){ showNotif('還有任務沒完成'); return; }
  if(d.claimed){ showNotif('今日已領過'); return; }
  try{
    await changePoints(me.username, 200, '每日任務');
    await update(ref(db,'daily/'+me.username+'/'+todayKey()), {claimed:true});
    showNotif('已領 +200 分');
    openDailyPage();
  }catch(e){ showNotif('領取失敗'); }

  if(!me) return;
  openPage({title:'排行榜', key:'rank', bodyHTML:

async function paintRank(kind){
  const box=document.getElementById('rankBody'); if(!box) return;
  try{
    if(!_rankCache){
      const [us,ck]=await Promise.all([ get(ref(db,'users')), get(ref(db,'checkin')) ]);
      _rankCache={ users:us.val()||{}, checkin:ck.val()||{} };
    }
    const {users,checkin}=_rankCache;
    const rows=Object.keys(users).filter(function(k){ return users[k] && users[k].role!=='ai'; }).map(function(k){
      const u=users[k], c=checkin[k]||{};
      return { k:k, name:(u.displayName||k), exp:Number(u.exp)||0, pts:Number(u.points)||0,
               ck:Number(c.total)||0, lv:levelOf(u.exp), banned:!!u.banned };
    });
    const key = kind==='points'?'pts' : (kind==='checkin'?'ck':'exp');
    rows.sort(function(a,b){ return (b[key]||0)-(a[key]||0); });
    const top=rows.slice(0,30);
    box.innerHTML = top.map(function(r,i){
      const no=i+1;
      const cls = no===1?'top1':no===2?'top2':no===3?'top3':'';
      const val = kind==='points'?r.pts : (kind==='checkin'?r.ck+' 天':'Lv.'+r.lv);
      return '<div class="rank-row"><div class="rank-no '+cls+'">'+no+'</div>'
        + '<div style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escapeHtml(r.name)+'</div>'
        + '<div class="rank-val">'+escapeHtml(String(val))+'</div></div>';
    }).join('') || '<div class="empty">暫時沒有資料</div>';
  }catch(e){ box.innerHTML='<div class="empty">載入失敗</div>'; }
}

/* ═══ 班級動態圈 ═══
   跟聊天室分開：聊天室是即時對話，會被洗走；動態圈是「留下來」的。
   獨立節點 moments，只訂閱最近 60 條。 */
let allMoments=[], unsubMoments=null;
function fmtAgo(ts){
  const d=Math.max(0,Date.now()-(Number(ts)||0));
  const mi=Math.floor(d/60000), h=Math.floor(d/3600000), dy=Math.floor(d/86400000);
  if(mi<1) return '剛剛';
  if(mi<60) return mi+' 分鐘前';
  if(h<24) return h+' 小時前';
  if(dy<30) return dy+' 天前';
  return new Date(Number(ts)||0).toLocaleDateString();
}
function subscribeMoments(){
  if(unsubMoments){ try{ unsubMoments(); }catch(e){} }
  unsubMoments = onValue(query(ref(db,'moments'), orderByChild('createdAt'), limitToLast(60)), snap=>{
    const v = snap.val() || {};
    allMoments = Object.keys(v).map(function(k){ return Object.assign({_k:k}, v[k]); })
      .sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    if(currentPageKey==='moments') paintMoments();
  });
}
function momentHTML(m){

  const mine = me && likes[me.username];
  const cmList = Object.keys(cms).map(function(k){ return cms[k]; }).sort(function(a,b){ return (a.at||0)-(b.at||0); });
  const av = String(m.displayName||'?').slice(0,2);
  return '<div class="card" style="padding:14px 16px;margin-bottom:12px">'
    + '<div style="display:flex;align-items:center;gap:9px;margin-bottom:9px">'
    +   '<div class="avatar" style="width:30px;height:30px;font-size:12px;background:'+(m.color||'#3b82f6')+'">'+escapeHtml(av)+'</div>'
    +   '<div><div style="font-size:13px;font-weight:700;color:var(--text-main)">'+escapeHtml(m.displayName||m.username)+'</div>'
    +   '<div style="font-size:10.5px;color:var(--text-muted)">'+fmtAgo(m.createdAt)+'</div></div>'
    + '</div>'
    + '<div style="font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--text-main)">'+escapeHtml(m.text||'')+'</div>'
    + '<div style="display:flex;gap:16px;margin-top:12px;font-size:12.5px;color:var(--text-sub)">'

    +   '<span style="cursor:pointer" data-action="toggleCmBox" data-arg="'+escAttr(m._k)+'">💬 '+cmList.length+'</span>'
    + '</div>'
    + '<div id="cmb_'+escAttr(m._k)+'" style="display:none;margin-top:10px">'
    +   cmList.map(function(c){
          return '<div style="font-size:12px;padding:6px 0;border-top:1px solid var(--border);color:var(--text-main)">'
            + '<b>'+escapeHtml(c.displayName||c.username)+'</b>：'+escapeHtml(c.text||'')+'</div>';
        }).join('')
    +   '<div style="display:flex;gap:6px;margin-top:8px">'
    +     '<input id="cm_'+escAttr(m._k)+'" placeholder="留言…" style="flex:1;min-width:0;padding:8px 11px;border-radius:11px;border:1px solid var(--border);background:var(--bg-input);color:var(--text-main);font-size:12.5px;font-family:inherit">'
    +     '<button class="btn-ghost" style="width:auto;padding:8px 15px;font-size:12px;margin:0;flex:0 0 auto;border-radius:10px" data-action="cmMoment" data-arg="'+escAttr(m._k)+'">送出</button>'
    +   '</div>'

}

function darkenColor(hex,amt){ const h=String(hex).replace('#','');if(h.length!==6)return hex;let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);r=Math.max(0,r-amt);g=Math.max(0,g-amt);b=Math.max(0,b-amt);return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }

async function submitFeedback(){
  const isLogin=!me;
  const nameEl=document.getElementById('fbName');
  const textEl=isLogin?document.getElementById('fbText'):document.getElementById('profileFb');
  if(!textEl)return;
  const text=textEl.value.trim();
  const pageEl=document.getElementById('fbPage');
  const subEl=document.getElementById('fbSub');
  const pageKey=pageEl?pageEl.value:'';
  const pageName=(FB_PAGES.find(function(x){return x.k===pageKey;})||{}).n||'';
  const subVal=subEl?subEl.value:'';
  if(!pageKey){showNotif('請先選是哪個頁面');return;}
  if(subVal==='請選擇…'){showNotif('請選具體位置');return;}
  if(!text||text.length<4){showNotif('請寫清楚發生什麼事（至少 4 個字）');return;}
  let name=isLogin?(nameEl?nameEl.value.trim():''):(me.displayName||me.username);
  if(isLogin&&!name){showNotif('請輸入名稱');return;}
  if(isLogin){
    const key='fb_rate_'+Date.now();
    const list=JSON.parse(localStorage.getItem('fb_rate')||'[]');
    const recent=list.filter(t=>Date.now()-t<3600000);
    if(recent.length>=4){showNotif('一小時內最多 4 次，請稍後再試');return;}
    recent.push(Date.now());localStorage.setItem('fb_rate',JSON.stringify(recent));
  }
  // loading 狀態：找到對應的送出按鈕，避免使用者重複點擊
  const submitBtn=document.querySelector('[data-action="submitFeedback"]');
  if(submitBtn){submitBtn.disabled=true;submitBtn.classList.add('btn-loading');submitBtn.dataset.orig=submitBtn.textContent;submitBtn.textContent='送出中...';}
  try{
    /* 以前用 AI 判斷「是否胡說」，但經常誤殺正常描述（例：「五子棋卡住」）。
       現在有頁面 + 位置兩層結構，垃圾反饋成本已經很高，直接跳過 AI 判斷。 */
    const id='fb_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    await set(ref(db,'feedbacks/'+id),{id,fromUser:isLogin?null:me.username,fromName:name,fromSeat:isLogin?null:me.seat,
      page:pageKey,pageName:pageName,sub:subVal,text,status:'pending',createdAt:Date.now()});
    textEl.value='';if(nameEl)nameEl.value='';
    showNotif('已送出反饋');
  }catch(e){}
  finally{
    if(submitBtn){submitBtn.disabled=false;submitBtn.classList.remove('btn-loading');submitBtn.textContent=submitBtn.dataset.orig||'送出';}
  }
}

   這裡把同一組數字搬進後台，再加上「誰佔最多」跟「一鍵清掉大圖」。

   數字怎麼來的：

     * 每月下載：上面那個數字 × 本月實際開頁次數（meta/stats/monthly）
   這是估算值。真正的帳單數字只有 Firebase Console 有，但趨勢跟「誰造成的」

   伺服器每 10 秒把 meta/gamewsInfo（自己的 uptime、人數、房間、記憶體…）
   和 meta/gamewsBeat（心跳）寫進 Firebase，這裡只負責讀與顯示。

let usageLiveTimer=null;

const SRV_OWNER_FALLBACK='梁喆的 NAS';

/* 判斷伺服器狀態，順便把「為甚麼連不上」講清楚（用戶要的錯誤碼） */
function srvJudge(info, beat, down){
  const now=Date.now();
  const b=Number(beat)||0;
  const ageSec=b?Math.round((now-b)/1000):null;
  if(!b) return {k:'off', label:'從未連線', code:'NO_DATA', detail:'冇任何心跳紀錄，可能從未啟動過', age:null};
  if(down&&down.at&&now-Number(down.at)<86400000){
    const d=Math.round((now-Number(down.at))/1000);
    return {k:'off', label:'已關機', code:'SHUTDOWN', detail:'伺服器正常關機（'+d+' 秒前發出下線通知）', age:ageSec};
  }
  if(ageSec>120) return {k:'off', label:'離線', code:'TIMEOUT', detail:'心跳停了 '+ageSec+' 秒（超過 120 秒判定離線）', age:ageSec};
  if(ageSec>45) return {k:'warn', label:'心跳遲緩', code:'DELAY', detail:'心跳已 '+ageSec+' 秒沒更新（正常 10 秒一次）', age:ageSec};
  if(!info) return {k:'warn', label:'在線（資料未齊）', code:'NO_INFO', detail:'有心跳但讀不到狀態，等一下會補上', age:ageSec};
  return {k:'on', label:'在線', code:'OK', detail:'心跳正常（'+ageSec+' 秒前）', age:ageSec};
}
function fmtUptime(sec){
  const n=Number(sec)||0;
  if(n<60) return n+' 秒';
  if(n<3600) return Math.floor(n/60)+' 分 '+(n%60)+' 秒';
  const h=Math.floor(n/3600), m=Math.floor((n%3600)/60);
  if(h<24) return h+' 小時 '+m+' 分';
  return Math.floor(h/24)+' 日 '+(h%24)+' 小時';
}

/* 機器資源：CPU／記憶體／硬碟／正在跑的程式 */
function sysBlockHTML(sys){
  if(!sys) return `<div style="font-size:11.5px;color:var(--text-muted);margin:8px 0">正在採集機器數據…（伺服器每 10 秒上報一次）</div>`;
  const cpu=Number(sys.cpu)||0;
  const memPct=Number(sys.memPct)||0;
  const disks=sys.disk||{};
  const procs=(sys.procs||[]);
  const cpuColor=cpu>=85?'#ef4444':(cpu>=60?'#f59e0b':'#22c55e');

  let h=`<div class="section-title" style="margin-top:4px">機器資源</div>`;
  h+=`<div style="display:flex;justify-content:space-between;font-size:12px">
        <span style="color:var(--text-sub)">CPU（${sys.cores||0} 核）</span>
        <span style="color:${cpuColor};font-weight:700;font-variant-numeric:tabular-nums">${cpu}%</span></div>`;
  h+=srvBar(cpu);

  h+=`<div style="display:flex;justify-content:space-between;font-size:12px">
        <span style="color:var(--text-sub)">記憶體</span>
        <span style="color:var(--text-main);font-weight:600;font-variant-numeric:tabular-nums">${sys.memUsedMB||0} / ${sys.memTotalMB||0} MB（${memPct}%）</span></div>`;
  h+=srvBar(memPct);

  for(const d of Object.keys(disks)){
    const x=disks[d];
    h+=`<div style="display:flex;justify-content:space-between;font-size:12px">
          <span style="color:var(--text-sub)">硬碟 ${d}</span>
          <span style="color:var(--text-main);font-weight:600;font-variant-numeric:tabular-nums">${fmtGB(x.used)} / ${fmtGB(x.total)}（${x.pct}%）</span></div>`;
    h+=srvBar(x.pct);
  }

  h+=`<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0">
        <span style="color:var(--text-sub)">系統已運行</span>
        <span style="color:var(--text-main);font-weight:600">${fmtUptime(sys.osUptime)}</span></div>`;

  h+=`<div class="section-title" style="margin-top:10px">正在運行的程式（${sys.procCount||0} 個）</div>`;
  if(!procs.length){
    h+=`<div style="font-size:11.5px;color:var(--text-muted)">尚未採集完成（每 30 秒更新一次）</div>`;
  }else{
    h+=`<div style="font-size:11.5px;color:var(--text-sub);line-height:1.75">`;
    for(const p of procs){
      const mb=Math.round((Number(p.memKB)||0)/1024);
      h+=`<div style="display:flex;justify-content:space-between;gap:10px">
            <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(p.name||'?')}
              <span style="color:var(--text-muted)">· ${p.pid||'—'}</span></span>
            <span style="font-variant-numeric:tabular-nums;color:var(--text-main)">${mb} MB</span></div>`;
    }
    h+=`</div>`;
    h+=`<div style="font-size:10.5px;color:var(--text-muted);margin-top:4px">按記憶體排序，只列前 10 個</div>`;
  }
  return h;
}


function srvCardHTML(info, beat, down){

   用 transaction 而不是「讀-加一-寫回」，否則多人同時開頁會漏算。 */
async function countPageLoad(){
  try{
    const ym=new Date().toISOString().slice(0,7);
    await runTransaction(ref(db,'meta/stats/monthly/'+ym),c=>(Number(c)||0)+1);
  }catch(e){}

/* 逐一節點抓下來量大小。整庫不到 1 MB，掃一次零點幾秒。 */
async function scanUsage(){
  const sizes={}; const failed=[]; let total=0; let msgsObj=null;
  for(const node of USAGE_NODES){
    try{
      const snap=await get(ref(db,node));
      const v=snap.exists()?snap.val():null;
      const b=bytesOf(v);
      sizes[node]={bytes:b,count:(v&&typeof v==='object')?Object.keys(v).length:(v==null?0:1)};
      total+=b;
      if(node==='messages')msgsObj=(v&&typeof v==='object')?v:{};
    }catch(e){ failed.push(node); sizes[node]={bytes:0,count:0}; }
  }
  return {sizes,failed,total,msgs:msgsObj||{}};
}

function usageSummary(scan,loads){
  const {sizes,msgs,total}=scan;
  const byType={},byUser={},media=[];
  for(const k of Object.keys(msgs)){
    const m=msgs[k]||{},b=bytesOf(m),t=m.type||'text',u=m.username||'?';
    (byType[t]=byType[t]||{n:0,b:0}); byType[t].n++; byType[t].b+=b;
    (byUser[u]=byUser[u]||{n:0,b:0,media:0}); byUser[u].n++; byUser[u].b+=b;
    if(t==='image'||t==='file'||t==='voice'){ byUser[u].media+=b; media.push({k,m,b,t}); }
  }
  media.sort((a,b)=>b.b-a.b);
  const sorted=Object.keys(msgs).map(k=>({k,m:msgs[k]||{}}))
    .sort((a,b)=>((a.m.createdAt)||0)-((b.m.createdAt)||0));
  const win=sorted.slice(-MSG_WINDOW);
  const winBytes=win.reduce((s,x)=>s+bytesOf(x.m),0);
  const usersBytes=(sizes.users&&sizes.users.bytes)||bytesOf(allUsers);
  return {
    byType,byUser,media,
    windowCount:win.length,windowBytes:winBytes,usersBytes,
    perOpen:winBytes+usersBytes,
    monthDown:(winBytes+usersBytes)*loads,
  };
}

/* ═══ v1.18 Google 官方用量（真實數字） ═══
   上面那些是「本站估算」，只能用我們自己發出的請求去推。

   金鑰永遠不會出現在網頁上（放前端等於公開）。 */
async function renderGcpUsageBlock(){
  let g=null;
  try{
    const snap=await get(child(ref(db),'meta/gcpUsage'));
    g=snap.exists()?snap.val():null;
  }catch(e){}

  if(!g||!g.fetchedAt){
    return `<div class="section-title">Google 官方數據</div>
    <div class="card" style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-2);padding:14px 16px;margin-bottom:12px">

        這裡可以顯示 Firebase 主控台那一頁的<b style="color:var(--text-main)">真實</b>用量
        （真的下載了多少、實際儲存多少），但需要一組 Google 服務帳號金鑰才能讀。<br>
        金鑰只會放在你電腦本機，不會上傳、也不會出現在網站上。<br>
        <div style="margin-top:9px;font-size:12.5px;color:var(--text-muted)">
          設定步驟：在專案目錄執行 <code style="background:var(--bg-input);padding:2px 7px;border-radius:var(--r-0)">python _gcp_usage.py --guide</code>
        </div>
      </div>
    </div>`;
  }

  const when=new Date(g.fetchedAt).toLocaleString('zh-TW');
  const days=Number(g.days)||30;
  const down=Number(g.downloadBytes)||0;
  const store=Number(g.storageBytes)||0;
  const monthly=days>0?down/days*30:0;          // 換算成一個月，才能跟免費額度比
  const downPct=monthly/QUOTA_DOWN_BYTES*100;
  const storePct=store/QUOTA_STORE_BYTES*100;
  const daily=(g.downloadDaily||[]).slice(-14);
  const maxDaily=Math.max(1,...daily.map(d=>Number(d.bytes)||0));

  let bars='';
  if(daily.length){
    bars=`<div style="font-size:11.5px;color:var(--text-muted);margin-bottom:6px">每日下載（最近 ${daily.length} 天）</div>
    <div style="display:flex;align-items:flex-end;gap:3px;height:56px;margin-bottom:4px">`;
    for(const d of daily){
      const h=Math.max(2,(Number(d.bytes)||0)/maxDaily*100);
      bars+=`<div title="${escapeHtml(d.date)}　${fmtBytes(d.bytes)}"
        style="flex:1;min-width:3px;height:${h}%;border-radius:var(--r-0) var(--r-0) 0 0;background:linear-gradient(180deg,#22d3ee,#3b82f6)"></div>`;
    }
    bars+=`</div><div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-muted)">
      <span>${escapeHtml(daily[0].date.slice(5))}</span><span>${escapeHtml(daily[daily.length-1].date.slice(5))}</span></div>`;
  }

  return `<div class="section-title">Google 官方數據（真實，非估算）</div>
  <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:10px">
    取自 Google Cloud Monitoring；最後更新 ${escapeHtml(when)}（近 ${days} 天）
  </div>
  ${usageCard('下載量（換算成一個月）',
     `${fmtBytes(monthly)} <span style="font-size:14px;color:var(--text-muted);font-weight:600">/ 10 GB</span>`,
     `近 ${days} 天實際 ${fmtBytes(down)}　｜　這是最接近帳單的數字`,
     downPct,
     '免費方案每月 10 GB')}
  ${usageCard('目前儲存',
     `${fmtBytes(store)} <span style="font-size:14px;color:var(--text-muted);font-weight:600">/ 1 GB</span>`,
     '整個資料庫實際佔用的空間',
     storePct,
     '免費方案 1 GB')}
  <div class="card" style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-2);padding:13px 16px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-sub)">
      <span>同時連線數（尖峰）</span><b style="color:var(--text-main)">${Number(g.peakConnections)||0}</b></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-sub);margin-top:7px">
      <span>資料庫負載（尖峰）</span><b style="color:var(--text-main)">${((Number(g.peakLoad)||0)*100).toFixed(2)}%</b></div>
    <div style="font-size:11.5px;color:var(--text-muted);margin-top:8px">負載長期接近 100% 就會開始變慢</div>
  </div>
  ${bars}
  <div style="height:10px"></div>`;
}

async function purgeMedia(key){
  if(me.role!=='superadmin')return;
  const snap=await get(child(ref(db),'messages/'+key));
  if(!snap.exists()){showNotif('訊息不存在');return;}
  const m=snap.val()||{};
  const before=bytesOf(m);
  const label=m.type==='image'?'圖片':(m.type==='voice'?'語音':(m.type==='file'?'檔案':'媒體'));
  if(!(await askConfirm({title:'清除媒體',html:'確定清除這則'+label+'？（約 '+fmtBytes(before)+'）',danger:true,okText:'清除'})))return;
  try{
    await update(ref(db,'messages/'+key),{
      type:'text',text:'（'+label+'已由管理員清除，釋出 '+fmtBytes(before)+'）',
      imageUrl:null,fileUrl:null,audioUrl:null,fileName:null,fileSize:null,duration:null,
      purged:true,purgedAt:Date.now(),purgedBy:me.username,
    });
    await writeLog('purge','清除訊息媒體，釋出 '+before+' bytes');
    showNotif('已清除 '+fmtBytes(before));
    const body=document.getElementById('adminBody');
    if(body)await renderUsageTab(body);
  }catch(e){showNotif('清除失敗');}
}

async function purgeOldMedia(){
  if(me.role!=='superadmin')return;
  const cutoff=Date.now()-30*86400000;
  const {msgs}=await scanUsage();
  const targets=Object.keys(msgs).filter(k=>{
    const m=msgs[k]||{};
    return (m.type==='image'||m.type==='voice'||m.type==='file')&&(m.createdAt||0)<cutoff&&!m.purged;
  });
  if(!targets.length){showNotif('30 天前沒有可清除的媒體');return;}
  const total=targets.reduce((s,k)=>s+bytesOf(msgs[k]),0);
  if(!(await askConfirm({title:'批量清除媒體',html:'要清除 '+targets.length+' 則 30 天前的媒體嗎？\n合計約 '+fmtBytes(total)+'\n（訊息與文字會保留）',danger:true,okText:'清除'})))return;
  let done=0;
  for(const k of targets){
    try{
      const m=msgs[k]||{};
      const label=m.type==='image'?'圖片':(m.type==='voice'?'語音':'檔案');
      await update(ref(db,'messages/'+k),{
        type:'text',text:'（'+label+'已由管理員清除，釋出 '+fmtBytes(bytesOf(m))+'）',
        imageUrl:null,fileUrl:null,audioUrl:null,fileName:null,fileSize:null,duration:null,
        purged:true,purgedAt:Date.now(),purgedBy:me.username,
      });
      done++;

  }
  await writeLog('purge','批次清除 '+done+' 則舊媒體');

async function checkUsageWarning(){

  try{
    const win=messages.slice(-MSG_WINDOW);
    const winBytes=win.reduce((s,m)=>s+bytesOf(m),0);
    const perOpen=winBytes+bytesOf(allUsers);
    const ym=new Date().toISOString().slice(0,7);
    const snap=await get(child(ref(db),'meta/stats/monthly/'+ym));
    const loads=snap.exists()?(Number(snap.val())||0):0;
    const pct=perOpen*loads/QUOTA_DOWN_BYTES*100;
    if(pct<70)return;
    const old=document.getElementById('usageWarn');if(old)old.remove();

    el.classList.add('anim-in-notif');

    const usedColors=Object.values(allVal).map(u=>u.color).filter(c=>c&&/^#[0-9a-fA-F]{6}$/.test(c));
    const newColor=generateUniqueColor(usedColors);
    await set(ref(db,'users/'+username),{username,password,displayName,seat,class:cls,color:newColor,role:'member',avatar:null,banned:null,disabled:false,neverLoggedIn:true,createdAt:Date.now()});

function generateUniqueColor(existing){
  function randHex(){return Math.floor(Math.random()*16777216);}
  function hexStr(n){return '#'+n.toString(16).padStart(6,'0');}
  function rgb(n){return [(n>>16)&255,(n>>8)&255,n&255];}
  function diff(a,b){return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2]);}
  const existRGB=existing.map(h=>{const hh=h.replace('#','');return [parseInt(hh.substr(0,2),16),parseInt(hh.substr(2,2),16),parseInt(hh.substr(4,2),16)];});
  for(let i=0;i<1000;i++){const n=randHex();const c=rgb(n);const lum=(0.299*c[0]+0.587*c[1]+0.114*c[2])/255;if(lum<0.2)continue;let ok=true;for(const e of existRGB){if(diff(c,e)<100){ok=false;break;}}if(ok)return hexStr(n);}
  return hexStr(randHex());
}

async function handleRequest(key,action){
  if(!key)return;
  const snap=await get(ref(db,'requests/'+key));if(!snap.exists())return;
  const req=snap.val();
  if(action==='approve'){
    if(req.type==='appeal'){
      const nSnap=await get(ref(db,'systemNotices/'+req.from+'/'+req.noticeKey));
      if(nSnap.exists()){
        const n=nSnap.val();
        if(n.msgId){
          const mSnap=await readQueryOnce(query(ref(db,'messages'),orderByChild('createdAt'),limitToLast(300)));
          const mVal=mSnap.val()||{};
          const mkey=Object.keys(mVal).find(k=>mVal[k].id===n.msgId);
          if(mkey){await update(ref(db,'messages/'+mkey),{deleted:false,deletedAt:null,deletedBy:null});}
        }
      }
      await pushSystemNotice(req.from,{type:'appeal_approved',title:'申訴成功',body:'你的申訴已通過，訊息已恢復。',createdAt:Date.now(),read:false});
    } else if(req.msgId){
      const mSnap=await readQueryOnce(query(ref(db,'messages'),orderByChild('createdAt'),limitToLast(300)));
      const mVal=mSnap.val()||{};
      const mkey=Object.keys(mVal).find(k=>mVal[k].id===req.msgId);
      if(mkey)await update(ref(db,'messages/'+mkey),{deleted:true,deletedAt:Date.now(),deletedBy:me.username});
    }
    await update(ref(db,'requests/'+key),{status:'approved',handledAt:Date.now(),handledBy:me.username});
  } else {
    await update(ref(db,'requests/'+key),{status:'rejected',handledAt:Date.now(),handledBy:me.username});
    if(req.type==='appeal'&&req.from){ await pushSystemNotice(req.from,{type:'appeal_rejected',title:'申訴被拒絕',body:'你的申訴已被拒絕。',createdAt:Date.now(),read:false}); }
  }
  renderAdminTab('requests');
}

      total: Number(c.total)||0,
      last: c.last || '',
      ob: (u.obDone === false) ? false : true
    };
  }).sort(function(x,y){
    if(y.total !== x.total) return y.total - x.total;
    return String(x.name).localeCompare(String(y.name));
  });
  const today = _dayStr(0);
  let h = '<div style="font-size:11.5px;color:var(--text-muted);line-height:1.7;margin:0 0 12px">'
        + '共 '+rows.length+' 人。「格」= 本輪七日進度（滿 7 送禮物後重新開始）。'
        + '<br>清零只清進度，不會扣已拿到的積分。</div>';
  h += '<div style="font-size:12.5px">';
  for(let i=0;i<rows.length;i++){
    const r = rows[i];
    const dots = (function(){
      let o='';
      for(let d=1; d<=7; d++){
        const on = d <= r.cycle;
        o += '<span style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:2px;background:'
           + (on?'#fbbf24':'rgba(148,163,184,.28)') + '"></span>';
      }
      return o;
    })();
    const signed = (r.last === today);
    h += '<div style="padding:7px 0;border-bottom:1px solid var(--border)">'
      +   '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
      +     '<span style="font-weight:700;color:var(--text-main)">'+escapeHtml(r.name)+'</span>'
      +     '<span style="font-size:10.5px;color:var(--text-muted)">'+escapeHtml(r.k)+'</span>'
      +     (r.role!=='member'?'<span style="font-size:10px;color:var(--purple-tx)">'+escapeHtml(r.role)+'</span>':'')
      +     (signed?'<span style="font-size:10px;color:#4ade80">今日已簽</span>':'')
      +     (r.ob===false?'<span style="font-size:10px;color:#fbbf24">待看引導</span>':'')
      +     '<span style="margin-left:auto;font-size:11px;color:var(--text-sub);font-variant-numeric:tabular-nums">'
      +       dots + ' <b>'+r.cycle+'/7</b>　連 '+r.streak+' 天　共 '+r.total+' 次'
      +     '</span>'
      +   '</div>'
      +   '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">'
      +     (isSuper
              ?   '<button class="btn-ghost" style="margin:0;padding:4px 11px;font-size:11px;width:auto;flex:0 0 auto;border-radius:8px;line-height:1.25;min-height:0" data-action="ckSet" data-arg="'+escAttr(r.k)+'" data-arg2="0">清零</button>'
                + '<button class="btn-ghost" style="margin:0;padding:4px 11px;font-size:11px;width:auto;flex:0 0 auto;border-radius:8px;line-height:1.25;min-height:0" data-action="ckSet" data-arg="'+escAttr(r.k)+'" data-arg2="7">補到 7</button>'
              :   '')
      +     '<button class="btn-ghost" style="margin:0;padding:4px 11px;font-size:11px;width:auto;flex:0 0 auto;border-radius:8px;line-height:1.25;min-height:0" data-action="ckOb'+(r.ob===false?'Done':'Reset')+'" data-arg="'+escAttr(r.k)+'">'
      +       (r.ob===false?'標記已看過':'讓他重看引導')+'</button>'
      +   '</div>'
      + '</div>';
  }
  h += '</div>';
  return h;
}

    }).join('');

async function submitCreateGroup(){

/* 群聊訊息是否已經成功同步過一次 —— 用來分開「仲喺度載入」同「真係冇訊息」。
   以前兩者都顯示「還沒有訊息，說點什麼吧！」，弱網時會誤導。 */
let groupMsgsReady=false;

async function openGroupChat(groupKey){
  if(!me)return;
  const seq=navStart();
  groupMsgsReady=false;
  let snap;
  try{
    snap=await pGet('groups/'+groupKey,10000);
  }catch(err){
    /* 同上：超時一定要有反饋 */
    netFailPage('載入不到','openGroupChat',groupKey,'groupChat:'+groupKey);
    return;
  }
  if(!navAlive(seq))return;
  if(!snap.exists()){showNotif('群聊不存在');return;}
  const g=snap.val();
  if(!g.members||!g.members[me.username]){showNotif('你不在這個群聊');return;}
  currentGroupKey=groupKey;
  if(unsubGroupMsgs)unsubGroupMsgs();
  unsubGroupMsgs=onValue(ref(db,'groupMessages/'+groupKey),snap2=>{
    const val=snap2.val()||{};
    currentGroupMsgs=Object.keys(val).map(k=>({_key:k,...val[k]})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    groupMsgsReady=true;
    renderGroupChat(groupKey,g);
  },function(){
    /* 訂閱失敗（權限／網絡）—— 至少讓畫面知道不是「沒有訊息」 */
    renderGroupChat(groupKey,g);
  });
  renderGroupChat(groupKey,g);
}
/* ═══ v1.37 私人群聊：功能對齊公共聊天室（唯一沒有小遊戲）═══
   用戶要求：「新增私人群聊，也可以跟公共聊天室一樣發：視頻通話、公告還有等等，除了沒有小遊戲。」
   以前群聊只有純文字 + 通話；圖片／檔案／位置／語音／投票／公告全部沒有。
   現在：
     · 訊息型別：text / image / file / voice / location / poll / call / notice
     · 輸入列多了「+」面板（圖片／檔案／位置／投票／公告／視訊通話）＋ 自己的麥克風按鈕
     · 群公告由群主或管理員設定，固定顯示在訊息列表最上面一條
     · 投票沿用公共聊天室那一套（renderPollBody 完全共用），只差寫入路徑 */
function groupMsgBody(m){
  const t=m.type||'text';
  if(t==='image'){const iu=String(m.imageUrl==null?'':m.imageUrl);return `<img class="msg-img" src="${escAttr(iu)}" data-action="viewImage" data-arg="${escAttr(iu)}">`;}
  if(t==='file')return `<div class="file-msg"><span class="fi">[F]</span><div style="flex:1;min-width:0"><div class="fn">${escapeHtml(m.fileName||'file')}</div><div class="fs">${formatSize(m.fileSize||0)}</div></div></div>`;
  if(t==='voice')return `<div class="voice-msg" data-action="playGroupVoice" data-arg="${escAttr(m.id)}"><span class="vi"><svg class="ico"><use href="#i-voice"/></svg></span><span class="vt">0:${String(Math.round(m.duration||0)).padStart(2,'0')}</span><div class="vp"><div></div></div><span class="vd"></span></div>`;
  if(t==='location'){const la=Number(m.lat)||0,ln=Number(m.lng)||0;return `<div class="loc-msg${locNewCls(m.createdAt)}" data-action="openLocation" data-arg="${la},${ln}">${locPreviewHTML(la,ln)}<div class="lm-label">[L] ${escapeHtml(m.placeName||'')}</div></div>`;}
  if(t==='poll')return renderPollBody(m);
  if(t==='call')return `<span class="callChip"><svg class="ico"><use href="#i-video"/></svg>${escapeHtml(m.text||'視訊通話')}</span>`;
  if(t==='notice')return `<span class="callChip"><svg class="ico"><use href="#i-megaphone"/></svg>${escapeHtml(m.text||'群公告')}</span>`;
  return escapeHtml(m.text||'').replace(/@([a-zA-Z0-9_]+)/g,'<span class="mention">@$1</span>').replace(/\n/g,'<br>');
}
/* 誰可以改群公告：群組建立者或管理員 */
function canEditGroupNotice(g){
  if(!me||!g)return false;
  if(me.role==='superadmin'||me.role==='admin')return true;
  return !!(g.creator&&g.creator===me.username);
}
function groupNoticeHTML(g){
  const n=g&&g.notice;
  if(!n||!String(n.text||'').trim())return '';
  const ed=canEditGroupNotice(g)?`<button class="gn-edit" data-action="openGroupNoticeEdit">編輯</button>`:'';
  return `<div id="groupNoticeBar"><span class="gn-ico"><svg class="ico"><use href="#i-megaphone"/></svg></span><div class="gn-text">${escapeHtml(n.text)}</div>${ed}</div>`;
}
/* 群聊的 + 面板（圖片／檔案／位置／投票／公告／視訊通話；沒有小遊戲） */
function groupPlusPanelHTML(){
  const item=(a,t,icon)=>`<div class="pi" data-action="${a}"><div class="pic"><svg class="ico"><use href="#${icon}"/></svg></div><div class="pit">${t}</div></div>`;

function closeGroupPlus(){ const p=document.getElementById('groupPlus'); if(p&&!p.classList.contains('hidden')){ p.classList.add('hidden'); const b=document.getElementById('groupPlusBtn'); if(b)b.classList.remove('on'); } }
function toggleGroupPlus(){

  const b=document.getElementById('groupPlusBtn');
  if(p.classList.contains('hidden')){ p.classList.remove('hidden'); if(b)b.classList.add('on'); }

function renderGroupChat(groupKey,g){
  g=myGroups[groupKey]||g||{};   // 優先用訂閱到的最新資料（群公告改了才會即時更新）
  const memberCount=Object.keys(g.members||{}).length;
  const msgsHTML=currentGroupMsgs.length===0
    ? (groupMsgsReady
        ? `<div class="empty">還沒有訊息，說點什麼吧！</div>`
        : `<div class="empty" style="line-height:2">正在載入訊息…<br><span style="color:var(--text-muted);font-size:12px">網絡慢的話會久一點</span></div>`)
    : currentGroupMsgs.map(m0=>{
    const m=Object.assign({},m0,liveWho(m0)||{});   // v1.36 群聊也一樣：名稱／頭像取最新
    const isMe=m.username===me.username;
    const time=new Date(m.createdAt).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    const color=safeColor(m.color,'#3b82f6');
    const av=avatarHTML(m);
    const inner=groupMsgBody(m);
    const gChi=String(m.chiName||'').trim();
    const gReal=(gChi&&gChi!==String(m.displayName||m.username))?`<span class="meta-realname">${escapeHtml(gChi)}</span>`:'';
    return `<div class="msg ${isMe?'me':''}"><div class="avatar" style="background:${color}">${av}</div><div class="bubble-wrap"><div class="meta">${escapeHtml(m.displayName||m.username)}${gReal} · ${time}</div><div class="bubble" style="background:${color}">${inner}</div></div></div>`;
  }).join('');
  if(!document.getElementById('privateChatScreen')){
    beginPage('groupChat');
    const div=document.createElement('div');
    div.id='privateChatScreen';
    div.classList.add('anim-in-page');
    div.innerHTML=`<div class="pc-header"><button class="pc-back" data-action="closePage"><svg class="ico"><use href="#i-back"/></svg></button><div style="flex:1;min-width:0"><div class="pc-title">${escapeHtml(groupKey)}</div><div class="pc-info">${memberCount} 人</div></div><button class="hbtn" data-action="callGroup" title="視訊通話" style="display:inline-flex;align-items:center;gap:5px"><svg class="ico"><use href="#i-video"/></svg>通話</button><button class="hbtn" data-action="leaveGroup" data-arg="${escAttr(groupKey)}">退出</button></div>${groupNoticeHTML(g)}<div class="pc-body" id="pcBody">${msgsHTML}</div><div class="pc-input-bar" id="groupInputBar">${groupPlusPanelHTML()}<button class="gp-btn" id="groupPlusBtn" data-action="toggleGroupPlus" title="更多功能">+</button><button class="gp-btn gp-mic" id="groupMicBtn" title="按住說話">語音</button><input type="text" id="pcInput" placeholder="輸入訊息..." maxlength="5000"><button data-action="submitGroupMessage">送出</button></div>`;
    document.body.appendChild(div);
    const inp=document.getElementById('pcInput');
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitGroupMessage();}});
  } else {
    document.getElementById('pcBody').innerHTML=msgsHTML;
    document.querySelector('#privateChatScreen .pc-title').textContent=groupKey;
    document.querySelector('#privateChatScreen .pc-info').textContent=memberCount+' 人';
    /* 群公告那一條：本來沒有就跟著加進去，有就更新內容 */
    const oldBar=document.getElementById('groupNoticeBar');
    const newBar=groupNoticeHTML(g);
    if(oldBar&&!newBar)oldBar.remove();
    else if(newBar){
      if(oldBar)oldBar.outerHTML=newBar;
      else{ const pb=document.getElementById('pcBody'); if(pb)pb.insertAdjacentHTML('beforebegin',newBar); }
    }
  }
  /* 投票選項的點擊（群聊以前沒有投票，這一段是新的） */
  const pbody=document.getElementById('pcBody');
  if(pbody){
    pbody.querySelectorAll('[data-poll-opt]').forEach(el=>{
      el.onclick=(ev)=>{
        ev.stopPropagation();
        const msgId=el.dataset.pollMsg,idx=parseInt(el.dataset.pollOpt,10);
        const m=currentGroupMsgs.find(x=>x.id===msgId);if(!m)return;
        if(m.pollDeadline&&Date.now()>=m.pollDeadline)return;
        const votes=m.pollVotes||{};if(votes[me.username])return;
        if(me.banned&&me.banned.type==='light'){showNotif('你目前被限制發言');return;}
        const mode=m.pollMode||'single',maxSel=m.pollMaxSelect||0;
        if(!window._pollSel)window._pollSel={};
        if(!window._pollSel[msgId])window._pollSel[msgId]=[];
        const selArr=window._pollSel[msgId];
        if(mode==='single'){window._pollSel[msgId]=[idx];submitPollVote(msgId);return;}
        const pos=selArr.indexOf(idx);
        if(pos>=0)selArr.splice(pos,1);
        else{ if(maxSel>0&&selArr.length>=maxSel){showNotif('超過上限（最多 '+maxSel+' 項）');return;} selArr.push(idx); }
        renderGroupChat(groupKey,g);
      };
    });
  }
  const body=document.getElementById('pcBody');
  if(body)body.scrollTop=body.scrollHeight;
}
/* 群聊發訊息（純文字） */
async function submitGroupMessage(){
  if(!me||!currentGroupKey)return;
  const inp=document.getElementById('pcInput');if(!inp)return;
  const text=inp.value.trim();if(!text)return;
  if(me.banned&&me.banned.type==='light'){showNotif('你目前被限制發言');return;}
  inp.value='';
  try{
    /* v1.15：群聊訊息鍵同樣改用 push()，理由跟主聊天室一樣（msgCounter 會撞鍵）。 */
    const msgId=await nextGroupMsgId(currentGroupKey);
    await update(ref(db,'groups/'+currentGroupKey),{lastMsg:text,lastAt:Date.now()});
    await set(ref(db,'groupMessages/'+currentGroupKey+'/'+msgId),{id:msgId,username:me.username,displayName:me.displayName,chiName:me.chiName||'',engName:me.engName||'',seat:me.seat,cls:me.cls||'',color:me.color,avatar:me.avatar,role:me.role,text,type:'text',createdAt:Date.now(),deleted:false});
  }catch(e){showNotif('送出失敗');}
}
/* 群聊發多媒體／投票／公告（messages 那一套的群聊版） */
async function sendGroupMedia(type,payload,summary){
  if(!me||!currentGroupKey)return;
  if(me.banned&&me.banned.type==='light'){showNotif('你目前被限制發言');return;}
  try{
    const msgId=await nextGroupMsgId(currentGroupKey);
    const label=summary||({image:'（圖片）',file:'（檔案）',voice:'（語音）',location:'（位置）',poll:'（投票）',notice:'（群公告）'}[type]||'（訊息）');
    await update(ref(db,'groups/'+currentGroupKey),{lastMsg:label,lastAt:Date.now()});
    const base={id:msgId,username:me.username,displayName:me.displayName,chiName:me.chiName||'',engName:me.engName||'',seat:me.seat,cls:me.cls||'',color:me.color,avatar:me.avatar,role:me.role,type,createdAt:Date.now(),deleted:false};
    if(type==='poll'){ await set(ref(db,'groupMessages/'+currentGroupKey+'/'+msgId),{...base,...payload,_scope:'group',_gk:currentGroupKey}); }
    else{ await set(ref(db,'groupMessages/'+currentGroupKey+'/'+msgId),{...base,...payload}); }
    const body=document.getElementById('pcBody'); if(body)body.scrollTop=body.scrollHeight;
  }catch(e){showNotif('送出失敗');}
}
function pickGroupImage(){
  closeGroupPlus();
  const inp=document.getElementById('globalImgInput');
  inp.onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
    try{const d=await compressImage(f,1200,1200,0.75);await sendGroupMedia('image',{imageUrl:d,text:''});}catch(err){}};
  inp.click();
}
function pickGroupFile(){
  closeGroupPlus();
  const inp=document.getElementById('globalFileInput');
  inp.onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
    if(f.size>5*1024*1024){showNotif('5MB');return;}
    try{const d=await fileToBase64(f);await sendGroupMedia('file',{fileUrl:d,fileName:f.name,fileSize:f.size},'（檔案）'+f.name);}catch(err){}};
  inp.click();
}
function pickGroupLocation(){
  closeGroupPlus();
  if(!currentGroupKey){showNotif('請先進入群聊');return;}
  if(!navigator.geolocation){showNotif('無法取得位置');return;}
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude,lng=pos.coords.longitude;
    let placeName=`${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=zh-TW`);const j=await r.json();if(j.display_name)placeName=j.display_name;}catch(e){}
    await sendGroupMedia('location',{lat,lng,placeName},'（位置）');
  },()=>showNotif('無法取得位置'));
}
function playGroupVoice(msgId){
  const m=currentGroupMsgs.find(x=>x.id===msgId);
  if(!m||!m.audioUrl){showNotif('找不到語音');return;}
  if(window._currentAudio){try{window._currentAudio.pause();}catch(e){}window._currentAudio=null;}
  const audio=new Audio(m.audioUrl);
  window._currentAudio=audio;
  const el=document.querySelector(`#pcBody [data-action="playGroupVoice"][data-arg="${escAttr(msgId)}"]`);
  const bar=el?el.querySelector('.vp > div'):null;
  audio.play().catch(()=>showNotif('無法播放'));
  audio.ontimeupdate=()=>{ if(bar&&audio.duration)bar.style.width=((audio.currentTime/audio.duration)*100)+'%'; };
  audio.onended=()=>{ if(bar)bar.style.width='0%'; if(el)el.classList.add('played'); window._currentAudio=null; };
}
/* 群聊用的子頁面（投票建立／群公告編輯）。
   刻意不走 closePage：closePage 會把整個 #privateChatScreen 一起收掉（等於把群聊踢出去）。 */

function closeGroupSubPage(){

  if(!el){ window._groupPollDraft=null; return; }
  closeGroupPlus();

}
function openGroupPollCreate(){
  closeGroupPlus();
  if(!currentGroupKey)return;
  if(me.banned&&me.banned.type==='light'){showNotif('你目前被限制發言');return;}
  window._groupPollDraft={name:'',options:['',''],mode:'single',max:'',optMode:'one',duration:'24'};
  renderGroupPollCreate();
}
function renderGroupPollCreate(){
  const d=window._groupPollDraft;if(!d)return;
  const isMulti=d.mode==='multi';
  const optRows=d.options.map((o,i)=>`<div class="form-row" style="display:flex;gap:8px;align-items:center"><input type="text" class="gPollOpt" data-i="${i}" maxlength="50" value="${escapeHtml(o)}" placeholder="選項 ${i+1}" style="flex:1"><button class="btn-ghost" style="margin:0;padding:8px 12px;flex:0 0 auto" data-action="groupPollRemoveOpt" data-arg="${i}">刪除</button></div>`).join('');
  const body=`<div class="section-title">投票名稱</div><div class="form-row"><input type="text" id="pollName" maxlength="50" value="${escapeHtml(d.name)}" placeholder="投票名稱"></div><div class="section-title">選項輸入方式</div><div class="ban-type-buttons"><button class="ban-type-btn ${d.optMode==='one'?'selected light':''}" data-action="groupPollOptMode" data-arg="one">逐個輸入</button><button class="ban-type-btn ${d.optMode==='multi'?'selected light':''}" data-action="groupPollOptMode" data-arg="multi">多行輸入</button></div><div class="section-title">選項</div>${d.optMode==='one'?`<div>${optRows}</div><button class="btn-ghost" data-action="groupPollAddOpt">+ 新增選項</button>`:`<div class="form-row"><textarea id="pollBulk" style="min-height:120px" placeholder="每行一個選項">${escapeHtml(d.options.join('\n'))}</textarea></div>`}<div class="section-title">模式</div><div class="ban-type-buttons"><button class="ban-type-btn ${d.mode==='single'?'selected light':''}" data-action="groupPollMode" data-arg="single">單選</button><button class="ban-type-btn ${d.mode==='multi'?'selected light':''}" data-action="groupPollMode" data-arg="multi">多選</button></div>${isMulti?`<div class="section-title">多選上限（留空為無限）</div><div class="form-row"><input type="text" id="pollMax" value="${escapeHtml(d.max)}" placeholder="無限"></div>`:''}<div class="section-title">截止時間（小時後）</div><div class="form-row"><input type="number" id="pollDuration" min="1" value="${escapeHtml(d.duration)}"></div><button class="btn-primary" data-action="submitGroupPoll">建立投票</button><div class="err" id="pollErr"></div>`;
  openGroupSubPage('建立投票',body);
}
function groupPollSaveDraft(){
  const d=window._groupPollDraft;if(!d)return;
  const nEl=document.getElementById('pollName');if(nEl)d.name=nEl.value;
  if(d.optMode==='one'){const rows=[...document.querySelectorAll('.gPollOpt')];if(rows.length)d.options=rows.map(r=>r.value);}
  else{const b=document.getElementById('pollBulk');if(b)d.options=b.value.split('\n');}
  const mx=document.getElementById('pollMax');if(mx)d.max=mx.value;
  const du=document.getElementById('pollDuration');if(du)d.duration=du.value;
}
function groupPollOptMode(m){ groupPollSaveDraft(); const d=window._groupPollDraft;if(!d)return;d.optMode=m;renderGroupPollCreate(); }
function groupPollMode(m){ groupPollSaveDraft(); const d=window._groupPollDraft;if(!d)return;d.mode=m;if(m==='single')d.max='';renderGroupPollCreate(); }
function groupPollAddOpt(){ groupPollSaveDraft(); const d=window._groupPollDraft;if(!d)return;if(d.options.length>=10){showNotif('最多 10 個選項');return;}d.options.push('');renderGroupPollCreate(); }
function groupPollRemoveOpt(i){ groupPollSaveDraft(); const d=window._groupPollDraft;if(!d)return;if(d.options.length<=2){showNotif('至少 2 個選項');return;}d.options.splice(i,1);renderGroupPollCreate(); }
async function submitGroupPoll(){
  const d=window._groupPollDraft;if(!d||!currentGroupKey)return;
  groupPollSaveDraft();
  const errEl=document.getElementById('pollErr');
  const name=(d.name||'').trim();
  if(!name){if(errEl)errEl.textContent='請輸入名稱';return;}
  if(name.length>50){if(errEl)errEl.textContent='名稱最多 50 字';return;}
  const opts=d.options.map(x=>(x||'').trim()).filter(x=>x.length>0);
  if(opts.length<2){if(errEl)errEl.textContent='至少 2 個選項';return;}
  const durH=parseInt(d.duration,10);if(!durH||durH<1){if(errEl)errEl.textContent='截止時間不正確';return;}
  const maxSel=d.mode==='multi'?(d.max&&parseInt(d.max,10)>0?parseInt(d.max,10):0):1;
  const deadline=Date.now()+durH*3600*1000;
  try{
    await sendGroupMedia('poll',{text:'',pollTitle:name,pollOptions:opts,pollMode:d.mode,pollMaxSelect:maxSel,pollDeadline:deadline,pollVotes:{}},'（投票）'+name);
    await writeLog('send','群聊建立投票：'+name);
    closeGroupSubPage();
  }catch(e){if(errEl)errEl.textContent=e.message;}
}

  try{ await remove(ref(db,'groups/'+currentGroupKey+'/notice')); closeGroupSubPage(); showNotif('已清除公告'); }catch(e){}
}
async function leaveGroup(groupKey){
  if(!me)return;
  if(!(await askConfirm({title:'退出群聊',html:'確定要退出群聊「'+groupKey+'」？',danger:true,okText:'退出'})))return;
  try{
    await remove(ref(db,'groups/'+groupKey+'/members/'+me.username));
    await writeLog('group','退出群聊 '+groupKey);
    showNotif('已退出群聊');
    closePage();
    currentGroupKey=null;
    if(unsubGroupMsgs){unsubGroupMsgs();unsubGroupMsgs=null;}
  }catch(e){showNotif('退出失敗');}
}

/* ===== AI 私人聊天 ===== */
function openAIPrivate(){
  if(!me)return;
  if(unsubAIPrivate)unsubAIPrivate();
  unsubAIPrivate=onValue(ref(db,'aiPrivateChat/'+me.username),snap=>{
    const val=snap.val()||{};
    aiPrivateMsgs=Object.keys(val).map(k=>({_key:k,...val[k]})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));

  renderAIPrivate();
}
function renderAIPrivate(){

  if(aiPrivateMsgs.length===0){msgsHTML=`<div style="text-align:center;padding:30px 20px;color:var(--text-sub);font-size:14px;line-height:1.7">你好！我是小喆AI。這裡是我們單獨的對話，只有你能看到。</div>`;}
  else{
    msgsHTML=aiPrivateMsgs.map(m=>{
      const isMe=m.username===me.username;

    /* 私人聊天的長期記憶：跟公開頻道分開存，只屬於這個用戶。清瀏覽器也不影響，
       因為都存在 Firebase。超過 200 則會自動修剪最舊的。 */
