async function vcSwapOutgoingVideo(track){
  const st=vcState; if(!st||!track)return;
  for(const [,rec] of st.peers){
    const sender=rec.pc.getSenders().find(s=>s.track&&s.track.kind==='video');
    if(sender){ try{ await sender.replaceTrack(track); }catch(e){} }
  }
}
async function vcFlipCamera(){
  const st=vcState; if(!st||!st.local)return;
  const cur=st.local.getVideoTracks()[0]; if(!cur)return;
  let facing='user';
  try{ facing=(cur.getSettings&&cur.getSettings().facingMode==='environment')?'user':'environment'; }catch(e){}
  try{
    const ns=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});
    const nt=ns.getVideoTracks()[0];
    st.local.removeTrack(cur);
    st.local.addTrack(nt);
    st.camTrack=nt;
    cur.stop();
    await vcSwapOutgoingVideo(nt);
    vcMountSelf(); vcRenderGrid();
  }catch(e){ showNotif('切換鏡頭失敗'); }
}
async function vcToggleShare(){
  const st=vcState; if(!st)return;
  if(!st.sharing){
    let ds=null;
    try{ ds=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false}); }catch(e){ return; }
    const t=ds.getVideoTracks()[0];
    if(!t)return;
    st.shareTrack=t; st.sharing=true;
    t.onended=()=>{ if(vcState&&vcState.sharing)vcToggleShare(); };
    await vcSwapOutgoingVideo(t);
    vcMountSelf();
  }else{
    st.sharing=false;
    const back=st.camTrack;
    if(back){ if(back.readyState==='ended'){ try{ const ns=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}); st.camTrack=ns.getVideoTracks()[0]; }catch(e){} } }
    if(st.camTrack)await vcSwapOutgoingVideo(st.camTrack);
    if(st.shareTrack){ try{ st.shareTrack.stop(); }catch(e){} st.shareTrack=null; }
    vcMountSelf();
  }
  const b=document.getElementById('vcShare');
  if(b)b.classList.toggle('on',st.sharing);
  vcBeat(false); vcRenderGrid();
}

/* ── 掛斷（byReason 有值＝不是正常結束，不寫通話紀錄）── */
async function vcHangup(reason,keepPage){
  const st=vcState; if(!st||st.closed)return;
  st.closed=true;
  vcState=null;
  try{ if(st.hbTimer)clearInterval(st.hbTimer); }catch(e){}
  try{ if(st.uiTimer)clearInterval(st.uiTimer); }catch(e){}
  try{ if(st.levelTimer)clearInterval(st.levelTimer); }catch(e){}
  try{ if(st.unsubPeers)st.unsubPeers(); }catch(e){}
  try{ if(st.unsubSig)st.unsubSig(); }catch(e){}
  for(const [,rec] of st.peers){ try{ rec.pc.close(); }catch(e){} }
  st.peers.clear(); st.levels.clear();
  if(st.shareTrack){ try{ st.shareTrack.stop(); }catch(e){} }
  if(st.local){ try{ st.local.getTracks().forEach(t=>t.stop()); }catch(e){} }
  try{ if(st.audioCtx)st.audioCtx.close(); }catch(e){}
  try{ await remove(ref(db,'calls/'+st.roomId+'/peers/'+me.username)); }catch(e){}
  try{ await remove(ref(db,'calls/'+st.roomId+'/sig/'+me.username)); }catch(e){}
  try{
    const left=await get(ref(db,'calls/'+st.roomId+'/peers'));
    if(!left.exists())await remove(ref(db,'calls/'+st.roomId));
  }catch(e){}

  const sec=Math.round((Date.now()-st.startedAt)/1000);
  if(!reason&&sec>=VC_MIN_RECORD_SEC){
    const text='視訊通話 · '+fmtDur(sec);
    try{
      if(st.kind==='group'){
        const gSnap=await get(child(ref(db),'groups/'+st.key));
        if(gSnap.exists()){
          const g=gSnap.val(); if(!g.members||!g.members[me.username])throw new Error('not member');
          const msgId=await nextGroupMsgId(st.key);
          await update(ref(db,'groups/'+st.key),{lastMsg:text,lastAt:Date.now()});
          await set(ref(db,'groupMessages/'+st.key+'/'+msgId),{id:msgId,username:me.username,displayName:me.displayName,chiName:me.chiName||'',engName:me.engName||'',seat:me.seat,cls:me.cls||'',color:me.color,avatar:me.avatar,role:me.role,text,type:'call',duration:sec,createdAt:Date.now(),deleted:false});
        }
      }else{
        const msgId=await nextMsgId();
        await set(ref(db,'messages/'+msgId),{id:msgId,username:me.username,displayName:me.displayName,chiName:me.chiName||'',engName:me.engName||'',seat:me.seat,cls:me.cls||'',color:me.color,avatar:me.avatar,role:me.role,text,type:'call',duration:sec,createdAt:Date.now(),deleted:false});
      }
      showNotif('通話已結束，紀錄已留在聊天室');
    }catch(e){}
  }else if(reason){
    showNotif(reason);
  }
  if(keepPage)return;
  try{ closePage(); }catch(e){ pageRoot.innerHTML=''; }
}

/* ═══ v1.36 改名要「回頭生效」 ═══
   每則訊息在送出的當下，會把當時的顯示名稱／頭像／顏色一起抄一份存進訊息裡
   （這樣即使對方之後被封鎖或刪帳號，舊訊息還是看得出是誰講的）。
   副作用是：同一個人改了顯示名稱或頭像之後，他以前發過的每一則訊息仍然掛著舊名字、
   舊頭像 —— 點他的頭像進去看又是新的，前後對不上。
   這裡改成：渲染時一律優先用 users/{帳號} 的「現在」資料，只有查不到這個帳號
   （例如帳號已被刪除）才退回訊息裡的那份快照。 */
function liveWho(m){
  if(!m||!m.username)return null;
  const u=allUsers[m.username];
  if(!u)return null;
  return {
    displayName:u.displayName||m.username,
    avatar:(u.avatar===undefined||u.avatar===null)?m.avatar:u.avatar,
    color:u.color||m.color,
    role:u.role||m.role,
    cls:(u.cls||m.cls||''),
    seat:(u.seat===''||u.seat==null)?m.seat:u.seat,
    // v1.36 名冊姓名也走同一條路：名冊一改，舊訊息跟著換
    chiName:(u.chiName==null?m.chiName:u.chiName),
    engName:(u.engName==null?m.engName:u.engName)
  };
}
/* 名稱／頭像一改，別人正在看的那一面要跟著換。
   只比對「畫面上看得到的」欄位，其他變動（登入旗標、主題、封鎖）不觸發重畫，
   免得每次 presence 更新都把聊天室整個重繪一次。 */
let _whoSig='';
function whoSignature(u){
  return [u.displayName||'',u.avatar==null?'':String(u.avatar).slice(0,40),u.color||'',u.role||'',u.cls||'',u.seat==null?'':u.seat].join('|');
}
function refreshWhoRender(){
  const sig=Object.keys(allUsers).sort().map(k=>k+':'+whoSignature(allUsers[k])).join(';');
  if(sig===_whoSig)return;
  _whoSig=sig;
  try{ if(chatBox&&messages.length)render(); }catch(e){}
  try{
    if(currentGroupKey&&document.getElementById('privateChatScreen')){
      const g=myGroups[currentGroupKey];
      if(g)renderGroupChat(currentGroupKey,g);
    }
  }catch(e){}
}
/* ═══ v1.36 訊息操作彈窗 ═══
   以前每一則訊息下面都掛著「訊息編號 / 舉報 / 請求刪除 / 管理刪除」，
   一來很亂，二來在手機上很容易誤按。現在全部收進這裡：點一下那則訊息才彈出來。
   管理相關的（管理刪除、刪除 AI、恢復、徹底刪除）只有管理員看得到 —— 跟安卓版一致。 */
function openMsgMenu(msgId){
  const m=allMsgs().find(x=>x.id===msgId);
  if(!m)return;
  const isAdmin=me&&(me.role==='superadmin'||me.role==='admin');

  rows+=`<div class="mm-react">${REACT_EMOJIS.map(function(e){

  if(!isMe&&!isAI)rows+=`<button class="mm-btn" data-mm="follow">${myFollows[m.username]?'取消關注此同學':'關注此同學'}</button>`;
  if(!isMe&&!isAI)rows+=`<button class="mm-btn danger" data-mm="reportMsg">舉報這則訊息</button>`;
  if(isMe&&!isAI&&!m.deleted)rows+=`<button class="mm-btn" data-mm="requestDeleteMsg">請求刪除</button>`;
  if(isAdmin&&!isAI&&!m.deleted)rows+=`<button class="mm-btn danger" data-mm="adminDeleteMsg">管理刪除</button>`;
  if(isAdmin&&isAI&&!m.deleted)rows+=`<button class="mm-btn danger" data-mm="adminDeleteAIMsg">刪除 AI 這則</button>`;
  if(isAdmin&&m.deleted)rows+=`<button class="mm-btn" data-mm="restoreMsg">恢復訊息</button><button class="mm-btn danger" data-mm="purgeMsg">徹底刪除</button>`;

  div.innerHTML=`<div class="mm-card anim-in-modal"><div class="mm-head">${escapeHtml(m.displayName||m.username)} 的訊息${m.deleted?'（已刪除）':''}</div>${rows}</div>`;
  document.body.appendChild(div);
  div.addEventListener('click',e=>{ if(e.target===div){ closeMsgMenu(); return; } });
  div.querySelectorAll('[data-mm]').forEach(b=>{
    b.onclick=()=>{
      const a=b.dataset.mm;
      /* 表情與快捷回覆唔關菜單，按下就做 */
      if(a==='react'){ try{ toggleReaction(msgId,b.dataset.emoji); }catch(e){} closeMsgMenu(); return; }
      if(a==='quick'){ closeMsgMenu(); try{ startQuote(msgId); }catch(e){} quickReplyText(b.dataset.text); return; }
      if(a==='quote'){ closeMsgMenu(); startQuote(msgId); return; }
      if(a==='copyText'){
        closeMsgMenu();
        try{ navigator.clipboard.writeText(String(m.text||'')).then(function(){showNotif('已複製');},function(){showNotif('複製失敗');}); }catch(e){}
        return;
      }
      if(a==='recall'){ closeMsgMenu(); recallMsg(msgId); return; }
      if(a==='quoteIt'){ closeMsgMenu(); markQuote(msgId); return; }
      if(a==='follow'){ closeMsgMenu(); toggleFollow(m.username); return; }
      closeMsgMenu();
      const fn={reportMsg,requestDeleteMsg,adminDeleteMsg,adminDeleteAIMsg,restoreMsg,purgeMsg}[a];
      if(typeof fn==='function'){ try{ fn(msgId); }catch(e){} }
    };
  });
}

/* ═══ v1.37 往前翻頁（載入更早的訊息）═══
   為什麼要有這個：主聊天室為了省流量只訂閱最新 MSG_WINDOW 則，
   可是以前整頁沒有任何入口可以往前翻，所以看到的第一則就固定停在窗口邊界
   （當時是 msg_0377）—— 更早的訊息明明都還在資料庫裡，使用者卻一則都看不到，
   看起來就像「訊息全部丟失了」。 */
function earlierBar(){
  /* 搜尋時也留著往前翻：不然只搜到「已經載入的那一段」，很容易以為訊息不見了 */
  if(searchKeyword&&histDone)return `<div class="earlier-done">已搜尋全部 ${allMsgs().length} 則訊息</div>`;
  if(histLoading)return `<div class="earlier-done">正在載入更早的訊息…</div>`;
  if(histDone)return olderMsgs.length?`<div class="earlier-done">已經到最早的訊息了（共 ${allMsgs().length} 則）</div>`:'';
  const first=allMsgs()[0];
  const since=first?new Date(first.createdAt).toLocaleDateString('zh-TW'):'';
  return `<button id="loadEarlier" class="earlier-btn" data-action="loadEarlier">載入更早的訊息${since?'（'+since+' 之前）':''}</button>`;
}
async function loadEarlier(){
  if(histLoading||histDone)return;
  const src=allMsgs();
  /* ⚠ 以前用 orderByChild('createdAt') + endAt(時間戳)，
     Firebase 對「orderByChild + endAt」要求先建索引，沒建就整個查詢失敗
     → 用戶向上滾永遠見到「載入失敗」。
     改成 orderByKey() + endAt(最舊那則的 push key)：push key 天生按時間排序，
     而且不需要任何索引。histCursor 現在存的是 key（字串）不是時間戳。 */
  const base=histCursor||String((src[0]||{})._key||'');
  if(!base){histDone=true;render();return;}
  histLoading=true;
  const prevH=chatBox.scrollHeight,prevTop=chatBox.scrollTop;
  suppressScrollToBottom=true;render();chatBox.scrollTop=prevTop;
  try{
    /* 抓「比已經載入的最舊那則再更早」的 MSG_WINDOW 則（按 key，不需索引） */
    const snap=await readQueryOnce(query(ref(db,'messages'),orderByKey(),endAt(base),limitToLast(MSG_WINDOW+1)));
    const val=snap.val()||{};
    const keys=Object.keys(val);
    const raw=keys.length;
    const seen=Object.create(null);src.forEach(m=>{seen[m._key]=1;});
    const add=msgFromSnap(val).filter(m=>!seen[m._key]);
    if(raw<MSG_WINDOW+1)histDone=true;    // 這批不滿 = 後面沒有了
    if(keys.length){ keys.sort(); histCursor=keys[0]; }  // 游標一律往前推（最小 key）
    if(add.length)olderMsgs=add.concat(olderMsgs);
  }catch(e){ showNotif('載入失敗：'+(e.message||e)); }
  histLoading=false;
  suppressScrollToBottom=true;render();
  setTimeout(function(){ try{ maybeAutoLoadEarlier(); }catch(e){} }, 260);
  /* 內容從上面長出來，捲動位置要跟著補，否則視野會被推走 */
  const delta=chatBox.scrollHeight-prevH;
  chatBox.scrollTop=prevTop+delta;
  requestAnimationFrame(()=>{ chatBox.scrollTop=prevTop+(chatBox.scrollHeight-prevH);updateScrollToBottomBtn(); });
}
let lastAutoHist=0;
/* PERF2: 撐不滿就要自動補。
   以前寫反了：`scrollHeight <= clientHeight + 40` 就 return，
   → 40 條訊息撐不滿屏幕時，用戶見到一大片空白、又滾唔動，
     永遠觸發唔到「向上滾」，於是永遠看不到更早的訊息。
   現在：內容撐不滿 → 自動補下一批（直到撐滿或者真係冇更多）。 */
function maybeAutoLoadEarlier(){
  if(histDone||histLoading||searchKeyword)return;
  const short = chatBox.scrollHeight <= chatBox.clientHeight + 80;
  if(!short && chatBox.scrollTop > 70) return;   // 內容夠長時，只在滑到頂才補
  const now=Date.now(); if(now-lastAutoHist<500) return;
  lastAutoHist=now;
  loadEarlier();
}

/* ═══ v1.15 安全：輸出跳脫 ═══
   原本整站的頭像都是「avatar 以 data: 開頭就當圖片，否則原樣塞進 innerHTML」，
   同一個寫法在九個地方各複製了一份 —— 等於九個同樣的洞：
   只要有人把頭像改成 <img src=x onerror=...>，每個看得到他的人（包含管理員）
   都會在瀏覽器裡執行那段腳本。
   現在不管頭像是什麼，只允許 data:image/ 的圖片，其餘一律當純文字轉義輸出。
   現有頭像全部是單一 emoji 或一個字，所以改完不會有人「頭像變亂碼」。 */
function escapeHtml(str){ return String(str==null?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
/* 放進 HTML 屬性（雙引號）裡用的版本：先走 escapeHtml 再補單引號，兩層都顧到。 */
function escAttr(v){ return escapeHtml(v); }
/* v1.15 安全：顏色只允許 #rgb / #rrggbb / #rrggbbaa 或純英文字母色名（red、blue…）。
   這些值會被直接塞進 style="background:..."，不擋的話可以夾帶 url()、
   expression() 之類的東西，一樣能在別人瀏覽器上跑。 */
function safeColor(v,fallback){
  const s=String(v==null?'':v).trim();
  if(/^#[0-9a-fA-F]{3,8}$/.test(s))return s;
  if(/^[a-zA-Z]{3,20}$/.test(s))return s;
  return fallback||'#3b82f6';
}

async function sendMedia(type,payload){

       後送出的那則會直接把前一則蓋掉（訊息就這樣無聲消失）。
       push() 由 Firebase 產生唯一且依時間排序的鍵，天生不會撞。
       舊訊息（msg_0001…）完全不用動：讀取端是靠 createdAt 排序、靠 id 欄位找訊息，
       兩種鍵名可以並存，前面的聊天記錄一則都不會少。 */

function compressImage(file,maxW,maxH,quality){ return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=ev=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const ratio=Math.min(maxW/w,maxH/h,1);w=Math.round(w*ratio);h=Math.round(h*ratio);const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',quality));};img.onerror=()=>reject(new Error('load fail'));img.src=ev.target.result;};reader.onerror=()=>reject(new Error('read fail'));reader.readAsDataURL(file);}); }

/* ===== v1.10 語音錄音 =====
   v1.37：錄音器改成「看目標」——recTarget 是 'main'（公共聊天室）還是 'group'（私人群聊）。
   以前 stopRec() 永遠把語音丟去 sendMedia()（公共聊天室），所以群聊按麥克風會錄到公共頻道去。 */
let mediaRecorder=null,audioChunks=[],recStartTime=0,recTimer=null,recCancel=false,recStream=null,recTarget='main';
function initVoiceRecorder(){

/* 群聊的麥克風是後來才插進 DOM 的（而且會隨開關重建），所以用事件委派綁在 document 上 */
document.addEventListener('mousedown',e=>{

  if(el){ e.preventDefault(); startRec('group'); }
});
document.addEventListener('touchstart',e=>{

  if(t){ e.preventDefault(); startRec('group'); }

function recButton(){

}
function startRec(target){
  if(!me)return;
  recTarget=target||'main';
  if(recTarget==='group'&&!currentGroupKey){showNotif('請先進入群聊');return;}
  if(me.banned&&me.banned.type==='light'){showNotif('你目前被限制發言');return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showNotif('此瀏覽器不支援錄音');return;}
  if(mediaRecorder&&mediaRecorder.state==='recording')return;
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    recStream=stream;audioChunks=[];recCancel=false;
    let mime='';
    if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/webm'))mime='audio/webm';
    try{mediaRecorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}catch(e){mediaRecorder=new MediaRecorder(stream);}
    mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size>0)audioChunks.push(e.data);};
    mediaRecorder.start();
    recStartTime=Date.now();
    const mb=recButton();if(mb)mb.classList.add('recording');
    const ov=document.createElement('div');
    ov.id='recordingOverlay';
    ov.innerHTML=`<div class="rec-timer" id="recTimer">0:00</div><div class="rec-wave"><span></span><span></span><span></span><span></span><span></span></div><div class="rec-hint">放開送出 · <span class="rec-cancel-tip">上滑取消</span></div>`;
    document.body.appendChild(ov);
    recTimer=setInterval(()=>{
      const s=Math.floor((Date.now()-recStartTime)/1000);
      const el=document.getElementById('recTimer');
      if(el)el.textContent=`0:${String(s).padStart(2,'0')}`;
      if(s>=60)stopRec();
    },100);
  }).catch(()=>{showNotif('無法取得麥克風權限');});
}
function moveRec(e){
  if(!mediaRecorder||mediaRecorder.state!=='recording')return;
  const y=e&&e.clientY!=null?e.clientY:null;

  if(y!=null){
    if(window.innerHeight-y>110){recCancel=true;if(ov)ov.classList.add('cancel');}

function stopRec(){
  if(!mediaRecorder||mediaRecorder.state!=='recording')return;
  const dur=(Date.now()-recStartTime)/1000;
  const target=recTarget;
  mediaRecorder.onstop=async()=>{
    if(recTimer){clearInterval(recTimer);recTimer=null;}
    const mb=recButton();if(mb)mb.classList.remove('recording');
    const ov=document.getElementById('recordingOverlay');if(ov)animOut(ov,'anim-out-overlay',200);
    if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null;}
    if(recCancel||dur<1)return;

    if(blob.size>1024*1024*3){showNotif('語音太長或太大');return;}
    const reader=new FileReader();

/* ═══ v1.38.5 通知「確定」變成一個狀態，不再只是把卡片刪掉 ══════════════
   舊做法：寫 read:true，然後把卡片 DOM remove() 掉。
   問題有兩個：
     · 資料層只有 read，分不出「已經看過」和「已經確定處理」；
     · 卡片被刪的只是畫面上那一個，資料仍然在，所以重開通知頁、
       或者返回時把頁面快照貼回來，同一張卡又帶著「確定」按鈕原封不動長回來，
       用家感受就等於「根本沒有確定過」。
   現在：寫 read:true + acknowledgedAt（何時確定）＋ acknowledgedBy（誰確定），
   卡片留住、轉灰底，動作列就地換成「這條消息已被確定」。 */
function noticeCardEl(key){
  return document.querySelector(`.sn-card[data-nkey="${escAttr(key)}"]`);
}
/* 判斷「這條通知是否已經處理過」。
   acknowledgedAt 是 v1.38.5 之後才寫的，但舊版按確定時只寫了 read:true，
   那批舊資料如果不認 read，用戶重進仍然會見到「確定」按鈕 —— 正是要修的病。
   所以兩個條件任一成立都算已確定。 */
function noticeAcked(n){ return !!(n&&(n.acknowledgedAt||n.read)); }
function markNoticeAcked(key){
  const card=noticeCardEl(key);
  if(!card||card.classList.contains('sn-acked'))return;
  card.classList.add('sn-acked');
  const acts=card.querySelector('.sn-card-actions');
  if(acts)acts.innerHTML='<div class="sn-acked-tip">這條消息已被確定</div>';
  const left=systemNotices.filter(n=>!noticeAcked(n)&&n._key!==key).length;
  const tip=document.querySelector('#systemNoticeOverlay .sn-sub-tip');
  if(tip)tip.textContent=left>0?`還有 ${left} 條未確定`:'全部已確定';
  const all=document.querySelector('#systemNoticeOverlay .sn-ackall');
  if(all)all.disabled=(left<=0);
}
async function dismissSystemNotice(noticeKey){
  if(!me)return;
  const now=Date.now();
  markNoticeAcked(noticeKey);          // 先給反應，不用等網絡回來才有動靜
  try{
    await update(ref(db,'systemNotices/'+me.username+'/'+noticeKey),
      {read:true,acknowledgedAt:now,acknowledgedBy:me.username});
  }catch(e){
    showNotif('確定失敗，請重試');
    if(currentPageKey==='systemNotice')openSystemNotice();
    return;
  }
  refreshAllBadges();
}
/* 通知頁右上角「全部確定」：一次把所有未確定的通知處理掉 */
async function ackAllSystemNotices(){
  if(!me)return;
  const left=systemNotices.filter(n=>!noticeAcked(n));
  if(!left.length){showNotif('沒有未確定的通知');return;}
  const now=Date.now();
  left.forEach(n=>markNoticeAcked(n._key));
  const all=document.querySelector('#systemNoticeOverlay .sn-ackall');
  if(all)all.disabled=true;
  try{
    await Promise.all(left.map(n=>update(ref(db,'systemNotices/'+me.username+'/'+n._key),
      {read:true,acknowledgedAt:now,acknowledgedBy:me.username})));
  }catch(e){}
  showNotif('已全部確定');
  refreshAllBadges();
}

/* ═══ v1.38 位置地圖（自繪圖磚）══════════════════════════════════════
   舊做法兩邊都壞掉，而且壞法一樣難看：
     · 訊息卡片的縮圖用 staticmap.openstreetmap.de —— 那個服務早就停運，
       伺服器不再回應，所以整張縮圖變成一個破圖示。
     · 點入後的全螢幕用 <iframe> 載 openstreetmap.org —— 被我們自己的 CSP
       frame-src 擋住（從來沒有放行過），所以只剩一片灰色加一個破圖示。
   現在兩邊都改成用 tile.openstreetmap.org 的圖磚自己拼：縮圖用 <img>、
   全螢幕用 canvas。同一個資料源、跟痕跡地圖一致，而且不需要放寬 CSP
   frame-src —— img-src 本來就放行了那個圖磚網域。 */
let locJustSent=0;
function locNewCls(ts){ return (ts&&locJustSent&&Math.abs(Number(ts)-locJustSent)<3000)?' loc-new':''; }
let locTileCache=new Map();
function locTileImg(z,x,y){
  const key=z+'/'+x+'/'+y;
  let img=locTileCache.get(key);
  if(!img){
    img=new Image();
    img.decoding='async';
    img.src='https://tile.openstreetmap.org/'+key+'.png';
    locTileCache.set(key,img);
  }
  return img;
}
/* 卡片縮圖：220×150，圖磚絕對定位拼出來，點擊事件交給外層的 .loc-msg */
function locPreviewHTML(lat,lng){
  const la=Number(lat), ln=Number(lng);
  if(!isFinite(la)||!isFinite(ln))return '<div class="lm-map"></div>';
  const W=220,H=150,Z=15,n=Math.pow(2,Z);
  const left=tmLon2x(ln,Z)-W/2, top=tmLat2y(la,Z)-H/2;
  let t='';
  for(let tx=Math.floor(left/TM_TILE);tx<=Math.floor((left+W-1)/TM_TILE);tx++){
    for(let ty=Math.floor(top/TM_TILE);ty<=Math.floor((top+H-1)/TM_TILE);ty++){
      if(ty<0||ty>=n)continue;
      const wx=((tx%n)+n)%n;
      t+='<img class="lm-t" alt="" draggable="false" loading="lazy"'
        +' style="left:'+(tx*TM_TILE-left)+'px;top:'+(ty*TM_TILE-top)+'px"'
        +' src="https://tile.openstreetmap.org/'+Z+'/'+wx+'/'+ty+'.png">';
    }
  }
  return '<div class="lm-map"><div class="lm-in">'+t+'</div><span class="lm-pin"></span></div>';
}

/* ---- 全螢幕地圖 ----
   2026-10-17：改用雙指縮放（拿走加減按鈕）；標記釘在「發送位置」那一點上，
   拖地圖時它會跟著地圖走，不再永遠卡在畫面正中（以前看起來像地圖在飄）。
   連續縮放做法：整數層 z 決定抓哪一級圖磚，sc 是額外的倍率，
   兩者相乘才是螢幕上的比例，所以縮放可以很順，不會一格一格跳。 */
let locState=null;

/* 螢幕座標 ↔ 經緯度（用目前的 z 與 sc） */
function locScreenToGeo(s, x, y){
  const ox = tmLon2x(s.lng, s.z) * s.sc - s.w / 2;
  const oy = tmLat2y(s.lat, s.z) * s.sc - s.h / 2;
  return [ tmX2lon((ox + x) / s.sc, s.z), tmY2lat((oy + y) / s.sc, s.z) ];
}
/* 把某個地理點放到畫面的 (mx,my)，同時設定縮放 */
function locAnchorTo(z, sc, geo, mx, my){
  const s = locState;
  if(!s) return;
  s.z = Math.max(3, Math.min(18, z));
  s.sc = Math.max(0.5, Math.min(1.9999, sc));
  const wx = tmLon2x(geo[0], s.z) * s.sc;
  const wy = tmLat2y(geo[1], s.z) * s.sc;
  s.lng = tmX2lon((wx - mx + s.w / 2) / s.sc, s.z);
  s.lat = tmY2lat((wy - my + s.h / 2) / s.sc, s.z);
  locDraw();
}

function locDraw(){
  const s = locState;
  if(!s || !s.w || !s.ctx) return;
  s.raf = 0;
  const ctx = s.ctx, w = s.w, h = s.h, z = s.z, sc = s.sc;
  const ts = TM_TILE * sc;              /* 螢幕上一格圖磚的邊長 */
  ctx.setTransform(s.dpr, 0, 0, s.dpr, 0, 0);
  ctx.fillStyle = '#dfe6ec';
  ctx.fillRect(0, 0, w, h);
  const ox = tmLon2x(s.lng, z) * sc - w / 2;
  const oy = tmLat2y(s.lat, z) * sc - h / 2;
  const n = Math.pow(2, z);
  for(let tx = Math.floor(ox / ts); tx <= Math.floor((ox + w) / ts); tx++){
    if(tx < 0 || tx >= n) continue;
    for(let ty = Math.floor(oy / ts); ty <= Math.floor((oy + h) / ts); ty++){
      if(ty < 0 || ty >= n) continue;
      const img = locTileImg(z, tx, ty);
      const X = tx * ts - ox, Y = ty * ts - oy;
      if(img.complete && img.naturalWidth) ctx.drawImage(img, X, Y, ts, ts);
      else if(!img.__wired){ img.__wired = 1; img.addEventListener('load', locSchedule); }
    }
  }
  if(s.pinEl){
    const px = tmLon2x(s.pinLng, z) * sc - ox;
    const py = tmLat2y(s.pinLat, z) * sc - oy;
    s.pinEl.style.transform = 'translate(' + px.toFixed(1) + 'px,' + py.toFixed(1) + 'px) translate(-50%,-50%)';
    s.pinEl.style.opacity = (px < -40 || py < -40 || px > w + 40 || py > h + 40) ? '0' : '1';
  }
}
function locSchedule(){
  const s = locState;
  if(!s || s.raf) return;
  s.raf = requestAnimationFrame(locDraw);
}
function locResize(){
  const s = locState;
  if(!s || !s.cv) return;
  const host = s.cv.parentElement;
  /* 用 clientWidth 而不用 getBoundingClientRect：進場動畫有 scale，
     量到縮細後的尺寸會令標記偏離正中幾個 px。 */
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  s.w = Math.max(1, host.clientWidth);
  s.h = Math.max(1, host.clientHeight);
  s.dpr = dpr;
  s.cv.width = Math.round(s.w * dpr);
  s.cv.height = Math.round(s.h * dpr);
  s.cv.style.width = s.w + 'px';
  s.cv.style.height = s.h + 'px';
  locDraw();
}

/* 兩指：開始 / 移動 / 結束 */
function locPinchStart(){
  const s = locState;
  if(!s) return;
  const ids = Object.keys(s.ptrs);
  if(ids.length < 2){ s.pinch = null; return; }
  const a = s.ptrs[ids[0]], b = s.ptrs[ids[1]];
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  s.pinch = { d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
              sc: s.sc, z: s.z, geo: locScreenToGeo(s, mx, my) };
}
function locPinchMove(){
  const s = locState;
  if(!s || !s.pinch) return;
  const ids = Object.keys(s.ptrs);
  if(ids.length < 2) return;
  const a = s.ptrs[ids[0]], b = s.ptrs[ids[1]];
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const d = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
  let sc = s.pinch.sc * (d / s.pinch.d), z = s.pinch.z;
  /* 倍率走出 0.5–2 就換一級圖磚，這樣 z 永遠停在整數、sc 保持連續 */
  while(sc >= 2 && z < 18){ z++; sc /= 2; }
  while(sc < 0.5 && z > 3){ z--; sc *= 2; }
  const geo = s.pinch.geo;
  s.z = z;
  locAnchorTo(z, sc, geo, mx, my);
}

function openLocationFullscreen(arg){
  if(!arg) return;
  const parts = String(arg).split(',');
  const la = Number(parts[0]), ln = Number(parts[1]);
  if(!isFinite(la) || !isFinite(ln)) return;
  const old = document.getElementById('locationFull');
  if(old) old.remove();
  const div = document.createElement('div');
  div.id = 'locationFull';
  div.className = 'loc-full anim-in-page';
  const coord = escAttr(la.toFixed(6)) + ', ' + escAttr(ln.toFixed(6));
  const ext = 'https://www.openstreetmap.org/?mlat=' + la + '&mlon=' + ln + '#map=16/' + la + '/' + ln;
  div.innerHTML = '<div class="lf-head">'
    + '<button class="lf-back" data-action="closeLocationFull"><svg class="ico"><use href="#i-back"/></svg></button>'
    + '<div class="lf-coord">' + coord + '</div>'
    + '<a class="lf-btn" href="' + escAttr(ext) + '" target="_blank" rel="noopener">在大地圖開啟</a>'
    + '</div>'
    + '<div class="lf-stage"><canvas class="lf-canvas"></canvas>'
    + '<div class="lf-pin"><i></i></div>'
    + '<div class="lf-attr">\u00a9 OpenStreetMap \u8ca2\u737b\u8005</div></div>';
  document.body.appendChild(div);
  const cv = div.querySelector('.lf-canvas');
  /* 位置全部存成經緯度，畫的時候才換算成像素 ——
     跟痕跡地圖同一個原則：距離用地圖單位定義，縮放時才不會愈拖愈歪。 */
  locState = { lat: la, lng: ln, z: 16, sc: 1,
               pinLat: la, pinLng: ln, pinEl: div.querySelector('.lf-pin'),
               cv: cv, ctx: cv.getContext('2d'),
               w: 0, h: 0, dpr: 1, drag: null, ptrs: {}, pinch: null, raf: 0 };

  cv.addEventListener('pointerdown', function(e){
    const s = locState;
    if(!s) return;
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    s.ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    const ids = Object.keys(s.ptrs);
    if(ids.length === 1){ s.drag = { x: e.clientX, y: e.clientY }; s.pinch = null; }
    else if(ids.length === 2){ s.drag = null; locPinchStart(); }
  });
  cv.addEventListener('pointermove', function(e){
    const s = locState;
    if(!s) return;
    const p = s.ptrs[e.pointerId];
    if(!p) return;
    p.x = e.clientX; p.y = e.clientY;
    if(Object.keys(s.ptrs).length >= 2){
      if(!s.pinch) locPinchStart();
      locPinchMove();
      return;
    }
    if(!s.drag) return;
    const dx = e.clientX - s.drag.x, dy = e.clientY - s.drag.y;
    if(!dx && !dy) return;
    s.drag.x = e.clientX;
    s.drag.y = e.clientY;
    /* 手指移動的是螢幕像素，換算成地圖單位要除以 sc */
    s.lng = tmX2lon(tmLon2x(s.lng, s.z) - dx / s.sc, s.z);
    s.lat = Math.max(-85, Math.min(85, tmY2lat(tmLat2y(s.lat, s.z) - dy / s.sc, s.z)));
    locSchedule();
  });
  const locPointerUp = function(e){
    const s = locState;
    if(!s) return;
    delete s.ptrs[e.pointerId];
    const ids = Object.keys(s.ptrs);
    if(ids.length < 2) s.pinch = null;
    if(ids.length === 1) s.drag = { x: s.ptrs[ids[0]].x, y: s.ptrs[ids[0]].y };
    else if(!ids.length) s.drag = null;
  };
  cv.addEventListener('pointerup', locPointerUp);
  cv.addEventListener('pointercancel', locPointerUp);
  /* 雙擊放大（桌面滑鼠用；手機主要靠兩指） */
  cv.addEventListener('dblclick', function(e){
    const s = locState;
    if(!s || s.z >= 18) return;
    const r = cv.getBoundingClientRect();
    const geo = locScreenToGeo(s, e.clientX - r.left, e.clientY - r.top);
    locAnchorTo(s.z + 1, s.sc, geo, e.clientX - r.left, e.clientY - r.top);
  });
  window.addEventListener('resize', locResize);
  locResize();
  /* 進場動畫播完再量一次，確保地圖鋪滿、標記正好在正中 */
  setTimeout(locResize, 60);
  setTimeout(locResize, 340);
}
function closeLocationFull(){
  const el = document.getElementById('locationFull');
  locState = null;
  window.removeEventListener('resize', locResize);
  if(el) animOut(el, 'anim-out-page', 260);
}

/* ===== v1.10 投票系統 ===== */

/* ===== 小遊戲：同源 iframe 覆蓋層（網頁與安卓共用同一份 game.html）===== */
function openGames(roomId,gameKey){
  if(!me){showNotif('請先登入');return;}
  let ov=document.getElementById('gamesOverlay');
  if(ov)ov.remove();
  /* 打遊戲時把所有節日特效收起來（南瓜／雪花／彩帶），
     唔係只係壓低 z-index 咁簡單 —— 直接唔渲染，手機省電又唔會分心。 */
  try{ const fx=document.getElementById('festive'); if(fx) fx.remove(); }catch(e){}
  ov=document.createElement('div');
  ov.id='gamesOverlay';
  let url='game.html?u='+encodeURIComponent(me.username)+'&theme='+encodeURIComponent(theme==='light'?'light':'dark')
    +'&v='+encodeURIComponent(CURRENT_VERSION||'');
  if(roomId)url+='&room='+encodeURIComponent(roomId);
  if(gameKey)url+='&game='+encodeURIComponent(gameKey);
  ov.innerHTML=`<iframe id="gamesFrame" tabindex="0" src="${escAttr(url)}" allow="clipboard-write"></iframe>`;
  document.body.appendChild(ov);

async function submitPollVote(msgId){
  const sel=(window._pollSel&&window._pollSel[msgId])||[];
  if(sel.length===0){showNotif('請至少選一個');return;}
  /* v1.37：群聊也有投票了。群聊訊息多帶 _scope='group' 與 _gk=群組key，
     所以同一個函式可以同時處理公共聊天室與群聊的投票。 */
  const m=allMsgs().find(x=>x.id===msgId)||currentGroupMsgs.find(x=>x.id===msgId);
  if(!m)return;
  const pollPath=(m._scope==='group'&&m._gk)?('groupMessages/'+m._gk+'/'+m._key):('messages/'+m._key);
  // 送出前把所有規則再檢查一次：截止、重複投票、封禁、選項範圍、單選一項、多選上限
  const now=Date.now();
  if(m.pollDeadline&&now>=m.pollDeadline){showNotif('投票已結束');return;}
  if(m.pollVotes&&m.pollVotes[me.username]){showNotif('你已投過票');return;}
  if(me.banned&&me.banned.type==='light'){showNotif('你目前被限制發言');return;}
  const opts=m.pollOptions||[];
  const mode=m.pollMode||'single';
  const maxSel=m.pollMaxSelect||0;
  let clean=Array.from(new Set(sel)).filter(i=>Number.isInteger(i)&&i>=0&&i<opts.length).sort((a,b)=>a-b);
  if(clean.length===0){showNotif('請至少選一個');return;}
  if(mode==='single')clean=[clean[0]];
  if(mode==='multi'&&maxSel>0&&clean.length>maxSel){showNotif('超過上限（最多 '+maxSel+' 項）');return;}
  try{ await update(ref(db,pollPath+'/pollVotes'),{[me.username]:clean.slice()}); window._pollSel[msgId]=[]; showNotif('已投票'); }catch(e){showNotif('投票失敗');}
}

/* ── 頁面層級堆疊 ──
   以前所有頁面都是直接把 #pageRoot 整個覆寫掉，按「←」就無條件清空，
   所以「管理員後台 → 某同學資料 → 他的日誌」按返回會直接掉回聊天室。
   現在改成：開新一層之前先把「目前這層」的完整 HTML 存起來，返回時還原。 */

/* ── v1.12 退場動畫工具 ──
   安卓版每次離開畫面都有轉場，網頁版原本沒有。這裡統一收口：
   任何東西要離開畫面，都先播完動畫，才真的從 DOM 移除。
   - animOut：播完動畫後把節點整個移除（用於頁面、彈窗、遮罩）
   - animHide：播完動畫後只加 hidden / 移除 class，節點保留（用於 + 面板這類常駐元素） */
const ENTER_CLASSES=['anim-in-page','anim-in-back','anim-in-modal','anim-in-bar','anim-in-notif'];
function animOut(el,cls,ms){
  return new Promise(res=>{
    if(!el){res();return;}
    let done=false;
    const fin=()=>{
      if(done)return;done=true;
      el.removeEventListener('animationend',onEnd);
      if(el.parentNode)el.parentNode.removeChild(el);
      res();
    };
    // animationend 會冒泡：子元素自己的動畫結束也會傳上來，必須確認是「自己」播完
    const onEnd=e=>{ if(e.target===el)fin(); };
    el.classList.remove(...ENTER_CLASSES);   // 進場 class 先拿掉，免得蓋住退場動畫
    el.classList.add(cls);
    el.addEventListener('animationend',onEnd);
    setTimeout(fin,(ms||260)+140);      // 保險：動畫沒觸發（例如元素不可見）也要收尾
  });
}
function animHide(el,cls,ms){
  return new Promise(res=>{
    if(!el){res();return;}
    let done=false;
    const fin=()=>{
      if(done)return;done=true;
      el.removeEventListener('animationend',onEnd);
      el.classList.remove(cls);
      res();
    };
    const onEnd=e=>{ if(e.target===el)fin(); };
    el.classList.remove(...ENTER_CLASSES);
    el.classList.add(cls);
    el.addEventListener('animationend',onEnd);
    setTimeout(fin,(ms||160)+140);
  });
}

let pageStack=[];
let currentPageKey=null;
/* ═══ v1.37 返回時要回到原本的捲動位置 ═══
   用戶投訴：「每當進入一個名稱然後退出來都是重新刷新頁面，
   我如果滑到很下，然後進去再退出來，我會在上面。」
   原因：popPage() 以前直接 fp.scrollTop=0（HTML 還原了，但把捲動位置歸零）；
   從管理員後台／在線查詢點進某人的資料頁再返回，清單就被拉回最頂。
   現在 push 的時候連 scrollTop 一起存，pop 的時候一起還原；
   回到主聊天室（疊層空了）也還原 #chatBox 的位置。 */
let chatScrollMemo=0;
let suppressAutoScrollUntil=0;   /* 返回主畫面後短暫鎖住「自動捲到底」，否則新訊息一到位置又被拉走 */
let _pageSameKey=false;          /* 這次是「同一個 key 就地重繪」而不是新開一層 */
/* 捲動容器其實有三個：openPage() 開的 .fp-body、私聊的 #pcBody、管理員後台的 #adminBody。
   以前只認 .fp-body，所以在管理員後台切分頁、或者私聊退出，位置一律歸零。 */
const SCROLL_SELECTORS=['.fp-body','#pcBody','#adminBody'];
function findScroller(){
  for(const s of SCROLL_SELECTORS){
    const el=pageRoot.querySelector(s)||document.querySelector(s);
    if(el&&el.scrollHeight>el.clientHeight+4)return el;
  }
  for(const s of SCROLL_SELECTORS){
    const el=pageRoot.querySelector(s)||document.querySelector(s);
    if(el)return el;
  }
  return null;
}
function pageScrollerTop(){ const el=findScroller(); return el?el.scrollTop:0; }
function restorePageScroll(top){
  const el=findScroller();
  if(!el)return false;
  const max=Math.max(0,el.scrollHeight-el.clientHeight);
  el.scrollTop=Math.min(top||0,max);   /* 內容未長高就先夾住，之後幾次補還原會追上去 */
  return true;
}
/* ═══ v1.38.5 全頁重寫的唯一出口 ═══
   以前有十幾處直接寫 pageRoot.innerHTML，每一處都會把捲動位置歸零；
   其中「同一個 key 重新渲染」的情況（封禁／授權完再開同一頁、切管理分頁、
   按完全部確定）最容易被看成「整個頁面重新載入、被拉回最上面」。
   現在統一走這裡：同 key 自動保住位置，新開一層才由 0 開始。 */
function setPageHTML(html,keepScroll){
  const keep=(keepScroll===undefined)?_pageSameKey:keepScroll;
  const top=keep?pageScrollerTop():0;
  pageRoot.innerHTML=html;
  if(keep){
    restorePageScroll(top);
    requestAnimationFrame(()=>restorePageScroll(top));
    setTimeout(()=>restorePageScroll(top),120);
    setTimeout(()=>restorePageScroll(top),320);
  }
  return top;
}
/* ═══ v1.38.5 導航序號：擋住「退出去又自己刷新回來」 ═══
   openProfilePage() / openSystemNotice() 這些要先 await 網絡。如果網絡慢，
   用家已經按了返回，await 回來之後仍然會把頁面重新寫進 pageRoot ——
   看起來就是「我明明退了出來，介面自己又刷新了一次」。
   每次導航發一個號，彈頁時把號加一；回來的舊請求驗不過就直接放棄。 */
let navSeq=0;
function navStart(){ return ++navSeq; }

/* ═══ v1.39.4 帶超時的讀取 ═══════════════════════════════════════════
   Firebase 的 get() 在弱網（地鐵、電梯、訊號邊緣）會一直掛著不回來，
   用戶看到的就是「按了個人主頁，完全沒反應」—— 不是出錯，是白等。
   這裡加一個上限：超過 ms 就 reject，由上層顯示「重新載入」按鈕。
   ⚠ 不要直接換掉全站的 get()：很多地方沒有 try/catch，
     換了會變成 Unhandled Rejection。只用在有處理錯誤的頁面。 */
function pGet(path, ms){
  return new Promise(function(resolve, reject){
    let done = false;
    const tid = setTimeout(function(){
      if(done) return;
      done = true;
      reject(new Error('timeout'));
    }, ms || 10000);
    get(child(ref(db), path)).then(function(s){
      if(done) return;
      done = true; clearTimeout(tid); resolve(s);
    }).catch(function(e){
      if(done) return;
      done = true; clearTimeout(tid); reject(e);
    });
  });
}

/* 弱網時顯示的頁面：講清楚是網的問題，並給一個可以再試一次的按鈕 */

/* 弱網測試用唯讀鉤子（跟 __okra、__fxEgg 一樣，只讀不改狀態） */
window.__netTest={pGet:pGet,openProfilePage:openProfilePage,openGroupChat:openGroupChat,netFailPage:netFailPage,
  state:()=>({bar:(document.getElementById('netBar')||{}).textContent||'',groupMsgsReady:groupMsgsReady})};
function navAlive(seq){ return seq===navSeq; }
function beginPage(key){
  if(currentPageKey===null){ chatScrollMemo=chatBox?chatBox.scrollTop:0; currentPageKey=key; _pageSameKey=false; return; }
  if(currentPageKey===key){
    /* 同層重新渲染（封禁完再開同一頁、切管理分頁、投票草稿重繪……）。
       調用方下一句就會把 pageRoot.innerHTML 整個換掉，捲動位置一定歸零。
       這裡記住位置，並在下一個 microtask（＝調用方寫完 HTML 之後）補還原；
       再補兩次 rAF／timeout，處理頭像、圖片非同步撐高的情況。
       有這個兜底，就算某處沒有走 setPageHTML() 也不會被拉回最上面。 */
    _pageSameKey=true;
    const t=pageScrollerTop();
    Promise.resolve().then(()=>{ if(_pageSameKey) restorePageScroll(t); });
    requestAnimationFrame(()=>{ if(_pageSameKey) restorePageScroll(t); });
    setTimeout(()=>{ restorePageScroll(t); },160);
    return;
  }
  _pageSameKey=false;
  // 存快照前先把動畫 class 拿掉，否則還原時會誤播「從右邊進來」而不是「從左邊推回來」
  const cur=pageRoot.querySelector(':scope > .fullPage');
  if(cur)cur.classList.remove('anim-in-page','anim-in-back');
  pageStack.push({html:pageRoot.innerHTML,key:currentPageKey,scroll:pageScrollerTop()});
  if(pageStack.length>20) pageStack.shift();
  currentPageKey=key;
}
function popPage(){
  ++navSeq;                                     /* 進行中的非同步導航全部作廢 */
  _pageSameKey=false;
  const prev=pageStack.pop();
  if(prev){ pageRoot.innerHTML=prev.html; currentPageKey=prev.key; }
  else{ pageRoot.innerHTML=''; currentPageKey=null; }
  // 還原捲動位置要在掛上「從左邊推回來」動畫之後再來一次，
  // 因為動畫 class 會讓瀏覽器重算版面，中間那一次有可能被夾回 0。
  if(prev){ restorePageScroll(prev.scroll); }
  else if(chatBox){ chatBox.scrollTop=chatScrollMemo; suppressAutoScrollUntil=Date.now()+600; if(typeof updateScrollToBottomBtn==='function')updateScrollToBottomBtn(); }
  const np=pageRoot.querySelector(':scope > .fullPage');
  if(np){ np.classList.remove('anim-in-page'); np.classList.add('anim-in-back'); }   // 上一層從左邊推回來
  if(prev){
    /* 分階段補還原：頭像和圖片是非同步撐高的，第一次還原時內容高度還不夠，
       瀏覽器會把 scrollTop 夾成 0 —— 之後就永遠停在頂部。
       這就是「我滑到很下面，退出來卻在最上面」最常見的物理原因。 */
    restorePageScroll(prev.scroll);
    requestAnimationFrame(()=>restorePageScroll(prev.scroll));
    setTimeout(()=>restorePageScroll(prev.scroll),60);
    setTimeout(()=>restorePageScroll(prev.scroll),300);
  }
  /* 返回時貼回來的是一段 HTML 快照，裡面寫死的紅點數字仍然是舊的，
     所以每次還原之後都要重新算一次。 */
  try{ refreshAllBadges(); }catch(e){}
  try{ syncPointNodes(); }catch(e){}
}
function resetPageStack(){ ++navSeq; pageStack=[];currentPageKey=null;_pageSameKey=false;pageRoot.innerHTML=''; }

/* 新開一層頁面時，讓它從右邊滑進來（安卓版的 push 效果）。
   用 MutationObserver 統一掛，不用改 13 個開頁面的地方。 */
if(window.MutationObserver){
  new MutationObserver(muts=>{
    for(const m of muts){
      if(!m.addedNodes)continue;
      m.addedNodes.forEach(n=>{
        if(n&&n.nodeType===1&&n.classList&&n.classList.contains('fullPage')
           &&!n.classList.contains('anim-in-back')&&!n.classList.contains('anim-in-page')){
          n.classList.add('anim-in-page');
        }
      });
    }
  }).observe(pageRoot,{childList:true});
}

let _pageClosing=false;

/* ═══════════════════════════════════════════════════════════════════
   積分顯示的唯一出口
   ───────────────────────────────────────────────────────────────────
   聊天框頂部（#scoreTop）、底部（#scoreBottom）、個人主頁／兌換頁的
   那一行（[data-pts-self="1"]）、積分中心的大字（#ptHeroNum），
   全部只由 paintPoints() 更新，不要在其他地方各自寫 textContent，
   否則一定會漏一兩個（v1.38.15 前的老問題）。
   只改文字、不重建 innerHTML：自動回正每 100ms 叫一次，重建會閃。
   ═══════════════════════════════════════════════════════════════════ */

/* ═══ 徽章解鎖：積分跨過里程碑時彈一次 ═══ */
var BADGE_MARKS=[1000,5000,10000,50000,100000,500000];
var _lastPts=null, _badgeBusy=false;
function checkBadge(v){
  if(_lastPts===null){ _lastPts=v; return; }
  var before=_lastPts; _lastPts=v;
  if(v<=before) return;
  for(var i=0;i<BADGE_MARKS.length;i++){
    var m=BADGE_MARKS[i];
    if(before<m && v>=m){
      try{ if(localStorage.getItem('badge_'+m)==='1') return; localStorage.setItem('badge_'+m,'1'); }catch(e){}
      showBadge(m); return;
    }
  }
}
function showBadge(mark){
  if(_badgeBusy) return;
  _badgeBusy=true;
  var el=document.createElement('div');
  el.className='badge-pop';
  el.innerHTML='<div class="badge-card"><div class="badge-ring">★</div>'
    +'<div class="badge-t">解鎖成就</div><div class="badge-v">積分突破 '+mark.toLocaleString()+'</div></div>';
  document.body.appendChild(el);
  setTimeout(function(){ try{ el.remove(); }catch(e){} _badgeBusy=false; },2600);
}

function paintPoints(v){
  try{ checkBadge(Number(v)||0); }catch(e){}
  const s=String(v), neg=v<0;
  ['scoreTop','scoreBottom'].forEach(function(id){
    const el=document.getElementById(id);
    if(!el)return;
    let sp=el.querySelector('span');
    if(!sp){                                   // 第一次：靜態 HTML 是空的
      el.innerHTML='<svg class="ico"><use href="#i-score"/></svg><span></span>';
      sp=el.querySelector('span');
    }
    if(sp&&sp.textContent!==s){
      sp.textContent=s;
      el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    }
    el.classList.toggle('neg',neg);
  });
  document.querySelectorAll('[data-pts-self="1"]').forEach(function(el){
    if(el.textContent!==s)el.textContent=s;
  });
  const hero=document.getElementById('ptHeroNum');
  if(hero){ if(hero.textContent!==s)hero.textContent=s; hero.classList.toggle('neg',neg); }
}
/* ═══════════════════════════════════════════════════════════════════
   積分自動回正（只對 stu14 一個帳戶生效）
   ───────────────────────────────────────────────────────────────────
   需求原文：積分被扣或者被加、不等於 1,000,000 的時候，便以每秒 10 點的速度
   變回 1,000,000；但每一個數字的變化過程都要看得清楚，不是 999990 直接跳 1000000。

   所以這裡是「一步只走 1 點、每 100ms 走一步」＝每秒 10 點：
       999997 → 999998 → 999999 → 1000000
   而不是每 100ms 加 10 點。

   兩層分工，避免把資料庫寫爆：
     · 資料庫：偵測到偏離就一次過寫成 1,000,000（只寫一次），
       這樣兌換／商店的交易讀到的就是 1,000,000，不會因為舊值不夠而失敗。
     · 畫面：由本地計時器逐格爬回去（純顯示層，不再碰資料庫）。
   非 stu14 完全不啟動，連計時器都不建立。
   ═══════════════════════════════════════════════════════════════════ */
const AUTOPT_UID='stu14';
const AUTOPT_TARGET=1000000;   // 目標積分
const AUTOPT_MS=100;           // 每步 100ms × 每步 1 點 ＝ 每秒 10 點
const AUTOPT_MAX=1000;         // 逐格最多爬 1000 步（100 秒）；更大的差距先落到起點再爬
let _autoPtTimer=null,_autoPtBusy=false,_autoPtDbAt=0,_autoPtWatch=false;

function autoPointsOn(){ return !!(me&&me.username===AUTOPT_UID); }

/* 盯住自己的 points：後台改分、其他裝置改分都會即刻回來（只對 stu14 註冊） */
function autoPointsWatch(){
  if(_autoPtWatch||!autoPointsOn())return;
  _autoPtWatch=true;
  try{
    onValue(ref(db,'users/'+me.username+'/points'),function(snap){
      if(_autoPtBusy)return;                 // 本地動畫進行中，以本地值為準
      const v=Number(snap.val())||0;
      if(v===pointsOf(me))return;
      me.points=v;
      paintPoints(v);
      try{ autoPointsKick(); }catch(e){}
    });
  }catch(e){ _autoPtWatch=false; }
}

/* 把資料庫對齊目標（安樂寫法：直接寫，不靠交易讀舊值） */
function autoPointsFlush(){
  if(!autoPointsOn())return;
  try{ set(ref(db,'users/'+me.username+'/points'),AUTOPT_TARGET).catch(function(){}); }catch(e){}
}

function autoPointsStop(){
  if(_autoPtTimer){ clearInterval(_autoPtTimer); _autoPtTimer=null; }
  _autoPtBusy=false;
}

function autoPointsKick(){
  if(!autoPointsOn()){ if(_autoPtTimer)autoPointsStop(); return; }
  autoPointsWatch();
  if(_autoPtBusy)return;
  if(pointsOf(me)===AUTOPT_TARGET)return;
  autoPointsStart();
}

function autoPointsStart(){
  _autoPtBusy=true;
  /* 差距太大（例如真的被改成 0 分）就不逐格爬幾萬步：先落到起點再爬，過程一樣逐格看得清 */
  const cur=pointsOf(me);
  if(Math.abs(cur-AUTOPT_TARGET)>AUTOPT_MAX){
    me.points=cur<AUTOPT_TARGET?AUTOPT_TARGET-AUTOPT_MAX:AUTOPT_TARGET+AUTOPT_MAX;
    paintPoints(me.points);
  }
  /* 資料庫一次過對齊目標（1.2 秒冷卻，避免連續兌換時狂寫） */
  const now=Date.now();
  if(now>=_autoPtDbAt){ _autoPtDbAt=now+1200; autoPointsFlush(); }
  if(_autoPtTimer)clearInterval(_autoPtTimer);
  _autoPtTimer=setInterval(function(){
    if(!autoPointsOn()){ autoPointsStop(); return; }
    const v=pointsOf(me);
    if(v===AUTOPT_TARGET){ autoPointsFlush(); autoPointsStop(); return; }
    const n=v<AUTOPT_TARGET?v+1:v-1;
    me.points=n;
    paintPoints(n);
  },AUTOPT_MS);
}
/* ═══════════════════════════════════════════════════════════════════
   v1.38.10 積分中心（整頁）
   ───────────────────────────────────────────────────────────────────
   入口：個人主頁「目前積分」那一行（只有自己的主頁可以點）。
   一頁之內做三件事：看分數、輸入兌換碼、用積分兌換商店商品。
   用戶明確要求「兌換積分介面是整個頁面，不是一個小卡片」，
   所以這裡走 beginPage/setPageHTML 的正常分頁流程，可以按返回。
   資料：
     redeem/{CODE} = {code,points,note,createdBy,createdAt,usedBy,usedAt}
       · 任何人用過（usedBy 有值）就永久失效，這是用戶指定的規則
     shop/{pushKey} = {name,cost,stock,note,createdAt,createdBy}
       · stock 為 null／空 = 不限量；扣到 0 顯示「已兌換完」
     redeemLog/{username}/{pushKey} = {code,points,at}
     shopOrders/{username}/{pushKey} = {item,name,cost,at}
   扣分／加分一律用 runTransaction，避免兩個人同時兌換把分數蓋掉。
   ═══════════════════════════════════════════════════════════════════ */
function openPointsPage(){
  const seq=navStart();
  beginPage('points');
  setPageHTML(`<div class="fullPage"><div class="fp-header"><button class="fp-back" data-action="closePage"><svg class="ico"><use href="#i-back"/></svg></button><div class="fp-title">積分</div></div><div class="fp-body"><div class="profile-content">
    <div class="pt-hero"><div class="pt-hero-label">目前積分</div><div class="pt-hero-num"><svg class="ico"><use href="#i-score"/></svg><span id="ptHeroNum">${pointsOf(me)}</span></div></div>
    <div class="section-title">兌換積分</div>
    <div class="pt-code"><input type="text" id="redeemInput" placeholder="輸入兌換碼" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn-primary" data-action="redeemCode" id="redeemBtn">兌換</button></div>
    <div class="pt-msg" id="redeemMsg"></div>
    <div class="section-title">積分商店</div>
    <div class="shop-grid" id="shopList"><div class="empty">正在載入商品…</div></div>
    <div class="section-title">最近的兌換</div>
    <div id="ptHis"><div class="empty">正在載入…</div></div>
  </div></div></div>`);
  /* 輸入框按 Enter 直接兌換 */
  const inp=document.getElementById('redeemInput');
  if(inp)inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); redeemCode(); } });
  loadShopAndHistory(seq);
}
async function loadShopAndHistory(seq){
  try{
    const [shopSnap,logSnap,ordSnap]=await Promise.all([
      get(ref(db,'shop')),
      get(ref(db,'redeemLog/'+me.username)),
      get(ref(db,'shopOrders/'+me.username)),
    ]);
    if(seq!=null&&!navAlive(seq))return;
    /* 商品清單 */
    const shopEl=document.getElementById('shopList');
    if(shopEl){
      const items=shopSnap.exists()?Object.entries(shopSnap.val()):[];
      items.sort((a,b)=>(Number(a[1].cost)||0)-(Number(b[1].cost)||0)||((a[1].createdAt||0)-(b[1].createdAt||0)));
      if(!items.length)shopEl.innerHTML='<div class="empty">暫時未有商品</div>';
      else shopEl.innerHTML=items.map(([id,it])=>{
        const cost=Number(it.cost)||0;
        const stock=(it.stock==null||it.stock==='')?null:Number(it.stock);
        const sold=stock!==null&&stock<=0;
        /* 八達通式：積分不夠就換不到，餘額永遠不會被扣到負數。
           按鈕要寫明「積分不足」，只變灰會令人以為按壞了。 */
        const enough=pointsOf(me)>=cost;
        const can=enough&&!sold;
        const label=sold?'已換完':(enough?'兌換':'積分不足');
        return `<div class="shop-card ${sold?'sold':''}"><div class="sh-main"><div class="sh-name">${escapeHtml(it.name||'')}</div>${it.note?`<div class="sh-note">${escapeHtml(it.note)}</div>`:''}<div class="sh-cost"><svg class="ico"><use href="#i-score"/></svg>${cost}${stock!==null?` · 剩 ${Math.max(0,stock)} 份`:''}</div></div><button class="btn-primary sh-btn" data-action="buyShopItem" data-arg="${escAttr(id)}" ${can?'':'disabled'}>${label}</button></div>`;
      }).join('');
    }
    /* 兌換紀錄：兌換碼與商品合併，時間新到舊，最多 20 條 */
    const rows=[];
    if(logSnap.exists())Object.values(logSnap.val()).forEach(x=>rows.push({t:'兌換碼 '+String(x.code||''),p:Number(x.points)||0,at:Number(x.at)||0}));
    if(ordSnap.exists())Object.values(ordSnap.val()).forEach(x=>rows.push({t:'兌換 '+String(x.name||''),p:-(Number(x.cost)||0),at:Number(x.at)||0}));
    rows.sort((a,b)=>b.at-a.at);
    const hisEl=document.getElementById('ptHis');
    if(hisEl){
      if(!rows.length)hisEl.innerHTML='<div class="empty">還沒有兌換紀錄</div>';
      else hisEl.innerHTML='<div class="pt-his">'+rows.slice(0,20).map(r=>`<div class="pt-his-row"><span class="h-t">${escapeHtml(r.t)}</span><span class="h-d">${fmtShortTime(r.at)}</span><span class="h-p ${r.p>=0?'plus':'minus'}">${r.p>=0?'+':''}${r.p}</span></div>`).join('')+'</div>';
    }
  }catch(e){
    const shopEl=document.getElementById('shopList');
    if(shopEl&&!/^\s*$/.test(shopEl.innerHTML.replace(/<[^>]*>/g,''))){/* 已有內容就不要蓋掉 */}
    else if(shopEl)shopEl.innerHTML='<div class="empty">載入失敗，請稍後再試</div>';
  }
}
function fmtShortTime(t){
  if(!t)return '';
  const d=new Date(t), n=new Date();
  const p=x=>String(x).padStart(2,'0');
  const hm=p(d.getHours())+':'+p(d.getMinutes());
  if(d.toDateString()===n.toDateString())return '今天 '+hm;
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}
/* 兌換碼：格式化成大寫、去掉空白與連字號，避免同學打「ABCD-1234」就兌換失敗 */
function normCode(s){ return String(s||'').toUpperCase().replace(/[\s\-－_]/g,'').trim(); }
async function redeemCode(){
  const inp=document.getElementById('redeemInput');
  const msg=document.getElementById('redeemMsg');
  const btn=document.getElementById('redeemBtn');
  if(!inp||!msg)return;
  const code=normCode(inp.value);
  const say=(txt,ok)=>{ msg.textContent=txt; msg.className='pt-msg '+(ok?'ok':'bad'); };
  if(!code){ say('請先輸入兌換碼',false); inp.focus(); return; }
  if(btn){ btn.disabled=true; btn.classList.add('btn-loading'); }
  say('正在兌換…',true);
  try{
    /* ⚠ 必須先 get 一次，把節點拉進本地快取。
       runTransaction 第一輪是用本地快取當 cur；如果本地沒有這個節點，cur 就是 null，
       而 cur 為 null 時返回 undefined 會即場中止，SDK 根本不會去伺服器確認 ——
       結果就是「明明未用過都話已經被使用」。先讀一次就沒有這個問題。 */
    const pre=await get(ref(db,'redeem/'+code));
    if(!pre.exists()){ say('兌換碼不正確',false); inp.value=''; return; }
    if((pre.val()||{}).usedBy){ say('這個兌換碼已經被使用了',false); inp.value=''; return; }
    /* 用交易把「寫入使用人」和「檢查是否已用」綁在一起：
       兩個人同時輸入同一組碼，只有一個人的交易會成功。 */
    const tr=await runTransaction(ref(db,'redeem/'+code),cur=>{
      /* ⚠ 這裡不可以 return（undefined）！
         runTransaction 第一輪是用本地快取當 cur，本地未有這個節點時 cur 是 null。
         回傳 undefined 等於「即刻放棄」，SDK 連伺服器都不會問，
         結果就是「明明未用過都話已用」。回傳 null 代表「維持不存在」，
         SDK 會拿伺服器真實值再跑一次，到時 cur 就有值了。 */
      if(cur===null)return null;
      if(cur.usedBy)return;        // 已經被用過 → 中止
      return {code:cur.code||code,points:Number(cur.points)||0,note:cur.note||'',
              createdBy:cur.createdBy||'',createdAt:Number(cur.createdAt)||0,
              usedBy:me.username,usedAt:Date.now()};
    });
    if(!tr.committed){
      say('這個兌換碼已經被使用了',false);
      inp.value='';
      return;
    }
    const got=Number((tr.snapshot.val()||{}).points)||0;
    /* 加分同樣用交易，避免和商店扣分撞在一起 */
    try{ await get(ref(db,'users/'+me.username+'/points')); }catch(e){}
    const pr=await runTransaction(ref(db,'users/'+me.username+'/points'),v=>{
      if(v===null)return null;
      let n=(Number(v)||0)+got;
      if(n>9007199254740991)n=9007199254740991;   // 超過 JS 安全整數會失真，封頂
      return n;
    });
    if(!pr.committed){
      /* 加分失敗 → 把兌換碼放回去，不能讓同學白蝕一組碼 */
      try{ await update(ref(db,'redeem/'+code),{usedBy:null,usedAt:null}); }catch(e){}
      say('兌換失敗，請再試一次',false);
      return;
    }
    me.points=Number(pr.snapshot.val())||0;
    try{ await push(ref(db,'redeemLog/'+me.username),{code:code,points:got,at:Date.now()}); }catch(e){}
    renderPoints(); syncPointNodes();

async function buyShopItem(id){
  if(!id)return;
  const seq=navStart();
  try{
    const snap=await get(ref(db,'shop/'+id));
    if(!snap.exists()){ showNotif('商品已經下架'); loadShopAndHistory(seq); return; }
    const it=snap.val();
    const cost=Number(it.cost)||0;
    const stock=(it.stock==null||it.stock==='')?null:Number(it.stock);
    if(stock!==null&&stock<=0){ showNotif('這個商品已經換完'); loadShopAndHistory(seq); return; }
    if(pointsOf(me)<cost){ showNotif('積分不足，還差 '+(cost-pointsOf(me))+' 分'); return; }
    if(!(await askConfirm({title:'兌換確認',html:'確定用 '+cost+' 分兌換「'+(it.name||'')+'」？'})))return;
    /* 先扣分（最關鍵的一步），扣不到就整個取消 */
    try{ await get(ref(db,'users/'+me.username+'/points')); }catch(e){}
    const pr=await runTransaction(ref(db,'users/'+me.username+'/points'),v=>{
      if(v===null)return null;     // 本地未有資料 → 交回伺服器重試
      const n=Number(v)||0;
      if(n<cost)return;            // 分數不夠 → 中止
      return n-cost;
    });
    if(!pr.committed){ showNotif('積分不足，還差 '+(cost-pointsOf(me))+' 分'); return; }
    me.points=Number(pr.snapshot.val())||0;
    /* 再扣庫存；若這一步失敗（例如最後一份剛被別人換走）就把分數退回去 */
    let stockOk=true;
    if(stock!==null){
      const sr=await runTransaction(ref(db,'shop/'+id),cur=>{
        if(cur===null)return null;
        const s=Number(cur.stock);
        if(!(s>0))return;          // 已經沒有庫存 → 中止
        return {...cur,stock:s-1};
      });
      stockOk=sr.committed;
    }
    if(!stockOk){
      const back=await runTransaction(ref(db,'users/'+me.username+'/points'),v=>{
        if(v===null)return null;
        return (Number(v)||0)+cost;
      });
      if(back.committed)me.points=Number(back.snapshot.val())||0;
      showNotif('這個商品剛剛被換完，積分已退回');
      renderPoints(); syncPointNodes(); loadShopAndHistory(seq);
      return;
    }
    try{ await push(ref(db,'shopOrders/'+me.username),{item:id,name:it.name||'',cost:cost,at:Date.now()}); }catch(e){}
    renderPoints(); syncPointNodes();
    showNotif('已兌換「'+(it.name||'')+'」');
    try{ writeLog('shopbuy','兌換 '+String(it.name||'')+' -'+cost+' 分'); }catch(e){}
    loadShopAndHistory(seq);
  }catch(e){
    showNotif('兌換失敗，請稍後再試');
  }
}

const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genCode(len){
  len=len||8;
  const arr=new Uint8Array(len);
  try{ crypto.getRandomValues(arr); }catch(e){ for(let i=0;i<len;i++)arr[i]=Math.floor(Math.random()*256); }
  let s='';
  for(let i=0;i<len;i++)s+=CODE_CHARS[arr[i]%CODE_CHARS.length];
  return s;
}

function copyText(txt){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); return; }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
  }catch(e){}
}

/* ═══ v1.38.12 後台積分管理 ═══
   kind: 'add' 加 / 'sub' 減 / 'set' 直接設定
   減分不可以扣到負數（跟商店消費同一個八達通規則），超出就直接擋住並講清楚最多扣幾多。
   全部走 runTransaction：對方同一時間在商店兌換都不會互相蓋掉。 */
async function adminPts(kind,username){
  if(me.role!=='superadmin'||!username)return;
  const valEl=document.getElementById('pa_val');
  const errEl=document.getElementById('paErr');
  const sayBad=t=>{ if(errEl)errEl.textContent=t; };
  if(errEl)errEl.textContent='';
  const raw=String((valEl||{}).value||'').trim();
  const n=Math.floor(Number(raw));
  if(raw===''||!Number.isFinite(n)||n<0){ sayBad('請輸入 0 或以上的整數'); return; }
  const snap=await get(ref(db,'users/'+username+'/points'));
  const cur=Number(snap.val())||0;
  let target;
  if(kind==='add')target=cur+n;
  else if(kind==='sub'){
    if(n>cur){ sayBad('最多只可以減 '+cur+' 分（不可以扣到負數）'); return; }
    target=cur-n;
  }else target=n;
  if(target>9007199254740991)target=9007199254740991;
  try{
    const r=await runTransaction(ref(db,'users/'+username+'/points'),v=>{
      if(v===null)return null;
      /* 交易內再按一次規則檢查：讀取之後對方可能已經花掉分數 */
      const now=Number(v)||0;
      if(kind==='add')return Math.min(9007199254740991,now+n);
      if(kind==='sub')return n>now?now:now-n;
      return target;
    });
    if(!r.committed){ sayBad('操作失敗，請再試一次'); return; }
    const after=Number(r.snapshot.val())||0;
    const nowEl=document.getElementById('paNow');
    if(nowEl)nowEl.textContent=after;
    if(valEl)valEl.value='';
    if(username===me.username){ me.points=after; renderPoints(); }
    const label=kind==='add'?'加 ':(kind==='sub'?'減 ':'設為 ');
    try{ writeLog('adminpts',label+n+' 分 → '+username+'（'+cur+' → '+after+'）'); }catch(e){}
    showNotif(label+n+' 分完成，現在 '+after+' 分');
    /* 個人主頁／其他地方貼回快照時靠這個刷新 */
    try{ syncPointNodes(); }catch(e){}
    /* 減分途中對方剛花掉分數 → 交易內按「不可以負數」夾住了，要講清楚實際扣了多少 */
    if(kind==='sub'&&(cur-after)!==n)sayBad('對方分數剛剛有變動，實際只扣了 '+(cur-after)+' 分');
  }catch(e){
    sayBad('操作失敗，請稍後再試');
  }
}

/* 小工具清單可以完全由伺服器決定（meta/remote/tools）。

     只有直接寫資料庫的人（開發者）才改得到。 */
const TOOL_LIVE_ACTIONS={ openLiveMap:1 };
/* 入口副標題跟住實際工具數量：清單可以由伺服器改，寫死就會過時 */

function toolList(){
  const raw=REMOTE.tools;
  if(!raw||typeof raw!=='object')return TOOL_LIST;
  const out=[];
  Object.keys(raw).forEach(function(k){
    const t=raw[k];
    if(!t||typeof t!=='object')return;
    if(t.on===false)return;
    const name=String(t.name==null?'':t.name).trim().slice(0,40);
    if(!name)return;
    /* 連結只准同一層的 .html 檔名，不接受 http://、//、javascript: 之類 */
    const hrefRaw=String(t.href==null?'':t.href).trim();
    const href=/^[A-Za-z0-9._-]+\.html$/.test(hrefRaw)?hrefRaw:'';
    const act=String(t.action==null?'':t.action).trim();
    const action=TOOL_LIVE_ACTIONS[act]?act:'';
    const icon=String(t.icon==null?'':t.icon).trim();
    /* 既沒有合法連結、又不是內建頁面 → 這張卡按下去甚麼都不會發生，直接不收 */
    if(!href&&!action)return;
    out.push({
      id:String(k).slice(0,40),
      name:name,
      desc:String(t.desc==null?'':t.desc).trim().slice(0,180),
      icon:/^i-[a-z0-9-]{1,30}$/.test(icon)?icon:'i-grid',
      color:t.color,
      href:href,
      action:action,
      order:(isFinite(Number(t.order))?Number(t.order):0)
    });
  });
  out.sort(function(a,b){ return a.order-b.order; });
  /* 全部被關掉 → 給一個空清單，由頁面顯示「暫無工具」 */
  return out;
}

     · 於是 fallback 去 location.href = url，整個聊天室被導走
     · 在部分內建瀏覽器或 Android WebView，這個導航會被當成外部跳轉，
       結果彈回個人主頁；再按一次又是一樣，看起來就是「一直跳轉」
   現在工具直接蓋在聊天室上面，關掉就回到原本的位置，全程沒有導航。 */
let toolFrameEl=null;
/* 工具頁加上版本參數：GitHub Pages 的 HTML 有 10 分鐘快取，不加這個的話
   部署完之後，聊天室裡的 iframe 仍然會拿到舊版（用戶實際就是撞到這個）。 */
function toolVerURL(url){
  if(!url) return url;
  return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'v=' + encodeURIComponent(CURRENT_VERSION || '');
}
function closeToolFrame(){
  if(!toolFrameEl) return;
  try{ toolFrameEl.remove(); }catch(e){}
  toolFrameEl=null;
  document.body.style.removeProperty('overflow');
}
function openToolFrame(url,name){
  if(!url) return;
  closeToolFrame();
  const el=document.createElement('div');
  el.className='tool-frame';
  el.id='toolFrame';
  el.innerHTML='<div class="tf-bar">'
    +'<button class="tf-back" type="button" aria-label="返回"><svg class="ico"><use href="#i-back"/></svg></button>'
    +'<div class="tf-title">'+escapeHtml(name||'小程式')+'</div>'
    +'<button class="tf-open" type="button">新視窗</button>'
    +'</div>'
    +'<div class="tf-body"><div class="tf-load">正在載入小程式…</div>'
    +'<iframe title="'+escAttr(name||'小程式')+'" src="'+escAttr(toolVerURL(url))+'" '
    +'allow="geolocation; fullscreen; clipboard-write" referrerpolicy="same-origin"></iframe></div>';
  document.body.appendChild(el);
  document.body.style.setProperty('overflow','hidden');
  toolFrameEl=el;
  const ifr=el.querySelector('iframe');
  el.querySelector('.tf-back').addEventListener('click',closeToolFrame);
  el.querySelector('.tf-open').addEventListener('click',function(){
    /* 桌面想開另一個視窗就看這顆；被攔都無所謂，因為工具本身已經開著 */
    try{ window.open(toolVerURL(url),'_blank'); }catch(e){}
  });
  el.querySelector('.tf-load').textContent='正在載入 '+String(name||'小程式')+'…';
  try{
    ifr.addEventListener('load',function(){ el.classList.add('ready'); });
    /* 保險：4 秒後無論如何收埋「正在載入」，唔好一直卡住 */
    setTimeout(function(){ el.classList.add('ready'); },4000);
  }catch(e){}
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeToolFrame(); });
document.addEventListener('click', function(e){
  const a = e.target && e.target.closest ? e.target.closest('[data-tool-link]') : null;
  if(!a) return;
  e.preventDefault();
  const url = a.getAttribute('href');
  if(!url) return;
  const tEl=a.querySelector('.tool-t');
  openToolFrame(url, tEl?tEl.textContent.trim():'小程式');
});

/* ═══ v1.38 全班共享地圖 ═════════════════════════════════════════════
   只顯示「已同意共享」的人：
     · 進入時先問定位權限；拒絕就即刻退回小工具，一粒資料都不會留
     · 每 10 秒寫一次 liveLoc/{帳號}；同時掛 onDisconnect，
       連線一斷（關頁、斷網、當機）伺服器就自動刪除，不會留殘影
     · 分享模式兩種：
         最新位置 ── 只寫當前位置
         歷史軌跡 ── 另外每 10 秒 push 一個點去 liveTrail/{帳號}，
                     其他人看到的是一條連起來的線；離開時整條刪除
     · 標記顏色直接用 users 入面那個人自己的顏色
   全程只存「當下」，不寫 messages、不寫 logs，任何人都不能回看。 */
const LIVE_TICK=10000;      /* 寫入間隔：10 秒 */
const LIVE_STALE=120000;    /* 超過 2 分鐘沒心跳 = 已離線，順手清走 */
let liveState=null, liveWatch=null, liveTimer=null;
let liveUnsubA=null, liveUnsubB=null;
let liveMe=null, liveMode='live', liveUsers={}, liveTrails={};

/* ---- 畫面 ---- */
function liveSchedule(){
  const s=liveState;
  if(!s||s.raf)return;
  s.raf=requestAnimationFrame(liveRender);
}
function liveDrawTiles(){
  const s=liveState;
  if(!s||!s.w||!s.ctx)return null;
  const ctx=s.ctx,w=s.w,h=s.h,z=s.z,sc=s.sc||1,ts=TM_TILE*sc;
  ctx.setTransform(s.dpr,0,0,s.dpr,0,0);
  ctx.fillStyle='#dfe6ec';
  ctx.fillRect(0,0,w,h);
  const ox=tmLon2x(s.lng,z)*sc-w/2, oy=tmLat2y(s.lat,z)*sc-h/2, n=Math.pow(2,z);
  for(let tx=Math.floor(ox/ts);tx<=Math.floor((ox+w)/ts);tx++){
    if(tx<0||tx>=n)continue;
    for(let ty=Math.floor(oy/ts);ty<=Math.floor((oy+h)/ts);ty++){
      if(ty<0||ty>=n)continue;
      const img=locTileImg(z,tx,ty);
      const X=tx*ts-ox, Y=ty*ts-oy;
      if(img.complete&&img.naturalWidth) ctx.drawImage(img,X,Y,ts,ts);
      else if(!img.__lw){ img.__lw=1; img.addEventListener('load',liveSchedule); }
    }
  }
  return { ox:ox, oy:oy, sc:sc };
}
function liveRender(){
  const s=liveState;
  if(!s)return;
  s.raf=0;
  const o=liveDrawTiles();
  if(!o)return;
  const ctx=s.ctx, z=s.z;
  /* 軌跡：先畫白色粗底，再畫彩色細線，淺色地圖上都看得清 */
  Object.keys(liveTrails).forEach(function(u){
    const info=liveUsers[u];
    const tr=liveTrails[u];
    if(!tr||!info||info.mode!=='trail')return;
    const pts=Object.keys(tr).map(function(k){ return tr[k]; })
      .filter(function(p){ return p&&isFinite(p.lat)&&isFinite(p.lng); })
      .sort(function(a,b){ return (a.t||0)-(b.t||0); });
    if(pts.length<2)return;
    const col=safeColor(info.color,'#3b82f6');
    const path=new Path2D();
    pts.forEach(function(p,i){
      const x=tmLon2x(Number(p.lng),z)*o.sc-o.ox, y=tmLat2y(Number(p.lat),z)*o.sc-o.oy;
      if(i===0)path.moveTo(x,y); else path.lineTo(x,y);
    });
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.strokeStyle='rgba(255,255,255,.85)';
    ctx.lineWidth=7;
    ctx.stroke(path);
    ctx.strokeStyle=col;
    ctx.lineWidth=3.5;
    ctx.stroke(path);
  });
  livePlacePins(o.ox,o.oy,o.sc);
}
function livePlacePins(ox,oy,sc){
  const s=liveState;
  if(!s||!s.pins)return;
  const z=s.z;
  sc=sc||1;
  const seen={};
  Object.keys(liveUsers).forEach(function(u){
    const v=liveUsers[u]||{};
    const la=Number(v.lat), ln=Number(v.lng);
    if(!isFinite(la)||!isFinite(ln))return;
    seen[u]=1;
    let el=s.pinEls[u];
    if(!el){
      el=document.createElement('div');
      el.className='lmk';
      el.innerHTML='<span class="lmk-dot"></span><span class="lmk-nm"></span>';
      s.pins.appendChild(el);
      s.pinEls[u]=el;
    }
    const x=tmLon2x(ln,z)*sc-ox, y=tmLat2y(la,z)*sc-oy;
    if(x<-90||y<-90||x>s.w+90||y>s.h+90){ el.style.display='none'; return; }
    el.style.display='';
    el.style.transform='translate('+Math.round(x)+'px,'+Math.round(y)+'px)';
    el.style.setProperty('--c',safeColor(v.color,'#3b82f6'));
    const isMe=!!(me&&u===me.username);
    el.classList.toggle('is-me',isMe);
    const nm=el.querySelector('.lmk-nm');
    const txt=isMe?'你':String(v.name||u);
    if(nm.textContent!==txt)nm.textContent=txt;
  });
  Object.keys(s.pinEls).forEach(function(u){
    if(!seen[u]){
      if(s.pinEls[u].parentNode)s.pinEls[u].parentNode.removeChild(s.pinEls[u]);
      delete s.pinEls[u];
    }
  });
  liveUpdateCount();
}
function liveUpdateCount(){
  const el=document.getElementById('liveCount');
  if(!el)return;
  const n=Object.keys(liveUsers).length;
  el.textContent = n?(n+' 人在線'):'等待定位';
}
function liveResize(){
  const s=liveState;
  if(!s||!s.cv)return;
  const host=s.cv.parentElement;
  /* 同 locResize：用 clientWidth，避免進場 scale 影響量出嚟嘅尺寸 */
  const dpr=Math.min(2,window.devicePixelRatio||1);
  s.w=Math.max(1,host.clientWidth);
  s.h=Math.max(1,host.clientHeight);
  s.dpr=dpr;
  s.cv.width=Math.round(s.w*dpr);
  s.cv.height=Math.round(s.h*dpr);
  s.cv.style.width=s.w+'px';
  s.cv.style.height=s.h+'px';
  liveRender();
}
/* 螢幕座標 ↔ 經緯度（共享地圖） */
function liveScreenToGeo(s,x,y){
  const sc=s.sc||1;
  const ox=tmLon2x(s.lng,s.z)*sc-s.w/2, oy=tmLat2y(s.lat,s.z)*sc-s.h/2;
  return [ tmX2lon((ox+x)/sc,s.z), tmY2lat((oy+y)/sc,s.z) ];
}
function liveAnchorTo(z,sc,geo,mx,my){
  const s=liveState;
  if(!s)return;
  s.z=Math.max(3,Math.min(18,z));
  s.sc=Math.max(0.5,Math.min(1.9999,sc));
  const wx=tmLon2x(geo[0],s.z)*s.sc, wy=tmLat2y(geo[1],s.z)*s.sc;
  s.lng=tmX2lon((wx-mx+s.w/2)/s.sc,s.z);
  s.lat=tmY2lat((wy-my+s.h/2)/s.sc,s.z);
  liveRender();
}
/* 兩指：張開放大、捏合縮細，手指中點當縮放中心 */
function livePinchStart(){
  const s=liveState;
  if(!s)return;
  const ids=Object.keys(s.ptrs);
  if(ids.length<2){ s.pinch=null; return; }
  const a=s.ptrs[ids[0]], b=s.ptrs[ids[1]];
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  s.pinch={ d:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),
            sc:s.sc||1, z:s.z, geo:liveScreenToGeo(s,mx,my) };
}
function livePinchMove(){
  const s=liveState;
  if(!s||!s.pinch)return;
  const ids=Object.keys(s.ptrs);
  if(ids.length<2)return;
  const a=s.ptrs[ids[0]], b=s.ptrs[ids[1]];
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  const d=Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));
  let sc=s.pinch.sc*(d/s.pinch.d), z=s.pinch.z;
  while(sc>=2&&z<18){ z++; sc/=2; }
  while(sc<0.5&&z>3){ z--; sc*=2; }
  liveAnchorTo(z,sc,s.pinch.geo,mx,my);
}

/* ---- 分享 ---- */
function livePush(){
  if(!me||!liveMe)return;
  const la=liveMe.lat, ln=liveMe.lng, t=Date.now();
  const payload={
    lat:la, lng:ln, at:t, mode:liveMode,
    color:safeColor(me.color,'#3b82f6'),
    name:me.displayName||me.username,
    cls:me.cls||''
  };
  try{ set(ref(db,'liveLoc/'+me.username),payload); }catch(e){}
  if(liveMode==='trail'){
    try{ set(push(ref(db,'liveTrail/'+me.username)),{lat:la,lng:ln,t:t}); }catch(e){}
  }
}
function liveSetMode(m){
  if(!liveState||!me)return;
  m = (m==='trail')?'trail':'live';
  if(m===liveMode)return;
  liveMode=m;
  const list=document.querySelectorAll('#liveMap [data-action="liveMode"]');
  for(let i=0;i<list.length;i++) list[i].classList.toggle('on',list[i].dataset.arg===m);
  /* 切換就重新開始：舊軌跡整條刪掉，由現在這一刻重新畫 */
  try{ remove(ref(db,'liveTrail/'+me.username)); }catch(e){}
  livePush();
}
function liveStartShare(){
  if(!navigator.geolocation){ liveDeny('這個瀏覽器不支援定位'); return; }
  try{
    onDisconnect(ref(db,'liveLoc/'+me.username)).remove();
    onDisconnect(ref(db,'liveTrail/'+me.username)).remove();
  }catch(e){}
  liveWatch=navigator.geolocation.watchPosition(function(pos){
    liveMe={ lat:pos.coords.latitude, lng:pos.coords.longitude };
    const s=liveState;
    /* 第一次定位：把地圖移到自己身上 */
    if(s&&!s.centered){
      s.centered=1;
      s.lat=liveMe.lat;
      s.lng=liveMe.lng;
      s.z=15;
    }
    /* 心跳一定要在第一次就開 —— 以前這裡 return 得太早，
       要等第二次定位回呼才開始寫，結果第一個位置根本沒送出去。 */
    if(!liveTimer){
      livePush();
      liveTimer=setInterval(livePush,LIVE_TICK);
    }
    liveSchedule();
  },function(err){
    /* 1 = 使用者拒絕、2 = 取不到、3 = 超時 */
    if(err&&err.code===1) liveDeny('未授予定位權限');
    else if(!liveMe) liveDeny('暫時取不到你的位置');
  },{ enableHighAccuracy:true, maximumAge:4000, timeout:15000 });
}
function liveDeny(msg){
  const s=liveState;
  if(!s||!s.stage)return;
  if(liveWatch!=null){ try{ navigator.geolocation.clearWatch(liveWatch); }catch(e){} liveWatch=null; }
  if(liveTimer){ clearInterval(liveTimer); liveTimer=null; }
  s.stage.innerHTML='<div class="live-deny">'
    +'<div class="live-deny-ico"><svg class="ico"><use href="#i-alert"/></svg></div>'
    +'<div class="live-deny-t">'+escapeHtml(msg)+'</div>'
    +'<div class="live-deny-s">共享地圖一定要知道你在哪裡才畫得出標記。'
    +'既然未取得權限，就直接幫你返回小程式。</div></div>';
  /* 用戶要求：不同意共享就直接回到小工具介面 */
  setTimeout(function(){ closeLiveMap(); },2200);
}
function liveSubscribe(){
  liveUnsubA=onValue(ref(db,'liveLoc'),function(snap){
    const val=snap.val()||{};
    const now=Date.now();
    const out={};
    Object.keys(val).forEach(function(u){
      const v=val[u]||{};
      const at=Number(v.at)||0;
      if(now-at>LIVE_STALE){
        /* 對方已經斷線（onDisconnect 正常會處理，這裡是雙重保險） */
        if(!me||u!==me.username){
          try{ remove(ref(db,'liveLoc/'+u)); remove(ref(db,'liveTrail/'+u)); }catch(e){}
        }
        return;
      }
      out[u]=v;
    });
    liveUsers=out;
    liveSchedule();
  });
  liveUnsubB=onValue(ref(db,'liveTrail'),function(snap){
    liveTrails=snap.val()||{};
    liveSchedule();
  });
}

/* ---- 開 / 關 ---- */
function openLiveMap(){
  if(!me){ showNotif('請先登入'); return; }
  const old=document.getElementById('liveMap');
  if(old)old.remove();
  const div=document.createElement('div');
  div.id='liveMap';
  div.className='loc-full anim-in-page';
  div.innerHTML='<div class="lf-head">'
    +'<button class="lf-back" data-action="closeLiveMap"><svg class="ico"><use href="#i-back"/></svg></button>'
    +'<div class="live-title">全班共享地圖</div>'
    +'<div class="live-count" id="liveCount">等待定位</div>'
    +'</div>'
    +'<div class="live-bar"><span class="live-bar-lb">我的分享</span>'
    +'<div class="lvm-group">'
    +'<button class="lvm on" data-action="liveMode" data-arg="live">最新位置</button>'
    +'<button class="lvm" data-action="liveMode" data-arg="trail">歷史軌跡</button>'
    +'</div></div>'
    +'<div class="lf-stage">'
    +'<canvas class="lf-canvas"></canvas>'
    +'<div class="live-pins"></div>'
    +'<div class="live-tip">只會顯示已同意共享的同學</div>'
    +'<div class="lf-attr">\u00a9 OpenStreetMap \u8ca2\u737b\u8005</div>'
    +'</div>';
  document.body.appendChild(div);
  const cv=div.querySelector('.lf-canvas');
  liveMode='live';
  liveUsers={}; liveTrails={}; liveMe=null;
  liveState={ lat:22.3350, lng:114.1700, z:12, sc:1, cv:cv, ctx:cv.getContext('2d'),
              w:0, h:0, dpr:1, drag:null, ptrs:{}, pinch:null, raf:0, centered:0,
              stage:div.querySelector('.lf-stage'),
              pins:div.querySelector('.live-pins'), pinEls:{} };
  cv.addEventListener('pointerdown',function(e){
    const s=liveState; if(!s)return;
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    s.ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    const ids=Object.keys(s.ptrs);
    if(ids.length===1){ s.drag={x:e.clientX,y:e.clientY}; s.pinch=null; }
    else if(ids.length===2){ s.drag=null; livePinchStart(); }
  });
  cv.addEventListener('pointermove',function(e){
    const s=liveState;
    if(!s)return;
    const p=s.ptrs[e.pointerId];
    if(!p)return;
    p.x=e.clientX; p.y=e.clientY;
    if(Object.keys(s.ptrs).length>=2){
      if(!s.pinch)livePinchStart();
      livePinchMove();
      return;
    }
    if(!s.drag)return;
    const dx=e.clientX-s.drag.x, dy=e.clientY-s.drag.y;
    if(!dx&&!dy)return;
    s.drag.x=e.clientX; s.drag.y=e.clientY;
    const sc=s.sc||1;
    s.lng=tmX2lon(tmLon2x(s.lng,s.z)-dx/sc,s.z);
    s.lat=Math.max(-85,Math.min(85,tmY2lat(tmLat2y(s.lat,s.z)-dy/sc,s.z)));
    liveSchedule();
  });
  const relDrag=function(e){
    const s=liveState;
    if(!s)return;
    delete s.ptrs[e.pointerId];
    const ids=Object.keys(s.ptrs);
    if(ids.length<2)s.pinch=null;
    if(ids.length===1)s.drag={x:s.ptrs[ids[0]].x,y:s.ptrs[ids[0]].y};
    else if(!ids.length)s.drag=null;
  };
  cv.addEventListener('pointerup',relDrag);
  cv.addEventListener('pointercancel',relDrag);
  cv.addEventListener('dblclick',function(e){
    const s=liveState; if(!s||s.z>=18)return;
    const r=cv.getBoundingClientRect();
    const geo=liveScreenToGeo(s,e.clientX-r.left,e.clientY-r.top);
    liveAnchorTo(s.z+1,s.sc,geo,e.clientX-r.left,e.clientY-r.top);
  });
  window.addEventListener('resize',liveResize);
  liveResize();
  liveSubscribe();
  liveStartShare();
}
function closeLiveMap(){
  const el=document.getElementById('liveMap');
  if(liveWatch!=null){ try{ navigator.geolocation.clearWatch(liveWatch); }catch(e){} liveWatch=null; }
  if(liveTimer){ clearInterval(liveTimer); liveTimer=null; }
  if(liveUnsubA){ try{ liveUnsubA(); }catch(e){} liveUnsubA=null; }
  if(liveUnsubB){ try{ liveUnsubB(); }catch(e){} liveUnsubB=null; }
  window.removeEventListener('resize',liveResize);
  liveState=null; liveMe=null; liveUsers={}; liveTrails={};
  if(el)animOut(el,'anim-out-page',260);
  /* 離開就即刻收掉自己的位置與軌跡 —— 不想留任何殘影 */
  if(me){
    try{
      remove(ref(db,'liveLoc/'+me.username));
      remove(ref(db,'liveTrail/'+me.username));
    }catch(e){}
  }
}
/* 關頁／切走：再補一次。onDisconnect 是伺服器端的最後防線 */
window.addEventListener('pagehide',function(){
  if(!me)return;
  try{
    remove(ref(db,'liveLoc/'+me.username));
    remove(ref(db,'liveTrail/'+me.username));
  }catch(e){}
});

/* ═══ 撒花粒子 ═══
   照小紅書那個教學的重點做，它特別提醒了大部分人做錯的三件事：
     ① 來源：從「按鈕本身」噴出，不是從螢幕中間炸開
     ② 物理：先衝上去（初速向上）再翻著面飄落，有空氣阻力（越落越慢）
     ③ 退場：一粒一粒淡掉，不是一下全部消失
   另外用 canvas 而不是 DOM —— 90 粒 div 同時動會掉幀，canvas 不會。 */
function confettiBurst(el, opt){
  /* 暴露到 window 方便測試與其他頁面呼叫 */
  try{
    opt = opt || {};
    const r = el && el.getBoundingClientRect ? el.getBoundingClientRect() : null;
    /* ⚠ 元素如果還未佈局（rect 全 0 或 NaN），cy 會變 NaN → 第一幀全部判定「已飛出畫面」
       → canvas 立即被刪 → 用戶完全見不到花。所以座標一定要驗證過才用。 */
    const cx = (r && isFinite(r.left) && isFinite(r.width)) ? (r.left + r.width/2) : window.innerWidth/2;
    const cy = (r && isFinite(r.top) && isFinite(r.height)) ? (r.top + r.height/2) : window.innerHeight*0.4;
    const cv = document.createElement('canvas');
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.floor(window.innerWidth*dpr);
    cv.height = Math.floor(window.innerHeight*dpr);
    cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9600';
    document.body.appendChild(cv);
    const ctx = cv.getContext('2d');
    ctx.scale(dpr,dpr);

    const COLORS = opt.colors || ['#fbbf24','#f472b6','#38bdf8','#4ade80','#a78bfa','#fb923c','#f43f5e'];
    const N = opt.count || 96;
    const P = [];
    for(let i=0;i<N;i++){
      /* 主要向上扇開（-90° 加減 46°），少數向兩側，看起來像禮花筒 */
      const ang = -Math.PI/2 + (Math.random()-0.5)*1.55;
      const sp = 7 + Math.random()*9.5;
      P.push({
        x: cx, y: cy,
        vx: Math.cos(ang)*sp,
        vy: Math.sin(ang)*sp,
        w: 5 + Math.random()*6,
        h: 9 + Math.random()*10,
        rot: Math.random()*Math.PI*2,
        vr: (Math.random()-0.5)*0.32,
        c: COLORS[i % COLORS.length],
        life: 1,
        fade: 0.006 + Math.random()*0.009     /* 每粒淡出速度不同 → 逐粒消失 */
      });
    }
    let last = performance.now();
    const bornAt = last;
    function tick(now){
      const dt = Math.min(2.2, (now-last)/16.7) || 1;
      last = now;
      ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
      let alive = 0;
      for(let i=0;i<P.length;i++){
        const p = P[i];
        p.vy += 0.30*dt;                 /* 重力 */
        p.vx *= 0.991;                   /* 空氣阻力：越落越慢 */
        p.vy *= 0.991;
        p.x += p.vx*dt;
        p.y += p.vy*dt;
        p.rot += p.vr*dt;
        p.life -= p.fade*dt;
        if(p.life > 0 && p.y < window.innerHeight + 60) alive++;
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        ctx.shadowColor = p.c;          /* 發光：暗幕上才看得見 */
        ctx.shadowBlur = 10;
        /* 側向收窄一點，像紙片翻面 */
        ctx.fillRect(-p.w/2, -p.h/2, p.w * Math.abs(Math.cos(p.rot*1.7)), p.h);
        ctx.shadowBlur = 0;
        ctx.restore();
      }
      /* 至少存活 450ms：第一幀的存活判定容易受佈局時序影響，
         之前就是這裡一出錯就立即刪 canvas，等於完全沒有花。 */
      if(alive > 0 || (now - bornAt) < 450) requestAnimationFrame(tick);
      else { try{ cv.remove(); }catch(e){} }
    }
    requestAnimationFrame(tick);
    /* 保險：5 秒後無論如何都收掉，免得有粒子卡在畫面外永遠不結束 */
    setTimeout(function(){ try{ cv.remove(); }catch(e){} }, 5000);
  }catch(e){ try{ window.__cfErr = String(e&&e.stack||e); }catch(_){} }
}

/* ═══ 每日簽到 ═══
   規則：每天 +100；連續第 7 天額外 +500（神秘小禮物）。
   用本地日期（香港 UTC+8），不是 UTC —— 用 toISOString() 會令晚上 8 點後算成明天。
   記錄在 checkin/{username}：{last:'YYYY-MM-DD', streak:N, total:N, at:ts} */
function _dayStr(offset){
  const d=new Date(Date.now()+(offset||0)*86400000);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* 路線圖 + 提示文字（個人主頁卡片和彈窗共用同一份，避免兩邊走樣） */
function ckRoadHTML(c){
  const today=_dayStr(0);
  const done=(c&&c.last===today);
  const cycleRaw=Number(c&&c.cycle)||0;
  const filled = done ? Math.max(1,cycleRaw) : (cycleRaw>=7 ? 7 : cycleRaw);
  const nextIdx = done ? -1 : Math.min(7, cycleRaw+1);
  let road='';
  for(let d=1; d<=7; d++){
    const isDone = d<=filled;
    const isNow = (!done && d===nextIdx);
    const gift = (d===7);
    road += '<span class="ck-dot'+(isDone?' done':'')+(isNow?' now':'')+(gift?' big gift':'')+'">'
          + (gift ? '🎁' : (isDone?'✓':d)) + '</span>';
  }
  const tip = done
    ? '今天已簽到，明天再來。'
    : (cycleRaw>=7
        ? '新一輪開始，今天簽到可得 <b style="color:var(--gold)">+100</b>'
        : (nextIdx===7
            ? '今天簽到就是第 7 天，<b style="color:#f472b6">神秘小禮物 +500</b>'
            : '今天簽到可得 <b style="color:var(--gold)">+100</b> 積分'));
  return '<div class="ck-road">'+road+'</div>'
       + '<p style="font-size:11.5px;color:var(--text-muted);margin:6px 0 0;line-height:1.6">'+tip+'</p>';
}

/* 簽到失敗自動重試一次（只針對網絡錯誤，避免重複加分） */
let _ckRetried=false;
async function doCheckin(){
  if(!me) return;
  /* 立即撒花 —— 之後要 await get/set/runTransaction 三次網絡往返，
     等到那時（實測約 1 秒）用戶已經以為「按了沒反應」。 */
  try{
    var cbtn = document.querySelector('#ckModal [data-action="doCheckin"]') || document.querySelector('[data-action="doCheckin"]');
    confettiBurst(cbtn, {count:110});
  }catch(e){ try{ window.__ckErr = String(e&&e.stack||e); }catch(_){} }
  const today=_dayStr(0);
  let c;
  try{ c=(await get(child(ref(db),'checkin/'+me.username))).val()||{}; }catch(e){ c={}; }
  if(c.last===today){ showNCard({title:'今天已經簽到',html:'明天再回來，連續紀錄才不會斷。',btn:'知道'}); return; }
  const streak=(c.last===_dayStr(-1))?(Number(c.streak)||0)+1:1;
  /* cycle = 本輪已簽幾格（0–7）。斷簽**不清零**，只斷 streak —— 圓點不會被清空。
     滿 7 格送禮物，下一次由 1 重新開始新一輪。 */
  let cycle=Number(c.cycle)||0;
  cycle = (cycle>=7) ? 1 : cycle+1;
  const bonus=(cycle===7);
  const reward=bonus?600:100;
  try{
    await set(ref(db,'checkin/'+me.username),{
      last:today, streak:streak, cycle:cycle, total:(Number(c.total)||0)+1, at:Date.now()
    });
    const pr=await runTransaction(ref(db,'users/'+me.username+'/points'),v=>{
      const cur=Number(v)||0;
      return Math.min(cur+reward,9007199254740991);
    });
    if(!pr.committed){                       /* 交易失敗就 fallback 一次（見 MEMORY 的 runTransaction 坑） */
      const cur=Number((await get(child(ref(db),'users/'+me.username+'/points'))).val())||0;
      await set(ref(db,'users/'+me.username+'/points'),Math.min(cur+reward,9007199254740991));
    }
    try{ await writeLog('checkin','簽到 第 '+streak+' 天 +'+reward); }catch(e){}
    addExp(20);
    bumpDaily('ck');
    afterCheckinBonuses();
    /* 額外一份：7 天禮物時加碼（開頭已經撒過一次，這裡補慶祝感） */
    if(bonus){ try{ setTimeout(function(){ confettiBurst(null,{count:90}); }, 420); }catch(e){} }
    try{ var cm=document.getElementById('ckModal'); if(cm){ var mk=document.getElementById('ckMask'); if(mk) mk.remove(); cm.remove(); } }catch(e){}
    setTimeout(function(){ showNCard({
      title: bonus?'第 '+streak+' 天！神秘小禮物':'每日簽到',
      html: bonus
        ? '連續簽到 <b>'+streak+'</b> 天，你拿到神秘小禮物了：<br><b style="font-size:18px">+500</b> 積分<br>加上今日簽到 <b>+100</b>，共 <b>+600</b>'
        : '連續 <b>'+streak+'</b> 天，今日 <b>+100</b> 積分'+(streak%7===6?'<br>明天就第 7 天，有神秘小禮物。':''),
      btn: bonus?'收下禮物':'收下',
      onClose:()=>{ try{ openProfilePage(me.username,true); }catch(e){} }
    }); }, 260);
  }catch(e){
    /* 以前這裡直接把原始錯誤丟出來（例如 "Failed to get document because the client is offline"），
       用戶只見到「簽到失敗」四個字，完全唔知發生咩事。
       現在分兩種：網絡問題（可以再試）／其他錯誤（顯示原因）。 */
    const msg=String(e&&e.message||e);
    const isNet=/network|offline|timeout|unavailable|connection|disconnect/i.test(msg);
    if(isNet && !_ckRetried){
      /* 只重試一次。重試前先確認是不是其實已經簽到了（避免重複加分）。 */
      _ckRetried=true;
      showNotif('網絡不穩，自動重試…');
      setTimeout(async function(){
        try{
          const c2=(await get(child(ref(db),'checkin/'+me.username))).val()||{};
          if(c2.last===_dayStr(0)){ _ckRetried=false; showNotif('其實已經簽到成功了'); return; }
        }catch(_){}
        _ckRetried=false;
        doCheckin();
      }, 1500);
      return;
    }
    _ckRetried=false;
    showNCard({
      title: isNet?'網絡不穩，簽到未完成':'簽到失敗',
      html: isNet
        ? '你的網絡好像斷了。<br>簽到紀錄沒有改變，連上網再按一次就可以。<br><span style="font-size:11px;color:var(--text-muted);word-break:break-all">'+escapeHtml(msg.slice(0,100))+'</span>'
        : escapeHtml(msg.slice(0,140)),
      btn: isNet?'知道了':'知道了'
    });
  }
}

async function bidAuction(id){
  if(!me) return;
  const el=document.getElementById('bid_'+id);
  const amt=Math.floor(Number(el&&el.value)||0);
  if(amt<=0){ showNotif('請輸入出價'); return; }
  if(amt>Number(me.points||0)){ showNotif('你的積分不夠（'+Number(me.points||0)+' 分）'); return; }
  try{
    const res=await runTransaction(ref(db,'auctions/'+id), function(cur){
      if(!cur) return cur;
      if(Number(cur.top)>=amt) return cur;       /* 已經有人更高，放棄 */
      return Object.assign({},cur,{top:amt,topBy:me.username,topName:me.displayName});
    });
    if(res && res.committed){ showNotif('出價 '+amt+' 分（目前最高）'); openAuctionPage(); }
    else showNotif('已經有人出更高價了');
  }catch(e){ showNotif('出價失敗'); }
}
