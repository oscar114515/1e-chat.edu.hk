.rc-inp{width:100%;padding:9px 11px;border-radius:var(--r-1);border:1px solid var(--border-strong);
  background:var(--bg-input);color:var(--text-main);font-size:12.5px;font-family:inherit;outline:none}

/* ═══ v1.38 小工具專區 ═══════════════════════════════════════════════
   入口在個人主頁（沿用 .about-item 的長相，只把 icon 換成本站主色），
   點進去是一個獨立頁面，列出所有小工具卡片。 */
.tool-entry{position:relative}
.ai-icon.te{background:color-mix(in srgb,var(--primary) 17%,transparent);color:var(--primary)}
.tools-wrap{padding:2px 0 10px}
.tools-lead{font-size:12.5px;color:var(--text-sub);line-height:1.7;margin:0 2px 14px}
.tools-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tool-card{position:relative;display:flex;align-items:center;gap:13px;padding:15px;
  border-radius:var(--r-3);background:var(--bg-input);border:1px solid var(--border);
  text-decoration:none;color:inherit;overflow:hidden;
  transition:transform var(--dur-2) var(--ease-out),border-color var(--dur-2),background var(--dur-2)}
.tool-card::before{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(130px 100px at 92% 0%,color-mix(in srgb,var(--tc,var(--primary)) 15%,transparent),transparent 72%)}
.tool-card:hover{border-color:var(--border-strong)}
.tool-card:active{transform:scale(.982)}
.tool-ico{width:46px;height:46px;flex:0 0 auto;border-radius:var(--r-2);display:grid;place-items:center;
  background:color-mix(in srgb,var(--tc,var(--primary)) 15%,transparent);color:var(--tc,var(--primary))}
.tool-ico .ico{width:23px;height:23px}
.tool-tx{flex:1 1 auto;min-width:0;display:block}
.tool-t{display:block;font-size:14.5px;font-weight:700;letter-spacing:.2px}
.tool-s{display:block;font-size:11.5px;color:var(--text-sub);line-height:1.55;margin-top:3px}
.tool-go{flex:0 0 auto;color:var(--text-muted);display:grid;place-items:center}
.tool-go .ico{width:16px;height:16px}
.tools-foot{font-size:11.5px;color:var(--text-muted);line-height:1.65;margin:16px 2px 0}
.tools-empty{padding:38px 16px;text-align:center;font-size:13px;color:var(--text-sub);
  background:var(--bg-input);border:1px dashed var(--border-strong);border-radius:var(--r-3)}

/* ═══ v1.38 位置全螢幕地圖（自繪圖磚） ═══════════════════════════════ */
.loc-full{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;background:#0b1220}
.lf-head{display:flex;align-items:center;gap:10px;padding:11px 12px;flex:0 0 auto;
  background:#16203a;color:#fff;padding-top:calc(11px + env(safe-area-inset-top,0px))}
.lf-back{width:36px;height:36px;flex:0 0 auto;border:none;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff}
.lf-back .ico{width:18px;height:18px}
.lf-coord{flex:1 1 auto;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.lf-btn{flex:0 0 auto;padding:7px 12px;border-radius:var(--r-1);font-size:12.5px;font-weight:600;
  color:#fff;text-decoration:none;background:rgba(255,255,255,.14)}
.lf-stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
  background:#dfe6ec;touch-action:none;cursor:grab}
.lf-stage:active{cursor:grabbing}
.lf-canvas{display:block;position:absolute;left:0;top:0}
.lf-pin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);
  pointer-events:none;display:grid;place-items:center;transition:opacity .2s}
.lf-pin i{display:block;width:17px;height:17px;border-radius:50%;background:#3b82f6;
  border:3px solid #fff;box-sizing:border-box;
  box-shadow:0 0 0 1px rgba(15,23,42,.2),0 6px 16px rgba(59,130,246,.45)}
.lf-pin::before{content:'';position:absolute;width:44px;height:44px;border-radius:50%;
  background:rgba(59,130,246,.16);animation:lfPulse 2.4s var(--ease-inout) infinite}
@keyframes lfPulse{0%,100%{transform:scale(.72);opacity:.55}50%{transform:scale(1);opacity:.12}}
.lf-attr{position:absolute;right:8px;bottom:8px;font-size:10px;color:#475569;
  background:rgba(255,255,255,.75);padding:1px 6px;border-radius:5px;pointer-events:none}

/* ═══ v1.38 全班共享地圖 ═════════════════════════════════════════════ */
.live-title{flex:1 1 auto;min-width:0;font-size:14.5px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-count{flex:0 0 auto;font-size:11.5px;color:#93c5fd;font-weight:600;
  background:rgba(147,197,253,.14);padding:3px 9px;border-radius:20px;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.live-bar{display:flex;align-items:center;gap:10px;padding:9px 12px;flex:0 0 auto;
  background:#131c33;border-bottom:1px solid rgba(148,163,184,.14)}
.live-bar-lb{font-size:11.5px;color:#94a3b8;flex:0 0 auto}
.lvm-group{display:flex;flex:1 1 auto;background:rgba(15,23,42,.55);border-radius:11px;padding:3px;gap:3px}
.lvm{flex:1 1 0;border:none;background:transparent;color:#94a3b8;font-family:inherit;
  font-size:12.5px;font-weight:650;padding:7px 6px;border-radius:9px;cursor:pointer;
  transition:background var(--dur-2),color var(--dur-2),transform var(--dur-1)}
.lvm.on{background:rgba(59,130,246,.92);color:#fff;box-shadow:0 2px 10px rgba(37,99,235,.4)}
.lvm:active{transform:scale(.97)}
.live-pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lmk{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.lmk-dot{position:absolute;left:0;top:0;width:17px;height:17px;margin:-8.5px 0 0 -8.5px;
  border-radius:50%;background:var(--c,#3b82f6);border:3px solid #fff;box-sizing:border-box;
  box-shadow:0 2px 9px rgba(15,23,42,.42)}
.lmk.is-me .lmk-dot{box-shadow:0 0 0 3px rgba(255,255,255,.55),0 2px 12px rgba(15,23,42,.5)}
.lmk.is-me .lmk-dot::after{content:'';position:absolute;inset:-9px;border-radius:50%;
  border:2px solid var(--c,#3b82f6);opacity:.55;animation:lwPing 2.2s var(--ease-out) infinite}
@keyframes lwPing{0%{transform:scale(.5);opacity:.6}100%{transform:scale(1.5);opacity:0}}
.lmk-nm{position:absolute;left:0;top:12px;transform:translateX(-50%);white-space:nowrap;
  font-size:10.5px;font-weight:700;color:#0f172a;background:rgba(255,255,255,.9);
  padding:1.5px 6px;border-radius:7px;box-shadow:0 1px 5px rgba(15,23,42,.22)}
.live-tip{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);
  font-size:11px;color:#334155;background:rgba(255,255,255,.82);padding:5px 12px;
  border-radius:20px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 10px rgba(15,23,42,.14)}
.live-deny{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;text-align:center;padding:26px;
  background:linear-gradient(180deg,#0b1220,#16203a);animation:lwIn .3s var(--ease-out) both}
.live-deny-ico{width:70px;height:70px;border-radius:24px;display:grid;place-items:center;
  background:rgba(248,113,113,.14);color:#f87171}
.live-deny-ico .ico{width:30px;height:30px}
.live-deny-t{font-size:16px;font-weight:700;color:#f8fafc}
.live-deny-s{font-size:12.5px;color:#94a3b8;line-height:1.7;max-width:300px}

/* ═══ v1.38 發送位置：等待動畫 + 剛發出的標記掉落 ═══════════════════ */
.loc-wait{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1200;
  display:flex;align-items:center;gap:13px;padding:15px 22px 15px 18px;
  border-radius:18px;pointer-events:none;
  background:color-mix(in srgb,var(--bg-card) 94%,transparent);
  border:1px solid var(--border-strong);
  box-shadow:0 20px 55px rgba(2,6,23,.5);
  color:var(--text-main);font-size:13.5px;font-weight:650;
  animation:lwIn .26s var(--ease-out) both}
.loc-wait.lw-out{animation:lwOut .19s var(--ease-inout) both}
@keyframes lwIn{from{opacity:0;transform:translate(-50%,-46%) scale(.94)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes lwOut{from{opacity:1;transform:translate(-50%,-50%) scale(1)}
  to{opacity:0;transform:translate(-50%,-54%) scale(.96)}}
.lw-ico{position:relative;width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;
  color:var(--primary)}
.lw-ico .ico{width:20px;height:20px;position:relative;z-index:2}
.lw-ico::before,.lw-ico::after{content:'';position:absolute;inset:0;border-radius:50%;
  border:2px solid currentColor;opacity:.5;animation:lwRipple 1.7s var(--ease-out) infinite}
.lw-ico::after{animation-delay:.85s}
@keyframes lwRipple{0%{transform:scale(.45);opacity:.7}100%{transform:scale(1.55);opacity:0}}
.lw-tx{line-height:1.4}
.loc-msg.loc-new .lm-map{animation:locBox .34s var(--ease-out) both}
@keyframes locBox{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.loc-msg.loc-new .lm-pin{animation:locDrop .62s var(--ease-out) both}
@keyframes locDrop{0%{opacity:0;transform:translateY(-16px) scale(.3)}
  55%{opacity:1;transform:translateY(0) scale(1.25)}
  100%{opacity:1;transform:translateY(0) scale(1)}}

/* ═══ 新裝置配對（Google 式數字確認）═══ */
.pair-ov{position:fixed;inset:0;background:rgba(5,7,12,.9);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:22px;z-index:999}
.pair-ov.hidden{display:none}
.pair-card{background:var(--bg-card);border:1px solid var(--border-strong);border-radius:18px;
  padding:22px 20px;max-width:350px;width:100%;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.pair-t{font-size:17px;font-weight:600;margin-bottom:8px}
.pair-s{font-size:13px;color:var(--text-sub);line-height:1.6;margin-bottom:16px}
.pair-codes{display:flex;justify-content:center;gap:12px;margin:6px 0 16px}
.pair-codes b{flex:1;font-size:26px;font-weight:700;letter-spacing:1px;padding:14px 0;
  border-radius:12px;background:var(--bg-input);border:1px solid var(--border-strong);
  font-variant-numeric:tabular-nums}
.pair-codes.one b{font-size:46px;padding:26px 0;letter-spacing:4px}
.pair-codes.ask b{cursor:pointer;transition:transform .08s,background .15s}
.pair-codes.ask b:active{transform:scale(.95);background:var(--accent);color:#0b0d14}
.pair-hint{font-size:13px;color:var(--text-sub);min-height:20px;margin-bottom:10px}
.pair-hint.err{color:var(--red)}
.pair-hint.ok{color:var(--green)}
.pair-btn{border:0;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:600;
  background:var(--bg-input);color:var(--text-main);cursor:pointer;width:100%;margin-top:6px}
.pair-btn.primary{background:var(--accent);color:#0b0d14}
.pair-btn:active{opacity:.85}
.pair-dev{font-size:11.5px;color:var(--text-sub);word-break:break-all;margin-top:10px;opacity:.8}

/* ═══ v1.38.21 交互手感 ═══ */
/* 按鈕按下：往按的方向沉一點（用 CSS 變數 --px/--py，JS 可選設定） */
.btn-primary,.btn-ghost,.btn-danger,.btn-warn,.btn-ok{
  transition:transform .12s cubic-bezier(.34,1.42,.64,1),box-shadow .12s,opacity .12s;
  transform:perspective(520px) rotateX(calc(var(--py,0) * 1deg)) rotateY(calc(var(--px,0) * 1deg))
}
.btn-primary:active,.btn-ghost:active,.btn-danger:active,.btn-warn:active,.btn-ok:active{
  transform:perspective(520px) rotateX(4deg) translateY(1px) scale(.975);box-shadow:0 1px 4px rgba(0,0,0,.28)
}
/* 完成反饋：加 .is-done 會由左至右掃一個打勾 */
.btn-primary.is-done,.btn-ghost.is-done,.btn-ok.is-done{position:relative;color:transparent!important;overflow:hidden}
.btn-primary.is-done::after,.btn-ghost.is-done::after,.btn-ok.is-done::after{
  content:'';position:absolute;left:50%;top:50%;width:13px;height:7px;
  border-left:2.4px solid var(--text-main);border-bottom:2.4px solid var(--text-main);
  transform:translate(-50%,-62%) rotate(-45deg) scale(0);border-radius:1px;
  animation:okMark .34s cubic-bezier(.34,1.56,.64,1) forwards
}
@keyframes okMark{to{transform:translate(-50%,-62%) rotate(-45deg) scale(1)}}
/* 骨架屏 */
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.11) 37%,rgba(255,255,255,.05) 63%);
  background-size:400% 100%;animation:shimmer 1.3s ease infinite;border-radius:10px}
body.theme-light .skeleton{background:linear-gradient(90deg,rgba(0,0,0,.05) 25%,rgba(0,0,0,.10) 37%,rgba(0,0,0,.05) 63%);background-size:400% 100%}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sk-row{display:flex;align-items:center;gap:11px;padding:11px 12px}
.sk-av{width:36px;height:36px;border-radius:50%}
.sk-lines{flex:1;display:flex;flex-direction:column;gap:7px}
.sk-l1{height:11px;width:52%}
.sk-l2{height:9px;width:78%}

/* ═══ 新手引導（聚光燈）═══ */
.ob-hole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.76);
  transition:left .3s cubic-bezier(.34,1.42,.64,1),top .3s cubic-bezier(.34,1.42,.64,1),
             width .3s cubic-bezier(.34,1.42,.64,1),height .3s cubic-bezier(.34,1.42,.64,1);
  pointer-events:none;z-index:9000}
.ob-tip{position:fixed;left:50%;transform:translateX(-50%);background:var(--bg-card);
  border:1px solid var(--border-strong);border-radius:15px;padding:15px 18px;max-width:310px;width:calc(100% - 40px);
  font-size:13.5px;line-height:1.65;text-align:center;z-index:9001;
  box-shadow:0 14px 40px rgba(0,0,0,.5);animation:panelIn .3s cubic-bezier(.34,1.42,.64,1)}
.ob-tip .ob-n{font-size:11px;color:var(--text-sub);margin-bottom:6px;letter-spacing:.4px}
.ob-tip .ob-b{margin-top:13px;display:flex;gap:8px}
.ob-tip .ob-b button{flex:1;border:0;border-radius:11px;padding:11px 8px;font-size:13.5px;font-weight:600;cursor:pointer}
.ob-tip .ob-skip{background:transparent;color:var(--text-sub);border:1px solid var(--border-strong)!important}
.ob-tip .ob-next{background:var(--accent);color:#0b0d14}

/* ═══ 徽章解鎖（積分里程碑）═══ */
.badge-pop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:9500;pointer-events:none;animation:badgeFade 2.6s ease forwards}
.badge-card{position:relative;width:210px;padding:26px 20px 22px;border-radius:20px;text-align:center;
  background:var(--bg-card);border:1px solid rgba(226,176,74,.5);
  box-shadow:0 0 0 1px rgba(226,176,74,.18),0 22px 60px rgba(0,0,0,.55);
  animation:badgeIn .55s cubic-bezier(.34,1.62,.64,1) both}
.badge-ring{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#ffe9a8,#e2b04a 62%,#a9762a);
  display:flex;align-items:center;justify-content:center;font-size:30px;color:#4a2f08;
  box-shadow:0 0 0 0 rgba(226,176,74,.55);animation:badgePulse 1.1s ease-out .35s 2}
.badge-t{font-size:12px;letter-spacing:2px;color:var(--gold2,var(--gold));margin-bottom:4px}
.badge-v{font-size:17px;font-weight:600}
@keyframes badgeIn{0%{opacity:0;transform:scale(.6) translateY(18px)}100%{opacity:1;transform:none}}
@keyframes badgePulse{0%{box-shadow:0 0 0 0 rgba(226,176,74,.55)}100%{box-shadow:0 0 0 22px rgba(226,176,74,0)}}
@keyframes badgeFade{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}

/* ═══ v1.38.22 動效加強 ═══ */
/* 1. 點擊波紋 */
.ripple{position:absolute;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(255,255,255,.45),rgba(255,255,255,0) 70%);
  transform:scale(0);animation:rip .58s cubic-bezier(.22,.61,.36,1) forwards}
@keyframes rip{0%{transform:scale(0);opacity:.85}100%{transform:scale(1);opacity:0}}
.btn-primary,.btn-ghost,.btn-ok,.btn-danger,.btn-warn,.nav-item,.pi{position:relative;overflow:hidden}
/* 2. 積分數字彈跳 */
@keyframes ptsBump{0%{transform:scale(1)}42%{transform:scale(1.24);color:#f5c451}100%{transform:scale(1)}}
#scoreTop.bump span,#scoreBottom.bump span,.bump{animation:ptsBump .44s cubic-bezier(.34,1.56,.64,1)}
/* 3. 新訊息滑入 */
@keyframes msgIn{0%{opacity:0;transform:translateY(14px) scale(.97)}100%{opacity:1;transform:none}}
.msg-anim{animation:msgIn .3s cubic-bezier(.34,1.42,.64,1)}
/* 4. 頭像載入漸顯 */
@keyframes avIn{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:none}}
.av-anim{animation:avIn .28s cubic-bezier(.34,1.42,.64,1)}
/* 5. 底部導航選中放大 */
.nav-item{transition:transform .18s cubic-bezier(.34,1.42,.64,1),color .18s}
.nav-item:active{transform:translateY(-3px) scale(1.06)}
.nav-item.on{transform:translateY(-2px)}
/* 6. 小程式入口圖標浮起 */
.pi .pic{transition:transform .2s cubic-bezier(.34,1.42,.64,1)}
.pi:active .pic{transform:translateY(-4px) scale(1.08)}

/* ═══ UI_UPGRADE_2026：三個原生控件改造（純 CSS，不動 HTML）═══ */

/* ① 下拉框（11 個）：去掉系統白底大列表，改成同色系 + 自繪箭頭 */
select{
  -webkit-appearance:none!important;appearance:none!important;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath d='M2.5 4.5L6 8l3.5-3.5' fill='none' stroke='%2394a3b8' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E")!important;
  background-repeat:no-repeat!important;
  background-position:right 10px center!important;
  background-size:12px 12px!important;
  padding-right:30px!important;
  transition:border-color .2s,box-shadow .2s}
select:focus{
  border-color:#38bdf8!important;
  box-shadow:0 0 0 3px rgba(56,189,248,.16)!important;
  outline:none!important}
select:hover{border-color:rgba(148,163,184,.6)!important}
/* 下拉選項（Chrome on Android 只支援部分）*/
select option{background:var(--bg-card);color:var(--text-main)}

/* ② 消息輸入框：聚焦時邊框發光 + 佔位字淡出 */
#msgInput{transition:border-color .22s,box-shadow .22s,background .22s}
#msgInput:focus{
  border-color:#38bdf8;
  box-shadow:0 0 0 3px rgba(56,189,248,.15),inset 0 1px 2px rgba(0,0,0,.04);
  background:rgba(56,189,248,.05)}
#msgInput::placeholder{transition:opacity .22s,transform .22s}
#msgInput:focus::placeholder{opacity:.45}
body.theme-dark #msgInput:focus{background:rgba(56,189,248,.09)}

/* ③ 加密勾選：由圓點改成「方框 + 描邊勾」 */
#encToggle .dot-check{
  width:13px;height:13px;border-radius:4px;
  border:1.8px solid var(--border-strong);
  background:transparent;
  position:relative;flex:0 0 auto;
  transition:border-color .22s,background .22s,transform .18s}
#encToggle .dot-check::after{
  content:'';position:absolute;left:3.4px;top:0.6px;
  width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(45deg) scale(0);
  transform-origin:center;
  transition:transform .2s cubic-bezier(.34,1.6,.64,1)}
#encToggle.active .dot-check{
  background:#dc2626;border-color:#dc2626;
  transform:scale(1.06)}
#encToggle.active .dot-check::after{transform:rotate(45deg) scale(1)}
#encToggle:active .dot-check{transform:scale(.92)}

@keyframes six-seven-hand-tilt{
  0%{transform:skewY(0)}10%{transform:skewY(10deg)}25%{transform:skewY(-10deg)}
  40%{transform:skewY(10deg)}55%{transform:skewY(-10deg)}70%{transform:skewY(10deg)}
  85%{transform:skewY(-10deg)}100%{transform:skewY(0)}}
body.fx-67{animation:1.8s cubic-bezier(.6,.43,.68,1.11) 0s 1 normal none running six-seven-hand-tilt}
body.fx-askew{transform:rotate(1deg)}
@keyframes fx-roll{100%{transform:rotate(360deg)}}
body.fx-roll{animation:4s linear 0s 1 normal none running fx-roll}
@keyframes fx-shake{
  10%,90%{transform:translate3d(-1px,0,0)}20%,80%{transform:translate3d(2px,0,0)}

@keyframes fx-blink-kf{80%{opacity:0}}
body.fx-blink .bubble{animation:1s step-end infinite fx-blink-kf}
#fxShowerLayer{position:fixed;inset:0;pointer-events:none;z-index:2147483000;overflow:hidden;display:none}

@keyframes fx-falling{0%{transform:translateX(0)}100%{transform:translateX(150vw)}}
@keyframes fx-tail{0%{width:0}30%{width:30vw}100%{width:0}}
@keyframes fx-fadeinout{0%{opacity:0;z-index:1000}30%{opacity:.8;z-index:1000}
  70%{opacity:.8;z-index:1000}100%{opacity:0;z-index:1000}}

function verScore(v){ const m=String(v||'').match(/(\d+)\.(\d+)(?:\.(\d+))?/); return m?(+m[1])*1e6+(+m[2])*1e3+(+(m[3]||0)):0; }

function showVersionModal(sv){ if(versionMismatchShown)return;versionMismatchShown=true;const old=document.getElementById('versionModal');if(old)old.remove();const m=document.createElement('div');m.id='versionModal';m.innerHTML=`<div class="vm-card"><h3><svg class="ico ico-lg" style="color:var(--gold)"><use href="#i-alert"/></svg> 你的網站不是最新版本</h3><p>你的版本：<b style="color:var(--danger)">${CURRENT_VERSION}</b></p><p>最新版本：<b style="color:var(--ok-tx)">${sv}</b></p><div class="vm-btns"><button class="vm-go" id="vmGoBtn">前往新版本</button><button class="vm-exit" id="vmExitBtn">退出網站</button></div></div>`;document.body.appendChild(m);document.getElementById('vmGoBtn').onclick=goNewVersion;document.getElementById('vmExitBtn').onclick=()=>{try{window.close();}catch(e){}setTimeout(()=>{location.href='about:blank';},200);}; }

function goNewVersion(){
  const key='ver_reload_tried';
  if(sessionStorage.getItem(key)!==CURRENT_VERSION){
    // 第一次：直接重載。reload 會帶 max-age=0 重新向伺服器驗證，能拿到新版本，網址完全不變。
    sessionStorage.setItem(key,CURRENT_VERSION);
    location.reload();
    return;
  }
  // 第二次還是不行（遇到強快取），才加上一次性參數破快取
  sessionStorage.removeItem(key);
  const url=new URL(location.href);
  url.searchParams.set('_v',Date.now().toString());
  location.replace(url.toString());
}
// 若網址帶著 _v 進來，把它清掉讓網址回復原樣（用 replaceState，不會重新載入）

}catch(e){}

   兩個參數會一直留在網址上直到真的跳轉完成，重新整理也不會丟掉目標。 */
let urlGame='', urlRoom='';
try{
  const q=new URL(location.href).searchParams;
  urlGame=(q.get('game')||'').trim().toLowerCase();
  urlRoom=(q.get('room')||'').trim();
}catch(e){}
function clearUrlDeepLink(){
  try{
    const clean=new URL(location.href);
    if(!clean.searchParams.has('game')&&!clean.searchParams.has('room'))return;
    clean.searchParams.delete('game');
    clean.searchParams.delete('room');
    history.replaceState(null,'',clean.pathname+(clean.search||'')+clean.hash);
  }catch(e){}
}
/** 登入完成後執行：把使用者帶到網址指定的遊戲／房間 */
function applyDeepLink(){
  if(!me)return;
  if(!urlGame&&!urlRoom)return;
  const g=urlGame, r=urlRoom;
  urlGame=''; urlRoom='';
  setTimeout(()=>{ try{ openGames(r,g); }catch(e){}; clearUrlDeepLink(); }, 500);
}

/* ═══ v1.15 一次性登入權杖（?t=）═══
   ?u=帳號&p=密碼 方便是方便，但那條網址裡是「明文密碼」：
   它會留在瀏覽器歷史紀錄、「上一頁」、分頁標題，轉傳一次就整組外流。
   現在多一種 ?t=<權杖>：權杖存在資料庫，30 分鐘過期、只能用一次。
   點開就登入，登入完這條連結立刻作廢 —— 就算被截圖、被貼到群組，也是死連結。
   舊的 ?u=&p= 原封不動保留，你之前發出去的連結不會失效。 */
const LOGIN_TOKEN_TTL=30*60*1000;   // 30 分鐘
const TOKEN_NODE='loginTokens';
let urlLoginToken='';
try{ urlLoginToken=(new URL(location.href).searchParams.get('t')||'').trim(); }catch(e){}
function randomToken(){
  try{
    const a=new Uint8Array(18);crypto.getRandomValues(a);
    return Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').slice(0,24);
  }catch(e){
    let s='';for(let i=0;i<24;i++)s+='abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random()*36)];
    return s;
  }
}
async function createLoginToken(username,password){
  const token=randomToken();
  await set(ref(db,TOKEN_NODE+'/'+token),{u:username,p:password,exp:Date.now()+LOGIN_TOKEN_TTL,by:(me?me.username:'?'),at:Date.now()});
  return token;
}
async function consumeLoginToken(token){
  if(!token)return false;
  try{
    const snap=await get(child(ref(db),TOKEN_NODE+'/'+token));
    if(!snap.exists())return false;
    const t=snap.val()||{};
    if(!t.u||!t.p)return false;
    if(!t.exp||Date.now()>t.exp)return false;   // 過期
    if(t.usedAt)return false;                   // 已經被用掉，這條連結作廢
    await update(ref(db,TOKEN_NODE+'/'+token),{usedAt:Date.now()});
    try{await ensureAIUser();}catch(e){}
    await handleLogin(t.u,t.p);
    return true;
  }catch(e){return false;}
}
/* 把過期與用過的權杖清掉，免得一直堆在資料庫。失敗就算了，不影響登入。 */
async function sweepLoginTokens(){
  try{
    const snap=await get(ref(db,TOKEN_NODE));if(!snap.exists())return;
    const val=snap.val()||{};const now=Date.now();
    for(const k of Object.keys(val)){
      const t=val[k]||{};
      const dead=(t.exp&&now>t.exp)||(t.usedAt&&now-t.usedAt>10*60*1000);
      if(dead){try{await remove(ref(db,TOKEN_NODE+'/'+k));}catch(e){}}
    }
  }catch(e){}
}
async function openLoginLink(username){
  if(!me)return;
  const isSelf=username===me.username;
  if(!isSelf&&me.role!=='superadmin'&&me.role!=='admin')return;
  const snap=await get(child(ref(db),'users/'+username));if(!snap.exists())return;
  const u=snap.val()||{};
  if(!u.password){showNotif('這個帳號沒有設定密碼');return;}
  let token='';
  try{ token=await createLoginToken(username,u.password); }catch(e){ showNotif('產生失敗');return; }
  const url=(location.origin+location.pathname)+'?t='+token;
  const bodyHTML=`<div class="section-title">一次性登入連結</div>
  <div style="font-size:12.5px;color:var(--text-sub);line-height:1.75;margin-bottom:10px">把下面這條連結傳給本人，點開就直接登入，不用打帳密。<br>
  30 分鐘內有效、<b>只能用一次</b>，用過就立刻失效；沒用到也會自己過期消失。</div>
  <div class="form-row"><input type="text" id="loginLinkBox" value="${escAttr(url)}" readonly></div>
  <button class="btn-primary" data-action="copyLoginLink">複製連結</button>
  <div style="font-size:12px;color:var(--text-sub);line-height:1.7;margin-top:12px">為誰產生：${escapeHtml(u.displayName||username)}（${escapeHtml(username)}）<br>
  這條連結只給本人，不要貼在班群或公開的地方。</div>`;
  openPage({title:'登入連結 · '+(u.displayName||u.username),bodyHTML});
}
function copyLoginLink(){
  const el=document.getElementById('loginLinkBox');if(!el)return;
  try{
    el.removeAttribute('readonly');el.focus();el.select();
    document.execCommand('copy');
    el.setAttribute('readonly','');
  }catch(e){}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(el.value).then(()=>showNotif('已複製連結')).catch(()=>showNotif('請長按手動複製'));
  }else showNotif('已複製連結');
}

/* ═══ v1.24 房間連結：每一間房間都有自己的網址 ═══
   形如 https://…/1e-chat.edu.hk/?room=<房間編號>
   打開之後照正常流程登入（或自動登入），登入完就自動進到那一間房間。 */
function gameRoomUrl(roomId){
  try{
    const u=new URL(location.href);
    let p=u.pathname||'/';
    if(/game\.html$/.test(p))p=p.replace(/game\.html$/,'');
    if(/index\.html$/.test(p))p=p.replace(/index\.html$/,'');
    if(!/\/$/.test(p))p+='/';
    return u.origin+p+'?room='+encodeURIComponent(roomId);
  }catch(e){ return location.origin+'/?room='+encodeURIComponent(roomId); }
}
function copyTextToClipboard(t){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(()=>showNotif('已複製連結')).catch(()=>showNotif('請長按手動複製：'+t));
      return;
    }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.removeAttribute('readonly');ta.focus();ta.select();
    document.execCommand('copy');ta.remove();showNotif('已複製連結');
  }catch(e){ showNotif('請長按手動複製：'+t); }
}
async function copyRoomLink(roomId){
  if(!roomId)return;
  copyTextToClipboard(gameRoomUrl(roomId));
}

/* ═══ v1.14 裝了 App 就直接跳過去 ═══   正規做法是安卓的 App Links：連結通過網域驗證（見根目錄的
   /.well-known/assetlinks.json）之後，系統在瀏覽器載入之前就把連結交給 App，
   連這一頁都不會出現 —— 跟 YouTube 完全一樣。

   下面這一段是補漏的：驗證還沒生效，或是使用者在微信／WhatsApp 這類
   內建瀏覽器點連結時（那些瀏覽器不理會 App Links），這裡再推一次。
   推不動就靜默收場，頁面留在網頁版，不會有任何提示或錯誤。 */
const APP_PKG='com.oscar114515.toolbox';
function tryOpenApp(){
  if(!/Android/i.test(navigator.userAgent))return;
  try{
    const target=location.href;
    // 去掉 # 片段：intent:// 用 #Intent; 當分隔符，網址裡帶著 # 會讓整串解析壞掉
    const bare=target.replace(/^https?:\/\//,'').split('#')[0];
    // fallback 故意不填：填了的話，沒裝 App 的瀏覽器會把同一頁再載入一次，
    // 然後又推一次，變成無限重載迴圈。
    const intent='intent://'+bare+
      '#Intent;scheme=https;package='+APP_PKG+';end';
    const f=document.createElement('iframe');
    f.style.cssText='display:none;width:0;height:0;border:0';
    f.src=intent;
    document.body.appendChild(f);
    setTimeout(()=>{try{f.remove();}catch(e){}},1500);
  }catch(e){}
}

  if(!/[\u4e00-\u9fff]/.test(s)) return s;
  const m=s2tMap(); let out='', i=0;
  while(i<s.length){
    if(s.charCodeAt(i)<128){ out+=s[i++]; continue; }
    let hit='';
    for(let L=Math.min(4,s.length-i); L>=2; L--){
      const sub=s.substr(i,L);
      if(S2T_WORDS[sub]){ hit=sub; break; }
    }
    if(hit){ out+=S2T_WORDS[hit]; i+=hit.length; continue; }
    out += m.get(s[i]) || s[i];
    i++;
  }
  return out;
}
/* 動態字串的英文規則（含數字／遊戲名等，字典查不到時用） */
const EN_RULES=[
  [/^(\d+) 人在線$/, '$1 online'],
  [/^線上 (\d+)$/, '$1 online'],
  [/^(\d+) 條通知$/, '$1 notifications'],
  [/^(\d+) 人已投票$/, '$1 votes'],
  [/^(\d+) 個小程式$/, '$1 mini apps'],
  [/^對局邀請 · (.+)$/, 'Game invite · $1'],
  [/^點擊進入房間（(.+)）$/, 'Enter room ($1)'],
  [/^(\d+) 分$/, '$1 pts'],
  [/^剩 (\d+) 份$/, '$1 left'],
  [/^載入更早的訊息（(.+) 之前）$/, 'Load earlier messages (before $1)'],
  [/^(.+) 分鐘前$/, '$1 min ago'],
  [/^(.+) 小時前$/, '$1 h ago'],
  [/^(.+) 天前$/, '$1 d ago'],
  [/^(.+) · 普通用戶$/, '$1 · Member'],
  [/^(.+) · 管理員$/, '$1 · Admin'],
  [/^(.+) · 超級管理員$/, '$1 · Super Admin'],
  [/^v([\d.]+) 正式版$/, 'v$1 Stable'],
  [/^([A-Za-z0-9# ]+) · (.+)$/, '$1 · $2'],
];
function enText(s){
  const hit=EN_UI[s];
  if(hit) return hit;
  for(const [re,rep] of EN_RULES){
    const m=s.match(re);
    if(m){
      return rep.replace(/\$(\d)/g,(_,i)=>{
        const g=m[Number(i)]||'';
        return EN_UI[g]||g;
      });
    }
  }
  return null;
}
function l10nOne(str){
  if(!str) return str;
  const raw=str, lead=raw.match(/^\s*/)[0], tail=raw.match(/\s*$/)[0];
  const core=raw.trim();
  if(!core) return raw;
  if(lang==='zh-Hans') return lead+toHans(core)+tail;
  if(lang==='en'){
    const e=enText(core);
    if(e!==null) return lead+e+tail;
    return raw;                 // 未收錄：保留原文，總好過變空白
  }
  return raw;
}
function l10nSkip(el){
  let p=el;
  while(p&&p.nodeType===1){
    if(p.matches&&p.matches(NO_I18N)) return true;
    p=p.parentElement;
  }
  return false;
}
let l10nBusy=false;
function l10nWalk(){
  if(typeof lang==='undefined') return;
  const body=document.body;
  if(!body) return;
  if(lang==='zh-Hant'){
    /* 回到繁體：把之前換掉的還原 */
    const w=document.createTreeWalker(body,NodeFilter.SHOW_TEXT,null);
    let n;
    while((n=w.nextNode())){
      if(n.__l10nOrig!==undefined&&n.nodeValue!==n.__l10nOrig) n.nodeValue=n.__l10nOrig;
    }
  }else{
    const w=document.createTreeWalker(body,NodeFilter.SHOW_TEXT,null);
    let n;
    while((n=w.nextNode())){
      const cur=n.nodeValue;
      if(!cur||!/[\u4e00-\u9fff]/.test(cur)) continue;
      if(n.parentElement&&l10nSkip(n.parentElement)) continue;
      if(n.__l10nOrig===undefined) n.__l10nOrig=cur;
      else if(n.__l10nOut!==undefined&&cur!==n.__l10nOut) n.__l10nOrig=cur;  // 外部改過文字
      const out=l10nOne(n.__l10nOrig);
      if(out!==cur) n.nodeValue=out;
      n.__l10nOut=out;
    }
  }
  /* 屬性：placeholder / title / aria-label */
  body.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{
    if(l10nSkip(el)) return;
    ['placeholder','title','aria-label'].forEach(a=>{
      const v=el.getAttribute(a);
      if(!v||!/[\u4e00-\u9fff]/.test(v)) return;
      const key='__l10n_'+a;
      if(el[key]===undefined) el[key]=v;
      else if(el.getAttribute(a)!==l10nOne(el[key])) { /* 外部改過，更新原文 */ el[key]=v; }
      const out=l10nOne(el[key]);
      if(out!==v) el.setAttribute(a,out);
    });
  });
  /* 聊天氣泡裡的按鈕（加入對局／複製房間連結）是系統 UI 不是用戶打的字，
     聊天內容本身不翻，但這些按鈕要翻，否則英文使用者看不懂那顆按鈕。 */
  body.querySelectorAll('.msg .bubble button,.msg .bubble .btn,.msg .bubble a').forEach(el=>{
    for(const n of el.childNodes){
      if(n.nodeType!==3) continue;
      const cur=n.nodeValue;
      if(!cur||!/[\u4e00-\u9fff]/.test(cur)) continue;
      if(n.__l10nOrig===undefined) n.__l10nOrig=cur;
      else if(n.__l10nOut!==undefined&&cur!==n.__l10nOut) n.__l10nOrig=cur;
      const out=l10nOne(n.__l10nOrig);
      if(out!==cur) n.nodeValue=out;
      n.__l10nOut=out;
    }
  });
}
let l10nTimer=null, l10nDirty=false, l10nPending=false;
function l10nRun(){
  if(l10nBusy){ l10nPending=true; return; }
  l10nBusy=true; l10nPending=false;
  try{ l10nWalk(); }catch(e){}
  /* 用 setTimeout 而不用 rAF：頁面在背景（手機鎖屏、iframe 隱藏）時 rAF 不會觸發，
     一旦卡住 l10nBusy 就永遠 true，之後所有翻譯都會靜靜失效。 */
  setTimeout(()=>{ l10nBusy=false; if(l10nPending) l10nRun(); },0);
}
/* 節流而不是防抖：舊寫法每次 mutation 都 clearTimeout 重排，
   聊天室心跳／在線人數／時間戳一直變，就永遠等不到那 70ms，翻譯於是不生效。 */
function l10nQueue(){
  l10nDirty=true;
  if(l10nTimer) return;
  l10nTimer=setTimeout(()=>{ l10nTimer=null; if(l10nDirty){ l10nDirty=false; l10nRun(); } },80);
}
function l10nStart(){
  if(window.__l10nObs) return;
  window.__l10nObs=new MutationObserver(muts=>{
    if(l10nBusy){ l10nQueue(); return; }   /* 自己改自己：等這一輪完再補一次（第二輪不會再變，自然停） */
    for(const m of muts){
      if(m.type==='characterData'){ l10nQueue(); return; }
      if(m.addedNodes&&m.addedNodes.length){ l10nQueue(); return; }
    }
  });
  window.__l10nObs.observe(document.body,{childList:true,subtree:true,characterData:true});
}
/* ══════════════════════════════════════════════════════════════════════
   v1.38.23 字體：放在家中的伺服器 + 三層退路
   ──────────────────────────────────────────────────────────────────────
   為甚麼不放在 GitHub Pages：
     楷體子集 2.1MB，全班 144 人每天開頁會把 Pages／Firebase 的下載量吃光。
     所以字體包放在家中的伺服器，網站只負責用 <link> 方式去拿。
   拿不到怎麼辦（家中停電、關機、街外斷線、被防火牆擋）：
     ① @font-face 寫 font-display:swap —— 文字先用系統字體出場，永不白屏
     ② 3.5 秒內沒載好或直接失敗 → 加 html.font-sys，整站退回系統原版字體
     ③ 失敗會記 10 分鐘，期間不再等（避免每次開頁都卡 3.5 秒）；
        10 分鐘後再試一次，家裡開返機就自動回來
     ④ 個人主頁「字體」可以手動切，選擇存 Firebase users/{帳號}/font，
        換手機、換瀏覽器、清快取都跟住你
   ══════════════════════════════════════════════════════════════════════ */
/* ★ 改這一行就能換字體來源。
     留空 = 用網站自帶的 fonts/LXGWWenKaiTC-subset.woff2
     填了 = 優先向家中伺服器拿（需要該伺服器允許跨域，見 deployment 說明）
     格式：https://nas.example.com/fonts/LXGWWenKaiTC-subset.woff2 */
const FONT_CDN='';
const FONT_PREF_KEY='chat_font';
const FONT_FAIL_KEY='chat_font_fail_at';
const FONT_RETRY_MS=10*60*1000;   // 失敗後 10 分鐘內不再試
function fontPref(){ try{ return localStorage.getItem(FONT_PREF_KEY)||'kai'; }catch(e){ return 'kai'; } }
function applyFontPref(){
  let sys=false;
  try{ sys = fontPref()==='sys'; }catch(e){}
  document.documentElement.classList.toggle('font-sys', sys);
  const el=document.getElementById('fontPrefSub');
  if(el) el.textContent = sys ? '系統字體' : '楷體';
}
/* 把字體來源指向家中伺服器。
   ⚠ CSSFontFaceRule.style 在瀏覽器是唯讀的（setProperty 不會生效、也不報錯），
     所以不能用改寫規則的方式，要另外插一條新的 @font-face（不同 family 名），
     再把 body 的字體清單指過去；原本本地那條留著當備援，不會被用到。 */
function kaiFamily(){ return FONT_CDN ? 'LXGW WenKai Home' : 'LXGW WenKai TC'; }
const KAI_RANGE='U+2E80-2EFF,U+3000-303F,U+3100-312F,U+31C0-31EF,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FE30-FE4F,U+FF00-FFEF';
function applyFontSource(){
  if(!FONT_CDN) return;
  if(document.getElementById('fontCdnRule')) return;
  try{
    const st=document.createElement('style');
    st.id='fontCdnRule';
    st.textContent=
      '@font-face{font-family:"LXGW WenKai Home";font-style:normal;font-weight:400;font-display:swap;'+
      'src:url("'+FONT_CDN+'") format("woff2");unicode-range:'+KAI_RANGE+'}'+
      "body{font-family:'LXGW WenKai Home','Inter',-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"PingFang HK\",\"PingFang TC\",\"Microsoft JhengHei UI\",\"Microsoft JhengHei\",\"Noto Sans CJK TC\",\"Noto Sans TC\",system-ui,sans-serif}";
    document.head.appendChild(st);
  }catch(e){}
}
function markFontFail(){
  document.documentElement.classList.add('font-sys');
  try{ localStorage.setItem(FONT_FAIL_KEY, String(Date.now())); }catch(e){}
}
function setFontPref(v){
  try{ localStorage.setItem(FONT_PREF_KEY, v); }catch(e){}
  applyFontPref();
  /* 同步存到 Firebase：這個帳號現在用什麼字體 */
  try{ if(typeof me!=='undefined'&&me&&me.username) update(ref(db,'users/'+me.username),{font:v}); }catch(e){}
}
let _fontTried=false;
async function ensureFontLoaded(){
  applyFontPref();
  if(fontPref()==='sys') return;
  if(_fontTried) return;
  _fontTried=true;
  applyFontSource();
  if(!document.fonts||!document.fonts.load) return;
  let failAt=0;
  try{ failAt=Number(localStorage.getItem(FONT_FAIL_KEY))||0; }catch(e){}
  if(failAt&&(Date.now()-failAt)<FONT_RETRY_MS){ markFontFail(); return; }   // 剛失敗過，直接退
  let done=false;
  const timer=setTimeout(()=>{ if(!done){ done=true; markFontFail(); } },3500);
  try{
    await document.fonts.load('16px "'+kaiFamily()+'"','班級聊天室對局邀請');
    if(done) return;
    done=true; clearTimeout(timer);
    document.documentElement.classList.remove('font-sys');
    try{ localStorage.removeItem(FONT_FAIL_KEY); }catch(e){}
  }catch(e){
    if(done) return;
    done=true; clearTimeout(timer);
    markFontFail();
  }
}
function toggleFont(){
  const next = (fontPref()==='sys') ? 'kai' : 'sys';
  setFontPref(next);
  showNotif(next==='sys' ? '已切換為系統字體' : '已切換為楷體');
  if(next==='kai'){
    try{ localStorage.removeItem(FONT_FAIL_KEY); }catch(e){}
    _fontTried=false; ensureFontLoaded();
  }
}

function syncFontFromUser(data){
  try{

  }catch(e){}

  try{ localStorage.removeItem(FONT_FAIL_KEY); }catch(e){}
  _fontTried=false;
  try{ ensureFontLoaded(); }catch(e){}
}

/* ═══ 裝置白名單 + 新裝置數字配對（Google 式）═══════════════════════════
   規則：
   · 每個帳號第一次登入的裝置，自動成為「信任裝置」
   · 之後在別部裝置登入 → 新裝置顯示三個數字，原本那部手機要點中正確的一個
   · 點對 → 新裝置寫入 devices 白名單，下次可以直接登入
   · 公用機（班長的手機，同學常借來玩）→ 非管理員帳號直接放行，8 小時後失效
   注意：資料庫規則目前全開，技術上有人可以直接改 devices 繞過；
   呢一層擋的是「知道密碼就想登入」的普通情況。 */
function deviceIdOf(){
  try{
    var raw=[navigator.userAgent,screen.width+'x'+screen.height,
      (Intl.DateTimeFormat().resolvedOptions().timeZone||''),
      navigator.language||'',navigator.hardwareConcurrency||0].join('|');
    var h=0; for(var i=0;i<raw.length;i++) h=(h*31+raw.charCodeAt(i))|0;
    return 'd'+(Math.abs(h)>>>0).toString(36)+raw.length.toString(36);
  }catch(e){ return 'd0'; }
}
function deviceLabel(){
  try{ return String(navigator.userAgent||'').replace(/^Mozilla\/5\.0 /,'').slice(0,90); }catch(e){ return ''; }
}
/* ═══ 新裝置數字配對開關（2026-10-28）══════════════════════════════════
   false = 不顯示配對彈窗（目前設定）。
   整套代碼（新裝置發起、原裝置確認、白名單寫入、三選一數字、拒絕流程）
   一行都沒有刪，只是被這個開關擋住。要恢復：改成 true 就即刻生效。
   關閉期間的行為：新裝置登入後直接寫入 devices 白名單並放行，
   等於回到「知道密碼就可以登入」的做法。 */
const DEVICE_PAIR_ON = false;

function isPublicDevice(){ try{ return localStorage.getItem('publicDevice')==='1'; }catch(e){ return false; } }
function isAdminRole(r){ return r==='admin'||r==='superadmin'; }
function pairEl(id){ return document.getElementById(id); }
function hidePairAll(){ ['pairOv','pairAsk'].forEach(function(id){ var e=pairEl(id); if(e) e.classList.add('hidden'); }); }
var pairTimer=null;

function ensureDeviceTrusted(u,data){
  return new Promise(function(resolve){
    var did=deviceIdOf();
    var devs=data.devices||{};
    var keys=Object.keys(devs);
    (async function(){
      try{
        if(keys.length===0){
          await set(ref(db,'users/'+u+'/devices/'+did),{ua:deviceLabel(),at:Date.now(),first:true});
          return resolve(true);
        }
        if(devs[did]){
          await update(ref(db,'users/'+u+'/devices/'+did),{lastAt:Date.now()});
          return resolve(true);
        }
        /* ═══ 配對關閉：新裝置直接記入白名單放行，不彈任何東西 ═══
           下面那整段（生成三個數字、寫 pairing、每 1.5 秒輪詢結果、
           等原裝置點對、逾時取消）全部保留，只是永遠不會執行到。 */
        if(!DEVICE_PAIR_ON){
          try{
            await set(ref(db,'users/'+u+'/devices/'+did),{
              ua:deviceLabel(), at:Date.now(), autoAdded:true
            });
          }catch(e){}
          return resolve(true);
        }
        /* 公用機：非管理員帳號直接放行，8 小時後失效 */
        if(isPublicDevice() && !isAdminRole(data.role)){
          await set(ref(db,'users/'+u+'/devices/'+did),{ua:deviceLabel(),at:Date.now(),public:true,
            until:Date.now()+8*3600*1000});
          return resolve(true);
        }
        var code=Math.floor(10+Math.random()*90);
        var options=[code];
        while(options.length<3){ var n=Math.floor(10+Math.random()*90); if(options.indexOf(n)<0) options.push(n); }
        options.sort(function(){ return Math.random()-0.5; });
        var ansIdx=options.indexOf(code);
        var pid=Date.now();
        await set(ref(db,'users/'+u+'/pairing'),{
          id:pid, code:code, options:options, ansIdx:ansIdx, gen:1, wrong:0,
          fromDevice:did, fromUa:deviceLabel(), at:pid, status:'pending'
        });
        var myGen=1;
        pairEl('pairCodes').innerHTML='<b>'+code+'</b>';
        pairEl('pairHint').textContent='等待原本的裝置確認…';
        pairEl('pairHint').className='pair-hint';
        pairEl('pairDev').textContent='這部裝置：'+deviceLabel();
        pairEl('pairOv').classList.remove('hidden');
        var done=false;
        if(pairTimer) clearInterval(pairTimer);
        pairTimer=setInterval(async function(){
          if(done) return;
          try{
            var snap=await get(ref(db,'users/'+u+'/pairing'));
            var pr=snap.exists()?snap.val():null;
            if(!pr||pr.id!==pid) return;
            if((pr.gen||1)!==myGen){
              myGen=pr.gen||1;
              pairEl('pairCodes').innerHTML='<b>'+pr.code+'</b>';
              pairEl('pairHint').textContent='舊裝置點錯了，數字已更新，請再看一次';
              pairEl('pairHint').className='pair-hint';
            }
            if(pr.status==='ok'){
              done=true; clearInterval(pairTimer); pairTimer=null;
              pairEl('pairHint').textContent='已確認，正在登入…';
              pairEl('pairHint').className='pair-hint ok';
              setTimeout(function(){ hidePairAll(); resolve(true); },500);
            }else if(pr.status==='denied'){
              done=true; clearInterval(pairTimer); pairTimer=null;
              pairEl('pairHint').textContent='已被拒絕，請聯絡管理員';
              pairEl('pairHint').className='pair-hint err';
              setTimeout(function(){ hidePairAll(); resolve(false); },1600);
            }
          }catch(e){}
        },1500);
        pairEl('pairCancel').onclick=function(){
          done=true; if(pairTimer){ clearInterval(pairTimer); pairTimer=null; }
          hidePairAll();
          try{ update(ref(db,'users/'+u+'/pairing'),{status:'denied'}); }catch(e){}

var pairWatch=null;
function watchPairing(){
  if(!me) return;
  if(!DEVICE_PAIR_ON) return;   /* 配對關閉：原裝置也不用再等別人來配對 */
  if(pairWatch){ try{ pairWatch(); }catch(e){} pairWatch=null; }
  pairWatch=onValue(ref(db,'users/'+me.username+'/pairing'),function(snap){
    var p=snap.val();
    if(!p||p.status!=='pending'){ var o=pairEl('pairAsk'); if(o) o.classList.add('hidden'); return; }
    if(p.fromDevice===deviceIdOf()) return;
    showPairAsk(p);
  });
}
function showPairAsk(p){
  if(!DEVICE_PAIR_ON) return;   /* 兜底：即使有人手動調到這裡也不會顯示 */
  var ov=pairEl('pairAsk'); if(!ov) return;
  var opts=p.options||p.codes||[];
  pairEl('askCodes').innerHTML=opts.map(function(n,i){ return '<b data-i="'+i+'">'+n+'</b>'; }).join('');
  /* 點錯過就把提示留住，不要每次重繪都清空 */
  if(p.wrong){ pairEl('askHint').textContent='數字不對，已換一組新數字（錯誤 '+p.wrong+'/3）'; pairEl('askHint').className='pair-hint err'; }
  else { pairEl('askHint').textContent=''; pairEl('askHint').className='pair-hint'; }
  pairEl('askDev').textContent='來自：'+(p.fromUa||'未知裝置');
  ov.classList.remove('hidden');
  Array.prototype.forEach.call(pairEl('askCodes').querySelectorAll('b'),function(b){
    b.onclick=async function(){
      var i=Number(b.getAttribute('data-i'));
      if(i===Number(p.ansIdx)){
        try{
          await set(ref(db,'users/'+me.username+'/devices/'+p.fromDevice),{
            ua:p.fromUa||'', at:Date.now(), approvedBy:me.username
          });
          await update(ref(db,'users/'+me.username+'/pairing'),{status:'ok'});
        }catch(e){}
        pairEl('askHint').textContent='已允許，這部裝置下次可以直接登入';
        pairEl('askHint').className='pair-hint ok';
        Array.prototype.forEach.call(pairEl('askCodes').querySelectorAll('b'),function(x){ x.onclick=null; });
        setTimeout(function(){ ov.classList.add('hidden'); },1300);
        return;
      }
      /* 點錯：換一組全新的數字，新裝置會同步更新；錯三次直接拒絕 */
      var wrong=(Number(p.wrong)||0)+1;
      if(wrong>=3){
        try{ await update(ref(db,'users/'+me.username+'/pairing'),{status:'denied',wrong:wrong}); }catch(e){}
        pairEl('askHint').textContent='連續三次錯誤，已拒絕這次登入';
        pairEl('askHint').className='pair-hint err';
        Array.prototype.forEach.call(pairEl('askCodes').querySelectorAll('b'),function(x){ x.onclick=null; });
        setTimeout(function(){ ov.classList.add('hidden'); },1800);
        return;
      }
      var code=Math.floor(10+Math.random()*90);
      var list=[code];
      while(list.length<3){ var n=Math.floor(10+Math.random()*90); if(list.indexOf(n)<0) list.push(n); }
      list.sort(function(){ return Math.random()-0.5; });
      try{
        await update(ref(db,'users/'+me.username+'/pairing'),{
          code:code, options:list, ansIdx:list.indexOf(code),
          gen:(Number(p.gen)||1)+1, wrong:wrong
        });
      }catch(e){}
    };
  });
  pairEl('askDeny').onclick=async function(){
    try{ await update(ref(db,'users/'+me.username+'/pairing'),{status:'denied'}); }catch(e){}
    ov.classList.add('hidden');
  };
}

var OB_STEPS=[
  {sel:'#msgInput',       t:'在這裡打字跟同學聊天'},
  {sel:'#plusBtn',        t:'按「＋」可以發圖片、檔案，也可以開小遊戲'},
  {sel:'.nav-item[data-action="openTools"]', t:'小程式：港鐵、巴士、綠紙產生器'},
  {sel:'.nav-item[data-action="openMyProfile"]', t:'個人主頁：積分、兌換碼、任務'}
];
var obIdx=0, obHole=null, obTip=null;
function obFinish(){
  try{ localStorage.setItem('obDone','1'); }catch(e){}
  /* 同步寫回 DB，否則管理員無法從後台重置（localStorage 是每台機各自的） */
  if(me){
    me.obDone = true;
    try{ update(ref(db,'users/'+me.username),{obDone:true}); }catch(e){}
  }
  if(obHole){ obHole.remove(); obHole=null; }
  if(obTip){ obTip.remove(); obTip=null; }
}
function obShow(i){
  var st=OB_STEPS[i]; if(!st) return obFinish();
  var el=document.querySelector(st.sel);
  if(!el){ obFinish(); return; }        /* 找不到目標（例如未登入的按鈕）就結束 */
  var r=el.getBoundingClientRect();
  var pad=8;
  if(!obHole){ obHole=document.createElement('div'); obHole.className='ob-hole'; document.body.appendChild(obHole); }
  obHole.style.left=(r.left-pad)+'px';
  obHole.style.top=(r.top-pad)+'px';
  obHole.style.width=(r.width+pad*2)+'px';
  obHole.style.height=(r.height+pad*2)+'px';
  if(!obTip){ obTip=document.createElement('div'); obTip.className='ob-tip'; document.body.appendChild(obTip); }
  var below = r.bottom < window.innerHeight*0.55;
  obTip.style.top = below ? Math.min(r.bottom+18, window.innerHeight-190)+'px'
                          : Math.max(12, r.top-165)+'px';
  obTip.innerHTML='<div class="ob-n">'+(i+1)+' / '+OB_STEPS.length+'</div>'
    +'<div>'+st.t+'</div>'
    +'<div class="ob-b"><button class="ob-skip">跳過</button>'
    +'<button class="ob-next">'+(i===OB_STEPS.length-1?'開始用':'下一步')+'</button></div>';
  obTip.querySelector('.ob-skip').onclick=obFinish;
  obTip.querySelector('.ob-next').onclick=function(){ obIdx++; obShow(obIdx); };
}
function startOnboardingIfNeeded(){
  /* 管理員在後台把 obDone 設成 false → 就算這台機看過也要重看一次 */
  if(!me) return;
  if(me.obDone !== false){
    try{ if(localStorage.getItem('obDone')) return; }catch(e){ return; }
  }
  obIdx=0;
  setTimeout(function(){ obShow(0); },900);
  window.addEventListener('resize',function(){ if(obHole&&obTip) obShow(obIdx); });
}

async function handleLogin(uArg,pArg){
  // uArg / pArg 是「網址登入」帶進來的；一般按登入鈕時不會傳，就讀輸入框
  let u=(uArg!==undefined?String(uArg):loginUsername.value).trim().toLowerCase(),
        p=(pArg!==undefined?String(pArg):loginPassword.value);
  /* 1E 別名：帳號格式準備由 stu15 統一到 1E15。
     過渡期兩種都可以登入，指向同一個帳號、同一個密碼。
     接受 1e15 / 1E15 / 1e5 / 1E05（1-2 位數字，自動補零）。 */
  try{
    const _m=u.match(/^1e(\d{1,2})$/i);
    if(_m) u='stu'+String(_m[1]).padStart(2,'0');
  }catch(e){}
  loginError.textContent='';
  if(!u||!p){loginError.textContent='請輸入帳號與密碼';return;}
  loginBtn.disabled=true;loginBtn.textContent='登入中...';
  try{
    const snap=await get(child(ref(db),'users/'+u));
    if(!snap.exists()){loginError.textContent='帳號不存在';return;}
    const data=snap.val();
    if(data.disabled===true){loginError.textContent='此帳號已停用';return;}
    if(data.banned&&data.banned.type==='severe'){loginError.textContent='你已被封禁，無法登入。\n原因：'+(data.banned.reason||'（無原因）');return;}
    if(data.password!==p){loginError.textContent='密碼錯誤';return;}
    const trusted=await ensureDeviceTrusted(u,data);
    if(!trusted){ return; }
    me={username:data.username,displayName:data.displayName||data.username,chiName:data.chiName||'',engName:data.engName||'',seat:data.seat,cls:data.class||'',color:data.color||'#3b82f6',role:data.role||'member',avatar:data.avatar||null,banned:data.banned||null,points:Number(data.points)||0,obDone:(data.obDone===false?false:true),exp:Number(data.exp)||0,mood:data.mood||'',frame:data.frame||'',nameFx:data.nameFx||'',chatBg:data.chatBg||'',bio:data.bio||'',title:data.title||''};
    if(data.theme){theme=data.theme;localStorage.setItem('chat_theme',theme);applyTheme();}
    if(data.lang&&['zh-Hant','zh-Hans','en'].includes(data.lang)){lang=data.lang;localStorage.setItem('chat_lang',lang);applyLang();}
    try{ syncFontFromUser(data); }catch(e){}
    try{await update(ref(db,'users/'+me.username),{hasLoggedIn:true,neverLoggedIn:null,lastLoginAt:Date.now()});}catch(e){}
    sessionStorage.setItem('chat_me',JSON.stringify(me));
    clearUrlCreds();   // 網址裡的 u、p、t 用完就清掉，不留在歷史紀錄
    sweepLoginTokens();   // 順手清掉過期／已用過的登入權杖
    try{await set(ref(db,'presence/'+me.username),Date.now());}catch(e){}
    try{await ensureAIUser();}catch(e){}
    try{await writeLog('login','登入系統');}catch(e){}
    try{await recordLoginDevice();}catch(e){}
    enterChat();
  }catch(e){ console.error(e);loginError.textContent='登入失敗：'+(e.code||e.message); }
  finally{loginBtn.disabled=false;loginBtn.textContent='登入';}
}

async function recordLoginDevice(){
  if(!me) return;
  try{
    const key=Date.now();
    let tz='';
    try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''; }catch(e){}
    const dev={
      at:key,
      ua:String((navigator&&navigator.userAgent)||'').slice(0,180),
      scr:((typeof screen!=='undefined'&&screen.width)||0)+'x'+((typeof screen!=='undefined'&&screen.height)||0),
      tz:tz,
      lang:String((navigator&&navigator.language)||'').slice(0,12)
    };
    await set(ref(db,'users/'+me.username+'/loginLog/'+key),dev);
    await update(ref(db,'users/'+me.username),{lastDevice:dev});
    const snap=await get(ref(db,'users/'+me.username+'/loginLog'));
    if(snap.exists()){
      const ks=Object.keys(snap.val()).sort();
      if(ks.length>10){ for(const k of ks.slice(0,ks.length-10)){ try{ await remove(ref(db,'users/'+me.username+'/loginLog/'+k)); }catch(e){} } }

     .info/connected 做一條提示：斷線橙色、恢復綠色 3 秒後收起。 */
  if(!window.__netWatched){

    let netBar=document.createElement('div');

    let netHideT=null, netEver=false;
    const netSay=function(text,ok,autoHide){
      netBar.textContent=text;
      netBar.classList.toggle('ok',!!ok);
      netBar.classList.add('on');
      clearTimeout(netHideT);
      if(autoHide) netHideT=setTimeout(function(){ netBar.classList.remove('on'); },2600);
    };
    try{

        if(online){ netSay('已重新連線',true,true); }
        else{ netSay('離線中 · 正在重連…',false,false); }
      });
    }catch(e){}
    window.addEventListener('online',function(){ try{ netSay('已重新連線',true,true); }catch(e){} });
  }
  subscribeQuotes();

  try{

/* 一則訊息該不該顯示（管理員可以在兩小時內看到剛被下架的那幾則） */
function msgVisible(m,now){
  if(!m.deleted)return true;
  if(me.role==='superadmin'||me.role==='admin')return (now-(m.deletedAt||0))<2*3600*1000;
  return false;
}
function msgFromSnap(val){
  const now=Date.now();
  return Object.keys(val||{}).map(k=>({_key:k,...val[k]})).filter(m=>msgVisible(m,now)).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
}
/* 畫面上要顯示的全部訊息 = 自己翻回來的歷史 + 最新窗口 */
function allMsgs(){ return olderMsgs.length?olderMsgs.concat(messages):messages; }
function subscribeMessages(){
  if(unsubMsg)unsubMsg();
  /* 重新訂閱（登入）＝回到最新窗口，之前翻出來的歷史清掉，避免換帳號時殘留 */
  olderMsgs=[];histDone=false;histLoading=false;histCursor=null;
  unsubMsg=onValue(query(ref(db,'messages'),orderByChild('createdAt'),limitToLast(MSG_WINDOW)),snap=>{
    const fresh=msgFromSnap(snap.val());
    if(olderMsgs.length){
      /* 新訊息進來時窗口會往上滑，跟已載入的歷史可能重疊 → 用 _key 去重 */
      const seen=Object.create(null);fresh.forEach(m=>{seen[m._key]=1;});
      olderMsgs=olderMsgs.filter(m=>!seen[m._key]);
    }
    messages=fresh;
    render();
  });
}

async function openNoticeFullscreen(key,customList){

  const stage=document.getElementById('nfStage');
  if(stage)stage.scrollTo({left:0,behavior:'auto'});

/* 輪播的前後箭頭與進度都改成「文件層級」處理：
   這樣即使這一頁被還原回來（HTML 重新插回 DOM），按鈕依然有效。 */
function noticeCarouselStep(dir){
  const stage=document.getElementById('nfStage');if(!stage)return;
  const cs=Array.from(stage.querySelectorAll('.car-card'));if(cs.length===0)return;
  const center=stage.scrollLeft+stage.clientWidth/2;let cur=0,min=Infinity;
  cs.forEach((c,i)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-center);if(d<min){min=d;cur=i;}});
  let nx=cur+dir;if(nx<0)nx=cs.length-1;if(nx>=cs.length)nx=0;
  stage.scrollTo({left:cs[nx].offsetLeft-(stage.clientWidth-cs[nx].offsetWidth)/2,behavior:'smooth'});
}
function refreshNoticeCarousel(){
  const s=document.getElementById('nfStage');if(!s)return;
  const center=s.scrollLeft+s.clientWidth/2;
  let closest=0,minDist=Infinity;
  s.querySelectorAll('.car-card').forEach((c,i)=>{const cc=c.offsetLeft+c.offsetWidth/2;const d=Math.abs(cc-center);if(d<minDist){minDist=d;closest=i;}c.classList.toggle('active',d<c.offsetWidth/2);});
  const prog=document.getElementById('nfProgress');
  if(prog)prog.textContent=`${closest+1} / ${s.querySelectorAll('.car-card').length}`;
}
document.addEventListener('scroll',e=>{
  const stage=e.target;
  if(!stage||stage.id!=='nfStage')return;
  clearTimeout(window._nfT);
  window._nfT=setTimeout(refreshNoticeCarousel,120);
},true);

/* 產生訊息鍵（v1.19 改回 msg_NNNN 格式，但用原子遞增）。

   為什麼不是單純改回舊寫法：
   舊寫法是「讀編號 → 加一 → 寫回」三步，兩個人同時送出會讀到同一個號，
   寫進同一個鍵，後送的直接把先送的整則蓋掉（訊息無聲消失）。
   這裡只把「取號」換成 runTransaction，由 Firebase 保證原子性 ——
   同時送出也會拿到不同的號，鍵名格式則維持原本的 msg_NNNN。

   第二層保險：Android 端目前還是舊的讀-改-寫（要重新出 App 才改得到），
   所以萬一號真的被用走了，就補上毫秒當後綴。
   寧可鍵名長得不一樣，也絕對不覆蓋別人的訊息。 */
/* Firebase 的 get() 在「沒有 .indexOn 的節點」上跑 orderByChild 查詢會被直接拒絕：
     Index not defined, add ".indexOn": "createdAt", for path "/messages"
   我們的 .indexOn 一直沒能套用到線上規則（沒有 Firebase 管理權限），
   結果所有 get(query(...,orderByChild(...))) 全部失敗 —— 管理員刪訊息、恢復、
   徹底刪除、批准刪除請求這些按下去都沒反應。
   同樣的查詢改用 onValue「監聽」不會被擋（伺服器自己掃、回傳的仍是最後 300 則），
   所以統一用這個取一次就退訂。 */
function readQueryOnce(q,ms){
  return new Promise((res,rej)=>{
    let done=false;
    const un=onValue(q,s=>{ if(done)return;done=true;try{un();}catch(e){} res(s); },e=>{ if(done)return;done=true;try{un();}catch(e){} rej(e); });
    setTimeout(()=>{ if(done)return;done=true;try{un();}catch(e){} rej(new Error('讀取逾時')); },ms||15000);
  });
}
async function nextMsgId(){
  let seq=0;
  try{
    const res=await runTransaction(ref(db,'meta/msgCounter'),c=>(Number(c)||0)+1);
    seq=Number(res.snapshot.val())||0;
  }catch(e){}
  let id='msg_'+String(seq).padStart(4,'0');
  try{ if((await get(child(ref(db),'messages/'+id))).exists()) id=id+'_'+Date.now(); }catch(e){}
  return id;
}

/* 群聊的鍵格式跟主訊息不同：<群組key>_msg_<數字>，號碼記在 groups/{key}/msgCounter。
   同樣把取號改成原子操作。 */
async function nextGroupMsgId(gk){

}

async function sendMessage(){
  const text=msgInput.value.trim();if(!text||!me)return;
  if(me.banned&&me.banned.type==='light'){showNotif('你目前被限制發言');return;}
  sendBtn.disabled=true;
  const isEncrypted=encCheckbox.checked;
  const hasHtml=/<[a-zA-Z][\s\S]*?>/.test(text);
  try{
    /* v1.15：訊息鍵改用 push()。
       以前是「讀 meta/msgCounter → 加一 → 寫回去 → 拼成 msg_0001」四步，
       中間只要兩個人同一個瞬間送出，就會讀到同一個號碼、拼出同一個鍵，
       後送出的那則會直接把前一則蓋掉（訊息就這樣無聲消失）。
       push() 由 Firebase 產生唯一且依時間排序的鍵，天生不會撞。
       舊訊息（msg_0001…）完全不用動：讀取端是靠 createdAt 排序、靠 id 欄位找訊息，
       兩種鍵名可以並存，前面的聊天記錄一則都不會少。 */
    const msgId=await nextMsgId();
    const isAdmin=me.role==='superadmin'||me.role==='admin';
    const sendObj={id:msgId,username:me.username,displayName:me.displayName,chiName:me.chiName||'',engName:me.engName||'',seat:me.seat,cls:me.cls||'',color:me.color,avatar:me.avatar,role:me.role,text,type:'text',encrypted:isEncrypted,hasHtml:hasHtml,htmlCheckStatus:(hasHtml&&!isAdmin)?'checking':'ok',createdAt:Date.now(),deleted:false};
    if(replyToMsg&&replyToMsg.id){ sendObj.replyTo={id:replyToMsg.id,name:replyToMsg.name,text:replyToMsg.text}; }
    await set(ref(db,'messages/'+msgId),sendObj);
    try{ cancelQuote(); }catch(e){}
    await writeLog('send','發送訊息：'+text.slice(0,50));
    addExp(1);
    bumpDaily('msg');
    msgInput.value='';encCheckbox.checked=false;encToggle.classList.remove('active');hideMention();
    scrollToBottom();
    if(hasHtml&&!isAdmin){
      checkHtmlMessage(msgId,text).catch(e=>console.error(e));
    }
    if(myAIOn){ handleAITrigger(text).catch(e=>console.error(e)); }
  }catch(e){showNotif('送出失敗');}
  finally{sendBtn.disabled=false;msgInput.focus();}
}
async function checkHtmlMessage(msgId,text){
  try{
    const sysPrompt='你是網站安全審查員。請判斷以下 HTML 是否含有攻擊性內容（例如：偷取資料、XSS、惡意重定向、釣魚、破壞頁面、卡死瀏覽器）。只回答 SAFE 或 DANGER，不要有其他文字。';
    const r1=await callAI([{role:'system',content:sysPrompt},{role:'user',content:text}]);
    if(!r1)return;
    const c1=(r1.content||'').trim().toUpperCase();
    if(c1.includes('DANGER')){
      await update(ref(db,'messages/'+msgId),{deleted:true,deletedAt:Date.now(),deletedBy:'AI_AUTO',htmlRejected:true});
      showNotif('檢測到可能有攻擊網站的 HTML，已拒絕發送');
      return;
    }
    const r2=await callAI([{role:'system',content:sysPrompt},{role:'user',content:text}]);
    if(!r2)return;
    const c2=(r2.content||'').trim().toUpperCase();
    if(c2.includes('DANGER')){
      await update(ref(db,'messages/'+msgId),{deleted:true,deletedAt:Date.now(),deletedBy:'AI_AUTO',htmlRejected:true});
      showNotif('檢測到可能有攻擊網站的 HTML，已拒絕發送');
      return;
    }
    await update(ref(db,'messages/'+msgId),{htmlCheckStatus:'ok'});
  }catch(e){ console.error('HTML check error',e); }
}

/* v1.37：多加了 maxTokens／thinking 兩個可選參數。
   這顆模型（dots3-note-prev）會先吐一大段「Thinking Process」再給答案，
   而那段推理是算在 max_tokens 裡的 —— 額度不夠時 finish_reason 會是 length、
   content 直接變成空字串（看圖時推理特別長，實測 1024 常常不夠）。
   所以看圖的請求走 callAIVision()，關掉 thinking 直接回答。 */
async function callAI(messages,retry=0,maxTokens=1024,thinking=true){
  try{
    const body={model:AI_MODEL,messages,stream:false,max_tokens:maxTokens,chat_template_kwargs:{enable_thinking:thinking!==false}};
    const res=await fetch(AI_API,{method:'POST',headers:{'Content-Type':'application/json','api-key':AI_KEY},body:JSON.stringify(body)});
    if(res.status===429&&retry<3){await new Promise(r=>setTimeout(r,2000));return callAI(messages,retry+1,maxTokens,thinking);}
    if(!res.ok)throw new Error('API '+res.status);
    const data=await res.json();
    const choice=data.choices&&data.choices[0];
    if(!choice)return null;
    return {content:(choice.message&&choice.message.content)||'',reasoning:(choice.message&&choice.message.reasoning_content)||''};
  }catch(e){ if(retry<3){await new Promise(r=>setTimeout(r,2000));return callAI(messages,retry+1,maxTokens,thinking);}throw e; }
}
/* ═══ v1.38.6：Google 首頁小工具背後的問答 ═══════════════════════════
   工具頁（google.html）本身不存 API key —— 它用 postMessage 把問題丟上來，
   由聊天室這一邊代為問 AI，再把答案傳回去。答案只會出現在工具頁的
   「最近搜尋」清單裡，聊天室這邊不留任何對話痕跡。 */
/* 模型偶爾會漏幾個簡體字（實測出現過「每个區」「在当地」）。
   這裡補一層字對字的兜底：只收「一個簡體對一個繁體」的字，
   像干／乾／幹、后／後、里／裡、只／隻、面／麵 這種要按上下文判斷的全部不放，

async function trimAIMemory(){
  const snap=await get(ref(db,'aiMemory/messages'));if(!snap.exists())return;
  const val=snap.val();const keys=Object.keys(val);
  if(keys.length<=500)return;
  const sorted=keys.map(k=>({k,time:(val[k]&&val[k].time)||0})).sort((a,b)=>a.time-b.time);
  for(const x of sorted.slice(0,sorted.length-500)){ try{await remove(ref(db,'aiMemory/messages/'+x.k));}catch(e){} }
}
function showAIConfirm(cmd,asker){
  pendingAIConfirm={cmd,asker};
  const old=document.getElementById('aiConfirmBar');if(old)old.remove();
  const bar=document.createElement('div');bar.id='aiConfirmBar';bar.classList.add('anim-in-bar');
  bar.innerHTML=`<div class="acb-text">AI 想執行：<div class="acb-cmd">${escapeHtml(JSON.stringify(cmd))}</div></div><button data-action="aiAllow">允許</button><button data-action="aiDeny">拒絕</button>`;
  document.body.appendChild(bar);
}
async function aiAllow(){
  if(!pendingAIConfirm)return;
  const {cmd}=pendingAIConfirm;pendingAIConfirm=null;
  const bar=document.getElementById('aiConfirmBar');if(bar)animOut(bar,'anim-out-bar',220);
  try{
    const result=await executeAIAction(cmd);
    showNotif(result.ok?'已完成：'+result.desc:'失敗：'+result.error);
  }catch(e){showNotif('失敗');}
}
function aiDeny(){ pendingAIConfirm=null;const bar=document.getElementById('aiConfirmBar');if(bar)animOut(bar,'anim-out-bar',220);showNotif('已取消'); }
async function executeAIAction(cmd){
  try{
    switch(cmd.cmd){
      case 'setTheme':{ await setTheme(String(cmd.value||'').toLowerCase()==='light'?'light':'dark');return {ok:true,desc:'切換主題'}; }
      case 'setLang':{ const v=String(cmd.value||'');if(!['zh-Hant','zh-Hans','en'].includes(v))return {ok:false,error:'語言不正確'};await setLang(v);return {ok:true,desc:'切換語言'}; }
      case 'setColor':{ await update(ref(db,'users/'+cmd.target),{color:cmd.value});return {ok:true,desc:'改顏色'}; }
      case 'setName':{ await update(ref(db,'users/'+cmd.target),{displayName:cmd.value});return {ok:true,desc:'改名'}; }
      case 'setAvatar':{ await update(ref(db,'users/'+cmd.target),{avatar:cmd.value||null});return {ok:true,desc:'改頭像'}; }
      case 'setPassword':{ await update(ref(db,'users/'+cmd.target),{password:cmd.value});return {ok:true,desc:'改密碼'}; }
      case 'ban':{ await update(ref(db,'users/'+cmd.target),{banned:{type:cmd.value||'light',reason:cmd.reason||'AI',bannedAt:Date.now(),bannedBy:me.username}});return {ok:true,desc:'封禁'}; }
      case 'unban':{ await update(ref(db,'users/'+cmd.target),{banned:null});return {ok:true,desc:'解封'}; }
      case 'grantAdmin':{ await update(ref(db,'users/'+cmd.target),{role:'admin'});return {ok:true,desc:'授予管理員'}; }
      case 'revokeAdmin':{ await update(ref(db,'users/'+cmd.target),{role:'member'});return {ok:true,desc:'撤銷管理員'}; }
      case 'deleteMsg':{ const snap=await readQueryOnce(query(ref(db,'messages'),orderByChild('createdAt'),limitToLast(300)));const val=snap.val()||{};const key=Object.keys(val).find(k=>val[k].id===cmd.target);if(!key)return {ok:false,error:'找不到'};await update(ref(db,'messages/'+key),{deleted:true,deletedAt:Date.now(),deletedBy:me.username});return {ok:true,desc:'刪訊息'}; }
      case 'restoreMsg':{ const snap=await readQueryOnce(query(ref(db,'messages'),orderByChild('createdAt'),limitToLast(300)));const val=snap.val()||{};const key=Object.keys(val).find(k=>val[k].id===cmd.target);if(!key)return {ok:false,error:'找不到'};await update(ref(db,'messages/'+key),{deleted:false,deletedAt:null});return {ok:true,desc:'恢復訊息'}; }
      case 'purgeMsg':{ const snap=await readQueryOnce(query(ref(db,'messages'),orderByChild('createdAt'),limitToLast(300)));const val=snap.val()||{};const key=Object.keys(val).find(k=>val[k].id===cmd.target);if(!key)return {ok:false,error:'找不到'};await remove(ref(db,'messages/'+key));return {ok:true,desc:'徹底刪除'}; }
      case 'clearChat':{ await remove(ref(db,'messages'));await set(ref(db,'meta/msgCounter'),0);return {ok:true,desc:'清空聊天室'}; }
      case 'injectUI':{ await injectUI(cmd.target,cmd.html);return {ok:true,desc:'注入 UI'}; }
      case 'removeUI':{ removeInjectedUI(cmd.target,cmd.id);return {ok:true,desc:'移除 UI'}; }
      case 'freezeBrowser':{ freezeBrowser(cmd.target);return {ok:true,desc:'卡死瀏覽器'}; }
      case 'sendSystemNotice':{ const targets=cmd.target==='all'?Object.keys(allUsers).filter(u=>u!==AI_NAME):[cmd.target];for(const t of targets){await pushSystemNotice(t,{type:'admin_system',title:cmd.title||'系統通知',body:cmd.body||'',createdAt:Date.now(),read:false,html:cmd.html||''});}return {ok:true,desc:'發系統通知'}; }
      default:return {ok:false,error:'未知指令'};
    }
  }catch(e){return {ok:false,error:e.message};}
}
function injectUI(target,html){
  if(!html)return;
  const targets=target==='all'?['all']:[target];
  for(const t of targets){
    if(t==='all'||t===me.username){
      const div=document.createElement('div');
      div.className='ai-injected-ui';
      div.innerHTML=html;
      document.body.appendChild(div);
    }
  }
}
function removeInjectedUI(target,id){
  document.querySelectorAll('.ai-injected-ui').forEach(el=>{ if(!id||el.id===id)el.remove(); });
}
function freezeBrowser(target){
  if(target==='all'||target===me.username){
    document.body.innerHTML='<div style="position:fixed;inset:0;background:#000;color:#0f0;display:flex;align-items:center;justify-content:center;font-size:24px;font-family:monospace">SYSTEM FROZEN</div>';
    while(true){}

}

/* ── v1.36 視訊通話 ────────────────────────────────
   走 Jitsi Meet 公開伺服器（伺服器架構 → 人數可以很多；P2P 做不到多人）。
   房間名＝固定前綴 + 目標代號的雜湊：同一個群聊的人拿到同一個房間，外人猜不到。
   第二階段：家裏那台放 TURN 之後，一對一改走 P2P 直連（不經第三方）。 */
/* ═══════════════════════════════════════════════════════════════════════════
   v1.37 視訊通話引擎：自己的 UI ＋ 原生 WebRTC ＋ 我們自己的信令
   ---------------------------------------------------------------------------
   以前是 iframe 內嵌 meet.jit.si —— 伺服器是別人的、介面也是別人的。現在：
     · 影音 → 瀏覽器原生 WebRTC（RTCPeerConnection），兩邊直接連，不經第三方
     · 信令 → 我們自己的 Firebase RTDB：calls/{房間}/sig/{收件人}（自己的信箱）
     · 介面 → 全部自己畫（.vcStage / .vcTile / .vcCtrl 那一套，見上面的 CSS）
   連線規則：帳號字串比較小的人負責發 offer，另一邊只回 answer
             → 同一對人不會兩邊同時發，天生不會撞單。
   心跳：每 5 秒寫一次 peers/{我}/hb，關頁面時 onDisconnect 自動把自己清掉。
   備用線路：真的連不上時還有一個按鈕可以切回舊的 Jitsi（程式保留，沒有刪）。
   ═══════════════════════════════════════════════════════════════════════════ */
const VC_HOST='meet.jit.si';   // 只給「備用線路」用
const VC_ICE={
  iceServers:[

    /* ⚠ 這是過渡期用的公開 STUN。自己的 coturn 架好之後換成下面這組：
    ,{urls:['stun:161.81.51.234:3478','turn:161.81.51.234:3478?transport=udp','turn:161.81.51.234:3478?transport=tcp'],
      username:'oscar',credential:'（coturn 密碼）'} */
  ],

};
const VC_HB_MS=5000;          // 心跳間隔
const VC_STALE_MS=22000;      // 心跳超過這個時間沒更新 = 對方已經走了
const VC_MIN_RECORD_SEC=10;   // 講不到這個秒數不留紀錄（避免誤觸）

function vcRoomId(kind,key){
  const src='oscar1e|'+kind+'|'+key; let h=0;
  for(let i=0;i<src.length;i++)h=(h*31+src.charCodeAt(i))>>>0;
  return 'OscarChat1E-'+kind+'-'+h.toString(36);
}
function fmtDur(sec){ return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }
function vcSlug(s){ return String(s==null?'':s).replace(/[^a-zA-Z0-9_-]/g,'_'); }
function vcIsMobile(){ return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||''); }

let vcState=null;   // 現在這一通的全部狀態；null = 沒在通話

/* ── 鏡頭麥克風：逐級退讓（影音 → 只有聲 → 失敗）── */
async function vcGetMedia(){
  const tries=[
    {video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:{echoCancellation:true,noiseSuppression:true}},
    {video:{width:{ideal:640},height:{ideal:480},facingMode:'user'},audio:true},
    {video:false,audio:{echoCancellation:true,noiseSuppression:true}},
  ];
  for(const c of tries){
    try{ return await navigator.mediaDevices.getUserMedia(c); }catch(e){}
  }
  return null;
}

/* ── 主入口 ── */
async function openVideoCall(kind,key,title){
  if(!me)return;
  if(kind==='group'&&!currentGroupKey)return;
  if(typeof RTCPeerConnection==='undefined'||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    showNotif('這個瀏覽器不支援原生視訊通話，改用備用線路');
    return openVideoCallLegacy(kind,key,title);
  }
  if(vcState){ showNotif('你已經在通話中'); return; }

  vcState={
    roomId:vcRoomId(kind,key),kind,key,title,startedAt:Date.now(),closed:false,
    local:null,camTrack:null,shareTrack:null,sharing:false,micOn:true,camOn:true,
    peers:new Map(),levels:new Map(),audioCtx:null,
    unsubPeers:null,unsubSig:null,hbTimer:null,uiTimer:null,levelTimer:null,
    legacyShown:false
  };
  vcRenderShell(title);

  const stream=await vcGetMedia();
  if(!vcState||vcState.closed)return;
  if(!stream){ vcHangup('拿不到鏡頭或麥克風的權限'); return; }
  vcState.local=stream;
  vcState.camTrack=stream.getVideoTracks()[0]||null;
  vcState.camOn=!!vcState.camTrack;

  vcMountSelf();
  vcBindLevels('__me__',stream);
  await vcJoin();
  vcStartTimers();
  vcRenderGrid();
}

/* ── 自己的畫面（預覽用；分享畫面時換成螢幕）── */
function vcSelfStream(){
  const st=vcState; if(!st)return null;
  if(st.sharing&&st.shareTrack)return new MediaStream([st.shareTrack]);
  return st.local;
}
function vcMountSelf(){
  const st=vcState; if(!st)return;
  const el=vcTileFor(me.username);
  const stage=document.getElementById('vcStage');
  if(stage&&!el.parentElement)stage.appendChild(el);
  const v=el.querySelector('video');
  v.muted=true;                                  // 自己的畫面一定要靜音，否則回音
  const s=vcSelfStream();

/* ── 磁磚（每個人一格；用帳號當 key，重畫時沿用同一顆 video，避免畫面中斷）── */
function vcTileFor(username){
  const id='vcTile_'+vcSlug(username);
  let el=document.getElementById(id);
  if(el)return el;
  el=document.createElement('div');
  el.className='vcTile';
  el.id=id;
  el.innerHTML='<video autoplay playsinline></video>'
    +'<div class="vcOffAvatar"></div>'
    +'<div class="vcTileName"></div>'
    +'<div class="vcTileIcons">'
      +'<span class="camIco" hidden><svg class="ico"><use href="#i-video-off"/></svg></span>'
      +'<span class="micIco" hidden><svg class="ico"><use href="#i-mic-off"/></svg></span>'
    +'</div>'
    +'<div class="vcFlip" hidden>正在連線…</div>';
  return el;
}
function vcRenderGrid(){
  const st=vcState; if(!st)return;
  const stage=document.getElementById('vcStage'); if(!stage)return;
  const names=[me.username].concat(Array.from(st.peers.keys()).sort());
  const n=names.length;
  stage.style.gridTemplateColumns=(n<=1?'1fr':(n===2?(vcIsMobile()?'1fr':'1fr 1fr'):(n<=4?'1fr 1fr':(n<=9?'repeat(3,1fr)':'repeat(4,1fr)'))));
  stage.classList.toggle('solo',n<=1);
  names.forEach((u,i)=>{
    const el=vcTileFor(u);
    if(stage.children[i]!==el)stage.insertBefore(el,stage.children[i]||null);
    const self=(u===me.username);
    const rec=self?null:st.peers.get(u);
    const info=self?{name:me.displayName||me.username,chi:me.chiName||'',mic:st.micOn,cam:Boolean(st.camOn||st.sharing)}
                   :(rec&&rec.info)||{};
    const camOn=self?Boolean(st.camOn||st.sharing):(info.cam!==false);
    const micOn=self?st.micOn:(info.mic!==false);
    el.classList.toggle('mirror',self&&!(st.sharing));
    el.classList.toggle('off',!camOn);
    const nameEl=el.querySelector('.vcTileName');
    const nm=self?'你':String(info.name||u);
    const chi=(!self&&info.chi&&info.chi!==nm)?'<span class="chi">'+escapeHtml(info.chi)+'</span>':'';
    nameEl.innerHTML=escapeHtml(nm)+chi;
    const av=el.querySelector('.vcOffAvatar');
    av.textContent=(!self&&info.avatar)?String(info.avatar).slice(0,3):Array.from(nm)[0]||'?';
    el.querySelector('.camIco').hidden=camOn;
    el.querySelector('.micIco').hidden=micOn;
    const flip=el.querySelector('.vcFlip');
    const connecting=!self&&rec&&!rec.connected;
    flip.hidden=!connecting;
    if(connecting)flip.textContent='正在連線…';
    if(stage.children[i]===el&&self===false){
      const v=el.querySelector('video');
      if(v&&!v.muted){ v.muted=false; }
    }
  });
  const cnt=document.getElementById('vcCount');
  if(cnt)cnt.textContent=n+' 人';
}

/* ── 加入房間：寫自己的節點、廣播、聽別人的心跳與信件 ── */
async function vcJoin(){
  const st=vcState; if(!st)return;
  const peersPath='calls/'+st.roomId+'/peers';
  try{ await onDisconnect(ref(db,peersPath+'/'+me.username)).remove(); }catch(e){}
  await vcBeat(true);
  st.hbTimer=setInterval(()=>vcBeat(false),VC_HB_MS);

  st.unsubPeers=onValue(ref(db,peersPath),snap=>{ try{ vcSyncPeers(snap.val()||{}); }catch(e){} });

  st.unsubSig=onChildAdded(ref(db,'calls/'+st.roomId+'/sig/'+me.username),snap=>{
    const v=snap.val();

    Promise.resolve(vcOnSig(v)).finally(()=>{
      remove(ref(db,'calls/'+st.roomId+'/sig/'+me.username+'/'+key)).catch(()=>{});
    });
  });
}
async function vcBeat(first){
  const st=vcState; if(!st)return;
  const node={
    name:me.displayName||me.username,
    chi:me.chiName||'',
    color:safeColor(me.color,'#3b82f6'),

/* ── 誰該發 offer：帳號字串小的那個（同一對人只會有一邊發，不會撞）── */
function vcIInitiate(other){ return String(me.username)<String(other); }

function vcSyncPeers(val){
  const st=vcState; if(!st)return;
  const now=Date.now();
  const alive=new Set();
  for(const u of Object.keys(val||{})){
    if(u===me.username)continue;
    const info=val[u]||{};
    if(now-(Number(info.hb)||0)>VC_STALE_MS)continue;   // 心跳過期 = 已經走了
    alive.add(u);
    const rec=vcEnsurePeer(u,info);
    rec.info=info;
    if(!rec.offered&&vcIInitiate(u)){ rec.offered=true; vcOfferTo(u); }
  }
  for(const u of Array.from(st.peers.keys())){ if(!alive.has(u))vcDropPeer(u); }
  vcRenderGrid();
}

function vcEnsurePeer(u,info){
  const st=vcState; if(!st)return null;
  let rec=st.peers.get(u);
  if(rec)return rec;
  const pc=new RTCPeerConnection(VC_ICE);
  rec={u,pc,stream:new MediaStream(),info:info||{},pending:[],offered:false,connected:false};
  st.peers.set(u,rec);
  try{ (st.local?st.local.getTracks():[]).forEach(t=>{ try{ pc.addTrack(t,st.local); }catch(e){} }); }catch(e){}
  pc.ontrack=(ev)=>{
    try{
      if(ev.streams&&ev.streams[0])rec.stream=ev.streams[0];
      else if(!rec.stream.getTracks().some(t=>t.id===ev.track.id))rec.stream.addTrack(ev.track);
    }catch(e){}
    vcAttachStream(u,rec.stream);
    vcBindLevels(u,rec.stream);
  };
  pc.onicecandidate=(ev)=>{
    if(!ev.candidate)return;
    let c=null; try{ c=ev.candidate.toJSON?ev.candidate.toJSON():ev.candidate; }catch(e){ c=null; }
    if(c)vcSendSig(u,{t:'ice',c});
  };
  pc.onconnectionstatechange=()=>{
    rec.connected=(pc.connectionState==='connected');
    if(pc.connectionState==='failed'){
      try{ pc.restartIce(); }catch(e){}
      vcShowLegacyHint();
    }
    vcRenderGrid();
  };
  vcRenderGrid();
  return rec;
}

async function vcOfferTo(u){
  const st=vcState; if(!st)return;
  const rec=vcEnsurePeer(u); if(!rec)return;
  try{
    const offer=await rec.pc.createOffer();
    await rec.pc.setLocalDescription(offer);
    await vcSendSig(u,{t:'offer',sdp:{type:rec.pc.localDescription.type,sdp:rec.pc.localDescription.sdp}});
  }catch(e){}
}
async function vcSendSig(to,msg){
  const st=vcState; if(!st)return;
  msg.from=me.username; msg.at=Date.now();
  try{ await push(ref(db,'calls/'+st.roomId+'/sig/'+to),msg); }catch(e){}
}
async function vcFlushPending(rec){
  const q=rec.pending.splice(0);
  for(const c of q){ try{ await rec.pc.addIceCandidate(c); }catch(e){} }
}
async function vcOnSig(msg){
  const st=vcState; if(!st||!msg||!msg.from)return;
  const from=String(msg.from);
  if(from===me.username)return;
  const rec=vcEnsurePeer(from); if(!rec)return;
  const pc=rec.pc;
  try{
    if(msg.t==='offer'){
      if(pc.signalingState==='have-local-offer'){ try{ await pc.setLocalDescription({type:'rollback'}); }catch(e){} }
      await pc.setRemoteDescription({type:'offer',sdp:msg.sdp&&msg.sdp.sdp});
      await vcFlushPending(rec);
      const ans=await pc.createAnswer();
      await pc.setLocalDescription(ans);
      await vcSendSig(from,{t:'answer',sdp:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}});
    }else if(msg.t==='answer'){
      if(pc.signalingState!=='have-local-offer')return;
      await pc.setRemoteDescription({type:'answer',sdp:msg.sdp&&msg.sdp.sdp});
      await vcFlushPending(rec);
    }else if(msg.t==='ice'){
      if(!msg.c)return;
      let cand=null;
      try{ cand=new RTCIceCandidate(msg.c); }catch(e){ cand=msg.c; }
      if(pc.remoteDescription&&pc.remoteDescription.type){ try{ await pc.addIceCandidate(cand); }catch(e){} }
      else rec.pending.push(cand);
    }
  }catch(e){}
  vcRenderGrid();
}

function vcAttachStream(u,stream){
  const el=document.getElementById('vcTile_'+vcSlug(u));
  if(!el)return;
  const v=el.querySelector('video');
  if(!v)return;
  v.muted=false;                                   // 對方的聲音要放出來
  if(v.srcObject!==stream){ v.srcObject=stream; }
  v.play().catch(()=>{ /* 自動播放被擋：點一下那格就會播 */ 
    el.onclick=()=>{ v.play().catch(()=>{}); el.onclick=null; };
  });
}
function vcDropPeer(u){
  const st=vcState; if(!st)return;
  const rec=st.peers.get(u); if(!rec)return;
  try{ rec.pc.close(); }catch(e){}
  st.peers.delete(u);
  st.levels.delete(u);
  const el=document.getElementById('vcTile_'+vcSlug(u));
  if(el)el.remove();
  vcRenderGrid();
}
function vcShowLegacyHint(){
  const st=vcState; if(!st||st.legacyShown)return;
  st.legacyShown=true;
  const b=document.getElementById('vcLegacy');
  if(b)b.style.display='';
}

/* ── 誰在說話（本機與遠端都量音量，夠大就亮綠框）── */
function vcBindLevels(key,stream){
  const st=vcState; if(!st||!stream)return;
  try{
    if(!st.audioCtx)st.audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(!stream.getAudioTracks().length)return;
    const src=st.audioCtx.createMediaStreamSource(stream);
    const an=st.audioCtx.createAnalyser();
    an.fftSize=512;
    src.connect(an);
    st.levels.set(key,{an,buf:new Uint8Array(an.frequencyBinCount),score:0});
  }catch(e){}
}
function vcTickLevels(){
  const st=vcState; if(!st)return;
  for(const [key,lv] of st.levels){
    let sum=0;
    try{ lv.an.getByteFrequencyData(lv.buf); for(let i=0;i<lv.buf.length;i++)sum+=lv.buf[i]; }catch(e){}
    const rms=sum/(lv.buf.length||1);
    lv.score=rms>18?lv.score+1:0;
    const u=(key==='__me__')?me.username:key;
    const el=document.getElementById('vcTile_'+vcSlug(u));
    if(el)el.classList.toggle('speaking',lv.score>=2);
  }
}

/* ── 計時 ── */
function vcStartTimers(){

  st.local.getAudioTracks().forEach(t=>{ t.enabled=st.micOn; });
  vcPaintBtn('vcMic',st.micOn,'i-mic','i-mic-off');

}
function vcToggleCam(){

  st.local.getVideoTracks().forEach(t=>{ t.enabled=st.camOn; });
  vcPaintBtn('vcCam',st.camOn,'i-video','i-video-off');
