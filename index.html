<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none';base-uri 'none';object-src 'none';form-action 'none';script-src 'self' 'sha256-tU/8b9Ht9eGcUoX6LSRWgOecK0yV5PDx/LUOB64uJ9E=' https://www.gstatic.com https://*.firebasedatabase.app;style-src 'self' 'unsafe-inline';img-src 'self' data: blob: https://tile.openstreetmap.org https://www.openstreetmap.org https://oscar114515.github.io;font-src 'self' data:;media-src 'self' data: blob:;connect-src 'self' https://*.firebasedatabase.app wss://*.firebasedatabase.app https://note3-prev-api.askdiandian.com https://nominatim.openstreetmap.org https://data.weather.gov.hk https://www.gstatic.com;frame-src 'self' intent: https://meet.jit.si https://*.firebasedatabase.app;worker-src 'self' blob:">

<title>班級聊天室 v1.35</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
:root{
  --r-0:4px;--r-1:8px;--r-2:12px;--r-3:16px;--dur-1:120ms;--dur-2:200ms;--dur-3:280ms;--dur-4:480ms;--ease-out:cubic-bezier(.22,1,.36,1);--ease-inout:cubic-bezier(.4,0,.2,1);--gold:#fbbf24;--warn-tx:#fca5a5;--ok-tx:#4ade80;--danger:#f87171;--info:#38bdf8;--pink-tx:#f472b6;--purple-tx:#a78bfa;--orange-tx:#fdba74;--white-warm:#fff9ec;--bg-app:#0f172a;--bg-header:linear-gradient(90deg,#1e293b,#0f172a);--bg-card:#1e293b;--bg-input:rgba(15,23,42,.6);--text-main:#e2e8f0;--text-sub:#94a3b8;--text-muted:#64748b;--border:rgba(148,163,184,.15);--border-strong:rgba(148,163,184,.3);--primary:#3b82f6;--primary-2:#2563eb;--ai:#66ccff}
body.theme-light{--bg-app:#f0f2f5;--bg-header:linear-gradient(90deg,#ffffff,#f8fafc);--bg-card:#ffffff;--bg-input:#f0f2f5;--text-main:#1c1e21;--text-sub:#65676b;--text-muted:#8a8d91;--border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.15)}
body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg-app);color:var(--text-main);overflow:hidden;height:100vh;height:100dvh;transition:background var(--dur-3) ease,color var(--dur-3) ease}
.hidden{display:none!important}
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg-app);padding:20px;overflow-y:auto;height:100vh;height:100dvh}
#loginCard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-3);padding:32px 26px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
#loginCard h1{font-size:22px;text-align:center;margin-bottom:6px}
#loginCard .sub{font-size:13px;text-align:center;color:var(--text-sub);margin-bottom:20px}
.top-controls{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
.lang-select{padding:6px 10px;border-radius:var(--r-1);border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:12px;font-family:inherit;outline:none;cursor:pointer}
.field{margin-bottom:14px}
.field input{width:100%;padding:13px 15px;border-radius:var(--r-1);border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:15px;outline:none;font-family:inherit}
#loginBtn{width:100%;padding:13px;border:none;border-radius:var(--r-1);background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
#loginBtn:disabled{opacity:.6}
#loginError{color:var(--danger);font-size:13px;text-align:center;min-height:18px;margin-bottom:8px;white-space:pre-wrap}
#loginVersion{text-align:center;font-size:11px;color:var(--text-muted);margin-top:14px}
#feedbackToggle{background:transparent;border:none;color:var(--text-sub);font-size:12px;cursor:pointer;font-family:inherit;margin-top:10px;width:100%;text-align:center;padding:8px}
#feedbackToggle:hover{color:var(--text-main)}
#feedbackBox{margin-top:10px;padding:12px;background:var(--bg-input);border-radius:var(--r-1);border:1px solid var(--border)}
#feedbackBox input,#feedbackBox textarea{width:100%;padding:9px 11px;border-radius:var(--r-1);border:1px solid var(--border-strong);background:var(--bg-card);color:var(--text-main);font-size:13px;outline:none;font-family:inherit;margin-bottom:8px}
#feedbackBox textarea{min-height:70px;resize:vertical}
#feedbackBox .fb-btn{width:100%;padding:9px;border:none;border-radius:var(--r-1);background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
#chatScreen{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{background:var(--bg-header);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);flex-shrink:0;min-height:46px}
header .title{font-size:14px;font-weight:600;white-space:nowrap;flex-shrink:0}
header .right{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-sub);flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.ver{background:rgba(56,189,248,.15);color:var(--info);padding:3px 7px;border-radius:var(--r-1);font-size:10.5px;font-weight:600}
.hbtn{background:rgba(148,163,184,.15);color:var(--text-main);border:none;padding:6px 10px;border-radius:var(--r-1);font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;position:relative}
.hbtn:hover{background:rgba(148,163,184,.3)}
@media(max-width:520px){header{padding:6px 8px}header .title{font-size:13px}.hbtn{font-size:11px;padding:5px 8px}}
#noticeBar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(251,191,36,.12);border-bottom:1px solid rgba(251,191,36,.25);flex-shrink:0;font-size:13px;cursor:pointer}
body.theme-light #noticeBar{background:rgba(251,191,36,.15)}
#noticeBar .notice-icon{color:var(--gold);font-size:14px;flex-shrink:0;font-weight:700}
#noticeBar .notice-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#noticeBar .notice-text .label{color:var(--gold);font-weight:600;margin-right:6px}
#noticeBar .notice-add{background:#fbbf24;color:#1c1917;border:none;width:32px;height:32px;border-radius:var(--r-1);font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#noticeBar .notice-pin-count{background:rgba(251,191,36,.3);color:var(--gold);padding:2px 8px;border-radius:var(--r-1);font-size:11px;font-weight:600;flex-shrink:0}
#classStatus{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 12px;background:rgba(30,41,59,.5);border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-sub);flex-shrink:0}
body.theme-light #classStatus{background:rgba(255,255,255,.7)}
#classStatus .online{color:var(--ok-tx);font-weight:600}
#searchBar{display:flex;gap:8px;padding:8px 12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center}
#searchInput{flex:1;padding:8px 12px;border-radius:var(--r-3);border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:13px;outline:none;font-family:inherit}
#chatBox{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg-app);position:relative}
#chatBox::-webkit-scrollbar{width:6px}
#chatBox::-webkit-scrollbar-thumb{background:rgba(148,163,184,.3);border-radius:var(--r-0)}
#scrollToBottomBtn{position:absolute;right:18px;bottom:18px;width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:20;transition:opacity var(--dur-2),transform var(--dur-2);opacity:0;pointer-events:none;transform:translateY(8px)}
#scrollToBottomBtn.show{opacity:1;pointer-events:auto;transform:translateY(0)}
#scrollToBottomBtn:hover{transform:translateY(-2px)}
.msg{max-width:75%;display:flex;gap:10px;align-items:flex-start;position:relative}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;user-select:none;overflow:hidden;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.deleted img,.avatar.deleted{filter:grayscale(100%);opacity:.6}
.bubble-wrap{display:flex;flex-direction:column;gap:3px;position:relative;min-width:0}
.msg.me .bubble-wrap{align-items:flex-end}
.meta{font-size:11px;color:var(--text-muted);padding:0 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta .msgid{color:var(--text-muted);font-size:10px;font-family:monospace}
.meta .class-tag{background:rgba(56,189,248,.18);color:var(--info);padding:1px 5px;border-radius:var(--r-0);font-size:10px;font-weight:600}
.meta .enc-tag{background:rgba(220,38,38,.2);color:var(--warn-tx);padding:1px 6px;border-radius:var(--r-0);font-size:10px;font-weight:600}
.meta .ai-tag{background:rgba(102,204,255,.25);color:var(--ai);padding:1px 6px;border-radius:var(--r-0);font-size:10px;font-weight:700}
.bubble{padding:9px 13px;border-radius:var(--r-2);font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap;color:#fff;max-width:100%}
.msg.me .bubble{border-bottom-right-radius:4px}
.msg:not(.me) .bubble{border-bottom-left-radius:4px}
.bubble .mention{background:rgba(255,255,255,.25);padding:1px 5px;border-radius:var(--r-0);font-weight:600}
.bubble img.msg-img{max-width:220px;max-height:220px;border-radius:var(--r-1);display:block;cursor:pointer;margin-top:4px}
.bubble .file-msg{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.bubble .file-msg .fi{font-size:16px;font-weight:700}
.bubble .file-msg .fn{font-size:13px;word-break:break-all;flex:1}
.bubble .file-msg .fs{font-size:11px;opacity:.8}
.bubble .voice-msg{display:flex;align-items:center;gap:10px;padding:4px 0;cursor:pointer;min-width:120px}
.bubble .voice-msg .vi{font-size:14px;font-weight:700;display:flex;align-items:center}
.voice-msg .vi .ico{width:1.25em;height:1.25em}
.bubble .voice-msg .vt{font-size:13px}
.bubble .voice-msg .vp{flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.bubble .voice-msg .vp>div{height:100%;width:0;background:#fff;transition:width var(--dur-1)}
.bubble .voice-msg .vd{width:8px;height:8px;border-radius:50%;background:#f87171;flex-shrink:0}
.bubble .voice-msg.played .vd{display:none}
.bubble .loc-msg{cursor:pointer;max-width:100%}
.bubble .loc-msg .lm-map{position:relative;width:220px;max-width:100%;aspect-ratio:220/150;height:auto;
  border-radius:var(--r-1);overflow:hidden;background:#222;margin-bottom:6px}
/* 圖磚層固定 220×150 並置中：卡片窄過 220 都只是左右裁邊，正中央仍然是發送位置 */
.bubble .loc-msg .lm-in{position:absolute;left:50%;top:50%;width:220px;height:150px;transform:translate(-50%,-50%)}
.bubble .loc-msg .lm-map .lm-t{position:absolute;width:256px;height:256px;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.bubble .loc-msg .lm-pin{position:absolute;left:50%;top:50%;width:15px;height:15px;margin:-8px 0 0 -8px;border-radius:50%;background:#3b82f6;border:2.5px solid #fff;box-sizing:border-box;box-shadow:0 0 0 1px rgba(15,23,42,.22),0 4px 10px rgba(15,23,42,.35)}
.bubble .loc-msg .lm-label{font-size:12px;display:flex;align-items:center;gap:4px}
.bubble .ai-sponsor{display:block;margin-top:8px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.3);font-size:10.5px;opacity:.75;font-style:italic}
.msg-tools{display:flex;gap:4px;margin-top:2px;opacity:0;flex-wrap:wrap}
.msg:hover .msg-tools{opacity:1}
.msg-tools button{background:rgba(148,163,184,.15);color:var(--text-sub);border:none;padding:2px 7px;border-radius:var(--r-1);font-size:10.5px;cursor:pointer;font-family:inherit}
.msg-tools button:hover{background:rgba(148,163,184,.3);color:var(--text-main)}
.msg-tools button.danger:hover{background:rgba(220,38,38,.3);color:var(--warn-tx)}
/* ═══ v1.36 名冊姓名 + 訊息操作彈窗 ═══
   訊息上不再一直掛著編號、舉報、管理刪除（太亂、也容易被誤按）；
   改成「點一下那則訊息」才彈出來。 */
.meta .meta-realname{margin-left:6px;font-size:10.5px;font-weight:600;color:var(--text-sub);border:1px solid var(--border-strong);border-radius:var(--r-0);padding:0 4px}
.realname-card{background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--r-2);padding:10px 14px;margin:0 0 6px}
.realname-card .rn-row{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.realname-card .rn-row+.rn-row{border-top:1px solid var(--border)}
.realname-card .rn-label{flex:0 0 62px;font-size:12px;color:var(--text-sub)}
.realname-card .rn-val{flex:1;font-size:14px;font-weight:600;color:var(--text-main);word-break:break-word}
.msg[data-msgid]{cursor:pointer}
#msgMenu{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:200}
#msgMenu .mm-card{width:100%;max-width:520px;margin:0 auto;background:var(--bg-card);border-radius:var(--r-3) var(--r-3) 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.4,0,.2,1)}
#msgMenu .mm-head{font-size:13px;font-weight:700;color:var(--text-main);margin-bottom:8px}
#msgMenu .mm-id{font-size:11.5px;font-family:monospace;color:var(--text-sub);background:var(--bg-input);border:1px solid var(--border-strong);border-radius:var(--r-1);padding:8px 10px;margin-bottom:8px;word-break:break-all}
#msgMenu .mm-btn{display:block;width:100%;text-align:left;background:var(--bg-input);border:1px solid var(--border-strong);color:var(--text-main);border-radius:var(--r-2);padding:12px 14px;font-size:14.5px;font-family:inherit;cursor:pointer;margin-top:7px}
#msgMenu .mm-btn:hover{background:rgba(148,163,184,.18)}
#msgMenu .mm-btn.danger{color:var(--warn-tx);border-color:rgba(248,113,113,.4)}
#msgMenu .mm-btn.danger:hover{background:rgba(220,38,38,.18)}
#msgMenu .mm-btn.ghost{background:transparent;color:var(--text-sub)}
.msg-checking{font-size:10.5px;color:var(--gold);padding:2px 6px;font-style:italic}
#inputBar{padding:10px 12px 4px;background:var(--bg-card);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-shrink:0;position:relative;flex-wrap:wrap}
#micBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#micBtn.recording{background:#dc2626;color:#fff}
#msgInput{flex:1;padding:11px 14px;border-radius:var(--r-3);border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:14px;outline:none;font-family:inherit;min-width:0}
#plusBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:22px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#sendBtn{width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#aiRoundBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#aiRoundBtn.on{background:#66ccff;color:#0f172a}
#encToggle{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-sub);padding:4px 8px;border-radius:var(--r-1);border:1px solid var(--border-strong);background:var(--bg-input);cursor:pointer;user-select:none;flex-shrink:0}
#encToggle.active{background:rgba(220,38,38,.2);border-color:#dc2626;color:var(--warn-tx)}
#encToggle input{display:none}
#encToggle .dot-check{width:10px;height:10px;border-radius:50%;border:2px solid var(--border-strong)}
#encToggle.active .dot-check{background:#dc2626;border-color:#dc2626}
#bottomNav{display:flex;background:var(--bg-card);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
#bottomNav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;cursor:pointer;gap:2px;color:var(--text-sub);font-size:11px;border:none;background:none;font-family:inherit;position:relative}
#bottomNav .nav-item:hover{background:rgba(148,163,184,.08);color:var(--text-main)}
#bottomNav .nav-item .nav-icon{font-size:18px;line-height:1}
#bottomNav .nav-item .nav-badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;background:#ef4444;color:#fff;border-radius:var(--r-1);font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
#plusPanel{position:absolute;bottom:calc(100% + 8px);left:12px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--r-3);padding:14px;display:grid;grid-template-columns:repeat(3,72px);gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:50;animation:panelIn .22s cubic-bezier(.4,0,.2,1)}
@keyframes panelIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
#plusPanel .pi{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px;border-radius:var(--r-2)}
#plusPanel .pi:hover{background:rgba(56,189,248,.15)}
#plusPanel .pi .pic{width:44px;height:44px;border-radius:var(--r-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:rgba(56,189,248,.2);color:var(--info)}
.pic .ico{width:22px;height:22px}
#plusPanel .pi .pit{font-size:11px;color:var(--text-sub)}
/* ===== 小遊戲 ===== */
#gamesOverlay{position:fixed;inset:0;background:#0b0d14;z-index:200;animation:panelIn .22s cubic-bezier(.4,0,.2,1)}
#gamesOverlay iframe{width:100%;height:100%;border:0;display:block}
.game-invite{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.28);border-radius:var(--r-2);padding:10px 12px;cursor:pointer}
.game-invite .gi-title{font-size:14.5px;font-weight:700;margin-bottom:3px}
.game-invite .gi-sub{font-size:12px;opacity:.85;margin-bottom:9px}
.game-invite .gi-btn{display:inline-block;background:rgba(255,255,255,.9);color:#0b0d14;font-size:12.5px;font-weight:700;border-radius:var(--r-1);padding:5px 12px}
.game-invite.done{opacity:.55;cursor:default;border-style:dashed}
.game-invite.done .gi-sub{opacity:.9}
.gi-copy{display:block;margin-top:7px;background:transparent;border:1px solid rgba(255,255,255,.32);color:inherit;font-size:11.5px;border-radius:var(--r-1);padding:4px 10px;cursor:pointer;opacity:.9;font-family:inherit}
.gi-copy:active{transform:scale(.96)}
#mentionPopup{position:absolute;bottom:100%;left:12px;right:12px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--r-2);max-height:220px;overflow-y:auto;box-shadow:0 -8px 24px rgba(0,0,0,.5);margin-bottom:6px}
#mentionPopup .mention-item{padding:10px 14px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:10px}
#mentionPopup .mention-item:hover{background:rgba(56,189,248,.15)}
#mentionPopup .mention-item .mi-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden}
#mentionPopup .mention-item .mi-av img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;color:var(--text-muted);padding:40px 0;font-size:14px}
.fullPage{position:fixed;inset:0;background:var(--bg-app);z-index:100;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.fullPage .fp-header{padding:12px 16px;display:flex;align-items:center;gap:12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0}

/* ═══ v1.38.1 小工具用「頁內 iframe」打開，不是跳頁 ═══
   以前用 window.open，手機上被攔就 fallback 去 location.href，整個聊天室被導走；
   在某些內建瀏覽器／WebView 更會彈回個人主頁，而且每次按都再彈一次。
   改成蓋一層 iframe：不導航、不開分頁、聊天室狀態完全唔會掉。 */
.tool-frame{position:fixed;inset:0;z-index:300;background:var(--bg-app);display:flex;flex-direction:column;
  height:100vh;height:100dvh;animation:tfIn .22s var(--ease-out)}
@keyframes tfIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tool-frame .tf-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg-card);
  border-bottom:1px solid var(--border);flex-shrink:0;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.tool-frame .tf-back{background:rgba(148,163,184,.15);color:var(--text-main);border:none;width:38px;height:38px;
  border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tool-frame .tf-back:active{transform:scale(.94)}
.tool-frame .tf-title{font-size:16px;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool-frame .tf-open{background:none;border:1px solid var(--border);color:var(--text-sub);border-radius:10px;
  padding:7px 10px;font-size:12px;cursor:pointer;font-family:inherit;flex-shrink:0}
.tool-frame .tf-body{flex:1;min-height:0;position:relative;background:var(--bg-app)}
.tool-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.tool-frame .tf-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--text-sub);font-size:13px;letter-spacing:.5px;pointer-events:none;transition:opacity .25s}
.tool-frame.ready .tf-load{opacity:0}
/* ═══ v1.12 進退場動畫 ═══
   安卓版每次離開畫面都有轉場，網頁版原本是「啪」一聲直接消失。
   這裡把所有會離開畫面的東西都補上動畫：頁面向右滑走、上一層從左邊推回來。 */
@keyframes pageOutRight{from{opacity:1;transform:none}to{opacity:.28;transform:translateX(62%) scale(.94)}}
@keyframes pageInRight{from{opacity:0;transform:translateX(34%) scale(.975)}to{opacity:1;transform:none}}
@keyframes pageInLeft{from{opacity:.45;transform:translateX(-24%) scale(.955)}to{opacity:1;transform:none}}
@keyframes ovOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.04)}}
@keyframes ovIn{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
@keyframes barIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
@keyframes barOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(22px) scale(.95)}}
@keyframes zoomOutImg{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.87)}}
@keyframes panelOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(8px) scale(.95)}}
@keyframes notifIn{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes notifOut{from{opacity:1;transform:translateX(-50%) translateY(0)}to{opacity:0;transform:translateX(-50%) translateY(-12px)}}
.anim-in-page{animation:pageInRight .34s cubic-bezier(.32,.72,0,1) both}
.anim-in-back{animation:pageInLeft .34s cubic-bezier(.32,.72,0,1) both}
.anim-in-modal{animation:ovIn .26s cubic-bezier(.32,.72,0,1) both}
.anim-in-bar{animation:barIn .26s cubic-bezier(.32,.72,0,1) both}
.anim-in-notif{animation:notifIn .24s cubic-bezier(.32,.72,0,1) both}
/* 退場一律加 !important，也一律排在進場之後：
   否則同一個元素同時掛著進場與退場 class 時，會由「樣式表順序」而不是「後加的 class」決定，
   進場動畫會蓋掉退場動畫（#plusPanel 這種 ID 選擇器更是直接壓過 class）。
   這些 class 只存在幾百毫秒，用完就移除，用 !important 沒有副作用。 */
.anim-out-page{animation:pageOutRight .3s cubic-bezier(.32,.72,0,1) forwards!important;will-change:transform,opacity;pointer-events:none!important}
.anim-out-overlay{animation:ovOut .2s ease forwards!important;pointer-events:none!important}
.anim-out-modal{animation:ovOut .24s cubic-bezier(.32,.72,0,1) forwards!important;pointer-events:none!important}
.anim-out-bar{animation:barOut .22s cubic-bezier(.32,.72,0,1) forwards!important;pointer-events:none!important}
.anim-out-zoom{animation:zoomOutImg .2s ease forwards!important;pointer-events:none!important}
.anim-out-panel{animation:panelOut .16s ease forwards!important;pointer-events:none!important}
.anim-out-notif{animation:notifOut .22s ease forwards!important;pointer-events:none!important}
@media (prefers-reduced-motion: reduce){
  .anim-out-page,.anim-in-page,.anim-in-back,.anim-out-overlay,.anim-out-modal,.anim-in-modal,
  .anim-out-bar,.anim-in-bar,.anim-out-zoom,.anim-out-panel,.anim-in-notif,.anim-out-notif{animation-duration:.01ms!important}
}

.admin-feedback .af-status{font-size:11px;padding:3px 8px;border-radius:var(--r-1);font-weight:700}
.admin-feedback .af-status.pending{background:rgba(251,191,36,.25);color:var(--gold)}
.admin-feedback .af-status.processing{background:rgba(59,130,246,.25);color:#60a5fa}
.admin-feedback .af-status.done{background:rgba(74,222,128,.25);color:var(--ok-tx)}
.admin-feedback .af-body{font-size:13px;line-height:1.6;color:var(--text-main);padding:10px;background:rgba(0,0,0,.15);border-radius:var(--r-1);margin-top:8px;word-break:break-word}
.admin-feedback .af-time{font-size:11px;color:var(--text-muted);margin-top:6px}
.admin-feedback .af-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.admin-feedback .af-actions button{flex:1;min-width:80px;padding:8px;border:none;border-radius:var(--r-1);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
/* ===== v1.10 錄音遮罩 ===== */
#recordingOverlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;backdrop-filter:blur(2px);animation:fadeInOv .18s ease}
#recordingOverlay .rec-timer{font-size:52px;font-weight:700;font-family:Consolas,monospace;letter-spacing:2px}
#recordingOverlay .rec-wave{display:flex;align-items:flex-end;gap:4px;height:46px;margin-top:18px}
#recordingOverlay .rec-wave span{width:5px;border-radius:var(--r-0);background:#f87171;animation:recWave 1s ease-in-out infinite}
#recordingOverlay .rec-wave span:nth-child(1){animation-delay:0s}
#recordingOverlay .rec-wave span:nth-child(2){animation-delay:.1s}
#recordingOverlay .rec-wave span:nth-child(3){animation-delay:.2s}
#recordingOverlay .rec-wave span:nth-child(4){animation-delay:.3s}
#recordingOverlay .rec-wave span:nth-child(5){animation-delay:.4s}
#recordingOverlay .rec-hint{font-size:14px;margin-top:20px;opacity:.85}
#recordingOverlay .rec-hint .rec-cancel-tip{color:var(--warn-tx);font-weight:700}
#recordingOverlay.cancel .rec-wave span{background:#94a3b8}
#recordingOverlay.cancel .rec-timer{color:var(--warn-tx)}
@keyframes recWave{0%,100%{height:8px}50%{height:40px}}
@keyframes fadeInOv{from{opacity:0}to{opacity:1}}
/* ===== v1.10 公告輪播 ===== */
#noticeFullscreen .car-stage{flex:1;min-height:0;display:flex;align-items:center;overflow-x:auto;scroll-snap-type:x mandatory;gap:16px;padding:20px 12vw;scrollbar-width:none}
#noticeFullscreen .car-stage::-webkit-scrollbar{display:none}
#noticeFullscreen .car-card{flex:0 0 70vw;max-width:520px;background:var(--bg-card);color:var(--text-main);border-radius:var(--r-3);padding:20px;scroll-snap-align:center;overflow-y:auto;max-height:75vh;border:1px solid var(--border);box-shadow:0 8px 30px rgba(0,0,0,.25);transform:scale(.92);opacity:.55;transition:transform var(--dur-3) cubic-bezier(.4,0,.2,1),opacity var(--dur-3) ease}
#noticeFullscreen .car-card.active{transform:scale(1);opacity:1}
#noticeFullscreen .car-card h3{font-size:15px;color:var(--gold);margin-bottom:10px}
#noticeFullscreen .car-card .car-content{font-size:14px;line-height:1.7;word-break:break-word}
#noticeFullscreen .car-actions{padding:14px 20px;border-top:1px solid var(--border);background:var(--bg-card);display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}
#noticeFullscreen .car-actions button{flex:1;min-width:100px;padding:10px;border-radius:var(--r-1);border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
#noticeFullscreen .car-progress{text-align:center;font-size:12px;color:var(--text-sub);padding:8px 0}
#noticeFullscreen .car-nav{display:flex;justify-content:center;gap:10px;padding:0 0 6px}
#noticeFullscreen .car-nav button{background:rgba(148,163,184,.18);color:var(--text-main);border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;font-family:inherit}
#noticeFullscreen .car-nav button:hover{background:rgba(148,163,184,.35)}
/* ===== v1.10 投票 ===== */
.poll-box{min-width:min(240px,100%);max-width:100%;display:flex;flex-direction:column;gap:10px}
.poll-title{font-size:16px;font-weight:700;line-height:1.4;word-break:break-word}
.poll-options{display:flex;flex-direction:column;gap:8px}
.poll-opt{position:relative;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-1);background:rgba(255,255,255,.12);cursor:pointer;overflow:hidden;user-select:none;transition:background var(--dur-2) ease}
.poll-opt:hover{background:rgba(255,255,255,.2)}
.poll-opt.disabled{cursor:default}
.poll-opt.disabled:hover{background:rgba(255,255,255,.12)}
.poll-opt .poll-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.22);width:0;transition:width var(--dur-3) cubic-bezier(.4,0,.2,1);z-index:0}
.poll-opt .poll-circle{position:relative;z-index:1;width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.7);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.poll-opt .poll-square{position:relative;z-index:1;width:18px;height:18px;border-radius:var(--r-0);border:2px solid rgba(255,255,255,.7);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.poll-opt.selected .poll-circle,.poll-opt.selected .poll-square{background:#fff;border-color:#fff;color:#1c1e21}
.poll-opt .poll-text{position:relative;z-index:1;flex:1;font-size:13.5px;line-height:1.4;word-break:break-word}
.poll-opt .poll-pct{position:relative;z-index:1;font-size:12px;font-weight:700;opacity:.95;flex-shrink:0}
.poll-footer{font-size:11.5px;opacity:.85;display:flex;flex-direction:column;gap:3px}
.poll-end{color:var(--warn-tx);font-weight:600}
.poll-confirm{background:rgba(255,255,255,.9);color:#1c1e21;border:none;padding:7px 12px;border-radius:var(--r-1);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;align-self:flex-start}
body.theme-light .poll-opt{background:rgba(0,0,0,.06)}
body.theme-light .poll-opt:hover{background:rgba(0,0,0,.1)}
body.theme-light .poll-opt .poll-fill{background:rgba(59,130,246,.22)}
body.theme-light .poll-opt .poll-circle,body.theme-light .poll-opt .poll-square{border-color:rgba(0,0,0,.35);color:#1c1e21}
body.theme-light .poll-opt.selected .poll-circle,body.theme-light .poll-opt.selected .poll-square{background:#3b82f6;border-color:#3b82f6;color:#fff}
body.theme-light .poll-confirm{background:#3b82f6;color:#fff}
/* ===== 痕跡地圖（網頁版） ===== */
#trailMapScreen{position:fixed;inset:0;background:var(--bg-app);z-index:360;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
#trailMapScreen .tm-header{padding:12px 16px;display:flex;align-items:center;gap:12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0}
#trailMapScreen .tm-back{background:rgba(148,163,184,.15);color:var(--text-main);border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
#trailMapScreen .tm-title{font-size:16px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#trailMapScreen .tm-body{position:relative;flex:1;min-height:0;overflow:hidden;background:#0e1016;touch-action:none;cursor:grab}
#trailMapScreen .tm-body.dragging{cursor:grabbing}
#trailMapScreen canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#trailMapScreen .tm-actions{position:absolute;right:12px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:5}
#trailMapScreen .tm-btn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(24,27,35,.9);color:#e8ecf3;font-size:16px;line-height:1;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#trailMapScreen .tm-btn:active{transform:scale(.94)}
#trailMapScreen .tm-btn.on{background:#3b82f6;border-color:#3b82f6;color:#fff}
#trailMapScreen .tm-info{position:absolute;left:12px;bottom:16px;max-width:60%;padding:8px 12px;border-radius:var(--r-2);background:rgba(24,27,35,.9);color:var(--text-sub);font-size:12px;line-height:1.55;z-index:5;border:1px solid rgba(255,255,255,.1)}
#trailMapScreen .tm-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:30px;color:var(--text-sub);font-size:13.5px;z-index:6;pointer-events:none}
#trailMapScreen .tm-empty b{font-size:15px;color:#fff}

/* v1.35 圖標系統：內嵌 SVG，24×24、stroke 2、顏色跟著文字（來源風格 Reicon.dev／Lucide，MIT） */
.ico{width:1.15em;height:1.15em;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
.ico-lg{width:1.5em;height:1.5em;vertical-align:-.3em}
.wc-ico .ico{width:1.05em;height:1.05em;vertical-align:-.14em}
.nav-icon .ico{width:1.25em;height:1.25em;vertical-align:0}

/* v1.37 積分系統：預留欄位，只顯示 users/{u}/points（沒有加減方法，所有人都是 0）
   ---------------------------------------------------------------------------
   以前手機版是另一顆 position:fixed 的 chip（right:12px;bottom:78px），
   它正好疊在輸入列的「送出」按鈕上 —— elementFromPoint 問下去回傳的是 scoreBottom，
   也就是說手機版根本按不到送出。現在只留標題列那一顆（桌機／手機都是它）：
   標題列本來就會 flex-wrap，擠不下時整組換行，不會蓋住任何按鈕。 */
.score-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;
  font-size:12px;font-weight:600;color:var(--gold);background:rgba(226,176,74,.12);
  border:1px solid rgba(226,176,74,.3);vertical-align:middle;flex:0 0 auto;white-space:nowrap}
.score-chip .ico{width:1.05em;height:1.05em}
/* 舊的手機版浮動 chip：保留節點（只加不刪），但永遠不顯示 */
.score-chip-fixed{display:none !important}
@media (max-width:600px){.score-chip{font-size:11px;padding:2px 7px}}

/* v1.36 版本資訊簡化：一行摘要 + 更早的只留版本號 */
.version-item .vi-sum{font-size:13px;color:var(--text-sub);margin-top:2px}
.version-item.old{opacity:.55;padding:6px 0}
.version-item.old .vi-head{margin-bottom:0}

/* v1.41 版本資訊：網頁版 / 安卓版兩個分頁，完整歷史不再藏起來 */
.vertabs{display:flex;gap:8px;margin-bottom:10px}
.vtab{flex:1;padding:10px;border-radius:var(--r-2);border:1px solid var(--border);background:var(--bg-input);color:var(--text-sub);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:background var(--dur-2),color var(--dur-2),border-color var(--dur-2)}
.vtab.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.vtab .vcn{font-size:11px;font-weight:600;opacity:.75;margin-left:6px}
.verhint{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--text-muted);margin-bottom:10px;line-height:1.5}
.vlink{background:none;border:none;padding:4px 2px;color:var(--info);font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;flex:none}
.vitem{cursor:pointer}
.vitem .vi-arrow{color:var(--text-muted);font-size:10px;opacity:.85;flex:none;transition:transform var(--dur-2)}
.vitem.open .vi-arrow{transform:rotate(90deg)}
.vitem.open{border-color:var(--border-strong,#3a4256)}
.vitem .vi-changes li{margin:3px 0}
.vernow{padding:12px 14px;border-radius:var(--r-2);background:var(--bg-input);border:1px solid var(--border);margin-bottom:10px}
.vernow .vn-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vernow .vn-ver{font-size:15px;font-weight:700;color:var(--ok-tx)}
.vernow .vn-meta{font-size:11.5px;color:var(--text-muted);margin-top:4px}
.vload{padding:24px 0;text-align:center;color:var(--text-muted);font-size:13px}
/* v1.37 聊天室往前翻頁：
   以前主聊天室只讀最新 300 則，又沒有入口往前翻，所以更早的訊息一則都看不到。 */
.earlier-btn{display:block;width:100%;margin:2px 0 12px;padding:9px 0;border:1px solid var(--border);background:var(--bg-input);color:var(--text-sub);font-size:12.5px;font-family:inherit;border-radius:999px;cursor:pointer;transition:background var(--dur-2) var(--ease-out),color var(--dur-2) var(--ease-out)}
.earlier-btn:hover{background:var(--bg-card);color:var(--text-main)}
.earlier-btn:active{transform:scale(.985)}
.earlier-done{margin:2px 0 12px;padding:7px 0;text-align:center;color:var(--text-muted);font-size:11.5px}

/* v1.36 視訊通話（Jitsi）：全頁 iframe + 通話紀錄樣式 */
.vcPage{display:flex;flex-direction:column;height:100%}
.vcBody{flex:1;display:flex;flex-direction:column;padding:0;min-height:0}
.vcFrame{flex:1;width:100%;border:0;background:#000;min-height:0}
.vcHint{display:flex;align-items:center;gap:6px;padding:9px 14px;font-size:12.5px;color:var(--text-sub);
  background:var(--bg-card);border-top:1px solid var(--border)}
.vcBadge{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ok-tx);
  background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.3);border-radius:999px;padding:2px 9px}
.vcDot{width:7px;height:7px;border-radius:50%;background:var(--ok-tx);animation:vcPulse 1.6s ease-in-out infinite}
@keyframes vcPulse{0%,100%{opacity:1}50%{opacity:.35}}
.callChip{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.callChip .ico{width:1.1em;height:1.1em}

/* ═══════════════════════════════════════════════════════════════
   v1.37 視訊通話：我們自己畫的介面（原生 WebRTC，不再用 Jitsi 那套 iframe UI）
   ═══════════════════════════════════════════════════════════════ */
.vcStage{flex:1;min-height:0;display:grid;gap:8px;padding:8px;align-content:center;
  grid-auto-rows:minmax(0,1fr);overflow:hidden;background:#080a10}
.vcTile{position:relative;min-height:0;border-radius:var(--r-2);overflow:hidden;background:#11141d;
  border:1px solid rgba(255,255,255,.07);transition:box-shadow var(--dur-2),border-color var(--dur-2)}
.vcTile video{width:100%;height:100%;object-fit:cover;display:block;background:#11141d}
.vcTile.mirror video{transform:scaleX(-1)}
.vcTile.speaking{border-color:var(--ok-tx);box-shadow:0 0 0 2px rgba(74,222,128,.55),0 0 18px rgba(74,222,128,.25)}
.vcTile.off video{opacity:.12}
.vcTile .vcTileName{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);
  display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#fff;
  background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border-radius:var(--r-1);padding:3px 8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcTile .vcTileName .chi{font-weight:500;opacity:.85;font-size:11px}
.vcTile .vcTileIcons{position:absolute;right:8px;top:8px;display:flex;gap:5px}
.vcTile .vcTileIcons span{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff}
.vcTile .vcTileIcons .muted{background:rgba(220,38,38,.85)}
.vcTile .vcTileIcons .ico{width:14px;height:14px}
.vcTile .vcOffAvatar{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  font-size:34px;font-weight:800;color:#fff;opacity:.9}
.vcTile.off .vcOffAvatar{display:flex}
.vcTile .vcFlip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;color:#fff;background:rgba(0,0,0,.65);text-align:center;padding:10px}
.vcCtrl{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--bg-card);border-top:1px solid var(--border)}
.vcBtn{width:52px;height:52px;border-radius:50%;border:1px solid var(--border-strong);background:var(--bg-input);
  color:var(--text-main);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
  transition:transform var(--dur-1),background var(--dur-1)}
.vcBtn:active{transform:scale(.92)}
.vcBtn .ico{width:22px;height:22px}
.vcBtn.on{background:var(--accent);border-color:var(--accent);color:#0b0d14}
.vcBtn.muted{background:rgba(220,38,38,.9);border-color:rgba(220,38,38,.9);color:#fff}
.vcBtn.hang{width:64px;background:var(--red);border-color:var(--red);color:#fff}
.vcBtn[disabled]{opacity:.4;pointer-events:none}
.vcSelfPip{position:absolute;right:10px;bottom:10px;width:96px;height:132px;border-radius:var(--r-2);
  overflow:hidden;border:2px solid rgba(255,255,255,.25);background:#000;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.vcSelfPip video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.vcStage.solo .vcSelfPip{display:none}
.vcGridCount{font-size:12px;color:var(--text-sub);white-space:nowrap}
/* ═══════════════════════════════════════════════════════════════
   v1.37 私人群聊：功能對齊公共聊天室（唯一沒有小遊戲）
   ═══════════════════════════════════════════════════════════════ */
#privateChatScreen .pc-input-bar{position:relative}
#privateChatScreen .pc-input-bar button.gp-btn{width:42px;height:42px;border-radius:50%;border:none;
  background:rgba(148,163,184,.15);color:var(--text-main);font-size:22px;font-weight:400;cursor:pointer;flex:0 0 auto}
#privateChatScreen .pc-input-bar button.gp-btn:hover{background:rgba(148,163,184,.3)}
#privateChatScreen .pc-input-bar button.gp-btn.on{background:var(--accent);color:#0b0d14}
#privateChatScreen .pc-input-bar button.gp-mic{font-size:12px;font-weight:700}
#privateChatScreen .pc-input-bar button.gp-mic.recording{background:#dc2626;color:#fff}
#groupPlus{position:absolute;bottom:calc(100% + 8px);left:12px;background:var(--bg-card);border:1px solid var(--border-strong);
  border-radius:var(--r-3);padding:12px;display:grid;grid-template-columns:repeat(3,70px);gap:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:60;animation:panelIn .22s cubic-bezier(.4,0,.2,1)}
#groupPlus .pi{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px;border-radius:var(--r-2)}
#groupPlus .pi:hover{background:rgba(56,189,248,.15)}
#groupPlus .pi .pic{width:42px;height:42px;border-radius:var(--r-2);display:flex;align-items:center;justify-content:center;background:rgba(56,189,248,.2);color:var(--info)}
#groupPlus .pi .pic .ico{width:22px;height:22px}
#groupPlus .pi .pit{font-size:11px;color:var(--text-sub);white-space:nowrap}
#groupNoticeBar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(251,191,36,.12);
  border-bottom:1px solid rgba(251,191,36,.25);font-size:12.5px;color:var(--text-main);flex-shrink:0}
body.theme-light #groupNoticeBar{background:rgba(251,191,36,.16)}
#groupNoticeBar .gn-ico{color:var(--gold);flex-shrink:0;display:flex}
#groupNoticeBar .gn-ico .ico{width:1.1em;height:1.1em}
#groupNoticeBar .gn-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#groupNoticeBar .gn-edit{background:rgba(251,191,36,.25);border:1px solid rgba(251,191,36,.45);color:var(--gold);
  border-radius:var(--r-1);padding:3px 9px;font-size:11.5px;cursor:pointer;font-family:inherit;flex:0 0 auto}
#groupSubPage{position:fixed;inset:0;background:var(--bg-app);z-index:150;display:flex;flex-direction:column;height:100vh;height:100dvh}
#groupSubPage .gsp-header{padding:12px 16px;display:flex;align-items:center;gap:12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0}
#groupSubPage .gsp-back{background:rgba(148,163,184,.15);color:var(--text-main);border:none;width:38px;height:38px;
  border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
#groupSubPage .gsp-title{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#groupSubPage .gsp-body{flex:1;min-height:0;overflow-y:auto;padding:16px}
/* v1.37 AI 私人聊天：待送出圖片的預覽條 */
#aiPrivateImgPreview{display:none;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-card);border-top:1px solid var(--border);flex-shrink:0}
#aiPrivateImgPreview.show{display:flex}
#aiPrivateImgPreview img{width:54px;height:54px;object-fit:cover;border-radius:var(--r-1);border:1px solid var(--border-strong);cursor:pointer}
#aiPrivateImgPreview .aip-text{flex:1;min-width:0;font-size:12px;color:var(--text-sub)}
#aiPrivateImgPreview .aip-clear{background:rgba(220,38,38,.18);border:1px solid rgba(248,113,113,.4);color:var(--warn-tx);
  border-radius:var(--r-1);padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;flex:0 0 auto;width:auto;height:auto}
/* ═══ v1.38 遠端配置 ═══ */
.is-off{opacity:.42;filter:grayscale(.65)}
.pi.is-off,.nav-item.is-off{position:relative}
.off-tag{position:absolute;top:0;right:2px;background:#f87171;color:#fff;font-size:9px;font-weight:700;
  padding:1px 5px;border-radius:6px;line-height:1.45;pointer-events:none;z-index:4;letter-spacing:.5px;
  box-shadow:0 1px 5px rgba(0,0,0,.4)}
#remoteNotice{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:9000;
  max-width:min(94vw,700px);display:flex;align-items:flex-start;gap:10px;padding:9px 13px;
  border-radius:12px;font-size:13px;line-height:1.55;box-shadow:0 10px 30px rgba(0,0,0,.35);
  animation:rnIn .26s cubic-bezier(.22,1,.36,1);backdrop-filter:blur(8px)}
/* 聊天室入面就唔浮動，直接排喺標題列下面，唔會蓋住任何東西 */
#chatScreen > #remoteNotice{position:relative;left:auto;top:auto;transform:none;margin:8px 10px 0;
  max-width:none;box-shadow:0 4px 16px rgba(0,0,0,.18);animation:rnIn2 .26s cubic-bezier(.22,1,.36,1)}
@keyframes rnIn2{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes rnIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
#remoteNotice.rn-info{background:rgba(56,189,248,.18);border:1px solid rgba(56,189,248,.5);color:#7dd3fc}
#remoteNotice.rn-warn{background:rgba(251,191,36,.18);border:1px solid rgba(251,191,36,.55);color:#fcd34d}
#remoteNotice.rn-danger{background:rgba(248,113,113,.18);border:1px solid rgba(248,113,113,.55);color:#fca5a5}
body.theme-light #remoteNotice.rn-info{background:#e0f2fe;color:#075985;border-color:#7dd3fc}
body.theme-light #remoteNotice.rn-warn{background:#fef3c7;color:#92400e;border-color:#fcd34d}
body.theme-light #remoteNotice.rn-danger{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
#remoteNotice .rn-txt{flex:1;word-break:break-word}
#remoteNotice .rn-x{background:none;border:none;color:inherit;font-size:17px;line-height:1;cursor:pointer;
  opacity:.65;padding:1px 3px;font-family:inherit;flex:0 0 auto}
#remoteNotice .rn-x:hover{opacity:1}
.paused{display:flex;flex-direction:column;align-items:center;text-align:center;padding:46px 14px 24px;gap:10px}
.paused-ico{width:66px;height:66px;border-radius:22px;display:grid;place-items:center;
  background:rgba(248,113,113,.13);color:#f87171;margin-bottom:4px}
.paused-ico .ico{width:30px;height:30px}
.paused-t{font-size:17.5px;font-weight:700}
.paused-s{font-size:13px;color:var(--text-sub);line-height:1.75;max-width:310px}
.paused .btn-primary{margin-top:16px;width:200px}
.rc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;
  border:1px solid var(--border);border-radius:var(--r-2);background:var(--bg-card);margin-bottom:8px}
.rc-row .rc-n{font-size:13.5px;font-weight:650}
.rc-row .rc-note{font-size:11.5px;color:var(--text-sub);margin-top:2px;line-height:1.5}
.rc-sw{width:46px;height:26px;border-radius:13px;border:none;background:#334155;position:relative;
  cursor:pointer;flex:0 0 auto;transition:background .2s;padding:0}
.rc-sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:transform .2s}
.rc-sw.on{background:var(--primary)}
.rc-sw.on::after{transform:translateX(20px)}
.rc-inp{width:100%;padding:9px 11px;border-radius:var(--r-1);border:1px solid var(--border-strong);
  background:var(--bg-input);color:var(--text-main);font-size:12.5px;font-family:inherit;outline:none}

/* ═══ v1.38 小工具專區 ═══════════════════════════════════════════════
   入口在個人主頁（沿用 .about-item 的長相，只把 icon 換成本站主色），
   點進去是一個獨立頁面，列出所有小工具卡片。 */
.tool-entry{position:relative}
.ai-icon.te{background:color-mix(in srgb,var(--primary) 17%,transparent);color:var(--primary)}
.tools-wrap{padding:2px 0 10px}
.tools-lead{font-size:12.5px;color:var(--text-sub);line-height:1.7;margin:0 2px 14px}
.tools-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tool-card{position:relative;display:flex;align-items:center;gap:13px;padding:15px;
  border-radius:var(--r-3);background:var(--bg-input);border:1px solid var(--border);
  text-decoration:none;color:inherit;overflow:hidden;
  transition:transform var(--dur-2) var(--ease-out),border-color var(--dur-2),background var(--dur-2)}
.tool-card::before{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(130px 100px at 92% 0%,color-mix(in srgb,var(--tc,var(--primary)) 15%,transparent),transparent 72%)}
.tool-card:hover{border-color:var(--border-strong)}
.tool-card:active{transform:scale(.982)}
.tool-ico{width:46px;height:46px;flex:0 0 auto;border-radius:var(--r-2);display:grid;place-items:center;
  background:color-mix(in srgb,var(--tc,var(--primary)) 15%,transparent);color:var(--tc,var(--primary))}
.tool-ico .ico{width:23px;height:23px}
.tool-tx{flex:1 1 auto;min-width:0;display:block}
.tool-t{display:block;font-size:14.5px;font-weight:700;letter-spacing:.2px}
.tool-s{display:block;font-size:11.5px;color:var(--text-sub);line-height:1.55;margin-top:3px}
.tool-go{flex:0 0 auto;color:var(--text-muted);display:grid;place-items:center}
.tool-go .ico{width:16px;height:16px}
.tools-foot{font-size:11.5px;color:var(--text-muted);line-height:1.65;margin:16px 2px 0}
.tools-empty{padding:38px 16px;text-align:center;font-size:13px;color:var(--text-sub);
  background:var(--bg-input);border:1px dashed var(--border-strong);border-radius:var(--r-3)}

/* ═══ v1.38 位置全螢幕地圖（自繪圖磚） ═══════════════════════════════ */
.loc-full{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;background:#0b1220}
.lf-head{display:flex;align-items:center;gap:10px;padding:11px 12px;flex:0 0 auto;
  background:#16203a;color:#fff;padding-top:calc(11px + env(safe-area-inset-top,0px))}
.lf-back{width:36px;height:36px;flex:0 0 auto;border:none;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff}
.lf-back .ico{width:18px;height:18px}
.lf-coord{flex:1 1 auto;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.lf-btn{flex:0 0 auto;padding:7px 12px;border-radius:var(--r-1);font-size:12.5px;font-weight:600;
  color:#fff;text-decoration:none;background:rgba(255,255,255,.14)}
.lf-stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
  background:#dfe6ec;touch-action:none;cursor:grab}
.lf-stage:active{cursor:grabbing}
.lf-canvas{display:block;position:absolute;left:0;top:0}
.lf-pin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);
  pointer-events:none;display:grid;place-items:center;transition:opacity .2s}
.lf-pin i{display:block;width:17px;height:17px;border-radius:50%;background:#3b82f6;
  border:3px solid #fff;box-sizing:border-box;
  box-shadow:0 0 0 1px rgba(15,23,42,.2),0 6px 16px rgba(59,130,246,.45)}
.lf-pin::before{content:'';position:absolute;width:44px;height:44px;border-radius:50%;
  background:rgba(59,130,246,.16);animation:lfPulse 2.4s var(--ease-inout) infinite}
@keyframes lfPulse{0%,100%{transform:scale(.72);opacity:.55}50%{transform:scale(1);opacity:.12}}
.lf-attr{position:absolute;right:8px;bottom:8px;font-size:10px;color:#475569;
  background:rgba(255,255,255,.75);padding:1px 6px;border-radius:5px;pointer-events:none}

/* ═══ v1.38 全班共享地圖 ═════════════════════════════════════════════ */
.live-title{flex:1 1 auto;min-width:0;font-size:14.5px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-count{flex:0 0 auto;font-size:11.5px;color:#93c5fd;font-weight:600;
  background:rgba(147,197,253,.14);padding:3px 9px;border-radius:20px;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.live-bar{display:flex;align-items:center;gap:10px;padding:9px 12px;flex:0 0 auto;
  background:#131c33;border-bottom:1px solid rgba(148,163,184,.14)}
.live-bar-lb{font-size:11.5px;color:#94a3b8;flex:0 0 auto}
.lvm-group{display:flex;flex:1 1 auto;background:rgba(15,23,42,.55);border-radius:11px;padding:3px;gap:3px}
.lvm{flex:1 1 0;border:none;background:transparent;color:#94a3b8;font-family:inherit;
  font-size:12.5px;font-weight:650;padding:7px 6px;border-radius:9px;cursor:pointer;
  transition:background var(--dur-2),color var(--dur-2),transform var(--dur-1)}
.lvm.on{background:rgba(59,130,246,.92);color:#fff;box-shadow:0 2px 10px rgba(37,99,235,.4)}
.lvm:active{transform:scale(.97)}
.live-pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lmk{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.lmk-dot{position:absolute;left:0;top:0;width:17px;height:17px;margin:-8.5px 0 0 -8.5px;
  border-radius:50%;background:var(--c,#3b82f6);border:3px solid #fff;box-sizing:border-box;
  box-shadow:0 2px 9px rgba(15,23,42,.42)}
.lmk.is-me .lmk-dot{box-shadow:0 0 0 3px rgba(255,255,255,.55),0 2px 12px rgba(15,23,42,.5)}
.lmk.is-me .lmk-dot::after{content:'';position:absolute;inset:-9px;border-radius:50%;
  border:2px solid var(--c,#3b82f6);opacity:.55;animation:lwPing 2.2s var(--ease-out) infinite}
@keyframes lwPing{0%{transform:scale(.5);opacity:.6}100%{transform:scale(1.5);opacity:0}}
.lmk-nm{position:absolute;left:0;top:12px;transform:translateX(-50%);white-space:nowrap;
  font-size:10.5px;font-weight:700;color:#0f172a;background:rgba(255,255,255,.9);
  padding:1.5px 6px;border-radius:7px;box-shadow:0 1px 5px rgba(15,23,42,.22)}
.live-tip{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);
  font-size:11px;color:#334155;background:rgba(255,255,255,.82);padding:5px 12px;
  border-radius:20px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 10px rgba(15,23,42,.14)}
.live-deny{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;text-align:center;padding:26px;
  background:linear-gradient(180deg,#0b1220,#16203a);animation:lwIn .3s var(--ease-out) both}
.live-deny-ico{width:70px;height:70px;border-radius:24px;display:grid;place-items:center;
  background:rgba(248,113,113,.14);color:#f87171}
.live-deny-ico .ico{width:30px;height:30px}
.live-deny-t{font-size:16px;font-weight:700;color:#f8fafc}
.live-deny-s{font-size:12.5px;color:#94a3b8;line-height:1.7;max-width:300px}

/* ═══ v1.38 發送位置：等待動畫 + 剛發出的標記掉落 ═══════════════════ */
.loc-wait{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1200;
  display:flex;align-items:center;gap:13px;padding:15px 22px 15px 18px;
  border-radius:18px;pointer-events:none;
  background:color-mix(in srgb,var(--bg-card) 94%,transparent);
  border:1px solid var(--border-strong);
  box-shadow:0 20px 55px rgba(2,6,23,.5);
  color:var(--text-main);font-size:13.5px;font-weight:650;
  animation:lwIn .26s var(--ease-out) both}
.loc-wait.lw-out{animation:lwOut .19s var(--ease-inout) both}
@keyframes lwIn{from{opacity:0;transform:translate(-50%,-46%) scale(.94)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes lwOut{from{opacity:1;transform:translate(-50%,-50%) scale(1)}
  to{opacity:0;transform:translate(-50%,-54%) scale(.96)}}
.lw-ico{position:relative;width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;
  color:var(--primary)}
.lw-ico .ico{width:20px;height:20px;position:relative;z-index:2}
.lw-ico::before,.lw-ico::after{content:'';position:absolute;inset:0;border-radius:50%;
  border:2px solid currentColor;opacity:.5;animation:lwRipple 1.7s var(--ease-out) infinite}
.lw-ico::after{animation-delay:.85s}
@keyframes lwRipple{0%{transform:scale(.45);opacity:.7}100%{transform:scale(1.55);opacity:0}}
.lw-tx{line-height:1.4}
.loc-msg.loc-new .lm-map{animation:locBox .34s var(--ease-out) both}
@keyframes locBox{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.loc-msg.loc-new .lm-pin{animation:locDrop .62s var(--ease-out) both}
@keyframes locDrop{0%{opacity:0;transform:translateY(-16px) scale(.3)}
  55%{opacity:1;transform:translateY(0) scale(1.25)}
  100%{opacity:1;transform:translateY(0) scale(1)}}
</style>

  try{
    const a=new Uint8Array(18);crypto.getRandomValues(a);
    return Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').slice(0,24);
  }catch(e){
    let s='';for(let i=0;i<24;i++)s+='abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random()*36)];
    return s;
  }
}
async function createLoginToken(username,password){
  const token=randomToken();
  await set(ref(db,TOKEN_NODE+'/'+token),{u:username,p:password,exp:Date.now()+LOGIN_TOKEN_TTL,by:(me?me.username:'?'),at:Date.now()});
  return token;
}
async function consumeLoginToken(token){
  if(!token)return false;
  try{
    const snap=await get(child(ref(db),TOKEN_NODE+'/'+token));
    if(!snap.exists())return false;
    const t=snap.val()||{};
    if(!t.u||!t.p)return false;
    if(!t.exp||Date.now()>t.exp)return false;   // 過期
    if(t.usedAt)return false;                   // 已經被用掉，這條連結作廢
    await update(ref(db,TOKEN_NODE+'/'+token),{usedAt:Date.now()});
    try{await ensureAIUser();}catch(e){}
    await handleLogin(t.u,t.p);
    return true;
  }catch(e){return false;}
}
/* 把過期與用過的權杖清掉，免得一直堆在資料庫。失敗就算了，不影響登入。 */
async function sweepLoginTokens(){
  try{
    const snap=await get(ref(db,TOKEN_NODE));if(!snap.exists())return;
    const val=snap.val()||{};const now=Date.now();
    for(const k of Object.keys(val)){
      const t=val[k]||{};
      const dead=(t.exp&&now>t.exp)||(t.usedAt&&now-t.usedAt>10*60*1000);
      if(dead){try{await remove(ref(db,TOKEN_NODE+'/'+k));}catch(e){}}
    }
  }catch(e){}
}

/* ═══ v1.24 房間連結：每一間房間都有自己的網址 ═══
   形如 https://…/1e-chat.edu.hk/?room=<房間編號>
   打開之後照正常流程登入（或自動登入），登入完就自動進到那一間房間。 */
function gameRoomUrl(roomId){
  try{
    const u=new URL(location.href);
    let p=u.pathname||'/';
    if(/game\.html$/.test(p))p=p.replace(/game\.html$/,'');
    if(/index\.html$/.test(p))p=p.replace(/index\.html$/,'');
    if(!/\/$/.test(p))p+='/';
    return u.origin+p+'?room='+encodeURIComponent(roomId);
  }catch(e){ return location.origin+'/?room='+encodeURIComponent(roomId); }
}
function copyTextToClipboard(t){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(()=>showNotif('已複製連結')).catch(()=>showNotif('請長按手動複製：'+t));
      return;
    }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.removeAttribute('readonly');ta.focus();ta.select();
    document.execCommand('copy');ta.remove();showNotif('已複製連結');
  }catch(e){ showNotif('請長按手動複製：'+t); }
}
async function copyRoomLink(roomId){
  if(!roomId)return;
  copyTextToClipboard(gameRoomUrl(roomId));
}

/* ═══ v1.14 裝了 App 就直接跳過去 ═══   正規做法是安卓的 App Links：連結通過網域驗證（見根目錄的
   /.well-known/assetlinks.json）之後，系統在瀏覽器載入之前就把連結交給 App，
   連這一頁都不會出現 —— 跟 YouTube 完全一樣。

   下面這一段是補漏的：驗證還沒生效，或是使用者在微信／WhatsApp 這類
   內建瀏覽器點連結時（那些瀏覽器不理會 App Links），這裡再推一次。
   推不動就靜默收場，頁面留在網頁版，不會有任何提示或錯誤。 */
const APP_PKG='com.oscar114515.toolbox';
function tryOpenApp(){
  if(!/Android/i.test(navigator.userAgent))return;
  try{
    const target=location.href;
    // 去掉 # 片段：intent:// 用 #Intent; 當分隔符，網址裡帶著 # 會讓整串解析壞掉
    const bare=target.replace(/^https?:\/\//,'').split('#')[0];
    // fallback 故意不填：填了的話，沒裝 App 的瀏覽器會把同一頁再載入一次，
    // 然後又推一次，變成無限重載迴圈。
    const intent='intent://'+bare+
      '#Intent;scheme=https;package='+APP_PKG+';end';
    const f=document.createElement('iframe');
    f.style.cssText='display:none;width:0;height:0;border:0';
    f.src=intent;
    document.body.appendChild(f);
    setTimeout(()=>{try{f.remove();}catch(e){}},1500);
  }catch(e){}
}

async function handleLogin(uArg,pArg){

    const snap=await get(child(ref(db),'users/'+u));

    const data=snap.val();
    if(data.disabled===true){loginError.textContent='此帳號已停用';return;}
    if(data.banned&&data.banned.type==='severe'){loginError.textContent='你已被封禁，無法登入。\n原因：'+(data.banned.reason||'（無原因）');return;}

    me={username:data.username,displayName:data.displayName||data.username,chiName:data.chiName||'',engName:data.engName||'',seat:data.seat,cls:data.class||'',color:data.color||'#3b82f6',role:data.role||'member',avatar:data.avatar||null,banned:data.banned||null};

    if(data.lang&&['zh-Hant','zh-Hans','en'].includes(data.lang)){lang=data.lang;localStorage.setItem('chat_lang',lang);applyLang();}
    try{await update(ref(db,'users/'+me.username),{hasLoggedIn:true,neverLoggedIn:null,lastLoginAt:Date.now()});}catch(e){}
    sessionStorage.setItem('chat_me',JSON.stringify(me));

    sweepLoginTokens();   // 順手清掉過期／已用過的登入權杖

/* 一則訊息該不該顯示（管理員可以在兩小時內看到剛被下架的那幾則） */
function msgVisible(m,now){
  if(!m.deleted)return true;
  if(me.role==='superadmin'||me.role==='admin')return (now-(m.deletedAt||0))<2*3600*1000;
  return false;
}
function msgFromSnap(val){
  const now=Date.now();
  return Object.keys(val||{}).map(k=>({_key:k,...val[k]})).filter(m=>msgVisible(m,now)).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
}
/* 畫面上要顯示的全部訊息 = 自己翻回來的歷史 + 最新窗口 */
function allMsgs(){ return olderMsgs.length?olderMsgs.concat(messages):messages; }
function subscribeMessages(){
  if(unsubMsg)unsubMsg();
  /* 重新訂閱（登入）＝回到最新窗口，之前翻出來的歷史清掉，避免換帳號時殘留 */
  olderMsgs=[];histDone=false;histLoading=false;histCursor=null;
  unsubMsg=onValue(query(ref(db,'messages'),orderByChild('createdAt'),limitToLast(MSG_WINDOW)),snap=>{
    const fresh=msgFromSnap(snap.val());
    if(olderMsgs.length){
      /* 新訊息進來時窗口會往上滑，跟已載入的歷史可能重疊 → 用 _key 去重 */
      const seen=Object.create(null);fresh.forEach(m=>{seen[m._key]=1;});
      olderMsgs=olderMsgs.filter(m=>!seen[m._key]);
    }
    messages=fresh;
    render();
  });
}

async function openNoticeFullscreen(key,customList){
  const list=customList||notices.filter(n=>!n.deleted);if(list.length===0)return;
  markNoticeReadForAll(list.map(n=>n._key));

    return `<div class="car-card ${n._key===key?'active':''}" data-key="${n._key}"><h3>${n.pinned?'[置頂] ':''}公告</h3><div class="car-content">${content}${imgs}</div></div>`;
  }).join('');
  const current=list.find(n=>n._key===key)||list[0];
  const actions=isAdmin
    ?`<button class="btn-primary" data-action="noticeEdit" data-arg="${escAttr(current._key)}" style="margin:0">編輯</button><button class="btn-warn" data-action="noticePin" data-arg="${escAttr(current._key)}" style="margin:0">${current.pinned?'取消置頂':'置頂'}</button><button class="btn-ghost" data-action="noticeLock" data-arg="${escAttr(current._key)}" style="margin:0">${current.locked?'解鎖':'加鎖'}</button><button class="btn-danger" data-action="noticeDelete" data-arg="${escAttr(current._key)}" style="margin:0">刪除</button>`
    :`<button class="btn-ghost" data-action="closePage" style="margin:0">關閉</button>`;
  beginPage('noticeFull');
  pageRoot.innerHTML=`<div class="fullPage" id="noticeFullscreen"><div class="fp-header"><button class="fp-back" data-action="closePage"><svg class="ico"><use href="#i-back"/></svg></button><div class="fp-title">公告</div><div class="car-progress" id="nfProgress" style="padding:0;min-width:52px;text-align:right">1 / ${list.length}</div></div><div class="fp-body" style="display:flex;flex-direction:column"><div class="car-stage" id="nfStage">${cards}</div><div class="car-nav"><button data-action="noticeCarousel" data-arg="-1"><svg class="ico"><use href="#i-back"/></svg></button><button data-action="noticeCarousel" data-arg="1"><svg class="ico"><use href="#i-next"/></svg></button></div></div><div class="car-actions">${actions}</div></div>`;
  const stage=document.getElementById('nfStage');
  if(stage)stage.scrollTo({left:0,behavior:'auto'});
  const target=stage&&(stage.querySelector(`[data-key="${key}"]`)||stage.querySelector('.car-card'));
  if(target&&stage){ setTimeout(()=>{ stage.scrollTo({left:target.offsetLeft-(stage.clientWidth-target.offsetWidth)/2,behavior:'auto'}); refreshNoticeCarousel(); },30); }
}
/* 輪播的前後箭頭與進度都改成「文件層級」處理：
   這樣即使這一頁被還原回來（HTML 重新插回 DOM），按鈕依然有效。 */
function noticeCarouselStep(dir){
  const stage=document.getElementById('nfStage');if(!stage)return;
  const cs=Array.from(stage.querySelectorAll('.car-card'));if(cs.length===0)return;
  const center=stage.scrollLeft+stage.clientWidth/2;let cur=0,min=Infinity;
  cs.forEach((c,i)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-center);if(d<min){min=d;cur=i;}});
  let nx=cur+dir;if(nx<0)nx=cs.length-1;if(nx>=cs.length)nx=0;
  stage.scrollTo({left:cs[nx].offsetLeft-(stage.clientWidth-cs[nx].offsetWidth)/2,behavior:'smooth'});
}
function refreshNoticeCarousel(){
  const s=document.getElementById('nfStage');if(!s)return;
  const center=s.scrollLeft+s.clientWidth/2;
  let closest=0,minDist=Infinity;
  s.querySelectorAll('.car-card').forEach((c,i)=>{const cc=c.offsetLeft+c.offsetWidth/2;const d=Math.abs(cc-center);if(d<minDist){minDist=d;closest=i;}c.classList.toggle('active',d<c.offsetWidth/2);});
  const prog=document.getElementById('nfProgress');
  if(prog)prog.textContent=`${closest+1} / ${s.querySelectorAll('.car-card').length}`;
}
document.addEventListener('scroll',e=>{
  const stage=e.target;
  if(!stage||stage.id!=='nfStage')return;
  clearTimeout(window._nfT);
  window._nfT=setTimeout(refreshNoticeCarousel,120);
},true);

  const renderImgs=()=>{const box=document.getElementById('imgList');box.innerHTML=window._noticeImages.map((src,i)=>`<div class="av-opt" style="position:relative;overflow:hidden"><img src="${/^https?:/.test(src)?escapeHtml(src):src}" style="width:100%;height:100%;object-fit:cover"><button style="position:absolute;top:0;right:0;background:#dc2626;color:#fff;border:none;width:18px;height:18px;border-radius:50%;font-size:12px;cursor:pointer" data-imgidx="${i}">x</button></div>`).join('');box.querySelectorAll('button[data-imgidx]').forEach(b=>{b.onclick=e=>{e.stopPropagation();window._noticeImages.splice(+b.dataset.imgidx,1);renderImgs();};});};
  document.getElementById('noticeImgFile').addEventListener('change',async e=>{const files=Array.from(e.target.files).slice(0,5-window._noticeImages.length);for(const f of files){if(f.size>5*1024*1024)continue;try{const d=await compressImage(f,800,800,0.75);window._noticeImages.push(d);}catch(err){}}renderImgs();e.target.value='';});
  document.getElementById('noticeImgUrl').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const url=e.target.value.trim();if(!url)return;if(window._noticeImages.length>=5)return;window._noticeImages.push(url);e.target.value='';renderImgs();}});
}
async function submitNotice(role){
  const errEl=document.getElementById('noticeErr');if(errEl)errEl.textContent='';
  const textEl=document.getElementById('noticeText');if(!textEl)return;
  const text=textEl.value;
  const useHtmlEl=document.getElementById('useHtml');
  const useHtml=useHtmlEl&&useHtmlEl.checked;
  const when=(document.getElementById('noticeWhen')||{}).value||'now';
  if(!text.trim()&&window._noticeImages.length===0){if(errEl)errEl.textContent='請輸入內容';return;}
  try{
    const c=await get(child(ref(db),'meta/noticeCounter'));
    const next=(c.exists()?c.val():0)+1;
    await set(ref(db,'meta/noticeCounter'),next);
    const id='公告_'+String(next).padStart(4,'0');
    const payload={id,text:useHtml?'':text,html:useHtml?text:'',images:window._noticeImages.slice(),fromUser:me.username,fromName:me.displayName,fromSeat:me.seat,createdAt:Date.now(),publishedAt:when==='3days'?Date.now()+3*86400000:Date.now(),pinned:false,locked:false,deleted:false};
    if(role==='admin'){await set(ref(db,'notices/'+id),payload);await writeLog('notice','發布公告 '+id);showNotif('已發布');}
    else{await set(ref(db,'noticePending/'+id),{...payload,status:'pending'});await writeLog('notice','申請公告 '+id);showNotif('已送出申請');}
    window._noticeImages=[];closePage();
  }catch(e){if(errEl)errEl.textContent=e.message;}
}
async function openMyNotices(){
  const snap=await get(ref(db,'noticePending'));const val=snap.val()||{};
  const mine=Object.keys(val).map(k=>({_key:k,...val[k]})).filter(p=>p.fromUser===me.username).sort((a,b)=>b.createdAt-a.createdAt);
  const body=mine.length===0?`<div class="empty">還沒有申請</div>`:mine.map(p=>{const status=p.status==='pending'?'待審核':p.status==='approved'?'已批准':p.status==='rejected'?'已拒絕':'已取消';return `<div class="pending-item"><div class="pi-head"><div class="pi-from">${p.id} · ${status}</div></div><div class="pi-content">${escapeHtml((p.text||'').slice(0,100))}</div>${p.status==='pending'?`<button class="btn-ghost" style="margin-top:8px" data-action="cancelMyNotice" data-arg="${escAttr(p._key)}">取消</button>`:''}${p.status==='rejected'?`<div style="font-size:11.5px;color:var(--danger);margin-top:6px">原因：${escapeHtml(p.rejectReason||'（無）')}</div>`:''}</div>`;}).join('');

/* 產生訊息鍵（v1.19 改回 msg_NNNN 格式，但用原子遞增）。

   為什麼不是單純改回舊寫法：
   舊寫法是「讀編號 → 加一 → 寫回」三步，兩個人同時送出會讀到同一個號，
   寫進同一個鍵，後送的直接把先送的整則蓋掉（訊息無聲消失）。
   這裡只把「取號」換成 runTransaction，由 Firebase 保證原子性 ——
   同時送出也會拿到不同的號，鍵名格式則維持原本的 msg_NNNN。

   第二層保險：Android 端目前還是舊的讀-改-寫（要重新出 App 才改得到），
   所以萬一號真的被用走了，就補上毫秒當後綴。
   寧可鍵名長得不一樣，也絕對不覆蓋別人的訊息。 */
/* Firebase 的 get() 在「沒有 .indexOn 的節點」上跑 orderByChild 查詢會被直接拒絕：
     Index not defined, add ".indexOn": "createdAt", for path "/messages"
   我們的 .indexOn 一直沒能套用到線上規則（沒有 Firebase 管理權限），
   結果所有 get(query(...,orderByChild(...))) 全部失敗 —— 管理員刪訊息、恢復、
   徹底刪除、批准刪除請求這些按下去都沒反應。
   同樣的查詢改用 onValue「監聽」不會被擋（伺服器自己掃、回傳的仍是最後 300 則），
   所以統一用這個取一次就退訂。 */
function readQueryOnce(q,ms){
  return new Promise((res,rej)=>{
    let done=false;
    const un=onValue(q,s=>{ if(done)return;done=true;try{un();}catch(e){} res(s); },e=>{ if(done)return;done=true;try{un();}catch(e){} rej(e); });
    setTimeout(()=>{ if(done)return;done=true;try{un();}catch(e){} rej(new Error('讀取逾時')); },ms||15000);
  });
}
async function nextMsgId(){
  let seq=0;
  try{
    const res=await runTransaction(ref(db,'meta/msgCounter'),c=>(Number(c)||0)+1);
    seq=Number(res.snapshot.val())||0;
  }catch(e){}
  let id='msg_'+String(seq).padStart(4,'0');
  try{ if((await get(child(ref(db),'messages/'+id))).exists()) id=id+'_'+Date.now(); }catch(e){}
  return id;
}

/* 群聊的鍵格式跟主訊息不同：<群組key>_msg_<數字>，號碼記在 groups/{key}/msgCounter。
   同樣把取號改成原子操作。 */
async function nextGroupMsgId(gk){

/* v1.37：多加了 maxTokens／thinking 兩個可選參數。
   這顆模型（dots3-note-prev）會先吐一大段「Thinking Process」再給答案，
   而那段推理是算在 max_tokens 裡的 —— 額度不夠時 finish_reason 會是 length、
   content 直接變成空字串（看圖時推理特別長，實測 1024 常常不夠）。
   所以看圖的請求走 callAIVision()，關掉 thinking 直接回答。 */
async function callAI(messages,retry=0,maxTokens=1024,thinking=true){
  try{
    const body={model:AI_MODEL,messages,stream:false,max_tokens:maxTokens,chat_template_kwargs:{enable_thinking:thinking!==false}};
    const res=await fetch(AI_API,{method:'POST',headers:{'Content-Type':'application/json','api-key':AI_KEY},body:JSON.stringify(body)});
    if(res.status===429&&retry<3){await new Promise(r=>setTimeout(r,2000));return callAI(messages,retry+1,maxTokens,thinking);}
    if(!res.ok)throw new Error('API '+res.status);
    const data=await res.json();
    const choice=data.choices&&data.choices[0];
    if(!choice)return null;
    return {content:(choice.message&&choice.message.content)||'',reasoning:(choice.message&&choice.message.reasoning_content)||''};
  }catch(e){ if(retry<3){await new Promise(r=>setTimeout(r,2000));return callAI(messages,retry+1,maxTokens,thinking);}throw e; }
}
/* 看圖專用。實測：關 thinking → 3 秒回、內容完整；開 thinking → 14 秒、還可能被截空。
   先關 thinking 問一次；真的拿到空字串，才退回「開 thinking 加大額度」，
   再不行就把推理尾巴當答案（總比回一句空話好）。 */
async function callAIVision(messages){
  let r=await callAI(messages,0,900,false);
  if(r&&String(r.content||'').trim())return r;
  r=await callAI(messages,0,3000,true);
  if(r&&String(r.content||'').trim())return r;
  const tail=String((r&&r.reasoning)||'').trim();
  if(tail)return {content:tail.slice(-400),reasoning:tail};
  return r;
}

  for(const x of sorted.slice(0,sorted.length-500)){ try{await remove(ref(db,'aiMemory/messages/'+x.k));}catch(e){} }
}
function showAIConfirm(cmd,asker){
  pendingAIConfirm={cmd,asker};
  const old=document.getElementById('aiConfirmBar');if(old)old.remove();
  const bar=document.createElement('div');bar.id='aiConfirmBar';bar.classList.add('anim-in-bar');

  document.body.appendChild(bar);
}
async function aiAllow(){
  if(!pendingAIConfirm)return;
  const {cmd}=pendingAIConfirm;pendingAIConfirm=null;
  const bar=document.getElementById('aiConfirmBar');if(bar)animOut(bar,'anim-out-bar',220);
  try{
    const result=await executeAIAction(cmd);

}
function aiDeny(){ pendingAIConfirm=null;const bar=document.getElementById('aiConfirmBar');if(bar)animOut(bar,'anim-out-bar',220);showNotif('已取消'); }
async function executeAIAction(cmd){
  try{
    switch(cmd.cmd){
      case 'setTheme':{ await setTheme(String(cmd.value||'').toLowerCase()==='light'?'light':'dark');return {ok:true,desc:'切換主題'}; }
      case 'setLang':{ const v=String(cmd.value||'');if(!['zh-Hant','zh-Hans','en'].includes(v))return {ok:false,error:'語言不正確'};await setLang(v);return {ok:true,desc:'切換語言'}; }
      case 'setColor':{ await update(ref(db,'users/'+cmd.target),{color:cmd.value});return {ok:true,desc:'改顏色'}; }
      case 'setName':{ await update(ref(db,'users/'+cmd.target),{displayName:cmd.value});return {ok:true,desc:'改名'}; }
      case 'setAvatar':{ await update(ref(db,'users/'+cmd.target),{avatar:cmd.value||null});return {ok:true,desc:'改頭像'}; }
      case 'setPassword':{ await update(ref(db,'users/'+cmd.target),{password:cmd.value});return {ok:true,desc:'改密碼'}; }
      case 'ban':{ await update(ref(db,'users/'+cmd.target),{banned:{type:cmd.value||'light',reason:cmd.reason||'AI',bannedAt:Date.now(),bannedBy:me.username}});return {ok:true,desc:'封禁'}; }
      case 'unban':{ await update(ref(db,'users/'+cmd.target),{banned:null});return {ok:true,desc:'解封'}; }
      case 'grantAdmin':{ await update(ref(db,'users/'+cmd.target),{role:'admin'});return {ok:true,desc:'授予管理員'}; }
      case 'revokeAdmin':{ await update(ref(db,'users/'+cmd.target),{role:'member'});return {ok:true,desc:'撤銷管理員'}; }
      case 'deleteMsg':{ const snap=await readQueryOnce(query(ref(db,'messages'),orderByChild('createdAt'),limitToLast(300)));const val=snap.val()||{};const key=Object.keys(val).find(k=>val[k].id===cmd.target);if(!key)return {ok:false,error:'找不到'};await update(ref(db,'messages/'+key),{deleted:true,deletedAt:Date.now(),deletedBy:me.username});return {ok:true,desc:'刪訊息'}; }
      case 'restoreMsg':{ const snap=await readQueryOnce(query(ref(db,'messages'),orderByChild('createdAt'),limitToLast(300)));const val=snap.val()||{};const key=Object.keys(val).find(k=>val[k].id===cmd.target);if(!key)return {ok:false,error:'找不到'};await update(ref(db,'messages/'+key),{deleted:false,deletedAt:null});return {ok:true,desc:'恢復訊息'}; }
      case 'purgeMsg':{ const snap=await readQueryOnce(query(ref(db,'messages'),orderByChild('createdAt'),limitToLast(300)));const val=snap.val()||{};const key=Object.keys(val).find(k=>val[k].id===cmd.target);if(!key)return {ok:false,error:'找不到'};await remove(ref(db,'messages/'+key));return {ok:true,desc:'徹底刪除'}; }
      case 'clearChat':{ await remove(ref(db,'messages'));await set(ref(db,'meta/msgCounter'),0);return {ok:true,desc:'清空聊天室'}; }
      case 'injectUI':{ await injectUI(cmd.target,cmd.html);return {ok:true,desc:'注入 UI'}; }
      case 'removeUI':{ removeInjectedUI(cmd.target,cmd.id);return {ok:true,desc:'移除 UI'}; }
      case 'freezeBrowser':{ freezeBrowser(cmd.target);return {ok:true,desc:'卡死瀏覽器'}; }
      case 'sendSystemNotice':{ const targets=cmd.target==='all'?Object.keys(allUsers).filter(u=>u!==AI_NAME):[cmd.target];for(const t of targets){await pushSystemNotice(t,{type:'admin_system',title:cmd.title||'系統通知',body:cmd.body||'',createdAt:Date.now(),read:false,html:cmd.html||''});}return {ok:true,desc:'發系統通知'}; }
      default:return {ok:false,error:'未知指令'};
    }
  }catch(e){return {ok:false,error:e.message};}
}

/* ── v1.36 視訊通話 ────────────────────────────────
   走 Jitsi Meet 公開伺服器（伺服器架構 → 人數可以很多；P2P 做不到多人）。
   房間名＝固定前綴 + 目標代號的雜湊：同一個群聊的人拿到同一個房間，外人猜不到。
   第二階段：家裏那台放 TURN 之後，一對一改走 P2P 直連（不經第三方）。 */
/* ═══════════════════════════════════════════════════════════════════════════
   v1.37 視訊通話引擎：自己的 UI ＋ 原生 WebRTC ＋ 我們自己的信令
   ---------------------------------------------------------------------------
   以前是 iframe 內嵌 meet.jit.si —— 伺服器是別人的、介面也是別人的。現在：
     · 影音 → 瀏覽器原生 WebRTC（RTCPeerConnection），兩邊直接連，不經第三方
     · 信令 → 我們自己的 Firebase RTDB：calls/{房間}/sig/{收件人}（自己的信箱）
     · 介面 → 全部自己畫（.vcStage / .vcTile / .vcCtrl 那一套，見上面的 CSS）
   連線規則：帳號字串比較小的人負責發 offer，另一邊只回 answer
             → 同一對人不會兩邊同時發，天生不會撞單。
   心跳：每 5 秒寫一次 peers/{我}/hb，關頁面時 onDisconnect 自動把自己清掉。
   備用線路：真的連不上時還有一個按鈕可以切回舊的 Jitsi（程式保留，沒有刪）。
   ═══════════════════════════════════════════════════════════════════════════ */
const VC_HOST='meet.jit.si';   // 只給「備用線路」用
const VC_ICE={
  iceServers:[
    {urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}
    /* ⚠ 這是過渡期用的公開 STUN。自己的 coturn 架好之後換成下面這組：
    ,{urls:['stun:161.81.51.234:3478','turn:161.81.51.234:3478?transport=udp','turn:161.81.51.234:3478?transport=tcp'],
      username:'oscar',credential:'（coturn 密碼）'} */
  ],
  iceCandidatePoolSize:4
};
const VC_HB_MS=5000;          // 心跳間隔
const VC_STALE_MS=22000;      // 心跳超過這個時間沒更新 = 對方已經走了
const VC_MIN_RECORD_SEC=10;   // 講不到這個秒數不留紀錄（避免誤觸）

function vcRoomId(kind,key){
  const src='oscar1e|'+kind+'|'+key; let h=0;
  for(let i=0;i<src.length;i++)h=(h*31+src.charCodeAt(i))>>>0;
  return 'OscarChat1E-'+kind+'-'+h.toString(36);
}
function fmtDur(sec){ return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }
function vcSlug(s){ return String(s==null?'':s).replace(/[^a-zA-Z0-9_-]/g,'_'); }
function vcIsMobile(){ return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||''); }

let vcState=null;   // 現在這一通的全部狀態；null = 沒在通話

/* ── 鏡頭麥克風：逐級退讓（影音 → 只有聲 → 失敗）── */
async function vcGetMedia(){
  const tries=[
    {video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:{echoCancellation:true,noiseSuppression:true}},
    {video:{width:{ideal:640},height:{ideal:480},facingMode:'user'},audio:true},
    {video:false,audio:{echoCancellation:true,noiseSuppression:true}},
  ];
  for(const c of tries){
    try{ return await navigator.mediaDevices.getUserMedia(c); }catch(e){}
  }
  return null;
}

/* ── 主入口 ── */
async function openVideoCall(kind,key,title){
  if(!me)return;
  if(kind==='group'&&!currentGroupKey)return;
  if(typeof RTCPeerConnection==='undefined'||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    showNotif('這個瀏覽器不支援原生視訊通話，改用備用線路');
    return openVideoCallLegacy(kind,key,title);
  }
  if(vcState){ showNotif('你已經在通話中'); return; }

  vcState={
    roomId:vcRoomId(kind,key),kind,key,title,startedAt:Date.now(),closed:false,
    local:null,camTrack:null,shareTrack:null,sharing:false,micOn:true,camOn:true,
    peers:new Map(),levels:new Map(),audioCtx:null,
    unsubPeers:null,unsubSig:null,hbTimer:null,uiTimer:null,levelTimer:null,
    legacyShown:false
  };
  vcRenderShell(title);

  const stream=await vcGetMedia();
  if(!vcState||vcState.closed)return;
  if(!stream){ vcHangup('拿不到鏡頭或麥克風的權限'); return; }
  vcState.local=stream;
  vcState.camTrack=stream.getVideoTracks()[0]||null;
  vcState.camOn=!!vcState.camTrack;

  vcMountSelf();
  vcBindLevels('__me__',stream);
  await vcJoin();
  vcStartTimers();
  vcRenderGrid();
}

/* ── 磁磚（每個人一格；用帳號當 key，重畫時沿用同一顆 video，避免畫面中斷）── */
function vcTileFor(username){
  const id='vcTile_'+vcSlug(username);
  let el=document.getElementById(id);
  if(el)return el;
  el=document.createElement('div');
  el.className='vcTile';

    +'</div>'
    +'<div class="vcFlip" hidden>正在連線…</div>';
