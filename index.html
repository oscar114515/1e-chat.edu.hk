*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
:root{
  --r-0:4px;--r-1:8px;--r-2:12px;--r-3:16px;--dur-1:120ms;--dur-2:200ms;--dur-3:280ms;--dur-4:480ms;--ease-out:cubic-bezier(.22,1,.36,1);--ease-inout:cubic-bezier(.4,0,.2,1);--gold:#fbbf24;--warn-tx:#fca5a5;--ok-tx:#4ade80;--danger:#f87171;--info:#38bdf8;--pink-tx:#f472b6;--purple-tx:#a78bfa;--orange-tx:#fdba74;--white-warm:#fff9ec;--bg-app:#0f172a;--bg-header:linear-gradient(90deg,rgba(30,41,59,.72),rgba(15,23,42,.62));--bg-card:rgba(30,41,59,.55);--bg-input:rgba(15,23,42,.45);--text-main:#e2e8f0;--text-sub:#94a3b8;--text-muted:#64748b;--border:rgba(148,163,184,.15);--border-strong:rgba(148,163,184,.3);--primary:#3b82f6;--primary-2:#2563eb;--ai:#66ccff}
body.theme-light{--bg-app:#eef1f6;--bg-header:linear-gradient(90deg,rgba(255,255,255,.78),rgba(248,250,252,.7));--bg-card:rgba(255,255,255,.62);--bg-input:rgba(240,242,245,.85);--text-main:#1c1e21;--text-sub:#65676b;--text-muted:#8a8d91;--border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.15)}

body.theme-light{background:
    radial-gradient(58% 46% at 14% 6%, rgba(96,165,250,.30), transparent 72%),
    radial-gradient(52% 42% at 88% 88%, rgba(192,132,252,.22), transparent 72%),
    radial-gradient(46% 38% at 62% 46%, rgba(34,211,238,.12), transparent 78%),
    var(--bg-app);background-attachment:scroll}/* v1.38.23 字體：英數用 Inter（本地 48KB 可變字體，只吃 latin），中文交系統字體。
   為甚麼不全站自帶中文字體：一套繁體中文字最少 4–6MB，全班 144 人每天開頁，
   Firebase 每月 10GB 下載量會被字體吃光，而且手機首次載入要等好幾秒。
   Inter 只覆蓋英文數字，中文自動 fallback，兩者都不犧牲。 */
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
  src:url('fonts/Inter-latin-var.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* v1.38.23 中文字體：霞鶩文楷（開源手寫楷體，7397 字子集 2.1MB）。
   英數仍然先吃 Inter，中文才落到這裡；找不到的字自動退回系統字體。 */
@font-face{font-family:'LXGW WenKai TC';font-style:normal;font-weight:400;font-display:swap;
  src:url('fonts/LXGWWenKaiTC-subset.woff2') format('woff2');
  unicode-range:U+2E80-2EFF,U+3000-303F,U+3100-312F,U+31C0-31EF,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FE30-FE4F,U+FF00-FFEF}
body{font-family:'LXGW WenKai TC','Inter',-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","PingFang TC","Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans CJK TC","Noto Sans TC",system-ui,sans-serif;background:
    radial-gradient(62% 50% at 12% 4%, rgba(59,130,246,.48), transparent 70%),
    radial-gradient(56% 46% at 90% 90%, rgba(168,85,247,.40), transparent 70%),
    radial-gradient(48% 40% at 60% 48%, rgba(34,211,238,.22), transparent 76%),
    var(--bg-app);
  background-attachment:scroll;
  color:var(--text-main);overflow:hidden;height:100vh;height:100dvh;transition:background var(--dur-3) ease,color var(--dur-3) ease;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

/* v1.38.23 UI 修正：深色主題下輸入框的提示字用瀏覽器預設色，幾乎看不見。
   統一改成次要文字色，兩種主題都讀得到。 */
input::placeholder,textarea::placeholder{color:var(--text-sub);opacity:.8}
/* ═══ 拍賣 / 紅包榜 / 挑戰 ═══ */
.auc-card{padding:14px 16px;border-radius:15px;background:var(--bg-input);border:1px solid var(--border);margin-bottom:11px}
.auc-title{font-size:14px;font-weight:700;color:var(--text-main)}
.auc-desc{font-size:11.5px;color:var(--text-sub);margin-top:4px;line-height:1.6}
.auc-top{font-size:12.5px;color:#fbbf24;font-weight:700;margin-top:8px}
.auc-row{display:flex;gap:7px;margin-top:9px}
.auc-row input{flex:1;min-width:0;padding:9px 11px;border-radius:11px;background:var(--bg-card);
  color:var(--text-main);border:1px solid var(--border);font-size:13px;font-family:inherit}
.auc-row button{padding:9px 15px;border-radius:11px;border:none;background:rgba(251,191,36,.22);
  color:#fbbf24;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;flex:0 0 auto}
.rk-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.rk-row:last-child{border-bottom:none}
.chal-card{padding:14px 16px;border-radius:16px;margin-bottom:13px;
  background:linear-gradient(140deg,rgba(251,191,36,.14),rgba(239,68,68,.10));border:1px solid rgba(251,191,36,.35)}
.dot-red{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ef4444;margin-left:5px;
  vertical-align:middle;animation:dotPulse 1.6s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.82)}}

/* ═══ 農場 / 小遊戲 ═══ */
.farm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:8px 0}
.farm-cell{padding:13px 8px;border-radius:15px;background:var(--bg-input);border:1px solid var(--border);
  text-align:center;cursor:pointer;transition:transform .15s cubic-bezier(.34,1.5,.5,1)}
.farm-cell:active{transform:scale(.94)}
.farm-cell .fc-i{font-size:29px;line-height:1.1}
.farm-cell .fc-n{font-size:11px;color:var(--text-main);margin-top:4px}
.farm-cell .fc-s{font-size:9.5px;color:var(--text-muted);margin-top:2px}
.farm-cell.ready{border-color:rgba(74,222,128,.6);background:rgba(74,222,128,.10)}
.farm-cell.hungry{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.08)}
.mg-box{padding:22px 16px;text-align:center;border-radius:18px;background:var(--bg-input);
  border:1px solid var(--border);margin:10px 0;min-height:190px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;transition:background .25s}
.mg-box.go{background:rgba(34,197,94,.22);border-color:rgba(74,222,128,.6)}
.mg-big{font-size:42px;line-height:1.1}
.mg-msg{font-size:13.5px;color:var(--text-main);line-height:1.7}
.mg-num{font-size:31px;font-weight:800;letter-spacing:5px;color:var(--text-main);font-variant-numeric:tabular-nums}
.mg-in{width:100%;max-width:210px;padding:11px 13px;border-radius:13px;background:var(--bg-input);
  color:var(--text-main);border:1px solid var(--border);font-size:17px;text-align:center;font-family:inherit}

/* ═══ 表情包 / 手勢提示 ═══ */
.sticker-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:8px 0 4px}
.sticker-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:26px;
  border-radius:13px;background:var(--bg-input);border:1px solid var(--border);cursor:pointer;
  transition:transform .15s cubic-bezier(.34,1.5,.5,1)}
.sticker-cell:active{transform:scale(.85)}
.msg .bubble .sticker-big{font-size:46px;line-height:1.15;display:block;text-align:center}
.msg .bubble.sticker-bubble{background:transparent!important;padding:0!important;box-shadow:none!important}

/* ═══ 轉賬 / 紅包 ═══ */
/* 轉賬氣泡：照微訊 —— 橙底、左邊白色圓加橙色雙向箭頭、下面「WeChat 轉賬」小字 */
.tf-card{display:flex;flex-direction:column;width:216px;max-width:72vw;border-radius:8px;
  background:#e8863a;color:#fff;overflow:hidden;cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.12);transition:transform .15s}
/* tfDoneGrey：照微訊 —— 收款之後氣泡整塊變淺灰，字同金額都轉灰 */
.tf-card:active{transform:scale(.97)}
.tf-card.done{background:#c9cbcd;box-shadow:none;cursor:default}
.tf-card.done .tf-amt,.tf-card.done .tf-st{color:#fff}
.tf-card.done .tf-ico{background:rgba(255,255,255,.85);color:#9aa0a6}
.tf-card.done .tf-foot{opacity:.6}
.tf-head{display:flex;align-items:center;gap:11px;padding:15px 13px 11px}
.tf-ico{width:40px;height:40px;border-radius:50%;background:#fff;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:#e8863a;font-size:22px;font-weight:900;line-height:1}
.tf-amt{font-size:16.5px;font-weight:700;line-height:1.15}
.tf-st{font-size:11.5px;opacity:.94;margin-top:3px}
.tf-foot{font-size:10px;opacity:.72;padding:0 13px 12px;letter-spacing:.3px}
/* ═══ 個人主頁天氣卡（Uiverse grumpy-mule-23 改造）═══
   磨砂半透明卡，圖標隨天氣變；資料來自香港天文台開放數據（有 CORS）。 */
.wx-card{width:100%;border-radius:18px;padding:16px 18px 14px;
  background:linear-gradient(150deg,rgba(56,189,248,.16),rgba(99,102,241,.12) 55%,rgba(168,85,247,.10));
  border:1px solid var(--border-strong);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  position:relative;overflow:hidden;margin-bottom:14px;
  animation:wxIn .45s cubic-bezier(.34,1.42,.64,1)}
@keyframes wxIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.wx-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.wx-city{font-size:11.5px;font-weight:700;letter-spacing:.8px;color:var(--text-sub);text-transform:uppercase}
.wx-date{font-size:10.5px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.wx-main{display:flex;align-items:center;gap:14px;padding:6px 0 4px}
.wx-ico{width:64px;height:64px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.wx-ico svg{width:100%;height:100%;display:block;overflow:visible}
.wx-temp{font-size:38px;font-weight:800;line-height:1;letter-spacing:-1.5px;
  color:var(--text-main);font-variant-numeric:tabular-nums}
.wx-temp span{font-size:17px;font-weight:600;letter-spacing:0;opacity:.75}
.wx-desc{font-size:13px;color:var(--text-sub);margin-top:5px;font-weight:600}
.wx-sep{height:1px;background:var(--border);margin:12px 0 10px}
.wx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.wx-cell{display:flex;flex-direction:column;gap:2px}
.wx-k{font-size:10px;color:var(--text-muted);letter-spacing:.4px}
.wx-v{font-size:14px;font-weight:700;color:var(--text-main);font-variant-numeric:tabular-nums}
.wx-loading{font-size:12px;color:var(--text-muted);padding:14px 0;text-align:center}

/* 圖標動效：太陽旋轉、雲飄、雨滴落 */
.wx-ico .sun{animation:wxSun 14s linear infinite;transform-origin:32px 32px}
@keyframes wxSun{to{transform:rotate(360deg)}}
.wx-ico .cloud{animation:wxCloud 5s ease-in-out infinite}
@keyframes wxCloud{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.wx-ico .drop{animation:wxDrop 1.1s linear infinite}
.wx-ico .drop:nth-child(3){animation-delay:.25s}
.wx-ico .drop:nth-child(4){animation-delay:.5s}
@keyframes wxDrop{0%{opacity:0;transform:translateY(-2px)}25%{opacity:1}100%{opacity:0;transform:translateY(7px)}}
.wx-ico .bolt{animation:wxBolt 2.4s ease-in-out infinite}
@keyframes wxBolt{0%,70%,100%{opacity:.35}80%,90%{opacity:1}}

/* WX_BLOCK_MOVED: 這段 JS 已移到 <script> 內（之前誤插在 <style>，整個函式從未執行） */
/* 轉賬詳情：照微訊 —— 強制白底黑字（唔跟主題），因為微訊本身就係白 */
.tfv{background:#fff;color:#111;min-height:100%;padding:8px 24px 30px;
  display:flex;flex-direction:column;align-items:center;
  /* 蓋住 openPage 預設的深色底 */
  margin:-16px -16px 0;border-radius:0}

/* AIFX_RESTORED: 之前搬天氣卡 JS 時把這段 CSS 一齊切走，
   結果只剩 HTML 冇樣式（用戶完全睇唔到效果）。重新補回並修正兩個問題：
   ① 紫球原本冇底色，放喺淺色氣泡上睇唔見 → 加深色圓底
   ② 發送鍵被 .pc-input-bar button 的藍底蓋掉 → 用 !important 壓過去 */
.aild{position:relative;display:inline-flex;align-items:center;justify-content:center;
  /* AIFX_TUNE: 64px 太大，氣泡裝唔落會被截斷 → 縮到 46px */
  width:46px;height:46px;font-size:.58em;font-weight:400;color:#fff;user-select:none;
  vertical-align:middle;margin-left:0;border-radius:50%;
  background:radial-gradient(circle at 50% 32%,#3b1f6e,#120c26 78%);
  box-shadow:0 2px 10px -3px rgba(76,29,149,.55)}
.aild-ball{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;
  background:transparent;animation:aildRot 2s linear infinite;z-index:0}
@keyframes aildRot{
  0%{transform:rotate(90deg);box-shadow:0 10px 20px 0 #fff inset,0 20px 30px 0 #ad5fff inset,0 60px 60px 0 #471eec inset}
  50%{transform:rotate(270deg);box-shadow:0 10px 20px 0 #fff inset,0 20px 10px 0 #d60a47 inset,0 40px 60px 0 #311e80 inset}
  100%{transform:rotate(450deg);box-shadow:0 10px 20px 0 #fff inset,0 20px 30px 0 #ad5fff inset,0 60px 60px 0 #471eec inset}
}
.aild-t{display:inline-block;opacity:.45;animation:aildLet 2s infinite;position:relative;z-index:1;
  text-shadow:0 1px 3px rgba(0,0,0,.5)}
@keyframes aildLet{0%,100%{opacity:.45;transform:translateY(0)}20%{opacity:1;transform:scale(1.18)}40%{opacity:.7;transform:translateY(0)}}
.aild-t:nth-child(2){animation-delay:0s}
.aild-t:nth-child(3){animation-delay:.12s}
/* AI 思考：英文，唔跟語言設定（用戶要求：無論設咩語言都要顯示英文） */
.aild-wrap{display:inline-flex;align-items:center;gap:7px;padding:3px 2px 3px 0}
.aild-txt{font-size:12px;color:#94a3b8;letter-spacing:.4px;font-weight:500;
  animation:aildTxt 2s ease-in-out infinite;white-space:nowrap}
@keyframes aildTxt{0%,100%{opacity:.55}50%{opacity:1}}
body.theme-light .aild-txt{color:#64748b}

.pc-input-bar .aibtn,.aibtn{position:relative;display:flex;align-items:center;gap:2px;
  padding:7px 12px 7px 10px;border-radius:22px;cursor:pointer;flex-shrink:0;
  background:#fff!important;border:1px solid #d8dbe0!important;
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px -6px rgba(0,0,0,.12),inset 0 1px 0 #fff;
  transition:border-color .3s,box-shadow .3s}
.pc-input-bar .aibtn:active,.aibtn:active{background:#f1f2f4!important;border-color:#b8bdc4!important}
.aibtn[disabled]{opacity:.5!important}
.aibtn-svg{width:15px;height:15px;fill:#6b7280;flex-shrink:0;
  animation:aibFlicker 2s linear infinite;animation-delay:.5s;
  filter:drop-shadow(0 0 2px rgba(0,0,0,.15));transition:fill .3s}
@keyframes aibFlicker{50%{opacity:.3}}
.aibtn-l{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.2px;
  color:#9aa0a6;animation:aibLet 2s ease-in-out infinite;transition:color .3s,text-shadow .3s}
@keyframes aibLet{50%{color:#111;text-shadow:0 0 4px rgba(0,0,0,.18)}}
.aibtn-l:nth-child(3){animation-delay:0s}
.aibtn-l:nth-child(4){animation-delay:.08s}
.aibtn-l:nth-child(5){animation-delay:.16s}
.aibtn-l:nth-child(6){animation-delay:.24s}
.aibtn:hover .aibtn-l{color:#111}
.aibtn:hover .aibtn-svg{fill:#111}
body.theme-dark .aibtn{background:#1b2233!important;border-color:#334155!important}
body.theme-dark .aibtn-l{color:#64748b}
body.theme-dark .aibtn-svg{fill:#64748b}

.tfv-ico{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin:24px 0 20px;flex:0 0 auto}
.tfv-ico.wait{border:3px solid #1aadf0;background:#fff}
.tfv-ico.ok{background:#07c160}
.tfv-ico svg{width:34px;height:34px;display:block}
.tfv-title{font-size:16.5px;color:#111;margin-bottom:16px;text-align:center;line-height:1.5;
  max-width:100%;word-break:break-all}
.tfv-amt{font-size:46px;font-weight:600;letter-spacing:-1.5px;color:#111;line-height:1.05;
  font-variant-numeric:tabular-nums}
.tfv-sub{font-size:12.5px;color:#8a8a8a;margin-top:10px}
.tfv-note{font-size:12.5px;color:#666;margin-top:12px;background:#f5f5f5;
  padding:6px 14px;border-radius:8px;max-width:100%;word-break:break-all}
.tfv-divider{width:100%;height:1px;background:#ededed;margin:24px 0 6px;flex:0 0 auto}
.tfv-row{width:100%;display:flex;justify-content:space-between;align-items:center;
  font-size:13px;color:#8a8a8a;padding:10px 0;gap:12px}
.tfv-row b{color:#111;font-weight:400;text-align:right}
.tfv-spacer{flex:1;min-height:50px}
.tfv-btn{width:100%;max-width:320px;padding:14px;border-radius:8px;border:none;
  background:#07c160;color:#fff;font-size:16px;font-weight:600;font-family:inherit;
  cursor:pointer;box-shadow:0 2px 8px -2px rgba(7,193,96,.5)}
.tfv-btn:active{background:#06ad56}
.tfv-btn:disabled{opacity:.6}
.tfv-hint{font-size:12px;color:#9a9a9a;text-align:center;line-height:1.8;padding:6px 0 10px}
.tfv-hint a{color:#576b95;cursor:pointer;font-weight:500}
.tfv-foot{font-size:13px;color:#576b95;padding:12px;cursor:pointer}

/* 紅包氣泡：照微訊 —— 跟轉賬同一種橙，左邊紅色小方塊（帶金線），下面「微信紅包」 */
.rp-card{display:flex;flex-direction:column;width:216px;max-width:72vw;border-radius:8px;
  background:#e8863a;color:#fff;overflow:hidden;cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.12);transition:transform .15s}
.rp-card:active{transform:scale(.97)}
.rp-card.done{background:#d5d6d8;box-shadow:none;cursor:default}
.rp-card.done .rp-ico{background:#b9bcbf}
.rp-card.done .rp-ico::after{background:rgba(255,255,255,.75)}
.rp-card.done .rp-txt,.rp-card.done .rp-sub{color:#fff}
.rp-head{display:flex;align-items:center;gap:11px;padding:15px 13px 11px}
.rp-ico{width:36px;height:36px;border-radius:5px;background:#d8382c;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.rp-ico::after{content:'';position:absolute;left:50%;top:8px;bottom:8px;width:2px;
  transform:translateX(-50%);background:rgba(255,214,120,.9);border-radius:1px}
.rp-txt{font-size:16.5px;font-weight:700;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-sub{font-size:11px;opacity:.9;margin-top:3px}
.rp-foot{font-size:10px;opacity:.72;padding:0 13px 12px;letter-spacing:.3px}
/* 開紅包彈層 */
#rpOpen{position:fixed;inset:0;z-index:9997;background:rgba(0,0,0,.72);display:flex;
  align-items:center;justify-content:center;padding:24px;animation:rpFade .25s ease}
@keyframes rpFade{from{opacity:0}to{opacity:1}}
#rpOpen .rp-box{width:100%;max-width:300px;border-radius:26px;padding:26px 22px 22px;text-align:center;
  background:linear-gradient(160deg,#dc2626,#991b1b);color:#fff;position:relative;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.8);animation:rpPop .38s cubic-bezier(.34,1.5,.5,1)}
@keyframes rpPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#rpOpen .rp-amt{font-size:38px;font-weight:900;letter-spacing:-1px;margin:14px 0 6px;
  color:#ffe08a;text-shadow:0 2px 10px rgba(0,0,0,.35);
  animation:rpAmt .5s cubic-bezier(.34,1.6,.5,1) .15s both}
@keyframes rpAmt{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
#rpOpen .rp-from{font-size:11.5px;opacity:.85}
#rpOpen .rp-note{font-size:12.5px;opacity:.9;margin-top:10px}
/* rpGold：微信拆完之後個掣係金色實心，唔係半透明白 */
#rpOpen .rp-close{margin-top:18px;width:100%;padding:12px;border-radius:13px;border:none;
  background:linear-gradient(180deg,#ffe0a3,#f6c04a 60%,#e9a92c);color:#7a3f00;
  font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;
  box-shadow:0 6px 16px -6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.5)}
/* 撒花 */
#rpConfetti{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
#rpConfetti i{position:absolute;font-size:15px;animation:rpFall 1.6s ease-out forwards}
@keyframes rpFall{from{transform:translateY(0) rotate(0);opacity:1}to{transform:translateY(70vh) rotate(480deg);opacity:0}}

/* ═══ 表情回應 / 引用回覆 / 快捷回覆 ═══ */

  background:var(--bg-input);color:var(--text-main);cursor:pointer;font-family:inherit;
  transition:transform .18s cubic-bezier(.34,1.5,.5,1)}

/* 打字中 */
.typing-line{font-size:11px;color:var(--text-muted);padding:3px 14px 0;height:16px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:opacity .2s}
.typing-dots-inline{display:inline-flex;gap:2px;vertical-align:middle;margin-left:3px}
.typing-dots-inline i{width:3.5px;height:3.5px;border-radius:50%;background:var(--text-muted);
  animation:typeBounce 1.1s infinite}
.typing-dots-inline i:nth-child(2){animation-delay:.15s}
.typing-dots-inline i:nth-child(3){animation-delay:.3s}
@keyframes typeBounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-3px);opacity:1}}

/* ═══ 小喆AI 動態表情頭像 ═══
   參考 Grok Bot 的「會動的眼睛 + 情緒狀態機」，但完全自己實作（原倉庫素材歸 xAI，不可再分發）。
   三層：① 球體徑向漸層（左上高光）② 兩隻眼睛 ③ 情緒用 data-mood 換眼睛形狀。
   平時 idle 會慢慢左右漂、不時眨眼；回答完會按內容換表情，幾秒後自己回 idle。 */
.ai-face{
  width:100%;height:100%;border-radius:50%;position:relative;overflow:hidden;
  background:radial-gradient(circle at 34% 28%, #c2e4ff 0%, #5aa8ff 46%, #1b52c4 100%);
  box-shadow:inset -3px -4px 8px rgba(0,20,60,.35), inset 3px 4px 8px rgba(255,255,255,.35);
}
.ai-face::after{  /* 左上反光，讓球看起來有厚度 */
  content:'';position:absolute;left:16%;top:11%;width:42%;height:30%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);
  filter:blur(1px);pointer-events:none;
}
.ai-face .ai-eyes{position:absolute;inset:0;transition:transform .45s cubic-bezier(.34,1.3,.5,1)}
.ai-face .ai-eye{
  position:absolute;top:35%;width:7px;height:12.5px;border-radius:50%;background:#08111f;
  transform-origin:center;transition:transform .3s cubic-bezier(.34,1.3,.5,1),width .3s,height .3s;
  animation:aiBlink 4.3s infinite;
}
.ai-face .ai-eye:nth-child(1){left:31.5%}
.ai-face .ai-eye:nth-child(2){left:56%;animation-delay:.14s}
@keyframes aiBlink{0%,92%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
/* idle：眼睛慢慢漂（自己動，跟滑鼠無關） */
.ai-face[data-mood="idle"] .ai-eyes{animation:aiDrift 6.6s ease-in-out infinite}
@keyframes aiDrift{
  0%,100%{transform:translate(0,0)}
  22%{transform:translate(2.6px,-1.3px)}
  49%{transform:translate(.8px,1.5px)}
  76%{transform:translate(-2.4px,-.7px)}
}
/* thinking：往上看、縮小 */
.ai-face[data-mood="thinking"] .ai-eyes{transform:translate(1px,-3px)}
.ai-face[data-mood="thinking"] .ai-eye{width:6px;height:10px}
/* happy：瞇眼笑 */
.ai-face[data-mood="happy"] .ai-eye{height:4.5px;width:8.5px;border-radius:5px}
.ai-face[data-mood="happy"] .ai-eyes{animation:aiHappyBounce .9s ease-in-out infinite}
@keyframes aiHappyBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
/* surprised：瞪大 */
.ai-face[data-mood="surprised"] .ai-eye{width:9.5px;height:15px}
/* confused：一高一低 */
.ai-face[data-mood="confused"] .ai-eye:nth-child(1){transform:translateY(-2.2px);height:10px}
.ai-face[data-mood="confused"] .ai-eye:nth-child(2){transform:translateY(1.8px);height:13.5px}
/* sleepy：半閉 */
.ai-face[data-mood="sleepy"] .ai-eye{height:2.6px;width:9px;border-radius:4px}
/* 頭像氣泡裡的尺寸由父容器決定；聊天氣泡的頭像本來就係細圓 */
.msg .ai-face,.pc-body .ai-face{border-radius:50%}

/* ═══ 載入動畫（彩色豎條；全站所有「正在…」自動套用） ═══ */
/* ═══ 白框小通知卡（macOS 三點） ═══
   之後要加「七天簽到」之類，直接 showNCard({title:'...',html:'...'}) 就彈出來。 */
/* ═══ 圖片檢視頁的下載按鈕（深色方塊，角落光暈） ═══ */
.dlb{position:absolute;top:18px;right:18px;width:47px;height:47px;border-radius:11px;
  background:linear-gradient(150deg,#33353b,#1c1e22);border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 9px 20px -6px rgba(0,0,0,.85);
  text-decoration:none;z-index:3;transition:transform .15s}
.dlb::after{content:'';position:absolute;inset:-45%;pointer-events:none;
  background:radial-gradient(circle at 28% 18%,rgba(140,170,255,.22),transparent 62%)}
.dlb svg{width:21px;height:21px;stroke:#cdd5e3;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:2}
.dlb:active{transform:scale(.94)}
.dlb-tip{position:absolute;top:70px;right:18px;font-size:11px;color:#9aa3b2;z-index:3;pointer-events:none}

/* ═══ 液態玻璃（liquidGlass）═══
   上一版只做了 backdrop-blur → 出來是「磨砂玻璃」，不像液態玻璃。
   真正像 Apple Liquid Glass 要靠三樣東西，缺一不可：
     ① 6 層 inset 陰影：兩對對角（2px 與 6px）造出「玻璃有厚度」的邊緣高光
     ② 45° 對角漸層反光（::after）：左上、右下各一道白光，這就是「鏡面」
     ③ border:double 雙線邊：看起來像玻璃斷面，單線邊會很塑膠
   背景必須幾乎透明（.045），否則看不見背後的光暈折射。 */
[data-lg]{
  position:relative;
  background:linear-gradient(140deg, rgba(130,170,255,.11), rgba(30,45,85,.16)) !important;
  -webkit-backdrop-filter:blur(14px) saturate(190%);
  backdrop-filter:blur(14px) saturate(190%);
  border:1px double rgba(155,195,255,.20) !important;
  box-shadow:
    inset 2px -2px 1px -1px rgba(175,208,255,.42),
    inset -2px 2px 1px -1px rgba(175,208,255,.42),
    inset 6px -6px 1px -6px rgba(175,208,255,.22),
    inset -6px 6px 1px -6px rgba(175,208,255,.22),
    inset 0 0 3px rgba(0,0,0,.5),
    0 8px 24px -10px rgba(0,0,0,.62) !important;
}
[data-lg]::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:linear-gradient(45deg,
    rgba(190,220,255,.20) 0%, rgba(190,220,255,.06) 10%,
    transparent 28%, transparent 72%,
    rgba(190,220,255,.06) 90%, rgba(190,220,255,.20) 100%);
  mix-blend-mode:screen;
}
/* 用 isolation 建層疊上下文，內容自然在反光層之上，不必逐個子元素設 z-index
   （之前用 `> *{position:relative}` 會破壞卡片內既有嘅絕對定位元素） */
[data-lg]{isolation:isolate}

/* 淺色主題：白光改成淡藍灰，否則白底上看不見 */
body.theme-light [data-lg]{
  background:rgba(255,255,255,.55) !important;
  border:1px double rgba(255,255,255,.95) !important;
  box-shadow:
    inset 2px -2px 1px -1px rgba(255,255,255,1),
    inset -2px 2px 1px -1px rgba(255,255,255,1),
    inset 6px -6px 1px -6px rgba(160,180,215,.55),
    inset -6px 6px 1px -6px rgba(160,180,215,.55),
    inset 0 0 2px rgba(15,23,42,.10),
    0 8px 24px -12px rgba(15,23,42,.35) !important;
}
body.theme-light [data-lg]::after{
  background:linear-gradient(45deg,
    rgba(255,255,255,.95) 0%, rgba(255,255,255,.4) 9%,
    transparent 28%, transparent 72%,
    rgba(255,255,255,.4) 91%, rgba(255,255,255,.95) 100%);
  mix-blend-mode:normal;
}

/* 列表行（個人主頁的分項）：只做淡玻璃，不套 6 層高光——
   一頁有二十幾行，每行都高光會非常吵。 */
.fp-body .pi[data-lg],.admin-user[data-lg]{
  background:rgba(255,255,255,.05) !important;
  border:1px solid rgba(255,255,255,.07) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10) !important;
  /* ⚠ 這裡刻意不加 backdrop-filter：後台一次有 147 個 .pi，
     每個都做 GPU 模糊會令舊手機直接卡死（實測要避免）。
     靠半透明底透出背景色，視覺上夠像玻璃片。 */
  backdrop-filter:none !important;-webkit-backdrop-filter:none !important;
}
.fp-body .pi[data-lg]::after,.admin-user[data-lg]::after{display:none !important}
body.theme-light .fp-body .pi[data-lg],body.theme-light .admin-user[data-lg]{
  background:rgba(255,255,255,.55) !important;
  border:1px solid rgba(255,255,255,.9) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,1) !important;
}

/* ═══ 關鍵：把「實色底」改成半透明，否則玻璃後面是死黑色，光暈透不出來 ═══
   掃描發現 .fullPage（所有全頁面容器）同 #chatBox 都是 rgb(15,23,42) 實色，
   蓋住 body 的三層光暈 → 所有子頁面睇落去都係「純黑」，玻璃等於白做。 */
.fullPage{background:rgba(11,16,28,.52) !important;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#chatBox{background:transparent !important}
.group-item{background:rgba(255,255,255,.045) !important;border:1px solid rgba(255,255,255,.07) !important}
body.theme-light .fullPage{background:rgba(255,255,255,.62) !important}
body.theme-light .group-item{background:rgba(255,255,255,.66) !important;border:1px solid rgba(255,255,255,.9) !important}

/* ═══ 淺色主題加強：之前偏「霧面白卡」，光暈同高光都要推高 ═══ */
body.theme-light{background:
    radial-gradient(62% 50% at 12% 4%, rgba(96,165,250,.42), transparent 70%),
    radial-gradient(56% 46% at 90% 90%, rgba(192,132,252,.34), transparent 70%),
    radial-gradient(48% 40% at 60% 48%, rgba(34,211,238,.20), transparent 76%),
    var(--bg-app);background-attachment:scroll}
body.theme-light [data-lg]{
  background:linear-gradient(140deg, rgba(255,255,255,.62), rgba(226,236,255,.46)) !important;
  border:1px double rgba(255,255,255,1) !important;
  box-shadow:
    inset 2px -2px 1px -1px rgba(255,255,255,1),
    inset -2px 2px 1px -1px rgba(255,255,255,1),
    inset 6px -6px 1px -6px rgba(120,150,210,.65),
    inset -6px 6px 1px -6px rgba(120,150,210,.65),
    inset 0 0 3px rgba(15,23,42,.12),
    0 10px 26px -14px rgba(15,23,42,.45) !important;
}
body.theme-light [data-lg]::after{
  background:linear-gradient(45deg,
    rgba(255,255,255,1) 0%, rgba(255,255,255,.55) 10%,
    transparent 30%, transparent 70%,
    rgba(255,255,255,.55) 90%, rgba(255,255,255,1) 100%);
}

/* ═══ 按鈕手感 ═══
   只加 transform 不夠——真正的「手感」是三段：
   按下（快速縮小 .955 + 壓暗）→ 放開（彈性曲線回彈，會輕微過衝）→ 静止。
   transition 用 1.5 過衝曲線，所以放手時會「彈一下」而不是死板地回到原位。 */
.btn-primary,.btn-ghost,.btn-ok,.btn-danger,.btn-warn,.nav-item,.av-opt,.about-item,.pi{
  transition:transform .24s cubic-bezier(.34,1.5,.5,1),box-shadow .2s ease,filter .18s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn-primary:active,.btn-ghost:active,.btn-ok:active,.btn-danger:active,.btn-warn:active{
  transform:scale(.955);
  filter:brightness(.9);
  transition-duration:.07s;
}
@media (prefers-reduced-motion:reduce){
  .btn-primary,.btn-ghost,.btn-ok,.btn-danger,.btn-warn{transition:none}
  .btn-primary:active,.btn-ghost:active,.btn-ok:active,.btn-danger:active,.btn-warn:active{transform:none;filter:none}
}

/* ═══ 按鈕玻璃化：保留主按鈕的藍色辨識度，只加玻璃高光 ═══ */
.btn-primary{
  background:linear-gradient(140deg, rgba(59,130,246,.62), rgba(37,99,235,.40)) !important;
  border:1px double rgba(170,205,255,.42) !important;
  box-shadow:
    inset 2px -2px 1px -1px rgba(220,235,255,.65),
    inset -2px 2px 1px -1px rgba(220,235,255,.65),
    inset 5px -5px 1px -5px rgba(220,235,255,.30),
    inset -5px 5px 1px -5px rgba(220,235,255,.30),
    inset 0 0 3px rgba(0,0,0,.35),
    0 6px 16px -8px rgba(0,0,0,.55) !important;
}
body.theme-light .btn-primary{
  background:linear-gradient(140deg, rgba(59,130,246,.88), rgba(37,99,235,.72)) !important;
  border:1px double rgba(255,255,255,.85) !important;
}
.btn-ghost,.btn-ok,.btn-danger,.btn-warn{
  border-width:1px !important;border-style:double !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.30),0 4px 12px -8px rgba(0,0,0,.5) !important;
}
body.theme-light .btn-ghost,body.theme-light .btn-ok{
  box-shadow:inset 0 1px 0 rgba(255,255,255,1),0 3px 10px -8px rgba(15,23,42,.4) !important;
}

/* 按鈕類做完整版（含折射內框） */
.btn-primary.btn-lg,[data-lgbtn]{
  --tr:25%;
  position:relative;overflow:hidden;isolation:isolate;
  background:rgba(255,255,255,.07) !important;
  border:1px double rgba(255,255,255,.16) !important;
  box-shadow:
    inset 2px -2px 1px -1px rgba(255,255,255,.85),
    inset -2px 2px 1px -1px rgba(255,255,255,.85),
    inset 6px -6px 1px -6px rgba(255,255,255,.45),
    inset -6px 6px 1px -6px rgba(255,255,255,.45),
    inset 0 0 2px rgba(0,0,0,.55),
    0 5px 14px -5px rgba(0,0,0,.6) !important;
}
[data-lgbtn]::before{
  content:'';position:absolute;z-index:1;top:35%;left:50%;transform:translateX(-50%);
  width:calc(100% - 10px);height:calc(100% - 10px);border-radius:inherit;
  border:1px solid rgba(0,0,0,.55);filter:blur(7px);pointer-events:none;
}
[data-lgbtn]::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:linear-gradient(45deg,rgba(255,255,255,.55) 0%,transparent var(--tr),transparent calc(100% - var(--tr)),rgba(255,255,255,.55) 100%);
  mix-blend-mode:screen;
}
[data-lgbtn] > *{position:relative;z-index:3}

/* ═══ 底部導航：玻璃膠囊滑動 ═══ */
#bottomNav{position:relative;isolation:isolate;background:rgba(13,19,33,.62)}
body.theme-light #bottomNav{background:rgba(252,253,255,.78)}
#navPill{position:absolute;top:5px;left:0;height:calc(100% - 10px);width:20%;border-radius:13px;
  background:linear-gradient(180deg,rgba(150,192,255,.38),rgba(110,150,235,.18));
  border:1px solid rgba(165,205,255,.46);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.72),inset 0 -1px 0 rgba(255,255,255,.12),0 5px 16px -6px rgba(0,0,0,.55);
  transition:transform .34s cubic-bezier(.34,1.28,.5,1),width .3s ease;
  pointer-events:none;z-index:2}
body.theme-light #navPill{background:linear-gradient(180deg,rgba(59,130,246,.20),rgba(59,130,246,.08));
  border:1px solid rgba(59,130,246,.26);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 3px 10px -6px rgba(15,23,42,.35)}
#bottomNav .nav-item{z-index:1}
/* 選中圖標：切換時彈一下（放大 → 回彈），比單純變色有生命 */
#bottomNav .nav-item.on{color:var(--text-main)}
#bottomNav .nav-item.on .nav-icon{animation:navPop .38s cubic-bezier(.34,1.56,.5,1)}
@keyframes navPop{
  0%{transform:scale(1) rotate(0)}
  42%{transform:scale(1.26) translateY(-3px) rotate(-5deg)}
  100%{transform:scale(1) translateY(0) rotate(0)}
}
@media (prefers-reduced-motion:reduce){#bottomNav .nav-item.on .nav-icon{animation:none}}

@keyframes ldrb{0%,100%{height:6px;opacity:.45}50%{height:20px;opacity:1}}
.ldr{display:inline-flex;align-items:flex-end;gap:3.5px;height:22px;vertical-align:middle;margin-right:9px}
.ldr i{display:block;width:3.5px;border-radius:2px;background:#4285f4;animation:ldrb 1.05s infinite ease-in-out}
.ldr i:nth-child(2){background:#34a853;animation-delay:.12s}
.ldr i:nth-child(3){background:#fbbc04;animation-delay:.24s}
.ldr i:nth-child(4){background:#4285f4;animation-delay:.36s}
.ldr i:nth-child(5){background:#ea4335;animation-delay:.48s}

/* ═══ 內凹軟質輸入框（全站，含登入頁） ═══
   做法：無邊框 + 雙向 inset 陰影（左上暗、右下亮）造出「凹落去」的錯覺。
   深色主題的亮面要很淡（.04），否則會變成一條白邊。 */
:root{--neu-in:inset 3px 3px 7px rgba(0,0,0,.45),inset -3px -3px 6px rgba(255,255,255,.045)}
body.theme-light{--neu-in:inset 3px 3px 9px rgba(0,0,0,.17),inset -3px -3px 9px rgba(255,255,255,1)}
input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]):not([type=color]):not([type=submit]):not([type=button]),
textarea{
  border:1px solid transparent !important;
  background:var(--bg-input) !important;
  box-shadow:var(--neu-in) !important;
  border-radius:999px !important;          /* 同 Uiverse 那個一樣，單行輸入框做膠囊 */
  transition:box-shadow .18s ease,background .18s ease;
}
textarea{border-radius:16px !important;box-shadow:var(--neu-in) !important;border:1px solid transparent !important;background:var(--bg-input) !important}
input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]):not([type=color]):not([type=submit]):not([type=button]):focus,
textarea:focus{
  box-shadow:var(--neu-in),0 0 0 2px rgba(59,130,246,.28) !important;
}
body.theme-light input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]):not([type=color]):not([type=submit]):not([type=button]):focus,
body.theme-light textarea:focus{
  box-shadow:var(--neu-in),0 0 0 2px rgba(37,99,235,.35) !important;
}
/* v1.38.23 UI 修正：淺色主題下「AI 模式／審核類型」選中的按鈕是橙字橙底，
   對比不足看不清；淺色時改用深橙棕字。 */

header{background:var(--bg-header);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);flex-shrink:0;min-height:46px}
header .title{font-size:14px;font-weight:600;white-space:nowrap;flex-shrink:0}
header .right{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-sub);flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.ver{background:rgba(56,189,248,.15);color:var(--info);padding:3px 7px;border-radius:var(--r-1);font-size:10.5px;font-weight:600}
.hbtn{background:rgba(148,163,184,.15);color:var(--text-main);border:none;padding:6px 10px;border-radius:var(--r-1);font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;position:relative}
.hbtn:hover{background:rgba(148,163,184,.3)}
@media(max-width:520px){header{padding:6px 8px}header .title{font-size:13px}.hbtn{font-size:11px;padding:5px 8px}}
#noticeBar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(251,191,36,.12);border-bottom:1px solid rgba(251,191,36,.25);flex-shrink:0;font-size:13px;cursor:pointer}
body.theme-light #noticeBar{background:rgba(251,191,36,.15)}
#noticeBar .notice-icon{color:var(--gold);font-size:14px;flex-shrink:0;font-weight:700}
#noticeBar .notice-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#noticeBar .notice-text .label{color:var(--gold);font-weight:600;margin-right:6px}
#noticeBar .notice-add{background:#fbbf24;color:#1c1917;border:none;width:32px;height:32px;border-radius:var(--r-1);font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#noticeBar .notice-pin-count{background:rgba(251,191,36,.3);color:var(--gold);padding:2px 8px;border-radius:var(--r-1);font-size:11px;font-weight:600;flex-shrink:0}
#classStatus{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 12px;background:rgba(30,41,59,.5);border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text-sub);flex-shrink:0}
body.theme-light #classStatus{background:rgba(255,255,255,.7)}
#classStatus .online{color:var(--ok-tx);font-weight:600}
#searchBar{display:flex;gap:8px;padding:8px 12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center}
#searchInput{flex:1;padding:8px 12px;border-radius:var(--r-3);border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:13px;outline:none;font-family:inherit}
#chatBox{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg-app);position:relative}
#chatBox::-webkit-scrollbar{width:6px}
#chatBox::-webkit-scrollbar-thumb{background:rgba(148,163,184,.3);border-radius:var(--r-0)}
#scrollToBottomBtn{position:absolute;right:18px;bottom:18px;width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:20;transition:opacity var(--dur-2),transform var(--dur-2);opacity:0;pointer-events:none;transform:translateY(8px)}
#scrollToBottomBtn.show{opacity:1;pointer-events:auto;transform:translateY(0)}
#scrollToBottomBtn:hover{transform:translateY(-2px)}
.msg{max-width:75%;display:flex;gap:10px;align-items:flex-start;position:relative}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;user-select:none;overflow:hidden;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.deleted img,.avatar.deleted{filter:grayscale(100%);opacity:.6}
.bubble-wrap{display:flex;flex-direction:column;gap:3px;position:relative;min-width:0}
.msg.me .bubble-wrap{align-items:flex-end}
.meta{font-size:11px;color:var(--text-muted);padding:0 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta .msgid{color:var(--text-muted);font-size:10px;font-family:monospace}
.meta .class-tag{background:rgba(56,189,248,.18);color:var(--info);padding:1px 5px;border-radius:var(--r-0);font-size:10px;font-weight:600}
.meta .enc-tag{background:rgba(220,38,38,.2);color:var(--warn-tx);padding:1px 6px;border-radius:var(--r-0);font-size:10px;font-weight:600}
.meta .ai-tag{background:rgba(102,204,255,.25);color:var(--ai);padding:1px 6px;border-radius:var(--r-0);font-size:10px;font-weight:700}
.bubble{padding:9px 13px;border-radius:var(--r-2);font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap;color:#fff;max-width:100%}
/* 轉賬／紅包係「裸卡片」，唔應該再有外層氣泡的底色、內距、圓角
   （否則會見到紫色框住個橙卡，完全唔似微訊） */
.bubble.card-bubble{padding:0!important;background:transparent!important;border-radius:0!important;
  box-shadow:none!important;border:none!important}
.msg.me .bubble{border-bottom-right-radius:4px}
.msg:not(.me) .bubble{border-bottom-left-radius:4px}
.bubble .mention{background:rgba(255,255,255,.25);padding:1px 5px;border-radius:var(--r-0);font-weight:600}
.bubble img.msg-img{max-width:220px;max-height:220px;border-radius:var(--r-1);display:block;cursor:pointer;margin-top:4px}
.bubble .file-msg{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.bubble .file-msg .fi{font-size:16px;font-weight:700}
.bubble .file-msg .fn{font-size:13px;word-break:break-all;flex:1}
.bubble .file-msg .fs{font-size:11px;opacity:.8}
.bubble .voice-msg{display:flex;align-items:center;gap:10px;padding:4px 0;cursor:pointer;min-width:120px}
.bubble .voice-msg .vi{font-size:14px;font-weight:700;display:flex;align-items:center}
.voice-msg .vi .ico{width:1.25em;height:1.25em}
.bubble .voice-msg .vt{font-size:13px}
.bubble .voice-msg .vp{flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.bubble .voice-msg .vp>div{height:100%;width:0;background:#fff;transition:width var(--dur-1)}
.bubble .voice-msg .vd{width:8px;height:8px;border-radius:50%;background:#f87171;flex-shrink:0}
.bubble .voice-msg.played .vd{display:none}
.bubble .loc-msg{cursor:pointer;max-width:100%}
.bubble .loc-msg .lm-map{position:relative;width:220px;max-width:100%;aspect-ratio:220/150;height:auto;
  border-radius:var(--r-1);overflow:hidden;background:#222;margin-bottom:6px}
/* 圖磚層固定 220×150 並置中：卡片窄過 220 都只是左右裁邊，正中央仍然是發送位置 */
.bubble .loc-msg .lm-in{position:absolute;left:50%;top:50%;width:220px;height:150px;transform:translate(-50%,-50%)}
.bubble .loc-msg .lm-map .lm-t{position:absolute;width:256px;height:256px;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.bubble .loc-msg .lm-pin{position:absolute;left:50%;top:50%;width:15px;height:15px;margin:-8px 0 0 -8px;border-radius:50%;background:#3b82f6;border:2.5px solid #fff;box-sizing:border-box;box-shadow:0 0 0 1px rgba(15,23,42,.22),0 4px 10px rgba(15,23,42,.35)}
.bubble .loc-msg .lm-label{font-size:12px;display:flex;align-items:center;gap:4px}
.bubble .ai-sponsor{display:block;margin-top:8px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.3);font-size:10.5px;opacity:.75;font-style:italic}
.msg-tools{display:flex;gap:4px;margin-top:2px;opacity:0;flex-wrap:wrap}
.msg:hover .msg-tools{opacity:1}
.msg-tools button{background:rgba(148,163,184,.15);color:var(--text-sub);border:none;padding:2px 7px;border-radius:var(--r-1);font-size:10.5px;cursor:pointer;font-family:inherit}
.msg-tools button:hover{background:rgba(148,163,184,.3);color:var(--text-main)}
.msg-tools button.danger:hover{background:rgba(220,38,38,.3);color:var(--warn-tx)}
/* ═══ v1.36 名冊姓名 + 訊息操作彈窗 ═══
   訊息上不再一直掛著編號、舉報、管理刪除（太亂、也容易被誤按）；
   改成「點一下那則訊息」才彈出來。 */
.meta .meta-realname{margin-left:6px;font-size:10.5px;font-weight:600;color:var(--text-sub);border:1px solid var(--border-strong);border-radius:var(--r-0);padding:0 4px}
.realname-card{background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--r-2);padding:10px 14px;margin:0 0 6px}
.realname-card .rn-row{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.realname-card .rn-row+.rn-row{border-top:1px solid var(--border)}
.realname-card .rn-label{flex:0 0 62px;font-size:12px;color:var(--text-sub)}
.realname-card .rn-val{flex:1;font-size:14px;font-weight:600;color:var(--text-main);word-break:break-word}
.msg[data-msgid]{cursor:pointer}
#msgMenu{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:200}
#msgMenu .mm-card{width:100%;max-width:520px;margin:0 auto;background:var(--bg-card);border-radius:var(--r-3) var(--r-3) 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.4,0,.2,1)}
#msgMenu .mm-head{font-size:13px;font-weight:700;color:var(--text-main);margin-bottom:8px}
#msgMenu .mm-id{font-size:11.5px;font-family:monospace;color:var(--text-sub);background:var(--bg-input);border:1px solid var(--border-strong);border-radius:var(--r-1);padding:8px 10px;margin-bottom:8px;word-break:break-all}
#msgMenu .mm-btn{display:block;width:100%;text-align:left;background:var(--bg-input);border:1px solid var(--border-strong);color:var(--text-main);border-radius:var(--r-2);padding:12px 14px;font-size:14.5px;font-family:inherit;cursor:pointer;margin-top:7px}
#msgMenu .mm-btn:hover{background:rgba(148,163,184,.18)}
#msgMenu .mm-btn.danger{color:var(--warn-tx);border-color:rgba(248,113,113,.4)}
#msgMenu .mm-btn.danger:hover{background:rgba(220,38,38,.18)}
#msgMenu .mm-btn.ghost{background:transparent;color:var(--text-sub)}
.msg-checking{font-size:10.5px;color:var(--gold);padding:2px 6px;font-style:italic}
#inputBar{padding:10px 12px 4px;background:var(--bg-card);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-shrink:0;position:relative;flex-wrap:wrap}
#micBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#micBtn.recording{background:#dc2626;color:#fff}
#msgInput{flex:1;padding:11px 14px;border-radius:var(--r-3);border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);font-size:14px;outline:none;font-family:inherit;min-width:0}
#plusBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:22px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#sendBtn{width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#aiRoundBtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(148,163,184,.15);color:var(--text-main);font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#aiRoundBtn.on{background:#66ccff;color:#0f172a}
#encToggle{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-sub);padding:4px 8px;border-radius:var(--r-1);border:1px solid var(--border-strong);background:var(--bg-input);cursor:pointer;user-select:none;flex-shrink:0}
#encToggle.active{background:rgba(220,38,38,.2);border-color:#dc2626;color:var(--warn-tx)}
#encToggle input{display:none}
#encToggle .dot-check{width:10px;height:10px;border-radius:50%;border:2px solid var(--border-strong)}
#encToggle.active .dot-check{background:#dc2626;border-color:#dc2626}
#bottomNav{display:flex;background:var(--bg-card);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
#bottomNav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;cursor:pointer;gap:2px;color:var(--text-sub);font-size:11px;border:none;background:none;font-family:inherit;position:relative}
#bottomNav .nav-item:hover{background:rgba(148,163,184,.08);color:var(--text-main)}
#bottomNav .nav-item .nav-icon{font-size:18px;line-height:1}
#bottomNav .nav-item .nav-badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;background:#ef4444;color:#fff;border-radius:var(--r-1);font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
/* plusPanel 實色：原本 background 用 --bg-card（rgba(30,41,59,.55) 半透明），壓在 --bg-app #0f172a 上面顏色幾乎一樣，用戶睇唔出有面板。改成實色 + 明顯邊框 + 玻璃模糊。 */
/* ═══ 彈層（轉賬 / 紅包用）═══
   ⚠ chat.html 本身冇 .sheet 樣式（嗰個係 game.html 嘅）。
   我加轉賬/紅包時直接用了 className='sheet'，結果只係一個裸 div，
   被擠到頁面最底，用戶點完完全見唔到嘢。下面補齊。 */
.sheet{position:fixed;inset:0;z-index:9996;background:rgba(0,0,0,.62);
  display:flex;align-items:center;justify-content:center;padding:22px;
  animation:sheetFade .22s ease}
@keyframes sheetFade{from{opacity:0}to{opacity:1}}
.sheet .inner{width:100%;max-width:340px;background:#1e293b;border:1px solid rgba(148,163,184,.28);
  border-radius:22px;padding:20px 18px;box-shadow:0 26px 64px -22px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.05);
  animation:sheetPop .3s cubic-bezier(.34,1.4,.5,1);max-height:88vh;overflow-y:auto}
body.theme-light .sheet{background:rgba(15,23,42,.42)}
body.theme-light .sheet .inner{background:#ffffff;border-color:rgba(15,23,42,.12);
  box-shadow:0 26px 64px -22px rgba(15,23,42,.35)}
@keyframes sheetPop{from{transform:scale(.9) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.sheet .inner h3{font-size:16.5px;margin:0 0 7px;color:var(--text-main);font-weight:800}
.sheet .desc{font-size:12px;color:var(--text-sub);margin:0 0 12px;line-height:1.7}
.sheet .inner .btn{display:block;width:100%;margin-top:9px;padding:11px;border-radius:13px;border:none;
  font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;background:rgba(148,163,184,.18);color:var(--text-main)}
.sheet .inner .btn:active{transform:scale(.97)}
.sheet .inner .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-sub)}
.sheet .inner input,.sheet .inner select{color-scheme:dark}
body.theme-light .sheet .inner input,body.theme-light .sheet .inner select{color-scheme:light}

#plusPanel{position:absolute;bottom:calc(100% + 8px);left:12px;background:#1e293b;border:1px solid rgba(148,163,184,.38);border-radius:var(--r-3);padding:14px;display:grid;grid-template-columns:repeat(3,72px);gap:12px;box-shadow:0 18px 48px -14px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.05),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:50;animation:panelIn .34s cubic-bezier(.34,1.42,.64,1)}
body.theme-light #plusPanel{background:#ffffff;border-color:rgba(15,23,42,.16);box-shadow:0 18px 48px -14px rgba(15,23,42,.30),0 0 0 1px rgba(15,23,42,.04)}
@keyframes panelIn{0%{opacity:0;transform:translateY(10px) scale(.94)}62%{opacity:1;transform:translateY(-2px) scale(1.012)}100%{opacity:1;transform:none}}
#plusPanel .pi{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:8px;border-radius:var(--r-2)}
#plusPanel .pi:hover{background:rgba(56,189,248,.15)}
#plusPanel .pi .pic{width:44px;height:44px;border-radius:var(--r-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:rgba(56,189,248,.22);border:1px solid rgba(56,189,248,.30);color:var(--info)}
.pic .ico{width:22px;height:22px}
#plusPanel .pi .pit{font-size:11px;color:var(--text-sub)}
/* ===== 小遊戲 ===== */
#gamesOverlay{position:fixed;inset:0;background:#0b0d14;z-index:200;animation:panelIn .34s cubic-bezier(.34,1.42,.64,1)}
#gamesOverlay iframe{width:100%;height:100%;border:0;display:block;outline:none}
.game-invite{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.28);border-radius:var(--r-2);padding:10px 12px;cursor:pointer}
.game-invite .gi-title{font-size:14.5px;font-weight:700;margin-bottom:3px}
.game-invite .gi-sub{font-size:12px;opacity:.85;margin-bottom:9px}
.game-invite .gi-btn{display:inline-block;background:rgba(255,255,255,.9);color:#0b0d14;font-size:12.5px;font-weight:700;border-radius:var(--r-1);padding:5px 12px}
.game-invite.done{opacity:.55;cursor:default;border-style:dashed}
.game-invite.done .gi-sub{opacity:.9}
.gi-copy{display:block;margin-top:7px;background:transparent;border:1px solid rgba(255,255,255,.32);color:inherit;font-size:11.5px;border-radius:var(--r-1);padding:4px 10px;cursor:pointer;opacity:.9;font-family:inherit}
.gi-copy:active{transform:scale(.96)}
#mentionPopup{position:absolute;bottom:100%;left:12px;right:12px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--r-2);max-height:220px;overflow-y:auto;box-shadow:0 -8px 24px rgba(0,0,0,.5);margin-bottom:6px}
#mentionPopup .mention-item{padding:10px 14px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:10px}
#mentionPopup .mention-item:hover{background:rgba(56,189,248,.15)}
#mentionPopup .mention-item .mi-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden}
#mentionPopup .mention-item .mi-av img{width:100%;height:100%;object-fit:cover}
.empty{text-align:center;color:var(--text-muted);padding:40px 0;font-size:14px}
.fullPage{position:fixed;inset:0;background:var(--bg-app);z-index:100;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.fullPage .fp-header{padding:12px 16px;display:flex;align-items:center;gap:12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0}
.fullPage .fp-back{background:rgba(148,163,184,.15);color:var(--text-main);border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
.fullPage .fp-title{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fullPage .fp-body{flex:1;min-height:0;overflow-y:auto}

/* ═══ v1.38.1 小工具用「頁內 iframe」打開，不是跳頁 ═══
   以前用 window.open，手機上被攔就 fallback 去 location.href，整個聊天室被導走；
   在某些內建瀏覽器／WebView 更會彈回個人主頁，而且每次按都再彈一次。
   改成蓋一層 iframe：不導航、不開分頁、聊天室狀態完全唔會掉。 */
.tool-frame{position:fixed;inset:0;z-index:300;background:var(--bg-app);display:flex;flex-direction:column;
  height:100vh;height:100dvh;animation:tfIn .22s var(--ease-out)}
@keyframes tfIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tool-frame .tf-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg-card);
  border-bottom:1px solid var(--border);flex-shrink:0;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.tool-frame .tf-back{background:rgba(148,163,184,.15);color:var(--text-main);border:none;width:38px;height:38px;
  border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tool-frame .tf-back:active{transform:scale(.94)}
.tool-frame .tf-title{font-size:16px;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool-frame .tf-open{background:none;border:1px solid var(--border);color:var(--text-sub);border-radius:10px;
  padding:7px 10px;font-size:12px;cursor:pointer;font-family:inherit;flex-shrink:0}

/* ═══ v1.12 進退場動畫 ═══
   安卓版每次離開畫面都有轉場，網頁版原本是「啪」一聲直接消失。
   這裡把所有會離開畫面的東西都補上動畫：頁面向右滑走、上一層從左邊推回來。 */
@keyframes pageOutRight{from{opacity:1;transform:none}to{opacity:.28;transform:translateX(62%) scale(.94)}}
@keyframes pageInRight{from{opacity:0;transform:translateX(34%) scale(.975)}to{opacity:1;transform:none}}
@keyframes pageInLeft{from{opacity:.45;transform:translateX(-24%) scale(.955)}to{opacity:1;transform:none}}
@keyframes ovOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.04)}}
@keyframes ovIn{0%{opacity:0;transform:scale(1.06)}68%{transform:scale(.992)}100%{opacity:1;transform:none}}
@keyframes barIn{0%{opacity:0;transform:translateY(28px) scale(.96)}64%{transform:translateY(-3px) scale(1.008)}100%{opacity:1;transform:none}}
@keyframes barOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(22px) scale(.95)}}
@keyframes zoomOutImg{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.87)}}
@keyframes panelOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(8px) scale(.95)}}
@keyframes notifIn{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes notifOut{from{opacity:1;transform:translateX(-50%) translateY(0)}to{opacity:0;transform:translateX(-50%) translateY(-12px)}}
.anim-in-page{animation:pageInRight .34s cubic-bezier(.32,.72,0,1) both}
.anim-in-back{animation:pageInLeft .34s cubic-bezier(.32,.72,0,1) both}
.anim-in-modal{animation:ovIn .34s cubic-bezier(.34,1.42,.64,1) both}
.anim-in-bar{animation:barIn .36s cubic-bezier(.34,1.42,.64,1) both}
.anim-in-notif{animation:notifIn .24s cubic-bezier(.32,.72,0,1) both}
/* 退場一律加 !important，也一律排在進場之後：
   否則同一個元素同時掛著進場與退場 class 時，會由「樣式表順序」而不是「後加的 class」決定，
   進場動畫會蓋掉退場動畫（#plusPanel 這種 ID 選擇器更是直接壓過 class）。
   這些 class 只存在幾百毫秒，用完就移除，用 !important 沒有副作用。 */
.anim-out-page{animation:pageOutRight .3s cubic-bezier(.32,.72,0,1) forwards!important;will-change:transform,opacity;pointer-events:none!important}
.anim-out-overlay{animation:ovOut .2s ease forwards!important;pointer-events:none!important}
.anim-out-modal{animation:ovOut .24s cubic-bezier(.32,.72,0,1) forwards!important;pointer-events:none!important}
.anim-out-bar{animation:barOut .22s cubic-bezier(.32,.72,0,1) forwards!important;pointer-events:none!important}
.anim-out-zoom{animation:zoomOutImg .2s ease forwards!important;pointer-events:none!important}
.anim-out-panel{animation:panelOut .16s ease forwards!important;pointer-events:none!important}
.anim-out-notif{animation:notifOut .22s ease forwards!important;pointer-events:none!important}
@media (prefers-reduced-motion: reduce){
  .anim-out-page,.anim-in-page,.anim-in-back,.anim-out-overlay,.anim-out-modal,.anim-in-modal,
  .anim-out-bar,.anim-in-bar,.anim-out-zoom,.anim-out-panel,.anim-in-notif,.anim-out-notif{animation-duration:.01ms!important}
}

.gomrassen::before,.gomrassen::after{content:"";position:absolute;border-radius:inherit;box-shadow:inset 0 0 .063em rgb(140,162,169);background:rgb(184,196,200)}
.gomrassen::before{left:.313em;top:.313em;width:.438em;height:.438em}
.gomrassen::after{width:.25em;height:.25em;left:1.25em;top:.75em}
.hermes{left:3.438em;width:.625em;height:.625em;box-shadow:0 0 .125em #ffffff52,0 0 .125em #6e8ea24b;transition:top var(--dur-3) ease}
.chenini{left:4.375em;width:.5em;height:.5em;box-shadow:0 0 .125em #ffffff52,0 0 .125em #6e8ea24b;transition:top var(--dur-4) ease}
.tatto-1,.tatto-2{position:absolute;width:1.25em;height:1.25em;border-radius:var(--radius);transition:top var(--dur-3) ease}
.tatto-1{background:#fefefe;right:3.125em;top:.625em;box-shadow:0 0 .438em #fdf4e1}
.tatto-2{background:linear-gradient(#e6ac5c,#d75449);right:1.25em;top:2.188em;box-shadow:0 0 .438em #e6ad5c3d,0 0 .438em #d755494f;transition:top var(--dur-3) ease}
.bb8-toggle__star{position:absolute;width:.063em;height:.063em;background:#fff;border-radius:var(--radius);filter:drop-shadow(0 0 .063em #fff);color:#fff;top:100%;transition:top var(--dur-3) ease}
.bb8-toggle__star:nth-child(1){left:3.75em;box-shadow:1.25em .938em,-1.25em 2.5em,0 1.25em,1.875em .625em,-3.125em 1.875em,1.25em 2.813em;transition:top var(--dur-3) ease}
.bb8-toggle__star:nth-child(2){left:4.688em;box-shadow:.625em 0,0 .625em,-.625em -.625em,.625em .938em,-3.125em 1.25em,1.25em -1.563em;transition:top var(--dur-3) ease}
.bb8-toggle__star:nth-child(3){left:5.313em;box-shadow:-.625em -.625em,-2.188em 1.25em,-2.188em 0,-3.75em -.625em,-3.125em -.625em,-2.5em -.313em,.75em -.625em;transition:top var(--dur-3) ease}
.bb8-toggle__star:nth-child(4){left:1.875em;width:.125em;height:.125em;transition:top var(--dur-4) ease}
.bb8-toggle__star:nth-child(5){left:5em;width:.125em;height:.125em;transition:top var(--dur-4) ease}
.bb8-toggle__star:nth-child(6){left:2.5em;width:.125em;height:.125em;transition:top var(--dur-4) ease}
.bb8-toggle__star:nth-child(7){left:3.438em;width:.125em;height:.125em;transition:top var(--dur-4) ease}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8-toggle__star:nth-child(1){top:.625em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8-toggle__star:nth-child(2){top:1.875em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8-toggle__star:nth-child(3){top:1.25em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8-toggle__star:nth-child(4){top:3.438em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8-toggle__star:nth-child(5){top:3.438em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8-toggle__star:nth-child(6){top:.313em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8-toggle__star:nth-child(7){top:1.875em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8-toggle__cloud{right:-100%}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .gomrassen{top:.938em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .hermes{top:2.5em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .chenini{top:2.75em}
.bb8-toggle__checkbox:checked + .bb8-toggle__container{background-position-y:0}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .tatto-1,.bb8-toggle__checkbox:checked + .bb8-toggle__container .tatto-2{top:100%}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8{left:calc(100% - var(--bb8-diameter) - var(--toggle-offset))}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8__shadow{left:calc(100% - var(--bb8-diameter) - var(--toggle-offset) + .938em);transform:skew(70deg)}
.bb8-toggle__checkbox:checked + .bb8-toggle__container .bb8__body{transform:rotate(225deg)}

.admin-feedback .af-body{font-size:13px;line-height:1.6;color:var(--text-main);padding:10px;background:rgba(0,0,0,.15);border-radius:var(--r-1);margin-top:8px;word-break:break-word}
.admin-feedback .af-time{font-size:11px;color:var(--text-muted);margin-top:6px}
.admin-feedback .af-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.admin-feedback .af-actions button{flex:1;min-width:80px;padding:8px;border:none;border-radius:var(--r-1);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
/* ===== v1.10 錄音遮罩 ===== */
#recordingOverlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;backdrop-filter:blur(2px);animation:fadeInOv .18s ease}
#recordingOverlay .rec-timer{font-size:52px;font-weight:700;font-family:Consolas,monospace;letter-spacing:2px}
#recordingOverlay .rec-wave{display:flex;align-items:flex-end;gap:4px;height:46px;margin-top:18px}
#recordingOverlay .rec-wave span{width:5px;border-radius:var(--r-0);background:#f87171;animation:recWave 1s ease-in-out infinite}
#recordingOverlay .rec-wave span:nth-child(1){animation-delay:0s}
#recordingOverlay .rec-wave span:nth-child(2){animation-delay:.1s}
#recordingOverlay .rec-wave span:nth-child(3){animation-delay:.2s}
#recordingOverlay .rec-wave span:nth-child(4){animation-delay:.3s}
#recordingOverlay .rec-wave span:nth-child(5){animation-delay:.4s}
#recordingOverlay .rec-hint{font-size:14px;margin-top:20px;opacity:.85}
#recordingOverlay .rec-hint .rec-cancel-tip{color:var(--warn-tx);font-weight:700}
#recordingOverlay.cancel .rec-wave span{background:#94a3b8}
#recordingOverlay.cancel .rec-timer{color:var(--warn-tx)}
@keyframes recWave{0%,100%{height:8px}50%{height:40px}}
@keyframes fadeInOv{from{opacity:0}to{opacity:1}}
/* ===== v1.10 公告輪播 ===== */
#noticeFullscreen .car-stage{flex:1;min-height:0;display:flex;align-items:center;overflow-x:auto;scroll-snap-type:x mandatory;gap:16px;padding:20px 12vw;scrollbar-width:none}
#noticeFullscreen .car-stage::-webkit-scrollbar{display:none}
#noticeFullscreen .car-card{flex:0 0 70vw;max-width:520px;background:var(--bg-card);color:var(--text-main);border-radius:var(--r-3);padding:20px;scroll-snap-align:center;overflow-y:auto;max-height:75vh;border:1px solid var(--border);box-shadow:0 8px 30px rgba(0,0,0,.25);transform:scale(.92);opacity:.55;transition:transform var(--dur-3) cubic-bezier(.4,0,.2,1),opacity var(--dur-3) ease}
#noticeFullscreen .car-card.active{transform:scale(1);opacity:1}
#noticeFullscreen .car-card h3{font-size:15px;color:var(--gold);margin-bottom:10px}
#noticeFullscreen .car-card .car-content{font-size:14px;line-height:1.7;word-break:break-word}
#noticeFullscreen .car-actions{padding:14px 20px;border-top:1px solid var(--border);background:var(--bg-card);display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}
#noticeFullscreen .car-actions button{flex:1;min-width:100px;padding:10px;border-radius:var(--r-1);border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
#noticeFullscreen .car-progress{text-align:center;font-size:12px;color:var(--text-sub);padding:8px 0}
#noticeFullscreen .car-nav{display:flex;justify-content:center;gap:10px;padding:0 0 6px}
#noticeFullscreen .car-nav button{background:rgba(148,163,184,.18);color:var(--text-main);border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;font-family:inherit}
#noticeFullscreen .car-nav button:hover{background:rgba(148,163,184,.35)}
/* ===== v1.10 投票 ===== */
.poll-box{min-width:min(240px,100%);max-width:100%;display:flex;flex-direction:column;gap:10px}
.poll-title{font-size:16px;font-weight:700;line-height:1.4;word-break:break-word}
.poll-options{display:flex;flex-direction:column;gap:8px}
.poll-opt{position:relative;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-1);background:rgba(255,255,255,.12);cursor:pointer;overflow:hidden;user-select:none;transition:background var(--dur-2) ease}
.poll-opt:hover{background:rgba(255,255,255,.2)}
.poll-opt.disabled{cursor:default}
.poll-opt.disabled:hover{background:rgba(255,255,255,.12)}
.poll-opt .poll-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.22);width:0;transition:width var(--dur-3) cubic-bezier(.4,0,.2,1);z-index:0}
.poll-opt .poll-circle{position:relative;z-index:1;width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.7);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.poll-opt .poll-square{position:relative;z-index:1;width:18px;height:18px;border-radius:var(--r-0);border:2px solid rgba(255,255,255,.7);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.poll-opt.selected .poll-circle,.poll-opt.selected .poll-square{background:#fff;border-color:#fff;color:#1c1e21}
.poll-opt .poll-text{position:relative;z-index:1;flex:1;font-size:13.5px;line-height:1.4;word-break:break-word}
.poll-opt .poll-pct{position:relative;z-index:1;font-size:12px;font-weight:700;opacity:.95;flex-shrink:0}
.poll-footer{font-size:11.5px;opacity:.85;display:flex;flex-direction:column;gap:3px}
.poll-end{color:var(--warn-tx);font-weight:600}
.poll-confirm{background:rgba(255,255,255,.9);color:#1c1e21;border:none;padding:7px 12px;border-radius:var(--r-1);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;align-self:flex-start}
body.theme-light .poll-opt{background:rgba(0,0,0,.06)}
body.theme-light .poll-opt:hover{background:rgba(0,0,0,.1)}
body.theme-light .poll-opt .poll-fill{background:rgba(59,130,246,.22)}
body.theme-light .poll-opt .poll-circle,body.theme-light .poll-opt .poll-square{border-color:rgba(0,0,0,.35);color:#1c1e21}
body.theme-light .poll-opt.selected .poll-circle,body.theme-light .poll-opt.selected .poll-square{background:#3b82f6;border-color:#3b82f6;color:#fff}
body.theme-light .poll-confirm{background:#3b82f6;color:#fff}
/* ===== 痕跡地圖（網頁版） ===== */
#trailMapScreen{position:fixed;inset:0;background:var(--bg-app);z-index:360;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
#trailMapScreen .tm-header{padding:12px 16px;display:flex;align-items:center;gap:12px;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0}
#trailMapScreen .tm-back{background:rgba(148,163,184,.15);color:var(--text-main);border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}
#trailMapScreen .tm-title{font-size:16px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#trailMapScreen .tm-body{position:relative;flex:1;min-height:0;overflow:hidden;background:#0e1016;touch-action:none;cursor:grab}
#trailMapScreen .tm-body.dragging{cursor:grabbing}
#trailMapScreen canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#trailMapScreen .tm-actions{position:absolute;right:12px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:5}
#trailMapScreen .tm-btn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(24,27,35,.9);color:#e8ecf3;font-size:16px;line-height:1;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#trailMapScreen .tm-btn:active{transform:scale(.94)}
#trailMapScreen .tm-btn.on{background:#3b82f6;border-color:#3b82f6;color:#fff}
#trailMapScreen .tm-info{position:absolute;left:12px;bottom:16px;max-width:60%;padding:8px 12px;border-radius:var(--r-2);background:rgba(24,27,35,.9);color:var(--text-sub);font-size:12px;line-height:1.55;z-index:5;border:1px solid rgba(255,255,255,.1)}
#trailMapScreen .tm-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:30px;color:var(--text-sub);font-size:13.5px;z-index:6;pointer-events:none}
#trailMapScreen .tm-empty b{font-size:15px;color:#fff}

/* v1.35 圖標系統：內嵌 SVG，24×24、stroke 2、顏色跟著文字（來源風格 Reicon.dev／Lucide，MIT） */
.ico{width:1.15em;height:1.15em;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
.ico-lg{width:1.5em;height:1.5em;vertical-align:-.3em}
.wc-ico .ico{width:1.05em;height:1.05em;vertical-align:-.14em}
.nav-icon .ico{width:1.25em;height:1.25em;vertical-align:0}

/* v1.37 積分系統：預留欄位，只顯示 users/{u}/points（沒有加減方法，所有人都是 0）
   ---------------------------------------------------------------------------
   以前手機版是另一顆 position:fixed 的 chip（right:12px;bottom:78px），
   它正好疊在輸入列的「送出」按鈕上 —— elementFromPoint 問下去回傳的是 scoreBottom，
   也就是說手機版根本按不到送出。現在只留標題列那一顆（桌機／手機都是它）：
   標題列本來就會 flex-wrap，擠不下時整組換行，不會蓋住任何按鈕。 */
.score-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;
  font-size:12px;font-weight:600;color:var(--gold);background:rgba(226,176,74,.12);
  border:1px solid rgba(226,176,74,.3);vertical-align:middle;flex:0 0 auto;white-space:nowrap;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.score-chip .ico{width:1.05em;height:1.05em}
/* 舊的手機版浮動 chip：保留節點（只加不刪），但永遠不顯示 */
.score-chip-fixed{display:none !important}
@media (max-width:600px){.score-chip{font-size:11px;padding:2px 7px}}

/* ══ v1.38.10 積分中心／兌換碼／積分商店 ══════════════════════════════
   兌換碼由超級管理員在後台建立，一經任何人使用即永久失效。
   積分商店由管理員上架，學生用積分兌換，庫存扣完即下架。
   整個兌換介面自成一頁（不是彈窗），因為要放輸入框、商品清單和紀錄。 */
.realname-card .rn-row.rn-click{cursor:pointer;border-radius:var(--r-1);margin:0 -6px;padding-left:6px;padding-right:6px;transition:background var(--dur-1) var(--ease-out)}
.realname-card .rn-row.rn-click:hover{background:rgba(148,163,184,.09)}
.realname-card .rn-row.rn-click:active{background:rgba(148,163,184,.16)}
.rn-go{display:inline-flex;align-items:center;gap:4px;color:var(--text-muted);font-size:12px;font-weight:600}
.rn-go .ico{width:1em;height:1em}
.pt-hero{position:relative;overflow:hidden;border-radius:var(--r-3);padding:20px 18px;margin:0 0 16px;
  background:linear-gradient(135deg,rgba(251,191,36,.16),rgba(139,92,246,.16));
  border:1px solid rgba(251,191,36,.28)}
.pt-hero::after{content:'';position:absolute;right:-50px;top:-70px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(251,191,36,.22),transparent 70%);pointer-events:none}
.pt-hero-label{font-size:12.5px;font-weight:600;color:var(--text-sub);letter-spacing:.4px}
.pt-hero-num{display:flex;align-items:center;gap:9px;margin-top:7px;font-size:30px;font-weight:800;
  line-height:1.15;color:var(--gold);letter-spacing:-.5px;word-break:break-all;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.pt-hero-num .ico{width:.95em;height:.95em;flex:0 0 auto}
@media (max-width:420px){.pt-hero-num{font-size:25px}}
/* 餘額理論上不會是負數（扣唔到就成筆交易取消），但資料庫若被手動改成負數，至少看得出來 */
.pt-hero-num.neg{color:var(--danger)}
.score-chip.neg{color:var(--danger);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.12)}
.pt-code{display:flex;gap:8px;align-items:stretch}
.pt-code input{flex:1 1 auto;min-width:0;width:auto;padding:13px 14px;border-radius:var(--r-2);
  border:1px solid var(--border-strong);background:var(--bg-input);color:var(--text-main);
  font-size:17px;font-weight:700;letter-spacing:2.5px;font-family:Consolas,Menlo,monospace;
  text-transform:uppercase;outline:none}
.pt-code input::placeholder{letter-spacing:0;font-weight:500;font-family:inherit;text-transform:none;color:var(--text-muted)}
.pt-code input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.18)}
.pt-code .btn-primary{flex:0 0 auto;width:auto;margin:0;padding:0 22px;font-size:14px;border-radius:var(--r-2)}
.pt-msg{font-size:12.5px;font-weight:600;margin-top:9px;min-height:17px;line-height:1.45}
.pt-msg.ok{color:var(--ok-tx)}
.pt-msg.bad{color:var(--danger)}
.shop-grid{display:grid;gap:9px}
.shop-card{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--r-2);
  background:var(--bg-card);border:1px solid var(--border)}
.shop-card.sold{opacity:.5}
.shop-card .sh-main{flex:1 1 auto;min-width:0}
.shop-card .sh-name{font-size:14px;font-weight:700;color:var(--text-main);word-break:break-word}
.shop-card .sh-note{font-size:12px;color:var(--text-sub);margin-top:3px;word-break:break-word}
.shop-card .sh-cost{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--gold);margin-top:5px}
.shop-card .sh-cost .ico{width:1em;height:1em}
.shop-card .sh-btn{flex:0 0 auto;width:auto;margin:0;padding:9px 15px;font-size:13px;border-radius:var(--r-2)}
.pt-his{display:flex;flex-direction:column;gap:1px;border-radius:var(--r-2);overflow:hidden;border:1px solid var(--border)}
.pt-his-row{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--bg-card);font-size:12.5px}
.pt-his-row+.pt-his-row{border-top:1px solid var(--border)}
.pt-his-row .h-t{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-main);font-weight:600}
.pt-his-row .h-d{flex:0 0 auto;color:var(--text-muted);font-size:11.5px}
.pt-his-row .h-p{flex:0 0 auto;font-weight:800}
.pt-his-row .h-p.plus{color:var(--ok-tx)}
.pt-his-row .h-p.minus{color:var(--danger)}
.code-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:var(--r-2);
  background:var(--bg-card);border:1px solid var(--border);margin-bottom:8px}
.code-row.used{opacity:.5}
.code-row .cr-main{flex:1 1 auto;min-width:0}
.code-row .cr-code{font-family:Consolas,Menlo,monospace;font-size:15px;font-weight:800;letter-spacing:2px;color:var(--text-main)}
.code-row .cr-sub{font-size:11.5px;color:var(--text-sub);margin-top:3px}
.code-row .cr-btn{flex:0 0 auto;width:auto;margin:0;padding:8px 13px;font-size:12px;border-radius:var(--r-1)}
/* 後台「積分管理」小卡：一個輸入框 + 加／減／設為 三顆並排 */
.pts-admin{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-2);padding:12px 13px;margin-bottom:12px}
.pts-admin .pa-now{font-size:12.5px;color:var(--text-sub);margin-bottom:9px}
.pts-admin .pa-now b{font-size:18px;font-weight:800;color:var(--gold);margin-left:6px;letter-spacing:-.3px}
.pts-admin .form-row{margin-bottom:0}
.pa-btns{display:flex;gap:8px;margin-top:9px}
.pa-btns button{flex:1 1 0;width:auto;margin:0;padding:10px 6px;font-size:13px;border-radius:var(--r-1)}

/* v1.36 版本資訊簡化：一行摘要 + 更早的只留版本號 */
.version-item .vi-sum{font-size:13px;color:var(--text-sub);margin-top:2px}
.version-item.old{opacity:.55;padding:6px 0}
.version-item.old .vi-head{margin-bottom:0}

/* v1.41 版本資訊：網頁版 / 安卓版兩個分頁，完整歷史不再藏起來 */
.vertabs{display:flex;gap:8px;margin-bottom:10px}
.vtab{flex:1;padding:10px;border-radius:var(--r-2);border:1px solid var(--border);background:var(--bg-input);color:var(--text-sub);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:background var(--dur-2),color var(--dur-2),border-color var(--dur-2)}
.vtab.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.vtab .vcn{font-size:11px;font-weight:600;opacity:.75;margin-left:6px}
.verhint{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--text-muted);margin-bottom:10px;line-height:1.5}
.vlink{background:none;border:none;padding:4px 2px;color:var(--info);font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;flex:none}
.vitem{cursor:pointer}
.vitem .vi-arrow{color:var(--text-muted);font-size:10px;opacity:.85;flex:none;transition:transform var(--dur-2)}
.vitem.open .vi-arrow{transform:rotate(90deg)}
.vitem.open{border-color:var(--border-strong,#3a4256)}
.vitem .vi-changes li{margin:3px 0}
.vernow{padding:12px 14px;border-radius:var(--r-2);background:var(--bg-input);border:1px solid var(--border);margin-bottom:10px}
.vernow .vn-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vernow .vn-ver{font-size:15px;font-weight:700;color:var(--ok-tx)}
.vernow .vn-meta{font-size:11.5px;color:var(--text-muted);margin-top:4px}
.vload{padding:24px 0;text-align:center;color:var(--text-muted);font-size:13px}
/* v1.37 聊天室往前翻頁：
   以前主聊天室只讀最新 300 則，又沒有入口往前翻，所以更早的訊息一則都看不到。 */
.earlier-btn{display:block;width:100%;margin:2px 0 12px;padding:9px 0;border:1px solid var(--border);background:var(--bg-input);color:var(--text-sub);font-size:12.5px;font-family:inherit;border-radius:999px;cursor:pointer;transition:background var(--dur-2) var(--ease-out),color var(--dur-2) var(--ease-out)}
.earlier-btn:hover{background:var(--bg-card);color:var(--text-main)}
.earlier-btn:active{transform:scale(.985)}
.earlier-done{margin:2px 0 12px;padding:7px 0;text-align:center;color:var(--text-muted);font-size:11.5px}

/* v1.36 視訊通話（Jitsi）：全頁 iframe + 通話紀錄樣式 */
.vcPage{display:flex;flex-direction:column;height:100%}
.vcBody{flex:1;display:flex;flex-direction:column;padding:0;min-height:0}
.vcFrame{flex:1;width:100%;border:0;background:#000;min-height:0}
.vcHint{display:flex;align-items:center;gap:6px;padding:9px 14px;font-size:12.5px;color:var(--text-sub);
  background:var(--bg-card);border-top:1px solid var(--border)}
.vcBadge{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ok-tx);
  background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.3);border-radius:999px;padding:2px 9px}
.vcDot{width:7px;height:7px;border-radius:50%;background:var(--ok-tx);animation:vcPulse 1.6s ease-in-out infinite}
@keyframes vcPulse{0%,100%{opacity:1}50%{opacity:.35}}
.callChip{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.callChip .ico{width:1.1em;height:1.1em}

/* ═══════════════════════════════════════════════════════════════
   v1.37 視訊通話：我們自己畫的介面（原生 WebRTC，不再用 Jitsi 那套 iframe UI）
   ═══════════════════════════════════════════════════════════════ */
.vcStage{flex:1;min-height:0;display:grid;gap:8px;padding:8px;align-content:center;
  grid-auto-rows:minmax(0,1fr);overflow:hidden;background:#080a10}
.vcTile{position:relative;min-height:0;border-radius:var(--r-2);overflow:hidden;background:#11141d;
  border:1px solid rgba(255,255,255,.07);transition:box-shadow var(--dur-2),border-color var(--dur-2)}
.vcTile video{width:100%;height:100%;object-fit:cover;display:block;background:#11141d}
.vcTile.mirror video{transform:scaleX(-1)}
.vcTile.speaking{border-color:var(--ok-tx);box-shadow:0 0 0 2px rgba(74,222,128,.55),0 0 18px rgba(74,222,128,.25)}

/* ═══ v1.38 遠端配置 ═══ */
.is-off{opacity:.42;filter:grayscale(.65)}

.off-tag{position:absolute;top:0;right:2px;background:#f87171;color:#fff;font-size:9px;font-weight:700;

  max-width:none;box-shadow:0 4px 16px rgba(0,0,0,.18);animation:rnIn2 .26s cubic-bezier(.22,1,.36,1)}
@keyframes rnIn2{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes rnIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
#remoteNotice.rn-info{background:rgba(56,189,248,.18);border:1px solid rgba(56,189,248,.5);color:#7dd3fc}

#remoteNotice .rn-txt{flex:1;word-break:break-word}

  opacity:.65;padding:1px 3px;font-family:inherit;flex:0 0 auto}
#remoteNotice .rn-x:hover{opacity:1}
.paused{display:flex;flex-direction:column;align-items:center;text-align:center;padding:46px 14px 24px;gap:10px}
.paused-ico{width:66px;height:66px;border-radius:22px;display:grid;place-items:center;
  background:rgba(248,113,113,.13);color:#f87171;margin-bottom:4px}
.paused-ico .ico{width:30px;height:30px}
.paused-t{font-size:17.5px;font-weight:700}
.paused-s{font-size:13px;color:var(--text-sub);line-height:1.75;max-width:310px}
.paused .btn-primary{margin-top:16px;width:200px}
.rc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;
  border:1px solid var(--border);border-radius:var(--r-2);background:var(--bg-card);margin-bottom:8px}
.rc-row .rc-n{font-size:13.5px;font-weight:650}
.rc-row .rc-note{font-size:11.5px;color:var(--text-sub);margin-top:2px;line-height:1.5}
.rc-sw{width:46px;height:26px;border-radius:13px;border:none;background:#334155;position:relative;
  cursor:pointer;flex:0 0 auto;transition:background .2s;padding:0}
.rc-sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
