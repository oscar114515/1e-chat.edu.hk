function generateUniqueColor(existing){
  function randHex(){return Math.floor(Math.random()*16777216);}
  function hexStr(n){return '#'+n.toString(16).padStart(6,'0');}
  function rgb(n){return [(n>>16)&255,(n>>8)&255,n&255];}
  function diff(a,b){return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2]);}
  const existRGB=existing.map(h=>{const hh=h.replace('#','');return [parseInt(hh.substr(0,2),16),parseInt(hh.substr(2,2),16),parseInt(hh.substr(4,2),16)];});
  for(let i=0;i<1000;i++){const n=randHex();const c=rgb(n);const lum=(0.299*c[0]+0.587*c[1]+0.114*c[2])/255;if(lum<0.2)continue;let ok=true;for(const e of existRGB){if(diff(c,e)<100){ok=false;break;}}if(ok)return hexStr(n);}
  return hexStr(randHex());
}

async function handleRequest(key,action){
  if(!key)return;
  const snap=await get(ref(db,'requests/'+key));if(!snap.exists())return;
  const req=snap.val();
  if(action==='approve'){
    if(req.type==='appeal'){
      const nSnap=await get(ref(db,'systemNotices/'+req.from+'/'+req.noticeKey));
      if(nSnap.exists()){
        const n=nSnap.val();
        if(n.msgId){
          const mSnap=await get(query(ref(db,'messages'),orderByChild('createdAt'),limitToLast(300)));
          const mVal=mSnap.val()||{};
          const mkey=Object.keys(mVal).find(k=>mVal[k].id===n.msgId);
          if(mkey){await update(ref(db,'messages/'+mkey),{deleted:false,deletedAt:null,deletedBy:null});}
        }
      }
      await pushSystemNotice(req.from,{type:'appeal_approved',title:'申訴成功',body:'你的申訴已通過，訊息已恢復。',createdAt:Date.now(),read:false});
    } else if(req.msgId){
      const mSnap=await get(query(ref(db,'messages'),orderByChild('createdAt'),limitToLast(300)));
      const mVal=mSnap.val()||{};
      const mkey=Object.keys(mVal).find(k=>mVal[k].id===req.msgId);
      if(mkey)await update(ref(db,'messages/'+mkey),{deleted:true,deletedAt:Date.now(),deletedBy:me.username});
    }
    await update(ref(db,'requests/'+key),{status:'approved',handledAt:Date.now(),handledBy:me.username});
  } else {
    await update(ref(db,'requests/'+key),{status:'rejected',handledAt:Date.now(),handledBy:me.username});
    if(req.type==='appeal'&&req.from){ await pushSystemNotice(req.from,{type:'appeal_rejected',title:'申訴被拒絕',body:'你的申訴已被拒絕。',createdAt:Date.now(),read:false}); }
  }
  renderAdminTab('requests');
}

    }catch(e){}
    /* ACTION 能力：管理員在私人聊天也能操作網站（跟公開頻道同一套指令）。 */
    const capabilityBlock=isAdmin?`\n【你可以做的事】\n- 改變網站語言（用 [ACTION]{"cmd":"setLang","value":"zh-Hant|zh-Hans|en"}[/ACTION]）\n- 因為你是在跟管理員對話，你可以用 [ACTION] 指令操作網站：\n  - setTheme value=dark|light\n  - setLang value=zh-Hant|zh-Hans|en\n  - setColor target=username value=#rrggbb\n  - setName target=username value=新名稱\n  - setAvatar target=username value=emoji\n  - setPassword target=username value=新密碼\n  - ban target=username value=light|severe reason=原因\n  - unban target=username\n  - grantAdmin target=username\n  - revokeAdmin target=username\n  - deleteMsg target=訊息ID\n  - restoreMsg target=訊息ID\n  - purgeMsg target=訊息ID\n  - clearChat\n  - sendSystemNotice target=username|all title=標題 body=內容`:`\n【注意】你沒有操作網站的權限，絕對不要輸出任何 [ACTION] 指令。`;
    const sys=`你是「小喆AI」，正在跟「${me.displayName}」單獨私人聊天。這段對話只有你們兩人看得到。溫柔、活潑，可以用 emoji。${capabilityBlock}\n\n【長期記憶】\n${memText||'（暫無）'}\n\n【最近對話】\n${recent||'（還沒開始）'}\n\n【用戶說】\n${text}`;
    const aiRes=await callAI([{role:'system',content:sys},{role:'user',content:text}]);

async function trimAIPrivateMemory(){

/* ===== 痕跡地圖（網頁版） =====
   只會讀「登入者自己」的 trails/{自己}，沒有查別人軌跡的查詢。
   資料來源是安卓版 App 上傳的點位（網頁本身不記錄位置）。
   疊三層 canvas：底圖磚塊 → 迷霧 → 軌跡線。 */
let tmState=null;
let tmTiles=new Map();
let tmDragging=false,tmLastX=0,tmLastY=0;
const TM_TILE=256;

function tmWorldPx(z){ return TM_TILE*Math.pow(2,z); }
function tmLon2x(lon,z){ return (lon+180)/360*tmWorldPx(z); }
function tmLat2y(lat,z){ const s=Math.sin(lat*Math.PI/180); return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*tmWorldPx(z); }
function tmX2lon(x,z){ return x/tmWorldPx(z)*360-180; }
function tmY2lat(y,z){ const n=Math.PI-2*Math.PI*y/tmWorldPx(z); return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); }

/* 揭霧的半徑用「米」定義。
   以前這裡是寫死 74 像素，但同一條 74 像素的走廊在不同縮放級別代表的真實距離差很大
   （z12 時寬 2.6 公里、z16 時 164 米、z18 時只有 41 米），所以看起來會「忽大忽小」，
   也完全不能代表真的走過的範圍。現在改成固定 15 米，再依當下縮放換算成像素。 */
const TM_REVEAL_RADIUS_M=15;   // 軌跡兩側各揭開 15 米（＝走廊總寬 30 米）
const TM_REVEAL_MIN_PX=2.5;    // 縮到很遠時至少留一條細線，免得整張圖全黑看不到軌跡
/* Web Mercator：某緯度、某縮放級別下，1 像素等於幾米地面距離。 */
function tmMetresPerPx(lat,z){ return 156543.03392804097*Math.cos(lat*Math.PI/180)/Math.pow(2,z); }
function tmMetresToPx(m,lat,z){ return m/tmMetresPerPx(lat,z); }

function tmResize(){
  const body=document.querySelector('#trailMapScreen .tm-body');
  if(!body||!tmState)return;
  const dpr=window.devicePixelRatio||1;
  const w=body.clientWidth,h=body.clientHeight;
  if(!w||!h)return;
  tmState.w=w;tmState.h=h;tmState.dpr=dpr;
  ['tmTiles','tmFog','tmLine'].forEach(id=>{
    const c=document.getElementById(id);if(!c)return;
    c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);
  });
  tmRender();   // 改 canvas 尺寸會清空畫布，要立刻重畫（旋轉螢幕才不會變全黑）
}

function tmRender(){
  if(!tmState||!tmState.w||!tmState.h)return;
  const {w,h,dpr,zoom:z,centerLat,centerLon,fog,points}=tmState;
  const originX=tmLon2x(centerLon,z)-w/2;
  const originY=tmLat2y(centerLat,z)-h/2;
  const xy=points.map(p=>[tmLon2x(p.lng,z)-originX,tmLat2y(p.lat,z)-originY]);

  /* 1. 底圖 */
  const tctx=document.getElementById('tmTiles').getContext('2d');
  tctx.setTransform(dpr,0,0,dpr,0,0);
  tctx.fillStyle='#0e1016';tctx.fillRect(0,0,w,h);
  const maxIdx=Math.pow(2,z)-1;
  for(let tx=Math.floor(originX/TM_TILE);tx<=Math.floor((originX+w)/TM_TILE);tx++){
    if(tx<0||tx>maxIdx)continue;
    for(let ty=Math.floor(originY/TM_TILE);ty<=Math.floor((originY+h)/TM_TILE);ty++){
      if(ty<0||ty>maxIdx)continue;
      const key=z+'/'+tx+'/'+ty;
      let img=tmTiles.get(key);
      if(!img){
        img=new Image();
        img.onload=()=>{ if(tmState)tmRender(); };
        img.src='https://tile.openstreetmap.org/'+key+'.png';
        tmTiles.set(key,img);
      }
      if(img.complete&&img.naturalWidth) tctx.drawImage(img,tx*TM_TILE-originX,ty*TM_TILE-originY,TM_TILE,TM_TILE);
    }
  }

  /* 2. 迷霧：整層蓋住，再把走過的帶狀區擦亮 */
  const fctx=document.getElementById('tmFog').getContext('2d');
  fctx.setTransform(dpr,0,0,dpr,0,0);
  fctx.clearRect(0,0,w,h);
  if(fog){
    fctx.fillStyle='rgba(14,16,22,.74)';
    fctx.fillRect(0,0,w,h);
    fctx.globalCompositeOperation='destination-out';
    fctx.strokeStyle='#000';fctx.fillStyle='#000';
    // 15 米 → 像素。放大縮小都會換算出不同像素數，但涵蓋的真實範圍永遠是 15 米。
    const revealR=Math.max(TM_REVEAL_MIN_PX,tmMetresToPx(TM_REVEAL_RADIUS_M,centerLat,z));
    fctx.lineWidth=revealR*2;fctx.lineCap='round';fctx.lineJoin='round';
    if(xy.length>=2){
      fctx.beginPath();
      xy.forEach(([x,y],i)=>i?fctx.lineTo(x,y):fctx.moveTo(x,y));
      fctx.stroke();
    }else if(xy.length===1){
      fctx.beginPath();fctx.arc(xy[0][0],xy[0][1],revealR,0,Math.PI*2);fctx.fill();
    }
    fctx.globalCompositeOperation='source-over';
  }

  /* 3. 軌跡線 */
  const lctx=document.getElementById('tmLine').getContext('2d');
  lctx.setTransform(dpr,0,0,dpr,0,0);
  lctx.clearRect(0,0,w,h);
  if(xy.length){
    lctx.lineJoin='round';lctx.lineCap='round';
    if(xy.length>=2){
      lctx.beginPath();
      xy.forEach(([x,y],i)=>i?lctx.lineTo(x,y):lctx.moveTo(x,y));
      lctx.strokeStyle='rgba(255,255,255,.85)';lctx.lineWidth=9;lctx.stroke();
      lctx.strokeStyle='#3b82f6';lctx.lineWidth=5;lctx.stroke();
    }
    const start=xy[0],end=xy[xy.length-1];
    if(xy.length>=2){
      lctx.beginPath();lctx.arc(start[0],start[1],6,0,Math.PI*2);
      lctx.fillStyle='#22c55e';lctx.fill();
      lctx.strokeStyle='#fff';lctx.lineWidth=2;lctx.stroke();
    }
    lctx.beginPath();lctx.arc(end[0],end[1],15,0,Math.PI*2);
    lctx.strokeStyle='rgba(59,130,246,.5)';lctx.lineWidth=5;lctx.stroke();
    lctx.beginPath();lctx.arc(end[0],end[1],8,0,Math.PI*2);
    lctx.fillStyle='#3b82f6';lctx.fill();
    lctx.strokeStyle='#fff';lctx.lineWidth=2;lctx.stroke();
  }
}

function tmFit(){
  if(!tmState)return;
  const body=document.querySelector('#trailMapScreen .tm-body');
  if(!body)return;
  const w=body.clientWidth||tmState.w,h=body.clientHeight||tmState.h;
  const pts=tmState.points;
  if(!pts.length){ tmState.centerLat=22.3193;tmState.centerLon=114.1694;tmState.zoom=12;tmRender();return; }
  if(pts.length===1){ tmState.centerLat=pts[0].lat;tmState.centerLon=pts[0].lng;tmState.zoom=17;tmRender();return; }
  const lats=pts.map(p=>p.lat),lngs=pts.map(p=>p.lng);
  const minLat=Math.min.apply(null,lats),maxLat=Math.max.apply(null,lats);
  const minLng=Math.min.apply(null,lngs),maxLng=Math.max.apply(null,lngs);
  tmState.centerLat=(minLat+maxLat)/2;
  tmState.centerLon=(minLng+maxLng)/2;
  let z=18;
  while(z>3){
    const dx=Math.abs(tmLon2x(maxLng,z)-tmLon2x(minLng,z));
    const dy=Math.abs(tmLat2y(minLat,z)-tmLat2y(maxLat,z));
    if(dx<=w*0.72&&dy<=h*0.72)break;
    z--;
  }
  tmState.zoom=z;
  tmRender();
}

function tmZoom(delta){
  if(!tmState)return;
  tmState.zoom=Math.max(3,Math.min(18,tmState.zoom+delta));
  tmRender();
  tmUpdateInfo();
}

function tmPanMove(clientX,clientY){
  if(!tmDragging||!tmState)return;
  const dx=clientX-tmLastX,dy=clientY-tmLastY;
  tmLastX=clientX;tmLastY=clientY;
  const z=tmState.zoom;
  tmState.centerLon=tmX2lon(tmLon2x(tmState.centerLon,z)-dx,z);
  tmState.centerLat=tmY2lat(tmLat2y(tmState.centerLat,z)-dy,z);
  tmRender();
}
function tmPanMouseMove(e){ tmPanMove(e.clientX,e.clientY); }
function tmPanTouchMove(e){
  const t=e.touches&&e.touches[0];if(!t)return;
  tmPanMove(t.clientX,t.clientY);
  if(e.cancelable)e.preventDefault();
}
function tmPanEnd(){ tmDragging=false; const b=document.querySelector('#trailMapScreen .tm-body'); if(b)b.classList.remove('dragging'); }

function tmBindPan(){
  const body=document.querySelector('#trailMapScreen .tm-body');
  if(!body)return;
  const start=(x,y)=>{ tmDragging=true;tmLastX=x;tmLastY=y;body.classList.add('dragging'); };
  body.addEventListener('mousedown',e=>start(e.clientX,e.clientY));
  body.addEventListener('touchstart',e=>{ const t=e.touches[0];if(t)start(t.clientX,t.clientY); },{passive:true});
  window.addEventListener('mousemove',tmPanMouseMove);
  window.addEventListener('mouseup',tmPanEnd);
  body.addEventListener('touchmove',tmPanTouchMove,{passive:false});
  body.addEventListener('touchend',tmPanEnd);
  body.addEventListener('touchcancel',tmPanEnd);
}

function tmUpdateInfo(){
  const info=document.getElementById('tmInfo');
  if(!info||!tmState)return;
  const n=tmState.points.length;
  // 把「揭開半徑」寫出來，這樣放大縮小都可以自己核對是不是同一個實際範圍
  const scale=tmMetresPerPx(tmState.centerLat,tmState.zoom);
  info.textContent=n
    ? '共 '+n+' 個點　·　霧：'+(tmState.fog?('開（軌跡兩側各 '+TM_REVEAL_RADIUS_M+' 米）'):'關')
      +'　·　1 像素 ≈ '+(scale<1?scale.toFixed(2):scale<10?scale.toFixed(1):Math.round(scale))+' 米'
    : '這裡只會顯示你自己的痕跡';
}

  beginPage('trail');

  div.id='trailMapScreen';
  div.classList.add('anim-in-page');
  div.innerHTML=`<div class="tm-header"><button class="tm-back" data-action="closeTrailMap"><svg class="ico"><use href="#i-back"/></svg></button><div class="tm-title">痕跡地圖</div><span id="tmCount" style="font-size:11.5px;color:var(--text-sub);flex-shrink:0"></span></div><div class="tm-body"><canvas id="tmTiles"></canvas><canvas id="tmFog"></canvas><canvas id="tmLine"></canvas><div class="tm-empty" id="tmEmpty" style="display:none"><b>還沒有痕跡</b><span>在安卓版 App 打開「痕跡地圖」開始記錄，走過的路就會出現在這裡</span></div><div class="tm-info" id="tmInfo">載入中…</div><div class="tm-actions"><button class="tm-btn" id="tmZoomIn">＋</button><button class="tm-btn" id="tmZoomOut">－</button><button class="tm-btn on" id="tmFogBtn" title="切換霧">霧</button><button class="tm-btn" id="tmFit" title="看全部">⤢</button></div></div>`;
  document.body.appendChild(div);

  tmState={points:[],centerLat:22.3193,centerLon:114.1694,zoom:12,fog:true,w:0,h:0,dpr:1};
  tmResize();
  tmBindPan();
  tmRender();

  document.getElementById('tmZoomIn').onclick=()=>tmZoom(1);
  document.getElementById('tmZoomOut').onclick=()=>tmZoom(-1);
  document.getElementById('tmFit').onclick=()=>{ tmFit();tmUpdateInfo(); };
  document.getElementById('tmFogBtn').onclick=()=>{
    if(!tmState)return;
    tmState.fog=!tmState.fog;
    document.getElementById('tmFogBtn').classList.toggle('on',tmState.fog);
    tmRender();tmUpdateInfo();
  };
  window.addEventListener('resize',tmResize);

  try{
    const snap=await get(ref(db,'trails/'+me.username));
    const val=snap.exists()?snap.val():{};
    const pts=Object.keys(val).map(k=>val[k])
      .filter(p=>p&&typeof p.lat==='number'&&typeof p.lng==='number')
      .map(p=>({lat:p.lat,lng:p.lng,t:p.t||0}))
      .sort((a,b)=>a.t-b.t);
    if(!tmState)return; // 載入途中已經關掉了
    tmState.points=pts;
    const cnt=document.getElementById('tmCount');
    if(cnt)cnt.textContent=pts.length?pts.length+' 個點':'';
    const empty=document.getElementById('tmEmpty');
    if(empty)empty.style.display=pts.length?'none':'flex';
    tmFit();
    tmUpdateInfo();
  }catch(err){
    const info=document.getElementById('tmInfo');
    if(info)info.textContent='載入失敗：'+(err.message||err);
  }
}

function closeTrailMap(){
  const el=document.getElementById('trailMapScreen');
  window.removeEventListener('resize',tmResize);
  window.removeEventListener('mousemove',tmPanMouseMove);
  window.removeEventListener('mouseup',tmPanEnd);
  tmDragging=false;
  if(currentPageKey==='trail') popPage();          // 先把下面那層推回來，地圖再滑走
  if(el)animOut(el,'anim-out-page',300).then(()=>{ tmState=null; tmTiles=new Map(); });
  else { tmState=null; tmTiles=new Map(); }
}

{ver:'v1.24',date:'2026-10-11',changes:['安卓版小遊戲改用「原生介面」重寫（不再內嵌網頁）：大廳、開房、等待室、倒數、觀戰、對局、結算全部由安卓自己畫，讀寫的是同一份資料，跟網頁版互通','安卓版第一批原生支援 7 款：井字棋、五子棋、誰是臥底、傳炸彈、康樂棋、大富翁、狼人殺（其餘款式的原生介面會在後續版本一款一款補上）','新增「網址引導」：在網址後面加 ?game=遊戲代號 或 ?room=房間編號，打開就跟平常一樣走登入（能自動登入就自動登入、要打密碼就打密碼），登入完成後直接跳到那個小遊戲或那一間房間','每一間房間都有自己的網址（?room=<房號>），房間內與聊天室的對局邀請卡都有「複製房間連結 / 複製這間房間的連結」可以一鍵複製，傳給同學點開就能進同一間房','如果點進去時那局已經結束了（而且你不是當時的玩家）→ 顯示「你來遲了，對局已經結束」並說明最後是誰獲勝，不會再把你塞進已經打完的房間','房間已經被關閉或不存在 → 明確顯示「房間已不存在或已被關閉」，不會停在「載入中」','支援 ?game=<代號>：直接打開那一款遊戲的開房面板（例如 ?game=gomoku 直接彈出五子棋開房）','新增「狼人殺」（6–18 人）：狼人／預言家／村民三種角色，夜晚狼人選人殺、預言家查身分，天亮公布死者後輪流發言（像聊天、講完自動輪下一位），再投票放逐；票高者出局，平票則平票的人單獨再投；狼人全出局＝村民勝、狼人數量不少於其他人＝狼人勝','新增「大富翁」（2–6 人，簡化版）：28 格環形棋盤、買地收租、機會卡、稅金、經過起點收 200，付不出錢就破產出局，最後剩下的人獲勝']},
{ver:'v1.23',date:'2026-10-11',changes:['修好「誰是臥底」全部人拿到同一個詞的問題：AI 偶爾會出「兩個詞一樣」的題目（例如「水果／水果」），這種題目會直接淘汰不用，而且開局時一定會有一個臥底拿不同的詞','誰是臥底改成「打字描述」：輪到你時輸入框會出現，打完按送出就自動輪到下一位，不再由房主決定什麼時候換人','新增像聊天一樣的描述紀錄：每個人講的話都留在裡面，新的在下面、舊的往上推，所有人都看得到','三個人一輪講完就自動進入投票；不用房主按任何按鈕','投票完成會彈出結果框，列出每個人的票數以及誰投了誰，票最高的那位出局','平票會讓最高的幾位單獨再投一次（其他人只能在他們之間二選一，平票的人自己不能再投）','出局後如果還有得玩（場上多於兩人）就可以繼續下一輪描述；人數不夠就直接判勝負並顯示「平民獲勝／臥底獲勝」','沒收房主專屬的「下一位／進入投票」按鈕：描述輪替、進投票、下一輪全部自動或人人可操作','新增「中國象棋」（9×10 棋盤）：車馬炮象士將卒的走法、蹩馬腿、塞象眼、炮隔子才可食、過河兵可橫行、將帥不可對面（白臉將）、被將死或無棋可走判負，規則完整實作','修好提示訊息會擋住畫面、按不到底下的按鈕（例如象棋選棋子）的問題']},
{ver:'v1.22',date:'2026-10-11',changes:['小遊戲一次開放 4 款新桌遊：傳炸彈、劇本殺、康樂棋、鬥獸棋（連同之前 7 款，現在共 11 款可以直接玩）','傳炸彈（2–10 人）：題目是 AI 出的「類別」（例如「水果」「三國人物」），炸彈輪流傳，輪到你要在限時內講出一個答案，講過不能重複；時間到就爆在你手上被淘汰，每淘汰一人時間縮短、換一個新題目，最後剩下的人贏','劇本殺（4–10 人）：AI 當場寫一宗案件（背景＋每個角色一份公開資料與一個秘密），每個人只看到自己的角色卡，其中一人是兇手；讀完劇本進討論，接著投票，投中兇手大家贏、投錯兇手贏','康樂棋（2–4 人）：香港經典擲骰競速，踩到綠格加速、紅格後退，先到第 52 格的人獲勝','鬥獸棋（2 人）：象獅虎豹狼狗貓鼠，大食細、鼠食象、獅虎可以跳河、走進對方陷阱的棋子戰力歸零，攻入對方獸穴或食光對方棋子就贏','兩款新 AI 遊戲（傳炸彈、劇本殺）同樣有三檔難度「搞笑／普通／困難」，題目每次都不一樣；AI 連不上時會自動用內置題庫，不會卡住開不了局','安卓版 1.6.0：聊天室「＋」面板新增「小遊戲」入口，進去就是同一套遊戲介面；聊天室收到對局邀請也可以直接點卡片進房間','修好「題目是否已備妥」的判斷：以前只有詞對類題目會被認得，現在各款遊戲用自己的方式判斷，開局前一定等到題目真的好了','團隊勝負（劇本殺）現在會正確記錄每個人的勝負，不再是只有一個人算贏']},
{ver:'v1.21',date:'2026-10-11',changes:['新增「小遊戲」：從輸入框的「+」進去，有 16 款經典桌遊（井字棋、五子棋、飛行棋、UNO、國際象棋、誰是臥底、你畫我猜已經可以玩，其餘陸續開放）','開房後會自動在聊天室發一條帶編號的邀請訊息（走原本的訊息系統），別人點一下就能進房間；對局一結束，那條邀請會自動變成「對局已完成」、加入按鈕消失','誰是臥底（3–12 人）：題目由 AI 即時生成，分「搞笑／普通／困難」三檔難度，每次都不一樣；發詞、輪流描述、投票、淘汰、身分揭曉全程自動判定','你畫我猜（2–10 人）：一人畫、其他人猜、猜中得分、輪流當畫手，畫筆即時同步；題目由 AI 生成（三檔難度）','人齊自動倒數開局（到最少人數就倒數 15 秒），名額滿了再進去會提示「對局已滿」；房主可以決定這局是否允許觀戰','倒數期間有人退出會立即取消倒數，不會再「人不夠也硬開局（改用連線偵測，關掉頁面也會自動退出房間）」','每局勝負會記進個人戰績，在大廳的遊戲卡片上可以看到自己的勝負場數；結束畫面會分清楚「你贏了／你輸了／XX 獲勝」','UNO 與國際象棋改用成熟規則引擎（uno-engine、chess.js），發牌、出牌合法性、將軍、將死、升變、王車易位等全部由引擎判定','網頁版和安卓版共用同一套遊戲介面，之後新增遊戲兩端同時生效']},
{ver:'v1.20',date:'2026-10-11',changes:['AI 私人聊天現在有長期記憶：之前的對話即使清掉瀏覽器資料也還在，AI 也記得住更久以前講過的話','AI 私人聊天支援管理員操作：管理員在私人聊天裡叫 AI 改主題、改語言、發系統通知等，跟公開頻道一樣會先跳出確認','系統通知的「確定」按鈕現在按了會立刻有反應：卡片淡出消失並顯示「已讀」，不再像壞掉一樣沒動靜','反饋「送出」按鈕加了載入動畫：送出時按鈕會變灰並轉圈，不會再以為卡住或重複點','聊天室新增「回到最新」箭頭：往上翻看歷史時，右下角會出現一顆向下箭頭，一按就跳回最新訊息；自己送出訊息也會自動滾到底','反饋區的「送出反饋」與下方按鈕之間加了間距，不再擠在一起']},
{ver:'v1.19',date:'2026-10-11',changes:['訊息編號改回原本的 msg_0001 格式（之前 v1.15 換成 Firebase 自動產生的鍵，鍵名變成 -Pxxxxxxxx 這種看不出順序的樣子）','改回原本格式的同時修好舊寫法的問題：取號改用原子操作，兩個人同時送出不會再拿到同一個編號、也就不會覆蓋掉對方的訊息']},
{ver:'v1.18',date:'2026-10-10',changes:['修好後台分頁被擠掉的問題：分頁列原本是橫向捲動的，加了新分頁之後右邊的「群聊監看」被推出畫面，看起來像被換掉；現在改成自動換行，每一顆都一直在畫面上']},
{ver:'v1.17',date:'2026-10-10',changes:['修好一個嚴重的顯示問題：v1.15 把訊息改用新的唯一鍵之後，鍵名的排序位置整個跑到前面，而「讀最近 300 則」在沒指定排序時是按鍵名排的 —— 結果新訊息全部落在視窗之外，自己送出的訊息在網頁上看不到（手機端因為是整包讀所以正常）','現在改成按訊息時間排序再取最近 300 則，不論鍵名長什麼樣子都不會漏']},
{ver:'v1.16',date:'2026-10-10',changes:['管理員後台新增「用量」分頁：一眼看到整個資料庫佔多少、這個月大概下載了多少，不用再跑去 Firebase Console','會列出「誰佔最多」與「最大的媒體」，可以直接清掉大圖，訊息與文字會保留','每次進入聊天室會記一筆開頁次數，用來估算每月下載量','用量達到免費額度 70% 時，超級管理員進聊天室會看到提醒，不用自己記得去查']},
{ver:'v1.15',date:'2026-10-10',changes:['修掉頭像的儲存型 XSS：以前只要有人把頭像設成一段 HTML，每個看得到他的人（包含管理員）都會被執行腳本；現在頭像只允許圖片，其餘一律當純文字處理','修掉訊息圖片網址、顏色、訊息編號等處的注入：這些欄位以前直接塞進 HTML 屬性，現在全部經過轉義與白名單','加上內容安全政策（CSP）：整站只允許載入白名單內的來源，就算真的被寫進惡意標籤也執行不了','訊息改用 Firebase 唯一鍵：以前兩人同一瞬間送出會撞到同一則訊息編號，後送的那則會把前一則蓋掉；舊訊息完全不受影響','AI 不再把全班名冊與管理指令清單給一般用戶：以前任何人問一句就能拿到整份點對照表','管理員查看別人資料時，密碼預設改為遮住，要按「顯示」才展開','新增一次性登入連結（?t=）：30 分鐘過期、只能用一次，取代把密碼寫在網址裡的做法；舊的 ?u=&p= 連結照舊可用','個人中心與管理員頁面都可以直接產生這條一次性連結','安卓版同步支援一次性登入連結（1.3.3）']},
{ver:'v1.14',date:'2026-10-10',changes:['支援網址直接登入：在網址後面加 ?u=帳號&p=密碼，打開就自動填好並登入，不用手打','登入成功後帳密會自動從網址清掉，不會一直掛在網址列與瀏覽紀錄裡','手機打開網頁時，如果已經裝了「梁喆工具箱」會直接交給 App，不會停在網頁（跟 YouTube 同一套邏輯）','App 透過網域驗證接收連結，連網頁都不會載入就直接開 App 並自動登入','安卓版同步支援（1.3.2）']},
{ver:'v1.13',date:'2026-10-10',changes:['修復痕跡地圖的揭霧範圍：以前用固定螢幕像素畫，縮到最小時那條走廊實際寬達 2.6 公里、放到最大只有 41 米，看起來忽大忽小','現在改成固定真實距離：軌跡兩側各揭開 15 米，放大縮小都是同一個實際範圍，不會再跑掉','資訊列會顯示「軌跡兩側各 15 米」與「1 像素 ≈ 幾米」，可以自己核對','修復旋轉螢幕後痕跡地圖變全黑（改 canvas 尺寸後沒有重畫）','Android 版同步修正（1.3.1）']},
{ver:'v1.12',date:'2026-10-10',changes:['全站補上進退場動畫：安卓版一直都有轉場，網頁版只是「啪」一聲消失，現在兩邊一致','關閉任何頁面時整頁向右滑走，上一層再從左邊推回來，層級關係看得出來','開啟新頁面改成從右邊滑進來，不再是直接跳出來','彈窗、圖片檢視、連結警告、位置全螢幕、痕跡地圖、AI 確認橫幅、錄音遮罩全部補上退場動畫','「+」面板與 @ 提及選單改成滑出收起，通知橫幅多了淡出','系統偵測到「減少動態效果」時會自動縮短動畫，不會影響這類使用者']},
{ver:'v1.11',date:'2026-10-10',changes:['登入頁加上校徽，開場更有學校的感覺','新增天氣顯示：右上角即時氣溫與濕度（香港天文台開放數據，每 10 分鐘更新）','禁言與封禁正式分開：禁言只限制發言仍可登入；嚴重封禁則禁止登入','修復多層頁面的返回層級：後台→用戶資料→日誌 可以一層一層退回去','安卓版補上「AI 回覆」開關（與網頁版那顆圓形 AI 按鈕一致）']},
{ver:'v1.10.5',date:'2026-10-10',changes:['個人主頁新增「痕跡地圖」入口（原本找不到地圖在哪裏）','網頁版可看自己在安卓 App 走過的痕跡，含迷霧效果、可拖動縮放','痕跡地圖只讀自己的資料，不會顯示其他人的位置','修復投票漏洞：已投票不能再改、截止後不能投、被禁言不能投、多選不可超過上限']},

async function openVersionPage(){
  /* v1.36 簡化：每個版本只留「版本號 + 一行摘要」，只顯示最近 8 版，
     更早的只列版本號（不展開細節）—— 不讓別人看到太多內部改動。 */
  const line=v=>{ const c=(v.changes&&v.changes[0])||''; return String(c).split(/[：:（(，,]/)[0].slice(0,20); };
  const row=(v,i)=>`<div class="version-item ${i===0?'latest':''}"><div class="vi-head"><span class="vi-ver">${v.ver}</span>${i===0?'<span class="vi-badge">最新</span>':''}${v.date?'<span class="vi-date">'+v.date+'</span>':''}</div>${line(v)?`<div class="vi-sum">${escapeHtml(line(v))}</div>`:''}</div>`;
  const body=VERSION_HISTORY.slice(0,8).map(row).join('')
    +`<div id="verMore" class="hidden">${VERSION_HISTORY.slice(8).map(v=>`<div class="version-item old"><div class="vi-head"><span class="vi-ver">${v.ver}</span></div></div>`).join('')}</div>`
    +`<button class="btn-ghost" data-action="verMore">顯示更早版本</button>`;
  openPage({title:'版本資訊',bodyHTML:body});
}

/* ═══════════════ 天氣（香港天文台開放數據，免 key、支援 CORS） ═══════════════ */
const WEATHER_API='https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc';
const WEATHER_TTL=10*60*1000;   // 天文台每 10 分鐘更新一次，照著快取就夠
let _wxCache={at:0,data:null};
let _wxTimer=null;

/** 天文台 icon 代號 → 圖標代號。代號是分段的，用區間對應就好。 */
function wxIcon(code){
  const c=Number(code);
  if(!c)return'i-wx-thermo';
  if(c<=54)return'i-wx-sun';
  if(c<=59)return'i-wx-cloud-sun';
  if(c<=64)return'i-wx-drizzle';
  if(c<=69)return'i-wx-cloud';
  if(c<=74)return'i-wx-rain';
  if(c<=79)return'i-wx-fog';
  if(c<=85)return'i-wx-wind';
  if(c<=99)return'i-wx-storm';
  return'i-wx-cloud-sun';
}
/** 從整包讀數挑一個代表值。優先香港天文台總部，沒有就取第一個測站。 */
function wxPick(data){
  if(!data)return null;
  const temps=(data.temperature&&data.temperature.data)||[];
  if(!temps.length)return null;
  const preferred=['香港天文台','京士柏','啟德','九龍城','觀塘'];
  let pick=null;
  for(const name of preferred){ pick=temps.find(t=>t.place===name); if(pick)break; }
  if(!pick)pick=temps[0];
  const hums=(data.humidity&&data.humidity.data)||[];
  const hum=hums.find(h=>h.place===pick.place)||hums[0]||null;
  const rawWarn=data.warningMessage;
  const warn=Array.isArray(rawWarn)?rawWarn.filter(Boolean):(rawWarn?[String(rawWarn)]:[]);
  const iconArr=Array.isArray(data.icon)?data.icon:[];
  const upd=data.updateTime?String(data.updateTime).slice(11,16):'';
  return {temp:pick.value,place:pick.place,unit:pick.unit||'C',icon:iconArr[0]||null,hum:hum?hum.value:null,warn,upd};
}
function wxHTML(w){
  let s=`<span class="wc-ico"><svg class="ico"><use href="#${wxIcon(w.icon)}"/></svg></span><span class="wc-temp">${w.temp}°${w.unit}</span>`;
  if(w.hum!=null)s+=`<span>${w.hum}%</span>`;
  if(w.warn.length)s+=`<span class="wc-warn"><svg class="ico"><use href="#i-alert"/></svg></span>`;
  return s;
}
function wxTitle(w){
  const parts=[`${w.place} ${w.temp}°${w.unit}`];
  if(w.hum!=null)parts.push(`濕度 ${w.hum}%`);
  if(w.warn.length)parts.push('警告：'+w.warn[0]);
  if(w.upd)parts.push('更新 '+w.upd);
  return parts.join(' · ');
}
function paintWeather(){
  const w=wxPick(_wxCache.data);
  ['weatherChip','loginWeather'].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    if(!w){el.classList.add('hidden');return;}
    el.innerHTML=wxHTML(w);el.title=wxTitle(w);el.classList.remove('hidden');
  });
}
async function loadWeather(force){
  if(!force&&_wxCache.data&&Date.now()-_wxCache.at<WEATHER_TTL){paintWeather();return;}
  try{
    const res=await fetch(WEATHER_API,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data||!data.temperature)throw new Error('payload');
    _wxCache={at:Date.now(),data};
    paintWeather();
  }catch(e){ /* 天文台掛掉時就靜靜不顯示，不要彈錯誤打擾使用者 */ }
}
function startWeather(){
  loadWeather(false);
  if(_wxTimer)clearInterval(_wxTimer);
  _wxTimer=setInterval(()=>loadWeather(true),WEATHER_TTL);
}

function showNotif(text){
  const old=document.getElementById('notifBanner');if(old)old.remove();
  const el=document.createElement('div');el.id='notifBanner';el.classList.add('anim-in-notif');el.textContent=text;
  document.body.appendChild(el);
  clearTimeout(window._notifT);
  window._notifT=setTimeout(()=>{ if(el.parentNode)animOut(el,'anim-out-notif',220); },2700);
}

(async function boot(){
  tryOpenApp();   // 手機裝了 App 就把這一頁交給 App（失敗就留在這裡）
  await checkVersion();
  // 網址帶了 ?t=<權杖>：一次性登入，優先於帳密與上次留下的 session
  if(urlLoginToken){
    if(await consumeLoginToken(urlLoginToken))return;
    // 權杖過期／用過了 → 當作沒帶，往下走正常流程。
    // 但如果是「這台裝置本來就沒登入」，要講清楚是連結失效，不然使用者只會看著登入頁發呆。
    if(!sessionStorage.getItem('chat_me')&&loginError)loginError.textContent='這條登入連結已失效（過期或已經用過），請直接輸入帳號密碼登入。';
    clearUrlCreds();
  }
  // 網址帶了帳密（?u=帳號&p=密碼）：直接登入，優先於上次留下的 session
  if(urlLoginUser&&urlLoginPass){
    loginUsername.value=urlLoginUser;
    loginPassword.value=urlLoginPass;
    try{await ensureAIUser();}catch(e){}
    await handleLogin(urlLoginUser,urlLoginPass);
    return;
  }
  const saved=sessionStorage.getItem('chat_me');
  if(!saved){try{await ensureAIUser();}catch(e){}return;}
  try{
    const u=JSON.parse(saved);
    const snap=await get(child(ref(db),'users/'+u.username));
    if(!snap.exists()){sessionStorage.removeItem('chat_me');return;}
    const data=snap.val();
    if(data.disabled===true){sessionStorage.removeItem('chat_me');return;}
    if(data.banned&&data.banned.type==='severe'){sessionStorage.removeItem('chat_me');return;}
    me={username:data.username,displayName:data.displayName||data.username,chiName:data.chiName||'',engName:data.engName||'',seat:data.seat,cls:data.class||'',color:data.color||'#3b82f6',role:data.role||'member',avatar:data.avatar||null,banned:data.banned||null};
    if(data.theme){theme=data.theme;localStorage.setItem('chat_theme',theme);applyTheme();}
    if(data.lang&&['zh-Hant','zh-Hans','en'].includes(data.lang)){lang=data.lang;localStorage.setItem('chat_lang',lang);applyLang();}
    try{await set(ref(db,'presence/'+me.username),Date.now());}catch(e){}
    try{await ensureAIUser();}catch(e){}
    enterChat();
  }catch(e){sessionStorage.removeItem('chat_me');}
})();
