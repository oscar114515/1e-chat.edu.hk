    /* ACTION 能力：管理員在私人聊天也能操作網站（跟公開頻道同一套指令）。 */
    const capabilityBlock=isAdmin?`\n【你可以做的事】\n- 改變網站語言（用 [ACTION]{"cmd":"setLang","value":"zh-Hant|zh-Hans|en"}[/ACTION]）\n- 因為你是在跟管理員對話，你可以用 [ACTION] 指令操作網站：\n  - setTheme value=dark|light\n  - setLang value=zh-Hant|zh-Hans|en\n  - setColor target=username value=#rrggbb\n  - setName target=username value=新名稱\n  - setAvatar target=username value=emoji\n  - setPassword target=username value=新密碼\n  - ban target=username value=light|severe reason=原因\n  - unban target=username\n  - grantAdmin target=username\n  - revokeAdmin target=username\n  - deleteMsg target=訊息ID\n  - restoreMsg target=訊息ID\n  - purgeMsg target=訊息ID\n  - clearChat\n  - sendSystemNotice target=username|all title=標題 body=內容`:`\n【注意】你沒有操作網站的權限，絕對不要輸出任何 [ACTION] 指令。`;
    const sys=`你是「小喆AI」，正在跟「${me.displayName}」單獨私人聊天。這段對話只有你們兩人看得到。溫柔、活潑，可以用 emoji。${capabilityBlock}\n\n【長期記憶】\n${memText||'（暫無）'}\n\n【最近對話】\n${recent||'（還沒開始）'}\n\n【用戶說】\n${text||'（他傳了一張圖片給你看）'}`;
    /* v1.37：有圖就走多模態（content 改成陣列），AI 才真的看得到畫面 */
    const userContent=img
      ?[{type:'text',text:text||'請看這張圖片，說說你看到什麼。'},{type:'image_url',image_url:{url:img}}]
      :text;
    const aiRes=img
      ?await callAIVision([{role:'system',content:sys},{role:'user',content:userContent}])
      :await callAI([{role:'system',content:sys},{role:'user',content:userContent}]);
    let finalText='';
    if(aiRes){
      const content=aiRes.content||'';
      const actionMatch=content.match(/\[ACTION\]([\s\S]*?)\[\/ACTION\]/);
      let actionCmd=null;
      if(actionMatch){ try{actionCmd=JSON.parse(actionMatch[1]);finalText=content.replace(/\[ACTION\][\s\S]*?\[\/ACTION\]/,'').trim();}catch(e){finalText=content;} }
      if(!actionMatch)finalText=content.trim();
      await update(ref(db,'aiPrivateChat/'+me.username+'/'+thinkKey),{text:finalText,thinking:false,reasoning:aiRes.reasoning||'',sponsor:true,createdAt:Date.now()});
      setAiMood(detectAiMood(finalText));
      if(actionCmd&&isAdmin){ showAIConfirm(actionCmd,me); }
    }
    else{await update(ref(db,'aiPrivateChat/'+me.username+'/'+thinkKey),{text:'抱歉，我現在有點忙',thinking:false});finalText='抱歉，我現在有點忙';}
    /* 寫入私人長期記憶（圖片只記一句佔位，不把 base64 塞進記憶體） */
    try{ await push(ref(db,'aiPrivateMemory/'+me.username+'/messages'),{from:me.displayName||me.username,text:img?('[圖片] '+(text||'')):text,aiReply:finalText,time:Date.now()}); }catch(e){}
    trimAIPrivateMemory().catch(()=>{});
  }catch(e){showNotif('送出失敗');}
  finally{ if(sendBtn){sendBtn.disabled=false;sendBtn.classList.remove('btn-loading');} }
}
async function trimAIPrivateMemory(){
  if(!me)return;
  const snap=await get(ref(db,'aiPrivateMemory/'+me.username+'/messages'));if(!snap.exists())return;
  const val=snap.val();const keys=Object.keys(val);
  if(keys.length<=200)return;
  const sorted=keys.map(k=>({k,time:(val[k]&&val[k].time)||0})).sort((a,b)=>a.time-b.time);
  for(const x of sorted.slice(0,sorted.length-200)){ try{await remove(ref(db,'aiPrivateMemory/'+me.username+'/messages/'+x.k));}catch(e){} }
}

/* ===== 痕跡地圖（網頁版） =====
   只會讀「登入者自己」的 trails/{自己}，沒有查別人軌跡的查詢。
   資料來源是安卓版 App 上傳的點位（網頁本身不記錄位置）。
   疊三層 canvas：底圖磚塊 → 迷霧 → 軌跡線。 */
let tmState=null;
let tmTiles=new Map();
let tmDragging=false,tmLastX=0,tmLastY=0;
const TM_TILE=256;

function tmWorldPx(z){ return TM_TILE*Math.pow(2,z); }
function tmLon2x(lon,z){ return (lon+180)/360*tmWorldPx(z); }
function tmLat2y(lat,z){ const s=Math.sin(lat*Math.PI/180); return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*tmWorldPx(z); }
function tmX2lon(x,z){ return x/tmWorldPx(z)*360-180; }
function tmY2lat(y,z){ const n=Math.PI-2*Math.PI*y/tmWorldPx(z); return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); }

/* 揭霧的半徑用「米」定義。
   以前這裡是寫死 74 像素，但同一條 74 像素的走廊在不同縮放級別代表的真實距離差很大
   （z12 時寬 2.6 公里、z16 時 164 米、z18 時只有 41 米），所以看起來會「忽大忽小」，
   也完全不能代表真的走過的範圍。現在改成固定 15 米，再依當下縮放換算成像素。 */
const TM_REVEAL_RADIUS_M=15;   // 軌跡兩側各揭開 15 米（＝走廊總寬 30 米）
const TM_REVEAL_MIN_PX=2.5;    // 縮到很遠時至少留一條細線，免得整張圖全黑看不到軌跡
/* Web Mercator：某緯度、某縮放級別下，1 像素等於幾米地面距離。 */
function tmMetresPerPx(lat,z){ return 156543.03392804097*Math.cos(lat*Math.PI/180)/Math.pow(2,z); }
function tmMetresToPx(m,lat,z){ return m/tmMetresPerPx(lat,z); }

function tmResize(){
  const body=document.querySelector('#trailMapScreen .tm-body');
  if(!body||!tmState)return;
  const dpr=window.devicePixelRatio||1;
  const w=body.clientWidth,h=body.clientHeight;
  if(!w||!h)return;
  tmState.w=w;tmState.h=h;tmState.dpr=dpr;
  ['tmTiles','tmFog','tmLine'].forEach(id=>{
    const c=document.getElementById(id);if(!c)return;
    c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);
  });
  tmRender();   // 改 canvas 尺寸會清空畫布，要立刻重畫（旋轉螢幕才不會變全黑）
}

function tmRender(){
  if(!tmState||!tmState.w||!tmState.h)return;
  const {w,h,dpr,zoom:z,centerLat,centerLon,fog,points}=tmState;
  const originX=tmLon2x(centerLon,z)-w/2;
  const originY=tmLat2y(centerLat,z)-h/2;
  const xy=points.map(p=>[tmLon2x(p.lng,z)-originX,tmLat2y(p.lat,z)-originY]);

  /* 1. 底圖 */
  const tctx=document.getElementById('tmTiles').getContext('2d');
  tctx.setTransform(dpr,0,0,dpr,0,0);
  tctx.fillStyle='#0e1016';tctx.fillRect(0,0,w,h);
  const maxIdx=Math.pow(2,z)-1;
  for(let tx=Math.floor(originX/TM_TILE);tx<=Math.floor((originX+w)/TM_TILE);tx++){
    if(tx<0||tx>maxIdx)continue;
    for(let ty=Math.floor(originY/TM_TILE);ty<=Math.floor((originY+h)/TM_TILE);ty++){
      if(ty<0||ty>maxIdx)continue;
      const key=z+'/'+tx+'/'+ty;
      let img=tmTiles.get(key);
      if(!img){
        img=new Image();
        img.onload=()=>{ if(tmState)tmRender(); };
        img.src='https://tile.openstreetmap.org/'+key+'.png';
        tmTiles.set(key,img);
      }
      if(img.complete&&img.naturalWidth) tctx.drawImage(img,tx*TM_TILE-originX,ty*TM_TILE-originY,TM_TILE,TM_TILE);
    }
  }

  /* 2. 迷霧：整層蓋住，再把走過的帶狀區擦亮 */
  const fctx=document.getElementById('tmFog').getContext('2d');
  fctx.setTransform(dpr,0,0,dpr,0,0);
  fctx.clearRect(0,0,w,h);
  if(fog){
    fctx.fillStyle='rgba(14,16,22,.74)';
    fctx.fillRect(0,0,w,h);
    fctx.globalCompositeOperation='destination-out';
    fctx.strokeStyle='#000';fctx.fillStyle='#000';
    // 15 米 → 像素。放大縮小都會換算出不同像素數，但涵蓋的真實範圍永遠是 15 米。
    const revealR=Math.max(TM_REVEAL_MIN_PX,tmMetresToPx(TM_REVEAL_RADIUS_M,centerLat,z));
    fctx.lineWidth=revealR*2;fctx.lineCap='round';fctx.lineJoin='round';
    if(xy.length>=2){
      fctx.beginPath();
      xy.forEach(([x,y],i)=>i?fctx.lineTo(x,y):fctx.moveTo(x,y));
      fctx.stroke();
    }else if(xy.length===1){
      fctx.beginPath();fctx.arc(xy[0][0],xy[0][1],revealR,0,Math.PI*2);fctx.fill();
    }
    fctx.globalCompositeOperation='source-over';
  }

  /* 3. 軌跡線 */
  const lctx=document.getElementById('tmLine').getContext('2d');
  lctx.setTransform(dpr,0,0,dpr,0,0);
  lctx.clearRect(0,0,w,h);
  if(xy.length){
    lctx.lineJoin='round';lctx.lineCap='round';
    if(xy.length>=2){
      lctx.beginPath();
      xy.forEach(([x,y],i)=>i?lctx.lineTo(x,y):lctx.moveTo(x,y));
      lctx.strokeStyle='rgba(255,255,255,.85)';lctx.lineWidth=9;lctx.stroke();
      lctx.strokeStyle='#3b82f6';lctx.lineWidth=5;lctx.stroke();
    }
    const start=xy[0],end=xy[xy.length-1];
    if(xy.length>=2){
      lctx.beginPath();lctx.arc(start[0],start[1],6,0,Math.PI*2);
      lctx.fillStyle='#22c55e';lctx.fill();
      lctx.strokeStyle='#fff';lctx.lineWidth=2;lctx.stroke();
    }
    lctx.beginPath();lctx.arc(end[0],end[1],15,0,Math.PI*2);
    lctx.strokeStyle='rgba(59,130,246,.5)';lctx.lineWidth=5;lctx.stroke();
    lctx.beginPath();lctx.arc(end[0],end[1],8,0,Math.PI*2);
    lctx.fillStyle='#3b82f6';lctx.fill();
    lctx.strokeStyle='#fff';lctx.lineWidth=2;lctx.stroke();
  }
}

function tmFit(){
  if(!tmState)return;
  const body=document.querySelector('#trailMapScreen .tm-body');
  if(!body)return;
  const w=body.clientWidth||tmState.w,h=body.clientHeight||tmState.h;
  const pts=tmState.points;
  if(!pts.length){ tmState.centerLat=22.3193;tmState.centerLon=114.1694;tmState.zoom=12;tmRender();return; }
  if(pts.length===1){ tmState.centerLat=pts[0].lat;tmState.centerLon=pts[0].lng;tmState.zoom=17;tmRender();return; }
  const lats=pts.map(p=>p.lat),lngs=pts.map(p=>p.lng);
  const minLat=Math.min.apply(null,lats),maxLat=Math.max.apply(null,lats);
  const minLng=Math.min.apply(null,lngs),maxLng=Math.max.apply(null,lngs);
  tmState.centerLat=(minLat+maxLat)/2;
  tmState.centerLon=(minLng+maxLng)/2;
  let z=18;
  while(z>3){
    const dx=Math.abs(tmLon2x(maxLng,z)-tmLon2x(minLng,z));
    const dy=Math.abs(tmLat2y(minLat,z)-tmLat2y(maxLat,z));
    if(dx<=w*0.72&&dy<=h*0.72)break;
    z--;
  }
  tmState.zoom=z;
  tmRender();
}

function tmZoom(delta){
  if(!tmState)return;
  tmState.zoom=Math.max(3,Math.min(18,tmState.zoom+delta));
  tmRender();
  tmUpdateInfo();
}

function tmPanMove(clientX,clientY){
  if(!tmDragging||!tmState)return;
  const dx=clientX-tmLastX,dy=clientY-tmLastY;
  tmLastX=clientX;tmLastY=clientY;
  const z=tmState.zoom;
  tmState.centerLon=tmX2lon(tmLon2x(tmState.centerLon,z)-dx,z);
  tmState.centerLat=tmY2lat(tmLat2y(tmState.centerLat,z)-dy,z);
  tmRender();
}
function tmPanMouseMove(e){ tmPanMove(e.clientX,e.clientY); }
function tmPanTouchMove(e){
  const t=e.touches&&e.touches[0];if(!t)return;
  tmPanMove(t.clientX,t.clientY);
  if(e.cancelable)e.preventDefault();
}
function tmPanEnd(){ tmDragging=false; const b=document.querySelector('#trailMapScreen .tm-body'); if(b)b.classList.remove('dragging'); }

function tmBindPan(){
  const body=document.querySelector('#trailMapScreen .tm-body');
  if(!body)return;
  const start=(x,y)=>{ tmDragging=true;tmLastX=x;tmLastY=y;body.classList.add('dragging'); };
  body.addEventListener('mousedown',e=>start(e.clientX,e.clientY));
  body.addEventListener('touchstart',e=>{ const t=e.touches[0];if(t)start(t.clientX,t.clientY); },{passive:true});
  window.addEventListener('mousemove',tmPanMouseMove);
  window.addEventListener('mouseup',tmPanEnd);
  body.addEventListener('touchmove',tmPanTouchMove,{passive:false});
  body.addEventListener('touchend',tmPanEnd);
  body.addEventListener('touchcancel',tmPanEnd);
}

function tmUpdateInfo(){
  const info=document.getElementById('tmInfo');
  if(!info||!tmState)return;
  const n=tmState.points.length;
  // 把「揭開半徑」寫出來，這樣放大縮小都可以自己核對是不是同一個實際範圍
  const scale=tmMetresPerPx(tmState.centerLat,tmState.zoom);
  info.textContent=n
    ? '共 '+n+' 個點　·　霧：'+(tmState.fog?('開（軌跡兩側各 '+TM_REVEAL_RADIUS_M+' 米）'):'關')
      +'　·　1 像素 ≈ '+(scale<1?scale.toFixed(2):scale<10?scale.toFixed(1):Math.round(scale))+' 米'
    : '這裡只會顯示你自己的痕跡';
}

async function openTrailMap(){
  if(!me)return;
  const old=document.getElementById('trailMapScreen');
  if(old)old.remove();

  beginPage('trail');
  const div=document.createElement('div');
  div.id='trailMapScreen';
  div.classList.add('anim-in-page');
  div.innerHTML=`<div class="tm-header"><button class="tm-back" data-action="closeTrailMap"><svg class="ico"><use href="#i-back"/></svg></button><div class="tm-title">痕跡地圖</div><span id="tmCount" style="font-size:11.5px;color:var(--text-sub);flex-shrink:0"></span></div><div class="tm-body"><canvas id="tmTiles"></canvas><canvas id="tmFog"></canvas><canvas id="tmLine"></canvas><div class="tm-empty" id="tmEmpty" style="display:none"><b>還沒有痕跡</b><span>在安卓版 App 打開「痕跡地圖」開始記錄，走過的路就會出現在這裡</span></div><div class="tm-info" id="tmInfo">載入中…</div><div class="tm-actions"><button class="tm-btn" id="tmZoomIn">＋</button><button class="tm-btn" id="tmZoomOut">－</button><button class="tm-btn on" id="tmFogBtn" title="切換霧">霧</button><button class="tm-btn" id="tmFit" title="看全部">⤢</button></div></div>`;
  document.body.appendChild(div);

  tmState={points:[],centerLat:22.3193,centerLon:114.1694,zoom:12,fog:true,w:0,h:0,dpr:1};
  tmResize();
  tmBindPan();
  tmRender();

  document.getElementById('tmZoomIn').onclick=()=>tmZoom(1);
  document.getElementById('tmZoomOut').onclick=()=>tmZoom(-1);
  document.getElementById('tmFit').onclick=()=>{ tmFit();tmUpdateInfo(); };
  document.getElementById('tmFogBtn').onclick=()=>{
    if(!tmState)return;
    tmState.fog=!tmState.fog;
    document.getElementById('tmFogBtn').classList.toggle('on',tmState.fog);
    tmRender();tmUpdateInfo();
  };
  window.addEventListener('resize',tmResize);

  try{
    const snap=await get(ref(db,'trails/'+me.username));
    const val=snap.exists()?snap.val():{};
    const pts=Object.keys(val).map(k=>val[k])
      .filter(p=>p&&typeof p.lat==='number'&&typeof p.lng==='number')
      .map(p=>({lat:p.lat,lng:p.lng,t:p.t||0}))
      .sort((a,b)=>a.t-b.t);
    if(!tmState)return; // 載入途中已經關掉了
    tmState.points=pts;
    const cnt=document.getElementById('tmCount');
    if(cnt)cnt.textContent=pts.length?pts.length+' 個點':'';
    const empty=document.getElementById('tmEmpty');
    if(empty)empty.style.display=pts.length?'none':'flex';
    tmFit();
    tmUpdateInfo();
  }catch(err){
    const info=document.getElementById('tmInfo');
    if(info)info.textContent='載入失敗：'+(err.message||err);
  }
}

function closeTrailMap(){
  const el=document.getElementById('trailMapScreen');
  window.removeEventListener('resize',tmResize);
  window.removeEventListener('mousemove',tmPanMouseMove);
  window.removeEventListener('mouseup',tmPanEnd);
  tmDragging=false;
  if(currentPageKey==='trail') popPage();          // 先把下面那層推回來，地圖再滑走
  if(el)animOut(el,'anim-out-page',300).then(()=>{ tmState=null; tmTiles=new Map(); });
  else { tmState=null; tmTiles=new Map(); }
}

{ver:'v1.34',date:'2026-10-13',changes:['飛行棋整個重做成 15×15 標準版型（照參考站 game.hullqin.cn/fxq 的版面）：','- 52 格環繞十字跑道；四角各一個 3×3 機場（左上綠／右上紅／右下黃／左下藍），各 4 個停機位','- 四條 5 格航道（上紅往下／下藍往上／左綠往右／右黃往左）＋灰色雪佛龍指引＋白圈','- 第 52～56 步走航道，第 57 步＝進入中央屬於自己的那塊三角（完成）','- 中央改成四色三角（上紅／右黃／下藍／左綠），深藍底 #0a1d42，棋子改成飛機圖示','- 修好舊版「基地框畫到畫布外被裁掉」的老問題（以前看起來不像機場）','飛行棋規則一行沒改（仍是 52 步繞環＋6 步入終點、擲 6 起飛、踩子回基地、4 架全到獲勝）']},
{ver:'v1.33',date:'2026-10-13',changes:['按桌遊棋盤規範整修有棋盤的幾款（有介面的社交類不變）：','康樂棋改成圓形跑道：52 格平均繞圓周、正上方第 1 格、金色外框，中間有康樂棋字樣（以前是方格盤）','五子棋與中國象棋的棋盤改用規範木色 #d29a55 與線色 #4d2d18，外框 12px 木框；中國象棋補上楚河漢界','修好一個看得出來但不容易發現的畫質問題：canvas 的 1px 格線畫在整數座標會跨在兩個像素之間，每條線被平均成 50% 混色（灰灰糊糊）；偏移 0.5px 讓線落在像素中心，格線現在是清晰的','國際象棋棋盤改成規範配色（淺格 #d8b27a／深格 #704d32）','大富翁中央改成規範的環形色帶（conic 環）＋金色外框','鬥獸棋的河（藍）、獸穴（紅實線）、陷阱（紅虛線）現在看得見了','飛行棋畫布改成木色系，環格加金邊，跟其他棋盤一致']},
{ver:'v1.32',date:'2026-10-13',changes:['小遊戲外觀全部統一（14 款）：深藍漸層面板 + 金色標題描邊 + 木色棋盤，跟之前那套 UI 同一個語言；棋盤類（井字棋、五子棋、中國象棋、國際象棋、圍棋、飛行棋、康樂棋、大富翁、鬥獸棋）與圓桌／牌桌類（狼人殺、誰是臥底、傳炸彈、劇本殺、UNO、你畫我猜）現在看起來是同一套東西，不再是每款各寫一種長相','棋盤統一成木色（含格線與邊框），棋子固定黑／白；玩家顏色的棋子與頭像則自動補對比描邊','安卓版 1.8.2：房間標題與「輪到你」提示改成同一套金色，跟網頁一致']},
{ver:'v1.31',date:'2026-10-13',changes:['修好「房主開完房退出，那條邀請一直留在對話框、點進去只剩自己一個」：現在房主離開＝直接關閉房間，邀請卡會自動變成已完成（變灰不可點）','修好「從邀請進去玩完想退出，卻被丟到小遊戲大廳」：從邀請／房間連結進來的，退出（或按回到大廳）都直接回聊天室','新增「房間列表」：點任何遊戲先看到現在有幾間房在等 —— 房主是誰、幾人／幾人、等待中／倒數中／進行中，未滿可以加入、進行中可觀戰、滿了顯示已滿；下面才是「建立自己的房間」。已沒人的空房與超過 6 小時的舊房不會顯示（就是以前房主退出留下的那些）','修好版本號顯示：標題與登入頁一直寫死在 v1.21，現在一律跟著最新版本自動更新','AI 出題加速：只要「夠用就好」的數量（誰是臥底 6 組詞→2 組、傳炸彈 6 類→3 類），逾時上限 30 秒→12 秒（劇本殺 45→25 秒）；實測出題 3～7 秒','倒數完但題目還沒出好時，畫面顯示「AI 出題中…請稍候（人數已到齊，題目一出好就自動開局）」，不再退回等待、也不會留一個 0 讓人猜；題目一出好就自動開局','安卓版 1.8.1：同步以上全部（房主退出關房、退出回聊天、房間列表、等 AI 出題的顯示）']},
{ver:'v1.30',date:'2026-10-13',changes:['把「別人的主頁」那張 3D 翻轉卡片加回來（v1.20.1 改版時被換成了平平無奇的圓頭像）：點聊天室任何人的頭像進他的主頁，就會看到帶玻璃反光與五層圓球的立體卡片，滑過去會翻轉','3D 卡片上的五顆圓球會跟著對方的個人顏色走','順手修好原補丁裡三個小毛病：補上缺少的 hexA() 色彩透明度函式、CSS 選擇器 .plogo 打錯（應為 .p3logo，不改的話圓球不會有共用樣式）、以及 margin-top:12px3 這個無效值']},
{ver:'v1.29',date:'2026-10-13',changes:['AI 出題加速（以前等太久）：只要「夠用就好」的數量 —— 誰是臥底由 6 組詞減到 2 組、傳炸彈 6 類減到 3 類、你畫我猜按人數折半；輸出變短，回得就快','AI 的逾時上限縮短：一般題目 30 秒 → 12 秒，劇本殺 45 秒 → 25 秒；真的太久就直接用內置題庫開局，不再讓全班對著倒數乾等','倒數完但題目還沒出好時，畫面會老實顯示「AI 出題中…請稍候（人數已到齊，題目一出好就自動開局）」，不再退回等待狀態、也不會留一個 0 讓人猜','題目一出好就自動開局，不用再等下一輪倒數','棋子／頭像顏色自動對比處理：跟底色太接近（例如玩家選了白色放在深色卡片上）會自動補一圈對比色描邊 —— 淺底描深、深底描淺；頭像上的字也會自動選黑或白，不會再出現看不見的字','安卓版 1.8.0：同步以上全部（棋盤格線、黑白棋子、對比描邊、等 AI 出題的顯示）']},
{ver:'v1.28',date:'2026-10-12',changes:['棋子顏色自動對比處理：保留玩家顏色的棋子與頭像（康樂棋、大富翁、狼人殺、投票名單…），如果那個顏色跟底色太接近（例如玩家選了白色，放在淺色卡片上就整個消失），會自動補一圈對比色描邊 —— 淺底描深、深底描淺，描邊用 box-shadow 畫，不會撐大排版','頭像上的字也會自動選黑或白，深色底配白字、淺色底配黑字，不會再出現看不見的字','安卓版同步同一套規則（頭像、色塊自動描邊與自動字色）','安卓版大廳不再虛報：只把真正做完原生介面的 4 款（井字棋、五子棋、誰是臥底、傳炸彈）標成可玩，其餘照實顯示「介面製作中」，不再點進去才發現不能用','安卓版 1.7.4']},
{ver:'v1.27',date:'2026-10-12',changes:['修好安卓版棋盤看不到的問題：安卓的五子棋以前**完全沒有畫格線**（整塊深色背景 + 飄著的圓點），看起來就是壞掉；現在格線與落點用同一條公式（第 i 格中心 = (i+0.5)/n），線與棋子天生對齊，不可能再出現「線和棋子分開」','棋子改用黑／白（先手黑、後手白），不再用玩家個人的 16 進制顏色：五子棋的黑白子、井字棋的深色 ✕ 與白圈 ○（白圈加深色描邊，木色棋盤上看得清楚）','新增兩端共用的「遊戲契約」：每款遊戲的棋盤型別、狀態機、事件、勝負規則只寫一份，兩端照同一份做，避免再出現「安卓跟網頁不一樣」','棋盤配色統一成木色棋盤 + 深色格線，兩端外觀一致','安卓版 1.7.3']},
{ver:'v1.26',date:'2026-10-11',changes:['修好安卓版聊天室的進場位置：以前進入 App、重新整理或從別的頁面回到聊天室，畫面會停在最頂端最舊的那幾則訊息，要一直往下滑才看得到最新的；現在一進聊天室就直接停在最底部的最新訊息','同一個問題在私人群聊與 AI 對話也一起修好了','順帶改進：只有「本來就在看最新訊息」時才會跟著新訊息自動往下捲，正在往上翻舊訊息的時候不會被硬拉走','安卓版 1.7.2']},
{ver:'v1.25',date:'2026-10-11',changes:['修好等待室卡住的問題：以前只有在「你自己加入的那一刻」才會開始倒數，如果最後一位是別端（另一支手機、安卓版、或直接寫進資料庫）加進來的，兩邊都不會開始倒數，畫面就會一直停在「人數 2/2 · 等待中」','現在改成只要人數已到齊、而且還沒有開始倒數，房間裡任何一個人都會自動把它推進倒數；倒數途中有人退出而取消，補齊人數後也會自己重新倒數','順手把文字改清楚：人數已到齊就顯示「人數已到齊，倒數後自動開局」，不會再出現「還需要 0 人才能開局」這種句子；題目還沒準備好時也會老實說「正在準備題目」','安卓版 1.7.1：同步這個修正']},
{ver:'v1.24',date:'2026-10-11',changes:['安卓版小遊戲改用「原生介面」重寫（不再內嵌網頁）：大廳、開房、等待室、倒數、觀戰、對局、結算全部由安卓自己畫，讀寫的是同一份資料，跟網頁版互通','安卓版第一批原生支援 7 款：井字棋、五子棋、誰是臥底、傳炸彈、康樂棋、大富翁、狼人殺（其餘款式的原生介面會在後續版本一款一款補上）','新增「網址引導」：在網址後面加 ?game=遊戲代號 或 ?room=房間編號，打開就跟平常一樣走登入（能自動登入就自動登入、要打密碼就打密碼），登入完成後直接跳到那個小遊戲或那一間房間','每一間房間都有自己的網址（?room=<房號>），房間內與聊天室的對局邀請卡都有「複製房間連結 / 複製這間房間的連結」可以一鍵複製，傳給同學點開就能進同一間房','如果點進去時那局已經結束了（而且你不是當時的玩家）→ 顯示「你來遲了，對局已經結束」並說明最後是誰獲勝，不會再把你塞進已經打完的房間','房間已經被關閉或不存在 → 明確顯示「房間已不存在或已被關閉」，不會停在「載入中」','支援 ?game=<代號>：直接打開那一款遊戲的開房面板（例如 ?game=gomoku 直接彈出五子棋開房）','新增「狼人殺」（6–18 人）：狼人／預言家／村民三種角色，夜晚狼人選人殺、預言家查身分，天亮公布死者後輪流發言（像聊天、講完自動輪下一位），再投票放逐；票高者出局，平票則平票的人單獨再投；狼人全出局＝村民勝、狼人數量不少於其他人＝狼人勝','新增「大富翁」（2–6 人，簡化版）：28 格環形棋盤、買地收租、機會卡、稅金、經過起點收 200，付不出錢就破產出局，最後剩下的人獲勝']},
{ver:'v1.23',date:'2026-10-11',changes:['修好「誰是臥底」全部人拿到同一個詞的問題：AI 偶爾會出「兩個詞一樣」的題目（例如「水果／水果」），這種題目會直接淘汰不用，而且開局時一定會有一個臥底拿不同的詞','誰是臥底改成「打字描述」：輪到你時輸入框會出現，打完按送出就自動輪到下一位，不再由房主決定什麼時候換人','新增像聊天一樣的描述紀錄：每個人講的話都留在裡面，新的在下面、舊的往上推，所有人都看得到','三個人一輪講完就自動進入投票；不用房主按任何按鈕','投票完成會彈出結果框，列出每個人的票數以及誰投了誰，票最高的那位出局','平票會讓最高的幾位單獨再投一次（其他人只能在他們之間二選一，平票的人自己不能再投）','出局後如果還有得玩（場上多於兩人）就可以繼續下一輪描述；人數不夠就直接判勝負並顯示「平民獲勝／臥底獲勝」','沒收房主專屬的「下一位／進入投票」按鈕：描述輪替、進投票、下一輪全部自動或人人可操作','新增「中國象棋」（9×10 棋盤）：車馬炮象士將卒的走法、蹩馬腿、塞象眼、炮隔子才可食、過河兵可橫行、將帥不可對面（白臉將）、被將死或無棋可走判負，規則完整實作','修好提示訊息會擋住畫面、按不到底下的按鈕（例如象棋選棋子）的問題']},
{ver:'v1.22',date:'2026-10-11',changes:['小遊戲一次開放 4 款新桌遊：傳炸彈、劇本殺、康樂棋、鬥獸棋（連同之前 7 款，現在共 11 款可以直接玩）','傳炸彈（2–10 人）：題目是 AI 出的「類別」（例如「水果」「三國人物」），炸彈輪流傳，輪到你要在限時內講出一個答案，講過不能重複；時間到就爆在你手上被淘汰，每淘汰一人時間縮短、換一個新題目，最後剩下的人贏','劇本殺（4–10 人）：AI 當場寫一宗案件（背景＋每個角色一份公開資料與一個秘密），每個人只看到自己的角色卡，其中一人是兇手；讀完劇本進討論，接著投票，投中兇手大家贏、投錯兇手贏','康樂棋（2–4 人）：香港經典擲骰競速，踩到綠格加速、紅格後退，先到第 52 格的人獲勝','鬥獸棋（2 人）：象獅虎豹狼狗貓鼠，大食細、鼠食象、獅虎可以跳河、走進對方陷阱的棋子戰力歸零，攻入對方獸穴或食光對方棋子就贏','兩款新 AI 遊戲（傳炸彈、劇本殺）同樣有三檔難度「搞笑／普通／困難」，題目每次都不一樣；AI 連不上時會自動用內置題庫，不會卡住開不了局','安卓版 1.6.0：聊天室「＋」面板新增「小遊戲」入口，進去就是同一套遊戲介面；聊天室收到對局邀請也可以直接點卡片進房間','修好「題目是否已備妥」的判斷：以前只有詞對類題目會被認得，現在各款遊戲用自己的方式判斷，開局前一定等到題目真的好了','團隊勝負（劇本殺）現在會正確記錄每個人的勝負，不再是只有一個人算贏']},
{ver:'v1.21',date:'2026-10-11',changes:['新增「小遊戲」：從輸入框的「+」進去，有 16 款經典桌遊（井字棋、五子棋、飛行棋、UNO、國際象棋、誰是臥底、你畫我猜已經可以玩，其餘陸續開放）','開房後會自動在聊天室發一條帶編號的邀請訊息（走原本的訊息系統），別人點一下就能進房間；對局一結束，那條邀請會自動變成「對局已完成」、加入按鈕消失','誰是臥底（3–12 人）：題目由 AI 即時生成，分「搞笑／普通／困難」三檔難度，每次都不一樣；發詞、輪流描述、投票、淘汰、身分揭曉全程自動判定','你畫我猜（2–10 人）：一人畫、其他人猜、猜中得分、輪流當畫手，畫筆即時同步；題目由 AI 生成（三檔難度）','人齊自動倒數開局（到最少人數就倒數 15 秒），名額滿了再進去會提示「對局已滿」；房主可以決定這局是否允許觀戰','倒數期間有人退出會立即取消倒數，不會再「人不夠也硬開局（改用連線偵測，關掉頁面也會自動退出房間）」','每局勝負會記進個人戰績，在大廳的遊戲卡片上可以看到自己的勝負場數；結束畫面會分清楚「你贏了／你輸了／XX 獲勝」','UNO 與國際象棋改用成熟規則引擎（uno-engine、chess.js），發牌、出牌合法性、將軍、將死、升變、王車易位等全部由引擎判定','網頁版和安卓版共用同一套遊戲介面，之後新增遊戲兩端同時生效']},

/* ═══ v1.41 版本資訊：網頁版 + 安卓版 ═══
   以前這裡只讀 HTML 裡寫死的清單，而且只展開最近 8 版、更早的只留版本號，
   看起來就像「1.29 之前全部消失了」。
   其實完整歷史一直都在資料庫：meta/changelog/web（網頁版）、meta/changelog/android（安卓版），
   安卓 App 的「更新日誌」就是讀同一個節點。現在網頁版也改讀這兩個節點，
   所以網頁也看得到安卓版的更新，而且以後兩邊都不用再各改一份。
   HTML 裡寫死的 VERSION_HISTORY 只當「連不上資料庫」時的離線保底。 */
let verKind='web';            // 目前分頁：web | android
let verCache=null;            // { web:[…], android:[…] }
let verOpen={};               // 哪幾版是展開的
let verAndroid=null;          // meta/android（最新 APK 資訊）

function verNum(v){ return String(v||'').replace(/^v/i,'').split('.').map(x=>parseInt(x,10)||0); }
function verCmp(a,b){                                  // 版本號由新到舊
  const x=verNum(a.ver), y=verNum(b.ver), n=Math.max(x.length,y.length);
  for(let i=0;i<n;i++){ const d=(y[i]||0)-(x[i]||0); if(d) return d; }
  const dd=String(b.date||'').localeCompare(String(a.date||'')); if(dd) return dd;
  return String(b.ver).length-String(a.ver).length;
}
function verSum(v){
  const c=String((v.changes&&v.changes[0])||'').trim();
  return c.length>46?(c.slice(0,46)+'…'):c;
}
async function verLoad(){
  if(verCache) return;
  const fallback=VERSION_HISTORY.map(v=>({ver:v.ver,date:v.date||'',changes:(v.changes||[]).slice()}));
  verCache={web:fallback,android:[]};
  try{
    const snap=await get(ref(db,'meta/changelog'));
    const all=snap.val()||{};
    const conv=o=>Object.keys(o||{}).map(k=>o[k]).filter(x=>x&&x.ver)
      .map(x=>({ver:String(x.ver),date:String(x.date||''),changes:(x.changes||[]).map(c=>String(c))}));
    const dbWeb=conv(all.web);
    if(dbWeb.length){
      /* 資料庫裡有的就用資料庫的（那是唯一真相）；HTML 裡還沒寫進資料庫的新版本也照樣顯示 */
      const have=Object.create(null);
      dbWeb.forEach(x=>have[x.ver]=1);
      verCache.web=dbWeb.concat(fallback.filter(x=>!have[x.ver]));
    }
    const dbAnd=conv(all.android);
    if(dbAnd.length) verCache.android=dbAnd;
  }catch(e){}
  verCache.web.sort(verCmp);
  verCache.android.sort(verCmp);
  try{ verAndroid=(await get(ref(db,'meta/android'))).val()||null; }catch(e){ verAndroid=null; }
}
function verRow(v,latest){
  const open=!!verOpen[v.ver];
  const ch=(v.changes||[]).filter(x=>String(x).trim());
  const sum=verSum(v);
  return `<div class="version-item vitem ${latest?'latest':''} ${open?'open':''}" data-action="verToggle" data-arg="${escAttr(v.ver)}">
    <div class="vi-head"><span class="vi-ver">${escapeHtml(v.ver)}</span>${latest?'<span class="vi-badge">最新</span>':''}${v.date?`<span class="vi-date">${escapeHtml(v.date)}</span>`:''}<span class="vi-arrow">▸</span></div>
    ${open
      ? (ch.length?`<div class="vi-changes"><ul>${ch.map(c=>`<li>${escapeHtml(c)}</li>`).join('')}</ul></div>`:'<div class="vi-sum">（沒有留下說明）</div>')
      : (sum?`<div class="vi-sum">${escapeHtml(sum)}</div>`:'')}
  </div>`;
}
function verPaint(){
  const box=document.getElementById('verBody'); if(!box) return;

/* ═══════════════ 天氣（香港天文台開放數據，免 key、支援 CORS） ═══════════════ */
const WEATHER_API='https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc';
const WEATHER_TTL=10*60*1000;   // 天文台每 10 分鐘更新一次，照著快取就夠
let _wxCache={at:0,data:null};
let _wxTimer=null;

/** 天文台 icon 代號 → 圖標代號。代號是分段的，用區間對應就好。 */
function wxIcon(code){
  const c=Number(code);
  if(!c)return'i-wx-thermo';
  if(c<=54)return'i-wx-sun';
  if(c<=59)return'i-wx-cloud-sun';
  if(c<=64)return'i-wx-drizzle';
  if(c<=69)return'i-wx-cloud';
  if(c<=74)return'i-wx-rain';
  if(c<=79)return'i-wx-fog';
  if(c<=85)return'i-wx-wind';
  if(c<=99)return'i-wx-storm';
  return'i-wx-cloud-sun';
}
/** 從整包讀數挑一個代表值。優先香港天文台總部，沒有就取第一個測站。 */
function wxPick(data){
  if(!data)return null;
  const temps=(data.temperature&&data.temperature.data)||[];
  if(!temps.length)return null;
  const preferred=['香港天文台','京士柏','啟德','九龍城','觀塘'];
  let pick=null;
  for(const name of preferred){ pick=temps.find(t=>t.place===name); if(pick)break; }
  if(!pick)pick=temps[0];
  const hums=(data.humidity&&data.humidity.data)||[];
  const hum=hums.find(h=>h.place===pick.place)||hums[0]||null;
  const rawWarn=data.warningMessage;
  const warn=Array.isArray(rawWarn)?rawWarn.filter(Boolean):(rawWarn?[String(rawWarn)]:[]);
  const iconArr=Array.isArray(data.icon)?data.icon:[];
  const upd=data.updateTime?String(data.updateTime).slice(11,16):'';
  return {temp:pick.value,place:pick.place,unit:pick.unit||'C',icon:iconArr[0]||null,hum:hum?hum.value:null,warn,upd};
}
function wxHTML(w){
  let s=`<span class="wc-ico"><svg class="ico"><use href="#${wxIcon(w.icon)}"/></svg></span><span class="wc-temp">${w.temp}°${w.unit}</span>`;
  if(w.hum!=null)s+=`<span>${w.hum}%</span>`;
  if(w.warn.length)s+=`<span class="wc-warn"><svg class="ico"><use href="#i-alert"/></svg></span>`;
  return s;
}
function wxTitle(w){
  const parts=[`${w.place} ${w.temp}°${w.unit}`];
  if(w.hum!=null)parts.push(`濕度 ${w.hum}%`);
  if(w.warn.length)parts.push('警告：'+w.warn[0]);
  if(w.upd)parts.push('更新 '+w.upd);
  return parts.join(' · ');
}
function paintWeather(){
  const w=wxPick(_wxCache.data);
  ['weatherChip','loginWeather'].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    if(!w){el.classList.add('hidden');return;}
    el.innerHTML=wxHTML(w);el.title=wxTitle(w);el.classList.remove('hidden');
  });
}
async function loadWeather(force){
  if(!force&&_wxCache.data&&Date.now()-_wxCache.at<WEATHER_TTL){paintWeather();return;}
  try{
    const res=await fetch(WEATHER_API,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data||!data.temperature)throw new Error('payload');
    _wxCache={at:Date.now(),data};
    paintWeather();
  }catch(e){ /* 天文台掛掉時就靜靜不顯示，不要彈錯誤打擾使用者 */ }
}
function startWeather(){
  loadWeather(false);
  if(_wxTimer)clearInterval(_wxTimer);
  _wxTimer=setInterval(()=>loadWeather(true),WEATHER_TTL);
}

/* ════════════════════════════════════════════════════════════════════════
   v1.38 遠端配置（meta/remote）
   ────────────────────────────────────────────────────────────────────────
   為甚麼要有：
     以前想停一個功能（例如視訊伺服器出事），要改 chat.html → 部署 → 等 Pages
     重建，安卓還要重新編譯上架，全班都更新完才算「真正」停到。中間那幾個鐘頭
     用戶點進去依然可以用。
     現在所有入口都先問一句 meta/remote：off 就即場顯示「暫停服務」；改主色、
     改公告、改字級一樣，寫入 Firebase 即刻生效（onValue 實時推送），
     不需要重新載入，更不需要重新出 App。

   設計原則（很重要，錯一次就全班進不去）：
     1. 節點不存在／格式錯／讀不到 → 一律當「全開」，永遠不會因為配置壞掉鎖死
     2. 只認白名單欄位；顏色只收 #hex；背景只收 #hex 或 https 圖；數字有上下限
     3. 每次寫入帶 rev／by／at，出事查得到誰在幾時改過
   ════════════════════════════════════════════════════════════════════════ */
const REMOTE = { rev:0, feat:{}, ui:{}, notice:null, tools:null, loaded:false };
const FEATURES = {
  profile:{n:'個人主頁'}, groups:{n:'群聊'}, ai:{n:'AI 聊天'}, admin:{n:'管理員'},
  games:{n:'小遊戲'}, call:{n:'視訊通話'},
  notices:{n:'公告'}, trail:{n:'痕跡地圖'}, online:{n:'在線查詢'},
  mylogs:{n:'我的日誌'}, feedback:{n:'問題反饋'}, loginlink:{n:'一次性登入連結'},
  send:{n:'發送訊息'}, voice:{n:'語音訊息'},
  tools:{n:'小程式'}, live:{n:'共享地圖'}
};
/* 哪一個介面入口屬於哪一個功能。點落去之前先查一次 */
const ACT_FEATURE = {
  openMyProfile:'profile', openUserProfile:'profile', openMyLogs:'mylogs',
  openGroupList:'groups', submitGroupMessage:'groups', submitCreateGroup:'groups',
  openAIPrivate:'ai', submitAIPrivateMessage:'ai', toggleAI:'ai', toggleAIMeta:'ai',
  openAdmin:'admin',
  openGames:'games', openGameInvite:'games',
  callClass:'call',
  openNoticeCreate:'notices', submitNotice:'notices', noticeCarousel:'notices', openNoticeDetail:'notices',
  openTrailMap:'trail', openOnlineQuery:'online',
  submitFeedback:'feedback', openLoginLink:'loginlink',
  send:'send', pickImage:'send', pickFile:'send', pickLocation:'send', submitPoll:'send',
  playVoice:'voice', playGroupVoice:'voice',
  openTools:'tools', openLiveMap:'live'
};
function featOff(id){ const f=REMOTE.feat&&REMOTE.feat[id]; return !!(f&&f.on===false); }
function featNote(id){ const f=REMOTE.feat&&REMOTE.feat[id]; return (f&&typeof f.note==='string')?f.note:''; }

/* 停用時彈的整頁面（沿用 openPage，可以按返回） */
function showPaused(id){
  const F=FEATURES[id]||{n:id};
  const note=featNote(id);
  openPage({ title:F.n+' · 暫停服務',
    bodyHTML:'<div class="paused">'
      +'<div class="paused-ico"><svg class="ico"><use href="#i-wrench"/></svg></div>'
      +'<div class="paused-t">'+escapeHtml(F.n)+' 暫停服務</div>'
      +'<div class="paused-s">'+escapeHtml(note||'管理員已暫時關閉此功能，請稍後再試。')+'</div>'
      +'<button class="btn-primary" data-action="closePage">返回</button>'
    +'</div>',

}
function remoteGuard(action){
  const f=ACT_FEATURE[action];
  if(!f||!featOff(f))return false;
  showPaused(f);
  return true;
}

/* 把已停用的入口畫灰＋標「暫停」 */
function markOff(){
  let list;
  try{ list=document.querySelectorAll('[data-action]'); }catch(e){ return; }
  for(let i=0;i<list.length;i++){
    const el=list[i], f=ACT_FEATURE[el.dataset.action];
    if(!f)continue;
    const off=featOff(f);
    if(el.classList.contains('is-off')!==off)el.classList.toggle('is-off',off);
    const tag=el.querySelector(':scope > .off-tag');
    if(off&&!tag){ const s=document.createElement('span'); s.className='off-tag'; s.textContent='暫停'; el.appendChild(s); }
    else if(!off&&tag)tag.remove();
  }
}

/* 聊天室背景：只收 #hex 或者 https 圖片，其餘不理 */
function safeBg(v){
  const s=String(v||'').trim();
  if(!s)return null;
  if(/^#[0-9a-f]{3,8}$/i.test(s))return s;
  if(/^https:\/\/[^\s"'()]+$/i.test(s))return 'url("'+s+'") center/cover no-repeat fixed';
  return null;
}

function renderRemoteNotice(){
  const n=REMOTE.notice;
  let el=document.getElementById('remoteNotice');
  const on=!!(n&&n.on!==false&&n.text);
  if(!on){ if(el)el.remove(); return; }
  if(!el){
    el=document.createElement('div'); el.id='remoteNotice';
    el.innerHTML='<span class="rn-txt"></span><button class="rn-x" aria-label="關閉">&times;</button>';
    document.body.appendChild(el);
  }
  /* 入咗聊天室就排入版面（標題列下面），未登入就浮喺中間 */
  try{
    const cs=document.getElementById('chatScreen');
    const inChat=cs&&!cs.classList.contains('hidden');
    const hd=cs?cs.querySelector(':scope > header'):null;
    if(inChat&&hd){
      if(el.previousElementSibling!==hd)cs.insertBefore(el,hd.nextSibling);
    } else if(el.parentElement!==document.body){
      document.body.appendChild(el);
    }
  }catch(e){}
  const lv=(n.level==='warn'||n.level==='danger')?n.level:'info';
  el.className='rn-'+lv;
  const txt=el.querySelector('.rn-txt');
  if(txt.textContent!==String(n.text))txt.textContent=String(n.text);
  if(!el.dataset.bound){
    el.dataset.bound='1';
    el.querySelector('.rn-x').onclick=()=>{ el.remove(); };
  }
}

function applyRemote(){
  const ui=REMOTE.ui||{}, rt=document.documentElement.style;
  if(ui.primary)rt.setProperty('--primary',safeColor(ui.primary,'#3b82f6'));
  if(ui.primary2)rt.setProperty('--primary-2',safeColor(ui.primary2,'#2563eb'));
  const rad=parseInt(ui.radius,10);
  if(rad>=0&&rad<=24){
    rt.setProperty('--r-1',rad+'px');
    rt.setProperty('--r-2',(rad+4)+'px');
    rt.setProperty('--r-3',(rad+8)+'px');
  }
  const fs=parseInt(ui.font,10);
  if(fs>=85&&fs<=130)document.documentElement.style.fontSize=(fs/100*16)+'px';
  if(ui.theme==='dark'){ document.body.classList.remove('theme-light'); }
  else if(ui.theme==='light'){ document.body.classList.add('theme-light'); }
  const cb=document.getElementById('chatBox');
  if(cb){
    const bg=safeBg(ui.chatBg);
    if(bg){
      if(/^url\(/.test(bg))cb.style.backgroundImage=bg;
      else { cb.style.backgroundImage=''; cb.style.background=bg; }
    } else { cb.style.backgroundImage=''; cb.style.background=''; }
  }
  if(ui.title)document.title=ui.title;
  renderRemoteNotice();
  markOff();
  syncFeatureState();
  refreshRemoteTab();
}

/* ═══════════════════════════════════════════════════════════════════
   彩蛋：秋葵雨
   ── 在任何「畫面上見得到」的輸入框（聊天框、登入帳號、搜尋、改名、
      投票選項、AI 聊天…只要是 <input> / <textarea>）輸入含有「秋葵」
      兩個字的內容並送出（按 Enter，或者撳任何一粒掣），就會落一場
      秋葵雨；同時寫入 Firebase meta/easterEgg/okra，所有已開啟的
      客戶端會一齊落（跟遠端配置一樣是即時推送，不用重新載入）。
   ── 前後加幾多字都無所謂，只要內容裡面有「秋葵」就觸發。
   ── 動畫自己畫，不去載 CDN：CSP 只放行 'self' 與 gstatic，
      jsdelivr 那個 canvas-confetti 會被直接擋住（會靜靜失敗）。
   ═══════════════════════════════════════════════════════════════════ */
const OKRA_PATH='meta/easterEgg/okra';
let okraLayer=null,okraMyAt=0,okraLastFire=0,okraReady=false,okraAlive=0,okraStopFn=null;

/* 中間夾了空格或零寬字元都當作有：「秋 葵」「秋​葵」 */
function okraFind(text){
  if(!text) return false;
  const t=String(text).replace(/[\s\u200b\u200c\u200d\ufeff]/g,'');
  return t.indexOf('秋葵')>=0;
}

function okraVisibleText(){
  const els=document.querySelectorAll('input,textarea,[contenteditable="true"],[contenteditable=""]');
  for(let i=0;i<els.length;i++){
    const el=els[i];
    const v=('value' in el&&typeof el.value==='string')?el.value:(el.textContent||'');
    if(!v||!okraFind(v)) continue;                 /* 先驗字，免得為每個輸入框算樣式 */
    const r=el.getBoundingClientRect();
    if(r.width<4||r.height<4) continue;
    const st=getComputedStyle(el);
    if(st.display==='none'||st.visibility==='hidden'||st.opacity==='0') continue;
    return true;
  }
  return false;
}

function okraRain(){
  if(okraLayer) return;
  const cv=document.createElement('canvas');
  cv.id='okraLayer';
  cv.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2147483000';
  document.body.appendChild(cv);
  okraLayer=cv;
  const ctx=cv.getContext('2d');
  const dpr=Math.min(2,window.devicePixelRatio||1);
  let W=0,H=0;
  function fit(){
    W=window.innerWidth||document.documentElement.clientWidth||360;
    H=window.innerHeight||document.documentElement.clientHeight||640;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  fit();

  const COLORS=['#4ade80','#22c55e','#166534','#a3e635'];
  const EMJ=['🥒','🥒','🥒','🥬'];
  const CAP=650;
  const P=[];
  const rnd=(a,b)=>a+Math.random()*(b-a);

  /* emoji 預先畫成一張小圖，之後逐幀 drawImage，比每幀改 font 快很多 */
  const sprites={};
  function emo(ch,size){
    const k=ch+size;
    if(sprites[k]) return sprites[k];
    const s=Math.ceil(size*1.5);
    const c=document.createElement('canvas');
    c.width=s;c.height=s;
    const g=c.getContext('2d');
    g.font=size+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText(ch,s/2,s/2);
    sprites[k]=c;
    return c;
  }

  function add(p){ if(P.length<CAP) P.push(p); }

  function burst(cx,cy,n,deg,spread,vmin,vmax,emoRate){
    for(let i=0;i<n;i++){
      const a=(deg+rnd(-spread/2,spread/2))*Math.PI/180;
      const v=rnd(vmin,vmax);
      const isE=Math.random()<emoRate;
      add({
        x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
        g:isE?0.11:0.24,drag:0.988,
        rot:rnd(0,6.283),vr:rnd(-0.22,0.22),
        sz:isE?Math.round(rnd(20,30)):rnd(4,9),
        col:isE?null:COLORS[(Math.random()*COLORS.length)|0],
        em:isE?EMJ[(Math.random()*EMJ.length)|0]:null,
        life:0,ttl:rnd(1900,3200)
      });
    }
  }

  burst(W/2,H*0.68,90,-90,100,14,26,0.18);   /* 中間先爆一次 */

  let sideAcc=0,t0=0,last=0,raf=0;

  function loop(ts){
    if(!t0) t0=ts;
    if(!last) last=ts;
    const dt=Math.min(60,ts-last);last=ts;
    const f=dt/16.67;
    const elapsed=ts-t0;

    if(elapsed<2600){
      sideAcc+=dt;
      while(sideAcc>90){
        sideAcc-=90;
        burst(-8,H*0.74,2,-52,44,16,24,0.22);      /* 左下角向上噴 */
        burst(W+8,H*0.74,2,-128,44,16,24,0.22);    /* 右下角向上噴 */
        add({                                       /* 再由天慢慢飄落 */
          x:rnd(0,W),y:-40,vx:rnd(-0.7,0.7),vy:rnd(3,5.2),
          g:0.02,drag:1,rot:rnd(0,6.283),vr:rnd(-0.08,0.08),
          sz:Math.round(rnd(20,30)),col:null,
          em:EMJ[(Math.random()*EMJ.length)|0],life:0,ttl:rnd(3400,4400)
        });
      }
    }

    ctx.clearRect(0,0,W,H);
    for(let i=P.length-1;i>=0;i--){
      const p=P[i];
      p.life+=dt;
      if(p.life>p.ttl||p.y>H+80){ P.splice(i,1);continue; }
      p.vy+=p.g*f;
      p.vx*=Math.pow(p.drag,f);
      p.x+=p.vx*f;p.y+=p.vy*f;p.rot+=p.vr*f;
      const k=1-Math.max(0,(p.life-p.ttl*0.65)/(p.ttl*0.35));
      ctx.globalAlpha=Math.max(0,Math.min(1,k));
      if(p.em){
        const s=emo(p.em,p.sz);
        ctx.save();
        ctx.translate(p.x,p.y);ctx.rotate(p.rot);
        ctx.drawImage(s,-s.width/2,-s.height/2);
        ctx.restore();
      }else{
        ctx.fillStyle=p.col;
        ctx.save();
        ctx.translate(p.x,p.y);ctx.rotate(p.rot);
        const w=p.sz,h=p.sz*0.62;               /* 幼長一條，似秋葵多過圓點 */
        ctx.fillRect(-w/2,-h/2,w,h);
        ctx.restore();
      }
    }
    ctx.globalAlpha=1;
    okraAlive=P.length;

    if(elapsed>=2600&&P.length===0){ stop(); return; }
    raf=requestAnimationFrame(loop);
  }

  function stop(){
    try{ cancelAnimationFrame(raf); }catch(e){}
    raf=0;okraAlive=0;okraStopFn=null;
    try{ cv.remove(); }catch(e){ try{ cv.parentNode&&cv.parentNode.removeChild(cv); }catch(_){} }
    if(okraLayer===cv) okraLayer=null;
  }

  okraStopFn=stop;
  raf=requestAnimationFrame(loop);
}

/* 切走分頁／鎖屏時瀏覽器會暫停動畫，粒子就會凍結在半空、圖層一直留住；
   回來又會播一段幾秒前的舊動畫。彩蛋而已，切走就直接收掉。 */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&okraStopFn){ try{ okraStopFn(); }catch(e){} }
});

const okraWhy=[];
function okraTrigger(src){
  const now=Date.now();
  if(now-okraLastFire<900) return;   /* Enter 與「撳掣」會前後腳中，只算一次 */
  okraWhy.push(src);if(okraWhy.length>10) okraWhy.shift();
  okraLastFire=now;
  okraRain();
  try{
    okraMyAt=now;
    set(ref(db,OKRA_PATH),{at:now,by:(me&&me.username)||'',name:(me&&me.displayName)||''}).catch(()=>{});
  }catch(e){}
}

/* 全部用 capture：要趕在程式清空輸入框之前讀到內容 */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing||e.keyCode===229) return;
  const el=e.target;
  if(!el||el.nodeType!==1) return;
  const v=('value' in el&&typeof el.value==='string')?el.value:(el.isContentEditable?(el.textContent||''):'');
  if(okraFind(v)) okraTrigger('key:'+(el.id||el.tagName));
},true);

document.addEventListener('submit',()=>{ if(okraVisibleText()) okraTrigger('submit'); },true);

document.addEventListener('click',e=>{
  const t=e.target;
  if(!t||!t.closest) return;
  const b=t.closest('button,[role="button"],.pi,.nav-item,.btn');
  if(!b) return;
  if(okraVisibleText()) okraTrigger('click:'+(b.dataset&&b.dataset.action||b.id||b.tagName));
},true);

try{
  onValue(ref(db,OKRA_PATH),snap=>{
    const v=snap.val();
    const at=v&&+v.at?+v.at:0;
    if(!okraReady){ okraReady=true; return; }   /* 開頁時只記住，不補播舊的 */
    if(!at) return;
    if(at===okraMyAt) return;                   /* 自己發的，本機剛剛已經播完 */
    okraRain();
  });
}catch(e){}

/* 測試用唯讀鉤子 */
window.__okra={rain:okraRain,find:okraFind,visible:okraVisibleText,
  state:()=>({layer:!!okraLayer,alive:okraAlive,ready:okraReady,myAt:okraMyAt,why:okraWhy.slice()})};

/* ═══════════════════════════════════════════════════════════════════
   彩蛋：Google 特效系列
   ── 跟秋葵雨同一套觸發：任何畫面上見得到的輸入框，輸入含關鍵詞的
      內容並送出（Enter 或撳任何掣），就播對應特效；同時寫入
      Firebase meta/easterEgg/fx，所有已開啟的客戶端一齊播。
   ── 全部動畫數值取自 Google 搜尋頁運行時樣式表（2026-10-27 抓取）：
      67 抖動 skewY±10° 1.8s cubic-bezier(.6,.43,.68,1.11)
      askew rotate(1deg)（原文 matrix 0.999848/0.0174524 反推）
      barrel roll rotate(360deg) 4s
      隕石 translate3d 階梯 −1/+2/−4/+4px
      blink opacity:0 在 80%
      流星雨 falling + tail + fadeinout 三層
   ═══════════════════════════════════════════════════════════════════ */
const FX_PATH='meta/easterEgg/fx';
let fxMyAt=0,fxLastFire=0,fxLast67=0,fxReady=false,fxStopT=null,fxShowerLayer=null,fxShowerTimers=[];

/* 匹配順序很重要：先判流星雨（更具體），再逐條試 */
const FX_RULES=[
  {id:'roll', ms:4100, cls:'fx-roll',  re:/barrel[\s\-]*roll/i},
  {id:'shake',ms:3100, cls:'fx-shake', re:/隕石|陨石|meteorite|chicxulub/i},
  {id:'askew',ms:3000, cls:'fx-askew', re:/askew|(^|[^a-z])tilt([^a-z]|$)/i},
  {id:'67',   ms:2000, cls:'fx-67',    re:/(^|[^0-9])6[\s\-]*7([^0-9]|$)|six[\s\-]*seven/i},
  {id:'blink',ms:5200, cls:'fx-blink', re:/blink/i}
];
const FX_SHOWER_RE=/流星雨|meteor[\s\-]*shower/i;

/* 一條訊息可能同時含幾個關鍵詞 —— 全部收集，唔好只取第一個。
   （之前只 return 第一個，所以「67 流星雨 barrel roll」只播流星雨。） */
const FX_BODY_IDS=['67','askew','roll','shake'];
function fxCheckAll(text){
  if(!text) return [];
  const t=String(text);
  const ids=[];
  if(FX_SHOWER_RE.test(t)) ids.push('shower');
  for(let i=0;i<FX_RULES.length;i++){
    const id=FX_RULES[i].id;
    if(FX_RULES[i].re.test(t)&&ids.indexOf(id)<0) ids.push(id);
  }
  return ids;
}
function fxCheck(text){ const a=fxCheckAll(text); return a.length?a[0]:null; }

function fxClearBody(){
  clearTimeout(fxStopT);
  document.body.classList.remove('fx-67','fx-askew','fx-roll','fx-shake','fx-blink');
  document.body.style.removeProperty('transform');
}

function fxPlay(id){
  const rule=FX_RULES.filter(r=>r.id===id)[0];
  if(!rule) return false;
  fxClearBody();
  const b=document.body;
  void b.offsetWidth;                       /* 強制 reflow，同一個 class 才能重播 */
  b.classList.add(rule.cls);
  fxStopT=setTimeout(()=>{ b.classList.remove(rule.cls); },rule.ms);
  return true;
}

function fxShower(){
  if(!fxShowerLayer){
    const el=document.createElement('div');
    el.id='fxShowerLayer';
    document.body.appendChild(el);
    fxShowerLayer=el;
  }
  fxShowerTimers.forEach(id=>clearTimeout(id));
  fxShowerTimers=[];
  fxShowerLayer.classList.add('on');
  fxShowerLayer.innerHTML='';
  for(let i=0;i<16;i++){
    fxShowerTimers.push(setTimeout(()=>{
      const m=document.createElement('div');
      m.className='fx-meteor';
      m.style.top=(-10+Math.random()*45)+'vh';
      m.style.left=(-20-Math.random()*30)+'vw';
      m.style.width='9vw';
      m.style.transform='rotate('+(28+Math.random()*16)+'deg)';
      fxShowerLayer.appendChild(m);
      setTimeout(()=>{ try{ m.remove(); }catch(e){} },1250);
    },i*120));
  }
  fxShowerTimers.push(setTimeout(()=>{
    fxShowerLayer.classList.remove('on');
    fxShowerLayer.innerHTML='';
  },4600));
}

/* body 類特效（67/askew/roll/shake）都改 body 的 transform，同時播會打架，
   所以排隊一個接一個；圖層類（流星雨/blink）不碰 body，可以同時播。 */
let fxBodyQueue=[], fxBodyPlaying=false;

function fxQueueBody(ids){
  ids.forEach(id=>{
    if(FX_BODY_IDS.indexOf(id)<0) return;
    if(fxBodyQueue.indexOf(id)>=0) return;      /* 同一個不重複排 */
    if(fxBodyQueue.length>=2) return;           /* 最多排 2 個，免得播十幾秒 */
    fxBodyQueue.push(id);
  });
  fxPumpBody();
}
function fxPumpBody(){
  if(fxBodyPlaying||!fxBodyQueue.length) return;
  const id=fxBodyQueue.shift();
  const rule=FX_RULES.filter(r=>r.id===id)[0];
  if(!rule){ fxPumpBody(); return; }
  fxBodyPlaying=true;
  fxClearBody();
  const b=document.body;
  void b.offsetWidth;
  b.classList.add(rule.cls);
  fxStopT=setTimeout(()=>{
    b.classList.remove(rule.cls);
    fxBodyPlaying=false;
    setTimeout(fxPumpBody,150);
  },rule.ms);
}

function fxRun(id){
  if(id==='shower'){ fxShower(); return; }
  if(id==='blink'){ fxPlay('blink'); return; }  /* blink 只動 .bubble，不碰 body */
  fxQueueBody([id]);
}

/* 一次過播多個（一條訊息含幾個關鍵詞時用） */
function fxRunMany(ids){
  if(!ids||!ids.length) return;
  const bodyIds=[];
  ids.forEach(id=>{
    if(id==='shower') fxShower();
    else if(id==='blink') fxPlay('blink');
    else bodyIds.push(id);
  });
  if(bodyIds.length) fxQueueBody(bodyIds);
}

function fxTrigger(ids){
  const list=Array.isArray(ids)?ids.filter(Boolean):(ids?[ids]:[]);
  if(!list.length) return;
  const now=Date.now();
  if(now-fxLastFire<900) return;                        /* Enter 與撳掣會前後腳中，只算一次 */
  if(list.indexOf('67')>=0&&now-fxLast67<4000) return;  /* 67 是班上的口頭禪，太密會很煩 */
  fxLastFire=now;
  if(list.indexOf('67')>=0) fxLast67=now;
  fxRunMany(list);
  try{
    fxMyAt=now;
    /* 多個 id 用逗號串起，其他客戶端收到之後一樣全部播 */
    set(ref(db,FX_PATH),{id:list.join(','),at:now,
      by:(me&&me.username)||'',name:(me&&me.displayName)||''}).catch(()=>{});
  }catch(e){}
}

/* 讀「畫面上所有輸入框」的內容 —— 只在需要判斷時才逐個算樣式 */
function fxVisibleHit(){
  const els=document.querySelectorAll('input,textarea,[contenteditable="true"],[contenteditable=""]');
  for(let i=0;i<els.length;i++){
    const el=els[i];
    const v=('value' in el&&typeof el.value==='string')?el.value:(el.textContent||'');
    if(!v) continue;
    const ids=fxCheckAll(v);
    if(!ids.length) continue;                 /* 先驗字，免得為每個輸入框算樣式 */
    const r=el.getBoundingClientRect();
    if(r.width<4||r.height<4) continue;
    const st=getComputedStyle(el);
    if(st.display==='none'||st.visibility==='hidden'||st.opacity==='0') continue;
    return ids;
  }
  return null;
}

/* capture 階段：要趕在程式清空輸入框之前讀到內容 */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing||e.keyCode===229) return;
  const el=e.target;
  if(!el||el.nodeType!==1) return;
  const v=('value' in el&&typeof el.value==='string')?el.value:(el.isContentEditable?(el.textContent||''):'');
  const ids=fxCheckAll(v);
  if(ids.length) fxTrigger(ids);
},true);

document.addEventListener('submit',()=>{
  const ids=fxVisibleHit();
  if(ids&&ids.length) fxTrigger(ids);
},true);

document.addEventListener('click',e=>{
  const t=e.target;
  if(!t||!t.closest) return;
  const b=t.closest('button,[role="button"],.pi,.nav-item,.btn');
  if(!b) return;
  const ids=fxVisibleHit();
  if(ids&&ids.length) fxTrigger(ids);
},true);

/* 全站同步：別人觸發，我這邊也播 */
try{
  onValue(ref(db,FX_PATH),snap=>{
    const v=snap.val();
    const at=v&&+v.at?+v.at:0;
    if(!fxReady){ fxReady=true; return; }   /* 開頁時只記住，不補播舊的 */
    if(!at) return;
    if(at===fxMyAt) return;                 /* 自己發的，本機剛剛已播 */
    if(v.id) fxRunMany(String(v.id).split(',').filter(Boolean));
  });
}catch(e){}

/* 切走分頁／鎖屏時收掉，避免回來播一段幾秒前的舊動畫 */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    fxClearBody();
    if(fxShowerLayer){ fxShowerLayer.classList.remove('on'); fxShowerLayer.innerHTML=''; }
  }
});

/* 測試用唯讀鉤子 */
window.__fxEgg={check:fxCheck,checkAll:fxCheckAll,run:fxRun,runMany:fxRunMany,clear:fxClearBody,
  state:()=>({cls:document.body.className,myAt:fxMyAt,ready:fxReady,
    shower:!!(fxShowerLayer&&fxShowerLayer.classList.contains('on'))})};


/* ═══ 液態玻璃自動套用 ═══
   給主要容器掛 data-lg（CSS 用屬性選擇器），連之後新開的頁面都自動生效。 */
(function(){
  var SEL='.card,.sheet .inner,.fp-header,.topbar,#bottomNav,.fp-body .card,.drawer-inner,'+'#pageRoot .card,.fp-body .pi,.fp-body .user-card,.fp-body .tool-card,.fp-body .realname-card,'+'.fp-body .vm-card,.fp-body .think-card,.fp-body .pair-card,.admin-user,.admin-body .card';
  function dress(root){
    try{
      var list=(root||document).querySelectorAll(SEL);
      for(var i=0;i<list.length;i++){
        if(!list[i].dataset.lg) list[i].dataset.lg='';
      }
    }catch(e){}
  }
  function boot(){
    dress(document);
    try{
      new MutationObserver(function(ms){
        for(var i=0;i<ms.length;i++){
          var ns=ms[i].addedNodes||[];
          for(var j=0;j<ns.length;j++){
            var n=ns[j];
            if(n.nodeType!==1) continue;
            if(n.matches && n.matches(SEL)) n.dataset.lg='';
            else dress(n);
          }
        }
      }).observe(document.body,{childList:true,subtree:true});
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();

/* ═══ 底部導航膠囊 ═══
   點哪個就滑到哪；視窗尺寸變了會重算。預設停在第一個（聊天）。 */
(function(){
  let pill=null, nav=null, cur=-1;
  function items(){ return nav?Array.prototype.slice.call(nav.querySelectorAll('.nav-item')):[]; }
  function moveTo(i,animate){
    const list=items();
    if(!list.length) return;
    i=Math.max(0,Math.min(list.length-1,i));
    if(!pill){
      pill=document.createElement('div');
      pill.id='navPill';
      nav.insertBefore(pill,nav.firstChild);
    }
    const w=100/list.length;
    pill.style.width=w+'%';
    if(!animate) pill.style.transition='none';
    pill.style.transform='translateX('+(i*100)+'%)';
    if(!animate) requestAnimationFrame(()=>{ if(pill) pill.style.transition=''; });
    /* 同步選中樣式；先移除再加（強制 reflow）讓彈跳動畫每次都重播 */
    list.forEach(function(x,j){
      if(j===i){
        x.classList.remove('on');
        void x.offsetWidth;
        x.classList.add('on');
      }else{
        x.classList.remove('on');
      }
    });
    cur=i;
  }
  function boot(){
    nav=document.getElementById('bottomNav');
    if(!nav) return;
    moveTo(0,false);
    nav.addEventListener('click',function(e){
      const it=e.target.closest?e.target.closest('.nav-item'):null;
      if(!it) return;
      const list=items();
      const i=list.indexOf(it);
      if(i>=0) moveTo(i,true);
    },true);
    window.addEventListener('resize',function(){ if(cur>=0) moveTo(cur,false); });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();

/* ═══ 白框小通知卡 ═══
   用法：showNCard({title:'每日簽到', html:'連續 <b>3</b> 天，今日 +100 積分', btn:'收下'})
   之後加簽到、成就、小禮物都用這一個，不用再寫新的彈窗。 */
function showNCard(opt){
  opt=opt||{};
  const mask=document.createElement('div');
  mask.className='ncard-mask';
  const el=document.createElement('div');
  el.className='ncard';
    try{ el.removeAttribute('data-lg'); }catch(e){}
  el.innerHTML='<div class="ndots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>'
    +'<h4>'+escapeHtml(opt.title||'通知')+'</h4>'
    +'<p>'+(opt.html||escapeHtml(opt.body||''))+'</p>'
    +'<button class="nbtn">'+escapeHtml(opt.btn||'知道了')+'</button>';
  document.body.appendChild(mask);
  document.body.appendChild(el);
  const close=()=>{ try{el.remove();mask.remove();}catch(e){} if(typeof opt.onClose==='function'){try{opt.onClose();}catch(e){}} };
  el.querySelector('.nbtn').onclick=close;
  mask.onclick=close;
  return el;
}
try{ window.showNCard=showNCard; }catch(e){}

/* ═══ 確認彈窗（取代原生 confirm） ═══
   原生 confirm 在手機 WebView 很醜、樣式跟網站完全不一樣，而且會阻塞整頁。
   這個版本回傳 Promise<boolean>，呼叫點寫 if(!(await askConfirm(...)))return; 即可。
   ⚠ 只能是 async 函式呼叫（原生 confirm 是同步的，換成這個就不能同步等）。 */
function askConfirm(opt){
  return new Promise(function(resolve){
    var o = (typeof opt==='string') ? {html:opt} : (opt||{});
    var mask=document.createElement('div'); mask.className='ncard-mask';
    var el=document.createElement('div'); el.className='ncard';
    var body=String(o.html||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    /* 允許呼叫方自己傳已經安全的 html（有 <b> 之類），用 rawHtml 區分 */
    if(o.rawHtml) body=String(o.rawHtml);
    el.innerHTML='<div class="ndots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>'
      +'<h4>'+String(o.title||'確認').replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</h4>'
      +'<p>'+body+'</p>'
      +'<div class="ncard-btns">'
      +  '<button class="nbtn nbtn-ghost" data-x="0">'+String(o.cancelText||'取消')+'</button>'
      +  '<button class="nbtn'+(o.danger?' nbtn-danger':'')+'" data-x="1">'+String(o.okText||'確定')+'</button>'
      +'</div>';
    document.body.appendChild(mask);
    document.body.appendChild(el);
    var done=false;
    function fin(v){
      if(done) return; done=true;
      try{ el.remove(); mask.remove(); }catch(e){}
      resolve(!!v);
    }
    el.querySelector('[data-x="0"]').onclick=function(){ fin(false); };
    el.querySelector('[data-x="1"]').onclick=function(){ fin(true); };
    mask.onclick=function(){ fin(false); };
    try{ el.querySelector('[data-x="'+(o.danger?1:1)+'"]').focus(); }catch(e){}
  });
}
try{ window.askConfirm=askConfirm; }catch(e){}

/* ═══ 載入動畫自動套用 ═══
   用戶要求：任何要等的地方都要有載入動畫，唔好讓用戶對住空白畫面。
   這裡不逐處改字串，用觀察器：凡 .empty 裡寫「正在…」「載入中」
   就自動換成彩色豎條 + 原本文字。之後新增任何頁面都自動生效。 */
(function(){
  var BARS='<span class="ldr"><i></i><i></i><i></i><i></i><i></i></span>';
  var RX=/^(正在|載入中|載入…)/;
  function dress(el){
    if(!el||el.dataset.ldr) return;
    var t=(el.textContent||'').trim();
    if(!t||t.length>40) return;
    if(!RX.test(t)) return;
    el.dataset.ldr='1';
    el.classList.add('ldr-wrap');
    el.innerHTML=BARS+'<span>'+t+'</span>';
  }
  function scan(root){
    try{ (root||document).querySelectorAll('.empty').forEach(dress); }catch(e){}
  }
  function boot(){
    scan(document);
    try{
      new MutationObserver(function(muts){
        for(var i=0;i<muts.length;i++){
          var ns=muts[i].addedNodes||[];
          for(var j=0;j<ns.length;j++){
            var n=ns[j];
            if(n.nodeType!==1) continue;
            if(n.classList&&n.classList.contains('empty')) dress(n);
            else if(n.querySelectorAll) scan(n);
          }
        }
      }).observe(document.body,{childList:true,subtree:true});
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();

initRemote();
