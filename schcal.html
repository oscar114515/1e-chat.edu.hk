<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --panel2:#f6f8fc; --text:#0f172a; --muted:#66748c;
  --line:#e6eaf2; --brand:#2563eb; --shadow:0 1px 2px rgba(15,23,42,.05),0 12px 32px -16px rgba(15,23,42,.24);
  --dur:.2s; --ease:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#070d18; --panel:#0f1727; --panel2:#0c1421; --text:#e8eefb; --muted:#8fa1bf;
         --line:#1e2b41; --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 36px -18px rgba(0,0,0,.9); }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0}
::selection{background:color-mix(in srgb,var(--brand) 28%,transparent)}

/* ═══ 頂欄 ═══ */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(16px) saturate(1.5);border-bottom:1px solid var(--line)}
.top-in{max-width:820px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.logo{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#2563eb,#38bdf8);box-shadow:0 6px 18px -6px rgba(37,99,235,.7)}
.logo svg{width:20px;height:20px;display:block}
.tt{min-width:0}
.tt p{margin:1px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{height:36px;padding:0 14px;border-radius:11px;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);box-shadow:var(--shadow);
  font-size:13px;font-weight:650;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.tbtn svg{width:15px;height:15px}
.tbtn:active{transform:scale(.95)}
.tbtn:hover{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}

.wrap{max-width:820px;margin:0 auto;padding:14px 16px 52px}

/* ═══ 今日焦點 ═══ */
.today{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;
  box-shadow:var(--shadow);margin-bottom:14px;animation:rise .42s var(--ease) both}
.today-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.today-h .d{font-size:17px;font-weight:750;letter-spacing:.2px}
.today-h .w{font-size:13px;color:var(--muted)}
.today-h .cyc{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--brand);
  background:color-mix(in srgb,var(--brand) 10%,transparent);border:1px solid color-mix(in srgb,var(--brand) 30%,transparent);
  padding:3px 10px;border-radius:9px}
.te{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.te li{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.45}
.te .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:6px}
.te .en{display:block;font-size:12px;color:var(--muted)}
.te .none{color:var(--muted);font-size:13.5px}
.today .up-h{margin:15px 0 6px;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--muted);
  text-transform:uppercase}
.up{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.up li{display:flex;align-items:baseline;gap:10px;font-size:13.5px;line-height:1.45;padding:5px 0}
.up .tag{flex:0 0 auto;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);
  min-width:74px}
.up .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.up .en{color:var(--muted);font-size:12px}

/* ═══ 月曆卡 ═══ */
.cal{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:var(--shadow);animation:rise .46s .05s var(--ease) both}
.cal-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.nav{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);
  background:var(--panel2);color:var(--muted);transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.nav svg{width:16px;height:16px}
.nav:hover{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.nav:active{transform:scale(.92)}
.cal-title{flex:1;text-align:center;font-size:17px;font-weight:750;letter-spacing:.3px}
.cal-title span{font-weight:550;color:var(--muted)}
/* 月份快跳 */
.months{display:flex;gap:6px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.months button{flex:0 0 auto;padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:650;
  color:var(--muted);border:1px solid var(--line);background:transparent;transition:all var(--dur) var(--ease)}
.months button.on{color:#fff;background:var(--brand);border-color:var(--brand)}

/* 星期標頭 */
.wk{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px;border-top:1px solid var(--line)}
.wk div{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);padding:9px 0 7px;letter-spacing:.3px}
.wk div.hl{color:color-mix(in srgb,#ef4444 80%,var(--muted))}

/* 日期格（正方形，內容不影響尺寸） */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:6px 10px 12px}
.cell{position:relative;aspect-ratio:1/1;border-radius:11px;padding:5px;background:var(--panel2);
  border:1px solid transparent;display:flex;flex-direction:column;cursor:pointer;
  min-width:0;overflow:hidden;
  transition:border-color var(--dur) var(--ease),transform var(--dur) var(--ease)}
.cell.blank{background:transparent;cursor:default;border-color:transparent}
.cell:not(.blank):hover{border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.cell:not(.blank):active{transform:scale(.96)}
.cell .toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:2px}
.cell .dno{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;width:22px;height:22px;
  display:grid;place-items:center;border-radius:7px;color:var(--text)}
.cell .dno.wkend{color:color-mix(in srgb,#ef4444 75%,var(--text))}
.cell.today{box-shadow:inset 0 0 0 2px var(--brand)}
.cell.today .dno{background:var(--brand);color:#fff}
.cell .cyc{font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.4px;line-height:1;padding:2px 1px 0 0}
.dots{margin-top:auto;display:flex;gap:3px;flex-wrap:nowrap;align-items:center;overflow:hidden;max-width:100%}
.dots i{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.dots .more{font-size:9px;font-weight:700;color:var(--muted);line-height:1;flex:0 0 auto}
/* 色調底色 */
.tint-long{background:color-mix(in srgb,#fbbf24 20%,var(--panel2))}
.tint-pub{background:color-mix(in srgb,#ef4444 16%,var(--panel2))}
.tint-stu{background:color-mix(in srgb,#f59e0b 18%,var(--panel2))}
.tint-exam{background:color-mix(in srgb,#22c55e 15%,var(--panel2))}
.tint-sdd{background:color-mix(in srgb,#8b5cf6 13%,var(--panel2))}
.tint-special{background:color-mix(in srgb,#06b6d4 13%,var(--panel2))}
.tint-event{background:color-mix(in srgb,#3b82f6 10%,var(--panel2))}

/* ═══ 圖例 ═══ */
.legend{display:flex;flex-wrap:wrap;gap:7px 14px;padding:12px 16px;border-top:1px solid var(--line)}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.lg i{width:9px;height:9px;border-radius:3px;flex:0 0 9px}

.foot{margin:14px 2px 0;font-size:12px;color:var(--muted);line-height:1.7}

/* ═══ 日期詳情（底部面板） ═══ */
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;
  background:rgba(5,8,15,.5);backdrop-filter:blur(2px);animation:fade .22s var(--ease) both}
.sheet.show{display:flex}
.sh{width:100%;max-width:820px;background:var(--panel);border:1px solid var(--line);
  border-radius:22px 22px 0 0;padding:18px 18px 24px;box-shadow:0 -18px 50px -18px rgba(0,0,0,.5);
  animation:up .3s var(--ease) both;max-height:78vh;overflow-y:auto}
.sh .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.sh .hd b{font-size:18px;letter-spacing:.2px}
.sh .hd span{color:var(--muted);font-size:13px}
.sh .close{margin-left:auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--muted)}
.sh .close svg{width:15px;height:15px}
.sh .cyc-tag{font-size:12px;font-weight:700;color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent);
  padding:2px 9px;border-radius:8px}
.sh .evs{margin-top:10px;display:flex;flex-direction:column;gap:9px}
.sh .ev{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel2)}
.sh .ev .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:6px}
.sh .ev .zh{font-size:14.5px;font-weight:650;line-height:1.4}
.sh .ev .en{font-size:12px;color:var(--muted)}
.sh .ev .cat{font-size:10.5px;font-weight:700;margin-left:auto;flex:0 0 auto;padding:2px 8px;border-radius:7px}
.sh .empty{color:var(--muted);font-size:13.5px;padding:6px 2px}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
@media (max-width:520px){
  .cell{padding:4px}
  .cell .dno{width:20px;height:20px;font-size:12px}
  .cell .cyc{font-size:8px}
  .dots i{width:6px;height:6px;flex:0 0 6px}
  .dots{gap:2px}
  .dots .more{font-size:8px}
  .wk div{font-size:10.5px}
  .up .tag{min-width:60px}
}
</style>
</head>

</div>

 ['2027-07-01','2027-07-01','pub','香港特區成立紀念日','HKSAR Establishment Day'],
 ['2027-07-09','2027-07-09','event','派發中三成績表','Distribution of F.3 Academic Reports'],
 ['2027-07-12','2027-07-12','event','畢業禮綵排暨升學就業講座','Rehearsal of Graduation Ceremony'],
 ['2027-07-12','2027-07-12','event','畢業暨頒獎典禮','Graduation cum Prize Giving'],
 ['2027-07-14','2027-07-14','event','文憑試放榜','Release of HKDSE Results'],
 ['2027-07-14','2027-07-14','event','中三選科','F.3 Subject Selection'],
 ['2027-07-16','2027-07-16','event','感恩彌撒及註冊','Thanksgiving Mass and Registration'],
 ['2027-07-16','2027-07-16','event','派發成績表','Distribution of Academic Reports'],
 ['2027-07-19','2027-07-31','long','暑假','Summer Vacation'],
 ['2027-08-01','2027-08-31','long','暑假','Summer Vacation']
];

/* 循環日（來源僅在部分日子標註，無法推算全年，僅列出已知） */
var CYCLE = {
 '2026-09-01':'I','2026-09-04':'I','2026-09-24':'IV','2026-09-25':'IV',
 '2026-10-14':'III','2026-10-29':'V','2026-11-13':'V','2026-11-18':'IV',
 '2026-11-23':'II','2026-12-04':'IV'
};

var CAT = {
 pub:    { zh:'公眾假期', c:'#ef4444' },
 stu:    { zh:'學生假期', c:'#f59e0b' },
 long:   { zh:'長假期',   c:'#fbbf24' },
 exam:   { zh:'考試／測驗', c:'#22c55e' },
 sdd:    { zh:'教師發展日', c:'#8b5cf6' },
 special:{ zh:'特別時間表', c:'#06b6d4' },
 event:  { zh:'活動',       c:'#3b82f6' }
};
var PRIO = { long:7, pub:6, stu:6, exam:5, sdd:4, special:3, event:2 };
var TINT = { long:1, pub:1, stu:1, exam:1, sdd:1, special:1, event:1 };
var HOLIDAYISH = { pub:1, stu:1, long:1 };

var FIRST = new Date(2026, 8, 1);    /* 2026-09-01 */
var LAST  = new Date(2027, 7, 31);   /* 2027-08-31 */

function parse(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function key(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function $(id){ return document.getElementById(id); }
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }

/* 建立「日期 → 事件」索引；cont=true 表示是連續日子（非首日） */
var INDEX = {};
var ALL = [];   /* 依起始日排序的完整事件，供「近期」清單用 */
EV.forEach(function(ev){
  var a=ev[0], b=ev[1], cat=ev[2], zh=ev[3], en=ev[4];
  var d0=parse(a), d1=parse(b);
  var n=0;
  for(var d=new Date(d0); d<=d1; d.setDate(d.getDate()+1)){
    var k=key(d);
    (INDEX[k]=INDEX[k]||[]).push({cat:cat, zh:zh, en:en, cont:n>0, multi:d1>d0, start:d0, end:d1});
    n++;
  }
  ALL.push({cat:cat, zh:zh, en:en, start:d0, end:d1});
});
ALL.sort(function(x,y){ return x.start-y.start; });

var WD = ['日','一','二','三','四','五','六'];
var now = new Date();
var TODAY_KEY = key(now);

/* ───────── 今日焦點 + 近期 ───────── */
function todayCard(){
  var inRange = now>=FIRST && now<=LAST;
  var dLabel = now.getFullYear()+' 年 '+(now.getMonth()+1)+' 月 '+now.getDate()+' 日';
  var wd = '星期' + WD[now.getDay()];
  var cyc = CYCLE[TODAY_KEY];

  var todays = (INDEX[TODAY_KEY]||[]).slice().sort(function(a,b){return PRIO[b.cat]-PRIO[a.cat];});
  var h = '<div class="today-h"><span class="d">'+dLabel+'</span><span class="w">'+wd+'</span>';
  if(cyc) h += '<span class="cyc">循環日 '+cyc+'</span>';
  h += '</div><ul class="te">';
  if(!inRange){
    h += '<li class="none">今日不在 2026–27 校曆範圍內。</li>';
  } else if(!todays.length){
    h += '<li class="none">今天沒有特別安排。</li>';
  } else {
    todays.forEach(function(e){
      h += '<li><span class="dot" style="background:'+CAT[e.cat].c+'"></span><span>'+esc(e.zh)
         + '<span class="en">'+esc(e.en)+'</span></span></li>';
    });
  }
  h += '</ul>';

  /* 近期：今天之後開始（或仍在進行）的事件，取 6 項 */
  var up = [];
  for(var i=0;i<ALL.length;i++){
    var e=ALL[i];
    if(e.end >= now){ up.push(e); if(up.length>=6) break; }
  }
  if(up.length){
    h += '<div class="up-h">接下來</div><ul class="up">';
    up.forEach(function(e){
      var t;
      if(e.start<=now && e.end>=now) t = '今天起';
      else t = (e.start.getMonth()+1)+'/'+e.start.getDate();
      var same = e.start.getTime()===e.end.getTime();
      var label = same ? e.zh : (e.zh+'（'+daySpan(e)+'）');
      h += '<li><span class="tag">'+t+'</span><span class="dot" style="background:'+CAT[e.cat].c+'"></span>'
         + '<span>'+esc(label)+' <span class="en">'+esc(e.en)+'</span></span></li>';
    });
    h += '</ul>';
  }
  $('todayCard').innerHTML = h;
}
function daySpan(e){
  function d2(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
  if(e.start.getTime()===e.end.getTime()) return d2(e.start);
  return d2(e.start)+'–'+d2(e.end);
}

/* ───────── 月曆 ───────── */
var viewY = now.getFullYear(), viewM = now.getMonth();
if(!(now>=FIRST && now<=LAST)){ viewY=2026; viewM=8; }

var MONTHS = [];
(function(){
  var y=2026, m=8;
  for(var i=0;i<12;i++){ MONTHS.push([y,m]); m++; if(m>11){m=0;y++;} }
})();

function renderMonths(){
  var h='';
  MONTHS.forEach(function(mt){
    var on = (mt[0]===viewY && mt[1]===viewM);
    h += '<button class="'+(on?'on':'')+'" data-y="'+mt[0]+'" data-m="'+mt[1]+'">'
       + mt[0]+'.'+String(mt[1]+1).padStart(2,'0')+'</button>';
  });
  $('months').innerHTML=h;
}

function renderCal(){
  var title = viewY+' 年 '+(viewM+1)+' 月';
  $('calTitle').innerHTML = title;

  var first=new Date(viewY,viewM,1);
  var off=first.getDay();
  var dim=new Date(viewY,viewM+1,0).getDate();
  var h='';
  var i;
  for(i=0;i<off;i++) h+='<div class="cell blank"></div>';
  for(var d=1;d<=dim;d++){
    var dt=new Date(viewY,viewM,d);
    var k=key(dt);
    var evs=(INDEX[k]||[]).slice().sort(function(a,b){return PRIO[b.cat]-PRIO[a.cat];});
    var cyc=CYCLE[k];
    var isToday=(k===TODAY_KEY);
    var wkend=(dt.getDay()===0||dt.getDay()===6);
    h+=cellHTML(dt,evs,cyc,isToday,wkend,k);
  }
  var total=off+dim, rem=(7-total%7)%7;
  for(i=0;i<rem;i++) h+='<div class="cell blank"></div>';
  $('grid').innerHTML=h;
  renderMonths();
}

function cellHTML(dt,evs,cyc,isToday,wkend,k){
  var d=dt.getDate();
  var tintCat=null;
  evs.forEach(function(e){
    if(HOLIDAYISH[e.cat] || e.multi){
      if(tintCat===null || PRIO[e.cat]>PRIO[tintCat]) tintCat=e.cat;
    }
  });
  var chips=evs.filter(function(e){ return !e.cont; });
  var shown=chips.slice(0,3);
  var moreN=chips.length-shown.length;

  var cls='cell';
  if(tintCat) cls+=' tint-'+tintCat;
  if(isToday) cls+=' today';

  var c='<div class="'+cls+'" data-k="'+k+'">'
     + '<div class="toprow"><span class="dno'+(wkend?' wkend':'')+'">'+d+'</span>'
     + (cyc?'<span class="cyc">'+cyc+'</span>':'')+'</div>'
     + '<div class="dots">';
  shown.forEach(function(e){
    c+='<i style="background:'+CAT[e.cat].c+'"></i>';
  });
  if(moreN>0) c+='<span class="more">+'+(moreN+shown.length)+'</span>';
  c+='</div></div>';
  return c;
}

function renderLegend(){
  var order=['pub','stu','long','exam','sdd','special','event'];
  var h='';
  order.forEach(function(c){
    var m=CAT[c];
    h+='<span class="lg"><i style="background:'+m.c+'"></i>'+m.zh+'</span>';
  });
  h+='<span class="lg"><i style="background:transparent;border:1.5px solid var(--brand)"></i>今天</span>';
  $('legend').innerHTML=h;
}

/* ───────── 日期詳情 ───────── */
function openDay(k){
  var dt=parse(k);
  var evs=(INDEX[k]||[]).slice().sort(function(a,b){return PRIO[b.cat]-PRIO[a.cat];});
  $('shDate').textContent = dt.getFullYear()+' 年 '+(dt.getMonth()+1)+' 月 '+dt.getDate()+' 日';
  $('shWeek').textContent = '星期'+WD[dt.getDay()];
  var cyc=CYCLE[k];
  var cycEl=$('shCyc');
  if(cyc){ cycEl.style.display='inline-block'; cycEl.textContent='循環日 '+cyc; }
  else cycEl.style.display='none';

  var h='';
  if(!evs.length) h='<div class="empty">這天沒有特別安排。</div>';
  else evs.forEach(function(e){
    var col=CAT[e.cat].c;
    h+='<div class="ev"><span class="dot" style="background:'+col+'"></span>'
     + '<span><span class="zh">'+esc(e.zh)+'</span><br><span class="en">'+esc(e.en)+'</span></span>'
     + '<span class="cat" style="color:'+col+';background:color-mix(in srgb,'+col+' 14%,transparent)">'+CAT[e.cat].zh+'</span></div>';
  });
  $('shEvs').innerHTML=h;
  $('sheet').classList.add('show');
}
function closeDay(){ $('sheet').classList.remove('show'); }

/* ───────── 事件 ───────── */
function goToday(){
  if(now>=FIRST && now<=LAST){ viewY=now.getFullYear(); viewM=now.getMonth(); }
  else { viewY=2026; viewM=8; }
  renderCal();
  window.scrollTo({top:0,behavior:'smooth'});
}
$('prev').addEventListener('click',function(){
  viewM--; if(viewM<0){viewM=11;viewY--;}
  renderCal();
});
$('next').addEventListener('click',function(){
  viewM++; if(viewM>11){viewM=0;viewY++;}
  renderCal();
});
$('btnToday').addEventListener('click',goToday);

$('months').addEventListener('click',function(e){
  var b=e.target.closest('button[data-y]');
  if(!b) return;
  viewY=+b.getAttribute('data-y'); viewM=+b.getAttribute('data-m');
  renderCal();
});

$('grid').addEventListener('click',function(e){
  var c=e.target.closest('.cell[data-k]');
  if(!c) return;
  openDay(c.getAttribute('data-k'));
});
$('shClose').addEventListener('click',closeDay);
$('sheet').addEventListener('click',function(e){ if(e.target.id==='sheet') closeDay(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDay(); });

/* ───────── footer ───────── */
function footer(){
  $('foot').innerHTML = '<b>資料範圍</b> 2026 年 9 月 1 日至 2027 年 8 月 31 日 · '
    + '<b>來源</b> 長沙灣天主教英文中學 2026–27 校曆（學生版）<br>'
    + '<b>循環日</b> 校曆僅在部分日子標註 I–VI，未能推算全年，只顯示已知的循環日。<br>'
    + '<b>提醒</b> 活動日期如有更改，以學校正式公布為準。';
}

/* ───────── 啟動 ───────── */
todayCard();
renderLegend();
renderCal();
footer();
})();
</script>
</body>
</html>
