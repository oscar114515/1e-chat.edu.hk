  const isHost=!!(roomSnap&&roomSnap.host===me.username);
  /* ★ 一定要「先斷訂閱、再退出」，順序顛倒就會退不掉。

     伺服器會立刻推一份「我不在名單裡」的最新房間狀態過來，而訂閱還沒斷，
     joinRoom 的回呼就跑 ensureMembership → 看到自己不是成員、房間又在進行中 →
     依規則把自己重新加回 spectators。結果就是：退了等於沒退。 */
  if(roomSub){ try{ roomSub(); }catch(e){} roomSub=null; }
  if(cdTimer){clearInterval(cdTimer);cdTimer=null;}

  if(tet){ try{ tet.unmount(); }catch(e){} tet=null; }
  if(typeof dinoGame!=='undefined' && dinoGame){ try{ dinoGame.unmount(); }catch(e){} dinoGame=null; }

  /* ═══ 關鍵修正（2026-10-24）═══
     以前 Firebase 寫入（await update / remove）放在切畫面「之前」。
     伺服器一物理關機，那些 await 永遠不會回來（Firebase 離線時只會排隊，不會報錯），
     函式卡死 → curRoom 沒清、畫面沒切 → 用戶被鎖死在房間，
     重複按「退出」只會開新彈窗，最後只能刷新網頁。
     所以：清狀態 + 切畫面 先做，網絡清理丟去背景，失敗也與用戶無關。 */
  curRoom=null; curRoomId=null;
  try{
    if(cameFromInvite){
      try{ parent.postMessage({type:'closeGames'},'*'); }catch(e){}
    }else{
      view='lobby'; render();
    }
  }catch(e){}

  /* 背景清理：不 await，不阻塞，失敗靜默 */
  if(rid&&me){
    (async function(){
      try{
        if(isHost){
          /* 已經分出勝負就不要改寫 winner，否則結束畫面會被蓋成「房主關閉」 */
          if(roomSnap&&roomSnap.status!=='ended'){
            try{ await update(ref(db,'games/'+rid),{status:'ended',winner:'closed'}); }catch(e){}
            try{ await settlePot(roomSnap,'closed'); }catch(e){}
          }
        }else{
          const pr=ref(db,'games/'+rid+'/players/'+me.username);
          const sr=ref(db,'games/'+rid+'/spectators/'+me.username);
          try{ await refundOnLeave(rid); }catch(e){}
          try{ onDisconnect(pr).cancel(); }catch(e){}
          try{ onDisconnect(sr).cancel(); }catch(e){}
          try{ await remove(pr); }catch(e){}
          try{ await remove(sr); }catch(e){}
          try{ await cancelCountdownIfShort(rid); }catch(e){}
        }
      }catch(e){}
    })();
  }
}

/* ═══════════════════════════════════════════════════════════════
   v1.40 大廳自由（Lobby games）
   ───────────────────────────────────────────────────────────────
   和大廳外面那些「連線對戰」最大的分別：
     * 沒有房主、沒有房間編號、沒有人數上限 —— 全站共用同一個大廳
     * 點進去就玩，自己一個也能玩（沒有其他人時自動補 AI 對手）
     * 隨時進出，你走了大廳還在，不會因為有人退出就結束

   資料放在三個不同的節點，刻意分開，因為大小差好幾個數量級：
     lobbyPresence/{gk}/players/{u}  幾十 bytes —— 大廳卡片上「幾人在玩」只訂閱這個
     lobbyLive/{gk}/{u}              每一幀的位置 —— 只有進了大廳的人訂閱
     lobbyFood/{gk}/{id}             共用可吃的東西 —— 同樣只有進了大廳的人訂閱
   這是一個很重要的取捨：如果全部塞在同一個節點，光是站在大廳看卡片
   就會一直收到每一幀的位置資料，流量會爆。

   同步模型：「每一端只負責自己的角色」。我自己的蛇由我算，算出新位置就寫上去；
   別人的蛇我只讀、不寫。碰撞用「我看到的那一份」判定，所以畫面上看到撞到就是撞到。
   ═══════════════════════════════════════════════════════════════ */
let lobbyKey=null;
let lgame=null;
let lobbyPresenceRef=null;

/* ===== 共用工具 ===== */
/** 多顆食物一次寫進去（multi-path update，一個請求搞定，比迴圈 push 省很多） */
async function lobbyPushFood(gk, items){
  if(!items||!items.length) return;
  const upd={};
  for(const it of items){
    const k=push(ref(db,'lobbyFood/'+gk)).key;
    upd[k]={x:Math.round(it.x),y:Math.round(it.y),r:it.r,g:it.g,c:it.c};
  }
  try{ await update(ref(db,'lobbyFood/'+gk),upd); }catch(e){}
}
/** 吃掉一顆：用 transaction 搶，只有一個人吃得到（不然兩端都會長大） */
async function lobbyEatFood(gk, id){
  try{
    const res=await runTransaction(ref(db,'lobbyFood/'+gk+'/'+id), cur=> cur?null:undefined);
    return !!res.committed;
  }catch(e){ return false; }
}

async function lobbyLeavePresence(){
  const gk=lobbyKey; if(!gk||!me) return;
  try{ if(lobbyPresenceRef) onDisconnect(lobbyPresenceRef).cancel(); }catch(e){}
  try{ await remove(ref(db,'lobbyPresence/'+gk+'/players/'+me.username)); }catch(e){}
  try{ await remove(ref(db,'lobbyLive/'+gk+'/'+me.username)); }catch(e){}
}

/* ===== 進入／離開大廳 ===== */
async function enterLobbyGame(gk){
  const g=gameDef(gk);
  if(!g.ok||!LOBBY_ENGINES[gk]){ showNotice('「'+g.n+'」即將推出，敬請期待'); return; }
  /* v1.41 大廳入場費：入場 50，局內每吃 10 粒回 +1（單局上限 100） */
  const fee=feeOf(gk);
  if(fee>0){
    const bal=await readPoints(me.username);
    const ok=await askPay('入場費 '+fee+' 積分',
      [`「${g.n}」入場需要 ${fee} 積分，目前有 ${bal} 分。`],'確定入場','不玩了');
    if(!ok) return;
    const t=await takePoints(me.username,fee);
    if(!t.ok){
      await askPay('積分不足',[`入場需要 ${fee} 積分，你目前只有 ${t.bal} 分。`],'知道了','關閉');
      return;
    }
  }
  if(tet){ try{ tet.unmount(); }catch(e){} tet=null; }
  if(typeof dinoGame!=='undefined' && dinoGame){ try{ dinoGame.unmount(); }catch(e){} dinoGame=null; }
  if(lgame) await leaveLobbyGame(true);
  lobbyKey=gk; view='lobbygame'; cameFromInvite=false;
  lgame=LOBBY_ENGINES[gk]();
  render();
  await lobbyJoinPresence(gk);
  await lgame.start();
  if(fee>0) startLobbyEarn(); else stopLobbyEarn();
}
async function leaveLobbyGame(silent){
  const gk=lobbyKey;
  stopLobbyEarn();
  if(lgame){ try{ await lgame.stop(); }catch(e){} lgame=null; }
  if(gk&&me){ await lobbyLeavePresence(); }
  lobbyKey=null;
  if(!silent){ view='lobby'; render(); }
}
/** 大廳遊戲的畫面外殼（topbar + 畫布 + HUD）。已掛載就只更新數字，不要重建畫布。 */
function renderLobbyGame(){
  if(isSecretUser()) mountCheat();
  const g=gameDef(lobbyKey);
  if(lgame&&lgame.mounted){ lgame.tickHud&&lgame.tickHud(); return; }
  appEl.innerHTML=`
    <div class="topbar"><button class="back-btn" data-act="lbLeave"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)}</h1>
      <span class="hint" style="margin:0;font-size:11.5px">大廳自由 · 沒有房主</span></div>
    <div class="cstage">
      <div class="cwrap" id="cwrap"><canvas id="cv"></canvas>
        <div class="hudtop">
          <div class="hudcard lb" id="lbCard"><div class="lbt">積分榜</div><div id="lbRows"></div></div>
          <div class="hudcard stats" id="stCard"></div>
        </div>
        <div class="ctrls" id="ctrlBox"></div>
        <div id="ovBox"></div>
      </div>
    </div>`;
  const b=appEl.querySelector('[data-act="lbLeave"]');
  if(b) b.onclick=async()=>{
    if(!(await confirmLeaveLobby())) return;
    leaveLobbyGame();
  };
  if(lgame) lgame.mount(appEl.querySelector('#cv'));
}

/* ===== 遊戲清單 ===== */
/* DPAD_CSS_MOVED: 已移到 <style> 內 */
/* ═══ 虛擬方向鍵（手機用）—— 大廳即時遊戲共用 ═══
   四個方向鍵排成十字，右下角浮在畫布上。按住即走，放手即停。
   鍵盤 WASD/方向鍵照舊可以用，兩者不衝突。 */
function mountDPad(host, onDir){
  const old=host.querySelector('.dpad'); if(old) old.remove();
  const d=document.createElement('div');
  d.className='dpad';
  d.innerHTML=
     '<button class="dp u" data-d="u" aria-label="上">▲</button>'
    +'<button class="dp l" data-d="l" aria-label="左">◀</button>'
    +'<button class="dp r" data-d="r" aria-label="右">▶</button>'
    +'<button class="dp d" data-d="d" aria-label="下">▼</button>';
  host.appendChild(d);

  const DIR={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
  const held=new Set();
  function recompute(){
    let x=0,y=0;
    held.forEach(k=>{ const v=DIR[k]; x+=v[0]; y+=v[1]; });
    const m=Math.hypot(x,y)||1;
    onDir(x?(x/m):0, y?(y/m):0);
  }
  function press(k, on){
    if(on) held.add(k); else held.delete(k);
    recompute();
  }
  d.querySelectorAll('.dp').forEach(b=>{
    const k=b.getAttribute('data-d');
    const start=e=>{ e.preventDefault(); b.classList.add('on'); press(k,true); };
    const end=e=>{ e.preventDefault(); b.classList.remove('on'); press(k,false); };
    b.addEventListener('pointerdown',start);
    b.addEventListener('pointerup',end);
    b.addEventListener('pointercancel',end);
    b.addEventListener('pointerleave',end);
    /* 防止長按選字／放大鏡 */
    b.addEventListener('contextmenu',e=>e.preventDefault());
  });
  return ()=>{ try{ d.remove(); }catch(e){} onDir(0,0); };
}

/* ═══ 相撲推擠（sumo）—— 第一個 3D 感聯機遊戲 ═══
   玩法：所有人在一個圓形擂台，互相撞，把人推出圈外就得一分。
   渲染：Canvas 2D 做偽 3D —— 斜投影地面 + 球體徑向漸變 + 橢圓陰影。
   同步：每人只寫自己的座標到 lobbyLive/sumo/{u}，撞擊由「被撞者」本地判定，
         所以不會有兩邊同時改同一個人的問題。 */
function createSumoLobby(){
  const R=210;                 /* 擂台半徑（世界座標） */
  const PR=16;                 /* 球半徑 */
  const K=0.55;                /* 縱向壓縮（斜視角） */
  let cv=null, ctx=null, raf=0, running=false, cw=0, ch=0, dpr=1;
  let alive=true, score=0;
  let meP={x:0,y:0,vx:0,vy:0};
  let liveRef=null, unsubLive=null, unsubScore=null;
  let others={};               /* username → {x,y,name,color,at} */
  let lastT=0, keys={x:0,y:0}, pushing=0;
  let popups=[];               /* 被撞飛的小字 */
  let shake=0;

  function worldToScreen(x,y){
    const s=Math.min(cw/(R*2.5), ch/(R*2.5*K*2))*1.0;
    return {sx:cw/2+x*s, sy:ch/2+y*s*K, s:s};
  }
  function randSpawn(){
    const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*R*0.62;
    return {x:Math.cos(a)*r, y:Math.sin(a)*r};
  }

  /* ── 畫地面：斜格 + 紅圈 ── */
  function drawArena(){
    const c=worldToScreen(0,0), s=c.s;
    /* 外圈陰影 */
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(c.sx,c.sy+c.s*14,R*s*1.06,R*s*K*1.06,0,0,7);
    ctx.fillStyle='rgba(0,0,0,.35)'; ctx.filter='blur(10px)'; ctx.fill();
    ctx.restore();

    /* 擂台面：徑向漸變（中心亮 → 邊暗），做出凹面感 */
    const g=ctx.createRadialGradient(c.sx,c.sy-s*20,10,c.sx,c.sy,R*s);
    g.addColorStop(0,'#243447'); g.addColorStop(.65,'#1a2536'); g.addColorStop(1,'#0f1620');
    ctx.beginPath();
    ctx.ellipse(c.sx,c.sy,R*s,R*s*K,0,0,7);
    ctx.fillStyle=g; ctx.fill();

    /* 斜格線 */
    ctx.save();
    ctx.beginPath(); ctx.ellipse(c.sx,c.sy,R*s,R*s*K,0,0,7); ctx.clip();
    ctx.strokeStyle='rgba(120,160,210,.09)'; ctx.lineWidth=1;
    const step=42;
    for(let gx=-R;gx<=R;gx+=step){
      const a=worldToScreen(gx,-R), b=worldToScreen(gx,R);
      ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();
    }
    for(let gy=-R;gy<=R;gy+=step){
      const a=worldToScreen(-R,gy), b=worldToScreen(R,gy);
      ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();
    }
    ctx.restore();

    /* 邊界圈：外紅內青，危險時脈動 */
    ctx.beginPath();
    ctx.ellipse(c.sx,c.sy,R*s,R*s*K,0,0,7);
    ctx.strokeStyle='rgba(248,113,113,.85)'; ctx.lineWidth=Math.max(2,s*3.2); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(c.sx,c.sy,R*s*0.965,R*s*K*0.965,0,0,7);
    ctx.strokeStyle='rgba(56,189,248,.35)'; ctx.lineWidth=1.5; ctx.stroke();
  }

  /* ── 畫一顆球（立體感：投影 + 徑向漸變 + 高光）── */
  function drawBall(x,y,color,r,isMe,label){
    const p=worldToScreen(x,y), s=p.s;
    const rr=r*s;
    /* 地面投影 */
    ctx.beginPath();
    ctx.ellipse(p.sx,p.sy+rr*0.55, rr*0.95, rr*0.42,0,0,7);
    ctx.fillStyle='rgba(0,0,0,.42)'; ctx.filter='blur(4px)'; ctx.fill();
    ctx.filter='none';
    /* 球體 */
    const g=ctx.createRadialGradient(p.sx-rr*0.35,p.sy-rr*0.45,rr*0.1,p.sx,p.sy,rr*1.05);
    g.addColorStop(0,'#ffffff');
    g.addColorStop(0.28,color);
    g.addColorStop(1,'rgba(0,0,0,.55)');
    ctx.beginPath(); ctx.arc(p.sx,p.sy,rr,0,7); ctx.fillStyle=g; ctx.fill();
    /* 邊光 */
    ctx.beginPath(); ctx.arc(p.sx,p.sy,rr,0,7);
    ctx.strokeStyle=isMe?'rgba(56,189,248,.95)':'rgba(255,255,255,.25)';
    ctx.lineWidth=isMe?2.4:1.2; ctx.stroke();
    /* 高光點 */
    ctx.beginPath(); ctx.arc(p.sx-rr*0.32,p.sy-rr*0.4,rr*0.18,0,7);
    ctx.fillStyle='rgba(255,255,255,.75)'; ctx.fill();
    /* 名字 */
    if(label){
      ctx.font='600 '+Math.max(10,s*13)+'px Inter,sans-serif';
      ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.92)';
      ctx.fillText(label,p.sx,p.sy-rr-6);
    }
  }

  function step(dt){
    /* 自己移動 */
    const acc=1450;
    meP.vx+=keys.x*acc*dt; meP.vy+=keys.y*acc*dt;
    const fr=Math.pow(0.0016,dt);
    meP.vx*=fr; meP.vy*=fr;
    meP.x+=meP.vx*dt; meP.y+=meP.vy*dt;

    /* 出界判定（自己）*/
    const d=Math.hypot(meP.x,meP.y);
    if(d>R+PR*0.6){
      alive=false;
      score=Math.max(0,score-1);
      const sp=randSpawn(); meP.x=sp.x; meP.y=sp.y; meP.vx=meP.vy=0;
      popups.push({x:meP.x,y:meP.y,t:1,txt:'出局 −1'});
      shake=10;
      setTimeout(()=>{ alive=true; },900);
    }

    /* 與別人碰撞：自己被推開那邊才算（避免兩邊搶寫）*/
    for(const u in others){
      const o=others[u];
      if(!o||typeof o.x!=='number') continue;
      const dx=meP.x-o.x, dy=meP.y-o.y;
      const dist=Math.hypot(dx,dy);
      const minD=PR*2;
      if(dist<minD && dist>0.01){
        const nx=dx/dist, ny=dy/dist;
        const overlap=minD-dist;
        /* 位置推開（唔可以重疊）*/
        meP.x+=nx*overlap*0.7; meP.y+=ny*overlap*0.7;
        /* 力：越貼越大力，但上限；除咗方向，亦加一點切向位（唔會正面死頂）*/
        const tx=-ny, ty=nx;
        const side=(meP.vx*tx+meP.vy*ty)>0?1:-1;
        const push=Math.min(420, 180+overlap*24);
        meP.vx+=nx*push+tx*side*70;
        meP.vy+=ny*push+ty*side*70;
        pushing=0.22;
        shake=Math.max(shake,4);
      }
    }
    /* SUMO_FIX2: 之前每幀 vx*=0.3 但加速度照加，結果永遠貼住邊一路滑（繞圈）。
       改成「法向分量清零、切向保留」——撞牆就停，但可以沿住牆行。 */
    const dn=Math.hypot(meP.x,meP.y);
    if(dn>R-PR*0.4 && dn>0.01){
      const nx=meP.x/dn, ny=meP.y/dn;
      meP.x=nx*(R-PR*0.4); meP.y=ny*(R-PR*0.4);
      const vn=meP.vx*nx+meP.vy*ny;      /* 向外速度 */
      if(vn>0){ meP.vx-=nx*vn; meP.vy-=ny*vn; }   /* 只扣向外，唔會反彈 */
      meP.vx*=0.82; meP.vy*=0.82;        /* 牆面摩擦 */
    }

    if(pushing>0) pushing-=dt;
    if(shake>0) shake-=dt*30;
    popups.forEach(p=>p.t-=dt*1.2);
    popups=popups.filter(p=>p.t>0);

    /* 寫回自己位置（節流：約 20Hz）*/
    if(liveRef && running){
      pushLive();
    }
  }
  let lastPush=0;
  function pushLive(){
    const now=Date.now();
    if(now-lastPush<50) return;
    lastPush=now;
    try{
      set(liveRef,{x:Math.round(meP.x*10)/10,y:Math.round(meP.y*10)/10,
        name:me.displayName||me.username,color:safeColor(me.color,'#22c55e'),
        score:score,at:now});
    }catch(e){}
  }

  function draw(){
    if(!ctx) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    /* 背景：徑向深藍 */
    const bg=ctx.createRadialGradient(cw/2,ch*0.42,40,cw/2,ch*0.5,Math.max(cw,ch)*0.8);
    bg.addColorStop(0,'#0d1726'); bg.addColorStop(1,'#05080e');
    ctx.fillStyle=bg; ctx.fillRect(0,0,cw,ch);

    ctx.save();
    if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

    drawArena();

    /* 其他人 */
    for(const u in others){
      const o=others[u];
      if(!o||typeof o.x!=='number') continue;
      if(Date.now()-(o.at||0)>8000) continue;   /* 8 秒沒更新當離線 */
      drawBall(o.x,o.y,o.color||'#22c55e',PR,false,o.name);
    }
    /* 自己 */
    if(alive) drawBall(meP.x,meP.y,'#38bdf8',PR,true,me.displayName||me.username);

    /* 撞飛小字 */
    popups.forEach(p=>{
      const q=worldToScreen(p.x,p.y);
      ctx.globalAlpha=Math.max(0,p.t);
      ctx.font='700 '+Math.max(12,q.s*15)+'px Inter,sans-serif';
      ctx.textAlign='center'; ctx.fillStyle='#f87171';
      ctx.fillText(p.txt,q.sx,q.sy-q.s*30-(1-p.t)*24);
      ctx.globalAlpha=1;
    });
    ctx.restore();

    /* HUD：分數 */
    ctx.font='700 15px Inter,sans-serif';
    ctx.textAlign='left'; ctx.fillStyle='rgba(226,232,240,.9)';
    ctx.fillText('分數 '+score, 16, 28);
  }

  function loop(t){
    if(!running) return;
    const dt=Math.min(0.05,(t-lastT)/1000||0.016);
    lastT=t;
    try{ step(dt); draw(); }catch(e){ console.error('sumo',e); }
    raf=requestAnimationFrame(loop);
  }

  function bindInput(){
    const setK=(x,y)=>{ keys.x=x; keys.y=y; };
    const onKey=e=>{
      const k=e.key;
      if(k==='ArrowLeft'||k==='a'||k==='A') setK(-1,0);
      else if(k==='ArrowRight'||k==='d'||k==='D') setK(1,0);
      else if(k==='ArrowUp'||k==='w'||k==='W') setK(0,-1);
      else if(k==='ArrowDown'||k==='s'||k==='S') setK(0,1);
      else return;
      e.preventDefault();
    };
    const onUp=()=>setK(0,0);
    window.addEventListener('keydown',onKey);
    window.addEventListener('keyup',onUp);

    /* 觸控：拖哪邊就往哪邊 */
    let tid=null, ox=0, oy=0;
    cv.addEventListener('touchstart',e=>{
      const t0=e.changedTouches[0]; tid=t0.identifier; ox=t0.clientX; oy=t0.clientY;
      e.preventDefault();
    },{passive:false});
    cv.addEventListener('touchmove',e=>{
      for(const t0 of e.changedTouches){
        if(t0.identifier!==tid) continue;
        const dx=t0.clientX-ox, dy=t0.clientY-oy;
        const m=Math.hypot(dx,dy)||1;
        setK(dx/m,dy/m);
      }
      e.preventDefault();
    },{passive:false});
    cv.addEventListener('touchend',e=>{
      for(const t0 of e.changedTouches){ if(t0.identifier===tid){ tid=null; setK(0,0); } }
    });
    return ()=>{ window.removeEventListener('keydown',onKey); window.removeEventListener('keyup',onUp); };
  }

  let unbind=null;
  return {
    mounted:false,
    async start(){
      if(!me) return;
      const sp=randSpawn(); meP.x=sp.x; meP.y=sp.y;
      liveRef=ref(db,'lobbyLive/sumo/'+me.username);
      try{ onDisconnect(liveRef).remove(); }catch(e){}
      /* 訂閱全部玩家 */
      try{
        unsubLive=onValue(ref(db,'lobbyLive/sumo'),snap=>{
          const v=snap.val()||{};
          /* SUMO_FIX1: 之前冇剔走自己，lobbyLive 入面有自己嘅節點，
             本地又畫一次 → 同一個名出現兩個圈，睇落似「兩個都喺度追」。 */
          const mine=v[me.username]||null;
          const o={};
          for(const k in v){ if(k!==me.username) o[k]=v[k]; }
          others=o;
          if(mine&&typeof mine.score==='number'&&mine.score>score) score=mine.score;
        });
      }catch(e){}
      running=true; lastT=performance.now();
      this.mounted=true;
      if(cv){ const r=cv.getBoundingClientRect(); cw=r.width||360; ch=r.height||420; }
      raf=requestAnimationFrame(loop);
    },
    async stop(){
      running=false;
      if(raf) cancelAnimationFrame(raf);
      if(unbind){ unbind(); unbind=null; }
      try{ if(unsubLive) unsubLive(); }catch(e){}
      try{ if(liveRef) await remove(liveRef); }catch(e){}
      this.mounted=false;
    },
    mount(canvas){
      cv=canvas; ctx=cv.getContext('2d');
      dpr=Math.min(2,window.devicePixelRatio||1);
      const fit=()=>{
        const r=cv.getBoundingClientRect();
        cw=r.width||360; ch=r.height||420;
        cv.width=cw*dpr; cv.height=ch*dpr;
        cv.style.width=cw+'px'; cv.style.height=ch+'px';
      };
      fit();
      window.addEventListener('resize',fit);
      unbind=bindInput();
      /* 手機：右下角虛擬方向鍵（鍵盤照舊可用） */
      const host=cv.parentElement;
      if(host){ const kill=mountDPad(host,(x,y)=>{ keys.x=x; keys.y=y; }); const oldUn=unbind;
        unbind=()=>{ try{kill();}catch(e){} oldUn(); }; }
      draw();
    },
    tickHud(){
      const el=document.getElementById('stCard');
      if(el) el.innerHTML='<div style="font-size:11px;color:var(--text-sub)">分數</div><div style="font-size:22px;font-weight:800">'+score+'</div>';
    },
    debug(){ return {x:meP.x,y:meP.y,score,others:Object.keys(others||{}),alive}; },
    probe(x,y){ return Math.hypot(x,y)<=R; }
  };
}

/* ═══ 鬼抓人（tag）—— 一人当鬼，追到就换鬼 ═══
   渲染延续相撲那套偽 3D：斜投影地面 + 徑向漸變球 + 橢圓投影。
   同步：位置寫 lobbyLive/tag/p/{u}，鬼寫 lobbyLive/tag/meta/ghost。
        判定由「鬼自己」算（他離誰最近），抓到就寫 ghost=對方。 */
function createTagLobby(){
  const R=230, PR=15, K=0.55;
  /* TAG_WALLS: 固定佈局（唔隨機）——所有人同一張地圖。
     圓形擂台 + 幾堵牆，做「迷宮」的感覺，又唔會困死。
     座標是中心點 + 寬高（世界座標）。 */
  const WALLS=[
    {x:-118,y:-96,w:74,h:22},
    {x: 96,y:-118,w:22,h:70},
    {x:-150,y: 38,w:22,h:78},
    {x:  36,y: 86,w:86,h:22},
    {x: 148,y: 52,w:22,h:64},
    {x: -22,y:-24,w:22,h:64},
    {x:-82,y: 118,w:64,h:20},
    {x: 118,y: 148,w:20,h:52},
  ];
  const WALL_TOP='#334155', WALL_SIDE='#1e293b', WALL_EDGE='rgba(148,163,184,.5)';
  function inWall(x,y,pad){
    for(const w of WALLS){
      if(Math.abs(x-w.x) < w.w/2+pad && Math.abs(y-w.y) < w.h/2+pad) return true;
    }
    return false;
  }
  function resolveWalls(p,r){
    for(const w of WALLS){
      const cx=Math.max(w.x-w.w/2, Math.min(p.x, w.x+w.w/2));
      const cy=Math.max(w.y-w.h/2, Math.min(p.y, w.y+w.h/2));
      const dx=p.x-cx, dy=p.y-cy;
      const d=Math.hypot(dx,dy);
      if(d<r && d>0.01){
        const nx=dx/d, ny=dy/d;
        p.x=cx+nx*r; p.y=cy+ny*r;
        const vn=p.vx*nx+p.vy*ny;
        if(vn<0){ p.vx-=nx*vn; p.vy-=ny*vn; }
        p.vx*=0.86; p.vy*=0.86;
      }
    }
  }
  /* 3D 牆：頂面 + 前面 + 右面，做出厚度 */
  function drawWall(w){
    const s=w2s(0,0).s;
    const halfW=w.w/2, halfH=w.h/2, H=16;   /* H = 牆高（世界單位） */
    const A=w2s(w.x-halfW, w.y-halfH), B=w2s(w.x+halfW, w.y-halfH);
    const C=w2s(w.x+halfW, w.y+halfH), D=w2s(w.x-halfW, w.y+halfH);
    const hgt=H*s*K*1.35;
    /* 側面（前面 + 右面）*/
    ctx.beginPath();
    ctx.moveTo(D.sx,D.sy); ctx.lineTo(C.sx,C.sy);
    ctx.lineTo(C.sx,C.sy-hgt); ctx.lineTo(D.sx,D.sy-hgt); ctx.closePath();
    ctx.fillStyle=WALL_SIDE; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(B.sx,B.sy); ctx.lineTo(C.sx,C.sy);
    ctx.lineTo(C.sx,C.sy-hgt); ctx.lineTo(B.sx,B.sy-hgt); ctx.closePath();
    ctx.fillStyle='#16202c'; ctx.fill();
    /* 頂面 */
    ctx.beginPath();
    ctx.moveTo(A.sx,A.sy-hgt); ctx.lineTo(B.sx,B.sy-hgt);
    ctx.lineTo(C.sx,C.sy-hgt); ctx.lineTo(D.sx,D.sy-hgt); ctx.closePath();
    ctx.fillStyle=WALL_TOP; ctx.fill();
    ctx.strokeStyle=WALL_EDGE; ctx.lineWidth=1.2; ctx.stroke();
    /* 頂面高光 */
    ctx.beginPath();
    ctx.moveTo(A.sx,A.sy-hgt); ctx.lineTo(B.sx,B.sy-hgt);
    ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1.4; ctx.stroke();
    /* 地面投影 */
    ctx.beginPath();
    ctx.moveTo(D.sx,D.sy); ctx.lineTo(C.sx,C.sy); ctx.lineTo(B.sx,B.sy);
    ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=3; ctx.stroke();
  }
  let cv=null, ctx=null, raf=0, running=false, cw=0, ch=0, dpr=1;
  let meP={x:0,y:0,vx:0,vy:0};
  let others={};                 /* u → {x,y,name,color,at} */
  let ghosts={};                 /* u → true   誰是鬼（可多於一個） */
  let myScore=0, myGhost=false, lastCatch=0;
  let liveRef=null, metaRef=null, unsubLive=null, unsubMeta=null;
  let keys={x:0,y:0}, lastT=0, lastPush=0, shake=0;
  let popups=[], grace=0;        /* grace：剛換鬼後 1.2 秒無敵，避免連環抓 */
  let trail=[];                  /* 鬼的殘影 */

  function w2s(x,y){
    const s=Math.min(cw/(R*2.35), ch/(R*2.35*K))*1.0;
    return {sx:cw/2+x*s, sy:ch/2+y*s*K, s};
  }
  function spawn(){
    for(let i=0;i<40;i++){
      const a=Math.random()*6.283, r=Math.sqrt(Math.random())*R*0.72;
      const x=Math.cos(a)*r, y=Math.sin(a)*r;
      if(!inWall(x,y,PR+8)) return {x,y};
    }
    return {x:0,y:-R*0.85};
  }

  function drawField(){
    const c=w2s(0,0), s=c.s;
    /* 地面陰影 */
    ctx.save(); ctx.beginPath();
    ctx.ellipse(c.sx,c.sy+s*16,R*s*1.08,R*s*K*1.08,0,0,7);
    ctx.fillStyle='rgba(0,0,0,.4)'; ctx.filter='blur(12px)'; ctx.fill(); ctx.restore();

    /* 地面：徑向漸變 + 斜格 */
    const g=ctx.createRadialGradient(c.sx,c.sy-s*24,12,c.sx,c.sy,R*s);
    g.addColorStop(0,'#1f2c3d'); g.addColorStop(.62,'#16202e'); g.addColorStop(1,'#0b1119');
    ctx.beginPath(); ctx.ellipse(c.sx,c.sy,R*s,R*s*K,0,0,7); ctx.fillStyle=g; ctx.fill();

    ctx.save(); ctx.beginPath(); ctx.ellipse(c.sx,c.sy,R*s,R*s*K,0,0,7); ctx.clip();
    ctx.strokeStyle='rgba(120,160,210,.075)'; ctx.lineWidth=1;
    for(let gx=-R;gx<=R;gx+=46){ const a=w2s(gx,-R),b=w2s(gx,R); ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.stroke(); }
    for(let gy=-R;gy<=R;gy+=46){ const a=w2s(-R,gy),b=w2s(R,gy); ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.stroke(); }
    ctx.restore();

    /* 邊界：有鬼時轉紅；再加一圈內虛線，同相撲（實線圓）區分 */
    const anyGhost=Object.keys(ghosts).length>0;
    ctx.beginPath(); ctx.ellipse(c.sx,c.sy,R*s,R*s*K,0,0,7);
    ctx.strokeStyle=anyGhost?'rgba(248,113,113,.9)':'rgba(56,189,248,.55)';
    ctx.lineWidth=Math.max(2,s*3.4); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(c.sx,c.sy,R*s*0.93,R*s*K*0.93,0,0,7);
    ctx.setLineDash([6,7]);
    ctx.strokeStyle='rgba(148,163,184,.28)'; ctx.lineWidth=1.4; ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawBall(x,y,color,r,label,isGhost,isMe){
    const p=w2s(x,y), s=p.s, rr=r*s;
    /* 投影 */
    ctx.beginPath(); ctx.ellipse(p.sx,p.sy+rr*0.55,rr*0.95,rr*0.42,0,0,7);
    ctx.fillStyle=isGhost?'rgba(248,113,113,.35)':'rgba(0,0,0,.42)';
    ctx.filter='blur(4px)'; ctx.fill(); ctx.filter='none';
    /* 鬼光環 */
    if(isGhost){
      const hg=ctx.createRadialGradient(p.sx,p.sy,rr*0.6,p.sx,p.sy,rr*2.4);
      hg.addColorStop(0,'rgba(248,113,113,.45)'); hg.addColorStop(1,'rgba(248,113,113,0)');
      ctx.beginPath(); ctx.arc(p.sx,p.sy,rr*2.4,0,7); ctx.fillStyle=hg; ctx.fill();
    }
    /* 球體 */
    const g=ctx.createRadialGradient(p.sx-rr*.35,p.sy-rr*.45,rr*.1,p.sx,p.sy,rr*1.05);
    g.addColorStop(0,'#fff'); g.addColorStop(.28,color); g.addColorStop(1,'rgba(0,0,0,.55)');
    ctx.beginPath(); ctx.arc(p.sx,p.sy,rr,0,7); ctx.fillStyle=g; ctx.fill();
    ctx.beginPath(); ctx.arc(p.sx,p.sy,rr,0,7);
    ctx.strokeStyle=isMe?'rgba(56,189,248,.95)':(isGhost?'rgba(255,180,180,.8)':'rgba(255,255,255,.22)');
    ctx.lineWidth=isMe?2.6:1.3; ctx.stroke();
    ctx.beginPath(); ctx.arc(p.sx-rr*.32,p.sy-rr*.4,rr*.18,0,7); ctx.fillStyle='rgba(255,255,255,.7)'; ctx.fill();
    if(label){
      ctx.font='600 '+Math.max(10,s*12.5)+'px Inter,sans-serif'; ctx.textAlign='center';
      ctx.fillStyle=isGhost?'#fca5a5':'rgba(255,255,255,.92)';
      ctx.fillText((isGhost?'👻 ':'')+label,p.sx,p.sy-rr-7);
    }
  }

  function step(dt){
    const acc=1500;
    meP.vx+=keys.x*acc*dt; meP.vy+=keys.y*acc*dt;
    const fr=Math.pow(0.0018,dt); meP.vx*=fr; meP.vy*=fr;
    meP.x+=meP.vx*dt; meP.y+=meP.vy*dt;

    /* 牆：只去向外分量（同 sumo 一致，唔會繞圈）*/
    const d=Math.hypot(meP.x,meP.y);
    if(d>R-PR*0.4&&d>0.01){
      const nx=meP.x/d, ny=meP.y/d;
      meP.x=nx*(R-PR*0.4); meP.y=ny*(R-PR*0.4);
      const vn=meP.vx*nx+meP.vy*ny;
      if(vn>0){ meP.vx-=nx*vn; meP.vy-=ny*vn; }
      meP.vx*=0.84; meP.vy*=0.84;
    }

    resolveWalls(meP, PR);

    if(grace>0) grace-=dt;
    if(shake>0) shake-=dt*32;
    popups.forEach(p=>p.t-=dt*1.1); popups=popups.filter(p=>p.t>0);

    /* 鬼：追最近的人，並判定抓到 */
    if(myGhost&&grace<=0){
      let best=null,bd=1e9;
      for(const u in others){
        const o=others[u]; if(!o||typeof o.x!=='number'||ghosts[u]) continue;
        if(Date.now()-(o.at||0)>8000) continue;
        const dd=Math.hypot(meP.x-o.x,meP.y-o.y);
        if(dd<bd){ bd=dd; best=o; }
      }
      if(best&&bd<PR*2.05){
        const now=Date.now();
        if(now-lastCatch>700){
          lastCatch=now;
          myScore++;
          shake=7;
          popups.push({x:meP.x,y:meP.y,t:1,txt:'抓到 +1'});
          try{ set(metaRef,{ghost:best._u||'',by:me.username,at:now}); }catch(e){}
          myGhost=false; ghostSelf(false);
        }
      }
      /* 殘影 */
      trail.push({x:meP.x,y:meP.y,t:0.5});
      if(trail.length>14) trail.shift();
    } else if(trail.length) { trail.shift(); }
    trail.forEach(t=>t.t-=dt*1.4);

    if(liveRef&&running) pushLive();
  }

  function pushLive(){
    const now=Date.now();
    if(now-lastPush<50) return; lastPush=now;
    try{ set(liveRef,{x:Math.round(meP.x*10)/10,y:Math.round(meP.y*10)/10,
      name:me.displayName||me.username,color:safeColor(me.color,'#22c55e'),
      score:myScore,ghost:myGhost,at:now}); }catch(e){}
  }
  function ghostSelf(v){
    myGhost=v;
    if(v){
      const sp=spawn(); meP.x=sp.x; meP.y=sp.y; meP.vx=meP.vy=0;
      grace=1.2; trail=[];
      popups.push({x:meP.x,y:meP.y,t:1.3,txt:'你是鬼！'});
    }
    try{ set(ref(db,'lobbyLive/tag/meta/'+me.username),v?1:null); }catch(e){}
    pushLive();
  }

  function draw(){
    if(!ctx) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const bg=ctx.createRadialGradient(cw/2,ch*.42,40,cw/2,ch*.5,Math.max(cw,ch)*.8);
    bg.addColorStop(0,'#0c1420'); bg.addColorStop(1,'#04070b');
    ctx.fillStyle=bg; ctx.fillRect(0,0,cw,ch);

    ctx.save();
    if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
    drawField();

    /* 殘影 */
    trail.forEach((t,i)=>{
      if(t.t<=0) return;
      const p=w2s(t.x,t.y), s=p.s;
      ctx.beginPath(); ctx.arc(p.sx,p.sy,PR*s*(0.5+t.t*0.5),0,7);
      ctx.fillStyle='rgba(248,113,113,'+(t.t*0.18)+')'; ctx.fill();
    });

    /* 牆：按 y 排序，後面的先畫（有遮擋感）*/
    [...WALLS].sort((a,b)=>a.y-b.y).forEach(drawWall);

    for(const u in others){
      const o=others[u];
      if(!o||typeof o.x!=='number') continue;
      if(Date.now()-(o.at||0)>8000) continue;
      if(o.ghost){ ghosts[u]=true; } else { delete ghosts[u]; }
      drawBall(o.x,o.y,o.color||'#22c55e',PR,o.name,!!o.ghost,false);
    }
    drawBall(meP.x,meP.y,myGhost?'#ef4444':'#38bdf8',PR,me.displayName||me.username,myGhost,true);

    popups.forEach(p=>{
      const q=w2s(p.x,p.y);
      ctx.globalAlpha=Math.max(0,p.t);
      ctx.font='700 '+Math.max(12,q.s*15)+'px Inter,sans-serif'; ctx.textAlign='center';
      ctx.fillStyle=myGhost?'#fca5a5':'#4ade80';
      ctx.fillText(p.txt,q.sx,q.sy-q.s*32-(1-p.t)*22);
      ctx.globalAlpha=1;
    });
    ctx.restore();

    ctx.font='700 15px Inter,sans-serif'; ctx.textAlign='left'; ctx.fillStyle='rgba(226,232,240,.9)';
    ctx.fillText((myGhost?'👻 你是鬼':'🏃 快走')+'　抓到 '+myScore, 16, 28);
  }

  function loop(t){
    if(!running) return;
    const dt=Math.min(0.05,(t-lastT)/1000||0.016); lastT=t;
    try{ step(dt); draw(); }catch(e){ console.error('tag',e); }
    raf=requestAnimationFrame(loop);
  }

  function bindInput(){
    const setK=(x,y)=>{keys.x=x;keys.y=y;};
    const onKey=e=>{
      const k=e.key;
      if(k==='ArrowLeft'||k==='a'||k==='A')setK(-1,0);
      else if(k==='ArrowRight'||k==='d'||k==='D')setK(1,0);
      else if(k==='ArrowUp'||k==='w'||k==='W')setK(0,-1);
      else if(k==='ArrowDown'||k==='s'||k==='S')setK(0,1);
      else return;
      e.preventDefault();
    };
    const onUp=()=>setK(0,0);
    window.addEventListener('keydown',onKey); window.addEventListener('keyup',onUp);
    let tid=null,ox=0,oy=0;
    cv.addEventListener('touchstart',e=>{const t0=e.changedTouches[0];tid=t0.identifier;ox=t0.clientX;oy=t0.clientY;e.preventDefault();},{passive:false});
    cv.addEventListener('touchmove',e=>{for(const t0 of e.changedTouches){if(t0.identifier!==tid)continue;const dx=t0.clientX-ox,dy=t0.clientY-oy;const m=Math.hypot(dx,dy)||1;setK(dx/m,dy/m);}e.preventDefault();},{passive:false});
    cv.addEventListener('touchend',e=>{for(const t0 of e.changedTouches){if(t0.identifier===tid){tid=null;setK(0,0);}}});
    return ()=>{window.removeEventListener('keydown',onKey);window.removeEventListener('keyup',onUp);};
  }

  let unbind=null;
  return {
    mounted:false,
    async start(){
      if(!me) return;
      const sp=spawn(); meP.x=sp.x; meP.y=sp.y;
      liveRef=ref(db,'lobbyLive/tag/p/'+me.username);
      metaRef=ref(db,'lobbyLive/tag/meta');
      try{ onDisconnect(liveRef).remove(); }catch(e){}
      try{
        unsubLive=onValue(ref(db,'lobbyLive/tag/p'),snap=>{
          const v=snap.val()||{}; const o={};
          for(const k in v){ if(k!==me.username){ const it=Object.assign({},v[k]); it._u=k; o[k]=it; } }
          others=o;
        });
      }catch(e){}
      try{
        unsubMeta=onValue(ref(db,'lobbyLive/tag/meta'),snap=>{
          const v=snap.val()||{};
          const now=Date.now();
          /* 只有自己「唔係鬼」而同一個 meta 記錄指向自己 → 變成鬼 */
          if(v.ghost&&v.ghost===me.username&&!myGhost&&now-(v.at||0)<6000) ghostSelf(true);
          if(v.by&&v.by!==me.username&&myGhost&&now-(v.at||0)<6000){
            /* 別人抓走了 → 自己也退鬼 */
            myGhost=false; pushLive();
          }
        });
      }catch(e){}
      running=true; lastT=performance.now(); this.mounted=true;
      raf=requestAnimationFrame(loop);
    },
    async stop(){
      running=false;
      if(raf) cancelAnimationFrame(raf);
      if(unbind){unbind();unbind=null;}
      try{ if(unsubLive) unsubLive(); }catch(e){}
      try{ if(unsubMeta) unsubMeta(); }catch(e){}
      try{ if(liveRef) await remove(liveRef); }catch(e){}
      try{ if(me) await remove(ref(db,'lobbyLive/tag/meta/'+me.username)); }catch(e){}
      this.mounted=false;
    },
    mount(canvas){
      cv=canvas; ctx=cv.getContext('2d');
      dpr=Math.min(2,window.devicePixelRatio||1);
      const fit=()=>{const r=cv.getBoundingClientRect();cw=r.width||360;ch=r.height||420;
        cv.width=cw*dpr;cv.height=ch*dpr;cv.style.width=cw+'px';cv.style.height=ch+'px';};
      fit(); window.addEventListener('resize',fit);
      unbind=bindInput();
      const host=cv.parentElement;
      if(host){ const kill=mountDPad(host,(x,y)=>{ keys.x=x; keys.y=y; }); const oldUn=unbind;
        unbind=()=>{ try{kill();}catch(e){} oldUn(); }; }
      draw();
    },
    tickHud(){
      const el=document.getElementById('stCard');
      if(el) el.innerHTML='<div style="font-size:11px;color:var(--text-sub)">'+(myGhost?'你是鬼':'逃跑中')+'</div>'
        +'<div style="font-size:22px;font-weight:800">'+myScore+'</div>';
    },
    debug(){ return {x:meP.x,y:meP.y,score:myScore,ghost:myGhost,others:Object.keys(others||{})}; },
    probe(x,y){ return Math.hypot(x,y)<=R; }
  };
}

/* ═══ 大魚吃小魚（fish）—— 藍色海洋 ═══
   自己吃小魚變大；比對大過自己太多的玩家會被吃掉（扣分）。
   小魚各自本地生成（唔同步），只有玩家位置同步 —— 省流量又唔會搶食。 */
function createFishLobby(){
  const R=240, K=0.55;
  let cv=null, ctx=null, raf=0, running=false, cw=0, ch=0, dpr=1;
  let meP={x:0,y:0,vx:0,vy:0,r:12,facing:1};
  let others={}, liveRef=null, unsubLive=null;
  let fishes=[], bubbles=[], myScore=0, lastPush=0, lastT=0, shake=0;
  let keys={x:0,y:0}, eating=0;
  let unbind=null;

  function w2s(x,y){
    const s=Math.min(cw/(R*2.2), ch/(R*2.2*K));
    return {sx:cw/2+x*s, sy:ch/2+y*s*K, s};
  }
  function spawnFish(){
    const a=Math.random()*6.283, r=Math.sqrt(Math.random())*R*0.88;
    const size=3.5+Math.random()*5.5;
    return {x:Math.cos(a)*r, y:Math.sin(a)*r,
      r:size, vx:(Math.random()-.5)*22, vy:(Math.random()-.5)*22,
      hue:Math.random()<.5?195:35, ph:Math.random()*6.283};
  }

  function drawWater(){
    /* 藍色海洋：上淺下深 */
    const g=ctx.createLinearGradient(0,0,0,ch);
    g.addColorStop(0,'#0c4a6e'); g.addColorStop(.45,'#0a3a58'); g.addColorStop(1,'#04202f');
    ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch);
    /* 水面光斑 */
    const lg=ctx.createRadialGradient(cw*0.3,0,10,cw*0.3,0,ch*0.75);
    lg.addColorStop(0,'rgba(125,211,252,.28)'); lg.addColorStop(1,'rgba(125,211,252,0)');
    ctx.fillStyle=lg; ctx.fillRect(0,0,cw,ch);
    const lg2=ctx.createRadialGradient(cw*0.75,ch*0.08,8,cw*0.75,ch*0.08,ch*0.55);
    lg2.addColorStop(0,'rgba(56,189,248,.18)'); lg2.addColorStop(1,'rgba(56,189,248,0)');
    ctx.fillStyle=lg2; ctx.fillRect(0,0,cw,ch);
  }

  function drawBounds(){
    const c=w2s(0,0), s=c.s;
    ctx.beginPath(); ctx.ellipse(c.sx,c.sy,R*s,R*s*K,0,0,7);
    ctx.strokeStyle='rgba(125,211,252,.28)'; ctx.lineWidth=Math.max(2,s*3); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(c.sx,c.sy,R*s*0.985,R*s*K*0.985,0,0,7);
    ctx.strokeStyle='rgba(56,189,248,.12)'; ctx.lineWidth=1.2; ctx.stroke();
  }

  /* 畫一條魚（側面 + 尾鰭擺動 + 投影）*/
  function drawFish(x,y,rad,hue,isMe,facing,label,alpha){
    const p=w2s(x,y), s=p.s;
    const rr=rad*s;
    const t=performance.now()/1000;
    const wig=Math.sin(t*6+rad)*0.28;
    ctx.save();
    ctx.globalAlpha=alpha==null?1:alpha;
    /* 水底投影 */
    ctx.beginPath(); ctx.ellipse(p.sx,p.sy+rr*0.5,rr*0.9,rr*0.35,0,0,7);
    ctx.fillStyle='rgba(0,20,35,.35)'; ctx.filter='blur(4px)'; ctx.fill(); ctx.filter='none';

    ctx.translate(p.sx,p.sy);
    ctx.scale(facing<0?-1:1,1);
    const body=isMe?'#38bdf8':('hsl('+hue+',72%,58%)');
    const dark=isMe?'#0284c7':('hsl('+hue+',72%,38%)');
    /* 尾鰭 */
    ctx.beginPath();
    ctx.moveTo(-rr*0.8,0);
    ctx.lineTo(-rr*1.5, -rr*0.55+wig*rr*0.4);
    ctx.lineTo(-rr*1.5,  rr*0.55+wig*rr*0.4);
    ctx.closePath();
    ctx.fillStyle=dark; ctx.fill();
    /* 身體（徑向漸變做立體）*/
    const bg=ctx.createRadialGradient(-rr*0.2,-rr*0.35,rr*0.1,0,0,rr*1.05);
    bg.addColorStop(0,'#e0f2fe'); bg.addColorStop(.35,body); bg.addColorStop(1,dark);
    ctx.beginPath(); ctx.ellipse(0,0,rr,rr*0.68,0,0,7);
    ctx.fillStyle=bg; ctx.fill();
    /* 背鰭 */
    ctx.beginPath();
    ctx.moveTo(-rr*0.15,-rr*0.6);
    ctx.quadraticCurveTo(rr*0.15,-rr*1.15,rr*0.45,-rr*0.45);
    ctx.closePath(); ctx.fillStyle=dark; ctx.fill();
    /* 眼 */
    ctx.beginPath(); ctx.arc(rr*0.45,-rr*0.16,rr*0.17,0,7); ctx.fillStyle='#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(rr*0.5,-rr*0.16,rr*0.085,0,7); ctx.fillStyle='#0b1220'; ctx.fill();
    /* 光澤 */
    ctx.beginPath(); ctx.ellipse(-rr*0.1,-rr*0.35,rr*0.42,rr*0.16,-0.35,0,7);
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fill();
    ctx.restore();

    if(label){
      ctx.globalAlpha=alpha==null?1:alpha;
      ctx.font='600 '+Math.max(9,s*11)+'px Inter,sans-serif'; ctx.textAlign='center';
      ctx.fillStyle=isMe?'rgba(186,230,253,.95)':'rgba(255,255,255,.75)';
      ctx.fillText(label,p.sx,p.sy-rr-7);
      ctx.globalAlpha=1;
    }
  }

  function step(dt){
    const acc=1250;
    meP.vx+=keys.x*acc*dt; meP.vy+=keys.y*acc*dt;
    const fr=Math.pow(0.0025,dt); meP.vx*=fr; meP.vy*=fr;
    meP.x+=meP.vx*dt; meP.y+=meP.vy*dt;
    if(Math.abs(keys.x)>0.1) meP.facing=keys.x>0?1:-1;
    else if(Math.abs(meP.vx)>8) meP.facing=meP.vx>0?1:-1;

    /* 邊界（圓）*/
    const d=Math.hypot(meP.x,meP.y);
    if(d>R-meP.r*0.5 && d>0.01){
      const nx=meP.x/d, ny=meP.y/d;
      meP.x=nx*(R-meP.r*0.5); meP.y=ny*(R-meP.r*0.5);
      const vn=meP.vx*nx+meP.vy*ny;
      if(vn>0){ meP.vx-=nx*vn; meP.vy-=ny*vn; }
      meP.vx*=0.85; meP.vy*=0.85;
    }

    /* 小魚游動 */
    fishes.forEach(f=>{
      f.x+=f.vx*dt; f.y+=f.vy*dt;
      const fd=Math.hypot(f.x,f.y);
      if(fd>R*0.94){ f.vx*=-1; f.vy*=-1; f.x*=0.95; f.y*=0.95; }
      /* 被玩家追著跑（小魚會逃）*/
      const dx=f.x-meP.x, dy=f.y-meP.y, dd=Math.hypot(dx,dy);
      if(dd<70&&dd>0.1){ f.vx+=dx/dd*26*dt*10; f.vy+=dy/dd*26*dt*10; }
      /* 吃 */
      if(dd < meP.r*0.95){
        f.dead=true;
        meP.r=Math.min(46, meP.r+f.r*0.09);
        myScore++;
        eating=0.22;
        for(let i=0;i<3;i++) bubbles.push({x:f.x,y:f.y,vx:(Math.random()-.5)*30,vy:-30-Math.random()*20,r:1.5+Math.random()*2.5,t:1});
      }
    });
    fishes=fishes.filter(f=>!f.dead);
    while(fishes.length<34) fishes.push(spawnFish());

    /* 玩家互吃：大過對方 15% 就食得 */
    for(const u in others){
      const o=others[u];
      if(!o||typeof o.x!=='number') continue;
      if(Date.now()-(o.at||0)>8000) continue;
      const rr=o.r||12;
      const dd=Math.hypot(meP.x-o.x,meP.y-o.y);
      if(dd < (meP.r+rr)*0.55 && meP.r > rr*1.15 && eating<=0){
        meP.r=Math.min(46,meP.r+rr*0.22); myScore+=3; eating=0.5; shake=6;
        for(let i=0;i<6;i++) bubbles.push({x:o.x,y:o.y,vx:(Math.random()-.5)*40,vy:-40-Math.random()*30,r:2+Math.random()*3,t:1});
      }
    }

    /* 氣泡 */
    bubbles.forEach(b=>{ b.x+=b.vx*dt; b.y+=b.vy*dt; b.t-=dt*0.9; });
    bubbles=bubbles.filter(b=>b.t>0);
    if(eating>0) eating-=dt;
    if(shake>0) shake-=dt*30;

    if(liveRef&&running){
      const now=Date.now();
      if(now-lastPush>60){
        lastPush=now;
        try{ set(liveRef,{x:Math.round(meP.x),y:Math.round(meP.y),r:Math.round(meP.r*10)/10,
          name:me.displayName||me.username,color:safeColor(me.color,'#22c55e'),score:myScore,at:now}); }catch(e){}
      }
    }
  }

  function draw(){
    if(!ctx) return;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.save();
    if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
    drawWater();
    drawBounds();

    /* 小魚（按大小排，小的先畫）*/
    [...fishes].sort((a,b)=>a.r-b.r).forEach(f=>drawFish(f.x,f.y,f.r,f.hue,false,1,null,null));

    /* 其他玩家 */
    for(const u in others){
      const o=others[u];
      if(!o||typeof o.x!=='number') continue;
      if(Date.now()-(o.at||0)>8000) continue;
      drawFish(o.x,o.y,o.r||12,200,false,1,o.name,0.9);
    }
    /* 自己 */
    drawFish(meP.x,meP.y,meP.r,200,true,meP.facing,me.displayName||me.username,1);

    /* 氣泡 */
    bubbles.forEach(b=>{
      const p=w2s(b.x,b.y), s=p.s;
      ctx.beginPath(); ctx.arc(p.sx,p.sy,b.r*s,0,7);
      ctx.strokeStyle='rgba(186,230,253,'+(b.t*0.5)+')'; ctx.lineWidth=1.2; ctx.stroke();
    });
    ctx.restore();

    /* HUD */
    ctx.font='700 15px Inter,sans-serif'; ctx.textAlign='left';
    ctx.fillStyle='rgba(224,242,254,.92)';
    ctx.fillText('🐟 '+myScore+'　大小 '+Math.round(meP.r), 16, 28);
  }

  function loop(t){
    if(!running) return;
    const dt=Math.min(0.05,(t-lastT)/1000||0.016); lastT=t;
    try{ step(dt); draw(); }catch(e){ console.error('fish',e); }
    raf=requestAnimationFrame(loop);
  }

  function bindInput(){
    const setK=(x,y)=>{keys.x=x;keys.y=y;};
    const onKey=e=>{
      const k=e.key;
      if(k==='ArrowLeft'||k==='a'||k==='A')setK(-1,0);
      else if(k==='ArrowRight'||k==='d'||k==='D')setK(1,0);
      else if(k==='ArrowUp'||k==='w'||k==='W')setK(0,-1);
      else if(k==='ArrowDown'||k==='s'||k==='S')setK(0,1);
      else return;
      e.preventDefault();
    };
    const onUp=()=>setK(0,0);
    window.addEventListener('keydown',onKey); window.addEventListener('keyup',onUp);
    let tid=null,ox=0,oy=0;
    cv.addEventListener('touchstart',e=>{const t0=e.changedTouches[0];tid=t0.identifier;ox=t0.clientX;oy=t0.clientY;e.preventDefault();},{passive:false});
    cv.addEventListener('touchmove',e=>{for(const t0 of e.changedTouches){if(t0.identifier!==tid)continue;const dx=t0.clientX-ox,dy=t0.clientY-oy;const m=Math.hypot(dx,dy)||1;setK(dx/m,dy/m);}e.preventDefault();},{passive:false});
    cv.addEventListener('touchend',e=>{for(const t0 of e.changedTouches){if(t0.identifier===tid){tid=null;setK(0,0);}}});
    return ()=>{window.removeEventListener('keydown',onKey);window.removeEventListener('keyup',onUp);};
  }

  return {
    mounted:false,
    async start(){
      if(!me) return;
      meP={x:0,y:0,vx:0,vy:0,r:12,facing:1};
      fishes=[]; for(let i=0;i<34;i++) fishes.push(spawnFish());
      liveRef=ref(db,'lobbyLive/fish/'+me.username);
      try{ onDisconnect(liveRef).remove(); }catch(e){}
      try{
        unsubLive=onValue(ref(db,'lobbyLive/fish'),snap=>{
          const v=snap.val()||{}; const o={};
          for(const k in v){ if(k!==me.username) o[k]=v[k]; }
          others=o;
        });
      }catch(e){}
      running=true; lastT=performance.now(); this.mounted=true;
      raf=requestAnimationFrame(loop);
    },
    async stop(){
      running=false;
      if(raf) cancelAnimationFrame(raf);
      if(unbind){unbind();unbind=null;}
      try{ if(unsubLive) unsubLive(); }catch(e){}
      try{ if(liveRef) await remove(liveRef); }catch(e){}
      this.mounted=false;
    },
    mount(canvas){
      cv=canvas; ctx=cv.getContext('2d');
      dpr=Math.min(2,window.devicePixelRatio||1);
      const fit=()=>{const r=cv.getBoundingClientRect();cw=r.width||360;ch=r.height||420;
        cv.width=cw*dpr;cv.height=ch*dpr;cv.style.width=cw+'px';cv.style.height=ch+'px';};
      fit(); window.addEventListener('resize',fit);
      unbind=bindInput();
      const host=cv.parentElement;
      if(host){ const kill=mountDPad(host,(x,y)=>{keys.x=x;keys.y=y;}); const oldUn=unbind;
        unbind=()=>{try{kill();}catch(e){} oldUn();}; }
      draw();
    },
    tickHud(){
      const el=document.getElementById('stCard');
      if(el) el.innerHTML='<div style="font-size:11px;color:var(--text-sub)">吃到</div>'
        +'<div style="font-size:22px;font-weight:800">'+myScore+'</div>';
    },
    debug(){ return {x:meP.x,y:meP.y,r:meP.r,score:myScore,fishes:fishes.length,others:Object.keys(others||{})}; },
    probe(x,y){ return Math.hypot(x,y)<=R; }
  };
}
