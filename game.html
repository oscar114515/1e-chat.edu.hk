<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小遊戲 · 班級聊天室</title>
<style>
:root{
  --r-0:4px;--r-1:8px;--r-2:12px;--r-3:16px;--dur-1:120ms;--dur-2:200ms;--dur-3:280ms;--dur-4:480ms;--ease-out:cubic-bezier(.22,1,.36,1);--ease-inout:cubic-bezier(.4,0,.2,1);--warn-tx:#fca5a5;--ok-tx:#4ade80;--danger:#f87171;--pink-tx:#f472b6;--purple-tx:#a78bfa;--orange-tx:#fdba74;--white-warm:#fff9ec;
  --bg:#0b0d14;--bg-card:#151926;--bg-input:#1c2130;--border:#262c3d;--border-strong:#333b52;
  --text-main:#f2f4f9;--text-sub:#9aa2ba;--accent:#38bdf8;--accent2:#8b5cf6;--gold:#fbbf24;
  --red:#ef4444;--green:#22c55e;--blue:#3b82f6;--yellow:#eab308;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--text-main);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.5;overscroll-behavior:none}
#app{min-height:100%;display:flex;flex-direction:column}
.hidden{display:none!important}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(11,13,20,.92);backdrop-filter:blur(12px);z-index:20}
.topbar h1{font-size:17px;margin:0;font-weight:700;flex:1}
.back-btn{background:var(--bg-card);border:1px solid var(--border-strong);color:var(--text-main);width:36px;height:36px;border-radius:var(--r-2);font-size:17px;cursor:pointer}
.back-btn:active{transform:scale(.94)}
.wrap{padding:16px;flex:1;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gcard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-3);padding:14px;cursor:pointer;transition:transform var(--dur-1),border-color var(--dur-1);position:relative;overflow:hidden}
.gcard:active{transform:scale(.97)}
.gcard.on{border-color:var(--accent)}
.gcard.off{opacity:.5}
.gcard .gname{font-size:16px;font-weight:700;margin-bottom:4px}
.gcard .gmeta{font-size:12px;color:var(--text-sub)}
.gcard .gtag{position:absolute;top:10px;right:10px;font-size:10px;padding:2px 7px;border-radius:var(--r-1);background:rgba(56,189,248,.18);color:var(--accent)}
.gcard .gtag.soon{background:rgba(154,162,186,.15);color:var(--text-sub)}
.gicon{width:40px;height:40px;border-radius:var(--r-2);margin-bottom:9px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#0b0d14}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:60}
.sheet .inner{background:var(--bg-card);width:100%;border-radius:var(--r-3) var(--r-3) 0 0;padding:18px;max-height:88vh;overflow-y:auto;animation:up .25s cubic-bezier(.4,0,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 6px;font-size:17px}
.sheet .desc{font-size:13px;color:var(--text-sub);margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--border)}
.row .lbl{font-size:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--bg-input);border:1px solid var(--border-strong);color:var(--text-main);border-radius:var(--r-1);padding:7px 12px;font-size:14px;cursor:pointer;min-width:40px}
.seg button.sel{background:var(--accent);border-color:var(--accent);color:#0b0d14;font-weight:700}
.btn{display:block;width:100%;border:none;border-radius:var(--r-2);padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px;background:var(--accent);color:#0b0d14}
.btn.ghost{background:var(--bg-input);color:var(--text-main);border:1px solid var(--border-strong)}
.btn.danger{background:var(--red);color:#fff}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none}
.plist{display:flex;flex-direction:column;gap:9px;margin:10px 0}
.pitem{display:flex;align-items:center;gap:11px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-2);padding:10px 12px}
.pav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden}
.pav img{width:100%;height:100%;object-fit:cover}
.pname{flex:1;font-size:14px}
.pbadge{font-size:11px;color:var(--text-sub);border:1px solid var(--border-strong);border-radius:var(--r-1);padding:2px 7px}
.countdown{text-align:center;font-size:44px;font-weight:800;color:var(--gold);margin:16px 0 4px;font-variant-numeric:tabular-nums}
.hint{text-align:center;font-size:13px;color:var(--text-sub);margin-bottom:10px}
.board-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0}
canvas{background:#0f1320;border-radius:var(--r-2);border:1px solid var(--border);touch-action:none;-webkit-user-select:none;user-select:none}
.side{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.turnbar{text-align:center;font-size:15px;font-weight:700;padding:10px;border-radius:var(--r-2);background:var(--bg-card);border:1px solid var(--border)}
.turnbar.mine{background:rgba(56,189,248,.14);border-color:var(--accent);color:var(--accent)}

/* 傳炸彈 */
.inputrow{display:flex;gap:9px;margin:12px 0 6px}
.inputrow input{flex:1;min-width:0;background:var(--bg-input);border:1px solid var(--border-strong);border-radius:var(--r-2);color:var(--text-main);font-size:16px;padding:11px 13px;font-family:inherit;touch-action:manipulation}
.inputrow input:focus{outline:none;border-color:var(--accent)}
.inputrow .btn{width:auto;flex:none;padding:0 20px;margin:0}
.bombcat{text-align:center;font-size:34px;font-weight:800;color:var(--gold);margin:6px 0 10px;word-break:break-all;letter-spacing:1px}
.bombgauge{height:12px;border-radius:var(--r-1);background:var(--bg-input);border:1px solid var(--border-strong);overflow:hidden;margin:0 0 6px}
.bombbar{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));transition:width var(--dur-1) linear}
.bombgauge.danger .bombbar{background:linear-gradient(90deg,#f97316,var(--red))}
.bombgauge.danger{animation:bombPulse .5s infinite alternate}
@keyframes bombPulse{from{box-shadow:0 0 0 rgba(239,68,68,0)}to{box-shadow:0 0 14px rgba(239,68,68,.55)}}

/* 劇本殺 */
.smcase,.smcard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-2);padding:13px 14px;margin:10px 0}
.smcard{border-color:var(--accent)}
.smtag{font-size:11px;letter-spacing:2px;color:var(--text-sub)}
.smname{font-size:19px;font-weight:800;margin:3px 0 6px}
.smline{font-size:13px;color:var(--text-main);opacity:.9}
.smsecret{font-size:13px;color:var(--gold);margin-top:8px;border-top:1px dashed var(--border-strong);padding-top:8px}
.smculprit{font-size:13px;font-weight:700;color:var(--red);margin-top:8px}

/* 康樂棋 */
.klboard{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.klcell{position:relative;aspect-ratio:1;border-radius:var(--r-1);background:var(--bg-card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden}
.klcell .klnum{position:absolute;top:2px;left:5px;font-size:10px;color:var(--text-sub);opacity:.8}
.klnum{font-variant-numeric:tabular-nums}
.klcell .klsp{font-size:11px;font-weight:800;color:var(--text-main)}
.klcell.klup{background:rgba(34,197,94,.16);border-color:rgba(34,197,94,.55)}
.klcell.klup .klsp{color:var(--green)}
.klcell.kldown{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.55)}
.klcell.kldown .klsp{color:var(--red)}
.klcell.klstart{border-color:var(--accent);background:rgba(56,189,248,.13)}
.klcell.klend{border-color:var(--gold);background:rgba(251,191,36,.15)}
.kltok{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:2px;flex-wrap:wrap}
.kltok i{width:9px;height:9px;border-radius:50%;border:1px solid rgba(255,255,255,.55)}

/* 鬥獸棋 */
.dsboard{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:10px auto;max-width:420px;aspect-ratio:7/9}
.dscell{position:relative;border-radius:var(--r-1);background:#171b28;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer}
.dscell.dswater{background:rgba(37,99,235,.28);border-color:rgba(59,130,246,.5)}
.dscell.dsden0{background:rgba(56,189,248,.2);border-color:rgba(56,189,248,.75)}
.dscell.dsden1{background:rgba(244,63,94,.2);border-color:rgba(244,63,94,.75)}
.dscell.dstrap0{background:rgba(56,189,248,.34);border-color:rgba(56,189,248,.9)}
.dscell.dstrap1{background:rgba(244,63,94,.34);border-color:rgba(244,63,94,.9)}
.dscell.dssel{outline:3px solid var(--gold);outline-offset:-3px}
.dscell.dsmove::after{content:'';position:absolute;inset:0;border:2px dashed var(--gold);border-radius:var(--r-1);opacity:.85}
.dsg{width:80%;height:80%;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;background:#0f1320}

/* 中國象棋 */
.xqboard{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;margin:10px auto;max-width:420px;aspect-ratio:9/10;
  background:#1b2233;border:1px solid var(--border-strong);border-radius:var(--r-1);padding:3px}
.xqcell{position:relative;display:flex;align-items:center;justify-content:center;border-radius:var(--r-0);background:rgba(255,255,255,.03);cursor:pointer}
.xqcell.xqsel{background:rgba(251,191,36,.20);outline:2px solid var(--gold);outline-offset:-2px}
.xqcell.xqmove::after{content:'';position:absolute;inset:14%;border:2px dashed var(--gold);border-radius:50%;opacity:.8}
.xqg{width:86%;height:86%;border-radius:50%;border:1.5px solid;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;background:#0d1120}

/* 誰是臥底：聊天式的描述紀錄 */
.ucfeed{display:flex;flex-direction:column;gap:9px;max-height:38vh;min-height:110px;overflow-y:auto;
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-2);padding:11px;margin:10px 0;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ucmsg{display:flex;gap:9px;align-items:flex-start}
.ucmsg .pav{width:30px;height:30px;flex:none;font-size:11px}
.ucbody{flex:1;min-width:0}
.ucmeta{font-size:10.5px;color:var(--text-sub);margin-bottom:2px}
.uctext{font-size:13.5px;line-height:1.45;word-break:break-word;background:var(--bg-input);
  border:1px solid var(--border-strong);border-radius:var(--r-1);padding:7px 10px}

/* 投票結果彈框 */
.ucmodal{position:fixed;inset:0;background:rgba(5,7,12,.72);display:flex;align-items:center;justify-content:center;
  z-index:120;padding:20px;animation:ucFade .18s ease}
@keyframes ucFade{from{opacity:0}to{opacity:1}}
.ucmodal-card{background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--r-3);padding:18px 16px;
  width:100%;max-width:400px;max-height:82vh;overflow-y:auto;animation:ucPop .2s ease}
@keyframes ucPop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
.ucmodal-card h3{margin:0;font-size:17px;text-align:center}

/* 大富翁 */
.mpboard{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:3px;margin:10px auto;
  max-width:430px;aspect-ratio:1}
.mpcell{position:relative;border-radius:var(--r-1);background:#171b28;border:2px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:1px}
.mpcell .mpnum{position:absolute;top:1px;left:3px;font-size:8px;color:var(--text-sub);opacity:.75}
.mpcell .mpname{font-size:9px;font-weight:700;line-height:1.05;text-align:center;word-break:keep-all}
.mpcell .mpprice{font-size:8px;color:var(--gold)}
.mpcell .mpowner{font-size:8px;font-weight:700}
.mpcell .mptok{position:absolute;bottom:1px;left:0;right:0;display:flex;justify-content:center;gap:1px;flex-wrap:wrap}
.mpcell .mptok i{width:7px;height:7px;border-radius:50%;border:1px solid rgba(255,255,255,.6)}
.mpcell.mpgo{background:rgba(56,189,248,.16);border-color:rgba(56,189,248,.55)}
.mpcell.mpchance{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.5)}
.mpcell.mptax{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.5)}
.mpcell.mpjail{background:rgba(148,163,184,.16);border-color:rgba(148,163,184,.5)}
.mpcell.mppark{background:rgba(34,197,94,.13);border-color:rgba(34,197,94,.45)}
.mpcell.mppending{animation:bombPulse .5s infinite alternate}
.mpcenter{grid-row:2/8;grid-column:2/8;border-radius:var(--r-2);background:rgba(13,17,32,.72);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;text-align:center}
.mpcenter .mptitle{font-size:15px;font-weight:800;letter-spacing:3px;color:var(--text-sub)}
.mpcenter .btn{width:auto;padding:9px 18px;margin:0}
.mpcenter .inputrow{margin:0}
.dice{width:64px;height:64px;border-radius:var(--r-2);background:linear-gradient(145deg,#232838,#151926);border:1px solid var(--border-strong);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:11px;gap:3px;cursor:pointer}
.dice:active{transform:scale(.94)}
.dice.rolling{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.pip{border-radius:50%;background:#3a4260}
.pip.on{background:#fff}
.cards{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.uno{width:52px;height:78px;border-radius:var(--r-1);border:2px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.uno.playable{outline:3px solid var(--gold);outline-offset:2px}
.uno.r{background:#dc2626}.uno.g{background:#16a34a}.uno.b{background:#2563eb}.uno.y{background:#ca8a04}.uno.w{background:#1f2937}
.uno.sm{width:34px;height:52px;font-size:14px;cursor:default}
.deck-row{display:flex;gap:12px;align-items:center;justify-content:center}
.notice{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,24,36,.96);border:1px solid var(--border-strong);border-radius:var(--r-2);padding:18px 24px;font-size:15px;z-index:99;text-align:center;max-width:80vw;pointer-events:none}
.empty{text-align:center;color:var(--text-sub);padding:50px 20px;font-size:14px}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:var(--r-1);background:var(--bg-input);border:1px solid var(--border-strong);margin:2px}
.stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stat{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-2);padding:9px 13px;font-size:13px}
.stat b{color:var(--accent)}

/* ═══════════════ v1.32 統一外觀 ═══════════════
   深藍漸層面板 + 金色描邊 + 木色棋盤（跟那套 UI 同一個語言）。
   只在最後覆蓋，不動任何遊戲邏輯，所以不會改壞玩法。 */
:root{--gold2:#e2b04a;--panel1:#1a1a2e;--panel2:#16213e;--panel3:#0f3460;
  --wood1:#8a5a32;--wood2:#d29a55;--wood3:#633b21;--woodLine:#6b4f2a}

/* 面板與標題 */
.wrap{background:linear-gradient(135deg,var(--panel1),var(--panel2) 55%,var(--panel3));
  border:1px solid rgba(226,176,74,.28);border-radius:var(--r-3);box-shadow:0 10px 34px rgba(0,0,0,.5);
  padding:16px;margin:10px 12px 18px}
.topbar h1{color:var(--gold2);text-shadow:0 0 14px rgba(226,176,74,.45);letter-spacing:.5px}
.turnbar{background:rgba(226,176,74,.10);border:1px solid rgba(226,176,74,.55);color:var(--gold2);
  border-radius:var(--r-2);font-weight:800}
.turnbar.mine{background:rgba(226,176,74,.22);border-color:var(--gold2);color:var(--white-warm);
  box-shadow:0 0 18px rgba(226,176,74,.35)}
.hint{color:var(--text-sub)}
.countdown{color:var(--gold2);text-shadow:0 0 16px rgba(226,176,74,.5);font-weight:900}

/* 玩家卡片：統一成同一種玻璃卡 */
.pitem{background:rgba(255,255,255,.055);border:1px solid rgba(226,176,74,.22);border-radius:var(--r-2)}
.pname{color:var(--text-main)}
.pbadge{border-color:rgba(226,176,74,.45);color:var(--gold2);background:rgba(226,176,74,.08)}
.pav{box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}

/* 木色棋盤容器：所有棋盤類共用 */
.klboard,.mpboard,.dsboard,.bx,.xqboard{
  background:linear-gradient(135deg,var(--wood1),var(--wood2) 45%,var(--wood3));
  border:3px solid #4e2f16;border-radius:var(--r-3);box-shadow:inset 0 0 22px rgba(0,0,0,.45),0 8px 22px rgba(0,0,0,.45);
  padding:9px}
.klboard,.dsboard{gap:4px}
.mpboard{gap:3px}

/* 格子：透明底 + 金色描邊（讓木紋透出來） */
.klcell,.mpcell,.xqg,.dsboard>*{background:rgba(255,255,255,.10)!important;
  border:1px solid rgba(226,176,74,.55)!important;border-radius:var(--r-1)}
.klcell .klsp,.mpcell .mpname,.dsg,.xqg{color:var(--white-warm)}
.klcell .klnum,.mpcell .mpnum,.mpcell .mpprice{color:rgba(255,255,255,.75)}

/* 特殊格保留語意色，但改成半透明疊在木紋上 */
.klcell.klup{background:rgba(34,197,94,.30)!important;border-color:rgba(34,197,94,.85)!important}
.klcell.kldown{background:rgba(239,68,68,.30)!important;border-color:rgba(239,68,68,.85)!important}
.klcell.klstart{background:rgba(56,189,248,.28)!important;border-color:rgba(56,189,248,.85)!important}
.klcell.klend{background:rgba(226,176,74,.32)!important;border-color:var(--gold2)!important}
.mpcell.mpgo{background:rgba(56,189,248,.30)!important;border-color:rgba(56,189,248,.85)!important}
.mpcell.mpchance{background:rgba(226,176,74,.28)!important;border-color:rgba(226,176,74,.85)!important}
.mpcell.mptax{background:rgba(239,68,68,.28)!important;border-color:rgba(239,68,68,.85)!important}
.mpcell.mpjail,.mpcell.mppark{background:rgba(255,255,255,.18)!important}

/* canvas 類棋盤（飛行棋／國際象棋／圍棋）：加木框與圓角 */
canvas#cv{background:linear-gradient(135deg,var(--wood1),var(--wood2) 45%,var(--wood3));border:3px solid #4e2f16;border-radius:var(--r-3);
  box-shadow:inset 0 0 22px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.45);max-width:100%}

/* 骰子、籌碼、卡片 */
.dice{background:rgba(255,255,255,.10);border:2px solid var(--gold2);border-radius:var(--r-2);
  color:var(--gold2);box-shadow:0 0 16px rgba(226,176,74,.3)}
.chip,.cards>div,.deck-row>div{border-color:rgba(226,176,74,.5)!important}
.klsp{color:var(--white-warm)}
.kltok i,.mptok i{box-shadow:0 0 0 1px rgba(0,0,0,.45)}

/* 炸彈／你畫我猜／劇本殺 的區塊也統一 */
.bombgauge{background:rgba(0,0,0,.35);border-color:rgba(226,176,74,.45)}
.bombcat{color:var(--gold2)}

/* ═══ v1.33 桌遊棋盤：照 UI 規範修 ═══ */
/* 康樂棋：圓形跑道（52 格繞圓周） */
.klring{position:relative;width:100%;max-width:430px;aspect-ratio:1;margin:12px auto;border-radius:50%;
  background:radial-gradient(circle,#0f3460 0 26%,rgba(226,176,74,.20) 27% 56%,rgba(233,69,96,.14) 57% 100%);
  border:12px solid var(--gold2);box-shadow:inset 0 0 34px rgba(0,0,0,.75),0 10px 30px rgba(0,0,0,.5)}

const UI_CARD_BG='#151926';

    me={username:uname,displayName:u.displayName||uname,color:safeColor(u.color,'#3b82f6'),avatar:u.avatar||'',role:u.role||'student',cls:u.cls||'',seat:u.seat||''};
  }catch(e){ renderNoUser(); return; }
  await loadStats();
  const rid=params.get('room');
  if(rid){ cameFromInvite=true; joinRoom(rid); return; }
  view='lobby'; render();
  // v1.24 網址引導：?game=<遊戲代號> → 直接打開那一款遊戲的開房面板
  const gk=(params.get('game')||'').trim().toLowerCase();
  if(gk){
    const gd=gameDef(gk);
    if(GAMES.some(x=>x.k===gk)){
      setTimeout(()=>{
        if(gd.ok) openCreate(gk);
        else showNotice('「'+gd.n+'」即將推出，敬請期待');
      },250);
    } else showNotice('找不到這款遊戲：'+gk);
  }
}
function renderNoUser(){
  appEl.innerHTML=`<div class="topbar"><h1>小遊戲</h1></div><div class="empty">請先登入班級聊天室，再從「＋」進入小遊戲</div>`;
}
async function loadStats(){
  try{
    const s=await get(ref(db,'users/'+me.username+'/gameStats'));
    myStats=s.exists()?s.val():{};
  }catch(e){ myStats={}; }
}

/* ===== 大廳 ===== */
function render(){
  if(view!=='room'){
    const m=document.getElementById('ucModal'); if(m) m.remove();
    const w=document.getElementById('wwModal'); if(w) w.remove();
    if(wwDawnTimer){clearTimeout(wwDawnTimer);wwDawnTimer=null;}
  }
  if(view==='lobby') return renderLobby();
  if(view==='room') return renderRoom();
}
function renderLobby(){

    const rng=g.min===g.max?`${g.min} 人`:`${g.min}–${g.max} 人`;

    return `<div class="gcard ${g.ok?'on':'off'}" data-g="${g.k}">${tag}

function closeSelf(){
  // 先確實把自己從房間移除（連帶處理倒數），再通知外層關閉
  (async()=>{
    try{ await leaveRoom(); }catch(e){}
    try{ if(window.parent&&window.parent!==window){window.parent.postMessage({type:'closeGames'},'*');} else { history.back(); } }catch(e){ history.back(); }
  })();
}

/* ===== 建房 ===== */
let pick={g:null,p:2,spec:true,level:'normal'};
/* ===== v1.31 點遊戲 → 先看現在有幾間房（房主、幾人／幾人），下面才是開房 ===== */
let roomsWatch=null;
function closeRoomsSheet(sheet){
  try{ if(roomsWatch){roomsWatch();roomsWatch=null;} }catch(e){}
  if(sheet&&sheet.remove)sheet.remove();
}
function openGameRooms(gk){
  const g=gameDef(gk);
  if(!g.ok){ showNotice('「'+g.n+'」即將推出，敬請期待'); return; }
  const sheet=document.createElement('div');sheet.className='sheet';
  sheet.innerHTML=`<div class="inner">
    <h3>${escapeHtml(g.n)}</h3>
    <div class="desc" id="roomListHead">正在看現在有幾間房…</div>
    <div id="roomList" style="max-height:44vh;overflow-y:auto;margin-bottom:6px"></div>
    <button class="btn" id="goCreate">建立自己的房間</button>
    <button class="btn ghost" id="closeRooms">取消</button>
  </div>`;
  document.body.appendChild(sheet);
  const listEl=sheet.querySelector('#roomList'), headEl=sheet.querySelector('#roomListHead');
  const paint=all=>{
    const now=Date.now();
    const rows=Object.entries(all||{})
      .filter(([id,r])=>{
        if(!r||r.game!==gk||r.status==='ended')return false;
        if(Object.keys(r.players||{}).length===0)return false;          // 空房（房主退出後留下的）不要顯示
        if(now-(r.createdAt||now)>6*3600*1000)return false;             // 超過 6 小時的舊房也不要
        return true;
      })
      .sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
    if(!rows.length){
      headEl.textContent='現在還沒有人開「'+g.n+'」';
      listEl.innerHTML='<div class="empty" style="padding:14px">你可以開第一間</div>';
      return;
    }
    headEl.textContent='現在有 '+rows.length+' 間房在等：';
    listEl.innerHTML=rows.map(([id,r])=>{
      const pc=Object.keys(r.players||{}).length;
      const cap=r.setMax||r.maxP||r.minP||2;
      const full=pc>=cap;
      const playing=r.status==='playing';
      const canSpec=playing&&r.allowSpectate!==false;
      const canJoin=!playing&&!full;
      const ok=canJoin||canSpec;
      const action=playing?(canSpec?'觀戰':'已開始'):(full?'已滿':'加入');
      const state=playing?'進行中':(r.status==='countdown'?'倒數中':'等待中');
      const host=r.host||'';
      const hcolor=(r.players&&r.players[host]&&r.players[host].color)||'#3b82f6';
      return `<div class="pitem" style="margin-bottom:7px">
        <div class="pav" style="${pavStyle(safeColor(hcolor))}">${avatarHTML({displayName:r.hostName||host})}</div>
        <div class="pname" style="flex:1">${escapeHtml(r.hostName||host)} 的房間
          <div class="hint" style="margin:2px 0 0;text-align:left">${pc}/${cap} 人 · ${state}${r.allowSpectate===false?' · 不可觀戰':''}</div>
        </div>
        <div class="pbadge" data-join="${escAttr(id)}" style="cursor:${ok?'pointer':'default'};${ok?'':'opacity:.45'}">${action}</div>
      </div>`;
    }).join('');
  };
  try{ if(roomsWatch)roomsWatch(); }catch(e){}
  roomsWatch=onValue(ref(db,'games'),snap=>paint(snap.val()));
  sheet.onclick=e=>{
    if(e.target===sheet){ closeRoomsSheet(sheet); return; }
    const j=e.target.closest('[data-join]');
    if(j&&j.style.opacity!=='0.45'){
      const id=j.dataset.join;
      closeRoomsSheet(sheet);
      cameFromInvite=false;   // 自己從清單找的房間 → 退出回大廳
      joinRoom(id);
    }
  };
  sheet.querySelector('#closeRooms').onclick=()=>closeRoomsSheet(sheet);
  sheet.querySelector('#goCreate').onclick=()=>{ closeRoomsSheet(sheet); openCreate(gk); };
}

function openCreate(gk){
  const g=gameDef(gk);
  if(!g.ok){ showNotice('「'+g.n+'」即將推出，敬請期待'); return; }
  pick={g:gk,p:g.min,spec:true,level:'normal'};
  const cnt=[];for(let i=g.min;i<=g.max;i++)cnt.push(i);
  const needTopic=!!GAMES_NEED_TOPIC[gk];
  const lvRow=needTopic?`<div class="row"><div class="lbl">題目難度<br><span style="font-size:11px;color:var(--text-sub)">由 AI 即時出題</span></div><div class="seg" id="segL">${TOPIC_LEVELS.map(l=>`<button data-l="${l.k}" class="${l.k==='normal'?'sel':''}">${l.n}</button>`).join('')}</div></div>`:'';
  const inner=`<h3>開房：${escapeHtml(g.n)}</h3><div class="desc">設定人數與觀戰後，邀請會發到聊天室${needTopic?'；題目由 AI 即時生成，每次都不一樣':''}</div>
    <div class="row"><div class="lbl">玩家人數</div><div class="seg" id="segP">${cnt.map(i=>`<button data-p="${i}" class="${i===pick.p?'sel':''}">${i}</button>`).join('')}</div></div>
    ${lvRow}
    <div class="row"><div class="lbl">允許觀戰</div><div class="seg" id="segS"><button data-s="1" class="sel">允許</button><button data-s="0">不允許</button></div></div>
    <button class="btn" id="doCreate">發出邀請並開房</button>
    <button class="btn ghost" id="cancelCreate">取消</button>`;
  const sheet=document.createElement('div');sheet.className='sheet';sheet.innerHTML=`<div class="inner">${inner}</div>`;
  document.body.appendChild(sheet);
  sheet.onclick=e=>{if(e.target===sheet)sheet.remove();};
  sheet.querySelector('#segP').onclick=e=>{const b=e.target.closest('button');if(!b)return;pick.p=+b.dataset.p;sheet.querySelectorAll('#segP button').forEach(x=>x.classList.toggle('sel',x===b));};
  sheet.querySelector('#segS').onclick=e=>{const b=e.target.closest('button');if(!b)return;pick.spec=b.dataset.s==='1';sheet.querySelectorAll('#segS button').forEach(x=>x.classList.toggle('sel',x===b));};
  const segL=sheet.querySelector('#segL');
  if(segL) segL.onclick=e=>{const b=e.target.closest('button');if(!b)return;pick.level=b.dataset.l;sheet.querySelectorAll('#segL button').forEach(x=>x.classList.toggle('sel',x===b));};
  sheet.querySelector('#doCreate').onclick=()=>{sheet.remove();doCreate();};
  sheet.querySelector('#cancelCreate').onclick=()=>sheet.remove();
}

async function nextMsgId(){
  const res=await runTransaction(ref(db,'meta/msgCounter'),c=>(Number(c)||0)+1);
  const seq=res.snapshot.val();return 'msg_'+String(seq).padStart(4,'0');
}
async function doCreate(){
  const g=gameDef(pick.g);
  const rid=push(ref(db,'games')).key;
  const now=Date.now();
  // 先建房、發邀請（不卡 AI 出題）；題目由 ensureTopic 在後台生成
  const room={game:g.k,gameName:g.n,host:me.username,hostName:me.displayName,
    minP:pick.p,maxP:g.max,setMax:pick.p,allowSpectate:pick.spec,status:'waiting',
    createdAt:now,startAt:null,turn:null,winner:null,state:{},topic:null,
    topicLevel:(GAMES_NEED_TOPIC[g.k]?pick.level:null),
    players:{[me.username]:{name:me.displayName,color:me.color,avatar:me.avatar||'',seat:0}},
    spectators:{}};
  await set(ref(db,'games/'+rid), room);
  // 發邀請訊息（走既有訊息系統：msg_ 編號 + createdAt 排序）
  let msgId='msg_'+now;
  try{ msgId=await nextMsgId(); }catch(e){}
  const invite={id:msgId,username:me.username,displayName:me.displayName,seat:me.seat,cls:me.cls,color:me.color,
    avatar:me.avatar,role:me.role,type:'game_invite',text:`邀請你玩 ${g.n}`,
    game:g.k,gameName:g.n,roomId:rid,minP:pick.p,maxP:g.max,createdAt:now,deleted:false};
  await set(ref(db,'messages/'+msgId),invite);
  // 記住邀請訊息編號：對局結束時要把這條訊息標成「已完成」，聊天室的加入按鈕才會消失
  await update(ref(db,'games/'+rid),{msgId:msgId});
  joinRoom(rid);
}

/* 這個房間的題目是否已備妥（各遊戲的題目結構不同，這裡統一判斷） */
function topicReady(r){
  if(!r) return false;
  if(!GAMES_NEED_TOPIC[r.game]) return true;
  const t=r.topic;
  if(!t) return false;
  if(r.game==='undercover'||r.game==='pictionary') return !!(t.words&&t.words.length);
  if(r.game==='bomb') return !!(t.categories&&t.categories.length);
  if(r.game==='scriptmurder') return !!(t.roles&&t.roles.length);
  return true;
}

/* 需要題目的遊戲：任一玩家端在後台補題目（topicGenerating 搶鎖，只出一份） */
async function ensureTopic(r){
  if(!r || r.status==='ended') return;
  const g=gameDef(r.game);
  if(!GAMES_NEED_TOPIC[g.k]) return;
  if(topicReady(r)) return;
  let res;
  try{ res=await runTransaction(ref(db,'games/'+curRoomId+'/topicGenerating'), v=> v===true?undefined:true); }
  catch(e){ return; }
  if(!res.committed) return;   // 別的玩家正在出題
  const lockRef=ref(db,'games/'+curRoomId+'/topicGenerating');
  try{ onDisconnect(lockRef).remove(); }catch(e){}
  // 出題數量依遊戲而定：你畫我猜／劇本殺要看實際人數，傳炸彈固定一串類別
  const pc=Object.keys(r.players||{}).length||(r.minP||2);
  // 只出「夠用就好」的數量：吐的字越少回得越快。
  // 誰是臥底每回合只用 1 組（給 2 組留一點變化）、傳炸彈 3 類、你畫我猜按人數折半、劇本殺必須一人一角。
  const tn=g.k==='undercover'?2:(g.k==='bomb'?3:(g.k==='pictionary'?Math.max(2,Math.ceil(pc/2)):Math.max(4,pc)));
  const lvl=r.topicLevel||'normal';
  let topic=null;
  try{ topic=await aiMakeTopic(g.k,lvl,tn); }catch(e){ topic=null; }
  if(!topic || !topicReady({game:g.k,topic:topic})){
    // AI 失敗 → 用內置保底題材（各遊戲自己的 fallback）
    const np=Math.max(4,pc);
    if(g.k==='pictionary') topic={level:lvl,words:picFallbackWords(lvl,tn),source:'fallback'};
    else if(g.k==='bomb') topic={level:lvl,categories:bombFallbackCategories(lvl,tn),source:'fallback'};
    else if(g.k==='scriptmurder') topic=smFallbackCase(lvl,np);
    else topic={level:lvl,words:ucFallbackPairs(lvl,tn),source:'fallback'};
  }
  if(!topic) return;
  await update(ref(db,'games/'+curRoomId),{topic:topic, topicGenerating:null});
  // 題目就緒後，若人數已夠就（重新）開始倒數
  try{
    const rr=(await get(ref(db,'games/'+curRoomId))).val();
    if(rr && rr.status==='waiting'){
      const pc=Object.keys(rr.players||{}).length;
      if(pc>=(rr.minP||2)) await update(ref(db,'games/'+curRoomId),{status:'countdown',startAt:Date.now()+15000});
    }
  }catch(e){}
}

/* ===== 房間 ===== */
// v1.24 從網址（?room=）進來的「遲到者」：對局在我進來之前就已經結束了
let lateJoin = false;
function joinRoom(rid){
  curRoomId=rid; view='room'; try{window.__roomId=rid;}catch(e){}
  lateJoin=false;
  if(roomSub)roomSub();
  roomSub=onValue(ref(db,'games/'+rid),async snap=>{
    if(!snap.exists()){ curRoom=null; showNotice('房間已不存在或已被關閉'); view='lobby'; render(); return; }
    const prev=curRoom;
    curRoom=snap.val();
    // 第一次收到資料時就已經是「已結束」，而且我不是這場的玩家 → 我是遲到的人
    if(!prev && curRoom.status==='ended' && !(curRoom.players&&curRoom.players[me.username])) lateJoin=true;
    if(!lateJoin) await ensureMembership();     // 已結束的房間不要再把自己塞進去
    // 人數已經夠了卻還沒開始倒數 → 由「任何一個在房間裡的人」補上。
    // 只在 ensureMembership 裡觸發是不夠的：最後一位可能是別端（例如安卓）加進來的，
    // 那樣兩邊都不會開始倒數，畫面就會一直卡在「人數 2/2 · 等待中」。
    if(!lateJoin) maybeStartCountdown();
    // 倒數已經到期、題目也好了（AI 剛出完）→ 立刻開局，不用再等一輪
    if(!lateJoin && curRoom && curRoom.status==='countdown'
       && (curRoom.startAt||0)<=Date.now() && topicReady(curRoom)) tryStartGame();
    await checkAbandon(curRoom);
    // 需要題目但還沒出好 → 後台補（不阻塞介面）
    if(curRoom && GAMES_NEED_TOPIC[curRoom.game] && curRoom.status!=='ended') ensureTopic(curRoom);
    render();
    // 投票結果框要在「所有階段」都會彈（包括投票直接分出勝負、已經進到結束畫面時）
    if(curRoom&&curRoom.game==='undercover') ucShowResultModal();
    if(curRoom&&curRoom.game==='werewolf'){
      wwCheckNight(); wwSettle(); wwAutoDawn(); wwShowVoteModal();
    }
    // 對局一結束（分出勝負／有人退出／房主關房）→ 把聊天室那條邀請標成已完成
    if(curRoom) markInviteDone(curRoom);
    // 引擎驅動的遊戲：由引擎判斷勝負
    if(curRoom&&curRoom.status==='playing'){
      if(curRoom.game==='uno') unoCheckEnd(curRoom);
      else if(curRoom.game==='chess') chessCheckEnd(curRoom);
      else if(curRoom.game==='undercover'){ ucCheckReady(curRoom); ucSettle(); }
      else if(curRoom.game==='pictionary') picCheckEndRound(curRoom);
      else if(curRoom.game==='scriptmurder'){ smCheckReady(curRoom); smTally(); }
      else if(curRoom.game==='doushou') doushouCheckEnd(curRoom);
      else if(curRoom.game==='xiangqi') xqCheckEnd(curRoom);
    }
  });
}
/* 對局中有人退出、人數低於下限 → 留下的人判勝；全走光 → 房間關閉 */
async function checkAbandon(r){
  if(!r||r.status!=='playing')return;
  const pc=Object.keys(r.players||{}).length;
  if(pc>=(r.minP||2))return;
  const left=playerNames(r);
  if(left.length===0){
    try{ await update(ref(db,'games/'+curRoomId),{status:'ended',winner:'closed'}); }catch(e){}
    return;
  }
  if(left.length===1){
    showNotice('對手已離開，你獲勝');
    await finishGame(left[0]);
  } else {
    await finishGame('draw');
  }
}
async function ensureMembership(){
  const r=curRoom; if(!r||!me) return;
  const isPlayer=r.players&&r.players[me.username];
  const isSpec=r.spectators&&r.spectators[me.username];
  if(isPlayer||isSpec) return;
  const pcount=r.players?Object.keys(r.players).length:0;
  if(r.status==='waiting'||r.status==='countdown'){
    if(pcount<(r.setMax||r.maxP)){
      const pr=ref(db,'games/'+curRoomId+'/players/'+me.username);
      await set(pr,{name:me.displayName,color:me.color,avatar:me.avatar||'',seat:pcount});
      // 關鍵：連線斷開時由伺服器自動移除，避免「人退了但還在名單裡」→ 倒數照跑
      registerPresence(pr);
      if(pcount+1>=(r.minP||2)) maybeStartCountdown();
    } else if(r.allowSpectate){
      const sr=ref(db,'games/'+curRoomId+'/spectators/'+me.username);
      await set(sr,{name:me.displayName});
      registerPresence(sr);
      showNotice('對局已滿，已進入觀戰');
    } else { showNotice('對局已滿'); }
  } else if(r.allowSpectate){
    const sr=ref(db,'games/'+curRoomId+'/spectators/'+me.username);
    await set(sr,{name:me.displayName});
    registerPresence(sr);
    showNotice('對局進行中，已進入觀戰');
  } else { showNotice('對局已滿'); }
}
function registerPresence(nodeRef){
  try{ onDisconnect(nodeRef).remove(); }catch(e){}
}
/* 誰是臥底：全員都按了「我記好了」→ 自動進入描述階段（由任一客戶端推進） */
async function ucCheckReady(r){
  if(!r||r.game!=='undercover'||r.status!=='playing') return;
  const st=ucState(r);
  if(st.phase!=='reveal') return;
  const alive=ucAlive(r), ready=st.ready||{};
  if(!alive.length||!alive.every(u=>ready[u])) return;
  try{ await runTransaction(ref(db,'games/'+curRoomId+'/state/phase'), p=>p==='reveal'?'play':undefined); }catch(e){}
}
/* 對局結束 → 把聊天室那條邀請標記為「已完成」（用房間旗標搶鎖，只寫一次） */
async function markInviteDone(r){
  const rid=r&&r.__rid?r.__rid:curRoomId;
  if(!rid||!r) return;
  if(r.status!=='ended') return;
  if(r.inviteDone) return;
  if(!r.msgId) return;
  let res;
  try{
    res=await runTransaction(ref(db,'games/'+rid+'/inviteDone'),v=>v===true?undefined:true);
  }catch(e){ return; }
  if(!res.committed) return;
  try{ await update(ref(db,'messages/'+r.msgId),{done:true,doneAt:Date.now()}); }catch(e){}
}
async function maybeStartCountdown(){
  const r=curRoom; if(!r) return;
  const pc=r.players?Object.keys(r.players).length:0;
  // 需要題目的遊戲：題目還沒出好就不開始倒數
  if(!topicReady(r)) return;
  if(r.status==='waiting'&&pc>=(r.minP||2)){
    await update(ref(db,'games/'+curRoomId),{status:'countdown',startAt:Date.now()+15000});
  }
}
/* 倒數期間若人數掉到最少人數以下 → 立即取消倒數（用最新資料，不看快取） */
async function cancelCountdownIfShort(rid){
  const id=rid||curRoomId; if(!id)return;
  try{
    const snap=await get(ref(db,'games/'+id)); if(!snap.exists())return;
    const r=snap.val();
    if(r.status!=='countdown')return;
    const pc=Object.keys(r.players||{}).length;
    if(pc<(r.minP||2)){
      await update(ref(db,'games/'+id),{status:'waiting',startAt:null});
      showNotice('人數不足，已取消倒數');
    }
  }catch(e){}
}
function renderRoom(){
  const r=curRoom; if(!r){ appEl.innerHTML='<div class="empty">載入中...</div>'; return; }
  const g=gameDef(r.game);
  if(lateJoin) return renderLateRoom(r,g);          // 對局在我進來之前就結束了
  if(r.status==='playing'||r.status==='ended'){ return renderGame(r,g); }
  // 等待 / 倒计时
  const players=Object.entries(r.players||{}).sort((a,b)=>(a[1].seat||0)-(b[1].seat||0));
  const specs=Object.entries(r.spectators||{});
  const pc=players.length;
  const isHost=r.host===me.username;
  const topicOk=topicReady(r);
  let cdHtml='';
  if(!topicOk){
    // 題目還沒出好。倒數已經到期就老實說「AI 出題中…」（題目一出好就自動開局）。
    // 注意：這個分支要在最前面，不然後面的倒數分支永遠輪不到（之前就是這樣被蓋掉）。
    const expired=r.status==='countdown'&&(r.startAt||0)<=Date.now();
    const full=pc>=(r.minP||2);
    if(expired){
      cdHtml=`<div class="countdown" id="cdNum">AI</div><div class="hint" id="cdHint">AI 出題中…請稍候（人數已到齊，題目一出好就自動開局）</div>`;
    }else{
      cdHtml=`<div class="hint" id="cdHint" style="color:var(--gold)">${full?'人數已到齊，AI 出題中…':'人齊之後就會叫 AI 出題…'}</div>`;
    }
  }
  else if(r.status==='countdown'&&r.startAt){
    const left=Math.max(0,Math.ceil((r.startAt-Date.now())/1000));
    cdHtml=`<div class="countdown" id="cdNum">${left}</div><div class="hint" id="cdHint">人數已到齊，倒數後自動開局</div>`;
  } else {
    const need=Math.max(0,(r.minP||2)-pc);
    cdHtml=`<div class="hint" id="cdHint">${need>0?('還需要 '+need+' 人才能開局'):'人數已到齊，準備開局…'}</div>`;
  }
  const plist=players.map(([u,p],i)=>`<div class="pitem"><div class="pav" style="${pavStyle(safeColor(p.color,'#3b82f6'))}">${avatarHTML({displayName:p.name,avatar:p.avatar})}</div><div class="pname">${escapeHtml(p.name||u)}${u===me.username?'（你）':''}</div><div class="pbadge">${i+1} 號</div></div>`).join('')||'<div class="empty">還沒有人加入</div>';
  const slist=specs.length?`<div class="hint" style="text-align:left;margin-top:12px">觀戰（${specs.length}）</div>`+specs.map(([u,p])=>`<div class="pitem"><div class="pav" style="${pavStyle('#475569')}">${avatarHTML(p)}</div><div class="pname">${escapeHtml(p.name||u)}</div><div class="pbadge">觀戰</div></div>`).join(''):'';
  appEl.innerHTML=`
    <div class="topbar"><button class="back-btn" data-act="leave"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)} · 房間</h1></div>
    <div class="wrap">
      <div class="hint">房主：${escapeHtml(r.hostName||r.host)} · 人數 ${pc}/${r.setMax||r.maxP}${r.allowSpectate?' · 可觀戰':' · 不可觀戰'}</div>
      ${cdHtml}
      <div class="plist">${plist}</div>${slist}
      ${isHost?`<button class="btn ghost" data-act="cancelRoom">關閉房間</button>`:''}
      <button class="btn ghost" data-act="copyRoomLink">複製房間連結</button>
      <button class="btn danger" data-act="leave">離開房間</button>
    </div>`;
  appEl.querySelectorAll('[data-act="leave"]').forEach(b=>b.onclick=leaveRoom);
  const cr=appEl.querySelector('[data-act="cancelRoom"]'); if(cr) cr.onclick=closeRoom;
  const cp=appEl.querySelector('[data-act="copyRoomLink"]'); if(cp) cp.onclick=copyRoomLink;
  startCountdownTicker();
}
/** 從網址進來的遲到者：對局已經結束 */
function renderLateRoom(r,g){
  const w=r.winner;
  let detail='';
  if(w==='draw') detail='這局最後平手收場';
  else if(w==='closed') detail='房間已經被關閉了';
  else if(typeof w==='string'&&w.indexOf('team:')===0){
    const t=w.slice(5);
    detail=(t==='uc')?'最後是臥底獲勝':(t==='wolf'?'最後是狼人獲勝':(t==='det'?'最後是好人一方獲勝':'最後是另一方獲勝'));
  }
  else if(w) detail=escapeHtml(nameOf(r,w))+' 最後獲勝';
  appEl.innerHTML=`<div class="topbar"><button class="back-btn" data-act="home"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)}</h1></div>
    <div class="wrap">
      <div class="countdown" style="font-size:32px;color:var(--gold)">你來遲了</div>
      <div class="hint">對局已經結束${detail?'（'+detail+'）':''}</div>
      <div class="hint" style="margin-top:6px">下次早一點進來，或者自己開一局新的</div>
      <button class="btn" data-act="home">回到大廳</button>
      <button class="btn ghost" data-act="copyRoomLink">複製這間房間的連結</button>
    </div>`;
  appEl.querySelectorAll('[data-act="home"]').forEach(b=>b.onclick=backHome);
  const cp=appEl.querySelector('[data-act="copyRoomLink"]'); if(cp) cp.onclick=copyRoomLink;
}
/* 房間連結（每一間房間都有自己的網址）：?room=<房號> */
function gameRoomUrl(roomId){
  const rid=roomId||curRoomId||'';
  try{
    const u=new URL(location.href);
    let p=u.pathname||'/';
    if(/game\.html$/.test(p))p=p.replace(/game\.html$/,'');
    if(/index\.html$/.test(p))p=p.replace(/index\.html$/,'');
    if(!/\/$/.test(p))p+='/';
    return u.origin+p+'?room='+encodeURIComponent(rid);
  }catch(e){ return location.origin+'/?room='+encodeURIComponent(rid); }
}
function copyRoomLink(){
  if(!curRoomId&&!lateJoin){ showNotice('現在沒有房間可以分享'); return; }
  const link=gameRoomUrl();
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(()=>showNotice('房間連結已複製')).catch(()=>showNotice('請長按手動複製：'+link));
      return;
    }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');ta.value=link;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.removeAttribute('readonly');ta.focus();ta.select();
    document.execCommand('copy');ta.remove();showNotice('房間連結已複製');
  }catch(e){ showNotice('請長按手動複製：'+link); }
}
let cdTimer=null, cdCheck=0;
function startCountdownTicker(){
  if(cdTimer)clearInterval(cdTimer);
  cdTimer=setInterval(async()=>{
    const el=document.getElementById('cdNum');
    if(!curRoom||curRoom.status!=='countdown'){ clearInterval(cdTimer);cdTimer=null;return; }
    const left=Math.max(0,Math.ceil((curRoom.startAt-Date.now())/1000));
    if(el)el.textContent=left;
    // 每 500ms 用最新資料复核人數，人不夠就取消倒數（不看快取，避免退房沒更新）
    cdCheck++;
    if(cdCheck%2===0) await cancelCountdownIfShort();
    if(left<=0){ clearInterval(cdTimer);cdTimer=null; tryStartGame(); }
  },250);
}
// 倒數完了但題目還沒出好：畫面要老實說「AI 出題中」，不要留一個 0 給人猜
function markTopicWaiting(){
  try{
    const el=document.getElementById('cdNum'); if(el) el.textContent='AI';
    const hint=document.getElementById('cdHint'); if(hint) hint.textContent='AI 出題中…請稍候（已到齊，題目一出好就自動開局）';
  }catch(e){}
}
async function tryStartGame(){
  const id=curRoomId; if(!id)return;
  // 用最新資料判斷，而不是本地快取
  let r;
  try{
    const snap=await get(ref(db,'games/'+id));
    if(!snap.exists())return;
    r=snap.val();
  }catch(e){ return; }
  if(r.status!=='countdown')return;
  const pc=Object.keys(r.players||{}).length;
  if(pc<(r.minP||2)){ await update(ref(db,'games/'+id),{status:'waiting',startAt:null}); return; }
  // 需要題目的遊戲：題目還沒出好就先不開局，但**不要退回 waiting** ——
  // 留在倒數狀態、畫面顯示「AI 出題中…」，題目一出好就自動開局（下面有自動觸發）。
  if(!topicReady(r)){ markTopicWaiting(); return; }
  // 事務搶鎖：countdown → playing，只允許一個客戶端開局
  let res;
  try{
    res=await runTransaction(ref(db,'games/'+id+'/status'), s=> s==='countdown' ? 'playing' : undefined);
  }catch(e){ return; }
  if(!res.committed) return;
  const seed=Math.floor(Math.random()*2147483647);
  const st=initGameState(r, seed);
  // 引擎驅動的遊戲（uno/chess）：只寫「隨機種子」，動作序列從空開始，各端重放得出同一局面
  await update(ref(db,'games/'+id),{startedAt:Date.now(),turn:st.turn||null,winner:null,seed:seed,actions:null,state:(r.game==='uno'||r.game==='chess')?null:st.state,players:st.players});
}
async function leaveRoom(){
  const rid=curRoomId;
  if(rid&&me){
    try{
      // v1.31 房主退出＝關閉房間。
      // 以前房主退出只把自己從名單移除，房間還停在 waiting →
      // 那條邀請會一直留在對話框、點進去只剩自己一個。
      const isHost=!!(curRoom&&curRoom.host===me.username);
      if(isHost){
        await update(ref(db,'games/'+rid),{status:'ended',winner:'closed'});
      }else{
        const pr=ref(db,'games/'+rid+'/players/'+me.username);
        const sr=ref(db,'games/'+rid+'/spectators/'+me.username);
        try{ onDisconnect(pr).cancel(); }catch(e){}
        try{ onDisconnect(sr).cancel(); }catch(e){}
        await remove(pr); await remove(sr);
        await cancelCountdownIfShort(rid);   // 我走了之後人不夠 → 立刻取消倒數
      }
    }catch(e){}
  }
  if(cdTimer){clearInterval(cdTimer);cdTimer=null;}
  if(bombTimer){clearInterval(bombTimer);bombTimer=null;}
  if(wwDawnTimer){clearTimeout(wwDawnTimer);wwDawnTimer=null;}
  const wm=document.getElementById('wwModal'); if(wm) wm.remove();
  if(roomSub)roomSub(); roomSub=null; curRoom=null;curRoomId=null;
  // v1.31 從「邀請／房間連結」進來的，退出就回去聊天室；在大廳自己找房間進來的，才回大廳。
  if(cameFromInvite){
    cameFromInvite=false;
    try{ parent.postMessage({type:'closeGames'},'*'); }catch(e){}
    return;
  }
  view='lobby';render();
}
async function closeRoom(){
  if(!curRoomId)return;
  await update(ref(db,'games/'+curRoomId),{status:'ended',winner:'closed'});
  showNotice('房間已關閉');
}

/* ===== 遊戲邏輯入口 ===== */
function seatOf(r,u){const p=r.players&&r.players[u];return p?(p.seat||0):-1;}
function playerNames(r){const e=Object.entries(r.players||{});e.sort((a,b)=>(a[1].seat||0)-(b[1].seat||0));return e.map(x=>x[0]);}
function colorOf(r,u){const p=r.players&&r.players[u];return safeColor(p&&p.color,'#3b82f6');}
function nameOf(r,u){const p=r.players&&r.players[u];return (p&&p.name)||u;}

function initGameState(r, seed){
  const names=playerNames(r);
  const players={};names.forEach((u,i)=>players[u]=Object.assign({},r.players[u],{seat:i}));
  let state={},turn=null;
  if(r.game==='tictactoe'){ state={board:Array(9).fill('')}; turn=names[0]; }
  else if(r.game==='gomoku'){ state={board:Array(225).fill(''),last:null}; turn=names[0]; }
  else if(r.game==='ludo'){ state={planes:{},colors:{},dice:0,rolled:false}; 
    names.forEach((u,i)=>{state.planes[u]=[-1,-1,-1,-1];state.colors[u]=i;}); turn=names[0]; }
  else if(r.game==='pictionary'){
    const words=(r.topic&&r.topic.words&&r.topic.words.length)?r.topic.words:picFallbackWords((r.topic&&r.topic.level)||'normal', names.length);
    state={phase:'pick',round:1,drawer:names[0],word:words[0]||'?',strokes:[],guesses:{},scores:{},startAt:null};
    turn=null;
  }
  else if(r.game==='undercover'){
    // 題目來自房間的 topic（AI 生成或內置保底）；種子決定用哪一組、誰當臥底
    const raw=(r.topic&&r.topic.words&&r.topic.words.length)?r.topic.words:ucFallbackPairs('normal',6);
    // 只留「兩個詞真的不一樣」的組合，否則會出現全部人拿到同一個詞
    const okPairs=raw.filter(p=>Array.isArray(p)&&p[0]&&p[1]&&picNorm(p[0])!==picNorm(p[1]));
    const pool=okPairs.length?okPairs:ucFallbackPairs('normal',6);
    const rng=makeRng((seed>>>0)||1);
    const pair=pool[Math.floor(rng()*pool.length)%pool.length]||['牛奶','豆漿'];
    // 一定要有臥底；人多（≥7）時兩個
    let under=ucPickUnder(names,seed,7);
    if(!under.length&&names.length) under=[names[Math.floor(rng()*names.length)%names.length]];
    state={phase:'reveal',pair:pair,undercover:under,eliminated:[],votes:{},ready:{},
      descs:null,descIdx:0,round:1,revealed:false,runoff:null,runoffVotes:null,voteResult:null};
    turn=null;
  }
  else if(r.game==='bomb'){
    // 題目是「類別」清單；開局由第一位玩家拿著炸彈開始倒數
    const cats=(r.topic&&r.topic.categories&&r.topic.categories.length)?r.topic.categories:bombFallbackCategories('normal',6);
    state={phase:'play',categories:cats,catIdx:0,category:cats[0],order:names,current:names[0],
      deadline:Date.now()+20000,duration:20,used:[],out:[]};
    turn=names[0];
  }
  else if(r.game==='scriptmurder'){
    // 題目＝一宗案件：背景 + 每個角色一份公開資料與一個秘密
    const cs=(r.topic&&r.topic.roles&&r.topic.roles.length)?r.topic:smFallbackCase('normal',names.length);
    const rng=makeRng((seed>>>0)||1);
    const deck=(cs.roles||[]).slice(0,names.length);
    while(deck.length<names.length) deck.push({n:'旁觀同學',d:'你今晚也在現場。',s:'你什麼都沒看到，但你覺得有人在說謊。'});
    for(let i=deck.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1))%deck.length; const t=deck[i];deck[i]=deck[j];deck[j]=t; }
    const assigned={}; names.forEach((u,i)=>{assigned[u]=i;});
    state={phase:'read',title:cs.title||'無名案件',scene:cs.scene||'',deck:deck,
      culprit:names[Math.floor(rng()*names.length)%names.length],
      ready:{},votes:{},tally:null,revealed:false};
    turn=null;
  }
  else if(r.game==='konglok'){
    // 純擲骰競速：位置由擲骰的端寫入，其餘端照讀
    const pos={}; names.forEach(u=>pos[u]=0);
    state={pos:pos,dice:0,turnIdx:0,lastJump:null,lastBy:null,rolling:false};
    turn=names[0];
  }
  else if(r.game==='doushou'){
    // 完全由動作序列重放，不預先寫任何局面
    state={};turn=names[0];
  }
  else if(r.game==='monopoly'){
    const pos={},money={}; names.forEach(u=>{pos[u]=0;money[u]=MP_MONEY0;});
    state={pos:pos,money:money,owner:{},out:[],turnIdx:0,dice:0,rolling:false,pending:null,log:[],lastCard:null};
    turn=names[0];
  }
  else if(r.game==='werewolf'){
    // 角色由種子分配（各端一致）；開局直接入夜
    const roles=wwAssign(names,seed);
    state={phase:'night',roles:roles,night:1,round:1,wolfPicks:null,seerChecks:null,
      eliminated:[],lastNightVictim:null,dawnAt:null,descIdx:0,descs:null,
      votes:null,runoff:null,runoffVotes:null,voteResult:null,lastOut:null,tie:false,revealed:false};
    turn=null;
  }
  else if(r.game==='xiangqi'){
    // 同上：只寫動作，各端重放
    state={};turn=names[0];
  }
  else if(r.game==='uno'||r.game==='chess'){
    // 交給第三方引擎：不預先產生任何盤面，開局只寫種子，各端重放動作
    state={};turn=null;
  }
  return {players:players,turn:turn,state:state};
}

function renderGame(r,g){
  if(r.status==='ended') return renderEnded(r,g);
  const spec=!!(r.spectators&&r.spectators[me.username]);
  let turnName=r.turn;
  // 引擎驅動的遊戲：輪次以引擎為準
  const eng=getEngine(r);
  if(eng){
    if(r.game==='uno') turnName=eng.currentPlayer?eng.currentPlayer.name:'';
    else if(r.game==='chess'){ const nm=playerNames(r); turnName=eng.turn()==='w'?nm[0]:nm[1]; }
  }
  // 鬥獸棋不是引擎驅動，輪次由「已走幾步」推出來（r.turn 不會即時更新）
  if(r.game==='doushou'){ const nm=playerNames(r); turnName=nm[actionsOf(r).length%2]||nm[0]; }
  if(r.game==='xiangqi'){ const nm=playerNames(r); turnName=xqPlayerOf(xqTurnSide(r),nm)||nm[0]; }
  if(r.game==='monopoly') turnName=mpTurnU(r);
  if(r.game==='werewolf'){ const nm=playerNames(r); turnName=nm[0]||''; }
  const myTurn=(turnName===me.username)&&!spec;
  const bar=`<div class="turnbar ${myTurn?'mine':''}">${spec?'觀戰中':(myTurn?'輪到你了':escapeHtml(nameOf(r,turnName))+' 的回合')}</div>`;
  if(r.game==='tictactoe') drawTTT(r,g,bar,spec);
  else if(r.game==='gomoku') drawGomoku(r,g,bar,spec);
  else if(r.game==='ludo') drawLudo(r,g,bar,spec);
  else if(r.game==='uno') drawUno(r,g,bar,spec);
  else if(r.game==='chess') drawChess(r,g,bar,spec);
  else if(r.game==='undercover') drawUndercover(r,g,'',spec);   // 自己有一條「輪到誰描述」的提示，不用上面那條
  else if(r.game==='pictionary') drawPictionary(r,g,bar,spec);
  else if(r.game==='bomb') drawBomb(r,g,bar,spec);
  else if(r.game==='scriptmurder') drawScriptMurder(r,g,bar,spec);
  else if(r.game==='konglok') drawKonglok(r,g,bar,spec);
  else if(r.game==='doushou') drawDoushou(r,g,bar,spec);
  else if(r.game==='xiangqi') drawXiangqi(r,g,bar,spec);
  else if(r.game==='werewolf') drawWerewolf(r,g,'',spec);
  else if(r.game==='monopoly') drawMonopoly(r,g,bar,spec);
  else { appEl.innerHTML=`<div class="topbar"><button class="back-btn" data-act="leave"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)}</h1></div><div class="empty">這款遊戲的對局介面還在開發中</div>`; }
  const lb=appEl.querySelector('[data-act="leave"]'); if(lb)lb.onclick=leaveRoom;
}
function renderEnded(r,g){
  const w=r.winner;
  if(r.game==='pictionary'){
    const scores=r.state&&r.state.scores||{};
    const rows=playerNames(r).sort((a,b)=>(scores[b]||0)-(scores[a]||0)).map(u=>{
      const mine=u===me.username;
      const isTop=playerNames(r).sort((a,b)=>(scores[b]||0)-(scores[a]||0))[0]===u;
      return `<div class="pitem" style="${mine?'border-color:var(--accent)':''}"><div class="pav" style="${pavStyle(colorOf(r, u))}">${avatarHTML({displayName:nameOf(r,u)})}</div><div class="pname">${escapeHtml(nameOf(r,u))}${mine?'（你）':''}${isTop?' · 冠軍':''}</div><div class="pbadge" style="color:var(--gold);border-color:var(--gold)">${scores[u]||0} 分</div></div>`;
    }).join('');
    appEl.innerHTML=`<div class="topbar"><button class="back-btn" data-act="home"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)} · 結束</h1></div>
      <div class="wrap"><div class="countdown" style="font-size:30px">${w==='draw'?'平手':'恭喜獲勝！'}</div>
      <div class="plist">${rows}</div><button class="btn" data-act="home">回到大廳</button></div>`;
    appEl.querySelectorAll('[data-act="home"]').forEach(b=>b.onclick=backHome);
    return;
  }
  if(r.game==='werewolf'){
    const st=r.state||{};
    const rl=st.roles||{};
    const wolfWin=w==='team:wolf';
    const iAmWolf=rl[me.username]==='wolf';
    const iWon=wolfWin?iAmWolf:!iAmWolf;
    const rows=playerNames(r).map(u=>{
      const isW=rl[u]==='wolf';
      const c=isW?'#f472b6':'var(--green)';
      return `<div class="pitem"><div class="pav" style="${pavStyle(colorOf(r, u))}">${avatarHTML({displayName:nameOf(r,u)})}</div><div class="pname">${escapeHtml(nameOf(r,u))}${u===me.username?'（你）':''}</div><div class="pbadge" style="color:${c};border-color:${c}">${WW_NAME[rl[u]]||'平民'}</div></div>`;

    appEl.innerHTML=`<div class="topbar"><button class="back-btn" data-act="home"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)} · 結束</h1></div>
      <div class="wrap">
        <div class="countdown" style="font-size:28px;color:${iWon?'var(--green)':'var(--red)'}">${iWon?'你贏了！':'你輸了'}</div>
        <div class="hint">${wolfWin?'狼人獲勝':'村民獲勝'} · 共進行 ${Number(st.night)||1} 夜</div>
        <div class="plist">${rows}</div>
        <button class="btn" data-act="home">回到大廳</button>
      </div>`;
    appEl.querySelectorAll('[data-act="home"]').forEach(b=>b.onclick=backHome);
    return;
  }
  if(r.game==='scriptmurder'){
    const st=r.state||{};
    const deck=st.deck||[], culprit=st.culprit||'';
    const detWin=w==='team:det';
    const iAmCulprit=(me.username===culprit);
    const iWon=detWin?!iAmCulprit:iAmCulprit;
    const rows=playerNames(r).map((u,i)=>{
      const role=deck[i]||{n:'角色'};
      const isC=u===culprit;
      const c=isC?'var(--red)':'var(--green)';
      return `<div class="pitem"><div class="pav" style="${pavStyle(colorOf(r, u))}">${avatarHTML({displayName:nameOf(r,u)})}</div><div class="pname">${escapeHtml(nameOf(r,u))}${u===me.username?'（你）':''}<div class="hint" style="margin:2px 0 0">${escapeHtml(role.n||'')}</div></div><div class="pbadge" style="color:${c};border-color:${c}">${isC?'兇手':'清白'}</div></div>`;
    }).join('');
    const verdict=detWin?'兇手被揪出來了！':'兇手逃掉了…';
    appEl.innerHTML=`<div class="topbar"><button class="back-btn" data-act="home"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)} · 結案</h1></div>
      <div class="wrap">
        <div class="countdown" style="font-size:28px;color:${iWon?'var(--green)':'var(--red)'}">${iWon?'你贏了！':'你輸了'}</div>
        <div class="hint">${verdict} · 兇手是 ${escapeHtml(nameOf(r,culprit))}</div>
        ${st.title?`<div class="hint">案件「${escapeHtml(st.title)}」</div>`:''}
        <div class="plist">${rows}</div>
        <button class="btn" data-act="home">回到大廳</button>
      </div>`;
    appEl.querySelectorAll('[data-act="home"]').forEach(b=>b.onclick=backHome);
    return;
  }
  const teamWin=(r.state&&r.state.teamWin)||(typeof w==='string'&&w.indexOf('team:')===0?w.slice(5):null);
  if(teamWin){
    const under=(r.state&&r.state.undercover)||[];
    const myTeam=(under.includes(me.username))?'uc':'civ';
    const iWon=(teamWin===myTeam);
    const big=teamWin==='uc'?'臥底獲勝':'平民獲勝';
    const rows=playerNames(r).map(u=>{
      const isU=under.includes(u);
      const tag=isU?'臥底':'平民';
      const c=isU?'#f472b6':'var(--green)';
      return `<div class="pitem"><div class="pav" style="${pavStyle(colorOf(r, u))}">${avatarHTML({displayName:nameOf(r,u)})}</div><div class="pname">${escapeHtml(nameOf(r,u))}${u===me.username?'（你）':''}</div><div class="pbadge" style="color:${c};border-color:${c}">${tag}</div></div>`;
    }).join('');
    appEl.innerHTML=`<div class="topbar"><button class="back-btn" data-act="home"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)} · 結束</h1></div>
      <div class="wrap">
        <div class="countdown" style="font-size:30px;color:${iWon?'var(--green)':'var(--red)'}">${iWon?'你贏了！':'你輸了'}</div>
        <div class="hint">${big}${r.state&&r.state.pair?` · 題目「${escapeHtml(r.state.pair[0])}／${escapeHtml(r.state.pair[1])}」`:''}</div>
        <div class="plist">${rows}</div>
        <button class="btn" data-act="home">回到大廳</button>
      </div>`;
    appEl.querySelectorAll('[data-act="home"]').forEach(b=>b.onclick=backHome);
    return;
  }
  const amPlayer=!!(r.players&&r.players[me.username]);
  const amSpec=!!(r.spectators&&r.spectators[me.username]);
  let big='',small='',col='var(--text-main)';
  if(w==='closed'){ big='房間已關閉'; small=''; }
  else if(w==='draw'){ big='平手'; small='這局誰也奈何不了誰'; col='var(--gold)'; }
  else if(amPlayer&&w===me.username){ big='你贏了！'; small=escapeHtml(nameOf(r,w))+' 完成對局'; col='var(--green)'; }
  else if(amPlayer){ big='你輸了'; small=escapeHtml(nameOf(r,w))+' 獲勝，再來一局？'; col='var(--red)'; }
  else { big=escapeHtml(nameOf(r,w))+' 獲勝'; small=amSpec?'（觀戰結束）':''; col='var(--accent)'; }
  // 這局各自的勝負排行
  const rows=playerNames(r).map(u=>{
    const tag=(w===u)?'勝':(w==='draw'?'和':'負');
    const c=(w===u)?'var(--green)':(w==='draw'?'var(--gold)':'var(--red)');
    return `<div class="pitem"><div class="pav" style="${pavStyle(colorOf(r, u))}">${avatarHTML({displayName:nameOf(r,u)})}</div><div class="pname">${escapeHtml(nameOf(r,u))}${u===me.username?'（你）':''}</div><div class="pbadge" style="color:${c};border-color:${c}">${tag}</div></div>`;
  }).join('');
  appEl.innerHTML=`<div class="topbar"><button class="back-btn" data-act="home"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)} · 結束</h1></div>
    <div class="wrap">
      <div class="countdown" style="font-size:32px;color:${col}">${big}</div>
      <div class="hint">${small}</div>
      <div class="plist">${rows}</div>
      <button class="btn" data-act="home">回到大廳</button>

  appEl.querySelectorAll('[data-act="home"]').forEach(b=>b.onclick=backHome);
}
function backHome(){
  // v1.31 從邀請／房間連結進來的：任何「回到大廳」都應該回到聊天室，
  // 而不是把小遊戲大廳丟給對方看（他根本不是從那裡進來的）。
  if(cameFromInvite){
    cameFromInvite=false;
    if(roomSub)roomSub();roomSub=null;curRoom=null;curRoomId=null;
    try{ parent.postMessage({type:'closeGames'},'*'); }catch(e){}
    return;
  }
  if(roomSub)roomSub();roomSub=null;curRoom=null;if(bombTimer){clearInterval(bombTimer);bombTimer=null;}view='lobby';render();
}

/* ===== 勝負與戰績 ===== */
// winners：團隊遊戲用（例如劇本殺），傳入「這一局算贏」的玩家陣列；
// 不傳就沿用舊行為（winner 本人勝，'draw' 平手）。
async function finishGame(winner, winners){
  const r=curRoom; if(!r||r.status==='ended')return;
  // 用 winner 當原子鎖：雙方同時判定勝利時，只有一方能寫入，另一方直接放棄
  // （否則戰績會被重複累加兩次）
  let res;
  try{
    res=await runTransaction(ref(db,'games/'+curRoomId+'/winner'), w=>{
      if(w!==null&&w!==undefined) return;   // 已經有贏家了，中止事務
      return winner;
    });
  }catch(e){ return; }
  if(!res.committed) return;                // 別人搶先結束了，不重複統計
  await update(ref(db,'games/'+curRoomId),{status:'ended',endedAt:Date.now()});
  const names=playerNames(r);
  const winArr=(winners&&winners.length)?winners:null;
  for(const u of names){
    const didWin=winArr?winArr.includes(u):(winner===u);
    const isDraw=!winArr&&winner==='draw';
    try{
      await runTransaction(ref(db,'users/'+u+'/gameStats/'+r.game),c=>{
        c=c||{};const w=Number(c.win)||0,l=Number(c.lose)||0,p=Number(c.play)||0;
        return {win:w+(didWin?1:0),lose:l+((didWin||isDraw)?0:1),play:p+1};
      });
    }catch(e){}
  }
}
async function tryWinCheck(){
  const r=curRoom; if(!r||r.status!=='playing')return;
  // v1.36 這兩個遊戲的棋盤存的不是「帳號」，是「棋子的代號」——
  // 井字棋存 'X'/'O'、五子棋存 '1'/'2'。以前直接把代號當成贏家寫進 winner，
  // 結果 winners 永遠不等於任何玩家的帳號 → 兩個人都被算成輸，兩邊都顯示「你輸了」。
  // 現在一律換算回 playerNames() 裡真正的那個人（代號 0 = 先手 = names[0]）。
  // 先手代號的來源就在 tttMove()/gomokuMove()：board[..] = r.turn===names[0] ? 先手代號 : 後手代號
  const names=playerNames(r);
  const byMark=(first,second,m)=>m===first?names[0]:(names[1]!==undefined?names[1]:names[0]);
  if(r.game==='tictactoe'){
    const b=r.state.board;const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for(const [x,y,z] of L){ if(b[x]&&b[x]===b[y]&&b[y]===b[z]){ await finishGame(byMark('X','O',b[x]));return; } }
    if(b.every(c=>c)){ await finishGame('draw'); }
  } else if(r.game==='gomoku'){
    const b=r.state.board,N=15;const dirs=[[1,0],[0,1],[1,1],[1,-1]];
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){const v=b[i*N+j];if(!v)continue;
      for(const [dx,dy] of dirs){let c=1;for(let k=1;k<5;k++){const ni=i+dx*k,nj=j+dy*k;if(ni<0||nj<0||ni>=N||nj>=N)break;if(b[ni*N+nj]!==v)break;c++;}
        if(c>=5){ await finishGame(byMark('1','2',v));return; } } }
  } else if(r.game==='ludo'){
    for(const [u,pl] of Object.entries(r.state.planes)){ if(pl.every(p=>p>=57)){ await finishGame(u);return; } }
  } else if(r.game==='uno'){
    for(const [u,h] of Object.entries(r.state.hands)){ if(h.length===0){ await finishGame(u);return; } }
  }
}

/* ===== 井字棋 ===== */
let tttCanvas=null;
function drawTTT(r,g,bar,spec){
  appEl.innerHTML=`<div class="topbar"><button class="back-btn" data-act="leave"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)}</h1></div>
   <div class="wrap"><div class="board-wrap">${bar}<canvas id="cv" width="330" height="330"></canvas>
   <div class="hint" id="tttHint">你執 <svg class="ico"><use href="#i-gomoku"/></svg></div></div></div>`;
  const cv=appEl.querySelector('#cv'),ctx=cv.getContext('2d');
  const names=playerNames(r);
  const myMark=names.indexOf(me.username)===0?'X':'O';
  ctx.fillStyle='#d9b382';ctx.fillRect(0,0,330,330);
  ctx.strokeStyle='#6b4f2a';ctx.lineWidth=3;
  ctx.translate(0.5,0.5);   // 同上：讓線落在像素中心，不然會糊
  for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(i*110,12);ctx.lineTo(i*110,318);ctx.stroke();ctx.beginPath();ctx.moveTo(12,i*110);ctx.lineTo(318,i*110);ctx.stroke();}
  ctx.lineCap='round';
  r.state.board.forEach((v,i)=>{ if(!v)return;const c=i%3,rw=Math.floor(i/3);const cx=c*110+55,cy=rw*110+55;
    // 棋子固定黑／白（先手黑、後手白），不用玩家個人顏色
    if(v==='X'){
      ctx.strokeStyle='#14181F';ctx.lineWidth=8;
      ctx.beginPath();ctx.moveTo(cx-28,cy-28);ctx.lineTo(cx+28,cy+28);ctx.moveTo(cx+28,cy-28);ctx.lineTo(cx-28,cy+28);ctx.stroke();
    }else{
      ctx.lineWidth=10;ctx.strokeStyle='#3A2A16';ctx.beginPath();ctx.arc(cx,cy,30,0,Math.PI*2);ctx.stroke();
      ctx.lineWidth=6.5;ctx.strokeStyle='#F5F7FA';ctx.beginPath();ctx.arc(cx,cy,30,0,Math.PI*2);ctx.stroke();
    }
  });
  const hintEl=appEl.querySelector('#tttHint'); if(hintEl)hintEl.innerHTML='你執 <svg class="ico"><use href="#i-gomoku"/></svg>'+(myMark==='X'?'（先手）':'（後手）');
  cv.onclick=e=>{ if(spec)return;const rect=cv.getBoundingClientRect();
    const x=(e.clientX-rect.left)*(330/rect.width),y=(e.clientY-rect.top)*(330/rect.height);
    const c=Math.floor(x/110),rw=Math.floor(y/110);if(c<0||c>2||rw<0||rw>2)return;
    tttMove(rw*3+c);
  };
}
async function tttMove(i){
  const r=curRoom; if(r.status!=='playing'||r.turn!==me.username||r.game!=='tictactoe')return;
  const names=playerNames(r);const board=r.state.board.slice();
  if(board[i])return;
  board[i]=r.turn===names[0]?'X':'O';
  const next=names[(names.indexOf(r.turn)+1)%names.length];
  await update(ref(db,'games/'+curRoomId),{'state/board':board,turn:next});
  setTimeout(tryWinCheck,120);
}

/* ===== 五子棋 ===== */
function drawGomoku(r,g,bar,spec){
  const S=15,C=23,PAD=18,W=C*(S-1)+PAD*2; // 345
  appEl.innerHTML=`<div class="topbar"><button class="back-btn" data-act="leave"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)}</h1></div>
   <div class="wrap"><div class="board-wrap">${bar}<canvas id="cv" width="${W}" height="${W}"></canvas>
   <div class="hint">五子連線者勝</div></div></div>`;
  const cv=appEl.querySelector('#cv'),ctx=cv.getContext('2d');
  ctx.fillStyle='#d29a55';ctx.fillRect(0,0,W,W);          // v1.33 木色照規範
  ctx.strokeStyle='#4d2d18';ctx.lineWidth=1;                // 線色照規範
  // 1px 的線畫在整數座標會跨在兩個像素之間 → 每條線都被平均成 50% 混色（看起來糊）。
  // 偏移 0.5px 讓線落在像素中心，格線才會清晰。
  ctx.translate(0.5,0.5);
  for(let i=0;i<S;i++){ctx.beginPath();ctx.moveTo(PAD,PAD+i*C);ctx.lineTo(PAD+(S-1)*C,PAD+i*C);ctx.stroke();
    ctx.beginPath();ctx.moveTo(PAD+i*C,PAD);ctx.lineTo(PAD+i*C,PAD+(S-1)*C);ctx.stroke();}
  const names=playerNames(r);
  for(let i=0;i<S;i++)for(let j=0;j<S;j++){const v=r.state.board[i*S+j];if(!v)continue;
    const x=PAD+j*C,y=PAD+i*C;ctx.beginPath();ctx.arc(x,y,C*0.42,0,Math.PI*2);
    // 棋子固定黑／白（先手黑、後手白），不用玩家個人顏色
    const black=(v==='1');
    ctx.fillStyle=black?'#14181F':'#F5F7FA';ctx.fill();
    if(!black){ctx.strokeStyle='#3A2A16';ctx.lineWidth=1.4;ctx.stroke();}
  }
  if(r.state.last){const i=r.state.last.i,j=r.state.last.j;ctx.beginPath();ctx.arc(PAD+j*C,PAD+i*C,C*0.12,0,Math.PI*2);
    ctx.fillStyle=(r.state.board[i*S+j]==='1')?'#F5F7FA':'#14181F';ctx.fill();}
  cv.onclick=e=>{if(spec)return;const rect=cv.getBoundingClientRect();
    const j=Math.round(((e.clientX-rect.left)*(W/rect.width)-PAD)/C);
    const i=Math.round(((e.clientY-rect.top)*(W/rect.height)-PAD)/C);
    if(i<0||j<0||i>=S||j>=S)return; gomokuMove(i,j);
  };
}
async function gomokuMove(i,j){
  const r=curRoom;if(r.status!=='playing'||r.turn!==me.username||r.game!=='gomoku')return;
  const names=playerNames(r);const S=15;const board=r.state.board.slice();
  if(board[i*S+j])return;
  board[i*S+j]=r.turn===names[0]?'1':'2';
  const next=names[(names.indexOf(r.turn)+1)%names.length];
  await update(ref(db,'games/'+curRoomId),{'state/board':board,'state/last':{i,j},turn:next});
  setTimeout(tryWinCheck,120);
}

// 照參考站 x(planeIdx, step, rot)：step 0=基地、1..51 環、52..57 航道；rot=該玩家顏色索引
function fxqPos(pi,step,rot){
  var x,y;
  if(!step||step>57){ x=[-6.2,6.2,-6.2,6.2][pi]-68; y=[-6.2,-6.2,6.2,6.2][pi]+68; }
  else { x=FXQ_X[step]; y=FXQ_Y[step]; }
  return rot===2?[-x,-y]:rot===1?[-y,x]:rot===3?[y,-x]:[x,y];
}
// 我們的顏色索引(0紅1綠2黃3藍) → 參考站顏色索引(0藍1綠2紅3黃)
const FXQ_COL=[2,1,3,0];
const FXQ_NAME=['blue','green','red','yellow'];
const STNAMES=['紅','綠','黃','藍'];

function drawLudo(r,g,bar,spec){
  const cols=r.state.colors||{};
  // 依參考站規則排棋子：step 0=基地、1..57 在跑道上，同格多顆稍微錯開
  let planes='',at={};
  Object.entries(r.state.planes||{}).forEach(([u,pl])=>{
    const rc=FXQ_COL[cols[u]||0],nm=FXQ_NAME[rc];
    pl.forEach((steps,pi)=>{
      const st=steps<0?0:Math.min(steps+1,57);
      const q=fxqPos(pi,st,rc);
      const k=Math.round(q[0])+','+Math.round(q[1]);
      const n=(at[k]=(at[k]||0)+1);
      const dx=n>1?(n-1)*3.2:0, dy=n>1?(n-1)*1.9:0;
      planes+=`<use href="#p-${nm}-${rc}" x="${q[0]+dx}" y="${q[1]+dy}"/>`;
    });
  });
  const win=r.winner!==null&&r.winner!==undefined&&r.winner!==''?`<use href="#win"/>`:'';
  appEl.innerHTML=`<div class="topbar"><button class="back-btn" data-act="leave"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)}</h1></div>
   <div class="wrap"><div class="board-wrap">${bar}
   <div class="fxqboard"><svg viewBox="-88,-92,176,184" xmlns="http://www.w3.org/2000/svg">${FXQ_DEFS}${FXQ_CELLS.map(a=>'<use '+a+'/>').join('')}${win}${planes}</svg></div>
   <div class="side" id="diceRow"></div>
   <div class="hint">擲到 6 才能起飛；踩到對手送回基地；4 架全到終點獲勝</div></div></div>`;
  const myTurn=r.turn===me.username&&!spec;
  const d=r.state.dice||0;
  const dr=appEl.querySelector('#diceRow');
  dr.innerHTML=`<div class="dice" id="dice">${dicePips(d)}</div>`;
  const diceEl=dr.querySelector('#dice');
  diceEl.onclick=async()=>{ if(!myTurn)return; if(r.state.rolled){await ludoPass();return;} ludoRoll(); };
  if(myTurn&&r.state.rolled){
    const my=r.state.planes[me.username]||[];
    const btns=my.map((p,i)=>{
      const can=canMove(r,i);return `<button class="chip" data-pi="${i}" style="${can?'border-color:var(--gold);color:var(--gold)':''}">${STNAMES[cols[me.username]]}${i+1}：${p<0?'基地':(p>=57?'完成':p+'步')}</button>`;
    }).join('');
    const bar2=document.createElement('div');bar2.className='side';bar2.innerHTML=btns;dr.appendChild(bar2);
    bar2.querySelectorAll('[data-pi]').forEach(b=>b.onclick=()=>ludoMove(+b.dataset.pi));
  }
}

function dicePips(d){let h='';for(let i=0;i<9;i++)h+=`<div class="pip"></div>`;const map={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};const on=map[d]||[];h='';for(let i=0;i<9;i++)h+=`<div class="pip ${on.includes(i)?'on':''}"></div>`;return h;}
function canMove(r,pi){
  const p=r.state.planes[me.username][pi];const d=r.state.dice;
  if(p>=57)return false;
  if(p<0)return d===6;
  return p+d<=57;
}
async function ludoRoll(){
  const r=curRoom;if(r.status!=='playing'||r.turn!==me.username)return;
  const d=1+Math.floor(Math.random()*6);
  await update(ref(db,'games/'+curRoomId),{'state/dice':d,'state/rolled':true});
}
async function ludoPass(){
  const r=curRoom;const names=playerNames(r);
  const next=names[(names.indexOf(r.turn)+1)%names.length];
  await update(ref(db,'games/'+curRoomId),{turn:next,'state/dice':0,'state/rolled':false});
}
async function ludoMove(pi){
  const r=curRoom;if(r.status!=='playing'||r.turn!==me.username||!r.state.rolled)return;
  const pl=(r.state.planes[me.username]||[]).slice();const d=r.state.dice;
  if(!canMove(r,pi))return;
  let np=pl[pi]<0?0:pl[pi]+d;
  if(np>57)return;
  pl[pi]=np;
  // 更新棋盤
  const planes={};Object.entries(r.state.planes).forEach(([u,v])=>planes[u]=v.slice());
  planes[me.username]=pl;
  // 撞子：同一環格上的對手送回基地
  if(np<52){
    const myRc=FXQ_COL[r.state.colors[me.username]||0];
    const mp=fxqPos(pi,np+1,myRc);
    Object.entries(planes).forEach(([u,v])=>{ if(u===me.username)return;
      const rc=FXQ_COL[r.state.colors[u]||0];
      v.forEach((p2,i2)=>{ if(p2<0||p2>50)return;      // 只有跑道中段會被撞（照參考站，起點與終點前不撞）
        const q=fxqPos(i2,p2+1,rc);
        if(Math.abs(q[0]-mp[0])<0.01&&Math.abs(q[1]-mp[1])<0.01){ planes[u][i2]=-1; } });
    });
  }
  const names=playerNames(r);
  const next=names[(names.indexOf(r.turn)+1)%names.length];
  await update(ref(db,'games/'+curRoomId),{'state/planes':planes,turn:next,'state/dice':0,'state/rolled':false});
  setTimeout(tryWinCheck,120);
}

/* ===== 規則引擎（第三方庫，不再自己手寫規則）=====
   UNO      → lib/uno-engine.js（UMD，全域 UnoEngine）
   國際象棋 → lib/chess.js（ESM，已 import）
   多端同步：Firebase 只存「隨機種子 + 動作序列」，各端用同一引擎重放得到相同局面。
   引擎內部洗牌用 Math.random → 重放時接管為種子化 LCG（已離線驗證同種子結果一致）。
*/
function makeRng(s0){ let s = s0 >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function withSeed(seed, fn){ const o = Math.random; Math.random = makeRng(seed >>> 0); try { return fn(); } finally { Math.random = o; } }
function actionsOf(r){ const a = r.actions || {}; return Object.keys(a).sort().map(k => a[k]); }

let ENG = null, ENGKEY = '';
function engineKeyOf(r){ return [r.game, r.seed || 0, Object.keys(r.actions || {}).length, r.startedAt || 0].join('|'); }
function getEngine(r){
  if (!r) return null;
  if (r.game !== 'uno' && r.game !== 'chess') return null;
  const key = engineKeyOf(r);
  if (ENG && ENGKEY === key) return ENG;
  try {
    ENG = withSeed(r.seed || 1, () => (r.game === 'uno' ? new UnoEngine.Game(playerNames(r)) : new Chess()));
    const acts = actionsOf(r);
    if (r.game === 'uno') {
      for (const a of acts) { try {
        if (a.t === 'play') { const c = unoFindCard(ENG, a.p, a.c, a.v, a.d); if (c) ENG.play(c); }
        else if (a.t === 'draw') ENG.draw();
        else if (a.t === 'pass') ENG.pass();
        else if (a.t === 'uno') ENG.uno(a.p);
      } catch (e) {} }
    } else {
      for (const a of acts) { try { ENG.move({ from: a.f, to: a.to, promotion: a.pr || 'q' }); } catch (e) {} }
    }
  } catch (e) { ENG = null; }
  ENGKEY = key;
  return ENG;
}
async function pushAction(a){ await push(ref(db, 'games/' + curRoomId + '/actions'), a); }

/* ===== UNO（規則由 uno-engine 負責）===== */
const UCOLORS = { red: '紅', blue: '藍', green: '綠', yellow: '黃', wild: '變' };
const UVALUES = { skip: '⊘', reverse: '⇄', draw_two: '+2', wild: '彩', wild_draw_four: '+4', wild_draw_two: '+4' };
const unoCN = c => String(c).toLowerCase();
const unoVN = v => String(v).toLowerCase();
function unoLabel(card){
  const v = unoVN(card.value), col = unoCN(card.color);
  return { text: (UVALUES[v] || v).toUpperCase(), cls: col === 'wild' ? 'w' : col[0] };

function unoFindCard(eng, who, col, val, declared){

function drawChess(r, g, bar, spec){
  const eng = getEngine(r);

  appEl.innerHTML = `<div class="topbar"><button class="back-btn" data-act="leave"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)}</h1></div>

    ctx.fillStyle = pc.color === 'w' ? '#f8fafc' : '#1f2937'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = pc.color === 'w' ? '#475569' : '#0b0d14'; ctx.stroke();
    ctx.fillStyle = pc.color === 'w' ? '#1f2937' : '#f8fafc';
    ctx.font = 'bold 19px "Microsoft JhengHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(CHESS_GLYPH[pc.type] || pc.type, cx, cy + 1);
    if (chessSel === sq) { ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3; ctx.strokeRect(x + 2, y + 2, CELL - 4, CELL - 4); }

async function callAI(systemPrompt, userPrompt, maxTokens, retry){
  retry = retry || 0;
  try {
    const res = await fetch(AI_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'api-key': AI_KEY },
      body: JSON.stringify({
        model: AI_MODEL, stream: false, max_tokens: maxTokens || 1200,
        messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userPrompt }],
      }),
    });
    if (res.status === 429 && retry < 2) { await new Promise(r => setTimeout(r, 2000)); return callAI(systemPrompt, userPrompt, maxTokens, retry + 1); }
    if (!res.ok) throw new Error('AI ' + res.status);
    const data = await res.json();
    const ch = data.choices && data.choices[0];
    const msg = (ch && ch.message) || {};
    const content = msg.content || '';
    const reasoning = msg.reasoning_content || '';
    try { window.__lastAI = { content: content, reasoning: reasoning, finish: ch && ch.finish_reason }; } catch (e) {}
    // 這個模型會先吐一大段推理，content 可能被 max_tokens 截斷 → 用推理內容當後備
    return content || reasoning;
  } catch (e) {
    if (retry < 2) { await new Promise(r => setTimeout(r, 1500)); return callAI(systemPrompt, userPrompt, maxTokens, retry + 1); }
    throw e;
  }
}
function extractJSON(text){
  if (!text) return null;
  let s = String(text).replace(/```[a-zA-Z]*/g, '').replace(/```/g, '').trim();
  const i = s.search(/[\[{]/); if (i < 0) return null;
  const open = s[i], close = open === '[' ? ']' : '}';
  let depth = 0, end = -1;
  for (let j = i; j < s.length; j++) {
    if (s[j] === open) depth++;
    else if (s[j] === close) { depth--; if (depth === 0) { end = j; break; } }
  }
  if (end < 0) return null;
  try { return JSON.parse(s.slice(i, end + 1)); } catch (e) { return null; }
}

async function aiUndercoverPairs(level, n, avoid){

  const sys = '你是班級桌遊的出題員。不要推理、不要解釋，直接輸出 JSON 陣列。';

      (avoid && avoid.length ? `避開：${avoid.join('、')}。` : '') +

    let txt = '';

/* 單次 AI 呼叫的硬性上限：模型偶爾會吐很久的推理，等太久玩家會以為卡死。
   超時就當失敗 → 各遊戲改用內置保底題目，至少開得成局。 */
function withTimeout(p, ms){
  let t = null;
  return Promise.race([
    Promise.resolve(p).finally(() => { if (t) clearTimeout(t); }),
    new Promise((_, rej) => { t = setTimeout(() => rej(new Error('AI timeout')), ms || 30000); }),
  ]);
}

/* ===== 誰是臥底（3–12 人）=====
   平民拿到同一組詞的第一個，臥底拿第二個（兩個詞一定不可以相同）。
   流程：發詞 → 按座位順序「打字描述」（像聊天，講完自動到下一位）→
        全部講完一輪就投票 → 票最高者出局 → 未分出勝負就再描述一輪。
   勝負：臥底全部出局＝平民勝；存活臥底 ≥ 存活平民＝臥底勝。
   題目放在 games/{id}/topic（AI 生成或內置保底），開局由種子挑一組。

function ucState(r){ return (r && r.state) ? r.state : {}; }

}

function ucCurDesc(r){

  return alive[(Number(ucState(r).descIdx) || 0) % alive.length];
}
/** 描述紀錄（像聊天：時間在前的在上、新的在下） */
function ucDescList(r){
