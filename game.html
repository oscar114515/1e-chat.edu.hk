<script>
/* v1.38.23 字體：這行要和 chat.html 的 FONT_CDN 保持一致 */
var FONT_CDN='';
try{ if(localStorage.getItem('chat_font')==='sys') document.documentElement.classList.add('font-sys'); }catch(e){}
(function(){
  if(!FONT_CDN) return;
  /* CSSFontFaceRule.style 是唯讀的，改不動；改成插一條新規則指向家中伺服器 */
  document.addEventListener('DOMContentLoaded',function(){
    try{
      var st=document.createElement('style');
      st.textContent=
        '@font-face{font-family:"LXGW WenKai Home";font-style:normal;font-weight:400;font-display:swap;'+
        'src:url("'+FONT_CDN+'") format("woff2");'+
        'unicode-range:U+2E80-2EFF,U+3000-303F,U+3100-312F,U+31C0-31EF,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FE30-FE4F,U+FF00-FFEF}'+
        "body{font-family:'LXGW WenKai Home','Inter',-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"PingFang HK\",\"PingFang TC\",\"Microsoft JhengHei UI\",\"Microsoft JhengHei\",\"Noto Sans CJK TC\",\"Noto Sans TC\",system-ui,sans-serif}";
      document.head.appendChild(st);
    }catch(e){}
  });
})();
</script>

<title>小遊戲 · 班級聊天室</title>
<style>
:root{
  --r-0:4px;--r-1:8px;--r-2:12px;--r-3:16px;--dur-1:120ms;--dur-2:200ms;--dur-3:280ms;--dur-4:480ms;--ease-out:cubic-bezier(.22,1,.36,1);--ease-inout:cubic-bezier(.4,0,.2,1);--warn-tx:#fca5a5;--ok-tx:#4ade80;--danger:#f87171;--pink-tx:#f472b6;--purple-tx:#a78bfa;--orange-tx:#fdba74;--white-warm:#fff9ec;
  --bg:#0b0d14;--bg-card:#151926;--bg-input:#1c2130;--border:#262c3d;--border-strong:#333b52;
  --text-main:#f2f4f9;--text-sub:#9aa2ba;--accent:#38bdf8;--accent2:#8b5cf6;--gold:#fbbf24;
  --red:#ef4444;--green:#22c55e;--blue:#3b82f6;--yellow:#eab308;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
  src:url('fonts/Inter-latin-var.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'LXGW WenKai TC';font-style:normal;font-weight:400;font-display:swap;
  src:url('fonts/LXGWWenKaiTC-subset.woff2') format('woff2');
  unicode-range:U+2E80-2EFF,U+3000-303F,U+3100-312F,U+31C0-31EF,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FE30-FE4F,U+FF00-FFEF}
/* v1.38.23 跟聊天室共用同一個字體偏好：用戶在個人主頁選了「系統字體」，小遊戲也跟著退 */
html.font-sys body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","PingFang TC","Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans CJK TC","Noto Sans TC",system-ui,sans-serif}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--text-main);font-family:'LXGW WenKai TC','Inter',-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","PingFang TC","Microsoft JhengHei UI","Microsoft JhengHei","Noto Sans CJK TC","Noto Sans TC",system-ui,sans-serif;font-size:15px;line-height:1.5;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
#app{height:100vh;height:100dvh;max-height:100dvh;display:flex;flex-direction:column;overflow:hidden}/* ⚠ 以前係 min-height:100% → 容器跟內容撐高，.cstage 的 flex:1 等於冇作用，俄羅斯方塊等遊戲的控制按鈕被推出屏幕外（用戶實測「UI 組件點不了」）。改成固定視口高度 + 子層 flex:1 + min-height:0，棋盤自己縮，按鈕永遠在畫面內。 */
.hidden{display:none!important}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(11,13,20,.92);backdrop-filter:blur(12px);z-index:20}
/* v1.38.23 連線狀態徽章：玩家一眼睇到「而家用邊個伺服器」 */
.netbadge{margin-left:auto;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.2px;line-height:1.4}
.netbadge.ws{background:rgba(34,197,94,.16);color:#22c55e;border:1px solid rgba(34,197,94,.4)}
.netbadge.fb{background:rgba(245,158,11,.16);color:#f59e0b;border:1px solid rgba(245,158,11,.4)}
.netbadge.off{background:rgba(148,163,184,.14);color:#94a3b8;border:1px solid rgba(148,163,184,.3)}
.netbadge.idle{background:rgba(148,163,184,.10);color:#94a3b8;border:1px solid rgba(148,163,184,.22)}
body.theme-light .netbadge.ws{color:#15803d;border-color:rgba(21,128,61,.4)}
body.theme-light .netbadge.fb{color:#b45309;border-color:rgba(180,83,9,.4)}
body.theme-light .netbadge.off{color:#64748b;border-color:rgba(100,116,139,.35)}
.topbar h1{font-size:17px;margin:0;font-weight:700;flex:1}
.back-btn{background:var(--bg-card);border:1px solid var(--border-strong);color:var(--text-main);width:36px;height:36px;border-radius:var(--r-2);font-size:17px;cursor:pointer}
.back-btn:active{transform:scale(.94)}
.wrap{padding:16px;flex:1;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gcard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-3);padding:14px;cursor:pointer;transition:transform var(--dur-1),border-color var(--dur-1);position:relative;overflow:hidden}
.gcard:active{transform:scale(.97)}
.gcard.on{border-color:var(--accent)}
.gcard.off{opacity:.5}
.gcard .gname{font-size:16px;font-weight:700;margin-bottom:4px}
.gcard .gmeta{font-size:12px;color:var(--text-sub)}
.gcard .gtag{position:absolute;top:10px;right:10px;font-size:10px;padding:2px 7px;border-radius:var(--r-1);background:rgba(56,189,248,.18);color:var(--accent)}
.gcard .gtag.soon{background:rgba(154,162,186,.15);color:var(--text-sub)}
.gicon{width:40px;height:40px;border-radius:var(--r-2);margin-bottom:9px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#0b0d14}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:60}
.sheet .inner{background:var(--bg-card);width:100%;border-radius:var(--r-3) var(--r-3) 0 0;padding:18px;max-height:88vh;overflow-y:auto;animation:up .25s cubic-bezier(.4,0,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 6px;font-size:17px}
.sheet .desc{font-size:13px;color:var(--text-sub);margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--border)}
.row .lbl{font-size:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--bg-input);border:1px solid var(--border-strong);color:var(--text-main);border-radius:var(--r-1);padding:7px 12px;font-size:14px;cursor:pointer;min-width:40px}
.seg button.sel{background:var(--accent);border-color:var(--accent);color:#0b0d14;font-weight:700}
.btn{display:block;width:100%;border:none;border-radius:var(--r-2);padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px;background:var(--accent);color:#0b0d14}
.btn.ghost{background:var(--bg-input);color:var(--text-main);border:1px solid var(--border-strong)}
.btn.danger{background:var(--red);color:#fff}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none}
.plist{display:flex;flex-direction:column;gap:9px;margin:10px 0}
.pitem{display:flex;align-items:center;gap:11px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-2);padding:10px 12px}
.pav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden}
.pav img{width:100%;height:100%;object-fit:cover}
.pname{flex:1;font-size:14px}
.pbadge{font-size:11px;color:var(--text-sub);border:1px solid var(--border-strong);border-radius:var(--r-1);padding:2px 7px}
.countdown{text-align:center;font-size:44px;font-weight:800;color:var(--gold);margin:16px 0 4px;font-variant-numeric:tabular-nums}
.hint{text-align:center;font-size:13px;color:var(--text-sub);margin-bottom:10px}
/* v1.38.21：遊戲卡片懸停微傾 + 按下沉 + 骨架屏 */
.gcard{transition:transform .16s cubic-bezier(.34,1.42,.64,1),box-shadow .2s,border-color .2s;
  transform:perspective(620px) rotateX(calc(var(--py,0) * 1deg)) rotateY(calc(var(--px,0) * 1deg)) translateZ(0);
  will-change:transform}
.gcard:hover{box-shadow:0 10px 26px rgba(0,0,0,.34);border-color:var(--accent)}
.gcard:active{transform:perspective(620px) rotateX(5deg) scale(.972)}
/* v1.38.23：遊戲清單回到上下左右的格狀排列（覆蓋任何殘留的橫向規則） */
.grid{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(148px,1fr))!important;
  gap:12px;overflow:visible!important;flex-wrap:wrap}
.grid .gcard{flex:none!important;width:auto!important}
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.11) 37%,rgba(255,255,255,.05) 63%);
  background-size:400% 100%;animation:shimmer 1.3s ease infinite;border-radius:10px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sk-row{display:flex;align-items:center;gap:11px;padding:11px 12px}
.sk-av{width:36px;height:36px;border-radius:50%}
.sk-lines{flex:1;display:flex;flex-direction:column;gap:7px}
.sk-l1{height:11px;width:52%}
.sk-l2{height:9px;width:78%}
.board-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0}
.zoom-box{width:100%;overflow:auto;-webkit-overflow-scrolling:touch;text-align:center}
canvas{background:#0f1320;border-radius:var(--r-2);border:1px solid var(--border);touch-action:none;-webkit-user-select:none;user-select:none}
.side{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.turnbar{text-align:center;font-size:15px;font-weight:700;padding:10px;border-radius:var(--r-2);background:var(--bg-card);border:1px solid var(--border)}
.turnbar.mine{background:rgba(56,189,248,.14);border-color:var(--accent);color:var(--accent)}

/* 傳炸彈 */
.inputrow{display:flex;gap:9px;margin:12px 0 6px}
.inputrow input{flex:1;min-width:0;background:var(--bg-input);border:1px solid var(--border-strong);border-radius:var(--r-2);color:var(--text-main);font-size:16px;padding:11px 13px;font-family:inherit;touch-action:manipulation}
.inputrow input:focus{outline:none;border-color:var(--accent)}
.inputrow .btn{width:auto;flex:none;padding:0 20px;margin:0}
.bombcat{text-align:center;font-size:34px;font-weight:800;color:var(--gold);margin:6px 0 10px;word-break:break-all;letter-spacing:1px}
.bombgauge{height:12px;border-radius:var(--r-1);background:var(--bg-input);border:1px solid var(--border-strong);overflow:hidden;margin:0 0 6px}
.bombbar{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));transition:width var(--dur-1) linear}
.bombgauge.danger .bombbar{background:linear-gradient(90deg,#f97316,var(--red))}
.bombgauge.danger{animation:bombPulse .5s infinite alternate}
@keyframes bombPulse{from{box-shadow:0 0 0 rgba(239,68,68,0)}to{box-shadow:0 0 14px rgba(239,68,68,.55)}}

/* 劇本殺 */
.smcase,.smcard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-2);padding:13px 14px;margin:10px 0}
.smcard{border-color:var(--accent)}
.smtag{font-size:11px;letter-spacing:2px;color:var(--text-sub)}
.smname{font-size:19px;font-weight:800;margin:3px 0 6px}
.smline{font-size:13px;color:var(--text-main);opacity:.9}
.smsecret{font-size:13px;color:var(--gold);margin-top:8px;border-top:1px dashed var(--border-strong);padding-top:8px}
.smculprit{font-size:13px;font-weight:700;color:var(--red);margin-top:8px}

/* 康樂棋 */
.klboard{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.klcell{position:relative;aspect-ratio:1;border-radius:var(--r-1);background:var(--bg-card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden}
.klcell .klnum{position:absolute;top:2px;left:5px;font-size:10px;color:var(--text-sub);opacity:.8}
.klnum{font-variant-numeric:tabular-nums}
.klcell .klsp{font-size:11px;font-weight:800;color:var(--text-main)}
.klcell.klup{background:rgba(34,197,94,.16);border-color:rgba(34,197,94,.55)}
.klcell.klup .klsp{color:var(--green)}
.klcell.kldown{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.55)}
.klcell.kldown .klsp{color:var(--red)}
.klcell.klstart{border-color:var(--accent);background:rgba(56,189,248,.13)}
.klcell.klend{border-color:var(--gold);background:rgba(251,191,36,.15)}
.kltok{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:2px;flex-wrap:wrap}
.kltok i{width:9px;height:9px;border-radius:50%;border:1px solid rgba(255,255,255,.55)}

/* 鬥獸棋 */
.dsboard{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:10px auto;max-width:420px;aspect-ratio:7/9}
.dscell{position:relative;border-radius:var(--r-1);background:#171b28;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer}
.dscell.dswater{background:rgba(37,99,235,.28);border-color:rgba(59,130,246,.5)}
.dscell.dsden0{background:rgba(56,189,248,.2);border-color:rgba(56,189,248,.75)}
.dscell.dsden1{background:rgba(244,63,94,.2);border-color:rgba(244,63,94,.75)}
.dscell.dstrap0{background:rgba(56,189,248,.34);border-color:rgba(56,189,248,.9)}
.dscell.dstrap1{background:rgba(244,63,94,.34);border-color:rgba(244,63,94,.9)}
.dscell.dssel{outline:3px solid var(--gold);outline-offset:-3px}
.dscell.dsmove::after{content:'';position:absolute;inset:0;border:2px dashed var(--gold);border-radius:var(--r-1);opacity:.85}
.dsg{width:80%;height:80%;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;background:#0f1320}

/* 中國象棋 */
.xqboard{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;margin:10px auto;max-width:420px;aspect-ratio:9/10;
  background:#1b2233;border:1px solid var(--border-strong);border-radius:var(--r-1);padding:3px}
.xqcell{position:relative;display:flex;align-items:center;justify-content:center;border-radius:var(--r-0);background:rgba(255,255,255,.03);cursor:pointer}
.xqcell.xqsel{background:rgba(251,191,36,.20);outline:2px solid var(--gold);outline-offset:-2px}
.xqcell.xqmove::after{content:'';position:absolute;inset:14%;border:2px dashed var(--gold);border-radius:50%;opacity:.8}
.xqg{width:86%;height:86%;border-radius:50%;border:1.5px solid;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;background:#0d1120}

/* 誰是臥底：聊天式的描述紀錄 */
.ucfeed{display:flex;flex-direction:column;gap:9px;max-height:38vh;min-height:110px;overflow-y:auto;
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-2);padding:11px;margin:10px 0;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ucmsg{display:flex;gap:9px;align-items:flex-start}
.ucmsg .pav{width:30px;height:30px;flex:none;font-size:11px}
.ucbody{flex:1;min-width:0}
.ucmeta{font-size:10.5px;color:var(--text-sub);margin-bottom:2px}
.uctext{font-size:13.5px;line-height:1.45;word-break:break-word;background:var(--bg-input);
  border:1px solid var(--border-strong);border-radius:var(--r-1);padding:7px 10px}

/* 投票結果彈框 */
.ucmodal{position:fixed;inset:0;background:rgba(5,7,12,.72);display:flex;align-items:center;justify-content:center;
  z-index:120;padding:20px;animation:ucFade .18s ease}
@keyframes ucFade{from{opacity:0}to{opacity:1}}
.ucmodal-card{background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--r-3);padding:18px 16px;
  width:100%;max-width:400px;max-height:82vh;overflow-y:auto;animation:ucPop .2s ease}
@keyframes ucPop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
.ucmodal-card h3{margin:0;font-size:17px;text-align:center}

/* 大富翁 */
.mpboard{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:3px;margin:10px auto;
  max-width:430px;aspect-ratio:1}
.mpcell{position:relative;border-radius:var(--r-1);background:#171b28;border:2px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:1px}
.mpcell .mpnum{position:absolute;top:1px;left:3px;font-size:8px;color:var(--text-sub);opacity:.75}
.mpcell .mpname{font-size:9px;font-weight:700;line-height:1.05;text-align:center;word-break:keep-all}
.mpcell .mpprice{font-size:8px;color:var(--gold)}
.mpcell .mpowner{font-size:8px;font-weight:700}
.mpcell .mptok{position:absolute;bottom:1px;left:0;right:0;display:flex;justify-content:center;gap:1px;flex-wrap:wrap}
.mpcell .mptok i{width:7px;height:7px;border-radius:50%;border:1px solid rgba(255,255,255,.6)}
.mpcell.mpgo{background:rgba(56,189,248,.16);border-color:rgba(56,189,248,.55)}
.mpcell.mpchance{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.5)}
.mpcell.mptax{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.5)}
.mpcell.mpjail{background:rgba(148,163,184,.16);border-color:rgba(148,163,184,.5)}
.mpcell.mppark{background:rgba(34,197,94,.13);border-color:rgba(34,197,94,.45)}
.mpcell.mppending{animation:bombPulse .5s infinite alternate}
.mpcenter{grid-row:2/8;grid-column:2/8;border-radius:var(--r-2);background:rgba(13,17,32,.72);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;text-align:center}
.mpcenter .mptitle{font-size:15px;font-weight:800;letter-spacing:3px;color:var(--text-sub)}
.mpcenter .btn{width:auto;padding:9px 18px;margin:0}
.mpcenter .inputrow{margin:0}
.dice{width:64px;height:64px;border-radius:var(--r-2);background:linear-gradient(145deg,#232838,#151926);border:1px solid var(--border-strong);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:11px;gap:3px;cursor:pointer}
.dice:active{transform:scale(.94)}
.dice.rolling{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.pip{border-radius:50%;background:#3a4260}
.pip.on{background:#fff}
.cards{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:8px 0}
/* v1.38.16 UNO 官方牌面：彩色卡 + 白色斜橢圓 + 中央大符號 + 四角小符號 */
.uno{position:relative;width:52px;height:78px;border-radius:9px;border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;
  box-shadow:0 3px 8px rgba(0,0,0,.4);padding:0}
.uno .uo{position:absolute;left:50%;top:50%;width:44px;height:28px;
  transform:translate(-50%,-50%) rotate(-18deg);background:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center}
.uno .uo b{font-size:19px;font-weight:800;font-family:"Arial Black",Arial,Helvetica,sans-serif;
  line-height:1;color:var(--uc,#111);letter-spacing:-.5px}
.uno .uc{position:absolute;font-size:9px;font-weight:800;color:#fff;line-height:1;z-index:2;
  text-shadow:0 1px 1px rgba(0,0,0,.35);font-family:"Arial Black",Arial,sans-serif}
.uno .ct{left:4px;top:3px}
.uno .cb{right:4px;bottom:3px;transform:rotate(180deg)}
.uno.playable{outline:3px solid var(--gold);outline-offset:2px}
.uno.r{background:#dc2626;--uc:#dc2626}
.uno.g{background:#16a34a;--uc:#16a34a}
.uno.b{background:#2563eb;--uc:#2563eb}
.uno.y{background:#ca8a04;--uc:#ca8a04}
.uno.w{background:conic-gradient(#dc2626 0 25%,#2563eb 0 50%,#16a34a 0 75%,#ca8a04 0);--uc:#111827}
.uno.sm{width:34px;height:52px;cursor:default}
.uno.sm .uo{width:28px;height:18px}
.uno.sm .uo b{font-size:12px}
.uno.sm .uc{font-size:7px}
.deck-row{display:flex;gap:12px;align-items:center;justify-content:center}
.notice{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,24,36,.96);border:1px solid var(--border-strong);border-radius:var(--r-2);padding:18px 24px;font-size:15px;z-index:99;text-align:center;max-width:80vw;pointer-events:none}
.empty{text-align:center;color:var(--text-sub);padding:50px 20px;font-size:14px}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:var(--r-1);background:var(--bg-input);border:1px solid var(--border-strong);margin:2px}
.stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stat{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-2);padding:9px 13px;font-size:13px}
.stat b{color:var(--accent)}

/* ═══════════════ v1.32 統一外觀 ═══════════════
   深藍漸層面板 + 金色描邊 + 木色棋盤（跟那套 UI 同一個語言）。
   只在最後覆蓋，不動任何遊戲邏輯，所以不會改壞玩法。 */
:root{--gold2:#e2b04a;--panel1:#1a1a2e;--panel2:#16213e;--panel3:#0f3460;
  --wood1:#8a5a32;--wood2:#d29a55;--wood3:#633b21;--woodLine:#6b4f2a}

/* 面板與標題 */
.wrap{background:linear-gradient(135deg,var(--panel1),var(--panel2) 55%,var(--panel3));
  border:1px solid rgba(226,176,74,.28);border-radius:var(--r-3);box-shadow:0 10px 34px rgba(0,0,0,.5);
  padding:16px;margin:10px 12px 18px}
.topbar h1{color:var(--gold2);text-shadow:0 0 14px rgba(226,176,74,.45);letter-spacing:.5px}
.turnbar{background:rgba(226,176,74,.10);border:1px solid rgba(226,176,74,.55);color:var(--gold2);
  border-radius:var(--r-2);font-weight:800}
.turnbar.mine{background:rgba(226,176,74,.22);border-color:var(--gold2);color:var(--white-warm);
  box-shadow:0 0 18px rgba(226,176,74,.35)}
.hint{color:var(--text-sub)}
.countdown{color:var(--gold2);text-shadow:0 0 16px rgba(226,176,74,.5);font-weight:900}

/* 玩家卡片：統一成同一種玻璃卡 */
.pitem{background:rgba(255,255,255,.055);border:1px solid rgba(226,176,74,.22);border-radius:var(--r-2)}
.pname{color:var(--text-main)}
.pbadge{border-color:rgba(226,176,74,.45);color:var(--gold2);background:rgba(226,176,74,.08)}
.pbadge.ai{border-color:rgba(139,92,246,.55);color:#c4b5fd;background:rgba(139,92,246,.14);display:inline-flex;align-items:center;gap:6px}
.pdel{border:0;background:rgba(248,113,113,.18);color:#fca5a5;border-radius:6px;width:18px;height:18px;
  line-height:1;font-size:13px;cursor:pointer;padding:0}
.pdel:active{background:rgba(248,113,113,.32)}
.pav{box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}

/* 木色棋盤容器：所有棋盤類共用 */
.klboard,.mpboard,.dsboard,.bx,.xqboard{
  background:linear-gradient(135deg,var(--wood1),var(--wood2) 45%,var(--wood3));
  border:3px solid #4e2f16;border-radius:var(--r-3);box-shadow:inset 0 0 22px rgba(0,0,0,.45),0 8px 22px rgba(0,0,0,.45);
  padding:9px}
.klboard,.dsboard{gap:4px}
.mpboard{gap:3px}

/* 格子：透明底 + 金色描邊（讓木紋透出來） */
.klcell,.mpcell,.xqg,.dsboard>*{background:rgba(255,255,255,.10)!important;
  border:1px solid rgba(226,176,74,.55)!important;border-radius:var(--r-1)}
.klcell .klsp,.mpcell .mpname,.dsg,.xqg{color:var(--white-warm)}
.klcell .klnum,.mpcell .mpnum,.mpcell .mpprice{color:rgba(255,255,255,.75)}

/* 特殊格保留語意色，但改成半透明疊在木紋上 */
.klcell.klup{background:rgba(34,197,94,.30)!important;border-color:rgba(34,197,94,.85)!important}
.klcell.kldown{background:rgba(239,68,68,.30)!important;border-color:rgba(239,68,68,.85)!important}
.klcell.klstart{background:rgba(56,189,248,.28)!important;border-color:rgba(56,189,248,.85)!important}
.klcell.klend{background:rgba(226,176,74,.32)!important;border-color:var(--gold2)!important}
.mpcell.mpgo{background:rgba(56,189,248,.30)!important;border-color:rgba(56,189,248,.85)!important}
.mpcell.mpchance{background:rgba(226,176,74,.28)!important;border-color:rgba(226,176,74,.85)!important}
.mpcell.mptax{background:rgba(239,68,68,.28)!important;border-color:rgba(239,68,68,.85)!important}
.mpcell.mpjail,.mpcell.mppark{background:rgba(255,255,255,.18)!important}

/* canvas 類棋盤（飛行棋／國際象棋／圍棋）：加木框與圓角 */
canvas#cv{background:linear-gradient(135deg,var(--wood1),var(--wood2) 45%,var(--wood3));border:3px solid #4e2f16;border-radius:var(--r-3);
  box-shadow:inset 0 0 22px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.45);max-width:100%}

/* 骰子、籌碼、卡片 */
.dice{background:rgba(255,255,255,.10);border:2px solid var(--gold2);border-radius:var(--r-2);
  color:var(--gold2);box-shadow:0 0 16px rgba(226,176,74,.3)}
.chip,.cards>div,.deck-row>div{border-color:rgba(226,176,74,.5)!important}
.klsp{color:var(--white-warm)}
.kltok i,.mptok i{box-shadow:0 0 0 1px rgba(0,0,0,.45)}

/* 炸彈／你畫我猜／劇本殺 的區塊也統一 */
.bombgauge{background:rgba(0,0,0,.35);border-color:rgba(226,176,74,.45)}
.bombcat{color:var(--gold2)}

/* ═══ v1.33 桌遊棋盤：照 UI 規範修 ═══ */
/* 康樂棋：圓形跑道（52 格繞圓周） */
.klring{position:relative;width:100%;max-width:430px;aspect-ratio:1;margin:12px auto;border-radius:50%;
  background:radial-gradient(circle,#0f3460 0 26%,rgba(226,176,74,.20) 27% 56%,rgba(233,69,96,.14) 57% 100%);
  border:12px solid var(--gold2);box-shadow:inset 0 0 34px rgba(0,0,0,.75),0 10px 30px rgba(0,0,0,.5)}
.klring .klhub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  color:var(--gold2);font-weight:900;letter-spacing:3px;opacity:.8;font-size:15px}
.klring .klcell{position:absolute;width:8.6%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%!important;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.14)!important;border:1px solid rgba(226,176,74,.65)!important}
.klring .klcell .klnum{position:static;font-size:7.5px;opacity:.9;color:var(--white-warm)}
.klring .klcell .klsp{position:absolute;bottom:-2px;font-size:7px}
.klring .klcell .kltok{position:absolute;left:0;right:0;bottom:-7px}
.klring .klcell .kltok i{width:6px;height:6px}

/* 大富翁：中央改成環形色帶（規範的 conic 環） */
.mpboard{border:12px solid var(--gold2)!important;border-radius:var(--r-3)!important;
  background:linear-gradient(135deg,var(--wood1),var(--wood2) 45%,var(--wood3))!important}
.mpcenter{background:conic-gradient(#e94560 0 10%,#4a90d9 0 20%,#e2b04a 0 30%,#52b788 0 40%,
  #e94560 0 50%,#4a90d9 0 60%,#e2b04a 0 70%,#52b788 0 80%,#e94560 0 90%,#4a90d9 0)!important;
  border:3px solid var(--gold2)!important;border-radius:var(--r-3)!important;
  box-shadow:inset 0 0 24px rgba(0,0,0,.75)!important}

/* 鬥獸棋：河、獸穴、陷阱要看得見（規範：河藍、穴紅、陷阱紅虛線） */
.dswater{background:rgba(74,144,217,.55)!important;border-color:rgba(74,144,217,.95)!important}
.dsden0,.dsden1{background:rgba(233,69,96,.32)!important;border:3px solid #e94560!important;
  box-shadow:inset 0 0 12px rgba(233,69,96,.7)!important}
.dstrap0,.dstrap1{border:2px dashed #e94560!important;background:rgba(233,69,96,.10)!important}

/* 棋盤外框加厚成規範的木框 */
canvas#cv{border:12px solid #a8753c!important;border-radius:var(--r-3)!important}

/* 大廳自由／單人遊戲的畫布：不要桌遊的木色底同木框（上面兩條 canvas#cv 是給棋盤用的，
   但貪吃蛇、俄羅斯方塊的畫布同樣叫 cv，會被一起染成木色，連邊框都食掉畫面） */
.cwrap canvas#cv{background:var(--bg)!important;border:0!important;border-radius:0!important;box-shadow:none!important;max-width:none}

/* v1.33 中國象棋：楚河漢界 */
.xqboard{position:relative}
.xqriver{position:absolute;left:5%;right:5%;top:50%;transform:translateY(-50%);text-align:center;
  color:#5a3517;font-weight:900;letter-spacing:6px;font-size:12px;pointer-events:none;
  background:rgba(210,154,85,.94);border-top:1px solid rgba(99,59,33,.45);border-bottom:1px solid rgba(99,59,33,.45);
  padding:3px 0;border-radius:var(--r-0)}

/* v1.35 飛行棋：照參考站版面（整塊 SVG，無木框） */
.fxqboard{width:100%;max-width:400px;background:#0a1d42;border-radius:var(--r-3);padding:6px;box-sizing:border-box}
.fxqboard svg{display:block;width:100%;height:auto}

/* v1.35 圖標系統：內嵌 SVG，24×24、stroke 2、顏色跟著文字（來源風格 Reicon.dev／Lucide，MIT） */
.ico{width:1.15em;height:1.15em;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
.ico-lg{width:1.5em;height:1.5em;vertical-align:-.3em}
.wc-ico .ico{width:1.05em;height:1.05em;vertical-align:-.14em}
.nav-icon .ico{width:1.25em;height:1.25em;vertical-align:0}

/* v1.36 可及性：尊重系統的「減少動態效果」設定（大廠硬性要求） */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* ═══════════════ v1.36 淺色模式 ═══════════════
   以前小遊戲只有深色：聊天室切到淺色之後，打開小遊戲仍然是一整片黑（最明顯的就是
   「選一款遊戲」那個卡片清單）。這是因為小遊戲是 iframe，主題沒有被帶進來。
   現在外層用 ?theme= 帶主題進來，之後使用者再切換時用 postMessage 即時同步；
   下面只覆蓋「介面」（底、卡、線、字），棋盤木色與黑白棋子照舊 —— 那是棋具不是介面，
   換成淺色反而看不清。 */
body.theme-light{
  --bg:#f0f2f5;--bg-card:#ffffff;--bg-input:#f0f2f5;--border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.15);
  --text-main:#1c1e21;--text-sub:#65676b;--white-warm:#3a2a16;
  --gold:#d99a06;--gold2:#b5750a;--panel1:#ffffff;--panel2:#f7f9fc;--panel3:#eaf1f9;
  --danger:#dc2626;--ok-tx:#15803d;
}
body.theme-light .topbar{background:rgba(255,255,255,.92);border-bottom-color:rgba(0,0,0,.08)}
body.theme-light .topbar h1{color:#b5750a;text-shadow:none}
body.theme-light .wrap{background:linear-gradient(135deg,#ffffff,#f7f9fc 55%,#eaf1f9);
  border-color:rgba(181,117,10,.26);box-shadow:0 8px 24px rgba(15,23,42,.10)}
body.theme-light .gcard{background:#ffffff;border-color:rgba(0,0,0,.10)}
body.theme-light .pitem{background:rgba(0,0,0,.035);border-color:rgba(181,117,10,.26)}
body.theme-light .pbadge{background:rgba(181,117,10,.10);border-color:rgba(181,117,10,.45)}
body.theme-light .turnbar{background:rgba(181,117,10,.10);border-color:rgba(181,117,10,.55);color:#8a5a06}
body.theme-light .turnbar.mine{background:rgba(56,189,248,.16);border-color:var(--accent);color:#0369a1;box-shadow:none}
body.theme-light .countdown{text-shadow:none}
body.theme-light .dice{background:rgba(0,0,0,.04);border-color:rgba(181,117,10,.55);color:#8a5a06;box-shadow:none}
body.theme-light .pip{background:#c7cbd4}
body.theme-light .notice{background:rgba(255,255,255,.98);border-color:rgba(0,0,0,.15);color:var(--text-main);
  box-shadow:0 10px 30px rgba(15,23,42,.18)}
body.theme-light .ucmodal{background:rgba(15,23,42,.42)}
body.theme-light .ucmodal-card{border-color:rgba(0,0,0,.12)}
body.theme-light .sheet{background:rgba(15,23,42,.42)}
body.theme-light .sheet .inner{box-shadow:0 -10px 30px rgba(15,23,42,.15)}
body.theme-light .bombgauge{background:rgba(0,0,0,.10);border-color:rgba(181,117,10,.45)}
body.theme-light .ucfeed{background:#fff}
body.theme-light .uctext{background:#fff}
body.theme-light .klring{box-shadow:inset 0 0 26px rgba(15,23,42,.25),0 10px 26px rgba(15,23,42,.18)}
/* 康樂棋的圓形跑道底色本來就是深藍（棋具，維持原樣）→ 上面的字要跟著保持淺色 */
body.theme-light .klring .klcell .klnum,body.theme-light .klring .klcell .klsp{color:#fff9ec}
body.theme-light .klring .klhub{color:#ffd76a}
body.theme-light .kltok i,body.theme-light .mptok i{box-shadow:0 0 0 1px rgba(0,0,0,.35)}
body.theme-light .pav{box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
body.theme-light .seg button.sel{color:#fff}

/* ══ v1.40 三種種類：種類切換列 ══ */
.catbar{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
.catbar button{flex:0 0 auto;background:var(--bg-input);border:1px solid var(--border-strong);color:var(--text-sub);
  border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.catbar button.sel{background:var(--accent);border-color:var(--accent);color:#0b0d14}
.catbar button .cn{opacity:.75;font-weight:500;font-size:12px;margin-left:4px}
.catdesc{font-size:12px;color:var(--text-sub);padding:0 16px 12px;line-height:1.65}
.gcard .glive{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ok-tx);margin-top:5px}
.gcard .glive i{width:6px;height:6px;border-radius:50%;background:var(--ok-tx);display:inline-block;animation:pulse 1.6s var(--ease-inout) infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
.gcard.playing{border-color:var(--gold);box-shadow:0 0 0 1px rgba(226,176,74,.35) inset}

/* ══ v1.40 canvas 類遊戲的版面（大廳自由／單人）══ */
.mgbox{padding:22px 16px;text-align:center;border-radius:18px;background:rgba(148,163,184,.10);
  border:1px solid var(--border-strong);margin:12px 0;min-height:200px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:13px;transition:background .25s}
.mgbox.go{background:rgba(34,197,94,.22);border-color:rgba(74,222,128,.6)}
.mgbig{font-size:44px;line-height:1.1}
.mgmsg{font-size:14px;color:var(--text-main);line-height:1.7}
.mgnum{font-size:32px;font-weight:800;letter-spacing:6px;color:var(--text-main);font-variant-numeric:tabular-nums}
.mgin{width:100%;max-width:220px;padding:12px 14px;border-radius:13px;background:var(--bg-input);
  color:var(--text-main);border:1px solid var(--border-strong);font-size:18px;text-align:center;font-family:inherit}
.dpad{width:56px;height:50px;border-radius:14px;border:1px solid var(--border-strong);
  background:var(--bg-input);color:var(--text-main);font-size:19px;font-family:inherit;cursor:pointer;
  transition:transform .12s ease,background .12s ease}
.dpad.on{transform:scale(.92);background:rgba(59,130,246,.22)}
.cstage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
/* 小恐龍：白底像素畫布，夜晚整塊反色（同 Chrome 一樣）。
   畫面只有 4:1，手機直立時上下會留一大片空，所以加一層很淡的光暈，
   令畫布看起來是「浮在舞台上」而不是貼在一片死黑中間。 */
.dinowrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  position:relative;padding:10px 12px max(10px,6vh) 12px}
.dinowrap::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(58% 26% at 50% 47%,rgba(148,163,184,.24),transparent 74%)}
/* 陰影一定要放在外層容器：夜晚是把 canvas 整個 invert，
   陰影若掛在 canvas 身上會一齊被反色，變成一大圈白色光暈。 */
.dinoscreen{position:relative;max-width:100%;border-radius:10px;overflow:hidden;
  background:#f7f7f7;line-height:0;transition:background-color .9s ease;
  box-shadow:0 0 0 1px rgba(255,255,255,.07),0 10px 34px rgba(0,0,0,.42),0 2px 8px rgba(0,0,0,.28)}
.dinoscreen.screen-night{background:#080808}
.dinoscreen canvas{display:block;max-width:100%;background:#f7f7f7;border:0;
  image-rendering:pixelated;transition:filter .9s ease}
.dinoscreen canvas.dino-night{filter:invert(1)}
.dinobar{display:flex;align-items:center;gap:10px;padding:6px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.dino-tip{font-size:11.5px;color:var(--text-sub);flex:1;text-align:center}
.dino-pad{display:none;gap:8px}
.dino-pad .dbtn{width:64px;height:50px;display:flex;align-items:center;justify-content:center;
  border-radius:14px;background:rgba(148,163,184,.16);border:1px solid rgba(148,163,184,.45);
  font-size:15px;font-weight:700;color:var(--text);user-select:none;-webkit-user-select:none;
  touch-action:none;transition:transform .1s,background .15s}
.dino-pad .dbtn.on{background:var(--accent);border-color:var(--accent);color:#0b0d14;transform:scale(.95)}
.cwrap{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
.cwrap canvas{display:block;width:100%;height:100%}
.hudtop{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:3}
.hudcard{background:rgba(10,13,20,.66);backdrop-filter:blur(10px);border:1px solid var(--border-strong);border-radius:var(--r-2);padding:6px 9px}
body.theme-light .hudcard{background:rgba(255,255,255,.82)}
.lb{min-width:118px;max-width:44vw}
.lb .lbt{font-size:10.5px;letter-spacing:.6px;color:var(--text-sub);margin-bottom:4px}
.lb .lbrow{display:flex;align-items:center;gap:5px;font-size:11.5px;font-variant-numeric:tabular-nums;padding:1px 0}
.lb .lbrow.me .lbn{color:var(--gold);font-weight:700}
.lb .lbr{width:15px;text-align:right;color:var(--text-sub);font-size:11px}
.lb .lbv{margin-left:auto;font-weight:700}
.lb .lbd{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.lb .lbempty{color:var(--text-sub);font-size:11px}
.stats{display:flex;gap:14px;font-variant-numeric:tabular-nums}
.stats>div{text-align:center}
.stats .sv{font-size:17px;font-weight:800}
.stats .sl{font-size:10px;color:var(--text-sub);letter-spacing:.4px}
.ctrls{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;z-index:6;pointer-events:none}
.ctrls>*{pointer-events:auto}
.padbtn{width:74px;height:74px;border-radius:50%;background:rgba(56,189,248,.18);border:1px solid rgba(56,189,248,.5);color:var(--accent);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;cursor:pointer}
.padbtn:active,.padbtn.on{background:var(--accent);color:#0b0d14;transform:scale(.95)}
/* v1.38.16 貪吃蛇改用虛擬搖桿（取代四個方向鍵）：拖去邊就走邊，唔會排隊轉向 */
.joy{width:118px;height:118px;border-radius:50%;background:rgba(56,189,248,.12);
  border:2px solid rgba(56,189,248,.4);position:relative;touch-action:none;
  display:flex;align-items:center;justify-content:center}
.joyknob{width:52px;height:52px;border-radius:50%;background:rgba(56,189,248,.8);
  border:1px solid rgba(255,255,255,.55);box-shadow:0 2px 8px rgba(0,0,0,.4);
  transition:transform .05s linear}
.ctrls .padwrap{display:none}
.ctrls.touch .padwrap{display:block}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:7px}
.dbtn{background:rgba(148,163,184,.16);border:1px solid rgba(148,163,184,.45);border-radius:15px;padding:0;
  display:flex;align-items:center;justify-content:center;color:var(--text-main);touch-action:none;
  -webkit-tap-highlight-color:transparent;cursor:pointer;transition:background .12s,transform .12s}
.dbtn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.dbtn.on{background:var(--accent);border-color:var(--accent);color:#0b0d14;transform:scale(.94)}
.dbtn.up{grid-area:1/2}.dbtn.left{grid-area:2/1}.dbtn.right{grid-area:2/3}.dbtn.down{grid-area:3/2}
body.theme-light .dbtn{background:rgba(15,23,42,.07);border-color:rgba(15,23,42,.18)}
body.theme-light .dbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.kbd{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:8px}
.kbd .k{background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--r-2);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--text-main);user-select:none;-webkit-user-select:none;cursor:pointer}
.kbd .k:active,.kbd .k.on{background:var(--accent);color:#0b0d14}
.kbd .k.wide{grid-column:span 3;height:46px;font-size:14px;font-weight:700}
.specbar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(10,13,20,.8);border:1px solid var(--gold);
  border-radius:var(--r-2);padding:10px 18px;font-size:14px;color:var(--gold);font-weight:700;z-index:4;pointer-events:none}
body.theme-light .specbar{background:rgba(255,255,255,.88);color:#a16207;border-color:#d5a12a}
.deadmask{position:absolute;inset:0;background:rgba(6,8,13,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:4;backdrop-filter:blur(3px);pointer-events:none}
.deadmask .big{font-size:30px;font-weight:900;letter-spacing:1px}
.deadmask .sub{font-size:13px;color:var(--text-sub);text-align:center;line-height:1.7}
/* ===== 單機遊戲（v1.38.15）：2048／打磚塊／記憶配對／踩地雷／像素小鳥 ===== */
.solo-hud{display:flex;gap:10px;justify-content:center;padding:8px 14px 2px}
.solo-hud .sh{flex:1;max-width:118px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-3);padding:7px 10px;text-align:center}
.solo-hud .sh b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.solo-hud .sh span{font-size:11px;color:var(--text-sub)}
.solo-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.solo-stage canvas{display:block;max-width:100%;max-height:100%;border-radius:14px;background:#070a12}
.g2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;background:#1b2130;border-radius:16px;width:min(86vw,330px);margin:0 auto;touch-action:none}
.g2048 .c{aspect-ratio:1;border-radius:10px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(15px,4.6vw,24px);color:#0b0d14}
.g2048 .c.v2{background:#eee4da}.g2048 .c.v4{background:#ede0c8}
.g2048 .c.v8{background:#f2b179;color:#fff}.g2048 .c.v16{background:#f59563;color:#fff}
.g2048 .c.v32{background:#f67c5f;color:#fff}.g2048 .c.v64{background:#f65e3b;color:#fff}
.g2048 .c.v128{background:#edcf72;color:#fff;font-size:clamp(13px,4vw,21px)}
.g2048 .c.v256{background:#edcc61;color:#fff;font-size:clamp(13px,4vw,21px)}
.g2048 .c.v512{background:#edc850;color:#fff;font-size:clamp(13px,4vw,21px)}
.g2048 .c.v1024{background:#edc53f;color:#fff;font-size:clamp(12px,3.4vw,18px)}
.g2048 .c.v2048{background:#edc22e;color:#fff;font-size:clamp(12px,3.4vw,18px)}
.g2048 .c.big{background:#3c3a32;color:#fff;font-size:clamp(11px,3vw,16px)}
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;width:min(86vw,330px);margin:0 auto}
.memgrid .mc{aspect-ratio:1;border-radius:12px;background:var(--bg-card);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;transition:transform .16s,background .16s}
.memgrid .mc.open{background:var(--bg-input)}
.memgrid .mc.done{opacity:.4;border-color:var(--ok-tx)}
.minesgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;padding:8px;width:min(92vw,340px);margin:0 auto;touch-action:manipulation}
.minesgrid .ms{aspect-ratio:1;border-radius:5px;background:var(--bg-card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:clamp(11px,3.4vw,15px);font-weight:700;cursor:pointer;user-select:none;-webkit-user-select:none}
.minesgrid .ms.open{background:var(--bg-input);border-color:var(--border)}
.minesgrid .ms.flag{color:var(--gold);border-color:var(--gold)}
.minesgrid .ms.boom{background:var(--red);color:#fff}
.solo-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(6,8,14,.74);border-radius:14px;z-index:5}
@keyframes skBob{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(6px);opacity:1}}
/* 按鈕完成打勾 */
.is-done{position:relative;color:transparent!important;overflow:hidden}
.is-done::after{content:'';position:absolute;left:50%;top:50%;width:13px;height:7px;
  border-left:2.4px solid var(--text-main);border-bottom:2.4px solid var(--text-main);
  transform:translate(-50%,-62%) rotate(-45deg) scale(0);border-radius:1px;
  animation:okMark .34s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes okMark{to{transform:translate(-50%,-62%) rotate(-45deg) scale(1)}}
/* 虛擬方向鍵樣式 */
.dpad{position:absolute;right:16px;bottom:18px;width:132px;height:132px;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:4px;z-index:22;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad .dp{grid-column:span 1;display:flex;align-items:center;justify-content:center;
  background:rgba(30,41,59,.72);border:1px solid rgba(148,163,184,.35);
  color:#cbd5e1;font-size:15px;border-radius:11px;cursor:pointer;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:background .12s,transform .1s,color .12s;
  -webkit-tap-highlight-color:transparent}
.dpad .dp.on{background:rgba(56,189,248,.82);color:#04121f;transform:scale(.94);
  border-color:rgba(56,189,248,.9)}
.dpad .u{grid-area:1/2/2/3}
.dpad .l{grid-area:2/1/3/2}
.dpad .r{grid-area:2/3/3/4}
.dpad .d{grid-area:3/2/4/3}
/* 中間留空 */
.dpad::after{content:'';grid-area:2/2/3/3;border-radius:50%;
  background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.18)}

</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref as _fbRef, push as _fbPush, onValue as _fbOnValue, get as _fbGet, set as _fbSet, update as _fbUpdate, remove as _fbRemove, runTransaction as _fbRunTransaction, onDisconnect as _fbOnDisconnect } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
import { Chess } from "./lib/chess.js";
/* ══════════════════════════════════════════════════════════════════════
   v1.38.23 房間 WebSocket（回合制遊戲的傳輸層）
   ──────────────────────────────────────────────────────────────────────
   為甚麼要這樣做：
     17 款連線遊戲全都用 `ref(db,'games/'+rid)` 讀寫房間，散在 58 處。
     逐處改寫等於重寫整個後端，風險極高。
     這裡的做法是「同介面替身」：`games/` 開頭的路徑回傳虛擬 ref，
     之後 get/set/update/remove/runTransaction/onValue/onDisconnect
     自動走 WebSocket，遊戲程式碼一行都不用改。
     `users/`、`lobbyLive/`、`points` 等照舊走 Firebase。
   連不上時：整個分流自動失效，全部回到 Firebase（跟以前一模一樣）。
   ══════════════════════════════════════════════════════════════════════ */
/* 遊戲伺服器網址來源（三個，先到先得）：
     ① 網址 ?ws=            —— 測試／臨時切換
     ② Firebase meta/gamews —— 正式用，管理員在資料庫填一次就全站生效，不必改程式
     ③ 下面這個常數         —— 最後備援
   全部為空 = 完全用 Firebase，跟以前一模一樣。 */
let GAME_WS_URL=(()=>{
  try{
    const q=new URLSearchParams(location.search).get('ws');
    if(q) return q;
  }catch(e){}
  return '';
})();

const roomNet={
  ws:null, ready:false, connecting:null, cid:1, pend:new Map(),
  subs:new Map(),          /* rid -> Map(token -> {path, cb}) */
  backoff:0, dead:false,
  connect(){
    if(this.ready) return Promise.resolve(true);
    if(this.connecting) return this.connecting;
    if(this.dead||!GAME_WS_URL) return Promise.resolve(false);
    this.connecting=new Promise(res=>{
      let ws;
      try{ ws=new WebSocket(GAME_WS_URL); }catch(e){ this.connecting=null; res(false); return; }
      this.ws=ws;
      const to=setTimeout(()=>{
        try{ ws.close(); }catch(e){}
        finish(false);
        try{ onPlayConnectionLost(); }catch(e){}
      },3500);   /* 3.5 秒拿不到就當連不上，唔好要玩家白等 */
      ws.onopen=()=>{ this.ready=true; this.backoff=0; clearTimeout(to); this.connecting=null;
        hideNetBanner();
        for(const rid in this.subs) this.send({t:'rSub',rid});
        res(true);
      };
      ws.onmessage=ev=>{
        this.lastMsgAt=Date.now();
        let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
        if(m.t==='pong'){ this.lastPong=Date.now(); return; }   /* 心跳回應，唔係遊戲資料 */
        if(m.t==='rUpd'){ this.fanout(m.rid, m.v); return; }
        if(m.t==='rListVal'&&m.list){ this.fanoutList(m.v); return; }
        if(m.t==='rVal'||m.t==='rTxOk'||m.t==='rListVal'){
          const p=this.pend.get(m.cid);
          if(p){ this.pend.delete(m.cid); p(m); }
          return;
        }
      };
      /* ⚠ roomNet 唔可以照樣用 6 秒心跳！
         伺服器對房間對局只會在「狀態有變化」時推送（rSnap），等待對手、對手思考時完全靜默。
         用 6 秒超時會把正常空閒誤判成斷線 → 開房的人被自己踢掉 → 永遠顯示「連不上伺服器」。
         （2026-10-24 用戶實測：開房後一直連不上，另一個人卻能加入倒數）
         所以這裡不放心跳，只記 lastMsgAt 供日後除錯；斷線靠 onclose + 重試。 */
      /* ⚠ 心跳暫時停用（2026-10-24 緊急）
         症狀：五子棋開房倒數到 7-8 秒就顯示「伺服器連不上」，然後卡在 0 秒。
         原因：倒數期間房間連接冇遊戲訊息，ping 發出後伺服器似乎冇回 pong，
               15 秒到就主動 close → 倒數被打斷 → 兩邊都卡住。
         先止血：移除心跳，回到靠 ws.onclose（TCP 層）判斷。慢但不會誤殺。
         之後要重做，必須先確認伺服器對「未發 hello 的房間連接」會不會回 pong。 */
      this.lastMsgAt=Date.now();
      this.lastPong=Date.now();
      if(this._hb){ clearInterval(this._hb); this._hb=null; }
      ws.onclose=()=>{
        const wasReady=this.ready;
        if(this._hb){clearInterval(this._hb);this._hb=null;}
        this.ready=false; this.ws=null; this.connecting=null;
        clearTimeout(to);
        /* 在房間裡斷線 → 立即告訴用戶，不要讓佢對着一個沒反應的棋盤 */
        if(this.subs.size) showNetBanner('⚠ 伺服器連不上，操作暫時無效（正在重試）');
        /* 斷線（包括一開始就連不上）：交給判定函式決定要不要賠 */
        try{ onPlayConnectionLost(); }catch(e){}
        /* 還有訂閱就想重連；重連失敗幾次就永久降級回 Firebase */
        if(this.subs.size){
          this.backoff++;
          if(this.backoff>4){
            this.dead=true; this.subs.clear();
            /* PERM_FALLBACK: 唔止標 dead，仲要清空 WS 位址。
               因為 ref() 係靠 `GAME_WS_URL && isRoomPath()` 決定回傳真 ref 定係 {__room:true} 替身；
               只設 dead 唔清位址，之後所有 ref() 仍然回傳替身 → set/onValue 照樣走去連死線 → 永遠卡住。
               清空之後，新開的 ref() 全部走 Firebase，遊戲即刻可以照玩。 */
            try{ GAME_WS_URL=''; LOBBY_WS_URL=''; }catch(e){}
            /* 永久降級：伺服器真係連唔到，但 Firebase 仍然可以用，遊戲照玩。
               唔可以一直掛住紅色「連不上」——改成橙色提示，3 秒後自己收。 */
            showNetBanner('已切換備援模式（Firebase），操作會慢一點');
            setTimeout(hideNetBanner, 3000);
            return;
          }
          setTimeout(()=>{ if(!this.dead) this.connect(); }, 500*this.backoff);
        }
      };
      ws.onerror=()=>{};
    });
    return this.connecting;
  },
  send(o){
    if(this.ready&&this.ws&&this.ws.readyState===1){ try{ this.ws.send(JSON.stringify(o)); }catch(e){} }
    else if(this.subs.size){
      /* 唔好靜默丟棄：用戶按了棋盤、寫入卻被丟掉，畫面會「按了沒反應」 */
      var t=Date.now();
      if(!this._lastWarn||t-this._lastWarn>2500){
        this._lastWarn=t;
        showNetBanner('⚠ 伺服器連不上，這一手沒有送出去');
      }
    }
  },
  async req(o){
    if(!GAME_WS_URL) return null;
    const ok=await this.connect();
    if(!ok||!this.ready) return null;
    const cid=this.cid++;
    return new Promise(res=>{
      this.pend.set(cid,res);
      o.cid=cid;
      this.send(o);
      setTimeout(()=>{ if(this.pend.has(cid)){ this.pend.delete(cid); res(null); } },4000);
    });
  },
  fanout(rid, v){
    const map=this.subs.get(rid);
    if(!map) return;
    for(const it of map.values()){ try{ it.cb(mkSnap(valAt(v, it.path))); }catch(e){} }
  },
  listSubs:new Map(),
  subList(game, cb){
    const token=Math.random().toString(36).slice(2);
    this.listSubs.set(token,{game:game||'*',cb});
    this.connect().then(ok=>{ if(ok) this.send({t:'rListSub', game:game||'*'}); });
    return ()=>{ this.listSubs.delete(token); };
  },
  fanoutList(v){
    for(const it of this.listSubs.values()){ try{ it.cb(mkSnap(v)); }catch(e){} }
  },
  sub(rid, path, cb){
    let map=this.subs.get(rid);
    if(!map){ map=new Map(); this.subs.set(rid,map); }
    const token=Math.random().toString(36).slice(2);
    map.set(token,{path:path||'',cb});
    this.connect().then(ok=>{
      if(ok) this.send({t:'rSub',rid});
      else if(!this.ready){ /* 連不上就用快照 null 讓畫面不卡住 */ try{ cb(mkSnap(null)); }catch(e){} }
    });
    return ()=>{
      const mp=this.subs.get(rid);
      if(!mp) return;
      mp.delete(token);
      if(!mp.size){ this.subs.delete(rid); this.send({t:'rUnsub',rid}); }
    };
  }
};

function valAt(obj, path){
  if(!path) return obj===undefined?null:obj;
  const segs=String(path).split('/').filter(Boolean);
  let cur=obj;
  for(const s of segs){
    if(cur==null||typeof cur!=='object') return null;
    cur=cur[s];
    if(cur===undefined) return null;
  }
  return cur===undefined?null:cur;
}
function mkSnap(v){ return { val(){ return v===undefined?null:v; }, exists(){ return v!==null&&v!==undefined; } }; }
function isRoomPath(p){ return typeof p==='string'&&(p==='games'||p.indexOf('games/')===0); }
function parseRoom(p){
  const segs=String(p).split('/').filter(Boolean);
  return { rid:segs[1]||'', path:segs.slice(2).join('/'), isList:segs.length<=1 };
}

/* ── 分流：只有 games/ 走 WebSocket，其餘照舊 Firebase ── */
function ref(dbOrPath, path){
  const p=(path===undefined)?dbOrPath:path;
  if(GAME_WS_URL&&isRoomPath(p)){
    const r=parseRoom(p);
    return {__room:true, rid:r.rid, path:r.path, raw:p};
  }
  return (path===undefined)?_fbRef(dbOrPath):_fbRef(dbOrPath, path);
}
function push(r){
  /* push(ref(db,'games')) → 在本地產生新房間 id（不必問 Firebase） */
  if(r&&r.__room&&!r.rid){
    return { key:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8) };
  }
  return _fbPush(r);
}
function onValue(r, cb){
  if(r&&r.__room){
    if(r.isList) return roomNet.subList('*', cb);
    const off=roomNet.sub(r.rid, r.path, cb);
    /* 先給一次目前值，避免畫面空等 */
    roomNet.req({t:'rGet', rid:r.rid, path:r.path}).then(m=>{
      if(m&&m.v!==undefined){ try{ cb(mkSnap(m.v)); }catch(e){} }
    });
    return off;
  }
  return _fbOnValue(r, cb);
}
async function get(r){
  if(r&&r.__room){
    const m=await roomNet.req({t:'rGet', rid:r.rid, path:r.path});
    return mkSnap(m?m.v:null);
  }
  return _fbGet(r);
}
async function set(r, v){
  if(r&&r.__room){
    if(!GAME_WS_URL){ return _fbSet(_fbRef(db, r.raw), v); }   /* 已降級 → 直接寫 Firebase */
    await roomNet.connect();                    /* 第一次寫入時連線可能還沒建立 */
    roomNet.send({t:'rSet', rid:r.rid, path:r.path, v:v===undefined?null:v});
    return;
  }
  return _fbSet(r, v);
}
async function update(r, patch){
  if(r&&r.__room){
    if(!GAME_WS_URL){ return _fbUpdate(_fbRef(db, r.raw), patch); }
    await roomNet.connect();
    roomNet.send({t:'rUpd', rid:r.rid, patch});
    return;
  }
  return _fbUpdate(r, patch);
}
async function remove(r){
  if(r&&r.__room){
    await roomNet.connect();
    roomNet.send({t:'rDel', rid:r.rid, path:r.path});
    return;
  }
  return _fbRemove(r);
}
/* 交易：先讀到目前值 → 客戶端算新值 → 伺服器比對後寫入（CAS）。
   中間若被別人改過就不寫，行為接近 Firebase 的 runTransaction。 */
async function runTransaction(r, fn){
  if(r&&r.__room){
    const cur=(await get(r)).val();
    let nv;
    try{ nv=fn(cur); }catch(e){ return {committed:false, snapshot:mkSnap(cur)}; }
    if(nv===undefined) return {committed:false, snapshot:mkSnap(cur)};
    const m=await roomNet.req({t:'rTx', rid:r.rid, path:r.path, expected:cur, v:nv});
    const ok=!!(m&&m.committed);
    return {committed:ok, snapshot:mkSnap(ok?nv:cur)};
  }
  return _fbRunTransaction(r, fn);
}
function onDisconnect(r){
  if(r&&r.__room){
    return {
      set(v){ roomNet.connect().then(()=>roomNet.send({t:'rOnDis', rid:r.rid, path:r.path, v:v===undefined?null:v})); return Promise.resolve(); },
      remove(){ roomNet.connect().then(()=>roomNet.send({t:'rOnDis', rid:r.rid, path:r.path, v:null})); return Promise.resolve(); },
      cancel(){ roomNet.send({t:'rOnDis', cancel:true}); return Promise.resolve(); }
    };
  }
  return _fbOnDisconnect(r);
}

/* ===== v1.28 對比處理 =====
   棋子／頭像用玩家自己的顏色。用「對比度」判斷夠不夠分明（不是簡單的亮度差）：
   對比度 < 2.5 就自動補一圈描邊（淺底描深、深底描淺），
   頭像上的字也自動選黑或白。描邊用 box-shadow 畫，不會改變排版尺寸。 */
const UI_CARD_BG='#151926';
function lumOf(hex){
  const c=String(hex||'').replace('#','').trim();
  if(c.length!==6)return 0.5;
  const f=i=>{const v=parseInt(c.substr(i,2),16)/255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
  return 0.2126*f(0)+0.7152*f(2)+0.0722*f(4);
}
/** 目前卡片的底色（跟著主題走，不寫死） */
function curCardBg(){
  try{
    const v=getComputedStyle(document.documentElement).getPropertyValue('--bg-card').trim();
    if(/^#[0-9a-fA-F]{6}$/.test(v))return v;
  }catch(e){}
  return UI_CARD_BG;
}
/** WCAG 對比度（1 = 完全一樣，21 = 黑對白） */
function contrastRatio(aHex,bHex){
  const la=lumOf(aHex), lb=lumOf(bHex);
  return (Math.max(la,lb)+0.05)/(Math.min(la,lb)+0.05);
}
/** 需要描邊就回傳描邊色，不需要回空字串 */
function contrastStroke(fill,bg){
  const b=bg||curCardBg();
  if(contrastRatio(fill,b)>=2.5)return '';
  return (lumOf(b)>0.5)?'#14181F':'#F5F7FA';
}
/** 玩家顏色的色塊（小圓點用） */
function chipStyle(fill,bg){
  const st=contrastStroke(fill,bg);
  return 'background:'+fill+(st?(';box-shadow:0 0 0 2px '+st):'');
}
/** 頭像：底色 + 必要描邊 + 自動字色（不然白頭像配白字＝看不到） */
function pavStyle(fill,bg){
  const b=bg||curCardBg();
  const st=contrastStroke(fill,b);
  const txt=(lumOf(fill)>0.55)?'#14181F':'#FFFFFF';
  return 'background:'+fill+(st?(';box-shadow:0 0 0 2px '+st):'')+';color:'+txt;
}

/* ── 積分（全部走交易，扣不到就整筆取消；餘額永不為負）── */
async function readPoints(u){
  try{ const s=await get(ref(db,'users/'+u+'/points')); return Number(s.val())||0; }catch(e){ return 0; }
}
async function takePoints(u,n){
  n=Math.floor(Number(n)||0);
  const cur=await readPoints(u);            // 先拉進快取，交易第一輪才不會誤以為餘額 0
  if(n<=0) return {ok:true,bal:cur};
  if(cur<n) return {ok:false,bal:cur};
  let ok=false, bal=cur;
  try{
    await runTransaction(ref(db,'users/'+u+'/points'),c=>{
      /* ⚠ 交易第一輪用本地快取；本地沒有這個節點時 c 是 null。
         回傳 null ＝「維持不存在」，SDK 會拿伺服器值再跑一次；
         直接在這裡中止，就等於連問都不問伺服器（餘額 1200 也會被當成 0）。 */
      if(c===null||c===undefined) return null;
      const v=Number(c)||0;
      if(v<n){ bal=v; return; }             // 餘額不足 → 中止（唔會寫入）
      ok=true; bal=v-n; return v-n;
    });
  }catch(e){ ok=false; }
  if(!ok){
    /* 超大數值（接近 2^53）時交易會無限重試到 maxretry，永遠寫唔入。
       退回「讀一次再寫一次」，並先確認交易其實有沒有偷偷成功。 */
    const now=await readPoints(u);
    if(now===cur-n) return {ok:true,bal:now};       // 交易其實已經扣了
    if(now<n) return {ok:false,bal:now};
    try{ await set(ref(db,'users/'+u+'/points'),now-n); return {ok:true,bal:now-n}; }
    catch(e2){ return {ok:false,bal:now}; }
  }
  return {ok:ok,bal:bal};
}
async function givePoints(u,n){
  n=Math.floor(Number(n)||0);
  if(!u||n<=0) return;
  const base=await readPoints(u);
  try{
    const res=await runTransaction(ref(db,'users/'+u+'/points'),c=>{
      if(c===null||c===undefined) return null;   // 同上：先讓 SDK 取伺服器值
      return (Number(c)||0)+n;
    });
    const sv=res&&res.snapshot?res.snapshot.val():null;
    if(sv!==null&&sv!==undefined&&Number(sv)!==base) return;   // 交易真的寫入了
  }catch(e){}
  // 交易失敗（超大數值 maxretry）或節點本來不存在 → 讀一次再寫一次
  const now=await readPoints(u);
  if(now===base+n) return;                       // 其實已經加了
  try{ await set(ref(db,'users/'+u+'/points'),now+n); }catch(e){}
}

/* ══════════════════════════════════════════════════════════════════════
   v1.38.23 伺服器故障賠償
   ──────────────────────────────────────────────────────────────────────
   規則（用戶定）：**只有伺服器出問題**才賠，客戶端自己斷網不賠。
   怎麼分得清：
     · 伺服器每 10 秒寫一次 meta/gamewsBeat
     · 正常關機會先廣播 bye，並寫 meta/gamewsDown
     · 斷線時若「心跳停了 45 秒以上」或「5 分鐘內有下線標記」 → 判定伺服器故障
   賠幾多：入場費 × 10。
   防濫用：同一個房間只補一次（key 用 rid）、每人每日最多 3 次。
   ══════════════════════════════════════════════════════════════════════ */
const COMP_DAILY_MAX=3, COMP_WINDOW=86400000;
async function serverLooksDown(){
  try{
    const d=await get(ref(db,'meta/gamewsDown'));
    const dv=d.val();
    if(dv&&dv.at&&Date.now()-Number(dv.at)<300000) return true;
  }catch(e){}
  try{
    const b=await get(ref(db,'meta/gamewsBeat'));
    const bv=Number(b.val())||0;
    if(!bv) return false;             /* 從來沒心跳：可能未啟用 WS，不當故障 */
    if(Date.now()-bv>45000) return true;
  }catch(e){}
  return false;
}
async function maybeCompensateServerDown(rid, fee){
  try{
    if(!GAME_WS_URL||!me||!rid) return;
    const f=Math.round(Number(fee)||0);
    if(f<=0) return;
    const done=await get(ref(db,'compensations/'+me.username+'/'+rid));
    if(done.exists()) return;                       /* 同一房只補一次 */
    if(!(await serverLooksDown())) return;          /* 判定唔到係伺服器問題 → 唔賠 */
    const all=await get(ref(db,'compensations/'+me.username));
    const obj=all.val()||{};
    const today=Object.keys(obj).filter(k=>obj[k]&&Date.now()-Number(obj[k].at)<COMP_WINDOW).length;
    if(today>=COMP_DAILY_MAX){ showNotice('今日伺服器故障賠償已達上限（'+COMP_DAILY_MAX+' 次）',2600); return; }
    const amount=f*10;
    await set(ref(db,'compensations/'+me.username+'/'+rid),{fee:f,amount:amount,at:Date.now(),kind:'server_down'});
    await givePoints(me.username, amount);
    showNotice('伺服器出問題，已賠償 '+amount+' 積分（入場費 '+f+' × 10）',3600);
  }catch(e){}
}

/* ── 結算：只有搶到 settled 旗標的那一端負責派彩 ── */
async function settlePot(r,winner,winners){
  const rid=curRoomId; if(!rid) return;
  let rr=r;
  try{ const s=await get(ref(db,'games/'+rid)); if(s.exists()) rr=s.val(); }catch(e){}
  const pot=Number(rr&&rr.pot)||0;
  if(pot<=0) return;
  if(await nodeExists('games/'+rid+'/settled')) return;   // 另一端已經派過
  let res;
  try{ res=await runTransaction(ref(db,'games/'+rid+'/settled'),c=>c===true?undefined:true); }catch(e){ return; }
  if(!res||!res.committed) return;           // 另一端已經派過
  /* AI 玩家不參與派彩：名單只留真人；AI 贏了就當平手，原銀奉還 */
  const names=playerNames(rr).filter(u=>!isAiUser(rr,u));
  const fee=Number(rr.fee)||0;
  let left=pot;
  const give=async(u,n)=>{
    n=Math.min(Math.floor(Number(n)||0),left);
    if(!u||n<=0) return 0;
    left-=n; await givePoints(u,n); return n;
  };
  /* 中途斷線（直接關頁、沒有按退出）的人照樣退一半：付款名單減去現役名單就是走掉的人 */
  const paidMap=rr.paid||{}, refundedMap=rr.refunded||{};
  for(const u of Object.keys(paidMap)){
    if(names.includes(u)) continue;
    if(refundedMap[u]!==undefined) continue;
    const half=Math.floor(fee/2);
    if(half>0&&left>=half){ left-=half; await givePoints(u,half); }
  }
  let winArr=(winners&&winners.length)?winners.filter(u=>names.includes(u)):null;
  if(winArr&&!winArr.length) winArr=null;
  if(winner&&isAiUser(rr,winner)) winner='draw';
  if(!winArr&&winner&&winner!=='draw'&&winner!=='closed'&&!names.includes(winner)) winner='draw';
  if(winner==='closed'||(!winArr&&winner==='draw')){
    for(const u of names){ if(left<=0) break; await give(u,fee); }
    return;
  }
  if(winArr){
    const each=Math.floor(left/winArr.length);
    for(const u of winArr) await give(u,each);
    return;
  }
  if(!names.includes(winner)) return;
  if(names.length<=2){ await give(winner,left); return; }
  await give(winner,Math.floor(left*0.7));    // 3 人以上：冠軍 70%
  const others=names.filter(u=>u!==winner);
  if(others.length){
    // 沒有可靠名次時，餘下 30% 由其他玩家平均分回（不會無中生有，總額永遠 ≤ 彩池）
    const each=Math.floor(left/others.length);
    for(const u of others) await give(u,each);
  }
}
/* ── 中途退出退款（未開局退全額，開局後退一半）── */
async function refundOnLeave(rid){

  const fee=Number(r.fee)||0; if(fee<=0) return;
  if(r.refunded&&r.refunded[me.username]!==undefined) return;
  const back=r.status==='playing'?Math.floor(fee/2):fee;

  try{ await set(ref(db,'games/'+rid+'/refunded/'+me.username),back); }catch(e){ return; }
  await givePoints(me.username,back);
  await addPot(rid,-back);
  showNotice(r.status==='playing'?('中途退出，已退回 '+back+' 積分'):('已退回 '+back+' 積分'));
}

      const canSpec=playing&&r.allowSpectate!==false;
      const canJoin=!playing&&!full;
      const ok=canJoin||canSpec;
      const action=solo?(canSpec?'觀戰':'進行中'):(playing?(canSpec?'觀戰':'已開始'):(full?'已滿':'加入'));
      const state=playing?'進行中':(r.status==='countdown'?'倒數中':'等待中');
      const host=r.host||'';
      const hcolor=(r.players&&r.players[host]&&r.players[host].color)||'#3b82f6';
      return `<div class="pitem" style="margin-bottom:7px">
        <div class="pav" style="${pavStyle(safeColor(hcolor))}">${avatarHTML({displayName:r.hostName||host})}</div>
        <div class="pname" style="flex:1">${escapeHtml(r.hostName||host)} 的${solo?'對局':'房間'}
          <div class="hint" style="margin:2px 0 0;text-align:left">${solo?(pc+' 人在玩 · 觀戰 '+Object.keys(r.spectators||{}).length+' 人'):(pc+'/'+cap+' 人')} · ${state}${r.allowSpectate===false?' · 不可觀戰':''}</div>
        </div>
        <div class="pbadge" data-join="${escAttr(id)}" style="cursor:${ok?'pointer':'default'};${ok?'':'opacity:.45'}">${action}</div>
      </div>`;
    }).join('');
  };
  try{ if(roomsWatch)roomsWatch(); }catch(e){}
  roomsWatch=onValue(ref(db,'games'),snap=>paint(snap.val()));
  sheet.onclick=e=>{
    if(e.target===sheet){ closeRoomsSheet(sheet); return; }
    const j=e.target.closest('[data-join]');
    if(j&&j.style.opacity!=='0.45'){
      const id=j.dataset.join;
      closeRoomsSheet(sheet);
      cameFromInvite=false;   // 自己從清單找的房間 → 退出回大廳
      joinRoom(id);
    }
  };
  sheet.querySelector('#closeRooms').onclick=()=>closeRoomsSheet(sheet);
  sheet.querySelector('#goCreate').onclick=()=>{ closeRoomsSheet(sheet); openCreate(gk); };
}

function openCreate(gk){
  const g=gameDef(gk);
  if(!g.ok){ showNotice('「'+g.n+'」即將推出，敬請期待'); return; }
  if(isLobby(gk)){ enterLobbyGame(gk); return; }
  const solo=isSolo(gk);
  /* v1.40 房主不再自選人數。
     以前有「玩家人數 2/3/4…」那一排，房主選 4 人就得等 4 個人，
     結果 2 個人在裡面乾等。現在開局人數固定 = 這款遊戲的最少人數，
     一達到就自動倒數 15 秒；倒數期間仍然可以繼續進人，最多到 g.max。 */
  pick={g:gk,p:solo?1:g.min,spec:true,level:'normal',prv:false};
  const needTopic=!!GAMES_NEED_TOPIC[gk];
  const lvRow=needTopic?`<div class="row"><div class="lbl">題目難度<br><span style="font-size:11px;color:var(--text-sub)">由 AI 即時出題</span></div><div class="seg" id="segL">${TOPIC_LEVELS.map(l=>`<button data-l="${l.k}" class="${l.k==='normal'?'sel':''}">${l.n}</button>`).join('')}</div></div>`:'';
  const pRow=solo
    ? `<div class="row"><div class="lbl">人數</div><div class="hint" style="margin:0;text-align:left">單人遊戲，開好就直接開始，不用等人</div></div>`
    : `<div class="row"><div class="lbl">開局人數<br><span style="font-size:11px;color:var(--text-sub)">已固定</span></div><div class="hint" style="margin:0;text-align:left">滿 <b style="color:var(--gold)">${g.min}</b> 人自動倒數 15 秒；倒數中可以再進到 ${g.max} 人</div></div>`;
  const prvRow=`<div class="row"><div class="lbl">公開房間<br><span style="font-size:11px;color:var(--text-sub)">不公開就只有拿到連結的人進得來</span></div><div class="seg" id="segV"><button data-v="0" class="sel">公開</button><button data-v="1">不公開</button></div></div>`;
  const inner=`<h3>${solo?'開始：':'開房：'}${escapeHtml(g.n)}</h3><div class="desc">${solo?'開好就直接開始，其他人點這款遊戲就看得見你的對局，可以進來觀戰':'人數一夠就自動倒數 15 秒開局，邀請會發到聊天室'}${needTopic?'；題目由 AI 即時生成，每次都不一樣':''}</div>
    ${pRow}
    ${lvRow}
    ${prvRow}
    <div class="row"><div class="lbl">允許觀戰</div><div class="seg" id="segS"><button data-s="1" class="sel">允許</button><button data-s="0">不允許</button></div></div>
    <button class="btn" id="doCreate">${solo?'直接開始':'發出邀請並開房'}</button>
    <button class="btn ghost" id="cancelCreate">取消</button>`;
  const sheet=document.createElement('div');sheet.className='sheet';sheet.innerHTML=`<div class="inner">${inner}</div>`;
  document.body.appendChild(sheet);
  sheet.onclick=e=>{if(e.target===sheet)sheet.remove();};
  sheet.querySelector('#segS').onclick=e=>{const b=e.target.closest('button');if(!b)return;pick.spec=b.dataset.s==='1';sheet.querySelectorAll('#segS button').forEach(x=>x.classList.toggle('sel',x===b));};
  const segV=sheet.querySelector('#segV');
  if(segV) segV.onclick=e=>{const b=e.target.closest('button');if(!b)return;pick.prv=b.dataset.v==='1';sheet.querySelectorAll('#segV button').forEach(x=>x.classList.toggle('sel',x===b));};
  const segL=sheet.querySelector('#segL');
  if(segL) segL.onclick=e=>{const b=e.target.closest('button');if(!b)return;pick.level=b.dataset.l;sheet.querySelectorAll('#segL button').forEach(x=>x.classList.toggle('sel',x===b));};
  sheet.querySelector('#doCreate').onclick=()=>{sheet.remove();doCreate();};
  sheet.querySelector('#cancelCreate').onclick=()=>sheet.remove();
}

async function nextMsgId(){
  const res=await runTransaction(ref(db,'meta/msgCounter'),c=>(Number(c)||0)+1);
  const seq=res.snapshot.val();return 'msg_'+String(seq).padStart(4,'0');
}
async function doCreate(){
  console.log('[DC] 0 start, pick.g=', pick&&pick.g);
  const g=gameDef(pick.g);
  if(!g){ console.log('[DC] gameDef 返回空'); return; }
  const fee=feeOf(g.k);
  /* v1.41 開房先收費：房主付，這筆就是彩池的第一份 */
  if(fee>0){
    const bal=await readPoints(me.username);
    const ok=await askPay('開房費用 '+fee+' 積分',
      [`「${g.n}」（難度${DIFF_NAME[diffOf(g.k)]}）開房需要 ${fee} 積分，目前有 ${bal} 分。`],
      '確定支付','取消');
    if(!ok) return;
    const t=await takePoints(me.username,fee);
    if(!t.ok){
      await askPay('積分不足',[`開房需要 ${fee} 積分，你目前只有 ${t.bal} 分。`],'知道了','關閉');
      return;
    }
  }
  console.log('[DC] 1 準備 push rid');
  const rid=push(ref(db,'games')).key;
  console.log('[DC] 2 rid=', rid);
  const now=Date.now();
  const solo=isSolo(g.k);
  // 先建房、發邀請（不卡 AI 出題）；題目由 ensureTopic 在後台生成
  // v1.40：minP 固定 = 該遊戲最少人數（房主不能改），setMax = 上限。
  //        單人遊戲建房即開局（status:'playing'），不進等待／倒數。
  const room={game:g.k,gameName:g.n,cat:g.cat||'multi',host:me.username,hostName:me.displayName,
    minP:solo?1:g.min,maxP:g.max,setMax:g.max,allowSpectate:pick.spec,
    private:pick.prv?true:null,solo:solo?true:null,
    status:solo?'playing':'waiting',
    createdAt:now,startAt:null,turn:null,winner:null,state:{},topic:null,
    topicLevel:(GAMES_NEED_TOPIC[g.k]?pick.level:null),
    fee:fee||null,pot:fee||null,paid:fee?{[me.username]:fee}:null,
    players:{[me.username]:{name:me.displayName,color:me.color,avatar:me.avatar||'',seat:0}},
    spectators:{}};
  if(solo){
    // 單人：直接產生局面，不用倒數、不用等題目
    const seed=Math.floor(Math.random()*2147483647);
    const st=initGameState(room, seed);
    room.seed=seed; room.startedAt=sNow(); room.turn=st.turn; room.state=st.state;
  }
  console.log('[DC] 3 開始 set');
  /* ⚠ 用 _fbSet + _fbRef 直接寫真 Firebase：
     原本 set(ref(db,'games/'+rid), room) 在「自設伺服器未設定」的情況下會卡住不返回
     （替身判斷 __room 之後仍然試連 WS → 永遠 pending）。
     建房是核心流程，唔可以靠替身。 */
  let _setErr=null;
  try{
    await _fbSet(_fbRef(db,'games/'+rid), room);
  }catch(e){ _setErr=e; console.log('[DC] set 出錯:', e&&e.message); }
  console.log('[DC] 4 set 完成', _setErr?('err='+_setErr.message):'ok');
  if(_setErr){ try{ showNetBanner('⚠ 開房失敗：'+(_setErr.message||'未知錯誤')); }catch(_){} return; }
  if(solo){ console.log('[DC] 5 joinRoom'); joinRoom(rid); console.log('[DC] 6 已 join'); return; }        // 單人遊戲不發邀請，免得每次玩都洗版
  // 發邀請訊息（走既有訊息系統：msg_ 編號 + createdAt 排序）
  let msgId='msg_'+now;
  try{ msgId=await nextMsgId(); }catch(e){}
  const invite={id:msgId,username:me.username,displayName:me.displayName,seat:me.seat,cls:me.cls,color:me.color,
    avatar:me.avatar,role:me.role,type:'game_invite',text:`邀請你玩 ${g.n}`,
    game:g.k,gameName:g.n,roomId:rid,minP:room.minP,maxP:g.max,createdAt:now,deleted:false};
  await set(ref(db,'messages/'+msgId),invite);
  // 記住邀請訊息編號：對局結束時要把這條訊息標成「已完成」，聊天室的加入按鈕才會消失
  await update(ref(db,'games/'+rid),{msgId:msgId});
  joinRoom(rid);
}

/* 這個房間的題目是否已備妥（各遊戲的題目結構不同，這裡統一判斷） */
function topicReady(r){
  if(!r) return false;
  if(!GAMES_NEED_TOPIC[r.game]) return true;
  const t=r.topic;
  if(!t) return false;
  if(r.game==='undercover'||r.game==='pictionary') return !!(t.words&&t.words.length);
  if(r.game==='bomb') return !!(t.categories&&t.categories.length);
  if(r.game==='scriptmurder') return !!(t.roles&&t.roles.length);
  return true;
}

/* 需要題目的遊戲：任一玩家端在後台補題目（topicGenerating 搶鎖，只出一份） */
async function ensureTopic(r){
  if(!r || r.status==='ended') return;
  const g=gameDef(r.game);
  if(!GAMES_NEED_TOPIC[g.k]) return;
  if(topicReady(r)) return;
  let res;
  try{ res=await runTransaction(ref(db,'games/'+curRoomId+'/topicGenerating'), v=> v===true?undefined:true); }
  catch(e){ return; }
  if(!res.committed) return;   // 別的玩家正在出題
  const lockRef=ref(db,'games/'+curRoomId+'/topicGenerating');
  try{ onDisconnect(lockRef).remove(); }catch(e){}
  // 出題數量依遊戲而定：你畫我猜／劇本殺要看實際人數，傳炸彈固定一串類別
  const pc=Object.keys(r.players||{}).length||(r.minP||2);
  // 只出「夠用就好」的數量：吐的字越少回得越快。
  // 誰是臥底每回合只用 1 組（給 2 組留一點變化）、傳炸彈 3 類、你畫我猜按人數折半、劇本殺必須一人一角。
  const tn=g.k==='undercover'?2:(g.k==='bomb'?3:(g.k==='pictionary'?Math.max(2,Math.ceil(pc/2)):Math.max(4,pc)));
  const lvl=r.topicLevel||'normal';
  let topic=null;
  try{ topic=await aiMakeTopic(g.k,lvl,tn); }catch(e){ topic=null; }
  if(!topic || !topicReady({game:g.k,topic:topic})){
    // AI 失敗 → 用內置保底題材（各遊戲自己的 fallback）
    const np=Math.max(4,pc);
    if(g.k==='pictionary') topic={level:lvl,words:picFallbackWords(lvl,tn),source:'fallback'};
    else if(g.k==='bomb') topic={level:lvl,categories:bombFallbackCategories(lvl,tn),source:'fallback'};
    else if(g.k==='scriptmurder') topic=smFallbackCase(lvl,np);
    else topic={level:lvl,words:ucFallbackPairs(lvl,tn),source:'fallback'};
  }
  if(!topic) return;
  await update(ref(db,'games/'+curRoomId),{topic:topic, topicGenerating:null});
  // 題目就緒後，若人數已夠就（重新）開始倒數
  try{
    const rr=(await get(ref(db,'games/'+curRoomId))).val();
    if(rr){ curRoom=rr; await maybeStartCountdown(); }
  }catch(e){}
}

/* ===== 房間 ===== */
// v1.24 從網址（?room=）進來的「遲到者」：對局在我進來之前就已經結束了
let lateJoin = false;
function joinRoom(rid){
  curRoomId=rid; view='room'; try{window.__roomId=rid;}catch(e){}
  roomWaitStart=Date.now();
  delete payDeclined[rid];          // 重新開一次房間就要重新問一次
  lateJoin=false;
  if(roomSub)roomSub();
  roomSub=onValue(ref(db,'games/'+rid),async snap=>{
    if(!snap.exists()){ curRoom=null; showNotice('房間已不存在或已被關閉'); view='lobby'; render(); return; }
    const prev=curRoom;
    curRoom=snap.val();
    roomWaitStart=0;
    // 第一次收到資料時就已經是「已結束」，而且我不是這場的玩家 → 我是遲到的人
    if(!prev && curRoom.status==='ended' && !(curRoom.players&&curRoom.players[me.username])) lateJoin=true;
    if(!lateJoin) await payUpIfNeeded(curRoom);   // 重開下一局時，各端自己確認入場費
    if(!lateJoin) await ensureMembership();     // 已結束的房間不要再把自己塞進去
    // 人數已經夠了卻還沒開始倒數 → 由「任何一個在房間裡的人」補上。
    // 只在 ensureMembership 裡觸發是不夠的：最後一位可能是別端（例如安卓）加進來的，
    // 那樣兩邊都不會開始倒數，畫面就會一直卡在「人數 2/2 · 等待中」。
    if(!lateJoin) maybeStartCountdown();
    // 修復：startAt 已經寫好了、status 卻還停在 waiting
    //（前一個人在兩次寫入之間斷線，或離線寫入被排隊）→ 任何一個在房間裡的人接手補上。
    if(!lateJoin && curRoom && curRoom.status==='waiting' && curRoom.startAt && !curRoom.solo){
      update(ref(db,'games/'+curRoomId),{status:'countdown'}).catch(()=>{});
    }
    // 倒數已經到期、題目也好了（AI 剛出完）→ 立刻開局，不用再等一輪
    if(!lateJoin && curRoom && curRoom.status==='countdown'
       && (curRoom.startAt||0)<=sNow() && topicReady(curRoom)) tryStartGame();
    await checkAbandon(curRoom);
    // 需要題目但還沒出好 → 後台補（不阻塞介面）
    if(curRoom && GAMES_NEED_TOPIC[curRoom.game] && curRoom.status!=='ended') ensureTopic(curRoom);
    render();
    // 投票結果框要在「所有階段」都會彈（包括投票直接分出勝負、已經進到結束畫面時）
    if(curRoom&&curRoom.game==='undercover') ucShowResultModal();
    if(curRoom&&curRoom.game==='werewolf'){
      wwCheckNight(); wwSettle(); wwAutoDawn(); wwShowVoteModal();
    }
    // 對局一結束（分出勝負／有人退出／房主關房）→ 把聊天室那條邀請標成已完成
    if(curRoom) markInviteDone(curRoom);
    // 引擎驅動的遊戲：由引擎判斷勝負
    if(curRoom&&curRoom.status==='playing'){
      if(curRoom.game==='uno') unoCheckEnd(curRoom);
      else if(curRoom.game==='chess') chessCheckEnd(curRoom);
      else if(curRoom.game==='undercover'){ ucCheckReady(curRoom); ucSettle(); }
      else if(curRoom.game==='pictionary') picCheckEndRound(curRoom);
      else if(curRoom.game==='scriptmurder'){ smCheckReady(curRoom); smTally(); }
      else if(curRoom.game==='doushou') doushouCheckEnd(curRoom);
      else if(curRoom.game==='xiangqi') xqCheckEnd(curRoom);
      else if(curRoom.game==='go') goCheckEnd(curRoom);
      else if(curRoom.game==='checkers') ccCheckEnd(curRoom);
    }
  });
}
/* 對局中有人退出、人數低於下限 → 留下的人判勝；全走光 → 房間關閉 */
async function checkAbandon(r){
  if(!r||r.status!=='playing')return;
  const pc=Object.keys(r.players||{}).length;
  if(pc>=(r.minP||2))return;
  const left=playerNames(r);
  if(left.length===0){
    try{ await update(ref(db,'games/'+curRoomId),{status:'ended',winner:'closed'}); }catch(e){}
    return;
  }
  if(left.length===1){
    showNotice('對手已離開，你獲勝');
    await finishGame(left[0]);
  } else {
    await finishGame('draw');
  }
}
async function ensureMembership(){
  const r=curRoom; if(!r||!me) return;
  const isPlayer=r.players&&r.players[me.username];
  const isSpec=r.spectators&&r.spectators[me.username];
  if(isPlayer||isSpec) return;
  let pcount=r.players?Object.keys(r.players).length:0;
  /* 真人優先：房滿了但裡面有 AI → 踢走最後加入的那個，讓真人進來 */
  if((r.status==='waiting'||r.status==='countdown')&&pcount>=(Number(r.setMax||r.maxP)||2)){
    const ais=aiPlayersOf(r);
    if(ais.length){
      const victim=ais[ais.length-1];
      try{ await remove(ref(db,'games/'+curRoomId+'/players/'+victim)); }catch(e){}
      pcount-=1;
      showNotice('房間已滿，已讓出一個 AI 位置');
    }
  }
  if(r.status==='waiting'||r.status==='countdown'){
    if(pcount<(r.setMax||r.maxP)){
      /* v1.41 入場先問「允不允許扣」，拒絕就退出、一分都不扣 */
      const fee=Number(r.fee)||0;
      const paid=!!(r.paid&&r.paid[me.username]!==undefined);
      if(fee>0&&!paid){
        if(payDeclined[curRoomId]){ exitRoomQuietly(); return; }
        const ok=await chargeEntry(fee);
        if(!ok){
          payDeclined[curRoomId]=1;
          exitRoomQuietly();
          showNotice('未扣積分，已退出');
          return;
        }
      }
      const pr=ref(db,'games/'+curRoomId+'/players/'+me.username);
      await set(pr,{name:me.displayName,color:me.color,avatar:me.avatar||'',seat:pcount});
      // 關鍵：連線斷開時由伺服器自動移除，避免「人退了但還在名單裡」→ 倒數照跑
      registerPresence(pr);
      if(pcount+1>=(r.minP||2)) maybeStartCountdown();
    } else if(r.allowSpectate){
      const sr=ref(db,'games/'+curRoomId+'/spectators/'+me.username);
      await set(sr,{name:me.displayName});
      registerPresence(sr);
      showNotice('對局已滿，已進入觀戰');
    } else { showNotice('對局已滿'); }
  } else if(r.allowSpectate){
    const sr=ref(db,'games/'+curRoomId+'/spectators/'+me.username);
    await set(sr,{name:me.displayName});
    registerPresence(sr);
    showNotice('對局進行中，已進入觀戰');
  } else { showNotice('對局已滿'); }
}
function registerPresence(nodeRef){
  try{ onDisconnect(nodeRef).remove(); }catch(e){}
}
/* 拒絕付費／積分不足 → 斷訂閱、回大廳 */
function exitRoomQuietly(){
  if(roomSub){ try{ roomSub(); }catch(e){} roomSub=null; }
  if(cdTimer){ clearInterval(cdTimer); cdTimer=null; }
  try{ window.__roomId=null; }catch(e){}
  curRoomId=null; curRoom=null; view='lobby';
  render();
}
/* 誰是臥底：全員都按了「我記好了」→ 自動進入描述階段（由任一客戶端推進） */
async function ucCheckReady(r){
  if(!r||r.game!=='undercover'||r.status!=='playing') return;
  const st=ucState(r);
  if(st.phase!=='reveal') return;
  const alive=ucAlive(r), ready=st.ready||{};
  if(!alive.length||!alive.every(u=>ready[u])) return;
  try{ await runTransaction(ref(db,'games/'+curRoomId+'/state/phase'), p=>p==='reveal'?'play':undefined); }catch(e){}
}
/* 對局結束 → 把聊天室那條邀請標記為「已完成」（用房間旗標搶鎖，只寫一次） */
async function markInviteDone(r){
  const rid=r&&r.__rid?r.__rid:curRoomId;
  if(!rid||!r) return;
  if(r.status!=='ended') return;
  if(r.inviteDone) return;
  if(!r.msgId) return;
  let res;
  try{
    res=await runTransaction(ref(db,'games/'+rid+'/inviteDone'),v=>v===true?undefined:true);
  }catch(e){ return; }
  if(!res.committed) return;
  try{ await update(ref(db,'messages/'+r.msgId),{done:true,doneAt:Date.now()}); }catch(e){}
}
async function maybeStartCountdown(){
  const r=curRoom; if(!r) return;
  if(r.solo) return;                          // 單人遊戲：建房就已經開局，沒有倒數
  // 需要題目的遊戲：題目還沒出好就不開始倒數
  if(!topicReady(r)) return;
  // 已經在倒數／已經開局 → 絕對不重新計時（後來進來的人不會把時間拉回去）
  if(r.status!=='waiting') return;
  const pc=r.players?Object.keys(r.players).length:0;
  if(pc<(r.minP||2)) return;
  /* v1.40 倒數要「所有端看到同一個數字」而且「不會重新計時」：
     startAt 用 transaction 寫，而且只有目前是空的時候才寫得進去。
       (1) 之後再有人進來 → 交易不成立 → 直接 return，時間不會被拉回去；
       (2) 好幾個人同時觸發 → 也只有一個人寫得成，不會你寫一次我寫一次；
       (3) 截止時刻用「伺服器時間」算，兩支手機時鐘不同也看到同一個秒數。 */
  let res;
  try{
    res=await runTransaction(ref(db,'games/'+curRoomId+'/startAt'), cur=>{
      if(cur) return undefined;               // 已經有人在倒數了
      return sNow()+COUNTDOWN_MS;
    });
  }catch(e){ return; }
  if(!res.committed) return;
  await update(ref(db,'games/'+curRoomId),{status:'countdown'});
}
/* 倒數期間若人數掉到最少人數以下 → 立即取消倒數（用最新資料，不看快取） */
async function cancelCountdownIfShort(rid){
  const id=rid||curRoomId; if(!id)return;
  try{
    const snap=await get(ref(db,'games/'+id)); if(!snap.exists())return;
    const r=snap.val();
    if(r.status!=='countdown')return;
    const pc=Object.keys(r.players||{}).length;
    if(pc<(r.minP||2)){
      await update(ref(db,'games/'+id),{status:'waiting',startAt:null});
      showNotice('人數不足，已取消倒數');
    }
  }catch(e){}
}

function gameRoomUrl(roomId){
  const rid=roomId||curRoomId||'';
  try{
    const u=new URL(location.href);

    if(/game\.html$/.test(p))p=p.replace(/game\.html$/,'');
    if(/index\.html$/.test(p))p=p.replace(/index\.html$/,'');

let cdTimer=null, cdCheck=0;
function startCountdownTicker(){
  if(cdTimer)clearInterval(cdTimer);
  cdTimer=setInterval(async()=>{
    const el=document.getElementById('cdNum');
    if(!curRoom||curRoom.status!=='countdown'){ clearInterval(cdTimer);cdTimer=null;return; }
    // 用伺服器時間，不然每支手機的秒數會不一樣
    const left=Math.max(0,Math.ceil((curRoom.startAt-sNow())/1000));
    if(el)el.textContent=left;
    // 每 500ms 用最新資料复核人數，人不夠就取消倒數（不看快取，避免退房沒更新）
    cdCheck++;
    if(cdCheck%2===0) await cancelCountdownIfShort();
    if(left<=0){ clearInterval(cdTimer);cdTimer=null; tryStartGame(); }
  },250);
}

async function tryStartGame(){
  const id=curRoomId; if(!id)return;
  // 用最新資料判斷，而不是本地快取
  let r;
  try{
    const snap=await get(ref(db,'games/'+id));
    if(!snap.exists())return;
    r=snap.val();
  }catch(e){ return; }
  if(r.status!=='countdown')return;
  const pc=Object.keys(r.players||{}).length;
  if(pc<(r.minP||2)){ await update(ref(db,'games/'+id),{status:'waiting',startAt:null}); return; }
  // 需要題目的遊戲：題目還沒出好就先不開局，但**不要退回 waiting** ——
  // 留在倒數狀態、畫面顯示「AI 出題中…」，題目一出好就自動開局（下面有自動觸發）。
  if(!topicReady(r)){ markTopicWaiting(); return; }
  // 事務搶鎖：countdown → playing，只允許一個客戶端開局
  let res;
  try{
    res=await runTransaction(ref(db,'games/'+id+'/status'), s=> s==='countdown' ? 'playing' : undefined);
  }catch(e){ return; }
  if(!res.committed) return;
  const seed=Math.floor(Math.random()*2147483647);
  const st=initGameState(r, seed);
  // 引擎驅動的遊戲（uno/chess）：只寫「隨機種子」，動作序列從空開始，各端重放得出同一局面
  await update(ref(db,'games/'+id),{startedAt:sNow(),turn:st.turn||null,winner:null,seed:seed,actions:null,state:(r.game==='uno'||r.game==='chess')?null:st.state,players:st.players});
}

      askPay('確定要退出？',

        '退出','繼續玩').then(resolve).catch(()=>resolve(true));
    }catch(e){ resolve(true); }
  });
}

async function leaveRoom(){
