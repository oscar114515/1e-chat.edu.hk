  const alive = ucAlive(r);
  if (!alive.length) return false;
  if (ucCurDesc(r) !== me.username) { showNotice('現在不是你的回合'); return false; }
  const t = String(text || '').trim();
  if (!t) { showNotice('要先寫一句描述'); return false; }
  if (picNorm(t) === picNorm(ucWordOf(r, me.username))) { showNotice('不可以直接說出你的詞'); return false; }
  const idx = (Number(st.descIdx) || 0);
  const next = idx + 1;
  const done = next >= alive.length;
  await push(ref(db, 'games/' + curRoomId + '/state/descs'), {
    u: me.username, t: t.slice(0, 80), r: Number(st.round) || 1, at: Date.now(),
  });
  const upd = { descIdx: done ? 0 : next };
  if (done) { upd.phase = 'vote'; upd.votes = null; }
  await update(ref(db, 'games/' + curRoomId + '/state'), upd);
  await update(ref(db, 'games/' + curRoomId), { turn: done ? null : (alive[next] || null) });
  return true;
}
/** 投票（或平票後的單獨再投） */
async function ucCastVote(target){
  const r = curRoom; if (!r || r.game !== 'undercover' || r.status !== 'playing') return;
  const st = ucState(r);
  const alive = ucAlive(r);
  if (!alive.includes(me.username)) { showNotice('你已經出局了'); return; }
  if (!alive.includes(target) || target === me.username) return;
  if (st.phase === 'vote') {
    await update(ref(db, 'games/' + curRoomId + '/state/votes'), { [me.username]: target });
  } else if (st.phase === 'runoff') {
    if (!(st.runoff || []).includes(target)) return showNotice('這一輪只能投平票的那幾位');
    if ((st.runoff || []).includes(me.username)) return showNotice('平票的人不能投票');
    await update(ref(db, 'games/' + curRoomId + '/state/runoffVotes'), { [me.username]: target });
  } else return;
  setTimeout(ucSettle, 250);
}
/** 結算：票高者出局；平票 → 只有平票的人被單獨再投一次 */
async function ucSettle(){
  const r = curRoom; if (!r || r.game !== 'undercover' || r.status !== 'playing') return;
  const st = ucState(r), alive = ucAlive(r);
  if (st.phase === 'vote') {
    const votes = st.votes || {};
    if (alive.some(u => !votes[u])) return;                 // 還沒投完
    const cnt = {};
    alive.forEach(u => { const t = votes[u]; if (alive.includes(t) && t !== u) cnt[t] = (cnt[t] || 0) + 1; });
    let max = 0, top = [];
    Object.keys(cnt).forEach(u => { if (cnt[u] > max) { max = cnt[u]; top = [u]; } else if (cnt[u] === max) top.push(u); });
    const target = (top.length === 1) ? 'result' : (top.length > 1 ? 'runoff' : 'result');
    let res;
    try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/state/phase'), p => p === 'vote' ? target : undefined); }
    catch (e) { return; }
    if (!res.committed) return;                             // 別的端已經結算
    if (target === 'runoff') {
      await update(ref(db, 'games/' + curRoomId + '/state'), {
        runoff: top, runoffVotes: null,
        voteResult: { tally: cnt, voters: votes, out: null, tie: true, at: Date.now() },
      });
      return;
    }
    await ucCommitOut(top.length === 1 ? top[0] : null, cnt, votes, top.length !== 1);
    return;
  }
  if (st.phase === 'runoff') {
    const cand = st.runoff || [];
    const voters = alive.filter(u => !cand.includes(u));
    const rv = st.runoffVotes || {};
    if (voters.length && voters.some(u => !rv[u])) return;   // 還沒投完
    const cnt = {}; cand.forEach(u => { cnt[u] = 0; });
    voters.forEach(u => { const t = rv[u]; if (cnt[t] !== undefined) cnt[t]++; });
    let max = -1, top = [];
    cand.forEach(u => { if (cnt[u] > max) { max = cnt[u]; top = [u]; } else if (cnt[u] === max) top.push(u); });
    let res;
    try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/state/phase'), p => p === 'runoff' ? 'result' : undefined); }
    catch (e) { return; }
    if (!res.committed) return;
    await ucCommitOut(top.length === 1 ? top[0] : null, cnt, rv, top.length !== 1);
  }
}
/** 真的把人踢出去，然後看要不要分勝負 */
async function ucCommitOut(out, cnt, voters, tie){
  const r = curRoom; if (!r) return;
  const st = ucState(r);
  const eliminated = (st.eliminated || []).slice();
  if (out && !eliminated.includes(out)) eliminated.push(out);
  const under = st.undercover || [];
  const all = playerNames(r);
  const aliveAfter = all.filter(u => !eliminated.includes(u));
  const underAlive = under.filter(u => aliveAfter.includes(u));
  const civAlive = aliveAfter.length - underAlive.length;
  let teamWin = null;
  if (underAlive.length === 0) teamWin = 'civ';
  else if (civAlive === 0 || underAlive.length >= civAlive) teamWin = 'uc';
  await update(ref(db, 'games/' + curRoomId + '/state'), {
    phase: teamWin ? 'end' : 'result', eliminated: eliminated,
    lastOut: out || null, tie: !!tie, votes: null, runoffVotes: null, runoff: null,
    revealed: !!teamWin, descIdx: 0,
    voteResult: { tally: cnt || {}, voters: voters || {}, out: out || null, tie: !!tie, at: Date.now() },
  });
  if (teamWin) await ucFinish(teamWin, r);
}
/** 出局結果確認後，開始下一輪描述（任何玩家都可以按，不用房主） */
async function ucNextRound(){
  const r = curRoom; if (!r || r.game !== 'undercover') return;
  const st = ucState(r);
  if (st.phase !== 'result') return;
  let res;
  try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/state/phase'), p => p === 'result' ? 'play' : undefined); }
  catch (e) { return; }
  if (!res.committed) return;
  const alive = ucAlive(r);
  await update(ref(db, 'games/' + curRoomId + '/state'), {
    descIdx: 0, round: (Number(st.round) || 1) + 1, votes: null, voteResult: null, lastOut: null, tie: false,
  });
  await update(ref(db, 'games/' + curRoomId), { turn: alive[0] || null });
}
async function ucFinish(teamWin, r){
  if (!r || r.status === 'ended') return;
  let res;
  try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/winner'), w => (w === null || w === undefined) ? ('team:' + teamWin) : undefined); }
  catch (e) { return; }
  if (!res.committed) return;
  const st = ucState(r);
  // 只改需要改的欄位：整份覆蓋會把結算剛寫入的 eliminated 沖掉
  await update(ref(db, 'games/' + curRoomId), { status: 'ended', 'state/phase': 'end', 'state/revealed': true, 'state/teamWin': teamWin });
  const under = st.undercover || [];
  for (const u of playerNames(r)) {
    const won = (teamWin === 'uc') === under.includes(u);
    try {
      await runTransaction(ref(db, 'users/' + u + '/gameStats/undercover'), c => {
        c = c || {}; const w = Number(c.win) || 0, l = Number(c.lose) || 0, p = Number(c.play) || 0;
        return { win: w + (won ? 1 : 0), lose: l + (won ? 0 : 1), play: p + 1 };
      });
    } catch (e) {}
  }
}

function ucPickUnder(names, seed, salt){
  const rng = makeRng(((seed >>> 0) ^ ((salt || 0) * 2654435761)) >>> 0);
  const nUnder = names.length >= 7 ? 2 : 1;
  const idx = names.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
  return idx.slice(0, nUnder).map(i => names[i]);
}

/* ===== 你畫我猜（Pictionary）=====
   每輪一人當畫手、其他人猜；猜中雙方得分；輪流當畫手，全部輪完結算總分。
   畫手筆跡存 games/{id}/state/strokes，其他人即時重繪；題目由 AI 出（三檔難度）。
   注意：題目在資料層對技術用戶可讀（靜態網站無伺服器），UI 只顯示給畫手。
*/
const PIC_FALLBACK = {
  fun: ['刷牙','跳舞','扮鬼臉','打嗝','照鏡子','遛狗','開香檳','切洋蔥','跳廣場舞','騎單車','吹蠟燭','戴假髮'],
  normal: ['太陽','汽車','蘋果','房子','貓','雨傘','蛋糕','眼鏡','書包','時鐘','雨','橋','花','魚','船'],
  hard: ['時間','自由','重力','夢','噪音','記憶','方向','天氣','愛','壓力','距離','速度','未來'],
};
function picFallbackWords(level, n){
  const pool = (PIC_FALLBACK[level] || PIC_FALLBACK.normal).slice();
  const out = [];
  for (let i = 0; i < (n || 3) && pool.length; i++) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  while (out.length < n) out.push(PIC_FALLBACK.normal[out.length % PIC_FALLBACK.normal.length]);
  return out;
}
async function aiPictionaryWords(level, n){
  const lv = TOPIC_LEVELS.find(x => x.k === level) || TOPIC_LEVELS[1];
  const sys = '你是班級桌遊的出題員。不要推理、不要解釋，直接輸出 JSON 陣列。';
  for (let attempt = 0; attempt < 2; attempt++) {
    const usr = `直接輸出 JSON 陣列（不要其他文字）：為「你畫我猜」出 ${n} 個詞，難度${lv.n}（${lv.d}）。` +
      `每個詞 1–6 個字、具體、能用簡單線條畫出來、不要太冷門。格式：["詞1","詞2", ...]`;
    let txt = '';
    try { txt = await callAI(sys, usr, 600); } catch (e) { txt = ''; }
    let j = extractJSON(txt);
    if (!Array.isArray(j) && window.__lastAI && window.__lastAI.reasoning) j = extractJSON(window.__lastAI.reasoning);
    if (Array.isArray(j)) {
      const words = j.filter(w => typeof w === 'string' && w.trim()).slice(0, n).map(w => String(w).trim().slice(0, 8));
      if (words.length) return words;
    }
  }
  return null;
}

/* 猜中或超時後由任一客戶端推進到「本輪結束」 */
async function picCheckEndRound(r){
  if (!r || r.game !== 'pictionary' || r.status !== 'playing') return;
  const st = picState(r);
  if (st.phase !== 'draw') return;
  const names = picAliveNames(r);
  const guesses = st.guesses || {};
  const guessers = names.filter(u => u !== st.drawer);
  const allGuessed = guessers.length && guessers.every(u => guesses[u]);
  const timeout = Date.now() - (st.startAt || 0) > 60000;
  if (!allGuessed && !timeout) return;
  let res;
  try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/state/phase'), p => p === 'draw' ? 'roundEnd' : undefined); }
  catch (e) { return; }
  if (!res.committed) return;
}

/* 下一輪：換畫手；全部輪完 → 結算 */
async function picNextRound(){

  const st = picState(r);
  const names = picAliveNames(r);
  const round = (st.round || 1) + 1;
  const total = names.length;
  if (round > total) {
    await picFinish(r);
    return;
  }
  const words = (r.topic && r.topic.words) || [];
  await update(ref(db, 'games/' + curRoomId + '/state'), {
    phase: 'pick', round: round, drawer: names[round - 1],
    word: words[round - 1] || ('謎' + round), strokes: null, guesses: {}, startAt: null,

/* 猜答案 */
async function picGuess(text){
  const r = curRoom; if (!r || r.game !== 'pictionary') return;
  const st = picState(r);
  if (st.phase !== 'draw') return;
  if (me.username === st.drawer) return;
  if ((st.guesses || {})[me.username]) return;
  if (picNorm(text) === picNorm(st.word)) {
    const scores = Object.assign({}, st.scores || {});
    scores[me.username] = (scores[me.username] || 0) + 2;
    scores[st.drawer] = (scores[st.drawer] || 0) + 1;
    // 用 set 分開寫，避免 update 混用帶「/」深層路徑的坑
    await set(ref(db, 'games/' + curRoomId + '/state/guesses/' + me.username), true);
    await set(ref(db, 'games/' + curRoomId + '/state/scores'), scores);
    showNotice('猜中了！＋2 分');
    setTimeout(() => picCheckEndRound(curRoom), 300);
    checkCheating();   // 猜中後：AI 掃描整幅畫有沒有寫字（防作弊）
  } else {

  }
}
/* 防作弊：把整幅畫送給多模態 AI，檢查有沒有寫出任何文字 */
async function checkCheating(){
  const cv=document.querySelector('#cv'); if(!cv) return;
  let dataUrl;
  try{
    const sc=document.createElement('canvas'); sc.width=sc.height=512;
    sc.getContext('2d').drawImage(cv,0,0,512,512);
    dataUrl=sc.toDataURL('image/png');
  }catch(e){ return; }
  try{ await update(ref(db,'games/'+curRoomId+'/state/cheatCheck'),{status:'checking'}); }catch(e){}
  try{
    const res=await fetch(AI_API,{method:'POST',headers:{'Content-Type':'application/json','api-key':AI_KEY},
      body:JSON.stringify({model:AI_MODEL,stream:false,max_tokens:3000,messages:[
        {role:'system',content:'你是防作弊檢測員。'},
        {role:'user',content:[
          {type:'text',text:'仔細看這張畫，裡面有沒有任何「手寫或畫出來」的文字、字母、數字、注音、拼音？只要畫布上有這類痕跡就當作有。只回 JSON：{"hasText":true/false,"detail":"一句話說明"}。'},
          {type:'image_url',image_url:{url:dataUrl}}
        ]}
      ]})});
    if(!res.ok) throw new Error('AI '+res.status);
    const data=await res.json();
    const msg=(data.choices&&data.choices[0]&&data.choices[0].message)||{};
    const content=msg.content||'';
    const reasoning=msg.reasoning_content||'';
    // 模型會先吐一大段推理，content 可能被截空 → 兩邊都挖 JSON
    let j=extractJSON(content)||extractJSON(reasoning)||{};
    const hasText=(j.hasText===true);
    if(hasText){
      // 作弊成立：扣畫手 3 分（cheatPenalty 事務搶鎖，多個猜手同時猜中只扣一次）
      let lock=null;
      try{ lock=await runTransaction(ref(db,'games/'+curRoomId+'/state/cheatPenalty'), v=> v===true?undefined:true); }catch(e){}
      if(lock && lock.committed){
        const st=picState(curRoom);
        const scores=Object.assign({}, st.scores||{});
        scores[st.drawer]=Math.max(0,(scores[st.drawer]||0)-3);
        await update(ref(db,'games/'+curRoomId+'/state/scores'), scores);
      }
      await update(ref(db,'games/'+curRoomId+'/state/cheatCheck'),{status:'suspicious',detail:(j.detail||'')+'（畫手已扣 3 分）'});
    } else {
      await update(ref(db,'games/'+curRoomId+'/state/cheatCheck'),{status:'clean',detail:j.detail||''});
    }
  }catch(e){
    await update(ref(db,'games/'+curRoomId+'/state/cheatCheck'),{status:'error'});
  }
}
/* 結算：分數最高者勝 */
async function picFinish(r){
  if (!r || r.status === 'ended') return;
  const st = picState(r);
  const scores = st.scores || {};
  let top = [], best = -1;
  Object.keys(scores).forEach(u => { if (scores[u] > best) { best = scores[u]; top = [u]; } else if (scores[u] === best) top.push(u); });
  const winner = (top.length === 1 && best > 0) ? top[0] : 'draw';
  let res;
  try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/winner'), w => (w === null || w === undefined) ? winner : undefined); }
  catch (e) { return; }
  if (!res.committed) return;
  await update(ref(db, 'games/' + curRoomId), { status: 'ended', 'state/phase': 'end', 'state/revealed': true });
  for (const u of playerNames(r)) {
    try {
      await runTransaction(ref(db, 'users/' + u + '/gameStats/pictionary'), c => {
        c = c || {}; const w = Number(c.win) || 0, l = Number(c.lose) || 0, p = Number(c.play) || 0;
        const won = winner !== 'draw' && winner === u;
        return { win: w + (won ? 1 : 0), lose: l + (winner === 'draw' ? 0 : (won ? 0 : 1)), play: p + 1 };
      });
    } catch (e) {}
  }
}

function picClearCanvas(cv){ const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height); }
function picDrawStroke(cv, pts, color, scale){
  const c = cv.getContext('2d');
  if (!pts || pts.length < 2) { if (pts && pts.length === 1) { c.beginPath(); c.arc(pts[0].x * scale, pts[0].y * scale, 3, 0, Math.PI * 2); c.fillStyle = color; c.fill(); } return; }
  c.strokeStyle = color; c.lineWidth = 4; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(pts[0].x * scale, pts[0].y * scale);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x * scale, pts[i].y * scale);
  c.stroke();
}

/* ══════════════════ 傳炸彈（2–10 人）══════════════════

const BOMB_FALLBACK = {

function bombState(r) { return (r && r.state) ? r.state : {}; }

/** 淘汰 victim 之後，依原本的座位順序找下一個還活著的人。 */
function bombNextOf(r, victim) {
  const st = bombState(r), names = playerNames(r);
  const alive = names.filter(u => !(st.out || []).includes(u) && u !== victim);
  if (!alive.length) return '';
  const i = names.indexOf(victim);
  for (let k = 1; k <= names.length; k++) {

    if (alive.includes(u)) return u;
  }

/** 時間到：把炸彈持有者淘汰。用 state/current 當鎖，多端同時觸發也只淘汰一次。 */
async function bombExplode() {
  const id = curRoomId; if (!id) return;
  let r;
  try { const s = await get(ref(db, 'games/' + id)); if (!s.exists()) return; r = s.val(); } catch (e) { return; }

  if (!victim) return;
  if (Date.now() < (Number(st.deadline) || 0) + 350) return;   // 時間還沒真的到
  const next = bombNextOf(r, victim);
  let res;
  try { res = await runTransaction(ref(db, 'games/' + id + '/state/current'), c => c === victim ? (next || '#') : undefined); }
  catch (e) { return; }
  if (!res.committed) return;                                  // 別的端已經處理了
  const out = (st.out || []).concat([victim]);
  const alive = playerNames(r).filter(u => !out.includes(u));
  if (alive.length <= 1) { await finishGame(alive.length === 1 ? alive[0] : 'draw'); return; }
  const cats = (st.categories || []).filter(Boolean);
  const catIdx = cats.length ? ((Number(st.catIdx) || 0) + 1) % cats.length : 0;
  const dur = Math.max(5, Number(st.duration || 20) - 2);
  await update(ref(db, 'games/' + id + '/state'), {
    out: out, current: next, deadline: Date.now() + dur * 1000, duration: dur,

     <div class="bombgauge" id="bombGauge"><div class="bombbar" id="bombBar" style="width:100%"></div></div>
     <div class="hint">剩餘 <b id="bombLeft">–</b> 秒 · 第 ${(Number(st.catIdx) || 0) + 1} 題 ${src}</div>
     ${stage}
     ${usedHtml}
     <div class="plist">${plist}</div>
     <div class="hint">淘汰 ${out.length} 人 · 存活 ${alive.length} 人</div>
   </div>`;

function smState(r) { return (r && r.state) ? r.state : {}; }
/** 全員都按「我已閱讀」→ 自動進入討論（任一玩家的端都可以推進，用 phase 當鎖） */
async function smCheckReady(r) {

async function smTally() {
  const r = curRoom;
  if (!r || r.status !== 'playing' || r.game !== 'scriptmurder') return;
  const st = smState(r);
  if (st.phase !== 'vote' || st.tally) return;
  const names = playerNames(r);
  const votes = st.votes || {};
  const tally = {};
  let voted = 0;
  names.forEach(u => { const v = votes[u]; if (v && names.includes(v)) { tally[v] = (tally[v] || 0) + 1; voted++; } });
  if (voted < names.length) return;                // 還有人沒投
  let top = null, topN = 0, tie = false;
  Object.entries(tally).forEach(([u, c]) => {
    if (c > topN) { topN = c; top = u; tie = false; }
    else if (c === topN) tie = true;
  });
  // tally 當鎖：只有第一個算出結果的端會寫入
  let res;
  try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/state/tally'), c => (c === null || c === undefined || c === '') ? (tie ? 'tie' : (top || 'tie')) : undefined); }
  catch (e) { return; }
  if (!res.committed) return;
  const suspect = tie ? '' : (top || '');
  const caught = !!suspect && suspect === st.culprit;
  await update(ref(db, 'games/' + curRoomId + '/state'), { phase: 'result', revealed: true, tie: tie });
  const winners = names.filter(u => caught ? (u !== st.culprit) : (u === st.culprit));
  await finishGame(caught ? 'team:det' : 'team:cul', winners);
}
function drawScriptMurder(r, g, bar, spec) {

/* ══════════════════ 康樂棋（2–4 人）══════════════════

   最先走到終點（第 52 格）的人贏。骰子由擲骰的端寫進 DB，其餘端照讀。
*/
const KL_N = 52;
const KL_SPECIAL = { 5: 4, 9: -3, 13: 5, 18: -4, 22: 3, 27: -6, 31: 5, 36: -3, 40: 6, 44: -5, 47: 4, 49: -2 };
function klState(r) { return (r && r.state) ? r.state : {}; }
function klPos(r) { const s = klState(r).pos || {}; return s; }
function klCurrent(r) {
  const names = playerNames(r);
  if (!names.length) return '';
  const i = (Number(klState(r).turnIdx) || 0) % names.length;
  return names[i];
}
async function klRoll() {
  const r = curRoom;
  if (!r || r.status !== 'playing' || r.game !== 'konglok') return;
  if (klState(r).rolling) return;
  if (klCurrent(r) !== me.username) return showNotice('還沒輪到你擲骰');
  // rolling 當鎖，避免連點兩次擲出兩次
  let res;
  try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/state/rolling'), v => (v === true) ? undefined : true); }
  catch (e) { return; }
  if (!res.committed) return;
  const st = klState(r);
  const names = playerNames(r);
  const pos = Object.assign({}, st.pos || {});
  names.forEach(u => { if (typeof pos[u] !== 'number') pos[u] = 0; });
  const dice = 1 + Math.floor(Math.random() * 6);
  let np = Math.min(KL_N, (pos[me.username] || 0) + dice);
  let jump = null;
  const sp = KL_SPECIAL[np];
  if (sp) { np = Math.max(0, Math.min(KL_N, np + sp)); jump = sp; }
  pos[me.username] = np;
  const finished = np >= KL_N;
  await update(ref(db, 'games/' + curRoomId + '/state'), {
    dice: dice, pos: pos, rolling: false, lastJump: jump, lastBy: me.username,
    turnIdx: finished ? (Number(st.turnIdx) || 0) : ((Number(st.turnIdx) || 0) + 1) % names.length,
  });
  await update(ref(db, 'games/' + curRoomId), { turn: finished ? me.username : names[((Number(st.turnIdx) || 0) + 1) % names.length] });
  if (finished) await finishGame(me.username);
}
/** 排列方式：7 欄、蛇形（S 形）走。回傳 index → [col,row] */
function klCellPos(i) {
  const COL = 7;
  const row = Math.floor(i / COL);
  const col = (row % 2 === 0) ? (i % COL) : (COL - 1 - (i % COL));
  return [col, row];
}
function drawKonglok(r, g, bar, spec) {
  const st = klState(r), names = playerNames(r);
  const amPlayer = !!r.players[me.username];
  const pos = klPos(r);
  const cur = klCurrent(r);
  const myTurn = (cur === me.username) && !spec;
  const CELL = 44;

  // v1.33 圓形跑道：52 格平均繞圓周（跟棋盤規範的環形跑道一致）
  const cells = [];
  const KL_R = 42.5;                       // 半徑（容器百分比）
  for (let i = 0; i < KL_N; i++) {
    const ang = (-90 + 360 * i / KL_N) * Math.PI / 180;
    const cx = (50 + KL_R * Math.cos(ang)).toFixed(3);
    const cy = (50 + KL_R * Math.sin(ang)).toFixed(3);
    const here = names.filter(u => (pos[u] || 0) === i + 1);
    const sp = KL_SPECIAL[i + 1];
    const cls = i === 0 ? 'klstart' : (i === KL_N - 1 ? 'klend' : (sp > 0 ? 'klup' : (sp < 0 ? 'kldown' : '')));
    cells.push(`<div class="klcell ${cls}" style="left:${cx}%;top:${cy}%" title="${i + 1}">
      <span class="klnum">${i + 1}</span>
      ${sp ? `<span class="klsp">${sp > 0 ? '+' + sp : sp}</span>` : ''}

      <div class="pav" style="${pavStyle(colorOf(r, u))}">${avatarHTML({ displayName: nameOf(r, u) })}</div>
      <div class="pname">${escapeHtml(nameOf(r, u))}${u === me.username ? '（你）' : ''}${u === cur ? ' · 輪到他' : ''}</div>
      <div class="pbadge">第 ${p} 格</div>

  const dj = st.lastJump;
  const jumpMsg = (st.lastBy && dj) ? `<div class="hint">${escapeHtml(nameOf(r, st.lastBy))} 踩到${dj > 0 ? '加速格，前進 ' + dj : '陷阱格，後退 ' + (-dj)} 格</div>` : '';

  else if (myTurn) stage = `<div class="turnbar mine">輪到你擲骰</div>
      <div class="side"><div class="dice${st.dice ? ' rolled' : ''}" id="klDice">${dicePips(Number(st.dice) || 0)}</div></div>
      <button class="btn" id="klRoll">擲骰</button>`;
  else stage = `<div class="turnbar">${escapeHtml(nameOf(r, cur))} 正在擲骰…</div>
      <div class="side"><div class="dice" id="klDice">${dicePips(Number(st.dice) || 0)}</div></div>`;

  appEl.innerHTML = `<div class="topbar"><button class="back-btn" data-act="leave"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)}</h1></div>
   <div class="wrap">
     ${bar}

/* ══════════════════ 鬥獸棋（2 人）══════════════════
   7×9 棋盤：象獅虎豹狼狗貓鼠，大魚食細魚；老鼠可以食象、可以落水，

const DS_RANK = { 鼠: 1, 貓: 2, 狗: 3, 狼: 4, 豹: 5, 虎: 6, 獅: 7, 象: 8 };

const DS_SETUP = [
  [0, 0, '獅'], [6, 0, '虎'],
  [1, 1, '狗'], [5, 1, '貓'],
  [0, 2, '鼠'], [2, 2, '豹'], [4, 2, '狼'], [6, 2, '象'],
  [0, 6, '象'], [2, 6, '狼'], [4, 6, '豹'], [6, 6, '鼠'],

}

  for (const a of actionsOf(r)) {
    if (!a || a.t !== 'mv') continue;
    const f = a.f, to = a.to;
    if (!Array.isArray(f) || !Array.isArray(to)) continue;
    const cell = b[dsKey(f[0], f[1])];
    if (!cell) continue;
    delete b[dsKey(f[0], f[1])];
    b[dsKey(to[0], to[1])] = cell;
  }
  return b;
}
function dsRank(b, c, r) {
  const cell = b[dsKey(c, r)]; if (!cell) return 0;

  const t = DS_TRAP[dsKey(c, r)];
  if (t !== undefined && t !== cell.o) rk = 0;
  return rk;
}
function dsCanTake(b, fc, fr, tc, tr) {
  const a = b[dsKey(fc, fr)], d = b[dsKey(tc, tr)];
  if (!d) return true;                                   // 空格
  if (a.o === d.o) return false;                         // 自己人
  const aw = dsInWater(fc, fr), dw = dsInWater(tc, tr);
  if (aw !== dw && (a.p === '鼠' || d.p === '鼠')) return false;  // 水陸不相犯
  if (a.p === '鼠' && d.p === '象') return true;         // 鼠食象
  if (a.p === '象' && d.p === '鼠') return false;        // 象不能食鼠

  const out = [];
  for (const dir of [-1, 1]) {
    // 橫向跳河
    let cc = c + dir, crossed = false, ok = true;
    while (cc >= 0 && cc < DS_W && dsInWater(cc, r)) { crossed = true; if (b[dsKey(cc, r)]) { ok = false; break; } cc += dir; }
    if (ok && crossed && cc >= 0 && cc < DS_W) out.push([cc, r]);
    // 縱向跳河
    let rr = r + dir, crossed2 = false, ok2 = true;
    while (rr >= 0 && rr < DS_H && dsInWater(c, rr)) { crossed2 = true; if (b[dsKey(c, rr)]) { ok2 = false; break; } rr += dir; }

  const b = dsReplay(r);

      const isDen = (c === DS_DEN[0][0] && rr === DS_DEN[0][1]) || (c === DS_DEN[1][0] && rr === DS_DEN[1][1]);
      const denO = (c === DS_DEN[0][0] && rr === DS_DEN[0][1]) ? 0 : ((c === DS_DEN[1][0] && rr === DS_DEN[1][1]) ? 1 : -1);
      const trapO = DS_TRAP[k];

      if (isDen) cls += ' dsden' + denO;
      if (trapO !== undefined) cls += ' dstrap' + trapO;

      if (legal.some(([lc, lr]) => lc === c && lr === rr)) cls += ' dsmove';
      const colr = cell ? safeColor(colorOf(r, names[cell.o]), '#3b82f6') : '';
      const glyph = cell ? `<span class="dsg" style="color:${colr};border-color:${colr}">${DS_GLYPH[cell.p] || cell.p}</span>` : '';

      <div class="pname">${escapeHtml(nameOf(r, u))}${u === me.username ? '（你）' : ''} · ${i === 0 ? '藍方' : '紅方'}</div>

  appEl.innerHTML = `<div class="topbar"><button class="back-btn" data-act="leave"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)}</h1></div>

     <div class="hint">你執 <b style="color:${safeColor(colorOf(r, me.username), '#3b82f6')}">${mySide === 0 ? '藍方（上）' : (mySide === 1 ? '紅方（下）' : '觀戰')}</b> · 大食細 · 鼠食象 · 獅虎跳河 · 入對方獸穴即勝</div>

/* ══════════════════ 中國象棋（2 人）══════════════════

   o=0＝黑（上方）、o=1＝紅（下方，先走）；座位 0 執紅。

const XQ_GLYPH = {
  0: { K: '將', A: '士', B: '象', N: '馬', R: '車', C: '砲', P: '卒' },   // 黑
  1: { K: '帥', A: '仕', B: '相', N: '傌', R: '俥', C: '炮', P: '兵' },   // 紅

const XQ_COLOR = { 0: '#cbd5e1', 1: '#f87171' };
function xqStart() {
  const b = new Array(90).fill(null);
  for (let c = 0; c < 9; c++) { b[c] = { t: XQ_BACK[c], o: 0 }; b[81 + c] = { t: XQ_BACK[c], o: 1 }; }
  b[2 * 9 + 1] = { t: 'C', o: 0 }; b[2 * 9 + 7] = { t: 'C', o: 0 };
  b[7 * 9 + 1] = { t: 'C', o: 1 }; b[7 * 9 + 7] = { t: 'C', o: 1 };
  for (const c of [0, 2, 4, 6, 8]) { b[3 * 9 + c] = { t: 'P', o: 0 }; b[6 * 9 + c] = { t: 'P', o: 1 }; }

function xqReplay(r) {
  const b = xqStart();
  for (const a of actionsOf(r)) {
    if (!a || a.t !== 'mv') continue;
    const f = Number(a.f), to = Number(a.to);
    if (!Number.isInteger(f) || !Number.isInteger(to) || f < 0 || f > 89 || to < 0 || to > 89) continue;

/* ══════════════════ 狼人殺（6–18 人）══════════════════
   角色：狼人 ×N（人數越多越多）、預言家 ×1、其餘村民。
   流程：夜晚（狼人選要殺誰、預言家查身分）→ 天亮公布死者 → 輪流發言（像聊天）
        → 投票放逐（票高者出局，平票則平票的人單獨再投）→ 入夜再來一次。
   勝負：狼人全出局＝村民勝；存活狼人 ≥ 存活其他人＝狼人勝。
   角色由種子決定，跟其他遊戲一樣各端重算，不信任客戶端寫的中間狀態。

const WW_NAME = { wolf: '狼人', seer: '預言家', villager: '村民' };
function wwState(r){ return (r && r.state) ? r.state : {}; }
function wwAlive(r){ const el = wwState(r).eliminated || []; return playerNames(r).filter(u => !el.includes(u)); }
function wwRoleOf(r, u){ return (wwState(r).roles || {})[u] || ''; }
function wwWolfNames(r){ const rl = wwState(r).roles || {}; return playerNames(r).filter(u => rl[u] === 'wolf'); }
function wwSeerOf(r){ const rl = wwState(r).roles || {}; return playerNames(r).find(u => rl[u] === 'seer') || ''; }
/** 依人數分配角色（種子洗牌，各端一致） */
function wwAssign(names, seed){
  const rng = makeRng((seed >>> 0) || 1);
  const n = names.length;
  const nWolf = n <= 6 ? 1 : (n <= 9 ? 2 : (n <= 12 ? 3 : 4));
  const deck = ['seer'].concat(new Array(nWolf).fill('wolf'));
  while (deck.length < n) deck.push('villager');
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)) % deck.length; const t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
  const roles = {}; names.forEach((u, i) => { roles[u] = deck[i] || 'villager'; });
  return roles;
}
/** 用「假設把某些人算成出局」之後的存活名單判斷勝負 */
function wwWinTeam(r, eliminated){

  const alive = all.filter(u => !(eliminated || []).includes(u));
  const wolves = alive.filter(u => rl[u] === 'wolf').length;
  const others = alive.length - wolves;
  if (wolves === 0) return 'village';
  if (wolves >= others) return 'wolf';
  return null;
}
function wwCurrentWin(r){
  const st = wwState(r);
  const tested = wwWinTeam(r, st.eliminated);
  if (tested) return tested;

async function wwFinish(team, r){

  if (!res.committed) return;
  await update(ref(db, 'games/' + curRoomId), { status: 'ended', 'state/phase': 'end', 'state/revealed': true, 'state/teamWin': team });
  const st = wwState(r), rl = st.roles || {};
  for (const u of playerNames(r)) {
    const isWolf = rl[u] === 'wolf';
    const won = (team === 'wolf') === isWolf;

        c = c || {}; const w = Number(c.win) || 0, l = Number(c.lose) || 0, p = Number(c.play) || 0;
        return { win: w + (won ? 1 : 0), lose: l + (won ? 0 : 1), play: p + 1 };

/** 狼人與預言家都行動完 → 結算今晚的死者 */
async function wwCheckNight(){

  const st = wwState(r);
  if (st.phase !== 'night') return;
  const alive = wwAlive(r), roles = st.roles || {};
  const wolves = alive.filter(u => roles[u] === 'wolf');
  const picks = st.wolfPicks || {};
  if (wolves.length && !wolves.every(u => picks[u])) return;      // 狼人還沒選完
  const seer = alive.find(u => roles[u] === 'seer');
  const sc = (st.seerChecks || {})[seer];
  if (seer && !(sc && sc.night === (Number(st.night) || 1))) return;   // 預言家還沒查
  // 統計狼人選票（同票取座位較前的）
  const cnt = {}; wolves.forEach(u => { const t = picks[u]; if (t && alive.includes(t)) cnt[t] = (cnt[t] || 0) + 1; });
  let max = 0, victim = '';
  playerNames(r).forEach(u => { if ((cnt[u] || 0) > max) { max = cnt[u]; victim = u; } });
  let res;
  try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/state/phase'), p => p === 'night' ? 'dawn' : undefined); }
  catch (e) { return; }
  if (!res.committed) return;
  const eliminated = (st.eliminated || []).slice();
  if (victim && !eliminated.includes(victim)) eliminated.push(victim);
  const win = wwWinTeam(r, eliminated);
  await update(ref(db, 'games/' + curRoomId + '/state'), {
    phase: win ? 'end' : 'dawn', eliminated: eliminated, lastNightVictim: victim || null,
    wolfPicks: null, seerChecks: null, descIdx: 0, dawnAt: Date.now(), revealed: !!win,

async function wwCastVote(target){

    await update(ref(db, 'games/' + curRoomId + '/state/runoffVotes'), { [me.username]: target });

async function wwSettle(){
  const r = curRoom; if (!r || r.game !== 'werewolf' || r.status !== 'playing') return;
  const st = wwState(r), alive = wwAlive(r);
  if (st.phase === 'vote') {
    const votes = st.votes || {};
    if (alive.some(u => !votes[u])) return;
    const cnt = {};
    alive.forEach(u => { const t = votes[u]; if (alive.includes(t) && t !== u) cnt[t] = (cnt[t] || 0) + 1; });
    let max = 0, top = [];
    Object.keys(cnt).forEach(u => { if (cnt[u] > max) { max = cnt[u]; top = [u]; } else if (cnt[u] === max) top.push(u); });
    const target = top.length === 1 ? 'result' : (top.length > 1 ? 'runoff' : 'result');
    let res;
    try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/state/phase'), p => p === 'vote' ? target : undefined); }
    catch (e) { return; }
    if (!res.committed) return;
    if (target === 'runoff') {
      await update(ref(db, 'games/' + curRoomId + '/state'), {
        runoff: top, runoffVotes: null,
        voteResult: { tally: cnt, voters: votes, out: null, tie: true, at: Date.now() },
      });
      return;
    }
    await wwCommitOut(top.length === 1 ? top[0] : null, cnt, votes, top.length !== 1);
    return;
  }
  if (st.phase === 'runoff') {
    const cand = st.runoff || [];
    const voters = alive.filter(u => !cand.includes(u));
    const rv = st.runoffVotes || {};
    if (voters.length && voters.some(u => !rv[u])) return;
    const cnt = {}; cand.forEach(u => { cnt[u] = 0; });
    voters.forEach(u => { const t = rv[u]; if (cnt[t] !== undefined) cnt[t]++; });
    let max = -1, top = [];
    cand.forEach(u => { if (cnt[u] > max) { max = cnt[u]; top = [u]; } else if (cnt[u] === max) top.push(u); });
    let res;
    try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/state/phase'), p => p === 'runoff' ? 'result' : undefined); }
    catch (e) { return; }
    if (!res.committed) return;
    await wwCommitOut(top.length === 1 ? top[0] : null, cnt, rv, top.length !== 1);
  }
}
async function wwCommitOut(out, cnt, voters, tie){

    const cur = wwCurSpeaker(r);
    stage = `<div class="turnbar" style="margin-bottom:6px">第 ${night} 天 · 輪流發言（按座位順序）</div>
      <div class="hint" style="margin-bottom:6px">${dead ? '你已出局，只能旁觀' : (cur === me.username ? '輪到你發言' : escapeHtml(nameOf(r, cur)) + ' 正在發言…')}</div>
      ${(cur === me.username && !dead) ? `<div class="inputrow"><input id="wwInput" placeholder="說一句話…" autocomplete="off" maxlength="90"><button class="btn" id="wwSend">送出</button></div>` : ''}
      ${feedHtml}`;
  } else if (phase === 'vote') {
    const votes = st.votes || {}, myVote = votes[me.username];
    const votedN = alive.filter(u => votes[u]).length;
    stage = `<div class="turnbar">放逐投票 · 已投 ${votedN}/${alive.length}</div>
      <div class="hint" style="margin-top:8px">${myVote ? '你投給了 ' + escapeHtml(nameOf(r, myVote)) + '（等其他人）' : (dead ? '你已出局，不能投票' : '選出你認為是狼人的人')}</div>
      ${(!dead && amPlayer && !myVote) ? listFor(alive.filter(u => u !== me.username), 'wvote') : ''}
      ${feedHtml}`;
  } else if (phase === 'runoff') {
    const cand = st.runoff || [], rv = st.runoffVotes || {};
    const voters = alive.filter(u => !cand.includes(u));
    const votedN = voters.filter(u => rv[u]).length;
    const iAmCand = cand.includes(me.username);
    stage = `<div class="turnbar" style="border-color:var(--gold);color:var(--gold)">平票！由 ${cand.map(u => escapeHtml(nameOf(r, u))).join(' 對 ')} 單獨再投一次</div>
      <div class="hint" style="margin-top:8px">${iAmCand ? '你是平票的人，這一輪不能投票' : (rv[me.username] ? '你已經投了（等其他人）' : (dead ? '你已出局' : '投出你認為是狼人的人'))}</div>
      ${(!iAmCand && !dead && amPlayer && !rv[me.username]) ? listFor(cand, 'wvote') : ''}
      <div class="hint">已投 ${votedN}/${voters.length}</div>
      ${feedHtml}`;
  } else if (phase === 'result') {
    const out = st.lastOut;
    stage = `<div class="countdown" style="font-size:26px;color:${out ? 'var(--red)' : 'var(--gold)'}">${out ? escapeHtml(nameOf(r, out)) + ' 被放逐' : '平票，本輪無人被放逐'}</div>
      <div class="hint">身分暫不公開</div>
      ${amPlayer ? `<button class="btn" data-act="wwNight">進入第 ${night + 1} 夜</button>` : ''}`;
  } else {
    stage = `<div class="hint">本局結束</div>`;
  }

  appEl.innerHTML = `<div class="topbar"><button class="back-btn" data-act="leave"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)}</h1></div>
   <div class="wrap">
     ${roleCard}
     ${phase === 'end' ? '' : stage}
     <div class="plist">${plist}</div>
   </div>`;
  const lb = appEl.querySelector('[data-act="leave"]'); if (lb) lb.onclick = leaveRoom;
  const nb = appEl.querySelector('[data-act="wwNight"]');
  if (nb) nb.onclick = wwNextNight;
  appEl.querySelectorAll('[data-wwolf]').forEach(el => el.onclick = () => wwWolfPick(el.dataset.wwolf));
  appEl.querySelectorAll('[data-wseer]').forEach(el => el.onclick = () => wwSeerCheck(el.dataset.wseer));
  appEl.querySelectorAll('[data-wvote]').forEach(el => el.onclick = () => wwCastVote(el.dataset.wvote));
  const gi = appEl.querySelector('#wwInput');
  const gb = appEl.querySelector('#wwSend');
  if (gi && gb) {
    const send = async () => {
      const v = gi.value.trim(); if (!v) return;
      gb.disabled = true;
      const ok = await wwSendDesc(v);
      if (ok) gi.value = ''; else gb.disabled = false;
    };
    gb.onclick = send;
    gi.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    if (wwCurSpeaker(r) === me.username) setTimeout(() => { try { gi.focus(); } catch (e) {} }, 60);
  }
  const fd = appEl.querySelector('#wwFeed');
  if (fd) fd.scrollTop = fd.scrollHeight;
  wwShowVoteModal();
}

/* ══════════════════ 大富翁（2–6 人，簡化版）══════════════════
   28 格環形棋盤：買地、收租、機會卡、稅金、免費停車。
   經過起點收 200；付不出錢就破產出局，最後剩下的人獲勝。
   骰子與結果由「擲骰的那一端」寫入 DB，其餘端照讀（跟康樂棋同一套做法）。
*/
const MP_MONEY0 = 1500, MP_SALARY = 200;
const MP_BOARD = [
  { t: 'go', n: '起點' }, { t: 'prop', n: '台北', price: 60 }, { t: 'chance', n: '機會' },
  { t: 'prop', n: '高雄', price: 80 }, { t: 'tax', n: '稅金', amount: 100 }, { t: 'prop', n: '台中', price: 100 },
  { t: 'jail', n: '監獄' }, { t: 'prop', n: '香港', price: 140 }, { t: 'chance', n: '機會' },
  { t: 'prop', n: '東京', price: 180 }, { t: 'prop', n: '首爾', price: 200 }, { t: 'park', n: '免費停車' },
  { t: 'prop', n: '新加坡', price: 220 }, { t: 'chance', n: '機會' }, { t: 'prop', n: '曼谷', price: 240 },
  { t: 'tax', n: '稅金', amount: 150 }, { t: 'prop', n: '雪梨', price: 260 }, { t: 'prop', n: '倫敦', price: 280 },
  { t: 'chance', n: '機會' }, { t: 'prop', n: '巴黎', price: 300 }, { t: 'prop', n: '紐約', price: 320 },
  { t: 'chance', n: '機會' }, { t: 'prop', n: '柏林', price: 340 }, { t: 'prop', n: '羅馬', price: 360 },
  { t: 'park', n: '免費停車' }, { t: 'chance', n: '機會' }, { t: 'prop', n: '杜拜', price: 380 },
  { t: 'prop', n: '里約', price: 400 },
];
const MP_N = MP_BOARD.length;
const mpRent = p => Math.round(p * 0.35);
const MP_CHANCE = [
  { d: 200, t: '銀行派息，收 200' }, { d: -150, t: '繳交維修費，付 150' },
  { d: 100, t: '中了小獎，收 100' }, { d: -100, t: '請大家吃飯，付 100' },
  { d: 300, t: '股票獲利，收 300' }, { d: -200, t: '交通罰款，付 200' },
  { d: 50, t: '拾金不昧，收 50' }, { d: -50, t: '買了杯咖啡，付 50' },
];
/** 把格子索引排到 8×8 的外圈（一圈 28 格） */
function mpCell(i){
  if (i <= 7) return [7, i];
  if (i <= 14) return [7 - (i - 7), 7];
  if (i <= 21) return [0, 7 - (i - 14)];
  return [1 + (i - 22), 0];
}
function mpState(r){ return (r && r.state) ? r.state : {}; }
function mpAlive(r){
  const st = mpState(r), out = st.out || [];
  return playerNames(r).filter(u => !out.includes(u));
}
function mpTurnU(r){
  const st = mpState(r), names = playerNames(r);
  const alive = names.filter(u => !(st.out || []).includes(u));
  if (!alive.length) return '';
  return alive[(Number(st.turnIdx) || 0) % alive.length];
}
async function mpRoll(){
  const r = curRoom; if (!r || r.game !== 'monopoly' || r.status !== 'playing') return;
  const st = mpState(r);
  if (st.pending) return showNotice('要先決定買不買');
  if (st.rolling) return;
  if (mpTurnU(r) !== me.username) return showNotice('還沒輪到你擲骰');
  let res;
  try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/state/rolling'), v => (v === true) ? undefined : true); }
  catch (e) { return; }
  if (!res.committed) return;
  const names = playerNames(r);
  const pos = Object.assign({}, st.pos || {}), money = Object.assign({}, st.money || {});
  names.forEach(u => { if (typeof pos[u] !== 'number') pos[u] = 0; if (typeof money[u] !== 'number') money[u] = MP_MONEY0; });
  const dice = 1 + Math.floor(Math.random() * 6);
  const from = pos[me.username];
  const to = (from + dice) % MP_N;
  let salary = 0;
  const log = [];
  if (to < from) { salary = MP_SALARY; money[me.username] += salary; log.push(`${nameOf(r, me.username)} 經過起點，收 ${salary}`); }
  pos[me.username] = to;
  const cell = MP_BOARD[to];
  const owner = Object.assign({}, st.owner || {});
  let pending = null, extra = {};
  if (cell.t === 'prop') {
    const ow = owner[to];
    if (!ow) pending = { uid: me.username, tile: to };
    else if (ow !== me.username && !(st.out || []).includes(ow)) {
      const rent = mpRent(cell.price);
      money[me.username] -= rent; money[ow] = (money[ow] || 0) + rent;
      log.push(`${nameOf(r, me.username)} 付租金 ${rent} 給 ${nameOf(r, ow)}`);
    } else if (ow === me.username) log.push(`${nameOf(r, me.username)} 回到自己的地`);
  } else if (cell.t === 'tax') {
    money[me.username] -= cell.amount;
    log.push(`${nameOf(r, me.username)} 繳稅 ${cell.amount}`);
  } else if (cell.t === 'chance') {
    const c = MP_CHANCE[Math.floor(Math.random() * MP_CHANCE.length) % MP_CHANCE.length];
    money[me.username] += c.d;
    log.push(`${nameOf(r, me.username)}：${c.t}`);
    extra.lastCard = c.t;
  } else if (cell.t === 'go') log.push(`${nameOf(r, me.username)} 停在起點`);
  // 付不出錢 → 破產
  const out = (st.out || []).slice();
  if (money[me.username] < 0) {
    log.push(`${nameOf(r, me.username)} 付不出錢，破產出局`);
    out.push(me.username);
    const ow2 = Object.assign({}, owner);
    Object.keys(ow2).forEach(k => { if (ow2[k] === me.username) delete ow2[k]; });
    // 破產者的地全部釋出，餘款歸零
    money[me.username] = 0;
    await update(ref(db, 'games/' + curRoomId + '/state'), {
      dice: dice, pos: pos, money: money, owner: ow2, out: out, rolling: false, pending: null,
      log: (st.log || []).concat(log).slice(-40), turnIdx: (Number(st.turnIdx) || 0),
      lastCard: extra.lastCard || null,
    });
    await mpAfterMove(r, out, pos, money, ow2, log);
    return;
  }
  await update(ref(db, 'games/' + curRoomId + '/state'), {
    dice: dice, pos: pos, money: money, owner: owner, rolling: false, pending: pending,
    log: (st.log || []).concat(log).slice(-40),
    turnIdx: pending ? (Number(st.turnIdx) || 0) : ((Number(st.turnIdx) || 0) + 1) % Math.max(1, names.length),
    lastCard: extra.lastCard || null,
  });
  if (!pending) await mpAfterMove(r, out, pos, money, owner, log);
}
async function mpAfterMove(r, out, pos, money, owner, log){
  const alive = playerNames(r).filter(u => !out.includes(u));
  if (alive.length <= 1) {
    if (alive.length === 1) await finishGame(alive[0]);
    else await finishGame('draw');
  }
}
async function mpBuy(){
  const r = curRoom; if (!r || r.game !== 'monopoly') return;
  const st = mpState(r);
  const pd = st.pending;
  if (!pd || pd.uid !== me.username) return showNotice('現在不是你的決定');
  const cell = MP_BOARD[pd.tile];
  const money = Object.assign({}, st.money || {});
  if ((money[me.username] || 0) < cell.price) return showNotice('錢不夠');
  money[me.username] -= cell.price;
  const owner = Object.assign({}, st.owner || {});
  owner[pd.tile] = me.username;
  const names = playerNames(r);
  await update(ref(db, 'games/' + curRoomId + '/state'), {
    money: money, owner: owner, pending: null,
    turnIdx: ((Number(st.turnIdx) || 0) + 1) % Math.max(1, names.length),
    log: (st.log || []).concat([`${nameOf(r, me.username)} 買下 ${cell.n}（${cell.price}）`]).slice(-40),
  });
}
async function mpSkip(){
  const r = curRoom; if (!r || r.game !== 'monopoly') return;
  const st = mpState(r);
  const pd = st.pending;
  if (!pd || pd.uid !== me.username) return showNotice('現在不是你的決定');
  const names = playerNames(r);
  await update(ref(db, 'games/' + curRoomId + '/state'), {
    pending: null,
    turnIdx: ((Number(st.turnIdx) || 0) + 1) % Math.max(1, names.length),
    log: (st.log || []).concat([`${nameOf(r, me.username)} 放棄買地`]).slice(-40),
  });
}
function drawMonopoly(r, g, bar, spec){
  const st = mpState(r), names = playerNames(r);
  const amPlayer = !!r.players[me.username];
  const pos = st.pos || {}, money = st.money || {}, owner = st.owner || {}, out = st.out || [];
  const cur = mpTurnU(r);
  const myTurn = (cur === me.username) && !spec && !out.includes(me.username);
  const pd = st.pending;

  const cells = [];
  for (let i = 0; i < MP_N; i++) {
    const [rr, cc] = mpCell(i);
    const cell = MP_BOARD[i];
    const ow = owner[i];
    const isPd = pd && pd.tile === i;
    const here = names.filter(u => (pos[u] || 0) === i && !out.includes(u));
    let cls = 'mpcell mp' + cell.t;
    if (ow) cls += ' owned';
    if (isPd) cls += ' mppending';
    cells.push(`<div class="${cls}" style="grid-row:${rr + 1};grid-column:${cc + 1}${ow ? `;border-color:${safeColor(colorOf(r, ow), '#3b82f6')}` : ''}">
      <span class="mpnum">${i}</span>
      <span class="mpname">${escapeHtml(cell.n)}</span>
      ${cell.price ? `<span class="mpprice">$${cell.price}</span>` : ''}
      ${ow ? `<span class="mpowner" style="color:${safeColor(colorOf(r, ow), '#3b82f6')}">${escapeHtml(nameOf(r, ow).slice(0, 3))}</span>` : ''}
      <span class="mptok">${here.map(u => `<i style="${chipStyle(colorOf(r, u))}" title="${escAttr(nameOf(r, u))}"></i>`).join('')}</span>
    </div>`);
  }

  const rows = names.map(u => {
    const isOut = out.includes(u);
    return `<div class="pitem" style="${u === cur ? 'border-color:var(--accent)' : ''}${isOut ? ';opacity:.45' : ''}">
      <div class="pav" style="${pavStyle(colorOf(r, u))}">${avatarHTML({ displayName: nameOf(r, u) })}</div>
      <div class="pname">${escapeHtml(nameOf(r, u))}${u === me.username ? '（你）' : ''}${isOut ? ' · 破產' : ''}
        <div class="hint" style="margin:2px 0 0;text-align:left">第 ${pos[u] || 0} 格 · 持有 ${Object.keys(owner).filter(k => owner[k] === u).length} 塊地</div></div>
      <div class="pbadge" style="${(money[u] || 0) < 300 ? 'color:var(--red);border-color:var(--red)' : ''}">$${money[u] || 0}</div>
    </div>`;
  }).join('');

  let action = '';
  if (!amPlayer) action = `<div class="hint">觀戰中</div>`;
  else if (out.includes(me.username)) action = `<div class="hint">你已破產出局，只能旁觀</div>`;
  else if (pd && pd.uid === me.username) {
    const cell = MP_BOARD[pd.tile];
    action = `<div class="turnbar mine">要買下「${escapeHtml(cell.n)}」嗎？</div>
      <div class="hint" style="margin-top:8px">地價 $${cell.price} · 別人踩到要付你 $${mpRent(cell.price)} · 你現在有 $${money[me.username] || 0}</div>
      <button class="btn" data-act="mpBuy">買下（$${cell.price}）</button>
      <button class="btn ghost" data-act="mpSkip">放棄</button>`;
  } else if (pd) {
    action = `<div class="turnbar">等 ${escapeHtml(nameOf(r, pd.uid))} 決定要不要買「${escapeHtml(MP_BOARD[pd.tile].n)}」…</div>`;
  } else if (myTurn) {
    action = `<div class="turnbar mine">輪到你擲骰</div>
      <div class="side"><div class="dice">${dicePips(Number(st.dice) || 0)}</div></div>
      <button class="btn" id="mpRoll">擲骰</button>`;
  } else {
    action = `<div class="turnbar">${escapeHtml(nameOf(r, cur))} 正在擲骰…</div>
      <div class="side"><div class="dice">${dicePips(Number(st.dice) || 0)}</div></div>`;
  }

  const log = (st.log || []).slice(-8).reverse();
  appEl.innerHTML = `<div class="topbar"><button class="back-btn" data-act="leave"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)}</h1></div>
   <div class="wrap">
     ${bar}
     <div class="mpboard">${cells.join('')}
       <div class="mpcenter">
         <div class="mptitle">大富翁</div>
         ${st.lastCard ? `<div class="hint" style="margin:4px 0">${escapeHtml(st.lastCard)}</div>` : ''}
         ${action}
       </div>
     </div>
     <div class="hint">起始資金 $${MP_MONEY0} · 經過起點收 $${MP_SALARY} · 租金約為地價 35% · 付不出錢即破產出局</div>
     <div class="plist">${rows}</div>
     ${log.length ? `<div class="hint" style="margin-top:10px">最近事件</div><div class="ucfeed" style="max-height:22vh">${log.map(x => `<div class="ucmsg"><div class="ucbody"><div class="uctext">${escapeHtml(x)}</div></div></div>`).join('')}</div>` : ''}
   </div>`;
  const lb = appEl.querySelector('[data-act="leave"]'); if (lb) lb.onclick = leaveRoom;
  const rb = appEl.querySelector('#mpRoll');
  if (rb) rb.onclick = async () => { rb.disabled = true; await mpRoll(); };
  const bb = appEl.querySelector('[data-act="mpBuy"]'); if (bb) bb.onclick = mpBuy;
  const sb = appEl.querySelector('[data-act="mpSkip"]'); if (sb) sb.onclick = mpSkip;
}

/* ===== 啟動 ===== */
window.addEventListener('message',e=>{ if(e.data&&e.data.type==='setUser'){ localStorage.setItem('game_user',e.data.username||''); if(e.data.username)location.reload(); } });
loadUser();
window.addEventListener('beforeunload',()=>{ if(curRoomId&&me){ try{ remove(ref(db,'games/'+curRoomId+'/players/'+me.username)); remove(ref(db,'games/'+curRoomId+'/spectators/'+me.username)); }catch(e){} } });
</script>
