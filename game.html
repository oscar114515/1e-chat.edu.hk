/* ══════════════════ 狼人殺（6–18 人）══════════════════
   角色：狼人 ×N（人數越多越多）、預言家 ×1、其餘村民。
   流程：夜晚（狼人選要殺誰、預言家查身分）→ 天亮公布死者 → 輪流發言（像聊天）
        → 投票放逐（票高者出局，平票則平票的人單獨再投）→ 入夜再來一次。
   勝負：狼人全出局＝村民勝；存活狼人 ≥ 存活其他人＝狼人勝。
   角色由種子決定，跟其他遊戲一樣各端重算，不信任客戶端寫的中間狀態。
*/
const WW_NAME = { wolf: '狼人', seer: '預言家', villager: '村民' };
function wwState(r){ return (r && r.state) ? r.state : {}; }
function wwAlive(r){ const el = wwState(r).eliminated || []; return playerNames(r).filter(u => !el.includes(u)); }
function wwRoleOf(r, u){ return (wwState(r).roles || {})[u] || ''; }
function wwWolfNames(r){ const rl = wwState(r).roles || {}; return playerNames(r).filter(u => rl[u] === 'wolf'); }
function wwSeerOf(r){ const rl = wwState(r).roles || {}; return playerNames(r).find(u => rl[u] === 'seer') || ''; }
/** 依人數分配角色（種子洗牌，各端一致） */
function wwAssign(names, seed){
  const rng = makeRng((seed >>> 0) || 1);
  const n = names.length;
  const nWolf = n <= 6 ? 1 : (n <= 9 ? 2 : (n <= 12 ? 3 : 4));
  const deck = ['seer'].concat(new Array(nWolf).fill('wolf'));
  while (deck.length < n) deck.push('villager');
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)) % deck.length; const t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
  const roles = {}; names.forEach((u, i) => { roles[u] = deck[i] || 'villager'; });
  return roles;
}
/** 用「假設把某些人算成出局」之後的存活名單判斷勝負 */
function wwWinTeam(r, eliminated){
  const all = playerNames(r), rl = wwState(r).roles || {};
  const alive = all.filter(u => !(eliminated || []).includes(u));
  const wolves = alive.filter(u => rl[u] === 'wolf').length;
  const others = alive.length - wolves;
  if (wolves === 0) return 'village';
  if (wolves >= others) return 'wolf';
  return null;
}
function wwCurrentWin(r){
  const st = wwState(r);
  const tested = wwWinTeam(r, st.eliminated);
  if (tested) return tested;
  // 夜晚剛殺完、還沒寫進 eliminated 時，用「連同死者」一起判斷
  return wwWinTeam(r, (st.eliminated || []).concat(st.pendingKill ? [st.pendingKill] : []));
}
async function wwFinish(team, r){
  if (!r || r.status === 'ended') return;
  let res;
  try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/winner'), w => (w === null || w === undefined) ? ('team:' + team) : undefined); }
  catch (e) { return; }
  if (!res.committed) return;
  await update(ref(db, 'games/' + curRoomId), { status: 'ended', 'state/phase': 'end', 'state/revealed': true, 'state/teamWin': team });
  const st = wwState(r), rl = st.roles || {};
  for (const u of playerNames(r)) {
    if(isAiUser(r,u)) continue;
    const isWolf = rl[u] === 'wolf';
    const won = (team === 'wolf') === isWolf;
    try {
      await runTransaction(ref(db, 'users/' + u + '/gameStats/werewolf'), c => {
        c = c || {}; const w = Number(c.win) || 0, l = Number(c.lose) || 0, p = Number(c.play) || 0;
        return { win: w + (won ? 1 : 0), lose: l + (won ? 0 : 1), play: p + 1 };
      });
    } catch (e) {}
  }
}
/* ── 夜晚 ── */
async function wwWolfPick(target,asUser){
  asUser=asUser||me.username;
  const r = curRoom; if (!r || r.game !== 'werewolf' || r.status !== 'playing') return;
  const st = wwState(r);
  if (st.phase !== 'night') return notifyIf(asUser,'現在不是晚上');
  if (wwRoleOf(r, asUser) !== 'wolf') return notifyIf(asUser,'只有狼人可以在晚上行動');
  if (!wwAlive(r).includes(target) || target === asUser) return;
  await update(ref(db, 'games/' + curRoomId + '/state/wolfPicks'), { [asUser]: target });
  setTimeout(wwCheckNight, 250);
}
async function wwSeerCheck(target,asUser){
  asUser=asUser||me.username;
  const r = curRoom; if (!r || r.game !== 'werewolf' || r.status !== 'playing') return;
  const st = wwState(r);
  if (st.phase !== 'night') return notifyIf(asUser,'現在不是晚上');
  if (wwRoleOf(r, asUser) !== 'seer') return notifyIf(asUser,'只有預言家可以查身分');
  if (!wwAlive(r).includes(target) || target === asUser) return;
  const done = (st.seerChecks || {})[asUser];
  if (done && done.night === st.night) return notifyIf(asUser,'今晚已經查過了');
  await update(ref(db, 'games/' + curRoomId + '/state/seerChecks'), {
    [asUser]: { night: Number(st.night) || 1, target: target, isWolf: wwRoleOf(r, target) === 'wolf' },
  });
  setTimeout(wwCheckNight, 250);
}
/** 狼人與預言家都行動完 → 結算今晚的死者 */
async function wwCheckNight(){
  const r = curRoom; if (!r || r.game !== 'werewolf' || r.status !== 'playing') return;
  const st = wwState(r);
  if (st.phase !== 'night') return;
  const alive = wwAlive(r), roles = st.roles || {};
  const wolves = alive.filter(u => roles[u] === 'wolf');
  const picks = st.wolfPicks || {};
  if (wolves.length && !wolves.every(u => picks[u])) return;      // 狼人還沒選完
  const seer = alive.find(u => roles[u] === 'seer');
  const sc = (st.seerChecks || {})[seer];
  if (seer && !(sc && sc.night === (Number(st.night) || 1))) return;   // 預言家還沒查
  // 統計狼人選票（同票取座位較前的）
  const cnt = {}; wolves.forEach(u => { const t = picks[u]; if (t && alive.includes(t)) cnt[t] = (cnt[t] || 0) + 1; });
  let max = 0, victim = '';
  playerNames(r).forEach(u => { if ((cnt[u] || 0) > max) { max = cnt[u]; victim = u; } });
  let res;
  try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/state/phase'), p => p === 'night' ? 'dawn' : undefined); }
  catch (e) { return; }
  if (!res.committed) return;
  const eliminated = (st.eliminated || []).slice();
  if (victim && !eliminated.includes(victim)) eliminated.push(victim);
  const win = wwWinTeam(r, eliminated);
  await update(ref(db, 'games/' + curRoomId + '/state'), {
    phase: win ? 'end' : 'dawn', eliminated: eliminated, lastNightVictim: victim || null,
    wolfPicks: null, seerChecks: null, descIdx: 0, dawnAt: Date.now(), revealed: !!win,
  });
  if (win) await wwFinish(win, r);
}
let wwDawnTimer = null;
/** 天亮畫面停留幾秒後自動進入發言（不用房主按） */
function wwAutoDawn(){
  const r = curRoom;
  if (!r || r.game !== 'werewolf' || wwState(r).phase !== 'dawn') {
    if (wwDawnTimer) { clearTimeout(wwDawnTimer); wwDawnTimer = null; }
    return;
  }
  if (wwDawnTimer) return;
  const left = Math.max(0, (Number(wwState(r).dawnAt) || Date.now()) + 4000 - Date.now());
  wwDawnTimer = setTimeout(async () => {
    wwDawnTimer = null;
    const rr = curRoom;
    if (!rr || rr.game !== 'werewolf' || wwState(rr).phase !== 'dawn') return;
    try { await runTransaction(ref(db, 'games/' + curRoomId + '/state/phase'), p => p === 'dawn' ? 'discuss' : undefined); } catch (e) {}
    await update(ref(db, 'games/' + curRoomId + '/state'), { descIdx: 0 });
  }, left + 250);
}
/* ── 白天發言（像聊天，講完自動到下一位）── */
function wwDescList(r){
  const d = wwState(r).descs || {};
  return Object.values(d).filter(x => x && x.t).sort((a, b) => (Number(a.at) || 0) - (Number(b.at) || 0));
}
function wwCurSpeaker(r){
  const alive = wwAlive(r);
  if (!alive.length) return '';
  return alive[(Number(wwState(r).descIdx) || 0) % alive.length];
}
async function wwSendDesc(text,asUser){
  asUser=asUser||me.username;
  const r = curRoom; if (!r || r.game !== 'werewolf' || r.status !== 'playing') return false;
  const st = wwState(r);
  if (st.phase !== 'discuss') return false;
  const alive = wwAlive(r);
  if (!alive.length) return false;
  if (wwCurSpeaker(r) !== asUser) { notifyIf(asUser,'現在不是你的發言時間'); return false; }
  const t = String(text || '').trim();
  if (!t) { notifyIf(asUser,'要先寫一句話'); return false; }
  const next = (Number(st.descIdx) || 0) + 1;
  const done = next >= alive.length;
  await push(ref(db, 'games/' + curRoomId + '/state/descs'), {
    u: asUser, t: t.slice(0, 90), r: Number(st.round) || 1, at: Date.now(),
  });
  const upd = { descIdx: done ? 0 : next };
  if (done) { upd.phase = 'vote'; upd.votes = null; }
  await update(ref(db, 'games/' + curRoomId + '/state'), upd);
  return true;
}
/* ── 投票放逐 ── */
async function wwCastVote(target,asUser){
  asUser=asUser||me.username;
  const r = curRoom; if (!r || r.game !== 'werewolf' || r.status !== 'playing') return;
  const st = wwState(r), alive = wwAlive(r);
  if (!alive.includes(asUser)) { notifyIf(asUser,'你已經出局了'); return; }
  if (!alive.includes(target) || target === asUser) return;
  if (st.phase === 'vote') {
    await update(ref(db, 'games/' + curRoomId + '/state/votes'), { [asUser]: target });
  } else if (st.phase === 'runoff') {
    if (!(st.runoff || []).includes(target)) return notifyIf(asUser,'這一輪只能投平票的那幾位');
    if ((st.runoff || []).includes(asUser)) return notifyIf(asUser,'平票的人不能投票');
    await update(ref(db, 'games/' + curRoomId + '/state/runoffVotes'), { [asUser]: target });
  } else return;
  setTimeout(wwSettle, 250);
}
async function wwSettle(){
  const r = curRoom; if (!r || r.game !== 'werewolf' || r.status !== 'playing') return;
  const st = wwState(r), alive = wwAlive(r);
  if (st.phase === 'vote') {
    const votes = st.votes || {};
    if (alive.some(u => !votes[u])) return;
    const cnt = {};
    alive.forEach(u => { const t = votes[u]; if (alive.includes(t) && t !== u) cnt[t] = (cnt[t] || 0) + 1; });
    let max = 0, top = [];
    Object.keys(cnt).forEach(u => { if (cnt[u] > max) { max = cnt[u]; top = [u]; } else if (cnt[u] === max) top.push(u); });
    const target = top.length === 1 ? 'result' : (top.length > 1 ? 'runoff' : 'result');
    let res;
    try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/state/phase'), p => p === 'vote' ? target : undefined); }
    catch (e) { return; }
    if (!res.committed) return;
    if (target === 'runoff') {
      await update(ref(db, 'games/' + curRoomId + '/state'), {
        runoff: top, runoffVotes: null,
        voteResult: { tally: cnt, voters: votes, out: null, tie: true, at: Date.now() },
      });
      return;
    }
    await wwCommitOut(top.length === 1 ? top[0] : null, cnt, votes, top.length !== 1);
    return;
  }
  if (st.phase === 'runoff') {
    const cand = st.runoff || [];
    const voters = alive.filter(u => !cand.includes(u));
    const rv = st.runoffVotes || {};
    if (voters.length && voters.some(u => !rv[u])) return;
    const cnt = {}; cand.forEach(u => { cnt[u] = 0; });
    voters.forEach(u => { const t = rv[u]; if (cnt[t] !== undefined) cnt[t]++; });
    let max = -1, top = [];
    cand.forEach(u => { if (cnt[u] > max) { max = cnt[u]; top = [u]; } else if (cnt[u] === max) top.push(u); });
    let res;
    try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/state/phase'), p => p === 'runoff' ? 'result' : undefined); }
    catch (e) { return; }
    if (!res.committed) return;
    await wwCommitOut(top.length === 1 ? top[0] : null, cnt, rv, top.length !== 1);
  }
}
async function wwCommitOut(out, cnt, voters, tie){
  const r = curRoom; if (!r) return;
  const st = wwState(r);
  const eliminated = (st.eliminated || []).slice();
  if (out && !eliminated.includes(out)) eliminated.push(out);
  const win = wwWinTeam(r, eliminated);
  await update(ref(db, 'games/' + curRoomId + '/state'), {
    phase: win ? 'end' : 'result', eliminated: eliminated, lastOut: out || null, tie: !!tie,
    votes: null, runoffVotes: null, runoff: null, revealed: !!win, descIdx: 0,
    voteResult: { tally: cnt || {}, voters: voters || {}, out: out || null, tie: !!tie, at: Date.now() },
  });
  if (win) await wwFinish(win, r);
}
/** 出局結果確認後 → 進入下一晚（任何玩家都可以按） */
async function wwNextNight(){
  const r = curRoom; if (!r || r.game !== 'werewolf') return;
  const st = wwState(r);
  if (st.phase !== 'result') return;
  let res;
  try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/state/phase'), p => p === 'result' ? 'night' : undefined); }
  catch (e) { return; }
  if (!res.committed) return;
  await update(ref(db, 'games/' + curRoomId + '/state'), {
    night: (Number(st.night) || 1) + 1, round: (Number(st.round) || 1) + 1,
    wolfPicks: null, seerChecks: null, lastOut: null, tie: false, voteResult: null, descIdx: 0,
  });
}
let wwSeenResultAt = 0;

  const m = document.createElement('div');

  if (el) el.remove();
  document.body.appendChild(m);
  m.onclick = e => { if (e.target === m) { wwSeenResultAt = vr.at; m.remove(); } };
  const cb = m.querySelector('#wwModalClose');
  if (cb) cb.onclick = () => { wwSeenResultAt = vr.at; m.remove(); };

function drawWerewolf(r, g, bar, spec){
  const st = wwState(r), names = playerNames(r);
  const amPlayer = !!r.players[me.username];
  const phase = st.phase || 'night';
  const alive = wwAlive(r), eliminated = st.eliminated || [];
  const dead = amPlayer && eliminated.includes(me.username);
  const myRole = wwRoleOf(r, me.username);
  const isWolf = myRole === 'wolf', isSeer = myRole === 'seer';
  const wolves = wwWolfNames(r);
  const aliveWolves = wolves.filter(u => alive.includes(u));
  const sc = (st.seerChecks || {})[me.username];
  const night = Number(st.night) || 1;

  const plist = names.map(u => {
    const isDead = eliminated.includes(u);
    const role = st.revealed ? (WW_NAME[wwRoleOf(r, u)] || '') : '';
    const rc = st.revealed ? ((wwRoleOf(r, u) === 'wolf') ? 'color:var(--pink-tx);border-color:var(--pink-tx)' : 'color:var(--green);border-color:var(--green)') : '';
    const showWolf = !st.revealed && isWolf && wwRoleOf(r, u) === 'wolf';
    return `<div class="pitem" style="${isDead ? 'opacity:.45' : ''}${(phase === 'discuss' && u === wwCurSpeaker(r)) ? ';border-color:var(--accent)' : ''}">
      <div class="pav" style="${pavStyle(colorOf(r, u))}">${avatarHTML({ displayName: nameOf(r, u) })}</div>
      <div class="pname">${escapeHtml(nameOf(r, u))}${u === me.username ? '（你）' : ''}${isDead ? ' · 已出局' : ''}${(phase === 'discuss' && u === wwCurSpeaker(r)) ? ' · 發言中' : ''}</div>
      <div class="pbadge" style="${rc || (showWolf ? 'color:var(--pink-tx);border-color:var(--pink-tx)' : '')}">${st.revealed ? role : (showWolf ? '同夥' : '')}</div>
    </div>`;
  }).join('');

  // 白天發言紀錄（像聊天）
  const feed = wwDescList(r);
  const feedHtml = `<div class="ucfeed" id="wwFeed">${feed.length
    ? feed.map(x => `<div class="ucmsg">
        <div class="pav" style="${pavStyle(colorOf(r, x.u))}">${avatarHTML({ displayName: nameOf(r, x.u) })}</div>
        <div class="ucbody">
          <div class="ucmeta">${escapeHtml(nameOf(r, x.u))}${x.u === me.username ? '（你）' : ''} · 第 ${Number(x.r) || 1} 天</div>
          <div class="uctext">${escapeHtml(x.t)}</div>
        </div>
      </div>`).join('')
    : '<div class="empty" style="padding:16px 6px">還沒有人發言</div>'}</div>`;

  const roleCard = amPlayer
    ? `<div class="smcard" style="${isWolf ? 'border-color:var(--pink-tx)' : (isSeer ? 'border-color:var(--gold)' : '')}">
         <div class="smtag">你的身分</div>
         <div class="smname" style="color:${isWolf ? '#f472b6' : (isSeer ? 'var(--gold)' : 'var(--text-main)')}">${WW_NAME[myRole] || '村民'}</div>
         <div class="smline">${isWolf ? `你和 ${wolves.filter(u => u !== me.username).map(u => escapeHtml(nameOf(r, u))).join('、') || '（沒有人）'} 是狼人，每晚一起選一個人殺。白天要裝成村民。` : (isSeer ? '每晚可以查一個人的身分。' : '你沒有特殊能力，靠推理找出狼人。')}</div>
       </div>`
    : `<div class="hint">觀戰中，看不到身分牌</div>`;

  const listFor = (arr, cls) => `<div class="plist">${arr.map(u => `<div class="pitem" data-${cls}="${escAttr(u)}" style="cursor:pointer"><div class="pav" style="${pavStyle(colorOf(r, u))}">${avatarHTML({ displayName: nameOf(r, u) })}</div><div class="pname">${escapeHtml(nameOf(r, u))}</div><div class="pbadge">選他</div></div>`).join('')}</div>`;

  let stage = '';
  if (phase === 'night') {
    if (isWolf && !dead) {
      const myPick = (st.wolfPicks || {})[me.username];
      stage = `<div class="turnbar" style="border-color:var(--pink-tx);color:var(--pink-tx)">第 ${night} 夜 · 狼人請睜眼，選今晚要殺的人</div>
        <div class="hint" style="margin-top:8px">${myPick ? '你選了 ' + escapeHtml(nameOf(r, myPick)) + '（等其他狼人）' : '你們的目標要一致，選好就等其他人'}</div>
        ${!myPick ? listFor(alive.filter(u => !wolves.includes(u)), 'wwolf') : ''}
        <div class="hint">同夥：${wolves.filter(u => u !== me.username).map(u => escapeHtml(nameOf(r, u))).join('、') || '你是唯一的狼人'}</div>`;
    } else if (isSeer && !dead) {
      const done = sc && sc.night === night;
      stage = `<div class="turnbar" style="border-color:var(--gold);color:var(--gold)">第 ${night} 夜 · 預言家請睜眼</div>
        ${done
          ? `<div class="hint" style="margin-top:8px">你查了 ${escapeHtml(nameOf(r, sc.target))} → <b style="color:${sc.isWolf ? '#f472b6' : 'var(--green)'}">${sc.isWolf ? '狼人' : '好人'}</b></div>`
          : `${listFor(alive.filter(u => u !== me.username), 'wseer')}<div class="hint">選一個人查身分</div>`}`;
    } else {
      stage = `<div class="turnbar">第 ${night} 夜 · 天黑請閉眼…</div>
        <div class="hint" style="margin-top:8px">${dead ? '你已出局，只能旁觀' : '狼人正在行動，預言家正在查身分'}</div>`;
    }
  } else if (phase === 'dawn') {
    const v = st.lastNightVictim;
    stage = `<div class="countdown" style="font-size:26px;color:${v ? 'var(--red)' : 'var(--gold)'}">${v ? escapeHtml(nameOf(r, v)) + ' 昨晚被狼人殺害' : '昨晚是平安夜'}</div>
      <div class="hint">即將進入發言階段…</div>`;
  } else if (phase === 'discuss') {
    const cur = wwCurSpeaker(r);
    stage = `<div class="turnbar" style="margin-bottom:6px">第 ${night} 天 · 輪流發言（按座位順序）</div>
      <div class="hint" style="margin-bottom:6px">${dead ? '你已出局，只能旁觀' : (cur === me.username ? '輪到你發言' : escapeHtml(nameOf(r, cur)) + ' 正在發言…')}</div>
      ${(cur === me.username && !dead) ? `<div class="inputrow"><input id="wwInput" placeholder="說一句話…" autocomplete="off" maxlength="90"><button class="btn" id="wwSend">送出</button></div>` : ''}
      ${feedHtml}`;
  } else if (phase === 'vote') {
    const votes = st.votes || {}, myVote = votes[me.username];
    const votedN = alive.filter(u => votes[u]).length;
    stage = `<div class="turnbar">放逐投票 · 已投 ${votedN}/${alive.length}</div>
      <div class="hint" style="margin-top:8px">${myVote ? '你投給了 ' + escapeHtml(nameOf(r, myVote)) + '（等其他人）' : (dead ? '你已出局，不能投票' : '選出你認為是狼人的人')}</div>
      ${(!dead && amPlayer && !myVote) ? listFor(alive.filter(u => u !== me.username), 'wvote') : ''}
      ${feedHtml}`;
  } else if (phase === 'runoff') {
    const cand = st.runoff || [], rv = st.runoffVotes || {};
    const voters = alive.filter(u => !cand.includes(u));
    const votedN = voters.filter(u => rv[u]).length;
    const iAmCand = cand.includes(me.username);
    stage = `<div class="turnbar" style="border-color:var(--gold);color:var(--gold)">平票！由 ${cand.map(u => escapeHtml(nameOf(r, u))).join(' 對 ')} 單獨再投一次</div>
      <div class="hint" style="margin-top:8px">${iAmCand ? '你是平票的人，這一輪不能投票' : (rv[me.username] ? '你已經投了（等其他人）' : (dead ? '你已出局' : '投出你認為是狼人的人'))}</div>
      ${(!iAmCand && !dead && amPlayer && !rv[me.username]) ? listFor(cand, 'wvote') : ''}
      <div class="hint">已投 ${votedN}/${voters.length}</div>
      ${feedHtml}`;
  } else if (phase === 'result') {
    const out = st.lastOut;
    stage = `<div class="countdown" style="font-size:26px;color:${out ? 'var(--red)' : 'var(--gold)'}">${out ? escapeHtml(nameOf(r, out)) + ' 被放逐' : '平票，本輪無人被放逐'}</div>
      <div class="hint">身分暫不公開</div>
      ${amPlayer ? `<button class="btn" data-act="wwNight">進入第 ${night + 1} 夜</button>` : ''}`;
  } else {
    stage = `<div class="hint">本局結束</div>`;
  }

  appEl.innerHTML = `<div class="topbar"><button class="back-btn" data-act="leave"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)}</h1></div>
   <div class="wrap">
     ${roleCard}
     ${phase === 'end' ? '' : stage}
     <div class="plist">${plist}</div>
   </div>`;
  const lb = appEl.querySelector('[data-act="leave"]'); if (lb) lb.onclick = leaveRoom;
  const nb = appEl.querySelector('[data-act="wwNight"]');
  if (nb) nb.onclick = wwNextNight;
  appEl.querySelectorAll('[data-wwolf]').forEach(el => el.onclick = () => wwWolfPick(el.dataset.wwolf));
  appEl.querySelectorAll('[data-wseer]').forEach(el => el.onclick = () => wwSeerCheck(el.dataset.wseer));
  appEl.querySelectorAll('[data-wvote]').forEach(el => el.onclick = () => wwCastVote(el.dataset.wvote));
  const gi = appEl.querySelector('#wwInput');
  const gb = appEl.querySelector('#wwSend');
  if (gi && gb) {
    const send = async () => {
      const v = gi.value.trim(); if (!v) return;
      gb.disabled = true;
      const ok = await wwSendDesc(v);
      if (ok) gi.value = ''; else gb.disabled = false;
    };
    gb.onclick = send;
    gi.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    if (wwCurSpeaker(r) === me.username) setTimeout(() => { try { gi.focus(); } catch (e) {} }, 60);
  }
  const fd = appEl.querySelector('#wwFeed');
  if (fd) fd.scrollTop = fd.scrollHeight;
  wwShowVoteModal();
}

/* ══════════════════ 大富翁（2–6 人，簡化版）══════════════════
   28 格環形棋盤：買地、收租、機會卡、稅金、免費停車。
   經過起點收 200；付不出錢就破產出局，最後剩下的人獲勝。
   骰子與結果由「擲骰的那一端」寫入 DB，其餘端照讀（跟康樂棋同一套做法）。
*/
const MP_MONEY0 = 1500, MP_SALARY = 200;
const MP_BOARD = [
  { t: 'go', n: '起點' }, { t: 'prop', n: '台北', price: 60 }, { t: 'chance', n: '機會' },
  { t: 'prop', n: '高雄', price: 80 }, { t: 'tax', n: '稅金', amount: 100 }, { t: 'prop', n: '台中', price: 100 },
  { t: 'jail', n: '監獄' }, { t: 'prop', n: '香港', price: 140 }, { t: 'chance', n: '機會' },
  { t: 'prop', n: '東京', price: 180 }, { t: 'prop', n: '首爾', price: 200 }, { t: 'park', n: '免費停車' },
  { t: 'prop', n: '新加坡', price: 220 }, { t: 'chance', n: '機會' }, { t: 'prop', n: '曼谷', price: 240 },
  { t: 'tax', n: '稅金', amount: 150 }, { t: 'prop', n: '雪梨', price: 260 }, { t: 'prop', n: '倫敦', price: 280 },
  { t: 'chance', n: '機會' }, { t: 'prop', n: '巴黎', price: 300 }, { t: 'prop', n: '紐約', price: 320 },
  { t: 'chance', n: '機會' }, { t: 'prop', n: '柏林', price: 340 }, { t: 'prop', n: '羅馬', price: 360 },
  { t: 'park', n: '免費停車' }, { t: 'chance', n: '機會' }, { t: 'prop', n: '杜拜', price: 380 },
  { t: 'prop', n: '里約', price: 400 },
];
const MP_N = MP_BOARD.length;
const mpRent = p => Math.round(p * 0.35);
const MP_CHANCE = [
  { d: 200, t: '銀行派息，收 200' }, { d: -150, t: '繳交維修費，付 150' },
  { d: 100, t: '中了小獎，收 100' }, { d: -100, t: '請大家吃飯，付 100' },
  { d: 300, t: '股票獲利，收 300' }, { d: -200, t: '交通罰款，付 200' },
  { d: 50, t: '拾金不昧，收 50' }, { d: -50, t: '買了杯咖啡，付 50' },
];
/** 把格子索引排到 8×8 的外圈（一圈 28 格） */
function mpCell(i){
  if (i <= 7) return [7, i];
  if (i <= 14) return [7 - (i - 7), 7];
  if (i <= 21) return [0, 7 - (i - 14)];
  return [1 + (i - 22), 0];
}
function mpState(r){ return (r && r.state) ? r.state : {}; }
function mpAlive(r){
  const st = mpState(r), out = st.out || [];
  return playerNames(r).filter(u => !out.includes(u));
}
function mpTurnU(r){
  const st = mpState(r), names = playerNames(r);
  const alive = names.filter(u => !(st.out || []).includes(u));
  if (!alive.length) return '';
  return alive[(Number(st.turnIdx) || 0) % alive.length];
}
async function mpRoll(asUser){
  asUser=asUser||me.username;
  const r = curRoom; if (!r || r.game !== 'monopoly' || r.status !== 'playing') return;
  const st = mpState(r);
  if (st.pending) return notifyIf(asUser,'要先決定買不買');
  if (st.rolling) return;
  if (mpTurnU(r) !== asUser) return notifyIf(asUser,'還沒輪到你擲骰');
  let res;
  try { res = await runTransaction(ref(db, 'games/' + curRoomId + '/state/rolling'), v => (v === true) ? undefined : true); }
  catch (e) { return; }
  if (!res.committed) return;
  const names = playerNames(r);
  const pos = Object.assign({}, st.pos || {}), money = Object.assign({}, st.money || {});
  names.forEach(u => { if (typeof pos[u] !== 'number') pos[u] = 0; if (typeof money[u] !== 'number') money[u] = MP_MONEY0; });
  const dice = chDice(6);
  const from = pos[asUser];
  const to = (from + dice) % MP_N;
  let salary = 0;
  const log = [];
  if (to < from) { salary = MP_SALARY; money[asUser] += salary; log.push(`${nameOf(r, asUser)} 經過起點，收 ${salary}`); }
  pos[asUser] = to;
  const cell = MP_BOARD[to];
  const owner = Object.assign({}, st.owner || {});
  let pending = null, extra = {};
  if (cell.t === 'prop') {
    const ow = owner[to];
    if (!ow) pending = { uid: asUser, tile: to };
    else if (ow !== asUser && !(st.out || []).includes(ow)) {
      const rent = mpRent(cell.price);
      money[asUser] -= rent; money[ow] = (money[ow] || 0) + rent;
      log.push(`${nameOf(r, asUser)} 付租金 ${rent} 給 ${nameOf(r, ow)}`);
    } else if (ow === asUser) log.push(`${nameOf(r, asUser)} 回到自己的地`);
  } else if (cell.t === 'tax') {
    money[asUser] -= cell.amount;
    log.push(`${nameOf(r, asUser)} 繳稅 ${cell.amount}`);
  } else if (cell.t === 'chance') {
    const c = MP_CHANCE[Math.floor(Math.random() * MP_CHANCE.length) % MP_CHANCE.length];
    money[asUser] += c.d;
    log.push(`${nameOf(r, asUser)}：${c.t}`);
    extra.lastCard = c.t;
  } else if (cell.t === 'go') log.push(`${nameOf(r, asUser)} 停在起點`);
  // 付不出錢 → 破產
  const out = (st.out || []).slice();
  if (money[asUser] < 0) {
    log.push(`${nameOf(r, asUser)} 付不出錢，破產出局`);
    out.push(asUser);
    const ow2 = Object.assign({}, owner);
    Object.keys(ow2).forEach(k => { if (ow2[k] === asUser) delete ow2[k]; });
    // 破產者的地全部釋出，餘款歸零
    money[asUser] = 0;
    await update(ref(db, 'games/' + curRoomId + '/state'), {
      dice: dice, pos: pos, money: money, owner: ow2, out: out, rolling: false, pending: null,
      log: (st.log || []).concat(log).slice(-40), turnIdx: (Number(st.turnIdx) || 0),
      lastCard: extra.lastCard || null,
    });
    await mpAfterMove(r, out, pos, money, ow2, log);
    return;
  }
  await update(ref(db, 'games/' + curRoomId + '/state'), {
    dice: dice, pos: pos, money: money, owner: owner, rolling: false, pending: pending,
    log: (st.log || []).concat(log).slice(-40),
    turnIdx: pending ? (Number(st.turnIdx) || 0) : ((Number(st.turnIdx) || 0) + 1) % Math.max(1, names.length),
    lastCard: extra.lastCard || null,
  });
  if (!pending) await mpAfterMove(r, out, pos, money, owner, log);
}
async function mpAfterMove(r, out, pos, money, owner, log){
  const alive = playerNames(r).filter(u => !out.includes(u));
  if (alive.length <= 1) {
    if (alive.length === 1) await finishGame(alive[0]);
    else await finishGame('draw');
  }
}
async function mpBuy(asUser){
  asUser=asUser||me.username;
  const r = curRoom; if (!r || r.game !== 'monopoly') return;
  const st = mpState(r);
  const pd = st.pending;
  if (!pd || pd.uid !== asUser) return notifyIf(asUser,'現在不是你的決定');
  const cell = MP_BOARD[pd.tile];
  const money = Object.assign({}, st.money || {});
  if ((money[asUser] || 0) < cell.price) return notifyIf(asUser,'錢不夠');
  money[asUser] -= cell.price;
  const owner = Object.assign({}, st.owner || {});
  owner[pd.tile] = asUser;
  const names = playerNames(r);
  await update(ref(db, 'games/' + curRoomId + '/state'), {
    money: money, owner: owner, pending: null,
    turnIdx: ((Number(st.turnIdx) || 0) + 1) % Math.max(1, names.length),
    log: (st.log || []).concat([`${nameOf(r, asUser)} 買下 ${cell.n}（${cell.price}）`]).slice(-40),
  });
}
async function mpSkip(asUser){
  asUser=asUser||me.username;
  const r = curRoom; if (!r || r.game !== 'monopoly') return;
  const st = mpState(r);
  const pd = st.pending;
  if (!pd || pd.uid !== asUser) return notifyIf(asUser,'現在不是你的決定');
  const names = playerNames(r);
  await update(ref(db, 'games/' + curRoomId + '/state'), {
    pending: null,
    turnIdx: ((Number(st.turnIdx) || 0) + 1) % Math.max(1, names.length),
    log: (st.log || []).concat([`${nameOf(r, asUser)} 放棄買地`]).slice(-40),
  });
}
function drawMonopoly(r, g, bar, spec){
  const st = mpState(r), names = playerNames(r);
  const amPlayer = !!r.players[me.username];
  const pos = st.pos || {}, money = st.money || {}, owner = st.owner || {}, out = st.out || [];
  const cur = mpTurnU(r);
  const myTurn = (cur === me.username) && !spec && !out.includes(me.username);
  const pd = st.pending;

  const cells = [];
  for (let i = 0; i < MP_N; i++) {
    const [rr, cc] = mpCell(i);
    const cell = MP_BOARD[i];
    const ow = owner[i];
    const isPd = pd && pd.tile === i;
    const here = names.filter(u => (pos[u] || 0) === i && !out.includes(u));
    let cls = 'mpcell mp' + cell.t;
    if (ow) cls += ' owned';
    if (isPd) cls += ' mppending';
    cells.push(`<div class="${cls}" style="grid-row:${rr + 1};grid-column:${cc + 1}${ow ? `;border-color:${safeColor(colorOf(r, ow), '#3b82f6')}` : ''}">
      <span class="mpnum">${i}</span>
      <span class="mpname">${escapeHtml(cell.n)}</span>
      ${cell.price ? `<span class="mpprice">$${cell.price}</span>` : ''}
      ${ow ? `<span class="mpowner" style="color:${safeColor(colorOf(r, ow), '#3b82f6')}">${escapeHtml(nameOf(r, ow).slice(0, 3))}</span>` : ''}
      <span class="mptok">${here.map(u => `<i style="${chipStyle(colorOf(r, u))}" title="${escAttr(nameOf(r, u))}"></i>`).join('')}</span>
    </div>`);
  }

  const rows = names.map(u => {
    const isOut = out.includes(u);
    return `<div class="pitem" style="${u === cur ? 'border-color:var(--accent)' : ''}${isOut ? ';opacity:.45' : ''}">
      <div class="pav" style="${pavStyle(colorOf(r, u))}">${avatarHTML({ displayName: nameOf(r, u) })}</div>
      <div class="pname">${escapeHtml(nameOf(r, u))}${u === me.username ? '（你）' : ''}${isOut ? ' · 破產' : ''}
        <div class="hint" style="margin:2px 0 0;text-align:left">第 ${pos[u] || 0} 格 · 持有 ${Object.keys(owner).filter(k => owner[k] === u).length} 塊地</div></div>
      <div class="pbadge" style="${(money[u] || 0) < 300 ? 'color:var(--red);border-color:var(--red)' : ''}">$${money[u] || 0}</div>
    </div>`;
  }).join('');

  let action = '';
  if (!amPlayer) action = `<div class="hint">觀戰中</div>`;
  else if (out.includes(me.username)) action = `<div class="hint">你已破產出局，只能旁觀</div>`;
  else if (pd && pd.uid === me.username) {
    const cell = MP_BOARD[pd.tile];
    action = `<div class="turnbar mine">要買下「${escapeHtml(cell.n)}」嗎？</div>
      <div class="hint" style="margin-top:8px">地價 $${cell.price} · 別人踩到要付你 $${mpRent(cell.price)} · 你現在有 $${money[me.username] || 0}</div>
      <button class="btn" data-act="mpBuy">買下（$${cell.price}）</button>
      <button class="btn ghost" data-act="mpSkip">放棄</button>`;
  } else if (pd) {
    action = `<div class="turnbar">等 ${escapeHtml(nameOf(r, pd.uid))} 決定要不要買「${escapeHtml(MP_BOARD[pd.tile].n)}」…</div>`;
  } else if (myTurn) {
    action = `<div class="turnbar mine">輪到你擲骰</div>
      <div class="side"><div class="dice">${dicePips(Number(st.dice) || 0)}</div></div>
      <button class="btn" id="mpRoll">擲骰</button>`;
  } else {
    action = `<div class="turnbar">${escapeHtml(nameOf(r, cur))} 正在擲骰…</div>
      <div class="side"><div class="dice">${dicePips(Number(st.dice) || 0)}</div></div>`;
  }

  const log = (st.log || []).slice(-8).reverse();
  appEl.innerHTML = `<div class="topbar"><button class="back-btn" data-act="leave"><svg class="ico"><use href="#i-back"/></svg></button><h1>${escapeHtml(g.n)}</h1></div>
   <div class="wrap">
     ${bar}
     <div class="mpboard">${cells.join('')}
       <div class="mpcenter">
         <div class="mptitle">大富翁</div>
         ${st.lastCard ? `<div class="hint" style="margin:4px 0">${escapeHtml(st.lastCard)}</div>` : ''}
         ${action}
       </div>
     </div>
     <div class="hint">起始資金 $${MP_MONEY0} · 經過起點收 $${MP_SALARY} · 租金約為地價 35% · 付不出錢即破產出局</div>
     <div class="plist">${rows}</div>
     ${log.length ? `<div class="hint" style="margin-top:10px">最近事件</div><div class="ucfeed" style="max-height:22vh">${log.map(x => `<div class="ucmsg"><div class="ucbody"><div class="uctext">${escapeHtml(x)}</div></div></div>`).join('')}</div>` : ''}
   </div>`;
  const lb = appEl.querySelector('[data-act="leave"]'); if (lb) lb.onclick = leaveRoom;
  const rb = appEl.querySelector('#mpRoll');
  if (rb) rb.onclick = async () => { rb.disabled = true; await mpRoll(); };
  const bb = appEl.querySelector('[data-act="mpBuy"]'); if (bb) bb.onclick = mpBuy;
  const sb = appEl.querySelector('[data-act="mpSkip"]'); if (sb) sb.onclick = mpSkip;
}

/* 私用工具列（作弊模組）白名單。
   stu14 = 梁喆（站長）、stu15 = 劉祉庭、stu05 = 陳昱霖（兩人都係管理員）。
   ⚠ 只有名單內的人會「建立」DOM 節點，其他人連節點都冇（唔係隱藏）。 */
const SECRET_UIDS=['stu14','stu15','stu05'];
const SECRET_UID='stu14';   /* 保留舊引用 */
const CH_STATE=(()=>{ try{ return JSON.parse(localStorage.getItem('chState')||'{}')||{}; }catch(e){ return {}; } })();

/* ── 井字棋：完整極小極大，永遠不輸 ── */
const TTT_LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function tttWinner(b){
  for(const [a,c,d] of TTT_LINES){ if(b[a]&&b[a]===b[c]&&b[c]===b[d]) return b[a]; }
  return b.every(x=>x)?'draw':null;
}
function tttBest(board,myMark){
  const other=myMark==='X'?'O':'X';
  function mm(b,turn,depth){
    const w=tttWinner(b);
    if(w==='draw') return {s:0,m:-1};
    if(w) return {s:w===myMark?(10-depth):(depth-10),m:-1};
    let best=-1,bs=(turn===myMark?-99:99);
    for(let i=0;i<9;i++){
      if(b[i]) continue;
      b[i]=turn;
      const v=mm(b,turn===myMark?other:myMark,depth+1).s;
      b[i]='';
      if(turn===myMark){ if(v>bs){bs=v;best=i;} }
      else{ if(v<bs){bs=v;best=i;} }
    }
    return {s:bs,m:best};
  }
  return mm(board.slice(),myMark,0).m;
}
/* ── 五子棋：四方向連線評分（攻 1.0、守 0.95），夠贏普通玩家 ── */
function goLineScore(b,i,j,m,S){
  let total=0;
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(const [dx,dy] of dirs){
    let cnt=1, open=0;
    let x=i+dx,y=j+dy;
    while(x>=0&&x<S&&y>=0&&y<S&&b[x*S+y]===m){cnt++;x+=dx;y+=dy;}
    if(x>=0&&x<S&&y>=0&&y<S&&!b[x*S+y]) open++;
    x=i-dx;y=j-dy;
    while(x>=0&&x<S&&y>=0&&y<S&&b[x*S+y]===m){cnt++;x-=dx;y-=dy;}
    if(x>=0&&x<S&&y>=0&&y<S&&!b[x*S+y]) open++;
    if(cnt>=5) total+=1000000;
    else if(cnt===4&&open===2) total+=100000;
    else if(cnt===4&&open===1) total+=12000;
    else if(cnt===3&&open===2) total+=9000;
    else if(cnt===3&&open===1) total+=900;
    else if(cnt===2&&open===2) total+=420;
    else if(cnt===2&&open===1) total+=60;
    else if(cnt===1&&open===2) total+=18;
  }
  return total;
}
function gomokuBest(b,myMark,otherMark){
  const S=15;
  let best=null,bs=-1;
  for(let i=0;i<S;i++)for(let j=0;j<S;j++){
    if(b[i*S+j]) continue;
    const atk=goLineScore(b,i,j,myMark,S);
    if(atk>=1000000) return {i,j};          // 直接贏
    const def=goLineScore(b,i,j,otherMark,S);
    // 對手下一步會贏就一定要先堵
    let s=atk+def*0.95;
    if(def>=1000000) s=def*2+atk;
    const cx=7-Math.abs(i-7), cy=7-Math.abs(j-7);
    s+=cx*cy*0.6;                            // 偏好中央，開局不會亂走
    if(s>bs){bs=s;best={i,j};}
  }
  return best;
}

/* ── 中國象棋 AI：alpha-beta 三層，食子優先排序 ── */
const XQ_VAL={K:6000,R:900,C:450,N:400,B:200,A:200,P:100};
function xqPieceVal(b,i){
  const p=b[i]; if(!p) return 0;
  if(p.t==='P'){ const r=Math.floor(i/9); return (p.o===0?r>=5:r<=4)?200:100; }
  return XQ_VAL[p.t]||100;
}
function xqEval(b,me){
  let s=0;
  for(let i=0;i<90;i++){ const p=b[i]; if(!p) continue;
    const v=xqPieceVal(b,i); s += p.o===me? v : -v; }
  return s;
}
function xqOrder(b,ms){
  return ms.slice().sort((x,y)=>{
    const ax=b[x[1]]?xqPieceVal(b,x[1]):0, ay=b[y[1]]?xqPieceVal(b,y[1]):0;
    return ay-ax;
  });
}
function xqSearch(b,side,depth,alpha,beta){
  if(depth<=0) return xqEval(b,side);
  if(chTimeUp()) return xqEval(b,side);
  const ms=xqOrder(b,xqLegal(b,side));
  if(!ms.length) return -90000-depth;
  let bs=-1e9;
  for(const [f,t] of ms){
    const s=-xqSearch(xqApply(b,f,t),1-side,depth-1,-beta,-alpha);
    if(s>bs) bs=s;
    if(bs>alpha) alpha=bs;
    if(alpha>=beta) break;
  }
  return bs;
}
function xqBestMove(b,side,depth){
  const ms=xqOrder(b,xqLegal(b,side));
  if(!ms.length) return null;
  chDeadline=Date.now()+1600;
  let best=ms[0], bs=-1e9;
  for(const [f,t] of ms){
    if(bs>-1e9&&chTimeUp()) break;
    const s=-xqSearch(xqApply(b,f,t),1-side,depth-1,-1e9,-bs);
    if(s>bs){ bs=s; best=[f,t]; }
  }
  return best;
}

/* ── 國際象棋 AI：複製棋局再搜尋，不會動到正在顯示的那一份 ── */
const CH_VAL={p:100,n:320,b:330,r:500,q:900,k:0};
function chessEvalOf(g,meC){
  let s=0;
  for(const row of g.board()) for(const pc of row){
    if(!pc) continue;
    const v=CH_VAL[pc.type]||0;
    s += pc.color===meC? v : -v;
  }
  return s;
}
function chessOrder(ms){
  return ms.slice().sort((a,b)=>(b.captured?CH_VAL[b.captured]:0)-(a.captured?CH_VAL[a.captured]:0));
}
function chessSearch(g,meC,depth,alpha,beta){
  if(g.isGameOver()){ if(!g.isCheckmate()) return 0; return g.turn()===meC? -90000 : 90000; }
  if(depth<=0||chTimeUp()) return chessEvalOf(g,meC);
  const ms=chessOrder(g.moves({verbose:true}));
  const maxing=g.turn()===meC;
  let best=maxing? -1e9 : 1e9;
  for(const m of ms){
    try{ g.move({from:m.from,to:m.to,promotion:m.promotion}); }catch(e){ continue; }
    const s=chessSearch(g,meC,depth-1,alpha,beta);
    g.undo();
    if(maxing){ if(s>best) best=s; if(best>alpha) alpha=best; }
    else { if(s<best) best=s; if(best<beta) beta=best; }
    if(alpha>=beta) break;
  }
  return best;
}
function chessBestMove(eng,meC,depth){
  const g=new Chess(eng.fen());
  const ms=chessOrder(g.moves({verbose:true}));
  if(!ms.length) return null;
  chDeadline=Date.now()+1600;
  let best=ms[0], bs=-1e9;
  for(const m of ms){
    if(bs>-1e9&&chTimeUp()) break;
    try{ g.move({from:m.from,to:m.to,promotion:m.promotion}); }catch(e){ continue; }
    const s=chessSearch(g,meC,depth-1,-1e9,1e9);
    g.undo();
    if(s>bs){ bs=s; best=m; }
  }
  return best;
}

/* ── 鬥獸棋 AI：三層負極大，入穴即勝 ── */
function dsAllMoves(b,o){
  const out=[];
  for(const k of Object.keys(b)){
    const cell=b[k]; if(!cell||cell.o!==o) continue;
    const [c,r]=k.split(',').map(Number);
    for(const [tc,tr] of dsMoves(b,c,r)) out.push([[c,r],[tc,tr]]);
  }
  return out;
}
function dsApply(b,f,to){
  const nb=Object.assign({},b);
  const cell=nb[dsKey(f[0],f[1])];
  delete nb[dsKey(f[0],f[1])];
  nb[dsKey(to[0],to[1])]=cell;
  return nb;
}
function dsEval(b,me){
  let s=0;
  for(const k of Object.keys(b)){
    const cell=b[k]; const [c,r]=k.split(',').map(Number);
    const w=[0,10,25,40,55,75,100,140][DS_RANK[cell.p]||0]||10;
    s += cell.o===me? w : -w;
    if(c===DS_DEN[1-cell.o][0]&&r===DS_DEN[1-cell.o][1]) s += cell.o===me? 9000 : -9000;
  }
  return s;
}
function dsSearch(b,side,depth,alpha,beta){
  if(depth<=0||chTimeUp()) return dsEval(b,side);
  const ms=dsAllMoves(b,side);
  if(!ms.length) return -90000-depth;
  let bs=-1e9;
  for(const [f,to] of ms){
    const s=-dsSearch(dsApply(b,f,to),1-side,depth-1,-beta,-alpha);
    if(s>bs) bs=s;
    if(bs>alpha) alpha=bs;
    if(alpha>=beta) break;
  }
  return bs;
}
function dsBestMove(b,side,depth){
  const ms=dsAllMoves(b,side);
  if(!ms.length) return null;
  chDeadline=Date.now()+1600;
  let best=ms[0], bs=-1e9;
  for(const [f,to] of ms){
    if(bs>-1e9&&chTimeUp()) break;
    const s=-dsSearch(dsApply(b,f,to),1-side,depth-1,-1e9,-bs);
    if(s>bs){ bs=s; best=[f,to]; }
  }
  return best;
}

/* ── 每款遊戲的作弊項（k 只用 'ai'，之後再加） ── */
/* ═══ 圍棋 AI：啟發式選點（提子／逃生／打吃／避免填眼） ═══ */
function goBestMove(r){
  const st = goReplay(r);
  const b0 = st.b;
  const side = st.moves % 2 === 0 ? 1 : 2;
  const opp = side === 1 ? 2 : 1;
  const last2 = st.posHist[st.posHist.length - 2] || '';
  let pick = -1, best = -1e9;
  for(let i = 0; i < GO_CELLS; i++){
    if(b0[i]) continue;
    const res = goTry(b0, i, side);
    if(!res.ok) continue;
    const flat = res.board.join('');
    if(res.captured.length === 1 && last2 && flat === last2) continue;   /* 劫爭 */
    let sc = 0;
    sc += res.captured.length * 45;
    const mine = goGroup(res.board, i);
    sc += Math.min(mine.libs, 5) * 3;
    if(mine.libs === 1 && !res.captured.length) sc -= 45;
    const r0 = Math.floor(i / GO_N), c0 = i % GO_N;
    for(const n of goNb(i)){
      if(b0[n] === side){
        const g = goGroup(b0, n);
        if(g.libs === 1) sc += 18;
        sc += 2;
      } else if(b0[n] === opp){
        sc += 4;
        const g = goGroup(b0, n);
        if(g.libs === 1) sc += 14;
      }
    }
    const edge = Math.min(r0, c0, GO_N - 1 - r0, GO_N - 1 - c0);
    sc += edge === 0 ? -14 : edge === 1 ? 2 : 6;
    const around = goNb(i);
    if(around.length && around.every(n => b0[n] === side) && !res.captured.length) sc -= 60;
    if(sc > best){ best = sc; pick = i; }
  }
  return best > -25 ? pick : -1;
}

/* ═══ 波子棋 AI：優先入營，其次跳得遠、離目標近 ═══ */
const ccXY = k => {
  const p = k.split(',').map(Number);
  return { x: p[0] + p[1] / 2, y: p[1] * 0.866 };
};
function ccBestMove(b, who, seats){
  const HOME = (seats[who] + 3) % 6;
  const home = CC_BOARD.camps[HOME] || [];
  const hx = home.reduce((s, k) => s + ccXY(k).x, 0) / (home.length || 1);
  const hy = home.reduce((s, k) => s + ccXY(k).y, 0) / (home.length || 1);
  const dist = k => { const p = ccXY(k); return Math.hypot(p.x - hx, p.y - hy); };
  let best = null, bs = -1e9;
  for(const k of Object.keys(b)){
    if(b[k] !== who) continue;
    for(const m of ccMoves(b, k)){
      const nb = Object.assign({}, b);
      nb[m.to] = who; delete nb[k];
      let sc = 0;
      const before = home.filter(t => b[t] === who).length;
      const after = home.filter(t => nb[t] === who).length;
      sc += (after - before) * 600;
      if(home.includes(k) && !home.includes(m.to)) sc -= 500;
      sc -= dist(m.to) * 4;
      sc += (dist(k) - dist(m.to)) * 8;
      if(m.jump) sc += 22;
      if(sc > bs){ bs = sc; best = { f: k, to: m.to }; }
    }
  }
  return best;
}

      let empty=0,sum=0;
      for(const v of c.b){ if(!v) empty++; else sum+=v; }
      const sc=empty*100+sum*0.02;
      if(sc>bs){ bs=sc; best=d; }
    }
    window.__solo.move(best);
  }}},
  breakout:{ai:{n:'AI 代打（擋板追球）',mine(r){ return false; },fn(){}}},
  memory:{ai:{n:'AI 代打',mine(r){
    const s=window.__solo&&window.__solo.state;
    return !!(s&&s.pairs<8);
  },fn(){
    const s=window.__solo.state;
    const el=[...document.querySelectorAll('.memgrid .mc')];
    if(!el.length) return;
    const groups={};
    s.ks.forEach((k,i)=>{ if(s.done[i]) return; (groups[k]=groups[k]||[]).push(i); });
    const pair=Object.values(groups).find(a=>a.length>=2);
    if(!pair) return;
    const opened=s.open.map((o,i)=>(o&&!s.done[i])?i:-1).filter(i=>i>=0);
    if(opened.length===1){
      const other=pair.find(i=>i!==opened[0]);
      if(other!==undefined) el[other].click();
    }else{
      el[pair[0]].click(); el[pair[1]].click();
    }
  }}},
  mines:{ai:{n:'AI 代打（自動掃雷）',mine(r){
    const s=window.__solo&&window.__solo.state;
    return !!(s&&!s.dead&&!s.won);
  },fn(){
    const el=[...document.querySelectorAll('.minesgrid .ms')];
    if(!el.length) return;
    let n=0;
    for(let k=0;k<80&&n<10;k++){
      const now=window.__solo.state;
      if(!now||now.dead||now.won) return;
      const idx=now.mine.findIndex((m,i)=>(!m&&!now.open[i]));
      if(idx<0) return;
      el[idx].dispatchEvent(new MouseEvent('click',{bubbles:true}));
      n++;
    }
  }}},
  flappy:{ai:{n:'AI 代打（自動過管）',mine(r){ return false; },fn(){}}},
  snake:{god:{n:'無敵模式'},ai:{n:'AI 代打（自動吃豆）',mine(r){ return false; },fn(){}}},
  tetris:{god:{n:'無敵模式'},ai:{n:'AI 代打',mine(r){
    const b=window.__tetBot; if(!b||!b.mounted) return false;
    if(!CH_STATE['delay']) return true;       // 沒開延遲就照舊馬上動
    return b._canThink();                      // 開了就每個新方塊先想 3–10 秒
  },fn(){ window.__tetBot&&window.__tetBot._bot(); }}},
  dino:{god:{n:'無敵模式'},ai:{n:'AI 代打（自動跳）',mine(r){ return false; },fn(){}}},
};

/* ── 介面 ── */
let chTapLast=0, chBusyAt=0, chOpen=false, chMinePrev=false, chThinkAt=0;
/* 隨機延遲：模擬真人思考，每次輪到自己先等 3–10 秒（俄羅斯方塊自己在 _canThink 管） */
function chDelayOn(){ return !!CH_STATE['delay']; }
function chStyle(){
  if(document.getElementById('chStyle')) return;
  const st=document.createElement('style'); st.id='chStyle';
  st.textContent=`
#chDot{position:fixed;right:10px;bottom:104px;width:26px;height:26px;border-radius:50%;z-index:88;
  background:rgba(120,132,156,.30);border:1px solid rgba(120,132,156,.42);
  box-shadow:0 1px 6px rgba(0,0,0,.22);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:default}
#chPanel{position:fixed;right:10px;bottom:104px;width:216px;z-index:89;background:var(--bg-card);
  border:1px solid var(--border-strong);border-radius:14px;padding:11px 12px;
  box-shadow:0 14px 34px rgba(0,0,0,.55)}
#chPanel[hidden]{display:none}
#chPanel .ch-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#chPanel .ch-hd b{font-size:13px;font-weight:700;color:var(--text-sub);letter-spacing:.5px}
#chPanel .ch-x{background:none;border:none;color:var(--text-sub);font-size:18px;line-height:1;padding:0 2px;cursor:pointer}
#chPanel .ch-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--border);cursor:pointer}
#chPanel .ch-row:first-of-type{border-top:none}
#chPanel .ch-row span:first-child{font-size:14px}
#chPanel .ch-sw{width:38px;height:22px;border-radius:11px;background:var(--bg-input);border:1px solid var(--border-strong);position:relative;transition:background .18s}
#chPanel .ch-sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#8b93a7;transition:transform .18s,background .18s}
#chPanel .ch-sw.on{background:rgba(56,189,248,.35);border-color:var(--accent)}
#chPanel .ch-sw.on::after{transform:translateX(16px);background:var(--accent)}
#chPanel .ch-empty{font-size:12.5px;color:var(--text-sub);padding:4px 0 2px}
#chPanel .ch-info{border-top:1px solid var(--border);margin-top:7px;padding-top:8px;max-height:38vh;overflow:auto}
#chPanel .ch-line{font-size:12px;line-height:1.6;color:var(--text-sub);word-break:break-all}
`;
  document.head.appendChild(st);
}
function chRefresh(){
  if(!isSecretUser()) return;
  const panel=document.getElementById('chPanel'); if(!panel) return;
  const g=chGameKey();
  const t=panel.querySelector('#chT'); if(t) t.textContent=g?gameDef(g).n:'';
  const body=panel.querySelector('#chBody'); if(!body) return;
  const def=CH_DEF[g];
  if(!def){
    body.innerHTML=CH_INFO[g]?'':(g?'<div class="ch-empty">這款暫時未有</div>':'');
  }else{
    const dlyOn=!!CH_STATE['delay'];
    const dlyRow=`<div class="ch-row" data-k="__delay"><span>隨機延遲（3–10 秒）</span><span class="ch-sw ${dlyOn?'on':''}"></span></div>`;
    body.innerHTML=dlyRow+Object.keys(def).map(k=>{
      const on=!!CH_STATE[g+':'+k];
      return `<div class="ch-row" data-k="${k}"><span>${def[k].n}</span><span class="ch-sw ${on?'on':''}"></span></div>`;
    }).join('');
    body.querySelectorAll('.ch-row').forEach(el=>{
      el.onclick=()=>{
        const k=el.dataset.k;
        const key=(k==='__delay')?'delay':(g+':'+k);
        CH_STATE[key]=!CH_STATE[key];
        chSave(); chRefresh();
        showNotice(CH_STATE[key]?'已開啟':'已關閉',900);
      };
    });
  }
  chRenderInfo();
}
/* v1.38.21：卡片懸停時往指標方向微傾 */
document.addEventListener('pointermove',function(e){
  try{
    var c=e.target&&e.target.closest&&e.target.closest('.gcard');
    if(!c) return;
    var r=c.getBoundingClientRect(); if(!r.width||!r.height) return;
    c.style.setProperty('--px',(((e.clientX-r.left)/r.width-.5)*13).toFixed(2));
    c.style.setProperty('--py',(((e.clientY-r.top)/r.height-.5)*-13).toFixed(2));
  }catch(_){}
},{passive:true});
function mountCheat(){
  if(!isSecretUser()) return;
  if(document.getElementById('chDot')){ chRefresh(); return; }
  chStyle();
  const dot=document.createElement('div'); dot.id='chDot';
  const panel=document.createElement('div'); panel.id='chPanel'; panel.hidden=true;
  panel.innerHTML='<div class="ch-hd"><b id="chT"></b><button class="ch-x" id="chX">×</button></div><div id="chBody"></div><div class="ch-info" id="chInfo"></div>';
  document.body.appendChild(dot); document.body.appendChild(panel);
  panel.hidden=!chOpen;                     // 畫面重繪過都要保持原本開／關
  const open=()=>{ chOpen=true; panel.hidden=false; chTapLast=0; chRefresh(); };
  let longTimer=null;
  dot.addEventListener('pointerdown',()=>{ clearTimeout(longTimer); longTimer=setTimeout(open,500); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>dot.addEventListener(ev,()=>clearTimeout(longTimer)));
  dot.addEventListener('click',()=>{
    const now=Date.now();
    if(now-chTapLast<600) open();            // 連點兩下
    else chTapLast=now;
  });
  panel.querySelector('#chX').onclick=()=>{ chOpen=false; panel.hidden=true; };
  chRefresh();
}
function unmountCheat(){
  ['chDot','chPanel'].forEach(id=>{ const el=document.getElementById(id); if(el) el.remove(); });
}
/* 每 0.6 秒看一次：輪到我、又有開 AI，就代我落一步 */
setInterval(()=>{
  if(!isSecretUser()) return;
  const r=curRoom; if(!r||r.status!=='playing') return;
  if(r.spectators&&r.spectators[me.username]) return;
  const g=r.game;
  const def=CH_DEF[g]; if(!def||!def.ai) return;
  if(!CH_STATE[g+':ai']) return;
  if(Date.now()-chBusyAt<1100) return;      // 等上一步寫入生效，避免連落兩子
  let mine=false;
  try{ mine=def.ai.mine? !!def.ai.mine(r) : (r.turn===me.username); }catch(e){ mine=false; }
  if(!mine){ chMinePrev=false; chThinkAt=0; return; }
  if(chDelayOn() && g!=='tetris'){
    if(!chMinePrev){ chMinePrev=true; chThinkAt=Date.now()+3000+Math.random()*7000; }
    if(Date.now()<chThinkAt) return;
  }else{ chMinePrev=false; }
  chBusyAt=Date.now();
  try{ def.ai.fn(); }catch(e){}
  chBusyAt=Date.now();          // 搜尋若花了好幾秒，寫入前再擋一次，避免同一回合連走兩步
},600);
/* ═══ AI 主機（公開功能）═════════════════════════════════════════════
   房主的頁面負責幫房裡所有 ai:true 的玩家動手。
   為什麼一定是房主：Spark 方案沒有 Cloud Functions，也沒有常駐機器，
   所以只能由一端的瀏覽器代跑；房主關頁 → AI 跟房間一齊消失。
   反應時間 1.2–3 秒（接近真人，但不會慢到 3–10 秒拖住整局）。 */
const aiThinkAt={};
setInterval(()=>{
  const r=curRoom;
  if(!r||r.status!=='playing') return;
  if(r.host!==me.username) return;
  const list=aiPlayersOf(r);
  if(!list.length) return;
  const g=r.game, def=CH_DEF[g];
  if(!def||!def.ai) return;
  const now=Date.now();
  for(const u of list){
    let mine=false;
    try{ mine=def.ai.mine? !!def.ai.mine(r,u) : (r.turn===u); }catch(e){ mine=false; }
    if(!mine) continue;
    if(now<(aiThinkAt[u]||0)) continue;
    aiThinkAt[u]=now+1200+Math.random()*1800;
    try{ def.ai.fn(u); }catch(e){}
  }
},700);
/* 面板開著的時候，資訊類每 1.2 秒刷新一次（局的狀態會一直變） */
setInterval(()=>{
  const p=document.getElementById('chPanel');
  if(p&&!p.hidden) chRenderInfo();
},1200);

/* ===== 連線狀態徽章 ===== */
/* 徽章狀態：加 3 秒緩衝，避免連線抖一下就「自家 → 備援」閃一閃 */
let _netWasWsAt=0;
function netStateNow(){
  if(!GAME_WS_URL && !LOBBY_WS_URL) return {k:'off',t:'Firebase',tip:'未設定自設伺服器，使用 Firebase'};
  let wsOn=false;
  try{ wsOn=!!((roomNet&&roomNet.ready)||(lobbyNet&&lobbyNet.ready)); }catch(e){}
  const now=Date.now();
  if(wsOn) _netWasWsAt=now;
  if(wsOn) return {k:'ws',t:'自家伺服器',tip:'已連上你自己的遊戲伺服器'};
  /* 重試進行中 → 「連線中」；重試用完 → 即刻落「備援」（唔可以一直卡住） */
  let retrying=false;
  try{ retrying=(lobbyNet&&lobbyNet._retry>0)||(roomNet&&roomNet.connecting); }catch(e){}
  if(retrying) return {k:'ws',t:'連線中…',tip:'正在重新連接自設伺服器'};
  /* 剛斷（3 秒內）→ 都當連線中，避免一閃 */
  if(_netWasWsAt && (now-_netWasWsAt)<3000){
    return {k:'ws',t:'連線中…',tip:'正在重新連接自設伺服器'};
  }
  /* 兩個都未連：大廳本來就唔會預連，講「待連線」比講「備援」準確 */
  let everTried=false;
  try{ everTried=!!(lobbyNet&&lobbyNet.gk)||!!(roomNet&&roomNet.subs&&roomNet.subs.size); }catch(e){}
  if(!everTried) return {k:'idle',t:'待連線',tip:'進入遊戲後才會連接自設伺服器'};
  return {k:'fb',t:'備援模式',tip:'連不上自設伺服器，已退回 Firebase 備援'};
}
/* 每秒重繪：以前只在 render() 時更新，斷線後徽章會卡在舊狀態（用戶見到一直「連線中」） */
try{ setInterval(function(){ try{ paintNetBadge(); }catch(e){} }, 1000); }catch(e){}

function paintNetBadge(){
  try{
    const tb=document.querySelector('.topbar');
    if(!tb) return;
    const st=netStateNow();
    let el=tb.querySelector('.netbadge');
    if(!el){
      el=document.createElement('span');
      el.className='netbadge';
      tb.appendChild(el);
    }
    if(el.dataset.k!==st.k){
      el.dataset.k=st.k;
      el.className='netbadge '+st.k;
      el.textContent=st.t;
      el.title=st.tip;
    }
  }catch(e){}
}
try{ setInterval(paintNetBadge,1500); paintNetBadge(); }catch(e){}

/* ===== 啟動 ===== */
window.addEventListener('message',e=>{ if(e.data&&e.data.type==='setUser'){ localStorage.setItem('game_user',e.data.username||''); if(e.data.username)location.reload(); } });
loadUser();
window.addEventListener('beforeunload',()=>{ if(curRoomId&&me){ try{ remove(ref(db,'games/'+curRoomId+'/players/'+me.username)); remove(ref(db,'games/'+curRoomId+'/spectators/'+me.username)); }catch(e){} } });
